# Baked into the sandbox image at /etc/mise/config.toml. Tools are plain
# binaries in the image, so mise only runs tasks.
[settings]
# Each thread's checkout is a fresh clone, and mise exits 1 on an untrusted
# config. Trust grants nothing: the agent already runs commands there.
trusted_config_paths = ["/workspace"]
# A tool missing from disable_tools then fails at once instead of hanging on
# denied egress. mise still clones plugins over HTTPS with this set.
offline = true
# Stops mise resolving the root mise.toml's tools before each task. "*" is read
# as a tool name, so each is listed; apps/mate/test/sandboxes.test.ts keeps the
# lists in sync.
disable_tools = [
  "1password-cli",
  "age",
  "bat",
  "cilium-cli",
  "conftest",
  "d2",
  "delta",
  "eza",
  "flux2",
  "fzf",
  "gcloud",
  "github:tronbyt/pixlet",
  "go",
  "helm",
  "jq",
  "k9s",
  "kubectl",
  "kustomize",
  "opentofu",
  "powershell",
  "promtool",
  "rust",
  "shellcheck",
  "shfmt",
  "sops",
  "terraform",
  "terraform-docs",
  "vim",
  "yq",
]
