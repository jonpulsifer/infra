[env]
_.file = '.env'

[tools]
1password-cli = "latest"
age = "latest"
bat = "latest"
cilium-cli = "latest"
conftest = "latest"
delta = "latest"
eza = "latest"
flux2 = "latest"
fzf = "latest"
gcloud = "latest"
"github:tronbyt/pixlet" = "v0.54.0"
go = "latest"
helm = "latest"
jq = "latest"
k9s = "latest"
kubectl = "latest"
kustomize = "latest"
powershell = "latest"
promtool = "latest"
rust = "1.98.1"
shellcheck = "latest"
shfmt = "latest"
sops = "latest"
yq = "latest"
# Atlantis applies with OpenTofu; run tofu locally to match.
opentofu = "1.12.6"
terraform = "latest"
terraform-docs = "latest"
vim = "latest"
d2 = "0.9.0"

[tasks.devshell]
description = "Enter the Nix dev shell"
run = "nix develop"

[tasks.fmt]
description = "Format Nix + Terraform"
run = [
  "nix develop -c nix fmt",
  "tofu fmt -recursive",
]

[tasks."nix:fmt"]
description = "Format Nix files"
run = "nix develop -c nix fmt"

[tasks."tf:fmt"]
description = "Format Terraform files"
run = "tofu fmt -recursive"

[tasks."rust:test"]
description = "Differential tests for the FML derivation spec (apps/fml-derive-rs)"
# rustc needs a C linker; mise's rust has none, the nix dev shell does.
run = "nix develop -c cargo test --locked --manifest-path apps/fml-derive-rs/Cargo.toml"

[tasks."validation-impact:test"]
description = "Test validation-impact routing"
run = "bash .github/scripts/validation-impact_test.sh"

[tasks."cd-digest:test"]
description = "Test the continuous-delivery digest rewrite, its never-go-backwards guard, and the staleness read that reruns a dropped build"
run = [
  "bash .github/scripts/cd-digest-update_test.sh",
  "bash .github/scripts/cd-digest-step_test.sh",
  "bash .github/scripts/cd-stale-images_test.sh",
]

[tasks.alerts]
description = "Firing Alertmanager alerts on every cluster (optional substring filter)"
run = "bash scripts/alerts.sh"

[tasks."k8s:render-apps"]
description = "Render shared cluster app overlays and each cluster's monitoring overlay, then template referenced in-repo charts"
run = "bash .github/scripts/render-cluster-apps.sh"

[tasks."k8s:check-rules"]
description = "Lint every rendered PrometheusRule and run the alert unit tests"
run = "bash .github/scripts/check-prometheus-rules.sh"

[tasks."pbx:check"]
description = "Boot the PBX image's Asterisk against each site's rendered config with no route off the machine; check PJSIP, 911 routing and what a caller can reach (sites: folly offsite, default both)"
run = "bash .github/scripts/pbx-check.sh"

[tasks."pbx:test"]
description = "Test the PBX check's inbound dialplan walker against fixtures"
run = "bash .github/scripts/pbx-inbound-walk_test.sh"

[tasks."tf:init"]
description = "Initialize Terraform modules without backends"
run = [
  "bash -lc 'while IFS= read -r d; do echo \"==> tofu init -backend=false $d\"; tofu -chdir=\"$d\" init -backend=false -input=false; done < <(.github/scripts/validation-impact.sh terraform-roots)'",
]

[tasks."tf:validate"]
description = "Validate Terraform modules"
depends = ["tf:init"]
run = [
  "bash -lc 'while IFS= read -r d; do echo \"==> tofu validate $d\"; tofu -chdir=\"$d\" validate; done < <(.github/scripts/validation-impact.sh terraform-roots)'",
]

[tasks."tf:docs"]
description = "Regenerate terraform-docs READMEs (inject) for every module with TF_DOCS markers"
run = [
  "bash -lc 'grep -rl BEGIN_TF_DOCS . --include=README.md | xargs -r -n1 dirname | sort -u | while read -r d; do echo \"==> $d\"; terraform-docs markdown table --output-file README.md --output-mode inject \"$d\" >/dev/null; done'",
]

[tasks."nix:check"]
description = "Evaluate the whole flake (every host); slow"
run = "nix flake check"

[tasks."nix:build"]
description = "Build one host's system closure without deploying (set HOST)"
run = [
  "bash -lc 'if [ -z \"${HOST:-}\" ]; then echo \"Set HOST, e.g. HOST=optiplex mise run nix:build\"; exit 1; fi; nix build \".#nixosConfigurations.$HOST.config.system.build.toplevel\" --no-link --print-out-paths'",
]

[tasks."ts:check"]
description = "Typecheck and lint the Bun/Turborepo workspace"
run = [
  "bun run typecheck",
  "bun run lint",
]

[tasks."docs:build"]
description = "Build the wiki from docs/ with the first-party Bun renderer"
run = "bun run --cwd apps/wiki build"

[tasks."docs:diagrams"]
description = "Render every *.d2 to the *.svg committed beside it"
# Per-file render settings belong in the file's `d2-config` var. The SVGs are
# committed because the wiki and apps/spindrift builds use them and have no d2.
run = "bash -lc 'find . -name node_modules -prune -o -name .git -prune -o -name \"*.d2\" -print | while read -r f; do d2 --omit-version --no-xml-tag \"$f\" \"${f%.d2}.svg\"; done'"

[tasks."pki:verify"]
description = "Assert the committed FML PKI chain links, anchors on a self-signed root, and admits its own depth"
run = "go -C apps/fml-pki run . verify"

[tasks."pki:cutover"]
description = "Search every ordering of the root + intermediate re-birth for one that locks a cluster out"
run = "go -C apps/fml-ceremony test ./cutover/ -v"

[tasks."pki:crosscheck"]
description = "Differential-check the Go derivation against the independent Rust one, byte for byte"
# nix develop supplies the linker. The Go test skips unless FML_DERIVE_RS is set.
run = """
nix develop -c cargo build --release --locked --manifest-path apps/fml-derive-rs/Cargo.toml
FML_DERIVE_RS="$PWD/apps/fml-derive-rs/target/release/fml-derive" \
  go -C apps/fml-ceremony test ./derive/ -run TestDifferentialAgainstRust -v -count=1
"""

[tasks."pki:attest"]
description = "Check a ceremony transcript: canonical form, hash chain, share structure, certificate chain (set TRANSCRIPT)"
run = "go -C apps/fml-attest run . ${TRANSCRIPT:-../fml-ceremony/testdata/transcript.example.json}"

[tasks."docs:check"]
description = "Docs contract: renderer validation, referenced paths exist, no archaeology, references into the wiki resolve"
run = "bash .github/scripts/docs-contract.sh"

[tasks."tf:plan"]
description = "Run Terraform plan for one module (set TF_DIR)"
run = [
  "bash -lc 'if [ -z \"$TF_DIR\" ]; then echo \"Set TF_DIR, e.g. TF_DIR=unifi mise run tf:plan\"; exit 1; fi; tofu -chdir=\"$TF_DIR\" init -input=false && tofu -chdir=\"$TF_DIR\" plan'",
]

[tasks._scripts]
description = "List shell scripts in this repo"
hide = true
# A script outside these paths or without an sh/bash shebang is never checked,
# and nothing reports it.
run = """
grep -rlE '^#!(/usr/bin/env (ba)?sh|/bin/(ba)?sh)' dotfiles/.local/bin/* dotfiles/scripts/* scripts/* .github/scripts/* images/*/gh clusters/offsite/apps/elevenlabs/*.sh 2>/dev/null
"""

[tasks.format]
description = "Format shell scripts with shfmt"
run = """
mise run _scripts | xargs shfmt -w -i 2 -ci -bn
"""

[tasks."format:check"]
description = "Check shell script formatting (no writes)"
run = """
mise run _scripts | xargs shfmt -d -i 2 -ci -bn
"""

[tasks.lint]
description = "Lint shell scripts with shellcheck"
run = """
mise run _scripts | xargs shellcheck
"""

[tasks."lint:ps"]
description = "Lint PowerShell with PSScriptAnalyzer"
# pwsh aborts with "Couldn't find a valid ICU package" on NixOS. Linting needs
# no locale data.
env = { DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1" }
run = "pwsh -NoProfile -File dotfiles/windows/Invoke-Lint.ps1"

[tasks.check]
description = "Run format check and lint"
depends = ["format:check", "lint", "lint:ps"]

[tasks.deploy]
description = "Run dotfiles bootstrap deployment"
dir = "dotfiles"
run = "mise run bootstrap"
