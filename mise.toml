[env]
_.file = '.env'

[tools]
1password-cli = "latest"
age = "latest"
bat = "latest"
cilium-cli = "latest"
conftest = "latest"
delta = "latest"
eza = "latest"
flux2 = "latest"
fzf = "latest"
gcloud = "latest"
"github:tronbyt/pixlet" = "v0.55.0"
go = "latest"
# The Starlink dish speaks gRPC; net-health.sh reads its event log with it.
grpcurl = "latest"
helm = "latest"
jq = "latest"
k9s = "latest"
kubectl = "latest"
kustomize = "latest"
powershell = "latest"
promtool = "latest"
rclone = "latest"
rust = "1.99.1"
shellcheck = "latest"
shfmt = "latest"
sops = "latest"
# The client for the Talos roots; move it with their talos_version.
talosctl = "1.14.4"
yq = "latest"
# tally (apps/tally) is the first Python app: uv owns its env, lockfile and Python.
uv = "latest"
# Atlantis applies with OpenTofu; run tofu locally to match.
opentofu = "1.13.2"
terraform = "latest"
terraform-docs = "latest"
velero = "latest"
vim = "latest"
d2 = "0.9.0"
# The Lookout agent, apps/lookout. The SDK needs invariant globalization here: no ICU on NixOS.
dotnet = "10"

[tasks."claude:auto"]
description = "Start Claude in auto mode for this repository"
run = "claude --permission-mode auto"

[tasks.devshell]
description = "Enter the Nix dev shell"
run = "nix develop"

[tasks."tally:install"]
description = "Sync tally's Python env from uv.lock (apps/tally)"
dir = "apps/tally"
run = "uv sync --all-groups"

[tasks."tally:lint"]
description = "Lint and format-check tally with ruff (apps/tally)"
dir = "apps/tally"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."tally:fmt"]
description = "Format tally with ruff (apps/tally)"
dir = "apps/tally"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks."tally:typecheck"]
description = "Typecheck tally with mypy (apps/tally)"
dir = "apps/tally"
run = "uv run mypy"

[tasks."tally:test"]
description = "Lint, typecheck and test tally (apps/tally)"
dir = "apps/tally"
run = ["uv run ruff check .", "uv run ruff format --check .", "uv run mypy", "uv run pytest -q"]

[tasks."tally:dev"]
description = "Run the tally API with the synthetic ledger on :8081 (apps/tally)"
dir = "apps/tally"
run = "uv run tally serve --synthetic --port 8081"

[tasks."tally:load"]
description = "Load ~/finance into the live tally ledger, once, and show what disagrees (apps/tally)"
dir = "apps/tally"
run = "scripts/load.sh"

[tasks."tally:ocr"]
description = "Install tally's OCR extra and Docling's models locally, so tally:load reads scans (apps/tally)"
dir = "apps/tally"
run = "scripts/ocr-models.sh"

[tasks.kthx]
description = "Run the kthx CLI from this checkout"
# The root package does not depend on the CLI's workspace, so turbo leaves it
# out of every other image's pruned workspace.
dir = "{{cwd}}"
run = "bun {{config_root}}/apps/kthx/cli/main.ts"

[tasks.fmt]
description = "Format Nix + Terraform"
run = [
  "nix develop -c nix fmt",
  "tofu fmt -recursive",
]

[tasks."nix:fmt"]
description = "Format Nix files"
run = "nix develop -c nix fmt"

[tasks."tf:fmt"]
description = "Format Terraform files"
run = "tofu fmt -recursive"

[tasks."lookout:test"]
description = "Build the Lookout solution and run its Core tests (apps/lookout)"
dir = "apps/lookout"
env = { DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1", DOTNET_CLI_TELEMETRY_OPTOUT = "1", DOTNET_NOLOGO = "1" }
run = [
  "dotnet build",
  "dotnet test tests/Lookout.Core.Tests",
]

[tasks."rust:test"]
description = "Differential tests for the FML derivation spec (apps/fml-derive-rs)"
# rustc needs a C linker; mise's rust has none, the nix dev shell does.
run = "nix develop -c cargo test --locked --manifest-path apps/fml-derive-rs/Cargo.toml"

[tasks."validation-impact:test"]
description = "Test validation-impact routing"
run = "bash .github/scripts/validation-impact_test.sh"

[tasks."cd-digest:test"]
description = "Test the continuous-delivery digest rewrite, its never-go-backwards guard, the staleness read that reruns a dropped build, the build matrix and its lockfile check"
run = [
  "bash .github/scripts/cd-digest-update_test.sh",
  "bash .github/scripts/cd-digest-step_test.sh",
  "bash .github/scripts/cd-stale-images_test.sh",
  "bash .github/scripts/detect-containers_test.sh",
  "bash .github/scripts/digest-only_test.sh",
  "bash .github/scripts/image-affected_test.sh",
]

[tasks.alerts]
description = "Firing Alertmanager alerts on every cluster (optional substring filter)"
run = "bash scripts/alerts.sh"

[tasks.render-class-inputs]
description = "Write talos-enroll's per-class render inputs from the folly Talos root, with no state, and the inventory's MACs for spore's netboot links"
run = "bash scripts/render-class-inputs.sh"

[tasks."inventory:check"]
description = "Compare each folly node's NetBox device with what the node reports over the Talos API; exits 1 on drift"
run = "bash scripts/inventory.sh check"

[tasks."netbox:seed"]
description = "Import folly's site, device types, custom fields, nodes, anchors, switch, cables and prefixes from git into NetBox; a second run changes nothing"
run = "bash scripts/netbox-seed.sh"

[tasks."netbox:declare"]
description = "Declare a new planned Kubernetes node in NetBox, then render the export (args: <name> <serial> <mac> <switch port> <address> [--class C] [--bmc B] [--disk D] [--type T] [--ek-hash H]), or a stub for intake (args: --stub <name> --class C [--serial S] [--port N] [--address A])"
run = "bash scripts/netbox-declare.sh"

[tasks."netbox:export"]
description = "Write clusters/folly/inventory/machines.yaml from NetBox's active and staged kubernetes-node devices"
run = "bash scripts/netbox-export.sh"

[tasks."netbox:check"]
description = "Fail when clusters/folly/inventory/machines.yaml differs from NetBox's export"
run = "bash scripts/netbox-export.sh --check"

[tasks."inventory:observe"]
description = "Print a folly node's observed inventory entry (args: [--insecure] <address>)"
run = "bash scripts/inventory.sh observe"

[tasks."enroll:approve"]
description = "Approve the Talos enrollment whose code the machine's console shows, over the tailnet (args: <code> <node>)"
run = "bash scripts/enroll.sh approve"

[tasks."enroll:deny"]
description = "Deny a waiting Talos machine by its uuid over the tailnet (args: <uuid>)"
run = "bash scripts/enroll.sh deny"

[tasks."enroll:pending"]
description = "List the Talos enrollments that wait for approval or for their config fetch"
run = "bash scripts/enroll.sh pending"

[tasks."metal-dev:up"]
description = "Start the metal-dev VM in GCP, join it to the tailnet and give it the DNS-01 token (terraform/metal-dev)"
run = "bash scripts/metal-dev/up.sh"

[tasks."metal-dev:down"]
description = "Stop the metal-dev VM; its disk and virtual nodes stay"
run = "bash scripts/metal-dev/down.sh"

[tasks."metal-dev:seed"]
description = "Seed the metal-dev VM's own NetBox from git, with the URL pinned to the VM and its token; never the lab's NetBox"
run = "bash scripts/metal-dev/seed.sh"

[tasks."metal-dev:intake"]
description = "Create a virtual node on metal-dev, enroll the lab's Secure Boot keys, declare it in the host's NetBox and follow it to active (args: [name])"
run = "bash scripts/metal-dev/intake.sh"

[tasks."attest:approve"]
description = "Show the first intake that waits for a serial on the anchors' talos-attest, and approve its EK hashes once you confirm them, over the tailnet (args: <serial>)"
run = "bash scripts/attest.sh approve"

[tasks."attest:pending"]
description = "List the first intakes that wait for approval on each anchor's talos-attest"
run = "bash scripts/attest.sh pending"

[tasks."fleet:intake"]
description = "Open, close or show the intake window on every anchor's talos-attest, over ssh as the owner (args: open <duration> | close | status)"
run = "bash scripts/fleet-intake.sh"

[tasks."k8s:render-apps"]
description = "Render shared cluster app overlays and each cluster's monitoring overlay, then template referenced in-repo charts"
run = "bash .github/scripts/render-cluster-apps.sh"

[tasks."backup:coverage"]
description = "List how each PVC on a cluster is backed up and fail on an uncovered one (arg: [context], default folly)"
run = "bash scripts/backup-coverage.sh"

[tasks."k8s:check-rules"]
description = "Lint every rendered PrometheusRule and run the alert unit tests"
run = "bash .github/scripts/check-prometheus-rules.sh"

[tasks."mate:profile"]
description = "Copy mate's persona, owner AGENTS.md and skills from the dotfiles repo's main"
run = "bash scripts/mate-profile.sh sync"

[tasks."mate:profile:check"]
description = "Fail when apps/mate/profile differs from the dotfiles repo's main"
run = "bash scripts/mate-profile.sh check"

[tasks."pbx:check"]
description = "Boot the PBX image's Asterisk against each site's rendered config with no route off the machine; check PJSIP, 911 routing and what a caller can reach (sites: folly offsite, default both)"
run = "bash .github/scripts/pbx-check.sh"

[tasks."pbx:voices"]
description = "Render the folly PBX prompts in clusters/folly/apps/pbx/sounds/lines.yaml with ElevenLabs text-to-speech (args: --all or line ids; default: lines with no .ulaw)"
run = "bash .github/scripts/pbx-voices.sh"

[tasks."pbx:test"]
description = "Test the PBX check's inbound dialplan walker and ARI user reader against fixtures"
run = [
  "bash .github/scripts/pbx-inbound-walk_test.sh",
  "bash .github/scripts/pbx-ari-users_test.sh",
]

[tasks."elevenlabs:test"]
description = "Run the ElevenLabs reconciler against a stubbed API and check what it logs and sends"
run = "bash .github/scripts/elevenlabs-reconcile_test.sh"

[tasks."tf:init"]
description = "Initialize Terraform modules without backends"
run = [
  "bash -lc 'while IFS= read -r d; do echo \"==> tofu init -backend=false $d\"; tofu -chdir=\"$d\" init -backend=false -input=false; done < <(.github/scripts/validation-impact.sh terraform-roots)'",
]

[tasks."tf:validate"]
description = "Validate Terraform modules"
depends = ["tf:init"]
run = [
  "bash -lc 'while IFS= read -r d; do echo \"==> tofu validate $d\"; tofu -chdir=\"$d\" validate; done < <(.github/scripts/validation-impact.sh terraform-roots)'",
]

[tasks."tf:docs"]
description = "Regenerate terraform-docs READMEs (inject) for every module with TF_DOCS markers"
run = [
  "bash -lc 'grep -rl BEGIN_TF_DOCS . --include=README.md | xargs -r -n1 dirname | sort -u | while read -r d; do echo \"==> $d\"; terraform-docs markdown table --output-file README.md --output-mode inject \"$d\" >/dev/null; done'",
]

[tasks."nix:check"]
description = "Evaluate the whole flake (every host); slow"
run = "nix flake check"

[tasks."nix:build"]
description = "Build one host's system closure without deploying (set HOST)"
run = [
  "bash -lc 'if [ -z \"${HOST:-}\" ]; then echo \"Set HOST, e.g. HOST=forge mise run nix:build\"; exit 1; fi; nix build \".#nixosConfigurations.$HOST.config.system.build.toplevel\" --no-link --print-out-paths'",
]

[tasks."ts:check"]
description = "Typecheck and lint the Bun/Turborepo workspace"
run = [
  "bun run typecheck",
  "bun run lint",
]

[tasks."docs:build"]
description = "Build the wiki from docs/ with the first-party Bun renderer"
run = "bun run --cwd apps/wiki build"

[tasks."docs:diagrams"]
description = "Render every *.d2 to the *.svg committed beside it"
# Per-file render settings belong in the file's `d2-config` var. The SVGs are
# committed because the wiki and apps/kthx-engine builds use them and have no d2.
run = "bash -lc 'find . -name node_modules -prune -o -name .git -prune -o -name \"*.d2\" -print | while read -r f; do d2 --omit-version --no-xml-tag \"$f\" \"${f%.d2}.svg\"; done'"

[tasks."pki:verify"]
description = "Assert the committed FML PKI chain links, anchors on a self-signed root, and admits its own depth"
run = "go -C apps/fml-pki run . verify"

[tasks."pki:cutover"]
description = "Search every ordering of the root + intermediate re-birth for one that locks a cluster out"
run = "go -C apps/fml-ceremony test ./cutover/ -v"

[tasks."pki:crosscheck"]
description = "Differential-check the Go derivation against the independent Rust one, byte for byte"
# nix develop supplies the linker. The Go test skips unless FML_DERIVE_RS is set.
run = """
nix develop -c cargo build --release --locked --manifest-path apps/fml-derive-rs/Cargo.toml
FML_DERIVE_RS="$PWD/apps/fml-derive-rs/target/release/fml-derive" \
  go -C apps/fml-ceremony test ./derive/ -run TestDifferentialAgainstRust -v -count=1
"""

[tasks."pki:attest"]
description = "Check a ceremony transcript: canonical form, hash chain, share structure, certificate chain (set TRANSCRIPT)"
run = "go -C apps/fml-attest run . ${TRANSCRIPT:-../fml-ceremony/testdata/transcript.example.json}"

[tasks."devid:yubikey:init"]
description = "Make an anchor's YubiKey a DevID CA: new PIV secrets in SOPS and 1Password, an RSA-2048 key generated on the card, and its CSR in terraform/pki/csr (arg: <host>)"
run = "bash scripts/devid-ca-yubikey.sh init"

[tasks."devid:yubikey:install"]
description = "Write the DevID CA certificate that terraform/pki issued into the anchor's YubiKey and sign through ykcs11 (arg: <host>)"
run = "bash scripts/devid-ca-yubikey.sh install"

[tasks."devid:bundle"]
description = "Write terraform/pki/certs/folly-devid-ca.pem from every issuing DevID CA certificate beside it"
run = "bash scripts/devid-ca-yubikey.sh bundle"

[tasks."devid:test"]
description = "Test the DevID CA script's firmware policy, ykman parsing, secrets and bundle"
run = "bash scripts/devid-ca-yubikey_test.sh"

[tasks."docs:check"]
description = "Docs contract: renderer validation, referenced paths exist, no archaeology, references into the wiki resolve"
run = "bash .github/scripts/docs-contract.sh"

[tasks."tf:plan"]
description = "Run Terraform plan for one module (set TF_DIR)"
run = [
  "bash -lc 'if [ -z \"$TF_DIR\" ]; then echo \"Set TF_DIR, e.g. TF_DIR=unifi mise run tf:plan\"; exit 1; fi; tofu -chdir=\"$TF_DIR\" init -input=false && tofu -chdir=\"$TF_DIR\" plan'",
]

[tasks._scripts]
description = "List shell scripts in this repo"
hide = true
# A script outside these paths or without an sh/bash shebang is never checked,
# and nothing reports it.
run = """
grep -rlE '^#!(/usr/bin/env (ba)?sh|/bin/(ba)?sh)' scripts/* .github/scripts/* images/*/gh clusters/offsite/apps/elevenlabs/*.sh 2>/dev/null
"""

[tasks.format]
description = "Format shell scripts with shfmt"
run = """
mise run _scripts | xargs shfmt -w -i 2 -ci -bn
"""

[tasks."format:check"]
description = "Check shell script formatting (no writes)"
run = """
mise run _scripts | xargs shfmt -d -i 2 -ci -bn
"""

[tasks.lint]
description = "Lint shell scripts with shellcheck"
run = """
mise run _scripts | xargs shellcheck
"""

[tasks."lint:ps"]
description = "Lint PowerShell with PSScriptAnalyzer"
# pwsh aborts with "Couldn't find a valid ICU package" on NixOS. Linting needs
# no locale data.
env = { DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1" }
run = "pwsh -NoProfile -File apps/lookout/windows/Invoke-Lint.ps1"

[tasks.check]
description = "Run format check and lint"
depends = ["format:check", "lint", "lint:ps"]
