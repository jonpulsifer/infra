{{- if .Values.database.enabled }}
{{- include "app.backupPrefixes" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "app.databaseName" . }}
  namespace: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.instances }}
  {{- if .Values.backup.endpointURL }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        {{- with .Values.backup.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
  {{- end }}
  enableSuperuserAccess: false
  storage:
    storageClass: local-path
    size: {{ .Values.database.size }}
  bootstrap:
  {{- if .Values.backup.recoverFrom }}
    recovery:
      source: origin
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.name }}
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage
          serverName: {{ .Values.backup.recoverFrom | quote }}
  {{- else }}
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.name }}
      encoding: UTF8
      localeCollate: C
      localeCType: C
      dataChecksums: true
  {{- end }}
{{- end }}
