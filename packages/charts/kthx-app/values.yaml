# One App Component. The control plane writes `app.*`, the operator writes `platform.*`
# per Target, and either writes `shared.*`, with the control plane's value winning.
app:
  # Both are in selector labels, so a rename is a new release.
  name: ""
  component: ""

  # service | website | job. Only `job` renders differently: a CronJob, no Deployment.
  kind: service

  # Digest-pinned: the supply chain matches what was signed to what runs by digest.
  image: ""

  # The port this non-job Component listens on.
  port: 8080

  # False for a queue worker, which gets no Service and no route.
  expose: true

  # none | private | public. `private` publishes the gateway's RFC1918 address; `public`
  # publishes a proxied record at the Target's tunnel.
  reach: private

  # none | proxy: whether the Target's authenticating proxy fronts the route, at any reach.
  auth: proxy

  # Job only. Empty renders a suspended CronJob that only a manual run triggers.
  schedule: ""

  # On the pod template only, because selectors are immutable.
  deployId: ""

  # The running digest, so observe can report drift from the desired state.
  artifactDigest: ""

  # The canonical name first, then any vanity name.
  hostnames: []

  # Plain values only; secrets arrive as references in `secretEnv`.
  env: []
  # [{ name, secretName, remote: { key, version } }]. `name` is the variable and its key in
  # the Secret; `remote` pins a version in the store of record.
  secretEnv: []

  # Per attached Datastore: { name, secretName | remoteSecretName, secretKey }, or { name, value }
  # for an engine without auth. A `remoteSecretName` is mirrored in from another namespace.
  datastores: []

  # Entrypoint overrides. Empty means the image's own.
  command: []
  args: []

platform:
  # Sandbox runtime class.
  runtimeClassName: ""

  imagePullSecrets: []

  # The shared gateway routes attach to; this chart renders no Gateway or certificate.
  gateway:
    name: ""
    namespace: ""

  # The ExternalAuth backend for `auth: proxy`. Its Service and ReferenceGrant live outside this chart.
  externalAuth:
    name: ""
    namespace: ""
    port: 80

  # DNS targets: `privateAddress` (unproxied A) for private reach, `tunnelHostname` (proxied
  # CNAME) for public. Each is required only for its reach.
  dns:
    privateAddress: ""
    tunnelHostname: ""

  # The ClusterSecretStore config is fetched through. Config does not render without it.
  secretStore:
    kind: ClusterSecretStore
    name: ""

  # The store that mirrors a Datastore credential in, scoped to the Datastore namespace. Keep
  # it separate from `secretStore`, so the config store never reads database credentials.
  # Required only for a cross-namespace attachment.
  datastoreSecretStore:
    kind: ClusterSecretStore
    name: ""
    # Polls, because the datastore operator rotates the credential without a Deploy.
    refreshInterval: 1h

  networkPolicy:
    # Namespaces admitted besides the release's own; all other ingress is denied.
    allowedNamespaces: []

shared:
  # The operator's Target defaults, which the control plane overrides per Component.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  podAnnotations: {}
  podLabels: {}
