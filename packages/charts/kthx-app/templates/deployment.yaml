{{/*
A service and a website are one object: every difference between the two is a
value, so this template never asks which of them it is rendering.
*/}}
{{- if ne .Values.app.kind "job" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kthx-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kthx-app.labels" . | nindent 4 }}
  annotations:
    {{- include "kthx-app.contractAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kthx-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kthx-app.podLabels" . | nindent 8 }}
      annotations:
        {{- include "kthx-app.contractAnnotations" . | nindent 8 }}
        {{- with .Values.shared.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "kthx-app.podSpec" . | nindent 6 }}
{{- end }}
