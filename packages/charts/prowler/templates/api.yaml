{{/*
The ServiceAccount exists for its projected token. The workload identity pool maps
`offsite:system:serviceaccount:<namespace>:<name>`, so this name is bound in IAM.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prowler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prowler.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "prowler.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowler.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "prowler.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prowler.podLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- if .Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      serviceAccountName: {{ include "prowler.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "prowler.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: IfNotPresent
          command: ["/home/prowler/docker-entrypoint.sh"]
          args: ["prod"]
          env:
            {{- include "prowler.apiEnv" . | nindent 12 }}
            # Only gunicorn reads this, so it stays out of the env the worker and beat share.
            - name: DJANGO_WORKERS
              value: {{ .Values.api.workers | quote }}
          envFrom:
            - secretRef:
                name: {{ required "envFromSecret is required: it carries the Django signing, encryption and database secrets" .Values.envFromSecret }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          # `prod` migrates before gunicorn binds, so a start after a schema change takes minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders: [{name: Host, value: {{ include "prowler.fullname" . }}-api}]
            periodSeconds: 10
            failureThreshold: 60
          # Checks no dependency, so an outage of Postgres, Valkey or the graph never restarts the pod.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders: [{name: Host, value: {{ include "prowler.fullname" . }}-api}]
            periodSeconds: 20
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              # The default Host is the pod IP, which DJANGO_ALLOWED_HOSTS rejects with a 400.
              httpHeaders: [{name: Host, value: {{ include "prowler.fullname" . }}-api}]
            # /health/ready is throttled 60/min per client IP and the kubelet is one client, so
            # 20s is the floor.
            periodSeconds: 20
            failureThreshold: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "prowler.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "prowler.writableMounts" . | nindent 12 }}
            {{- include "prowler.gcpVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "prowler.writableVolumes" . | nindent 8 }}
        {{- include "prowler.gcpVolume" . | nindent 8 }}
