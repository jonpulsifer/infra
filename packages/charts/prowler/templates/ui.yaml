apiVersion: v1
kind: Service
metadata:
  name: {{ include "prowler.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "prowler.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowler.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "prowler.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prowler.podLabels" (dict "root" . "component" "ui") | nindent 8 }}
    spec:
      {{- if .Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        # The image's `nextjs` user, by uid: its Dockerfile names it, and `runAsNonRoot`
        # cannot verify a name.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ .Values.image.ui }}
          imagePullPolicy: IfNotPresent
          env:
            # The UI calls the API server-side only, so the in-cluster name works. The path is required.
            - name: UI_API_BASE_URL
              value: http://{{ include "prowler.fullname" . }}-api:{{ .Values.api.port }}/api/v1
            # NextAuth builds callback URLs from this public origin, scheme included. `AUTH_TRUST_HOST`
            # makes it honour the gateway's forwarded headers.
            - name: AUTH_URL
              value: https://{{ required "hostname is required: it is the origin NextAuth builds callback URLs from" .Values.hostname }}
            - name: AUTH_TRUST_HOST
              value: "true"
          envFrom:
            - secretRef:
                name: {{ required "envFromSecret is required: it carries AUTH_SECRET" .Values.envFromSecret }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            failureThreshold: 10
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            failureThreshold: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            {{- include "prowler.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Next's standalone server writes its fetch cache here; the root filesystem is read-only.
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
