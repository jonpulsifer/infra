{{/*
The Attack Paths graph store. The API reads its `NEO4J_*` settings at import with no
defaults and connects from every gunicorn worker, so it cannot run without one.
*/}}
{{- if .Values.neo4j.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prowler.neo4jName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
spec:
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
      protocol: TCP
  selector:
    {{- include "prowler.selectorLabels" (dict "root" . "component" "neo4j") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "prowler.neo4jName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "prowler.neo4jName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "prowler.selectorLabels" (dict "root" . "component" "neo4j") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prowler.podLabels" (dict "root" . "component" "neo4j") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neo4j
          image: {{ .Values.image.neo4j }}
          imagePullPolicy: IfNotPresent
          env:
            # `neo4j/<password>`, with the same password the API reads as NEO4J_PASSWORD.
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ required "envFromSecret is required: it carries NEO4J_AUTH" .Values.envFromSecret }}
                  key: NEO4J_AUTH
            - name: NEO4J_server_default__listen__address
              value: 0.0.0.0
          ports:
            - name: bolt
              containerPort: 7687
              protocol: TCP
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.neo4j.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.neo4j.size }}
{{- end }}
