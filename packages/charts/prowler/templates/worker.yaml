{{/*
The Celery worker and beat scheduler: the API's image and env with another entrypoint
argument. The worker runs the scans, so it mounts the GCP federation too.
*/}}
{{- range $component, $spec := dict "worker" $.Values.worker "beat" $.Values.beat }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prowler.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "prowler.labels" $ | nindent 4 }}
spec:
  {{- if eq $component "beat" }}
  # A second scheduler would fire every periodic task twice.
  replicas: 1
  {{- else }}
  replicas: {{ $spec.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "prowler.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prowler.podLabels" (dict "root" $ "component" $component) | nindent 8 }}
    spec:
      {{- if $.Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      serviceAccountName: {{ include "prowler.fullname" $ }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "prowler.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ $.Values.image.api }}
          imagePullPolicy: IfNotPresent
          command: ["/home/prowler/docker-entrypoint.sh"]
          args: [{{ $component | quote }}]
          env:
            {{- include "prowler.apiEnv" $ | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ required "envFromSecret is required: it carries the Django signing, encryption and database secrets" $.Values.envFromSecret }}
          resources:
            {{- toYaml $spec.resources | nindent 12 }}
          securityContext:
            {{- include "prowler.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            {{- include "prowler.writableMounts" $ | nindent 12 }}
            {{- include "prowler.gcpVolumeMounts" $ | nindent 12 }}
      volumes:
        {{- include "prowler.writableVolumes" $ | nindent 8 }}
        {{- include "prowler.gcpVolume" $ | nindent 8 }}
{{- end }}
