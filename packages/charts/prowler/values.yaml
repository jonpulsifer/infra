# The API, the Celery worker and beat share one image with different entrypoint
# arguments; the UI has its own.
image:
  api: prowlercloud/prowler-api:5.39.0
  ui: prowlercloud/prowler-ui:5.39.0
  # DozerDB: Attack Paths runs `CREATE DATABASE` per tenant, which Neo4j Community Edition lacks.
  neo4j: graphstack/dozerdb:5.26.27.0

# gVisor adds syscall latency to every Postgres and Neo4j query.
sandbox: false

hostname: ""

ingress:
  enabled: true
  gateway:
    name: cluster-gateway
    namespace: default

api:
  replicas: 1
  port: 8080
  # Unset, gunicorn starts `cpu_count() * 2 + 1` workers, each loading the full SDK,
  # which overruns the 2Gi limit.
  workers: 2
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 2Gi, cpu: "2"}

worker:
  replicas: 1
  # Unset, Celery starts a child per visible CPU, each loading the full SDK, and OOMKills the pod.
  concurrency: 2
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 4Gi, cpu: "2"}

beat:
  resources:
    requests: {memory: 256Mi, cpu: 50m}
    limits: {memory: 512Mi, cpu: 500m}

ui:
  replicas: 1
  port: 3000
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits: {memory: 1Gi, cpu: "1"}

database:
  instances: 1
  size: 20Gi
  name: prowler
  # The API's role for tenant-scoped tables, created by the first migration. It must
  # differ from `name`, the owner role CNPG bootstraps.
  user: prowler_api
  # Empty uses the cluster's default storage class.
  storageClass: ""

valkey:
  # A plain Valkey; `templates/valkey.yaml` says why the cluster operator cannot serve Celery.
  image: valkey/valkey:9.1.2
  size: 1Gi
  storageClass: ""
  resources:
    requests: {memory: 64Mi, cpu: 25m}
    limits: {memory: 512Mi, cpu: 500m}

neo4j:
  # The API reads `NEO4J_*` at import with no defaults, so disabling this stops it starting.
  enabled: true
  size: 10Gi
  storageClass: ""
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 2Gi, cpu: "1"}

# Keyless GCP through a projected token and an ADC `external_account` document. The
# organization policy forbids service-account keys.
gcp:
  audience: ""
  impersonationUrl: ""
  tokenMountPath: /var/run/secrets/gcp
  expirationSeconds: 3600

# Required. DJANGO_SECRETS_ENCRYPTION_KEY is the only key to the stored cloud credentials,
# and a chart-generated one would rotate on every upgrade.
envFromSecret: ""
