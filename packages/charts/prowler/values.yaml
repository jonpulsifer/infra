# The API, the Celery worker and the Celery beat scheduler are one image with
# three entrypoint arguments; the UI is its own. Both are digest-pinned by the
# installation, not by this chart — `renovate` moves the digest on the
# HelmRelease the same way it does for every other first-party workload.
image:
  api: prowlercloud/prowler-api:5.39.0
  ui: prowlercloud/prowler-ui:5.39.0
  # DozerDB, not stock Neo4j. Attack Paths issues `CREATE DATABASE` per tenant,
  # which Neo4j Community Edition does not implement — upstream's own chart
  # pins `edition: community` and cannot run the feature it ships.
  neo4j: graphstack/dozerdb:5.26.27.0

# gVisor costs syscall latency the API's Postgres and Neo4j drivers pay on every
# query, and buys little for images this size. `hub` on this cluster opts out
# for the same reason.
sandbox: false

hostname: ""

ingress:
  enabled: true
  gateway:
    name: cluster-gateway
    namespace: default

api:
  replicas: 1
  port: 8080
  # Gunicorn sizes its pool `cpu_count() * 2 + 1` when this is unset, and every
  # worker loads the full Prowler SDK and warms a compliance cache for sixteen
  # providers — 9 of them on a 4-core node, 17 on an 8-core one, against a 2Gi
  # limit. This is the same trap as `worker.concurrency` below, on the other
  # pool.
  workers: 2
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 2Gi, cpu: "2"}

worker:
  replicas: 1
  # Celery sizes its prefork pool from visible CPUs when this is unset, and each
  # child loads the whole Prowler SDK — one child per core OOMKills the pod.
  concurrency: 2
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 4Gi, cpu: "2"}

beat:
  resources:
    requests: {memory: 256Mi, cpu: 50m}
    limits: {memory: 512Mi, cpu: 500m}

ui:
  replicas: 1
  port: 3000
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits: {memory: 1Gi, cpu: "1"}

database:
  instances: 1
  size: 20Gi
  name: prowler
  # The role the API connects as for tenant-scoped tables. The first migration
  # creates it with the admin role, so it is a name plus a password here, not a
  # CNPG-managed role — and it must differ from `name`, which is both the
  # database and the owner role CNPG bootstraps.
  user: prowler_api
  # storageClass unset: offsite has exactly one class (`local-path`) and it is
  # the default, so naming it here would put an installation fact in the chart.
  storageClass: ""

valkey:
  # The same build the cluster operator runs, just not clustered — see the
  # comment on the StatefulSet for why the operator cannot serve Celery.
  image: valkey/valkey:9.0.0
  size: 1Gi
  storageClass: ""
  resources:
    requests: {memory: 64Mi, cpu: 25m}
    limits: {memory: 512Mi, cpu: 500m}

neo4j:
  # Attack Paths cannot be switched off — `NEO4J_*` are read at Django settings
  # import with no defaults, and /health/ready fails without a reachable graph.
  # Disabling this leaves the four variables pointed at a host that is not
  # there, so set `readinessProbe` accordingly if you ever do.
  enabled: true
  size: 10Gi
  storageClass: ""
  resources:
    requests: {memory: 1Gi, cpu: 250m}
    limits: {memory: 2Gi, cpu: "1"}

# Keyless GCP. The pod projects a ServiceAccount token for the cluster's own
# OIDC issuer and mounts an ordinary ADC `external_account` document beside it;
# Google exchanges the token at STS and impersonates the target service account.
# No service-account key exists, which is what the org policy requires.
gcp:
  audience: ""
  impersonationUrl: ""
  tokenMountPath: /var/run/secrets/gcp
  expirationSeconds: 3600

# Every value here is required and none of them may be generated by the chart:
# DJANGO_SECRETS_ENCRYPTION_KEY is the only key for stored cloud credentials, and
# a chart that minted it would rotate it on every `helm upgrade`.
envFromSecret: ""
