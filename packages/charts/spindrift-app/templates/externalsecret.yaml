{{/*
The one object that turns pinned references into a running process's
environment: one store per Target, per-key, pinned, delivered by the platform's
own secret operator.

Spindrift writes values into the store of record and renders *references* here.
Nothing in this release carries a value, so a `helm get values` on a Component
shows its whole configuration and discloses none of it.

**One Secret, one key per variable.** One secret per variable, not a blob, is a
rule about the store of record — a blob has no cloud-runtime equivalent — not
about how many Kubernetes objects the values land in. The container reads
`secretKeyRef`s out of this one Secret, each fetched from its own pinned item.

**`refreshInterval: 0` because the references are pinned.** A config change
produces a new Deploy, which re-renders this object; polling would re-fetch the
exact version it fetched last time.

**A store whose provider addresses a version some other way is a gap.**
`remoteRef.key` plus `remoteRef.version` is the pinned pair the store contract
mints and what a Secret Manager provider takes. A store that pins by minting an
immutable item per version has to mint a `key` unique per version for this to
address it, and 1Password Connect's item id is not its title — closing that is
the store adapter's work, not the chart's.
*/}}
{{- if .Values.app.secretEnv }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spindrift-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: {{ .Values.platform.secretStore.kind }}
    # Required rather than defaulted: a wrong store name fails visibly here,
    # while an empty one would render an ExternalSecret that never syncs and a
    # workload that waits forever for a Secret nobody is creating.
    name: {{ required "platform.secretStore.name is unset, so this Target cannot deliver config" .Values.platform.secretStore.name }}
  target:
    name: {{ include "spindrift-app.fullname" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.app.secretEnv }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .remote.key | quote }}
        version: {{ .remote.version | quote }}
    {{- end }}
{{- end }}
{{- $crossing := list }}
{{- range .Values.app.datastores }}
  {{- if .remoteSecretName }}
    {{- $crossing = append $crossing . }}
  {{- end }}
{{- end }}
{{- if $crossing }}
{{- if .Values.app.secretEnv }}
---
{{- end }}
{{/*
The attached Datastores whose credential is in another namespace.

A Datastore lives in a namespace of its own, because it outlives every App
attached to it (§11) — and a `secretKeyRef` cannot cross a namespace. This is
the hop that gets the operator's credential to the App's pods without Spindrift
ever reading it.

**Still not a copy Spindrift holds.** §11's rule is "never a copy — the operator
owns that secret's rotation", and that survives: ESO reconciles this object
continuously against the operator's own Secret, so a rotation CloudNativePG
performs reaches the next pod on ESO's interval with no Deploy. What changed is
the delivery, not the ownership — the value is still the operator's, and still
never passes through Spindrift.

**`refreshInterval` is not "0" here**, which is the one place this differs from
the pinned-config object above. That one is pinned per version and re-rendered
by a new Deploy, so polling would re-fetch what it already has. This one tracks
a value that changes underneath it without any Deploy at all, which is the whole
point, so it has to poll.

**A different store from the config one.** `datastoreSecretStore` is scoped to
the namespace Datastores are provisioned into; the config store addresses the
store of record. Pointing one at the other would either fail to find the Secret
or widen a store that reads config into one that reads databases.

`dataFrom` rather than `data`: the operator's Secret carries the keys the
operator chose, and naming them here would be this chart learning one engine's
Secret layout. The container reads the one key it was told by
`app.datastores[].secretKey`.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spindrift-app.fullname" . }}-datastores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.datastoreSecretStore.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.platform.datastoreSecretStore.kind }}
    name: {{ required "platform.datastoreSecretStore.name is unset, so an attached Datastore's credential cannot cross into this namespace" .Values.platform.datastoreSecretStore.name }}
  target:
    name: {{ include "spindrift-app.fullname" . }}-datastores
    creationPolicy: Owner
  dataFrom:
    {{- range $crossing }}
    - extract:
        key: {{ .remoteSecretName | quote }}
    {{- end }}
{{- end }}
