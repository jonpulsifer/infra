{{/*
Config as pinned references, one Secret key per variable. The release holds
references only, so `helm get values` discloses no value.
*/}}
{{- if .Values.app.secretEnv }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spindrift-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
spec:
  # Each reference pins a version, so there is nothing to poll for.
  refreshInterval: "0"
  secretStoreRef:
    kind: {{ .Values.platform.secretStore.kind }}
    # Required: an empty name renders an ExternalSecret that never syncs.
    name: {{ required "platform.secretStore.name is unset, so this Target cannot deliver config" .Values.platform.secretStore.name }}
  target:
    name: {{ include "spindrift-app.fullname" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.app.secretEnv }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .remote.key | quote }}
        version: {{ .remote.version | quote }}
    {{- end }}
{{- end }}
{{- $crossing := list }}
{{- range .Values.app.datastores }}
  {{- if .remoteSecretName }}
    {{- $crossing = append $crossing . }}
  {{- end }}
{{- end }}
{{- if $crossing }}
{{- if .Values.app.secretEnv }}
---
{{- end }}
{{/*
Mirrors attached Datastore credentials from the Datastore namespace, which a
`secretKeyRef` cannot cross. ESO polls, so the operator's rotations arrive without a Deploy.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spindrift-app.fullname" . }}-datastores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.platform.datastoreSecretStore.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.platform.datastoreSecretStore.kind }}
    name: {{ required "platform.datastoreSecretStore.name is unset, so an attached Datastore's credential cannot cross into this namespace" .Values.platform.datastoreSecretStore.name }}
  target:
    name: {{ include "spindrift-app.fullname" . }}-datastores
    creationPolicy: Owner
  # The whole Secret, so the chart need not know an engine's key layout.
  dataFrom:
    {{- range $crossing }}
    - extract:
        key: {{ .remoteSecretName | quote }}
    {{- end }}
{{- end }}
