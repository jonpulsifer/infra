{{/*
Default-deny ingress for every Component, so only the release's own namespace and the
Target's named namespaces can bypass what fronts its route.
Egress filtering needs an FQDN allowlist, which a portable NetworkPolicy cannot express.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spindrift-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spindrift-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same-namespace pods; the rest are the Target's named namespaces.
        - podSelector: {}
        {{- range .Values.platform.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
{{- if include "spindrift-app.serving" . }}
      ports:
        - port: {{ include "spindrift-app.port" . }}
          protocol: TCP
{{- end }}
{{- if and (include "spindrift-app.serving" .) (ne .Values.app.reach "none") }}
---
{{/*
Admits Cilium's host-networked gateway Envoy, whose `ingress` identity no selector
matches; without it a routed Component answers 503.
ponytail: `fromEntities` is Cilium-only; make it a Target capability for non-Cilium Targets.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "spindrift-app.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "spindrift-app.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ include "spindrift-app.port" . | quote }}
              protocol: TCP
{{- end }}
