{{/*
The route onto the shared gateway's **existing HTTP listener**.

Not a Gateway, not a certificate, not a cross-namespace grant: all three are
vessel resources, kept out of the release so a `destroy()` cannot take the
gateway with it. Private routes delegate authentication to the vessel's shared
proxy; public routes have no authentication filter.

An `internal` Component has no route at all — it is Target-private and
authenticated at the workload boundary, and a route onto the shared gateway
would be exactly the alternate origin that state may not leave open.
*/}}
{{- if and (include "spindrift-app.serving" .) (ne .Values.app.exposure "internal") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "spindrift-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
    # The wildcard tunnel owns DNS for generated App names. Publishing the
    # Gateway load-balancer address here would create a bypassable origin.
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: {{ .Values.platform.gateway.name }}
      namespace: {{ .Values.platform.gateway.namespace }}
  hostnames:
    {{- range .Values.app.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    -
      {{- if eq .Values.app.exposure "private" }}
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: {{ .Values.platform.externalAuth.name }}
              namespace: {{ .Values.platform.externalAuth.namespace }}
              port: {{ .Values.platform.externalAuth.port }}
            http:
              allowedHeaders:
                - authorization
                - cookie
                - x-forwarded-host
                - x-forwarded-proto
                - x-forwarded-uri
              allowedResponseHeaders:
                - set-cookie
                - x-auth-request-email
                - x-auth-request-user
      {{- end }}
      backendRefs:
        - name: {{ include "spindrift-app.fullname" . }}
          port: {{ include "spindrift-app.port" . }}
{{- end }}
