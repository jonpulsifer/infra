{{/*
The route onto the shared gateway's **existing listeners**.

Not a Gateway, not a certificate, not a cross-namespace grant: all three are
vessel resources, kept out of the release so a `destroy()` cannot take the
gateway with it. The wildcard TLS listener the vessel carries is what lets a
flat App name be served without this chart owning a certificate.

Two independent facts render here. `app.reach` decides whether a route exists at
all; `app.auth` decides whether an ExternalAuth filter sits on that route. A
Component with `reach: none` has no route — it is a workload boundary, and a
route onto the shared gateway would be exactly the alternate origin it asked not
to have.

**Which record gets published is not decided here**, and this route is held out
of DNS entirely. `templates/dnsendpoint.yaml` carries that decision and explains
why it cannot live on a route. What matters here is that only one of them
publishes: external-dns's `gateway-httproute` source would otherwise emit its
own endpoint for these same hostnames, targeting the parent Gateway's status
address — the same name claimed twice, at two record types, by two sources.

**`allowedHeaders` permits, it does not create.** The three it names are what
oauth2-proxy is shown of the original request, on top of the `Host`, method and
path Envoy's ext_authz client includes on its own. Only `x-forwarded-proto` is
real: Cilium's gateway sets it and overwrites whatever the client sent. Nothing
sets `x-forwarded-host` or `x-forwarded-uri`, so listing them permitted a header
no hop was producing — and left the **client** free to produce it, choosing its
own post-sign-in destination inside the zone. They are not listed for that
reason.

Adding them back does not buy the return trip either, and that is the part worth
knowing before trying. oauth2-proxy treats a request as forwarded only when
`req.Host != GetRequestHost(req)` — the `Host` Envoy already forwards against the
`x-forwarded-host` it does not — so a header set to this Component's own hostname
is equal to the one beside it and changes nothing. Measured, not reasoned:
`x-forwarded-host` equal to the real host yields a host-relative target every
time. The header that would work is `x-auth-request-redirect`, built from
`:authority` and injected by the filter itself, and `ExternalAuth` has no field
that injects anything.

The hold-out is `…/controller`, which the source honours per object: it skips
any route whose value is not `dns-controller` (`source/annotations`,
`IsControllerMismatch`). It is a real annotation, unlike the `…/exclude` this
template once carried, and it is scoped to the routes this chart renders — no
cluster-wide source filter, so nothing else in the zone changes shape. The value
only has to differ from `dns-controller`; it names the lab domain and the object
that publishes instead, so a `kubectl get -o yaml` says where the record went.
The bypass concern the old comment named lives in the NetworkPolicy, which
covers every Component whatever its reach.
*/}}
{{- if and (include "spindrift-app.serving" .) (ne .Values.app.reach "none") }}
{{- if not .Values.platform.gateway.name }}
{{- fail "platform.gateway.name is required for a Component whose reach is not none: a route with no gateway attaches to nothing" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "spindrift-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
    external-dns.alpha.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
spec:
  parentRefs:
    - name: {{ .Values.platform.gateway.name }}
      namespace: {{ .Values.platform.gateway.namespace }}
  hostnames:
    {{- range .Values.app.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    -
      {{- if eq .Values.app.auth "proxy" }}
      {{- if not .Values.platform.externalAuth.name }}
      {{- fail "platform.externalAuth.name is required for auth: proxy" }}
      {{- end }}
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: {{ .Values.platform.externalAuth.name }}
              namespace: {{ .Values.platform.externalAuth.namespace }}
              port: {{ .Values.platform.externalAuth.port }}
            http:
              allowedHeaders:
                - authorization
                - cookie
                - x-forwarded-proto
              allowedResponseHeaders:
                - set-cookie
                - x-auth-request-email
                - x-auth-request-user
      {{- end }}
      backendRefs:
        - name: {{ include "spindrift-app.fullname" . }}
          port: {{ include "spindrift-app.port" . }}
{{- end }}
