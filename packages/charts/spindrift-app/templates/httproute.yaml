{{/*
The route onto the shared gateway's **existing listeners**.

Not a Gateway, not a certificate, not a cross-namespace grant: all three are
vessel resources, kept out of the release so a `destroy()` cannot take the
gateway with it. The wildcard TLS listener the vessel carries is what lets a
flat App name be served without this chart owning a certificate.

Two independent facts render here. `app.reach` decides whether a route exists at
all; `app.auth` decides whether an ExternalAuth filter sits on that route. A
Component with `reach: none` has no route — it is a workload boundary, and a
route onto the shared gateway would be exactly the alternate origin it asked not
to have.

**Which record gets published is not decided here**, and this route is held out
of DNS entirely. `templates/dnsendpoint.yaml` carries that decision and explains
why it cannot live on a route. What matters here is that only one of them
publishes: external-dns's `gateway-httproute` source would otherwise emit its
own endpoint for these same hostnames, targeting the parent Gateway's status
address — the same name claimed twice, at two record types, by two sources.

**`allowedHeaders` permits, it does not create.** `cookie` is the only header it
names, on top of the `Host`, method and path Envoy's ext_authz client includes
on its own: the session is the whole of what the check reads. `authorization` is
unlisted because no provider this deployment configures reads it, with neither
an htpasswd file nor bearer-token skipping in play.

**No `x-forwarded-*` header is listed, and this list is the only thing that
keeps the family out of the check.** It holds whichever backend
`platform.externalAuth` names, because it is this filter that decides what
crosses, not the backend — the same list guards a check that lands on
oauth2-proxy's own port and one that goes through the ext_authz shim beside it.
Cilium's Envoy does compose two of them on the request itself, setting
`x-forwarded-proto` over whatever the client sent and appending to
`x-forwarded-for`; forwarding either buys the check nothing. oauth2-proxy has
its own gate — every `x-forwarded-*` read goes through
`CanTrustForwardedHeaders`, which returns false on `!s.ReverseProxy` before it
looks at an address, because
`clusters/base/apps/oauth2-proxy/helm-release.yaml` sets no `reverse-proxy` —
but that is one gate, in a file this chart does not own, one flag from opening.
The omission here is the half that does not move.

All three were measured against a replica that did trust its caller, and the
result is why none of them is listed. `x-forwarded-host` is the dangerous one
rather than the inert one: `IsForwardedRequest` fires on
`req.Host != GetRequestHost(req)`, so a value naming *another* host in the zone
— not this Component's own, which is the one value an attacker has no use for —
makes `getXForwardedHeadersRedirect` compose where the sign-in returns to, and
`whitelist-domain` accepts any sibling in the zone. `x-forwarded-uri` picks the
path on that origin, read straight through `GetRequestURI` with no such
comparison. `x-forwarded-proto` is what makes the pair a *valid* absolute URL:
`GetRequestProto` otherwise answers `req.URL.Scheme`, empty on a server request,
and the resulting `://host/path` fails `validateRedirect` and falls back to the
bare path. Forged host and proto together returned an absolute
`https://<sibling>/…` as the sign-in state; host alone stayed a bare path.
`?rd=` needs no `allowedHeaders` entry at all and stays open.

`x-auth-request-redirect` is the header oauth2-proxy honours without any trust
gate, and its absence here is load-bearing rather than incidental: a browser
that sets one would otherwise choose where the sign-in returns to. The value the
flow uses is composed inside the auth pod instead, by the shim
`platform.externalAuth` points at
(`clusters/base/apps/oauth2-proxy/helm-release.yaml`), whose `proxy_set_header`
replaces any inbound copy. Both halves are pinned in `tests/render.test.ts`.

The hold-out is `…/controller`, which the source honours per object: it skips
any route whose value is not `dns-controller` (`source/annotations`,
`IsControllerMismatch`). It is a real annotation, unlike the `…/exclude` this
template once carried, and it is scoped to the routes this chart renders — no
cluster-wide source filter, so nothing else in the zone changes shape. The value
only has to differ from `dns-controller`; it names the lab domain and the object
that publishes instead, so a `kubectl get -o yaml` says where the record went.
The bypass concern the old comment named lives in the NetworkPolicy, which
covers every Component whatever its reach.
*/}}
{{- if and (include "spindrift-app.serving" .) (ne .Values.app.reach "none") }}
{{- if not .Values.platform.gateway.name }}
{{- fail "platform.gateway.name is required for a Component whose reach is not none: a route with no gateway attaches to nothing" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "spindrift-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
    external-dns.alpha.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
spec:
  parentRefs:
    - name: {{ .Values.platform.gateway.name }}
      namespace: {{ .Values.platform.gateway.namespace }}
  hostnames:
    {{- range .Values.app.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    -
      {{- if eq .Values.app.auth "proxy" }}
      {{- if not .Values.platform.externalAuth.name }}
      {{- fail "platform.externalAuth.name is required for auth: proxy" }}
      {{- end }}
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: {{ .Values.platform.externalAuth.name }}
              namespace: {{ .Values.platform.externalAuth.namespace }}
              port: {{ .Values.platform.externalAuth.port }}
            http:
              allowedHeaders:
                - cookie
              allowedResponseHeaders:
                - set-cookie
                - x-auth-request-email
                - x-auth-request-user
      {{- end }}
      backendRefs:
        - name: {{ include "spindrift-app.fullname" . }}
          port: {{ include "spindrift-app.port" . }}
{{- end }}
