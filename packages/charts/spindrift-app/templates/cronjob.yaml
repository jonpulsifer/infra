{{/*
A job renders a CronJob, suspended when unscheduled. A Job's template is immutable,
and a CronJob keeps its run history across upgrades.
*/}}
{{- if eq .Values.app.kind "job" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "spindrift-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spindrift-app.labels" . | nindent 4 }}
  annotations:
    {{- include "spindrift-app.contractAnnotations" . | nindent 4 }}
spec:
  # The CronJob exists even unscheduled, so a manual run has something to trigger.
  suspend: {{ not .Values.app.schedule }}
  # 31 February never occurs, so an unscheduled job cannot fire even if un-suspended.
  schedule: {{ default "0 0 31 2 *" .Values.app.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    metadata:
      labels:
        {{- include "spindrift-app.labels" . | nindent 8 }}
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "spindrift-app.podLabels" . | nindent 12 }}
          annotations:
            {{- include "spindrift-app.contractAnnotations" . | nindent 12 }}
            {{- with .Values.shared.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: Never
          {{- include "spindrift-app.podSpec" . | nindent 10 }}
{{- end }}
