apiVersion: v2
name: spindrift-app
description: The one chart every Component Spindrift deploys to a Kubernetes Target renders through
type: application
version: 0.5.0
appVersion: "1"
annotations:
  # Read when a Target is pinned. Helm ignores unknown values silently, so a contract
  # mismatch fails the Target's prerequisites.
  spindrift.dev/values-contract: "5"
