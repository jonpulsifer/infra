# The installation's HelmRelease pins the digest; the containers workflow updates it.
image: ""
port: 8080

# The apex host; each site is `<name>.<zone>`.
zone: kthx.dev

# The depot for release archives, uploads and the nightly dump, owned by
# `terraform/gcp/projects/bluenose`.
bucket: ""

# Peers whose `cf-connecting-ip` is believed. Empty makes the whole zone one rate-limit
# key. The gateway Envoy is host-networked, so the peer is usually a node address.
trustedProxies: ""

# The tailnet host whose `tailscale-user-login` header is believed. Empty renders no
# Ingress, no NetworkPolicy clause and no identity host.
identity:
  host: ""
  # The proxy's tailnet tag, which the policy grant names. `tag:k8s` would cover every
  # proxy the operator runs.
  tag: tag:kthx-ingress
  # CIDRs of the identity proxy, which has an ordinary pod address. The NetworkPolicy
  # admits only that proxy and this namespace's own pods.
  proxies: ""
  # The identity header; empty means `tailscale-user-login`.
  header: ""
  # Comma-separated logins allowed `DELETE /api/sites`. Empty makes the route answer 404.
  admins: ""

# The AI passthrough. Its key arrives through `envFromSecret`, because chart values are public.
ai:
  # The subscription base refuses any call without an `x-opencode-session` header.
  url: https://opencode.ai/zen/go/v1
  # The default: at the 4096-token ceiling it answers without spending tokens on reasoning.
  model: mimo-v2.5-pro
  # Comma-separated allow-list; empty allows every upstream model, and any other model
  # is 400 INVALID_MODEL. minimax-m3 writes its reasoning into `content` as a <think> block.
  models: mimo-v2.5-pro,kimi-k2.7-code,qwen3.7-plus,minimax-m2.5,deepseek-v4.1-flash,minimax-m3
  # The per-call ceiling for anonymous visitors on every site in the zone.
  maxTokens: 4096
  # Writes a whole page for `POST /api/build`. Both build models must be in `models`,
  # or the server refuses to boot.
  buildModel: kimi-k2.7-code
  # Tried when the build model fails before it starts writing. Empty means no second attempt.
  buildFallbackModel: qwen3.7-plus
  # A page is 3,000 to 14,000 completion tokens after reasoning. The builder is only
  # open to tailnet logins with a daily budget.
  buildMaxTokens: 16000

# The Secret with `KTHX_ME_KEY`, `KTHX_PG_KEY` and `KTHX_AI_KEY`, from the installation's
# ExternalSecret. A key the chart generated would rotate on every upgrade.
envFromSecret: ""

# The node holding both local-path volumes; the server and Postgres pin to it. Empty
# suits only `helm template`.
node: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

sites:
  # A cache of the depot: a release with no directory is refetched.
  size: 50Gi
  mountPath: /sites
  # Empty uses the cluster's default storage class.
  storageClass: ""

database:
  size: 20Gi
  storageClass: ""
  # The control database and its owner role, which creates every site database.
  name: kthx
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}
  parameters:
    # 64 site pools of 2 connections, the control pool, the dump and the operator's
    # probes, with headroom.
    max_connections: "300"
    shared_buffers: 256MB
  backup:
    schedule: "23 4 * * *"
    # Keep this major equal to the server's, which the CNPG operator's default image sets,
    # or `pg_dumpall` refuses the server with a version mismatch.
    image: ghcr.io/cloudnative-pg/postgresql:18
    uploaderImage: gcr.io/google.com/cloudsdktool/google-cloud-cli:582.0.0-slim
    # Caps the dump's emptyDir, which shares the node's disk with both PVCs.
    scratchSize: 10Gi

podAnnotations: {}

# WAL archive and a daily base backup to Garage through the CNPG barman-cloud plugin.
backup:
  # Empty endpointURL renders no backup objects.
  endpointURL: ""
  bucket: cnpg
  # 6-field, seconds first, in UTC: 01:00-04:00 in Halifax.
  schedule: "0 10 5 * * *"
  retention: 30d
  region: garage
  # Renders the `garage-cnpg` ExternalSecret. Off when something else writes it.
  externalSecret: true
  secretStore: onepassword-connect
  # 1Password item holding the Garage keys, e.g. garage-offsite.
  item: ""
  # The prefix under the namespace's path that the Cluster archives to. Empty uses the
  # Cluster's name. A re-created Cluster takes a new one, such as `<cluster>-2`: the plugin
  # refuses to archive into a prefix that holds WAL. The restore drill reads this prefix.
  serverName: ""
  # A prefix of the same store to recover from in place of `initdb`: the serverName the
  # Cluster had before it was re-created. Read at creation only; drop it once recovered.
  recoverFrom: ""

gateway:
  name: spindrift-apps
  namespace: spindrift-apps

# The private host for claiming and site control. Empty keeps them on the public apex.
# Set, the apex answers `403 PRIVATE` under `/api/sites` except the directory.
control:
  host: ""
  # A TLS listener. The tunnel reaches only the HTTP listener, so Cloudflare cannot carry this host.
  listener: ""
  # The Service that answers every path on the control host but `/api` and `/cli`, as
  # `{name, namespace, port}`. A ReferenceGrant in its namespace must admit this
  # namespace's HTTPRoutes. Empty sends the whole host to kthx.
  console: {}

# The OIDC issuer whose projected ServiceAccount tokens open `/api/engine/*` on the
# control host: the kthx engine's read of every site and its name reservations. Empty
# serves no such path. Set, it needs `audience`, `subject` and `control.host`.
engine:
  issuer: ""
  # The token's audience. Neither API server accepts it, so the token opens kthx only.
  audience: ""
  # The engine's ServiceAccount, as `system:serviceaccount:<namespace>:<name>`.
  subject: ""

# Keyless GCP through a projected token. The pool principal is
# `offsite:system:serviceaccount:kthx:kthx`, so the ServiceAccount's name and namespace matter.
gcp:
  audience: ""
  impersonationUrl: ""
  tokenMountPath: /var/run/secrets/gcp
  expirationSeconds: 3600
