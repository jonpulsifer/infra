{{- with .Values.identity.host }}
{{/*
The identity host. A tailscale L7 Ingress adds the caller's tailnet login to each
request; through the gateway, any client could write that header. No funnel:
tailscale sets no identity headers on a funnel request.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kthx.fullname" $ }}-tailnet
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kthx.labels" $ | nindent 4 }}
  annotations:
    # The tailnet policy must let `tag:k8s-operator` own this tag, or the proxy never joins
    # and the Ingress reports no hostname.
    tailscale.com/tags: {{ required "identity.tag names the tailnet tag the grant points at" $.Values.identity.tag | quote }}
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "kthx.fullname" $ }}
      port:
        number: {{ $.Values.port }}
  tls:
    # The MagicDNS label of the identity host; the operator appends the tailnet domain.
    - hosts:
        - {{ splitList "." . | first | quote }}
{{- end }}
