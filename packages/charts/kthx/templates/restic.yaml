{{/*
Nightly `pg_dumpall` into the site's restic staging repository, beside the GCS dump in
`database.yaml`. Empty `restic.repository` renders neither object.
*/}}
{{- with .Values.restic.repository }}
{{- $host := printf "%s/%s/%s" (required "restic.cluster is required: it names the snapshot's host" $.Values.restic.cluster) $.Release.Namespace (include "kthx.databaseName" $) }}
{{- if $.Values.restic.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kthx.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.restic.secretStore }}
  target:
    name: restic
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef: {key: restic-repository, property: password}
    - secretKey: RESTIC_REST_USERNAME
      remoteRef: {key: restic-rest-server, property: username}
    - secretKey: RESTIC_REST_PASSWORD
      remoteRef: {key: restic-rest-server, property: password}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kthx.databaseName" $ }}-restic
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kthx.labels" $ | nindent 4 }}
    lolwtf.ca/backup: "true"
spec:
  schedule: {{ $.Values.restic.schedule | quote }}
  timeZone: America/Halifax
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      template:
        metadata:
          # Not `kthx.labels`, which the Service selects.
          labels:
            app.kubernetes.io/name: {{ include "kthx.databaseName" $ }}-restic
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/managed-by: {{ $.Release.Service }}
            lolwtf.ca/backup: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- include "kthx.podSecurityContext" $ | nindent 12 }}
          initContainers:
            # Uncompressed, so restic deduplicates against the previous night.
            - name: dump
              image: {{ $.Values.database.backup.image | quote }}
              command:
                - bash
                - -c
                - set -euo pipefail; pg_dumpall --no-role-passwords -d "$DATABASE_URL" > /dump/{{ include "kthx.databaseName" $ }}.sql
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kthx.databaseName" $ }}-app
                      key: uri
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kthx.databaseName" $ }}-app
                      key: password
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                {{- include "kthx.containerSecurityContext" $ | nindent 16 }}
          containers:
            - name: restic
              image: {{ $.Values.restic.image | quote }}
              # Exit 10 is restic's "repository does not exist"; any other failure stops here.
              command:
                - sh
                - -c
                - |
                  set -eu
                  status=0
                  restic cat config > /dev/null || status=$?
                  if [ "$status" -eq 10 ]; then restic init; elif [ "$status" -ne 0 ]; then exit "$status"; fi
                  exec restic backup --host {{ $host | quote }} --tag kind=pg /dump
              env:
                - name: RESTIC_REPOSITORY
                  value: {{ . | quote }}
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic
                - name: HOME
                  value: /tmp
              envFrom:
                - secretRef:
                    name: restic
              volumeMounts:
                - name: dump
                  mountPath: /dump
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 1Gi}
              securityContext:
                {{- include "kthx.containerSecurityContext" $ | nindent 16 }}
          volumes:
            - name: dump
              emptyDir:
                sizeLimit: {{ $.Values.database.backup.scratchSize }}
            - name: tmp
              emptyDir: {}
{{- end }}
