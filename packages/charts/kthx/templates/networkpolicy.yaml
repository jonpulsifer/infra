{{/*
Default-deny ingress to the server except from this namespace and the tailnet proxy, so
no other pod can skip the edge's rate limits, cache rules and `Origin` guard. Postgres is
not selected: the CNPG operator, the scrape and its probes all need to reach it.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kthx.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kthx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kthx.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      {{- with .Values.identity.host }}
      {{/*
      The tailnet Ingress proxy runs in the tailscale namespace. Namespace and pod are
      one entry: two entries are an OR, admitting every proxy the operator runs.
      */}}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource-type: ingress
              tailscale.com/parent-resource: {{ include "kthx.fullname" $ }}-tailnet
              tailscale.com/parent-resource-ns: {{ $.Release.Namespace }}
      {{- end }}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
---
{{/*
Cilium's host-networked gateway Envoy reaches the pod as the `ingress` identity, which
no NetworkPolicy selector matches; without this the listener answers 503.
ponytail: `fromEntities` is Cilium-only; a non-Cilium cluster fails on the missing CRD.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "kthx.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kthx.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "kthx.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities:
        - ingress
        # The kubelet's readiness probe. Cilium's default `allow-localhost=auto` admits it;
        # `allow-localhost=policy` does not.
        - host
      toPorts:
        - ports:
            - port: {{ .Values.port | quote }}
              protocol: TCP
