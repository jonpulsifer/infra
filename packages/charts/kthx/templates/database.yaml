{{/*
The Postgres instance that holds a database and a login role per site.
*/}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "kthx.databaseName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kthx.labels" . | nindent 4 }}
  annotations:
    # An uninstall must not take every site's data; the nightly dump is the only other copy.
    helm.sh/resource-policy: keep
spec:
  instances: 1
  # Break-glass access for when the control role locks itself out of a site database.
  enableSuperuserAccess: true
  storage:
    {{- with .Values.database.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
    size: {{ .Values.database.size }}
  {{- with .Values.node }}
  affinity:
    nodeSelector:
      kubernetes.io/hostname: {{ . | quote }}
  {{- end }}
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
  postgresql:
    parameters:
      {{- toYaml .Values.database.parameters | nindent 6 }}
  monitoring:
    # CNPG's PodMonitor carries no release label; offsite's Prometheus selects every PodMonitor.
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.name }}
      encoding: UTF8
      localeCollate: C
      localeCType: C
      dataChecksums: true
      postInitApplicationSQL:
        # Granted once here, not through `spec.managed.roles`: reconciling the role strips the
        # ADMIN OPTION on site roles that site delete needs to terminate their backends.
        - ALTER ROLE {{ .Values.database.name }} CREATEDB CREATEROLE
---
{{/*
Nightly `pg_dumpall` of the whole instance into the depot's `backups/`, which a
bucket lifecycle rule expires. The Postgres image has no GCS client and the
gcloud image has no Postgres client, so the two steps share an emptyDir.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kthx.databaseName" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kthx.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.database.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # A missed run is skipped; the next night's dump covers it.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Three days to read a failed run. `failedJobsHistoryLimit` alone evicts by count,
      # so failures from before a fix would stay forever.
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      template:
        metadata:
          # Not `kthx.labels`: they match the Service selector, and this pod would join the
          # Service as a Ready endpoint that serves nothing.
          labels:
            app.kubernetes.io/name: {{ include "kthx.databaseName" . }}-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/managed-by: {{ .Release.Service }}
        spec:
          # With OnFailure the Job controller deletes the retried pod when `backoffLimit` is
          # spent, so no log survives. Never keeps each failed attempt as its own pod.
          restartPolicy: Never
          serviceAccountName: {{ include "kthx.fullname" . }}
          automountServiceAccountToken: false
          securityContext:
            {{- include "kthx.podSecurityContext" . | nindent 12 }}
          initContainers:
            - name: dump
              image: {{ .Values.database.backup.image | quote }}
              # `--no-role-passwords` lets a non-superuser dump. Site role passwords derive
              # from `KTHX_PG_KEY`, so none are lost.
              command:
                - bash
                - -c
                - set -euo pipefail; pg_dumpall --no-role-passwords -d "$DATABASE_URL" | gzip -9 > /dump/pg.sql.gz
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kthx.databaseName" . }}-app
                      key: uri
                # `pg_dumpall` does not pass the password from `-d` to its child `pg_dump`
                # processes, which would prompt; libpq reads this instead.
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kthx.databaseName" . }}-app
                      key: password
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              securityContext:
                {{- include "kthx.containerSecurityContext" . | nindent 16 }}
          containers:
            - name: upload
              image: {{ .Values.database.backup.uploaderImage | quote }}
              # gcloud ignores GOOGLE_APPLICATION_CREDENTIALS, so `auth login --cred-file` hands
              # it the ADC document.
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  gcloud --quiet auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS"
                  exec gcloud --quiet storage cp /dump/pg.sql.gz \
                    "gs://$KTHX_BUCKET/backups/pg/$(date -u +%F).sql.gz"
              env:
                # objectAdmin lacks `storage.buckets.get`; if the upload 403s, also grant
                # `roles/storage.legacyBucketReader` on the bucket.
                - name: KTHX_BUCKET
                  value: {{ required "bucket is required: it is the depot every release archive is durable in" .Values.bucket | quote }}
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: {{ printf "%s/gcp-credentials.json" .Values.gcp.tokenMountPath | quote }}
                - name: HOME
                  value: /tmp
                # gcloud's credential store and logs; the root filesystem is read-only.
                - name: CLOUDSDK_CONFIG
                  value: /tmp/gcloud
              volumeMounts:
                - name: dump
                  mountPath: /dump
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                {{- include "kthx.gcpVolumeMount" . | nindent 16 }}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 1Gi}
              securityContext:
                {{- include "kthx.containerSecurityContext" . | nindent 16 }}
          volumes:
            - name: dump
              emptyDir:
                sizeLimit: {{ .Values.database.backup.scratchSize }}
            - name: tmp
              emptyDir: {}
            {{- include "kthx.gcpVolume" . | nindent 12 }}
