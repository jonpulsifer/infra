{{/*
The public route: the apex, where sites are claimed, and every site host.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kthx.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kthx.labels" . | nindent 4 }}
  annotations:
    # Keeps external-dns from overwriting Terraform's tunnel records with the gateway's
    # private address. Both prefixes: external-dns v0.22.0 moved the default one.
    external-dns.alpha.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
    external-dns.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
spec:
  # No `sectionName`: Cloudflare terminates TLS and the tunnel reaches the HTTP listener.
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  # A wildcard never matches the apex.
  hostnames:
    - {{ .Values.zone | quote }}
    - {{ printf "*.%s" .Values.zone | quote }}
  rules:
    - backendRefs:
        - name: {{ include "kthx.fullname" . }}
          port: {{ .Values.port }}
{{- with .Values.control.host }}
---
{{/*
The private control host, on the named TLS listener only. No controller annotation:
external-dns publishes this name at the gateway's private address.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kthx.fullname" $ }}-control
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kthx.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ required "control.listener names the TLS listener the private host is served on" $.Values.control.listener | quote }}
  hostnames:
    - {{ . | quote }}
  rules:
    - backendRefs:
        - name: {{ include "kthx.fullname" $ }}
          port: {{ $.Values.port }}
{{- end }}
