{{/*
One route, and the client owns everything below it.

`src/web/routes.ts` serves one HTML document, a health probe, and the generated
command surface; navigation is a hash router. There is nothing for a second
rule to route to, so the edge does no path matching.
*/}}
{{- if and .Values.ingress.enabled .Values.hostname }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ include "kthx-engine.fullname" . }}-http-route
  namespace: {{ include "kthx-engine.namespace" . }}
  labels:
    {{- include "kthx-engine.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "kthx-engine.fullname" . }}-gateway
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - backendRefs:
        - name: {{ include "kthx-engine.fullname" . }}
          port: {{ .Values.port }}
{{- end }}
