{{/*
The trust store, when this release carries its content rather than naming a
ConfigMap somebody else maintains.

**Rendering it here is what makes it checksummable.** The runtime reads
`NODE_EXTRA_CA_CERTS` exactly once, at process start, so a kubelet refresh of
the mounted file changes the file and nothing else: a corrected bundle reaches
the mount and never reaches the process holding the old one. deployment.yaml
digests this same text onto both pod templates, which is what turns a bundle
change into the rollout the processes need.

The failure this closes misfires precisely during a CA rotation, when an
operator is already reading a wall of `unable to verify the first certificate`
and is least able to tell a wrong bundle from a right bundle and an old
process.

Rendered from the value rather than read from a ConfigMap the chart only names,
because the mounted text and the digested text have to be the same string by
construction. Two copies that merely ought to agree is the defect the digest
exists to prevent, one layer up.
*/}}
{{- if .Values.serviceAccount.token.caBundle }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spindrift.caConfigMapName" . }}
  namespace: {{ include "spindrift.namespace" . }}
  labels:
    {{- include "spindrift.labels" . | nindent 4 }}
data:
  # `ca.crt` is the key the projected volume selects and the filename the
  # variable names. Encoded as a whole map rather than a hand-indented block
  # scalar so the value round-trips byte for byte — the digest on the pod
  # template is over this exact string, and a chomped newline would make the two
  # disagree without either being visibly wrong.
  {{- toYaml (dict "ca.crt" .Values.serviceAccount.token.caBundle) | nindent 2 }}
{{- end }}
