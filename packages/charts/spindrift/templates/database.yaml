{{/*
The control plane's database, with no backups. Its desired-state rows, attempt log and
config version pins exist nowhere else, so an uninstall keeps the Cluster by default.
*/}}
{{- if .Values.database.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "spindrift.databaseName" . }}
  namespace: {{ include "spindrift.namespace" . }}
  labels:
    {{- include "spindrift.labels" . | nindent 4 }}
  {{- if .Values.database.keepOnDelete }}
  annotations:
    # CNPG deletes the data PVC with the Cluster, whatever the storage class reclaims.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  instances: {{ .Values.database.instances }}
  enableSuperuserAccess: false
  storage:
    storageClass: {{ .Values.database.storageClass }}
    size: {{ .Values.database.size }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.name }}
      encoding: UTF8
      localeCollate: C
      localeCType: C
      dataChecksums: true
{{- end }}
