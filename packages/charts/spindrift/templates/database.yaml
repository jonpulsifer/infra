{{/*
The control plane's database. Its desired-state rows, attempt log and config version
pins exist nowhere else but the Garage backup in `backup.yaml`, so an uninstall keeps the
Cluster by default.
*/}}
{{- if .Values.database.enabled }}
{{- include "spindrift.backupPrefixes" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "spindrift.databaseName" . }}
  namespace: {{ include "spindrift.namespace" . }}
  labels:
    {{- include "spindrift.labels" . | nindent 4 }}
  {{- if .Values.database.keepOnDelete }}
  annotations:
    # CNPG deletes the data PVC with the Cluster, whatever the storage class reclaims.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  instances: {{ .Values.database.instances }}
  monitoring:
    # CNPG's PodMonitor carries no release label; offsite's Prometheus selects every PodMonitor.
    enablePodMonitor: true
  {{- if .Values.backup.endpointURL }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        {{- with .Values.backup.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
  {{- end }}
  enableSuperuserAccess: false
  storage:
    storageClass: {{ .Values.database.storageClass }}
    size: {{ .Values.database.size }}
  bootstrap:
  {{- if .Values.backup.recoverFrom }}
    recovery:
      source: origin
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.name }}
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage
          serverName: {{ .Values.backup.recoverFrom | quote }}
  {{- else }}
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.name }}
      encoding: UTF8
      localeCollate: C
      localeCType: C
      dataChecksums: true
  {{- end }}
{{- end }}
