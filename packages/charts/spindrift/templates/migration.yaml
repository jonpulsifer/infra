{{/*
Migrations as a Job, for an installation that wants them applied that way.

**The default is disabled and the command is empty.**
`src/db/migrate.ts` is a library with no main on purpose — production applies
migrations as an out-of-band operator act — so a release that turns this on has
to supply a command that invokes the library.

The Job's name carries a digest of its execution inputs, so an unchanged
migration is the same completed Job and changed inputs create a new one. The pod
template deliberately excludes revision-varying chart labels: Kubernetes makes
that template immutable, and a Git chart revision must not turn an unrelated
label change into a failed upgrade. This keeps `packages/charts/app`'s Job
pattern rather than replacing it with a Helm hook that would couple Flux to the
Job.
*/}}
{{- if and .Values.database.enabled .Values.database.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spindrift.migrationName" . }}
  namespace: {{ include "spindrift.namespace" . }}
  labels:
    {{- include "spindrift.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "spindrift.selectorLabels" (dict "Release" .Release "Values" .Values "Chart" .Chart "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.image }}
          command:
            - sh
            - -c
            - {{ .Values.database.migration.command | quote }}
          env:
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" . }}-app
                  key: uri
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
