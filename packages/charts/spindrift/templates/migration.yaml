{{/*
Applies the image's committed migrations. The Job name hashes its execution inputs, so an
unchanged release reuses the finished Job. A Job is immutable, so the pod omits revision labels.
*/}}
{{- if and .Values.database.enabled .Values.database.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spindrift.migrationName" . }}
  namespace: {{ include "spindrift.namespace" . }}
  labels:
    {{- include "spindrift.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  # Retry until the database is reachable: the migration is idempotent, and a spent
  # backoff would fail this release for good.
  backoffLimit: 2147483647
  template:
    metadata:
      labels:
        {{- include "spindrift.selectorLabels" (dict "Release" .Release "Values" .Values "Chart" .Chart "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.image }}
          command: ["bun", "run", "src/db/migrate.ts"]
          env:
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" . }}-app
                  key: uri
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
