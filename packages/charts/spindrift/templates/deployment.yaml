{{/*
The `web` process and the optional `reconciler`, from one image and one template. The
reconciler serves nothing, so it has no port and no probe.
*/}}
{{- $top := . -}}
{{- $processes := list (dict "name" "web" "command" "src/web/server.ts" "replicas" .Values.web.replicas "resources" .Values.web.resources "serves" true "federates" true) -}}
{{- if .Values.reconciler.enabled -}}
{{- $processes = append $processes (dict "name" "reconciler" "command" "src/reconciler/main.ts" "replicas" .Values.reconciler.replicas "resources" .Values.reconciler.resources "serves" false "federates" true) -}}
{{- end -}}
{{- range $process := $processes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spindrift.fullname" $top }}-{{ $process.name }}
  namespace: {{ include "spindrift.namespace" $top }}
  labels:
    {{- include "spindrift.labels" $top | nindent 4 }}
    app.kubernetes.io/component: {{ $process.name }}
  annotations:
    {{- if $top.Values.database.enabled }}
    app.kubernetes.io/database: {{ include "spindrift.databaseName" $top }}
    {{- end }}
    # `NODE_EXTRA_CA_CERTS` is read once at start, so a changed bundle needs a restart, even one
    # this release does not own, such as `kube-root-ca.crt` after a cluster CA rotation.
    configmap.reloader.stakater.com/reload: {{ $top.Values.serviceAccount.token.caConfigMap | quote }}
    {{- with $top.Values.envFromSecret }}
    # The process reads this Secret only at start.
    secret.reloader.stakater.com/reload: {{ . | quote }}
    {{- end }}
spec:
  replicas: {{ $process.replicas }}
  # Switching a live Deployment to Recreate fails: server-side apply cannot prune the
  # defaulted `rollingUpdate` fields, and the HelmRelease stalls.
  strategy:
    type: RollingUpdate
    # Both processes are singletons, and `web` keeps rate limits in memory, so the old pod stops first.
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "spindrift.selectorLabels" (dict "Release" $top.Release "Values" $top.Values "Chart" $top.Chart "component" $process.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spindrift.labels" $top | nindent 8 }}
        app.kubernetes.io/component: {{ $process.name }}
    spec:
      {{- if $top.Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      serviceAccountName: {{ include "spindrift.serviceAccountName" $top }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if and $top.Values.database.enabled $top.Values.database.migration.enabled }}
      initContainers:
        - name: wait-for-schema
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "src/db/wait-for-schema.ts"]
          env:
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: {{ $process.name }}
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", {{ $process.command | quote }}]
          {{- if $process.serves }}
          ports:
            - containerPort: {{ $top.Values.port }}
              protocol: TCP
          {{- end }}
          env:
            # /tmp is the only writable path, and `Bun.serve` bundles the client at boot.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: PORT
              value: {{ $top.Values.port | quote }}
            {{- if $process.serves }}
            # The machine routes also answer on this Service's in-cluster names.
            - name: SPINDRIFT_SERVICE_NAME
              value: {{ include "spindrift.fullname" $top | quote }}
            - name: SPINDRIFT_SERVICE_NAMESPACE
              value: {{ include "spindrift.namespace" $top | quote }}
            {{- end }}
            {{- if contains "@" $top.Values.image }}
            # The footer's version: `sha256:` and 12 hex characters, as `shortDigest` prints it. A
            # tag-only image sets none, which hides the footer.
            - name: SPINDRIFT_VERSION
              value: {{ $top.Values.image | splitList "@" | last | trunc 19 | quote }}
            {{- end }}
            {{- if $process.federates }}
            - name: SPINDRIFT_IDENTITY_TOKEN_PATH
              value: {{ printf "%s/token" $top.Values.serviceAccount.token.mountPath | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/ca.crt" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- if $top.Values.serviceAccount.token.gcpAudience }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ printf "%s/gcp-credentials.json" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- end }}
            {{- end }}
            {{- if $top.Values.hostname }}
            # The passkey relying party, from the value that renders the Gateway listener and
            # HTTPRoute. A release with no hostname enrols nobody.
            - name: SPINDRIFT_HOSTNAME
              value: {{ $top.Values.hostname | quote }}
            {{- end }}
            {{- if $top.Values.gatewayAuth.enabled }}
            # Rendered only beside the NetworkPolicy in gateway-auth.yaml.
            - name: SPINDRIFT_TRUSTED_GATEWAY_BOUNDARY
              value: "true"
            {{- end }}
            {{- if $top.Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
            {{- end }}
            {{- range $top.Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- with $top.Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- if $process.serves }}
          # No liveness probe: it would restart the process during a Postgres outage. `/readyz`
          # runs `select 1` through the app's pool.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $top.Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $process.federates }}
            - name: federated-identity
              mountPath: {{ $top.Values.serviceAccount.token.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $process.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $process.federates }}
        - name: federated-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.audience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: token
              - configMap:
                  name: {{ $top.Values.serviceAccount.token.caConfigMap }}
                  items:
                    - key: ca.crt
                      path: ca.crt
              {{- if $top.Values.serviceAccount.token.gcpAudience }}
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.gcpAudience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: gcp-token
              - configMap:
                  name: {{ include "spindrift.fullname" $top }}-federated-identity
                  items:
                    - key: gcp-credentials.json
                      path: gcp-credentials.json
              {{- end }}
        {{- end }}
{{- end }}
