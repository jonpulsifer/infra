{{/*
Two Deployments off one image — `web` (UI, webhooks, log WebSockets) and
`reconciler` — rendered from one template so they cannot drift apart in the
image, the database credential, the manifest bootstrap, or the security context.

The reconciler serves nothing, so it gets no port and no probe: a loop that
claims work with `SELECT … FOR UPDATE SKIP LOCKED` has no readiness to report.
*/}}
{{- $top := . -}}
{{- $processes := list (dict "name" "web" "command" "src/web/server.ts" "replicas" .Values.web.replicas "resources" .Values.web.resources "serves" true "federates" true) -}}
{{- if .Values.reconciler.enabled -}}
{{- $processes = append $processes (dict "name" "reconciler" "command" "src/reconciler/main.ts" "replicas" .Values.reconciler.replicas "resources" .Values.reconciler.resources "serves" false "federates" true) -}}
{{- end -}}
{{- range $process := $processes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spindrift.fullname" $top }}-{{ $process.name }}
  namespace: {{ include "spindrift.namespace" $top }}
  labels:
    {{- include "spindrift.labels" $top | nindent 4 }}
    app.kubernetes.io/component: {{ $process.name }}
  {{- if or $top.Values.database.enabled $top.Values.envFromSecret }}
  annotations:
    {{- if $top.Values.database.enabled }}
    app.kubernetes.io/database: {{ include "spindrift.databaseName" $top }}
    {{- end }}
    {{- with $top.Values.envFromSecret }}
    # A rotated token is a Secret change; Reloader turns it into the restart the
    # process needs to read the new value.
    secret.reloader.stakater.com/reload: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ $process.replicas }}
  selector:
    matchLabels:
      {{- include "spindrift.selectorLabels" (dict "Release" $top.Release "Values" $top.Values "Chart" $top.Chart "component" $process.name) | nindent 6 }}
  template:
    metadata:
      {{- if $top.Values.manifest }}
      annotations:
        # Both processes read the manifest once, at start, so a ConfigMap change
        # has to become a rollout.
        checksum/manifest: {{ toYaml $top.Values.manifest | sha256sum }}
      {{- end }}
      labels:
        {{- include "spindrift.labels" $top | nindent 8 }}
        app.kubernetes.io/component: {{ $process.name }}
    spec:
      {{- if $top.Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      serviceAccountName: {{ include "spindrift.serviceAccountName" $top }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if and $top.Values.database.enabled $top.Values.database.migration.enabled }}
      initContainers:
        - name: wait-for-schema
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "src/db/wait-for-schema.ts"]
          env:
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: {{ $process.name }}
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", {{ $process.command | quote }}]
          {{- if $process.serves }}
          ports:
            - containerPort: {{ $top.Values.port }}
              protocol: TCP
          {{- end }}
          env:
            # readOnlyRootFilesystem below leaves /tmp as the only writable
            # path, and `Bun.serve` bundles the client at boot.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: PORT
              value: {{ $top.Values.port | quote }}
            {{- if $process.federates }}
            - name: SPINDRIFT_IDENTITY_TOKEN_PATH
              value: {{ printf "%s/token" $top.Values.serviceAccount.token.mountPath | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/ca.crt" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- if $top.Values.serviceAccount.token.gcpAudience }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ printf "%s/gcp-credentials.json" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- end }}
            {{- end }}
            {{- if $top.Values.manifest }}
            # Named explicitly, so a declaration that fails to mount is fatal
            # rather than falling back to the durable row.
            - name: SPINDRIFT_MANIFEST_PATH
              value: /etc/spindrift/manifest.yaml
            {{- end }}
            {{- if $top.Values.gatewayAuth.enabled }}
            # Rendered only beside the NetworkPolicy in gateway-auth.yaml.
            - name: SPINDRIFT_TRUSTED_GATEWAY_BOUNDARY
              value: "true"
            {{- end }}
            {{- if $top.Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
            {{- end }}
            {{- range $top.Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- with $top.Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- if $process.serves }}
          # Readiness only. A liveness probe on a process whose slow path is a
          # database query restarts it exactly when it is least able to recover.
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $top.Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $top.Values.manifest }}
            - name: manifest
              mountPath: /etc/spindrift
              readOnly: true
            {{- end }}
            {{- if $process.federates }}
            - name: federated-identity
              mountPath: {{ $top.Values.serviceAccount.token.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $process.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $top.Values.manifest }}
        - name: manifest
          configMap:
            name: {{ include "spindrift.fullname" $top }}-manifest
        {{- end }}
        {{- if $process.federates }}
        - name: federated-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.audience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: token
              - configMap:
                  name: {{ $top.Values.serviceAccount.token.caConfigMap }}
                  items:
                    - key: ca.crt
                      path: ca.crt
              {{- if $top.Values.serviceAccount.token.gcpAudience }}
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.gcpAudience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: gcp-token
              - configMap:
                  name: {{ include "spindrift.fullname" $top }}-federated-identity
                  items:
                    - key: gcp-credentials.json
                      path: gcp-credentials.json
              {{- end }}
        {{- end }}
{{- end }}
