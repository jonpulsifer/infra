{{/*
§19: "One image, two Deployments — `web` (UI, webhooks, log WebSockets) and
`reconciler` — forced, because the transactional desired-state row assumes a
loop that owns its own lifecycle."

They are rendered from one template with one difference each — the command and
the component label — so the two processes cannot drift apart in the things
that must not differ: the image, the database credential, the manifest
bootstrap, and the security context.

The reconciler serves nothing and is therefore given no port and no probe. A
loop that claims work with `SELECT … FOR UPDATE SKIP LOCKED` has no readiness to
report, and inventing an endpoint so it could would be inventing the surface §21
declined to declare.
*/}}
{{- $top := . -}}
{{- $processes := list (dict "name" "web" "command" .Values.command "replicas" .Values.web.replicas "resources" .Values.web.resources "serves" true "federates" true) -}}
{{- if .Values.reconciler.enabled -}}
{{- $processes = append $processes (dict "name" "reconciler" "command" .Values.reconciler.command "replicas" .Values.reconciler.replicas "resources" .Values.reconciler.resources "serves" false "federates" true) -}}
{{- end -}}
{{- range $process := $processes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spindrift.fullname" $top }}-{{ $process.name }}
  namespace: {{ include "spindrift.namespace" $top }}
  labels:
    {{- include "spindrift.labels" $top | nindent 4 }}
    app.kubernetes.io/component: {{ $process.name }}
  {{- if or $top.Values.database.enabled $top.Values.envFromSecret }}
  annotations:
    {{- if $top.Values.database.enabled }}
    app.kubernetes.io/database: {{ include "spindrift.databaseName" $top }}
    {{- end }}
    {{- with $top.Values.envFromSecret }}
    # Recovery is token rotation. Reloader turns that desired-state Secret
    # change into the restart needed for the process to read the new value.
    secret.reloader.stakater.com/reload: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ $process.replicas }}
  selector:
    matchLabels:
      {{- include "spindrift.selectorLabels" (dict "Release" $top.Release "Values" $top.Values "Chart" $top.Chart "component" $process.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spindrift.labels" $top | nindent 8 }}
        app.kubernetes.io/component: {{ $process.name }}
    spec:
      {{- if $top.Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      serviceAccountName: {{ include "spindrift.serviceAccountName" $top }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if and $top.Values.database.enabled $top.Values.database.migration.enabled }}
      initContainers:
        - name: wait-for-schema
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - {{ $top.Values.database.migration.waitCommand | quote }}
          env:
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: {{ $process.name }}
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - {{ $process.command | quote }}
          {{- if $process.serves }}
          ports:
            - containerPort: {{ $top.Values.port }}
              protocol: TCP
          {{- end }}
          env:
            # readOnlyRootFilesystem below leaves /tmp as the only writable
            # path, and `Bun.serve` bundles the client at boot.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: PORT
              value: {{ $top.Values.port | quote }}
            {{- if $process.federates }}
            - name: SPINDRIFT_IDENTITY_TOKEN_PATH
              value: {{ printf "%s/token" $top.Values.serviceAccount.token.mountPath | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/ca.crt" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- if $top.Values.serviceAccount.token.gcpAudience }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ printf "%s/gcp-credentials.json" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- end }}
            {{- end }}
            {{- if $top.Values.gatewayAuth.enabled }}
            # Rendered only beside the NetworkPolicy in gateway-auth.yaml.
            - name: SPINDRIFT_TRUSTED_GATEWAY_BOUNDARY
              value: "true"
            {{- end }}
            {{- if $top.Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
            {{- end }}
            {{- if not (empty $top.Values.installationManifest) }}
            - name: SPINDRIFT_MANIFEST
              value: {{ toJson $top.Values.installationManifest | quote }}
            {{- end }}
            {{- range $top.Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- with $top.Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- if $process.serves }}
          # No liveness probe, deliberately — the same rule §7 fixes for App
          # workloads. A liveness probe on a process whose slow path is a
          # database query restarts it exactly when it is least able to recover.
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $top.Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $process.federates }}
            - name: federated-identity
              mountPath: {{ $top.Values.serviceAccount.token.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $process.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $process.federates }}
        - name: federated-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.audience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              {{- if $top.Values.serviceAccount.token.gcpAudience }}
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.gcpAudience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: gcp-token
              - configMap:
                  name: {{ include "spindrift.fullname" $top }}-federated-identity
                  items:
                    - key: gcp-credentials.json
                      path: gcp-credentials.json
              {{- end }}
        {{- end }}
{{- end }}
