{{/*
Two Deployments off one image — `web` (UI, webhooks, log WebSockets) and
`reconciler` — rendered from one template so they cannot drift apart in the
image, the database credential, the manifest bootstrap, or the security context.

The reconciler serves nothing, so it gets no port and no probe: a loop that
claims work with `SELECT … FOR UPDATE SKIP LOCKED` has no readiness to report.
*/}}
{{- $top := . -}}
{{/* See spindrift.manifest.content (_helpers.tpl): a declaration verbatim,
the chart-only seed of files/default-manifest.yaml, or empty. Computed once
so the checksum, the mount and the env var below all gate on and hash exactly
what manifest.yaml renders. */}}
{{- $manifestContent := include "spindrift.manifest.content" $top -}}
{{- $processes := list (dict "name" "web" "command" "src/web/server.ts" "replicas" .Values.web.replicas "resources" .Values.web.resources "serves" true "federates" true) -}}
{{- if .Values.reconciler.enabled -}}
{{- $processes = append $processes (dict "name" "reconciler" "command" "src/reconciler/main.ts" "replicas" .Values.reconciler.replicas "resources" .Values.reconciler.resources "serves" false "federates" true) -}}
{{- end -}}
{{- range $process := $processes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spindrift.fullname" $top }}-{{ $process.name }}
  namespace: {{ include "spindrift.namespace" $top }}
  labels:
    {{- include "spindrift.labels" $top | nindent 4 }}
    app.kubernetes.io/component: {{ $process.name }}
  annotations:
    {{- if $top.Values.database.enabled }}
    app.kubernetes.io/database: {{ include "spindrift.databaseName" $top }}
    {{- end }}
    # `NODE_EXTRA_CA_CERTS` is read once, at process start. A kubelet refresh of
    # the projected bundle changes the file and nothing else, so a corrected
    # trust store reaches the mount and never reaches the process holding the
    # old one — and it misfires during a CA rotation, when every symptom already
    # reads as a wrong bundle rather than an old process. Reloader turns the
    # ConfigMap change into the restart that makes the correction take.
    #
    # The ConfigMap is named rather than left to `reloader.stakater.com/auto`
    # because this is the one the pod reaches through a projected volume, and
    # because the name is often a bundle this release does not own — including
    # the `kube-root-ca.crt` default, which a cluster CA rotation rewrites in
    # place with nothing else to roll these pods.
    configmap.reloader.stakater.com/reload: {{ $top.Values.serviceAccount.token.caConfigMap | quote }}
    {{- with $top.Values.envFromSecret }}
    # A rotated token is a Secret change; Reloader turns it into the restart the
    # process needs to read the new value.
    secret.reloader.stakater.com/reload: {{ . | quote }}
    {{- end }}
spec:
  replicas: {{ $process.replicas }}
  selector:
    matchLabels:
      {{- include "spindrift.selectorLabels" (dict "Release" $top.Release "Values" $top.Values "Chart" $top.Chart "component" $process.name) | nindent 6 }}
  template:
    metadata:
      {{- if $manifestContent }}
      annotations:
        # Both processes read the manifest once, at start, so a ConfigMap change
        # has to become a rollout.
        checksum/manifest: {{ $manifestContent | sha256sum }}
      {{- end }}
      labels:
        {{- include "spindrift.labels" $top | nindent 8 }}
        app.kubernetes.io/component: {{ $process.name }}
    spec:
      {{- if $top.Values.sandbox }}
      runtimeClassName: gvisor
      {{- end }}
      serviceAccountName: {{ include "spindrift.serviceAccountName" $top }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if and $top.Values.database.enabled $top.Values.database.migration.enabled }}
      initContainers:
        - name: wait-for-schema
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "src/db/wait-for-schema.ts"]
          env:
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: {{ $process.name }}
          image: {{ $top.Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", {{ $process.command | quote }}]
          {{- if $process.serves }}
          ports:
            - containerPort: {{ $top.Values.port }}
              protocol: TCP
          {{- end }}
          env:
            # readOnlyRootFilesystem below leaves /tmp as the only writable
            # path, and `Bun.serve` bundles the client at boot.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
            - name: PORT
              value: {{ $top.Values.port | quote }}
            {{- if $process.federates }}
            - name: SPINDRIFT_IDENTITY_TOKEN_PATH
              value: {{ printf "%s/token" $top.Values.serviceAccount.token.mountPath | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/ca.crt" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- if $top.Values.serviceAccount.token.gcpAudience }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ printf "%s/gcp-credentials.json" $top.Values.serviceAccount.token.mountPath | quote }}
            {{- end }}
            {{- end }}
            {{- if $top.Values.hostname }}
            # The passkey relying party, and the name the status page tells its
            # own address by. The same value that renders the Gateway listener
            # and the HTTPRoute, so the origin a ceremony is scoped to is the
            # origin the release actually answers on, with no second copy to
            # keep in step. A release serving no origin sets nothing and cannot
            # enrol anybody, which is what having no origin means.
            - name: SPINDRIFT_HOSTNAME
              value: {{ $top.Values.hostname | quote }}
            {{- end }}
            {{- if $manifestContent }}
            # Named explicitly, so a declaration that fails to mount is fatal
            # rather than falling back to the durable row.
            - name: SPINDRIFT_MANIFEST_PATH
              value: /etc/spindrift/manifest.yaml
            {{- end }}
            {{- if $top.Values.gatewayAuth.enabled }}
            # Rendered only beside the NetworkPolicy in gateway-auth.yaml.
            - name: SPINDRIFT_TRUSTED_GATEWAY_BOUNDARY
              value: "true"
            {{- end }}
            {{- if $top.Values.database.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "spindrift.databaseName" $top }}-app
                  key: uri
            {{- end }}
            {{- range $top.Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- with $top.Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- if $process.serves }}
          # Readiness only, and on purpose: a liveness probe on a process
          # whose slow path is a database query would restart it exactly when
          # it is least able to recover. `/readyz` does a real `select 1`
          # through the app's pool, so a Postgres outage takes the pod out of
          # the Service without killing the one process that will notice
          # Postgres come back. `/healthz` stays a bare constant for exactly
          # that liveness case, should one ever be added here.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $top.Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $manifestContent }}
            - name: manifest
              mountPath: /etc/spindrift
              readOnly: true
            {{- end }}
            {{- if $process.federates }}
            - name: federated-identity
              mountPath: {{ $top.Values.serviceAccount.token.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $process.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $manifestContent }}
        - name: manifest
          configMap:
            name: {{ include "spindrift.fullname" $top }}-manifest
        {{- end }}
        {{- if $process.federates }}
        - name: federated-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.audience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: token
              - configMap:
                  name: {{ $top.Values.serviceAccount.token.caConfigMap }}
                  items:
                    - key: ca.crt
                      path: ca.crt
              {{- if $top.Values.serviceAccount.token.gcpAudience }}
              - serviceAccountToken:
                  audience: {{ $top.Values.serviceAccount.token.gcpAudience | quote }}
                  expirationSeconds: {{ $top.Values.serviceAccount.token.expirationSeconds }}
                  path: gcp-token
              - configMap:
                  name: {{ include "spindrift.fullname" $top }}-federated-identity
                  items:
                    - key: gcp-credentials.json
                      path: gcp-credentials.json
              {{- end }}
        {{- end }}
{{- end }}
