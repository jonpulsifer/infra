{{/*
The installation manifest, declared by the release. A release that declares
none renders no ConfigMap; see `spindrift.manifest.content` in `_helpers.tpl`.

**A declaration seeds; it does not govern.** `loadStoredManifest` takes the
stored row whenever one exists and this document only when none does, so
editing it does nothing to a seeded installation. Rendering neither declares
nothing.

**A declaration may not restate what this chart already renders.** The refusals
below reject an operator's manifest carrying a fact this chart owns, at render
time — the earliest the two copies can be compared and the only place being
wrong is free.
*/}}
{{- if .Values.manifest }}
{{- if hasKey .Values.manifest "cloud" }}
{{- fail "manifest.cloud is not a manifest key. Federation is read from the external_account credential this chart renders — set serviceAccount.token.gcpAudience and serviceAccount.token.gcpImpersonationUrl instead — and the artifacts project and the home vessel's own project are properties of the vessel installation.homeVessel names." }}
{{- end }}
{{- if dig "charts" "installer" nil .Values.manifest }}
{{- fail "manifest.charts.installer is not a manifest key: nothing reads it. Remove it." }}
{{- end }}
{{- if hasKey .Values.manifest "controlPlane" }}
{{- fail "manifest.controlPlane is not a manifest key. The passkey relying party is read from SPINDRIFT_HOSTNAME, which this chart renders from .Values.hostname — the same value that renders the Gateway and the HTTPRoute. Remove it." }}
{{- end }}
{{- end }}
{{- $manifestContent := include "spindrift.manifest.content" . }}
{{- if $manifestContent }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spindrift.fullname" . }}-manifest
  namespace: {{ include "spindrift.namespace" . }}
  labels:
    {{- include "spindrift.labels" . | nindent 4 }}
data:
  # The filename the process looks for. It is mounted at the directory so the
  # key lands at the path `DEFAULT_MANIFEST_PATH` names.
  manifest.yaml: |-
    {{- $manifestContent | nindent 4 }}
{{- end }}
