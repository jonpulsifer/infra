# The Spindrift control plane: one image, two processes, its own database.

image: ""

# One named identity for the control plane. Both processes receive projected,
# audience-scoped credentials; the default API credential is never automounted.
serviceAccount:
  create: true
  name: ""
  token:
    audience: api
    # The GCP workload identity provider audience. Set, both processes get a second
    # projected token and an ADC `external_account` credential file.
    gcpAudience: ""
    # The service account the federated identity impersonates, as a
    # `generateAccessToken` url. Empty uses the federated identity's own grants.
    gcpImpersonationUrl: ""
    # The audience kthx accepts on its engine surface. Set, both processes get a projected
    # token at `kthx-token`, the only credential the engine sends to kthx.
    kthxAudience: ""
    expirationSeconds: 3600
    mountPath: /var/run/secrets/spindrift
    # The one file `NODE_EXTRA_CA_CERTS` reads. Node does no partial-chain verification, so it
    # needs full chains to self-signed roots, including any other cluster holding a Target.
    caConfigMap: kube-root-ca.crt

# Where the control plane's own UI is served. Empty renders no Gateway and no
# HTTPRoute, leaving the UI reachable only in-cluster.
hostname: ""

web:
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# The second process off the same image, opt-in so it rolls out apart from `web`.
reconciler:
  enabled: false
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

port: 3000

# Run every pod under gVisor. Only some nodes offer the runtime class.
sandbox: false

# Secret carrying `SPINDRIFT_ENROLMENT_TOKEN` and repository credentials.
envFromSecret: ""

# Header authentication, safe only behind a Gateway that replaces identity headers. Enabling
# it admits only `from`, a non-empty NetworkPolicyPeer list, to the web pod.
gatewayAuth:
  enabled: false
  from: []

env: []

database:
  enabled: false
  instances: 1
  size: 2Gi
  name: spindrift
  storageClass: local-path
  # Keeps the Cluster, and with it the data PVC, on uninstall. Off makes an uninstall a teardown.
  keepOnDelete: true
  # Apply the image's committed migrations with a Job, and hold both processes
  # below Ready until its journal is present.
  migration:
    enabled: true

# WAL archive and a daily base backup to Garage through the CNPG barman-cloud plugin.
backup:
  # Empty endpointURL renders no backup objects.
  endpointURL: ""
  bucket: cnpg
  # 6-field, seconds first, in UTC: 01:00-04:00 in Halifax.
  schedule: "0 40 5 * * *"
  retention: 30d
  region: garage
  # Renders the `garage-cnpg` ExternalSecret. Off when something else writes it.
  externalSecret: true
  secretStore: onepassword-connect
  # 1Password item holding the Garage keys, e.g. garage-offsite.
  item: ""
  # The prefix under the namespace's path that the Cluster archives to. Empty uses the
  # Cluster's name. A re-created Cluster takes a new one, such as `<cluster>-2`: the plugin
  # refuses to archive into a prefix that holds WAL.
  serverName: ""
  # A prefix of the same store to recover from in place of `initdb`: the serverName the
  # Cluster had before it was re-created. Read at creation only; drop it once recovered.
  recoverFrom: ""

ingress:
  enabled: true
  clusterIssuer: letsencrypt-production
  gatewayClassName: cilium
