# The installer chart's values (Task 41, §19, §20).
#
# §20 line 3: "everything naming this installation is a value in the
# installation manifest; a literal outside it is a bug." This file holds no
# installation name at all — not a zone, not a project, not a cluster. A
# release supplies the manifest document plus `hostname`, which is where this
# control plane is served; both are empty here.
#
# The installation manifest is ordinary configuration. On the first boot it is
# mounted from a ConfigMap and atomically seeds Spindrift's database; the stored
# row is authoritative afterward. Public identifiers such as a GitHub App id do
# not make the document a credential.

image: ""

# One named identity for the control plane. Kubernetes never automounts its
# default API credential: the reconciler receives one projected token with the
# peer cluster's explicit audience, while the web process receives no token.
serviceAccount:
  create: true
  name: ""
  token:
    audience: api
    # Optional GCP workload identity provider audience. When set, the
    # reconciler also receives a second projected token and an ADC-compatible
    # external-account credential file.
    gcpAudience: ""
    expirationSeconds: 3600
    mountPath: /var/run/secrets/spindrift

# Where the control plane's own UI is served. Empty renders no Gateway and no
# HTTPRoute, which is a valid installation — the UI is then reachable only
# in-cluster.
hostname: ""

# §19: "One image, two Deployments." The reconciler is the second entrypoint off
# the same image and does not exist yet, so it is off by default rather than
# rendered as a Deployment that would crash-loop on a missing module.
web:
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

reconciler:
  enabled: false
  replicas: 1
  command: "bun run src/reconciler/main.ts"
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

port: 3000
command: "bun run src/web/server.ts"

# gVisor is available on some nodes and not others; a release that wants it says
# so rather than the chart assuming a runtime class exists.
sandbox: false

# First-boot configuration only. Once the database has an installation row,
# changing this value does not overwrite it.
installationManifest: {}

# The Secret carrying `SPINDRIFT_ENROLMENT_TOKEN` and repository credentials
# when those integrations are configured. It contains credentials only.
envFromSecret: ""

# Header authentication is safe only behind a Gateway that strips and replaces
# identity headers and is the sole network path to the web pod. Enabling this
# renders a default-deny ingress NetworkPolicy, admits exactly these peers, and
# attests that boundary to the process. `from` is a list of Kubernetes
# NetworkPolicyPeer objects and must be non-empty when enabled.
gatewayAuth:
  enabled: false
  from: []

env: []

# §19: "Its chart renders its own database cluster with a keep policy,
# overridable." Off by default so the chart can be installed without CNPG; the
# offsite release turns it on.
database:
  enabled: false
  instances: 1
  size: 2Gi
  name: spindrift
  storageClass: local-path
  # There is no migration runner to point this at.
  #
  # `src/db/migrate.ts` exports `applyMigrations` and has no main, deliberately:
  # "production never calls this at runtime... a running process mutating its
  # own schema on boot is the same shape of mistake as a process mutating live
  # infrastructure. Migrations are applied as an out-of-band operator act."
  #
  # The Job template is kept because that decision is about *this* installation
  # applying its own schema on boot, not about the shape being wrong forever —
  # but enabling it today would render a Job that exits 0 having done nothing,
  # which is worse than not having one.
  migration:
    enabled: false
    command: ""

ingress:
  enabled: true
  clusterIssuer: letsencrypt-production
  gatewayClassName: cilium
