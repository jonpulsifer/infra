<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Smiirl</title>
<meta name="description" content="What the flap counter shows">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3eadb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Counter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root {
    --bg: #f3eadb;
    --bg2: #e6d9c3;
    --text: #2a2521;
    --muted: #605648;
    --card: #fbf6ec;
    --btn: #fffaf1;
    --btn-border: #cbbfab;
    --btn-shadow: #b9ac97;
    --accent: #d98a34;
    --accent-hi: #ec9c45;
    --accent-lo: #9c5d1b;
    --accent-text: #1c1006;
    --bad: #a83a30;
    --led-ok: #4ad46e;
    --led-warn: #f0b429;
    --led-bad: #e0473b;
    --focus: #2b6fd6;
    --w: clamp(48px, 14.5vw, 74px);
    --h: calc(var(--w) * 1.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917;
      --bg2: #100f0d;
      --text: #efe7d8;
      --muted: #b3a892;
      --card: #24211d;
      --btn: #2e2a25;
      --btn-border: #4c443a;
      --btn-shadow: #0d0b09;
      --bad: #f28b80;
      --focus: #8ab4f8;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg) 0%, var(--bg2) 100%) fixed;
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin: 8px 0 18px;
  }

  /* ---------- the device ---------- */
  .housing {
    position: relative;
    background: linear-gradient(180deg, #2c2c2f 0%, #1b1b1d 60%, #141416 100%);
    border-radius: 26px;
    padding: 30px 18px 26px;
    box-shadow:
      0 30px 50px -24px rgba(0,0,0,.65),
      0 2px 0 rgba(255,255,255,.06) inset,
      0 -3px 0 rgba(0,0,0,.7) inset,
      0 0 0 1px rgba(0,0,0,.6);
  }
  .housing::before {
    /* brushed sheen */
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 4px);
    pointer-events: none;
  }
  .screw {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4a4a4e, #101012);
    box-shadow: 0 1px 0 rgba(255,255,255,.08);
  }
  .screw.tl { top: 11px; left: 11px; } .screw.tr { top: 11px; right: 11px; }
  .screw.bl { bottom: 11px; left: 11px; } .screw.br { bottom: 11px; right: 11px; }

  .display {
    display: flex;
    justify-content: center;
    gap: calc(var(--w) * .1);
    padding: 12px 8px;
    border-radius: 14px;
    background: #0a0a0b;
    box-shadow: 0 2px 10px rgba(0,0,0,.9) inset, 0 1px 0 rgba(255,255,255,.05);
  }

  .digit {
    position: relative;
    width: var(--w);
    height: var(--h);
    perspective: calc(var(--w) * 5);
    font-family: inherit;
    font-size: calc(var(--w) * 1.32);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #f4eee3;
    border-radius: 6px;
    appearance: none;
    border: 0;
    padding: 0;
    margin: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .digit:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .digit:disabled { cursor: default; }
  .half, .flap {
    position: absolute; left: 0; right: 0;
    height: 50%;
    overflow: hidden;
    background: linear-gradient(180deg, #2d2d31, #212124);
    box-shadow: 0 0 0 1px rgba(0,0,0,.8) inset;
  }
  .half span, .flap span {
    position: absolute; left: 0; right: 0;
    height: var(--h);
    line-height: var(--h);
    text-align: center;
    letter-spacing: -.02em;
  }
  .striped span {
    background: repeating-linear-gradient(-45deg, currentColor 0 calc(var(--w) * .07), transparent 0 calc(var(--w) * .2));
  }
  .top, .flap-top { top: 0; border-radius: 6px 6px 0 0; }
  .bottom, .flap-bottom { bottom: 0; border-radius: 0 0 6px 6px;
    background: linear-gradient(180deg, #26262a, #1c1c1f); }
  .top span, .flap-top span { top: 0; }
  .bottom span, .flap-bottom span { bottom: 0; }
  .flap {
    visibility: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform;
  }
  .display.pending .digit { opacity: .6; }
  .flap-top { transform-origin: 50% 100%; }
  .flap-bottom { transform-origin: 50% 0%; }
  .digit::after {
    /* hinge */
    content: "";
    position: absolute; left: -2px; right: -2px; top: 50%;
    height: 3px; margin-top: -1.5px;
    background: linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.55));
    z-index: 5;
    pointer-events: none;
  }
  .digit::before {
    /* hinge pins */
    content: "";
    position: absolute; top: 50%; left: -3px; right: -3px;
    height: 10px; margin-top: -5px;
    background:
      linear-gradient(#0a0a0b, #0a0a0b) left / 4px 100% no-repeat,
      linear-gradient(#0a0a0b, #0a0a0b) right / 4px 100% no-repeat;
    z-index: 6;
    pointer-events: none;
  }

  .deck {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px; padding: 0 4px;
  }
  .led-wrap { display: flex; align-items: center; gap: 9px; color: #cfc7b8; font-size: 13px; }
  .led {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3a3a3e;
    box-shadow: 0 0 0 2px #0e0e0f, 0 1px 0 rgba(255,255,255,.05);
    transition: background .3s, box-shadow .3s;
  }
  .led.ok { background: var(--led-ok); box-shadow: 0 0 0 2px #0e0e0f, 0 0 10px var(--led-ok); }
  .led.warn { background: var(--led-warn); box-shadow: 0 0 0 2px #0e0e0f, 0 0 10px var(--led-warn); }
  .led.bad { background: var(--led-bad); box-shadow: 0 0 0 2px #0e0e0f, 0 0 10px var(--led-bad); }
  .led.busy { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .brand {
    font-size: 11px; letter-spacing: .3em; text-transform: lowercase;
    color: #6f6a62; user-select: none;
  }

  /* ---------- controls ---------- */
  .panel {
    margin-top: 22px;
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 12px 30px -20px rgba(0,0,0,.4);
  }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .btn {
    appearance: none;
    font: inherit;
    font-weight: 700;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--btn-border);
    border-radius: 14px;
    min-width: 52px;
    min-height: 56px;
    padding: 0 6px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--btn-shadow);
    transition: transform .08s, box-shadow .08s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--btn-shadow); }
  .btn:disabled { cursor: default; opacity: .55; transform: none; box-shadow: 0 3px 0 var(--btn-shadow); }
  .btn.step { font-size: 17px; flex: 0 0 auto; }
  .field {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--btn-border);
    border-radius: 14px;
    min-height: 56px;
    padding: 0 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12) inset;
  }
  .field::placeholder { color: var(--muted); font-weight: 600; opacity: 1; }
  .field.dirty { border-color: var(--accent); }
  .go {
    width: 100%;
    margin-top: 12px;
    min-height: 60px;
    font-size: 20px;
    letter-spacing: .02em;
    color: var(--accent-text);
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    border: 1px solid var(--accent-lo);
    box-shadow: 0 4px 0 var(--accent-lo), 0 1px 0 rgba(255,255,255,.35) inset;
  }
  .go:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-lo), 0 1px 0 rgba(255,255,255,.35) inset; }
  .go:disabled { box-shadow: 0 4px 0 var(--accent-lo); }
  .btn:focus-visible, .field:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .field:focus { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- daily ---------- */
  .daily-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-bottom: 10px; font-size: 15px; font-weight: 600;
  }
  .field.time { flex: 0 1 auto; width: auto; font-size: 18px; min-height: 44px; padding: 0 10px; }
  .btn.save { width: 100%; margin-top: 12px; min-height: 48px; font-size: 16px; }
  .next { margin: 12px 4px 0; font-size: 14px; line-height: 1.4; min-height: 1.4em; color: var(--muted); }

  /* ---------- modes ---------- */
  .modes {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-top: 22px; padding: 6px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 12px 30px -20px rgba(0,0,0,.4);
  }
  .modes ~ .panel { margin-top: 12px; }
  .mode {
    appearance: none;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    min-height: 48px;
    color: var(--muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .mode[aria-checked="true"] {
    color: var(--accent-text);
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    border-color: var(--accent-lo);
    box-shadow: 0 2px 0 var(--accent-lo), 0 1px 0 rgba(255,255,255,.35) inset;
  }
  .mode:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .cycle-modes { border: 0; margin: 0; padding: 0; }
  .cycle-modes legend { padding: 0 4px 10px; font-size: 15px; font-weight: 600; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pick {
    display: flex; align-items: center; gap: 7px;
    min-height: 44px; padding: 0 12px;
    font-size: 15px; font-weight: 600;
    background: var(--btn);
    border: 1px solid var(--btn-border);
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
  }
  .pick input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .pick:has(input:checked) { border-color: var(--accent-lo); box-shadow: 0 0 0 1px var(--accent-lo) inset; }
  .pick:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  #every { width: 4.5em; text-align: center; }

  .line { margin: 0 4px; font-size: 15px; font-weight: 600; line-height: 1.4; min-height: 1.4em; }

  .status { margin: 18px 4px 0; font-size: 15px; line-height: 1.4; min-height: 1.4em; }
  .msg {
    margin: 8px 4px 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    min-height: 1.4em;
  }
  .msg.bad { color: var(--bad); }
  .msg.yay { color: var(--text); }
  .hint { margin: 18px 4px 0; font-size: 13px; color: var(--muted); text-align: center; }

  .confetti {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50;
  }
  .confetti i {
    position: absolute; width: 9px; height: 13px; border-radius: 2px; display: block;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .led { transition: none; }
    .led.busy { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
<main>
  <h1>Smiirl</h1>

  <section class="housing" aria-labelledby="display-label">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
    <div class="display" id="display" role="group" aria-label="Counter, connecting"></div>
    <span id="display-label" class="sr-only">The counter</span>
    <div class="deck">
      <div class="led-wrap"><span class="led" id="led" aria-hidden="true"></span><span id="led-text" role="status">connecting…</span></div>
      <span class="brand" aria-hidden="true">smiirl</span>
    </div>
  </section>

  <div class="modes" id="modes" role="radiogroup" aria-label="What the counter shows">
    <button type="button" class="mode" role="radio" aria-checked="true" data-mode="number">Number</button>
    <button type="button" class="mode" role="radio" aria-checked="false" tabindex="-1" data-mode="clock">Clock</button>
    <button type="button" class="mode" role="radio" aria-checked="false" tabindex="-1" data-mode="days">Days</button>
    <button type="button" class="mode" role="radio" aria-checked="false" tabindex="-1" data-mode="date">Date</button>
    <button type="button" class="mode" role="radio" aria-checked="false" tabindex="-1" data-mode="countdown">Timer</button>
    <button type="button" class="mode" role="radio" aria-checked="false" tabindex="-1" data-mode="github">GitHub</button>
    <button type="button" class="mode" role="radio" aria-checked="false" tabindex="-1" data-mode="cycle">Cycle</button>
  </div>

  <form class="panel" id="form" autocomplete="off">
    <div class="row">
      <button type="button" class="btn step" data-step="-10" aria-label="Minus ten">−10</button>
      <button type="button" class="btn step" data-step="-1" aria-label="Minus one">−1</button>
      <label for="field" class="sr-only">New number, 0 to 99999</label>
      <input class="field" id="field" inputmode="numeric" pattern="[0-9]*" maxlength="5"
             value="0" aria-describedby="hint">
      <button type="button" class="btn step" data-step="1" aria-label="Plus one">+1</button>
      <button type="button" class="btn step" data-step="10" aria-label="Plus ten">+10</button>
    </div>
    <button type="submit" class="btn go" id="go" disabled>Flip it</button>
  </form>

  <section class="panel" id="clock-panel" hidden aria-label="Clock">
    <p class="line" id="clock-line"></p>
    <button type="button" class="btn save" id="hour12" aria-pressed="false">12-hour time</button>
  </section>

  <section class="panel" id="date-panel" hidden aria-label="Date">
    <p class="line" id="date-line"></p>
  </section>

  <form class="panel" id="countdown-panel" hidden autocomplete="off" aria-label="Timer">
    <div class="daily-row">
      <label for="until">Counting down to</label>
      <input type="datetime-local" class="field time" id="until" required aria-describedby="countdown-line">
    </div>
    <p class="line" id="countdown-line"></p>
  </form>

  <form class="panel" id="github-panel" hidden autocomplete="off" aria-label="GitHub">
    <div class="daily-row">
      <label for="what">Counting</label>
      <select class="field time" id="what">
        <option value="commits">commits</option>
        <option value="prs">pull requests</option>
      </select>
      <label for="user">by</label>
      <input class="field time" id="user" value="jonpulsifer" maxlength="39" required
             spellcheck="false" autocapitalize="none" autocorrect="off" aria-describedby="github-line">
    </div>
    <p class="line" id="github-line"></p>
  </form>

  <form class="panel" id="cycle-panel" hidden autocomplete="off" aria-label="Cycle">
    <fieldset class="cycle-modes">
      <legend>Rotating through</legend>
      <div class="picks" id="picks">
        <label class="pick"><input type="checkbox" value="number">Number</label>
        <label class="pick"><input type="checkbox" value="clock">Clock</label>
        <label class="pick"><input type="checkbox" value="days">Days</label>
        <label class="pick"><input type="checkbox" value="date">Date</label>
        <label class="pick"><input type="checkbox" value="countdown">Timer</label>
        <label class="pick"><input type="checkbox" value="github">GitHub</label>
      </div>
    </fieldset>
    <div class="daily-row">
      <label for="every">Each for</label>
      <input class="field time" id="every" inputmode="numeric" maxlength="4" value="5">
      <span>minutes</span>
    </div>
    <p class="line" id="cycle-line"></p>
  </form>

  <form class="panel" id="days-panel" hidden autocomplete="off" aria-label="Days">
    <div class="daily-row">
      <label for="date">Counting the days to</label>
      <input type="date" class="field time" id="date" required aria-describedby="days-line">
    </div>
    <p class="line" id="days-line"></p>
  </form>

  <form class="panel" id="daily" autocomplete="off" aria-label="Daily increment">
    <div class="daily-row">
      <label for="at">Every day at</label>
      <input type="time" class="field time" id="at" value="08:00" required>
      <label for="step">add</label>
    </div>
    <div class="row">
      <button type="button" class="btn step" data-dstep="-1" aria-label="Step minus one">−</button>
      <input class="field" id="step" maxlength="6" value="" placeholder="Off" aria-describedby="next">
      <button type="button" class="btn step" data-dstep="1" aria-label="Step plus one">+</button>
    </div>
    <button type="submit" class="btn save" id="save" disabled>Save</button>
    <p class="next" id="next"></p>
  </form>

  <p class="status" id="status"></p>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="hint" id="hint">Pick a number or tap a flap, then hit Flip it. The counter checks in every 20 seconds or so.</p>
</main>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(() => {
  "use strict";

  const MAX = 99999;
  const FLIP_MS = 130;
  const FACES = "0123456789ab"; // drum order: digits, blank, striped
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);

  // ---------- cells ----------
  const clamp = (n) => Math.min(MAX, Math.max(0, n));
  const isCells = (c) => typeof c === "string" && /^[0-9ab]{5}$/.test(c);
  const numberToCells = (n) => String(n).padStart(5, "a");
  // A canonical number is leading blanks then digits with no leading zero.
  const cellsToNumber = (c) => /^a*(0|[1-9][0-9]*)$/.test(c) ? parseInt(c.replace(/a/g, ""), 10) : null;
  const faceName = (c) => c === "a" ? "blank" : c === "b" ? "stripes" : c;
  const pretty = (c) => { const n = cellsToNumber(c); return n === null ? c.replace(/a/g, "·").replace(/b/g, "/") : n.toLocaleString(); };
  const spoken = (c) => { const n = cellsToNumber(c); return n === null ? c.split("").map(faceName).join(" ") : n.toLocaleString(); };
  const hhmm = (c) => isCells(c) && c[2] === "b" ? c.slice(0, 2).replace(/a/g, "") + ":" + c.slice(3) : pretty(c);
  const mmdd = (c) => isCells(c) && c[2] === "b" ? c.slice(0, 2) + "/" + c.slice(3) : pretty(c);
  // How the shown cells read: whatever has the drums decides, so a clock is
  // "14:30" and not "14/30", even when a cycle is what put it there.
  const shown = (c) => S.showing === "clock" || S.showing === "countdown" ? hhmm(c)
    : S.showing === "date" ? mmdd(c) : pretty(c);
  const shownSpoken = (c) => S.showing === "clock" ? "the time, " + hhmm(c)
    : S.showing === "countdown" ? hhmm(c) + " to go"
    : S.showing === "date" ? "the date, " + mmdd(c)
    : spoken(c);
  const MODES = ["number", "clock", "days", "date", "countdown", "github", "cycle"];
  const CYCLABLE = MODES.slice(0, -1);
  const NAMES = {
    number: "a number", clock: "the clock", days: "counting days", date: "the date",
    countdown: "a countdown", github: "GitHub", cycle: "a rotation",
  };
  const HINTS = {
    number: "Pick a number or tap a flap, then hit Flip it. The counter checks in every 20 seconds or so.",
    clock: "The flaps follow the clock. The counter checks in every 20 seconds or so.",
    days: "Pick a date and the counter counts the days to it, one flip a day.",
    date: "Today's date, month and day. One flip a day.",
    countdown: "Hours and minutes left. The drums stop at 99:59 and rest at 00:00.",
    github: "A public count from GitHub's search, checked every five minutes.",
    cycle: "The counter takes each of these in turn.",
  };
  const LABELS = ["until", "since", "today"];
  const p2 = (n) => String(n).padStart(2, "0");
  const isDate = (v) => typeof v === "string" && /^(19[7-9]\d|2[01]\d\d)-\d\d-\d\d$/.test(v); // a year still being typed is not a date

    let text = "";
    if (d && !d.step) text = "Off. The number only changes when someone flips it.";
    else if (d && typeof d.next === "string" && !isNaN(Date.parse(d.next))) {
      const when = new Date(d.next);
      const shows = n === null ? "skipped while the flaps aren't a number" : `shows ${clamp(n + d.step).toLocaleString()}`;
      text = `Next: ${dayWord(when)} at ${when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} → ${shows}`;
    }
    nextEl.textContent = text;
  }
  async function saveDaily() {
    if (S.savingDaily) return;
    const step = parseStep(), at = atEl.value;
    if (step === null) { say("The step has to be a whole number.", "bad"); return; }
    if (!/^\d\d:\d\d$/.test(at)) { say("Pick a time of day.", "bad"); return; }
    atEl.blur(); stepEl.blur();
    S.savingDaily = true;
    S.lastDailyAt = Date.now();
    syncSave();
    try {
      const r = await fetch("/api/daily", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ step, at }),
        signal: AbortSignal.timeout(6000),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
      S.lastDailyAt = Date.now();
      S.savingDaily = false;
      applyDaily(Number.isInteger(body.step) ? body : { step, at, next: null });
      say(step ? "Saved. The counter will count on its own." : "Saved. The counter stays put unless someone flips it.");
    } catch (e) {
      S.savingDaily = false;
      failMsg(e);
    }
    renderDaily();
  }

  // ---------- delight ----------
  function celebrate(cells) {
    say(`The counter got it! It's showing ${shown(cells)} now.`, "yay");
    if (reduceMotion()) return;
    document.querySelector(".housing").animate(
      [{ transform: "translateY(0)" }, { transform: "translateY(-7px) scale(1.01)" }, { transform: "translateY(0)" }],
      { duration: 420, easing: "ease-out" });
    const box = $("confetti");
    const rect = display.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const colors = ["#ec9c45", "#f4eee3", "#e0473b", "#4ad46e", "#8ab4f8", "#f0b429"];
    for (let i = 0; i < 36; i++) {
      const p = el("i");
      p.style.left = cx + "px";
      p.style.top = cy + "px";
      p.style.background = colors[i % colors.length];
      box.appendChild(p);
      const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 220;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist * .6 - 80;
      const spin = (Math.random() - .5) * 1080;
      p.animate([
        { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx * .7}px, ${dy}px) rotate(${spin * .5}deg)`, opacity: 1, offset: .5 },
        { transform: `translate(${dx}px, ${dy + 260}px) rotate(${spin}deg)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" })
        .finished.then(() => p.remove(), () => p.remove());
    }
  }

  // ---------- wiring ----------
  digits.forEach((d, i) => {
    const nudge = (delta) => {
      if (S.draft === null || mode() !== "number") return;
      const f = (FACES.indexOf(S.draft[i]) + delta + FACES.length) % FACES.length;
      setDraft(S.draft.slice(0, i) + FACES[f] + S.draft.slice(i + 1));
    };
    d.el.addEventListener("click", () => nudge(1));
    d.el.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") nudge(1);
      else if (e.key === "ArrowDown") nudge(-1);
      else if (e.key === "Escape" && S.cells !== null) setDraft(S.cells);
      else return;
      e.preventDefault();
    });
  });
  for (const b of document.querySelectorAll("[data-step]")) {
    b.addEventListener("click", () => {
      const base = cellsToNumber(S.draft ?? "") ?? number() ?? 0;
      setDraft(numberToCells(clamp(base + Number(b.dataset.step))));
    });
  }
  field.addEventListener("input", () => {
    const cleaned = field.value.replace(/\D/g, "").slice(0, 5);
    if (cleaned !== field.value) field.value = cleaned;
    if (S.cells === null) return;
    setDraft(cleaned === "" ? S.cells : numberToCells(clamp(parseInt(cleaned, 10))), true);
  });
  field.addEventListener("blur", () => { if (S.draft !== null) setDraft(S.draft); });
  field.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.cells !== null) { setDraft(S.cells); field.blur(); }
  });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (S.cells === null) { say("Still connecting to the counter's server."); return; }
    if (!dirty()) { say("It's already showing that."); return; }
    field.blur();
    send(S.draft);
  });

  for (const b of document.querySelectorAll("[data-dstep]")) {
    b.addEventListener("click", () => {
      setStepField(clampStep((parseStep() ?? 0) + Number(b.dataset.dstep)));
      syncSave();
    });
  }
  stepEl.addEventListener("input", syncSave);
  stepEl.addEventListener("blur", () => { setStepField(parseStep() ?? (S.daily ? S.daily.step : 0)); syncSave(); });
  atEl.addEventListener("input", syncSave);
  atEl.addEventListener("change", syncSave);
  for (const i of [stepEl, atEl]) {
    i.addEventListener("keydown", (e) => { if (e.key === "Escape") { resetDaily(); i.blur(); } });
  }
  $("daily").addEventListener("submit", (e) => { e.preventDefault(); saveDaily(); });

  for (const b of modeBtns) {
    b.addEventListener("click", () => {
      const m = b.dataset.mode;
      if (m === S.mode) return;
      const opts = optsFor(m);
      if (m === "github" && !opts) { userEl.focus(); say("Type a GitHub login first."); return; }
      setMode(m, opts);
    });
  }
  hour12Btn.addEventListener("click", () => setMode("clock", { hour12: !S.clock12 }));

  const untilChanged = settles(() => {
    const v = untilEl.value.slice(0, 16);
    if (isMinute(v) && v !== (S.countdown || {}).at) setMode("countdown", { at: v });
  }, 400);
  for (const e of ["input", "change"]) untilEl.addEventListener(e, untilChanged);

  const githubChanged = settles(() => {
    const user = userEl.value.trim(), what = whatEl.value, g = S.github || {};
    if (isUser(user) && (user !== g.user || what !== g.what)) setMode("github", { user, what });
  }, 600);
  for (const e of ["input", "change"]) userEl.addEventListener(e, githubChanged);
  whatEl.addEventListener("change", githubChanged);
  $("github-panel").addEventListener("submit", (e) => { e.preventDefault(); userEl.blur(); githubChanged(); });

  const cycleChanged = settles(() => {
    const modes = pickBoxes.filter((b) => b.checked).map((b) => b.value);
    if (modes.length < 2) { say("Tick at least two modes to rotate through."); return; }
    setMode("cycle", { modes, every: everyNum() });
  }, 400);
  for (const b of pickBoxes) b.addEventListener("change", cycleChanged);
  for (const e of ["input", "change"]) everyEl.addEventListener(e, cycleChanged);
  $("cycle-panel").addEventListener("submit", (e) => { e.preventDefault(); everyEl.blur(); cycleChanged(); });
  $("modes").addEventListener("keydown", (e) => {
    const i = modeBtns.indexOf(document.activeElement);
    if (i < 0) return;
    let j;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") j = (i + 1) % modeBtns.length;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") j = (i + modeBtns.length - 1) % modeBtns.length;
    else return;
    e.preventDefault();
    modeBtns[j].click();
    if (S.mode === modeBtns[j].dataset.mode) modeBtns[j].focus();
  });
  function dateChanged() {
    clearTimeout(dateTimer);
    dateTimer = setTimeout(() => {
      dateTimer = 0;
      if (S.switching) return; // setMode re-sends the date once the in-flight request settles
      const v = dateEl.value;
      if (isDate(v) && v !== (S.days && S.days.date)) setMode("days", v);
    }, 400);
  }
  dateEl.addEventListener("input", dateChanged);
  dateEl.addEventListener("change", dateChanged);
  dateEl.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { clearTimeout(dateTimer); dateTimer = 0; if (S.days) dateEl.value = S.days.date; dateEl.blur(); }
  });
  $("days-panel").addEventListener("submit", (e) => { e.preventDefault(); clearTimeout(dateTimer); dateTimer = 0; dateEl.blur(); if (isDate(dateEl.value) && dateEl.value !== (S.days && S.days.date)) setMode("days", dateEl.value); });

  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  // Installed, the page opens from cache and fills in once it reaches the
  // server; without a service worker it is simply a web page as before.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

  renderStatus();
  refresh();
})();
</script>
</body>
</html>
