<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Spindrift</title>
    <!--
      The stored theme, stamped before the stylesheet is even fetched.

      `data-theme="dark"` used to be typed on the element above, which made the
      shipped default a fact about the document rather than about the
      stylesheet: a reader who chose light got a dark page until `main.tsx`
      called `restoreTheme()`, and a module script runs after the document is
      parsed. Blocking and inline is the only position that paints once.

      It agrees with `theme.ts` deliberately, including the awkward part: the
      absence of the attribute *is* the `system` choice, so `system` removes
      nothing and stamps nothing, while a missing or unreadable value falls back
      to the shipped dark. `restoreTheme()` stays where it is as the path for a
      browser that refused this script.
    -->
    <script>
      try {
        const choice = localStorage.getItem("spindrift.theme");
        if (choice !== "system") {
          document.documentElement.setAttribute(
            "data-theme",
            choice === "light" ? "light" : "dark",
          );
        }
      } catch {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <!--
      The rail's mark, so the tab wears it too. A favicon cannot read the
      stylesheet, so the two fills restate the accent and on-accent tokens
      from styles.css for each scheme; change them together. It cannot read
      the stored theme either — the OS scheme is the only signal reaching its
      media query, so a tab whose page is forced dark can wear the light mark.
      That is the right disagreement: the tab bar around the icon is the OS's
      surface, not this page's.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><style>rect{fill:%2316707f}text{fill:%23ffffff}@media(prefers-color-scheme:dark){rect{fill:%2359b8c6}text{fill:%2307171b}}</style><rect width='32' height='32' rx='6'/><text x='16' y='24' font-family='ui-monospace,monospace' font-size='22' font-weight='900' text-anchor='middle'>S</text></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
