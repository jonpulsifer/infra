# The `04` shape as a chart-seeded installation's stored row holds it: every
# key current, and `github.buildWorkflow` carrying the seed document's
# placeholder ref instead of an operator's pin.
#
# That value is not inert the way `spindrift.example.com` is. `connectRepository`
# writes it into a caller workflow inside connected repositories, and it names a
# repository this project does not own — so `manifest-upgrade.ts` nulls exactly
# this string, and only this string, on the way through validation. This file is
# what proves that scrub is load-bearing: it boots, the row is rewritten with
# `buildWorkflow: null`, and nothing else about the document moves.
#
# `installation.name` differs from every declaration this suite mounts, for the
# reason `01` gives.
installation:
  name: stored-with-chart-placeholder-workflow
  controlPlaneVessel: cluster
  homeVessel: cloud

controlPlane:
  hostname: spindrift.example.test

auth:
  gateway: null

dns:
  zones:
    private: apps.example.test
    public: example.test

sources:
  buckets:
    - example-source-bucket

charts:
  app: example/spindrift-app

supplyChain:
  registry: registry.example.test/artifacts
  verifier: verifier.example.test
  signer: gcpkms://projects/example-artifacts/locations/example-region/keyRings/keys/cryptoKeys/signer

github:
  clientId: Iv1.example
  oauthBaseUrl: https://git.example.test
  apiBaseUrl: https://api.git.example.test
  buildWorkflow: spindrift/infra/.github/workflows/spindrift-build.yml@0a7d0ea0ca5c9963eea1104c5802a8af2901d4b6

build:
  routes:
    - name: hosted
      adapter: github-actions
  zeroConfigFrontend: registry.example.test/zero-config:pinned

secretStore:
  adapter: gcp-secret-manager
  endpoint: https://secrets.example.test

vessels:
  - name: cluster
    kind: cluster
    location:
      apiServer: https://cluster.example.test
    reachableRegistries:
      - registry.example.test
    servedHosts:
      - apps.example.test
  - name: cloud
    kind: gcp-project
    location:
      project: example-vessel
    reachableRegistries:
      - mirror.example.test
    servedHosts:
      - hosting.example.test
      - run.example.test
    # The shared services, on the one vessel that holds them. Only the vessel
    # `installation.homeVessel` names may carry this block, and it must.
    shared:
      sourceBucket: example-source-bucket
      artifactsProject: example-artifacts
      secretStoreContainer: example-secrets

targets:
  - vessel: cluster
    adapter: kubernetes
    reaches: [none, private]
    authReaches: [private]
    connection:
      namespace: apps
      delivery:
        flavour: flux-helmrelease
        namespace: apps
        sourceRef:
          name: infra
          namespace: flux-system
      chartValues:
        platform:
          gateway:
            name: cluster-gateway
            namespace: gateway
  - vessel: cloud
    adapter: cloudrun
    connection:
      region: example-region
      endpoint: https://run.example.test
      serviceAccount: runtime@example-vessel.iam.gserviceaccount.com
  - vessel: cloud
    adapter: static
    connection:
      endpoint: https://hosting.example.test
