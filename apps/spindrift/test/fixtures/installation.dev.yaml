# Local development manifest with localhost hostname for WebAuthn passkeys
installation: dev

controlPlane:
  hostname: localhost

auth:
  gateway: null

dns:
  apexZone: apps.example.test
  vanityZone: example.test

cloud:
  artifactsProject: example-artifacts
  homeVesselProject: example-home
  # Federation comes from the external_account credential the deployment mounts,
  # named by GOOGLE_APPLICATION_CREDENTIALS. A local run that sets neither has
  # no cloud Targets, which is a supported installation.

charts:
  app: example/spindrift-app

supplyChain:
  registry: registry.example.test/artifacts
  verifier: verifier.example.test

github:
  clientId: Iv1.example
  oauthBaseUrl: https://git.example.test
  apiBaseUrl: https://api.git.example.test
  buildWorkflow: example/platform/.github/workflows/spindrift-build.yml@4bf1f21a7c1e2d3b5a6f708192a3b4c5d6e7f809

build:
  routes:
    - name: hosted
      adapter: github-actions
  zeroConfigFrontend: registry.example.test/zero-config:pinned

secretStore:
  adapter: gcp-secret-manager
  endpoint: https://secrets.example.test
  container: example-secrets

targets:
  - name: cluster
    adapter: kubernetes
  - name: cloud
    adapter: cloudrun
  - name: hosting
    adapter: static
