[package]
name = "fml-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Independent Rust implementation of the FML derivation spec, for differential testing against apps/fml-ceremony"
publish = false

[[bin]]
name = "fml-derive"
path = "src/main.rs"

# Rust's std ships no crypto, so these are load-bearing where the Go side uses
# its standard library. Pinned exactly: a differential check that silently
# floats its own primitives is not a check.
[dependencies]
hkdf = "=0.13.0"
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
x25519-dalek = "=3.0.0"

[profile.release]
opt-level = 2
