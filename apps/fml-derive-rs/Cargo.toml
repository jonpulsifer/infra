[package]
name = "fml-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Independent Rust implementation of the FML derivation spec, for differential testing against apps/fml-ceremony"
publish = false

[[bin]]
name = "fml-derive"
path = "src/main.rs"

# std has no crypto. Exact pins keep the differential check's primitives fixed.
[dependencies]
hkdf = "=0.13.0"
sha2 = "=0.11.0"
ed25519-dalek = "=3.0.0"
x25519-dalek = "=3.0.0"

[profile.release]
opt-level = 2
