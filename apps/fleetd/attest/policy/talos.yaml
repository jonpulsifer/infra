# What a machine's replayed event log must show before fleetd issues it an LDevID.
# Certificates are named by the SHA-256 of their DER. policy_test.go checks the FML entries
# against clusters/folly/talos/secureboot/*.der, and that riptide's real event log
# (testdata/riptide-eventlog.bin, a Secure Boot disk boot of Talos) passes every rule but
# required_authorities, which only a HookOS boot meets.
pcrs: [0, 1, 2, 3, 4, 5, 6, 7]
secure_boot: true
# PCR 7's PK: only the lab's.
platform_keys:
  - 1107cfed4ca6ed7b22be9c8a8cbc6ebefd84fddcb3938aa37744983838c604b4
# The lab's KEK and Microsoft's two, which db.auth's enrollment keeps.
key_exchange_keys:
  - 1107cfed4ca6ed7b22be9c8a8cbc6ebefd84fddcb3938aa37744983838c604b4
  - a1117f516a32cefcba3f2d1ace10a87972fd6bbe8fe0d0b996e09e65d802a503
  - 3cd3f0309edae228767a976dd40d9f4affc4fbd5218f2e8cc3c9dd97e8ac6f9d
db:
  required:
    - 1107cfed4ca6ed7b22be9c8a8cbc6ebefd84fddcb3938aa37744983838c604b4
    - de56de1333f9760816058fbc5d02d9ae4295321dbc26341eb266ee35cb6cccc0
  # Microsoft's UEFI certificates stay in db for option ROMs.
  allowed:
    - 48e99b991f57fc52f76149599bff0a58c47154229b9f8d603ac40d3500248507
    - e5be3e64c6e66a281457ecdece0d6d0787577aad2a3a0144262c10c14ba8d8f1
    - f6124e34125bee3fe6d79a574eaa7b91c0e7bd9d929c1a321178efd611dad901
# Option ROMs and firmware drivers load before the separator and may use Microsoft's certificates.
pre_separator_authorities:
  - 48e99b991f57fc52f76149599bff0a58c47154229b9f8d603ac40d3500248507
  - e5be3e64c6e66a281457ecdece0d6d0787577aad2a3a0144262c10c14ba8d8f1
  - f6124e34125bee3fe6d79a574eaa7b91c0e7bd9d929c1a321178efd611dad901
# After the separator only the lab's keys may verify a boot application: the UKI key signs the
# netboot iPXE, the HookOS key signs HookOS. A shim or anything else Microsoft signed fails here.
authorities:
  - 1107cfed4ca6ed7b22be9c8a8cbc6ebefd84fddcb3938aa37744983838c604b4
  - de56de1333f9760816058fbc5d02d9ae4295321dbc26341eb266ee35cb6cccc0
required_authorities:
  - de56de1333f9760816058fbc5d02d9ae4295321dbc26341eb266ee35cb6cccc0
# A renewal comes from the running node, whose boot application is the Talos UKI, so no authority
# is required beyond the authorities list above. Name the UKI key here to pin it.
renew_required_authorities: []
# Pin the signed iPXE and HookOS UKI by Authenticode SHA-256 once the first HookOS attest shows
# them (the verdict journal lists each PCR 4 boot application). Empty means not checked.
boot_applications: []
names:
  1107cfed4ca6ed7b22be9c8a8cbc6ebefd84fddcb3938aa37744983838c604b4: FML Secure Boot
  de56de1333f9760816058fbc5d02d9ae4295321dbc26341eb266ee35cb6cccc0: FML HookOS Secure Boot
  a1117f516a32cefcba3f2d1ace10a87972fd6bbe8fe0d0b996e09e65d802a503: Microsoft Corporation KEK CA 2011
  3cd3f0309edae228767a976dd40d9f4affc4fbd5218f2e8cc3c9dd97e8ac6f9d: Microsoft Corporation KEK 2K CA 2023
  48e99b991f57fc52f76149599bff0a58c47154229b9f8d603ac40d3500248507: Microsoft Corporation UEFI CA 2011
  e5be3e64c6e66a281457ecdece0d6d0787577aad2a3a0144262c10c14ba8d8f1: Microsoft Option ROM UEFI CA 2023
  f6124e34125bee3fe6d79a574eaa7b91c0e7bd9d929c1a321178efd611dad901: Microsoft UEFI CA 2023
