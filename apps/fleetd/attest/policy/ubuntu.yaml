# The profile of the ubuntu class: talos.yaml, except that the boot path may use stock shim.
# Firmware verifies Canonical's shim with a Microsoft UEFI CA, and shim verifies GRUB and the
# kernel with Canonical's Master CA, which PCR 7 records from MokListRT. The class trusts at the
# CA level and pins no shim, GRUB or kernel digest, since apt replaces all three. dbx and the
# SBAT level are read at attestation and alert on a change.
