# A stored manifest as this build writes one: `11` with the App chart named
# `kthx-app`. The chart publishes under that name from 0.6.0; a document naming
# `spindrift-app` is upgraded by `renameAppChart`.
installation:
  name: stored-without-control-plane
  controlPlaneVessel: cluster
  homeVessel: cloud

auth:
  gateway: null

dns:
  zones:
    - name: apps.example.test
      reaches: [private]
    - name: example.test
      reaches: [public]

sources:
  buckets:
    - example-source-bucket

charts:
  app: example/kthx-app

supplyChain:
  registry: registry.example.test/artifacts
  verifier: verifier.example.test
  signer: gcpkms://projects/example-artifacts/locations/example-region/keyRings/keys/cryptoKeys/signer

github:
  webBaseUrl: https://git.example.test
  apiBaseUrl: https://api.git.example.test
  buildWorkflow: jonpulsifer/infra/.github/workflows/spindrift-build.yml@main

build:
  routes:
    - name: hosted
      adapter: github-actions
  zeroConfigFrontend: registry.example.test/zero-config:pinned

secretStore:
  adapter: gcp-secret-manager
  endpoint: https://secrets.example.test

vessels:
  - name: cluster
    kind: cluster
    location:
      apiServer: https://cluster.example.test
    reachableRegistries:
      - registry.example.test
    servedHosts:
      - apps.example.test
  - name: cloud
    kind: gcp-project
    location:
      project: example-vessel
    reachableRegistries:
      - mirror.example.test
    servedHosts:
      - hosting.example.test
      - run.example.test
    # The shared services, on the one vessel that holds them. Only the vessel
    # `installation.homeVessel` names may carry this block, and it must.
    shared:
      sourceBucket: example-source-bucket
      artifactsProject: example-artifacts
      secretStoreContainer: example-secrets

targets:
  - vessel: cluster
    adapter: kubernetes
    reaches: [none, private]
    authReaches: [private]
    connection:
      namespace: apps
      delivery:
        flavour: flux-helmrelease
        namespace: apps
        sourceRef:
          name: infra
          namespace: flux-system
      chartValues:
        platform:
          gateway:
            name: cluster-gateway
            namespace: gateway
  - vessel: cloud
    adapter: cloudrun
    connection:
      region: example-region
      endpoint: https://run.example.test
      serviceAccount: runtime@example-vessel.iam.gserviceaccount.com
  - vessel: cloud
    adapter: static
    connection:
      endpoint: https://hosting.example.test
