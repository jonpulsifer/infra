ass=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="258.5" y="577.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="258.5" dy="0">HookOS proves identity and boot state to fleetd</tspan><tspan x="258.5" dy="23">Record the MAC and check admission policy</tspan></text></g><g class="Y2hvb3Nl"><g class="shape" ><rect x="51" y="696" width="416" height="131" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="259" y="738.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="259" dy="0">fleetd creates the first-install Workflow</tspan><tspan x="259" dy="21.5">Class selects template and installer</tspan><tspan x="259" dy="21.5">Device fields select disk and configuration</tspan><tspan x="259" dy="21.5">Admission supplies the install code</tspan></text></g><g class="aW5zdGFsbA=="><g class="shape" ><rect x="46" y="897" width="425" height="91" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="258.5" y="939.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="258.5" dy="0">The machine executes the workflow</tspan><tspan x="258.5" dy="23">Check disk -&gt; wipe -&gt; install Talos -&gt; reboot</tspan></text></g><g class="ZmluaXNo"><g class="shape" ><rect x="12" y="1058" width="494" height="111" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="259" y="1100.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="259" dy="0">Talos fetches configuration from fleetd</tspan><tspan x="259" dy="22">NetBox becomes active after delivery</tspan><tspan x="259" dy="22">Cluster join, readiness and SPIRE follow separately</tspan></text></g><g class="KHJlY2VpdmUgLSZndDsgcmVjb3JkKVswXQ=="><marker id="mk-d2-2536538789-3488378134" markerWidth="10" markerHeight="12" refX="7" refY=