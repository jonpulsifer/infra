---
creation_rules:
  - path_regex: clusters/.*\.sops\.ya?ml
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
  # Bare NixOS host secrets are decrypted by sops-nix on the host itself.
  # Keep each file scoped to its own SSH-host-derived age recipient.
  - path_regex: nix/secrets/oldschool\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # oldschool (ssh-to-age of its ed25519 host key)
          - age1apj76svz7gq7uk9w702fv589s2vcu2vfrayx0uucrkrjwl7xcqaqv6g50c
  - path_regex: nix/secrets/optiplex\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # optiplex (ssh-to-age of its ed25519 host key)
          - age1h834eptxf3k24x2splezey7qwlcmey4hysr3a5eccsnhf5z4r9ts8kw5x9
  - path_regex: nix/secrets/retrofit\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # retrofit (ssh-to-age of its ed25519 host key)
          - age1lsh940ctw2v0lmyeqnk3qgh0p57rp0ffh84vc3hg609v84mqfq2sudzcgz
  # forge: only the operator's age key for now. The host's own
  # ssh-to-age recipient is added on first boot, mirroring how
  # oldschool/optiplex/retrofit got theirs -- `ssh forge.lolwtf.ca cat
  # /etc/ssh/ssh_host_ed25519_key.pub | ssh-to-age` then
  # `sops -r --add-age <pub> nix/secrets/forge.sops.yaml`.
  - path_regex: nix/secrets/forge\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
