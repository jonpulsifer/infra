---
creation_rules:
  - path_regex: clusters/.*\.sops\.ya?ml
    encrypted_regex: "^(data|stringData)$"
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
  # Bare NixOS host secrets are decrypted by sops-nix on the host itself.
  # Keep each file scoped to its own SSH-host-derived age recipient.
  - path_regex: nix/secrets/oldschool\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # oldschool (ssh-to-age of its ed25519 host key)
          - age1apj76svz7gq7uk9w702fv589s2vcu2vfrayx0uucrkrjwl7xcqaqv6g50c
  - path_regex: nix/secrets/riptide\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # riptide (ssh-to-age of its ed25519 host key)
          - age15ylde96ar2x0q5gzqrxhkheh5puwtqf0rkuv6khgsv3xfhqu35hquw70ym
  # Shared across bosun's two hosts, unlike the rest of this section: it
  # holds bosun's own key on the Spindrift+bosun GitHub App, and both
  # riptide and oldschool read it directly.
  - path_regex: nix/secrets/bosun\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # riptide (ssh-to-age of its ed25519 host key)
          - age15ylde96ar2x0q5gzqrxhkheh5puwtqf0rkuv6khgsv3xfhqu35hquw70ym
          # oldschool (ssh-to-age of its ed25519 host key)
          - age1apj76svz7gq7uk9w702fv589s2vcu2vfrayx0uucrkrjwl7xcqaqv6g50c
  # The cloud bosun fleet. Stage one: operator key only, because a host's age
  # recipient is derived from an ed25519 host key that does not exist until the
  # instance has booted once. Stage two adds each recipient below and
  # re-encrypts -- see [[Runbooks/SOPS Secrets and Age Keys]].
  - path_regex: nix/secrets/tender\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
  - path_regex: nix/secrets/dinghy\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
  - path_regex: nix/secrets/launch\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
  - path_regex: nix/secrets/optiplex\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # optiplex (ssh-to-age of its ed25519 host key)
          - age1h834eptxf3k24x2splezey7qwlcmey4hysr3a5eccsnhf5z4r9ts8kw5x9
  - path_regex: nix/secrets/retrofit\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # retrofit (ssh-to-age of its ed25519 host key)
          - age1lsh940ctw2v0lmyeqnk3qgh0p57rp0ffh84vc3hg609v84mqfq2sudzcgz
  - path_regex: nix/secrets/forge\.sops\.ya?ml
    key_groups:
      - age:
          - age1lpfxcn6qwrgtxzymzcxqu20cppsrhmgcpma59sc8ahq9t0w67d3sj8e3e6
          # forge (ssh-to-age of its ed25519 host key)
          - age1x2zrt0atyzhc05eg6sdq7ce06y24g5tz8keqzy658jtz9n93x92qj4h0ns
