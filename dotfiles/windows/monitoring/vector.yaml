# Windows Event Log into the folly cluster's VictoriaLogs.
#
# Deployed to C:\Program Files\Vector\config\vector.yaml by
# Install-Monitoring.ps1. The source and sink are deliberately the same shape
# the in-cluster agent uses (clusters/base/monitoring/vector.yaml), so these
# lines land in the same store, under the same stream labels, and the Grafana
# datasource that already reads cluster logs reads these too.
data_dir: C:\ProgramData\vector

sources:
  windows_events:
    type: windows_event_log
    channels: [System, Application]
    # Start from now. Flip to true once, deliberately, to pull in the backlog;
    # leaving it on replays the whole log every time the checkpoint is lost.
    read_existing_events: false

transforms:
  identify:
    type: remap
    inputs: [windows_events]
    source: |
      .host = get_hostname!()

sinks:
  victoria_logs:
    type: loki
    inputs: [identify]
    # Stops at /insert on purpose. The loki sink appends /loki/api/v1/push
    # itself; spelling the full path here posts it twice and VictoriaLogs
    # answers 400 unsupported path.
    endpoint: https://logs.lolwtf.ca/insert
    tenant_id: "1"
    encoding:
      codec: json
    dangerously_allow_unconfined_template_resolution: true
    labels:
      job: windows-eventlog
      host: "{{ host }}"
      channel: "{{ channel }}"
      level: "{{ level }}"
