# Ships the Windows Event Log to the folly cluster's VictoriaLogs through the loki
# sink that clusters/base/monitoring/vector.yaml uses. Install-Monitoring.ps1 installs it.
data_dir: C:\ProgramData\vector

sources:
  windows_events:
    type: windows_event_log
    channels: [System, Application]
    # true replays the whole log every time the checkpoint is lost.
    read_existing_events: false

transforms:
  identify:
    type: remap
    inputs: [windows_events]
    source: |
      .host = get_hostname!()
      # VictoriaLogs reads the log line from `_msg`. The source puts the
      # rendered event text in `message`, and without the move every entry
      # stores the literal "missing _msg field; see ..." placeholder as its
      # line, which is what a logs panel shows.
      ._msg = del(.message)

sinks:
  victoria_logs:
    type: loki
    inputs: [identify]
    # The loki sink appends /loki/api/v1/push itself.
    endpoint: https://logs.lolwtf.ca/insert
    tenant_id: "1"
    encoding:
      codec: json
    dangerously_allow_unconfined_template_resolution: true
    labels:
      job: windows-eventlog
      host: "{{ host }}"
      channel: "{{ channel }}"
      level: "{{ level }}"
