[vars]
# mise.work.toml overrides these when MISE_ENV=work. Keys stay flat because mise
# [vars] has no nested tables.
git_name = "Jonathan Pulsifer"
git_github_user = "jonpulsifer"
git_email = "jonathan@pulsifer.ca"
git_signingkey = "~/.ssh/id_ed25519"
git_signingkey_wsl = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJewr6lJtffl+uZpnWXTIE5Sd3VeytQRGXKMBv1s5R/v"
gpg_darwin_program = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
gpg_wsl_program = "/mnt/c/Users/jonat/AppData/Local/Microsoft/WindowsApps/op-ssh-sign-wsl.exe"
# Empty unless mise.work.toml sets them.
work_ssh_prefix = ""
work_instead_of = ""

[tasks.bootstrap]
description = "Auto-detect OS and delegate to bootstrap:macos, :linux or :windows"
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  mise run bootstrap:macos
else
  mise run bootstrap:linux
fi
'''
# mise runs run_windows in place of run on Windows.
run_windows = "mise run bootstrap:windows"

[tasks."bootstrap:macos"]
description = "macOS bootstrap: Homebrew bundle + symlink dotfiles"
run = [
  "if command -v brew >/dev/null 2>&1; then brew bundle install --no-upgrade --file '{{config_root}}/Brewfile'; fi",
  "mise run dotfiles:deploy",
]

[tasks."bootstrap:linux"]
description = "Linux bootstrap: symlink dotfiles"
run = [
  "mise run dotfiles:deploy",
]

[tasks."bootstrap:windows"]
description = "Windows bootstrap: install tools, symlink dotfiles, install PowerShell modules"
# The default inline shell on Windows is cmd /c.
shell = "pwsh -c"
run = [
  # On Windows only mise installs the shell tooling.
  "mise install",
  "& '{{config_root}}/windows/deploy-dotfiles.ps1'",
]

[tasks."dotfiles:deploy"]
description = "Symlink dotfiles into $HOME"
run = "bash {{config_root}}/scripts/deploy-dotfiles.sh"
run_windows = "pwsh -NoProfile -File '{{config_root}}/windows/deploy-dotfiles.ps1'"

[tasks."dotfiles:check"]
description = "Resolve every dotfiles link without touching the filesystem"
run = "bash {{config_root}}/scripts/deploy-dotfiles.sh --dry-run"
run_windows = "pwsh -NoProfile -File '{{config_root}}/windows/deploy-dotfiles.ps1' -DryRun"

[tasks."pi:setup"]
description = "Install the mate pi package and seed pi's settings on this workstation"
# The seed fills only missing keys, so pi's own writes and local edits stay.
# The package provides pi's extensions, prompts and themes, so the cleanup
# removes links into dotfiles/.pi/agent and copies of this repo's files from
# them, and leaves what other tools write there.
run = '''
dotfiles="$HOME/.dotfiles"
pkg="$dotfiles/pi/mate"
agent="${PI_CODING_AGENT_DIR:-$HOME/.pi/agent}"
settings="$agent/settings.json"
mkdir -p "$agent"
[ -f "$settings" ] || printf '{}\n' > "$settings"
jq empty "$settings"
if jq -e '.packages // [] | map(.source? // .) | index("npm:pi-mcp-adapter")' "$settings" >/dev/null; then
  pi remove npm:pi-mcp-adapter
fi
pi install "$pkg"
tmp="$(mktemp "$settings.XXXXXX")"
if jq -s '.[1] * .[0]' "$settings" '{{config_root}}/pi/settings.seed.json' > "$tmp"; then
  mv "$tmp" "$settings"
else
  rm -f "$tmp"
  exit 1
fi

# A file matches the package's copy, or a version git history holds at the
# old path, which the package's copy may have moved on from.
shipped() {
  name="$(basename "$2")"
  [ -f "$pkg/$1/$name" ] && cmp -s "$2" "$pkg/$1/$name" && return 0
  blob="$(git hash-object "$2")" || return 1
  git -C "$dotfiles" log --format= --raw --no-abbrev --no-renames -- ".pi/agent/$1/$name" 2>/dev/null |
    grep -qF " $blob "
}
for kind in extensions prompts themes; do
  dir="$agent/$kind"
  if [ -L "$dir" ]; then
    case "$(readlink "$dir")" in
    */dotfiles/.pi/agent/*)
      rm "$dir"
      mkdir "$dir"
      echo "Removed the link $dir from the old deploy"
      ;;
    esac
  fi
  if [ -L "$dir" ] || [ ! -d "$dir" ]; then
    continue
  fi
  for entry in "$dir"/*; do
    if [ -L "$entry" ]; then
      case "$(readlink "$entry")" in
      */dotfiles/.pi/agent/*)
        rm "$entry"
        echo "Removed the link $entry from the old deploy"
        ;;
      esac
    elif [ -f "$entry" ] && shipped "$kind" "$entry"; then
      rm "$entry"
      echo "Removed $entry, a copy of the package's $kind/$(basename "$entry")"
    fi
  done
done
'''
# pi's agent directory and the cleanup above assume a POSIX shell.
run_windows = "echo pi:setup runs on Linux and macOS only 1>&2 & exit 1"
