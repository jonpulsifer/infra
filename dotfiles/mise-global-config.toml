[settings]
experimental = true
minimum_release_age_excludes = ["claude-code", "codex", "pi", "opencode"]

[env]
_.file = { path = '~/.config/mise/secrets.env', redact = true }

[tools]
bun = "latest"
helix = "latest"
herdr = "latest"
worktrunk = "latest"

kubectl = "latest"
helm = "latest"
k9s = "latest"
kubecolor = "latest"
kubectx = "latest"
kubens = "latest"
"github:cloudnative-pg/cloudnative-pg" = { version = "latest", exe = "kubectl-cnpg" }
claude-code = "latest"
opencode = "latest"
pi = "latest"
gh = "latest"
node = "latest"

# Homebrew and home-manager supply these on macOS and NixOS, so mise installs them
# on Windows only. btop has no Windows build.
bat = { version = "latest", os = ["windows"] }
delta = { version = "latest", os = ["windows"] }
eza = { version = "latest", os = ["windows"] }
fd = { version = "latest", os = ["windows"] }
fzf = { version = "latest", os = ["windows"] }
jq = { version = "latest", os = ["windows"] }
neovim = { version = "latest", os = ["windows"] }
ripgrep = { version = "latest", os = ["windows"] }
sd = { version = "latest", os = ["windows"] }
zoxide = { version = "latest", os = ["windows"] }
codex = "latest"

# zsh plugins on macOS; home-manager supplies them on NixOS
[tools."http:zsh-plugin-pure"]
# renovate: datasource=github-tags depName=sindresorhus/pure
version = "1.27.1"
url = "https://github.com/sindresorhus/pure/archive/refs/tags/v{{ version }}.tar.gz"
strip_components = 1
os = ["macos"]

[tools."http:zsh-plugin-fzf-tab"]
# renovate: datasource=github-tags depName=Aloxaf/fzf-tab
version = "1.2.0"
url = "https://github.com/Aloxaf/fzf-tab/archive/refs/tags/v{{ version }}.tar.gz"
strip_components = 1
os = ["macos"]

[tools."http:zsh-plugin-autosuggestions"]
# renovate: datasource=github-tags depName=zsh-users/zsh-autosuggestions
version = "0.7.0"
url = "https://github.com/zsh-users/zsh-autosuggestions/archive/refs/tags/v{{ version }}.tar.gz"
strip_components = 1
os = ["macos"]

[tools."http:zsh-plugin-syntax-highlighting"]
# renovate: datasource=github-tags depName=zsh-users/zsh-syntax-highlighting
version = "0.8.0"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ version }}.tar.gz"
strip_components = 1
os = ["macos"]

[tools."http:zsh-plugin-kube-ps1"]
# renovate: datasource=github-tags depName=jonmosco/kube-ps1
version = "0.9.0"
url = "https://github.com/jonmosco/kube-ps1/archive/refs/tags/v{{ version }}.tar.gz"
strip_components = 1
os = ["macos"]
