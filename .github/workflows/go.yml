name: go

# bosun's tests did not run anywhere. A change to apps/bosun/*.go routes to
# nothing in .github/scripts/validation-impact.sh, so the nix workflow's
# flake-check never fired for one -- and the host builds that would have run
# `go test` through buildGoModule's check phase are push-to-main only, gated
# on the same filter. The suite executed only when some unrelated nix file
# changed and a host closure happened to be rebuilt.
#
# So: the Go modules in apps/, tested on their own terms, on the PR. Straight
# toolchain rather than through nix, because this needs to answer in seconds
# on a path filter this narrow; the host builds still exercise the same tests
# through the package on merge.

on:
  push:
    branches: [main]
    paths:
      - 'apps/bosun/**'
      - 'apps/ddnsd/**'
      - 'apps/fml-attest/**'
      - 'apps/fml-ceremony/**'
      - 'apps/fml-pki/**'
      - 'apps/spindrift-verifier/**'
      - 'terraform/pki/certs/**'
      - 'terraform/pki/oidc/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'apps/bosun/**'
      - 'apps/ddnsd/**'
      - 'apps/fml-attest/**'
      - 'apps/fml-ceremony/**'
      - 'apps/fml-pki/**'
      - 'apps/spindrift-verifier/**'
      - 'terraform/pki/certs/**'
      - 'terraform/pki/oidc/**'
      - '.github/workflows/go.yml'

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps/bosun
          - apps/ddnsd
          - apps/fml-attest
          - apps/fml-ceremony
          - apps/fml-pki
          - apps/spindrift-verifier
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Most of these modules are stdlib-only and have no go.sum, which
          # setup-go's default cache looks for and fails without.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      # -race, because bosun's pool is reached from the poll loop, every
      # skiff's awaitExit goroutine, and the drain path at once. The runner
      # has a C toolchain; a workstation without one fails this with
      # "requires cgo", which reads as a broken suite rather than a missing
      # compiler.
      - run: go test -race ./...

  # `mise run pki:verify` had no workflow entry, so a change to
  # terraform/pki/certs matched no path filter anywhere, ran zero jobs and
  # reported green -- while every host auto-upgrades its trust store from main.
  # The committed chain is the one artifact of a root re-birth; it gets a gate.
  pki-verify:
    name: pki:verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/fml-pki/go.mod
          cache: false
      - run: go -C apps/fml-pki run . verify
