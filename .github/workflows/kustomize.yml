name: kustomize

# One step, one small toolchain, and a path filter that fires on exactly the
# cluster changes worth rendering. `runner` is a dispatch escape hatch onto
# the self-hosted ARC pools; the merge path runs hosted.
on:
  push:
    branches: [main]
    paths:
      - 'clusters/base/**'
      - 'clusters/folly/apps/**'
      - 'clusters/folly/monitoring/**'
      - 'clusters/folly/config/lab-topology.json'
      - 'clusters/offsite/apps/**'
      - 'clusters/offsite/monitoring/**'
      - 'packages/charts/**'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/scripts/check-prometheus-rules.sh'
      - '.github/workflows/kustomize.yml'
  pull_request:
    paths:
      - 'clusters/base/**'
      - 'clusters/folly/apps/**'
      - 'clusters/folly/monitoring/**'
      - 'clusters/folly/config/lab-topology.json'
      - 'clusters/offsite/apps/**'
      - 'clusters/offsite/monitoring/**'
      - 'packages/charts/**'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/scripts/check-prometheus-rules.sh'
      - '.github/workflows/kustomize.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner target'
        type: choice
        options:
          - ubuntu-latest
          - infra-offsite
        default: ubuntu-latest
jobs:
  render-apps:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # helm templates the in-repo charts the rendered HelmReleases name; yq
      # pulls each release's values back out of the rendered stream.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: helm kubectl yq promtool
      - run: bash .github/scripts/render-cluster-apps.sh
      - run: bash .github/scripts/check-prometheus-rules.sh
