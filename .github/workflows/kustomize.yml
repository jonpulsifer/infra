name: kustomize

# The `runner` input moves a dispatch onto a self-hosted ARC pool.
on:
  push:
    branches: [main]
    paths:
      # All of clusters/, so no overlay merges unrendered.
      - 'clusters/**'
      - 'packages/charts/**'
      - 'terraform/network/unifi/folly/clients.yaml'
      - 'scripts/render-spire-devid-ca.sh'
      - 'terraform/pki/certs/folly-devid-ca.pem'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/scripts/check-prometheus-rules.sh'
      - '.github/workflows/kustomize.yml'
  pull_request:
    paths:
      - 'clusters/**'
      - 'packages/charts/**'
      - 'terraform/network/unifi/folly/clients.yaml'
      - 'scripts/render-spire-devid-ca.sh'
      - 'terraform/pki/certs/folly-devid-ca.pem'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/scripts/check-prometheus-rules.sh'
      - '.github/workflows/kustomize.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner target'
        type: choice
        options:
          - ubuntu-latest
          - infra-offsite
        default: ubuntu-latest
jobs:
  render-apps:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: helm kubectl yq promtool
      - run: bash .github/scripts/render-cluster-apps.sh
      - run: bash .github/scripts/check-prometheus-rules.sh
      - run: bash scripts/render-spire-devid-ca.sh --check
