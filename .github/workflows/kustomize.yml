name: kustomize

# The `runner` input moves a dispatch onto a self-hosted ARC pool.
on:
  push:
    branches: [main]
    paths:
      # All of clusters/, so no overlay merges unrendered.
      - 'clusters/**'
      - 'packages/charts/**'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/scripts/check-prometheus-rules.sh'
      - '.github/workflows/kustomize.yml'
  pull_request:
    paths:
      - 'clusters/**'
      - 'packages/charts/**'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/scripts/check-prometheus-rules.sh'
      - '.github/workflows/kustomize.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner target'
        type: choice
        options:
          - ubuntu-latest
          - infra-offsite
        default: ubuntu-latest
jobs:
  render-apps:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: helm kubectl yq promtool
      - run: bash .github/scripts/render-cluster-apps.sh
      - run: bash .github/scripts/check-prometheus-rules.sh
