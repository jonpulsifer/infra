name: kustomize

# The first merge-path job served by the warm pool.
#
# `skiff-offsite` is oldschool's slot: one warm skiff at the site with the fast
# internet, a persisting workspace so the next run finds this one's mise tool
# cache, and a host-local actions/cache service the stock action uses without
# knowing. This job is the right first mover -- one step, one small toolchain,
# and a path filter that makes it fire on exactly the changes the pool should
# be proving itself against.
#
# The escape hatch is the same one `typescript.yml` carries: the class has a
# single host, so if bosun there is down the job queues rather than failing,
# and a dispatch with `runner: ubuntu-latest` gets an answer without editing
# this file.
on:
  push:
    branches: [main]
    paths:
      - 'clusters/base/**'
      - 'clusters/folly/apps/**'
      - 'clusters/folly/monitoring/**'
      - 'clusters/folly/config/lab-topology.json'
      - 'clusters/offsite/apps/**'
      - 'packages/charts/**'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/workflows/kustomize.yml'
  pull_request:
    paths:
      - 'clusters/base/**'
      - 'clusters/folly/apps/**'
      - 'clusters/folly/monitoring/**'
      - 'clusters/folly/config/lab-topology.json'
      - 'clusters/offsite/apps/**'
      - 'packages/charts/**'
      - '.github/scripts/render-cluster-apps.sh'
      - '.github/workflows/kustomize.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner target'
        type: choice
        options:
          - skiff-offsite
          - ubuntu-latest
          - infra-offsite
        default: skiff-offsite
jobs:
  render-apps:
    runs-on: ${{ inputs.runner || 'skiff-offsite' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # helm templates the in-repo charts the rendered HelmReleases name; yq
      # pulls each release's values back out of the rendered stream.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: helm kubectl yq
      - run: bash .github/scripts/render-cluster-apps.sh
