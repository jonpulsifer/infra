# The hosted build route's workflow. Generated callers in connected repositories run
# it, ordinarily at main, with one opaque `spec`, so new parameters go in `spec`.
# `workflow_dispatch` builds uploaded archives here. Its last line is the build report.
name: spindrift-build
run-name: spindrift ${{ inputs.correlation }}

on:
  workflow_call:
    inputs:
      spec:
        description: The build request, as JSON.
        required: true
        type: string
    secrets:
      # Optional: without it, "Resolve the seal key" reads the same key from
      # Secret Manager. Only this repository's own caller can pass it.
      SPINDRIFT_BUILD_SEAL_KEY:
        required: false
  workflow_dispatch:
    inputs:
      spec:
        description: The build request, as JSON.
        required: true
        type: string
      correlation:
        description: How Spindrift finds this run again. Not a build input.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # The job federates to Google Cloud as itself and holds no stored credential.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read the build request
        id: request
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          read_key() { printf '%s' "$SPEC" | jq -r "$1"; }
          {
            printf 'bundleDigest=%s\n' "$(read_key '.bundleDigest')"
            printf 'location=%s\n'     "$(read_key '.origin.location')"
            printf 'subpath=%s\n'      "$(read_key '.origin.subpath')"
            # `// "image"` because this file and the controller ship on
            # different clocks (see `destinations` below): a spec composed
            # before the field existed built an image, and still does.
            printf 'artifactType=%s\n' "$(read_key '.artifactType // "image"')"
            # `.destinations` with `.destination` behind it, because this file
            # and the controller ship on different clocks — the same reason
            # `tags` carries a default. A caller pins this workflow by a local
            # reference resolving to the default branch, so a merge here reaches
            # the next dispatch immediately while the controller image waits on
            # a Flux rollout. Every spec composed in that window still names one
            # destination.
            printf 'destinations<<SPINDRIFT_EOF\n'
            read_key '(.destinations // [.destination])[]'
            printf 'SPINDRIFT_EOF\n'
            # The first, for the one-per-build documents: the provenance and the
            # SBOM describe a build, not a registry, and the report names one
            # subject. The signature and the attestation are per destination and
            # are composed from the list above.
            printf 'destination=%s\n'  "$(read_key '(.destinations // [.destination])[0]')"
            printf 'frontend=%s\n'     "$(read_key '.zeroConfigFrontend')"
            # `// ""` for the same reason `tags` has a default: a spec composed
            # by a controller that predates this field must still build. Empty
            # means "this installation named no signing key", and the signing
            # steps below are skipped rather than failed — the artifact is then
            # exactly what it was before, and a Target whose admission wants a
            # signature is the thing that says so.
            printf 'signer=%s\n'       "$(read_key '.signer // ""')"
            printf 'attestor=%s\n'     "$(read_key '.attestor // ""')"
            # Empty on every build whose destinations this route already
            # authorizes itself — most of them (§13). Present, it is this
            # build's held registry credential, sealed to `sealPublicKey` and
            # opened by "Log in with sealed credentials" below; nothing about
            # it is readable in this output or anywhere this step touches.
            printf 'sealedRegistryAuth=%s\n' "$(read_key '.sealedRegistryAuth // ""')"
            # Story 112: the build secrets, sealed to the same key. Present
            # only when the Component declares some; opened by "Stage sealed
            # build secrets" below, which turns them into files the engine
            # reads as named mounts. Ciphertext here, like the credential.
            printf 'sealedBuildSecrets=%s\n' "$(read_key '.sealedBuildSecrets // ""')"
            # One login per distinct registry host. The GitHub token below only
            # authenticates to GHCR; anything else is a cloud registry the
            # `Authenticate to Google Cloud` step already federates for, so the
            # hosts are split rather than looped over with one credential.
            printf 'registry=%s\n'     "$(read_key '(.destinations // [.destination])[0] | split("/")[0]')"
            hosts() {
              read_key "[(.destinations // [.destination])[] | split(\"/\")[0]] | unique | map(select($1))"
            }
            # Two kinds, spelled out rather than abstracted: GHCR takes the run's
            # own token, and Google Artifact Registry takes the federated
            # identity the signing steps already establish. A host that is
            # neither is not silently skipped — it reaches `docker push` with no
            # credential and fails there, naming itself.
            printf 'ghcrHosts=%s\n'   "$(hosts '. == "ghcr.io"' | jq -r 'join(",")')"
            printf 'googleHosts=%s\n' "$(hosts 'endswith("docker.pkg.dev") or . == "gcr.io"' | jq -r 'join(",")')"
            # §12 counts tags, so core sends every tag this push must carry and
            # the runner composes none of its own. Full references, because that
            # is what build-push-action's newline list takes.
            #
            # `// ["latest"]` because this file and the controller ship on
            # different clocks: the caller pins with `uses: ./…`, a local
            # reference resolving to the default branch's own commit, so a merge
            # here reaches the next dispatch immediately while the controller
            # image waits on a Flux rollout. A spec written before `tags`
            # existed must therefore still build — and `:latest` is exactly what
            # the bare destination meant to the reader of this file before it
            # did. Absent the default, every dispatch in that window dies here,
            # at the step before anything is recorded.
            #
            # Every tag under every destination. One buildx invocation pushes
            # the same manifest to each — one build, one digest, N registries —
            # which is what lets a Deploy pin whichever reference its own Target
            # can pull without anything being built twice.
            printf 'tags<<SPINDRIFT_EOF\n'
            read_key '(.destinations // [.destination])[] as $d
                      | (.tags // ["latest"])[] | $d + ":" + .'
            printf 'SPINDRIFT_EOF\n'
            printf 'buildArgs<<SPINDRIFT_EOF\n'
            read_key '.buildArgs | to_entries[] | "\(.key)=\(.value)"'
            printf 'SPINDRIFT_EOF\n'
            # Where a `files` build lifts its site out of (§3, story 42). `// ""`
            # for the reason every default here exists — a spec composed before
            # this field existed shipped the scope as it stood, and still does.
            # `null` is spelled the same as absent on purpose: core sends the
            # key explicitly and both mean "lift nothing".
            printf 'outputDirectory=%s\n' "$(read_key '.outputDirectory // ""')"
            # The framework a `vercel-output` build tells Vercel's own builder
            # it is building. Empty on every other shape, and never empty on
            # that one — core refuses the dispatch rather than let the platform
            # build an SSR project as a directory of files.
            printf 'vercelFramework=%s\n' "$(read_key '.vercelFramework // ""')"
          } >> "$GITHUB_OUTPUT"

      # The staged bundle, not a fresh clone, is the tree the source receipt
      # describes.
      - name: Fetch the staged bundle
        id: bundle
        env:
          LOCATION: ${{ steps.request.outputs.location }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundle"
          curl --fail --silent --show-error --location "$LOCATION" \
            | tar -xz -C "${RUNNER_TEMP}/bundle"
          # §5's unwrap, which is what makes the subpath below resolve. Core
          # records a scope relative to the source root, and a bundle's root is
          # not always that: a repository tarball wraps the whole tree in one
          # `{owner}-{repo}-{sha}` directory. The rule is the shape rather than
          # the source — exactly one entry and it a directory — because an
          # uploaded archive may arrive either way, and it is the same rule
          # `archiveScope` applies to the copy core detects against.
          root="${RUNNER_TEMP}/bundle"
          shopt -s dotglob nullglob
          entries=("$root"/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            root="${entries[0]}"
          fi
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"

      # Without a Dockerfile, the file is a railpack plan, which the frontend
      # image generates itself so that plan and frontend are one release.
      - name: Choose the frontend
        id: frontend
        env:
          ROOT: ${{ steps.bundle.outputs.root }}
          SUBPATH: ${{ steps.request.outputs.subpath }}
          FRONTEND: ${{ steps.request.outputs.frontend }}
          ARTIFACT_TYPE: ${{ steps.request.outputs.artifactType }}
          OUTPUT_DIRECTORY: ${{ steps.request.outputs.outputDirectory }}
          VERCEL_FRAMEWORK: ${{ steps.request.outputs.vercelFramework }}
        run: |
          set -euo pipefail
          scope="${ROOT}/${SUBPATH}"

          # The same probe ships inside the BuildKit program the other routes
          # run (`buildkit.ts`, DOCKERFILE_CONTEXT_PROBE), and detection
          # mirrors it at inspect time so the sentence the operator read is
          # what happens here. `dockerfile-context-arm.test.ts` executes this
          # copy and holds it identical to that one.
          # Which directory this Dockerfile builds from: prints its own directory when
          # a COPY/ADD source resolves beside it and not at the root, else the root.
          spindrift_dockerfile_context() {
            sdc_file="$1"; sdc_root="$2"; sdc_scope="$3"
            sdc_context="$sdc_root"
            set -f
            while IFS= read -r sdc_line || [ -n "$sdc_line" ]; do
              set -- $sdc_line
              case "${1:-}" in
                [Cc][Oo][Pp][Yy]|[Aa][Dd][Dd]) shift ;;
                *) continue ;;
              esac
              sdc_stage=0
              while [ "$#" -gt 0 ]; do
                case "$1" in
                  --from=*) sdc_stage=1; shift ;;
                  --*) shift ;;
                  *) break ;;
                esac
              done
              if [ "$sdc_stage" -eq 1 ]; then continue; fi
              while [ "$#" -gt 1 ]; do
                case "$1" in
                  .|/*|*:*|*'*'*|*'?'*|*'['*|*..*) ;;
                  *)
                    sdc_source="${1#./}"
                    if [ -e "$sdc_scope/$sdc_source" ] && [ ! -e "$sdc_root/$sdc_source" ]; then
                      sdc_context="$sdc_scope"
                    fi
                    ;;
                esac
                shift
              done
            done < "$sdc_file"
            set +f
            printf '%s\n' "$sdc_context"
          }

          # A `files` artifact is not built at all: the scope *is* the site,
          # and what the registry holds is one layer that is the gzipped tar
          # `bundle.ts` reads back at deploy time. `FROM scratch` + `COPY . /`
          # makes buildx produce exactly that — a single tar+gzip layer of the
          # scope's contents — while the push, the provenance, the signature,
          # the attestation and the report all ride the ordinary pipeline
          # unchanged, so a files artifact is admitted exactly like an image.
          # This arm is checked before the Dockerfile one on purpose: the
          # artifact type decides what the thing *is*, and a Dockerfile in the
          # scope only ever decided how to build one.
          # A scope that declares no output directory *is* the site: there is
          # nothing to run first, and the tree is already what a static Target
          # serves. That is the whole of this arm for a hand-written site, an
          # uploaded artifact, and anything whose `spindrift.yaml` names no
          # directory.
          #
          # A scope that declares one is the sources of a site rather than the
          # site, so this arm falls through to the ladder below, the ordinary
          # build runs, and `Lift the site out of the build` takes the declared
          # directory back out of the image and makes *that* the context. The
          # `FROM scratch` Dockerfile is written either way, because both paths
          # end by exporting one directory as the single gzipped tar layer a
          # files artifact is.
          # The edge platform's own function format (§6's table, one row past
          # the static one). §5's ladder decides nothing here: the platform's
          # builder *is* the frontend for this shape, it detects the project
          # itself from the framework core named, and what it leaves behind is a
          # `.vercel/output` tree. So this arm short-circuits like the plain
          # files one does, and `Build the site into a directory` runs it.
          if [ "$ARTIFACT_TYPE" = "vercel-output" ]; then
            files="${RUNNER_TEMP}/files-artifact"
            mkdir -p "$files"
            printf 'FROM scratch\nCOPY . /\n' > "${files}/Dockerfile"
            if [ -z "${VERCEL_FRAMEWORK:-}" ]; then
              echo "::error::this build is shaped for a Vercel Target but names no framework — core refuses that dispatch, so reaching this step means the spec was composed by something that does not know this shape." >&2
              exit 1
            fi
            # The platform's builder runs the scope's own install command and
            # takes the package manager from the lockfile — a bun lockfile
            # means `bun install` — and the hosted runner image ships no bun.
            # The version is the scope's pin where it states one.
            bun=""
            if [ -f "${scope}/bun.lock" ] || [ -f "${scope}/bun.lockb" ]; then
              bun="latest"
              if [ -f "${scope}/.bun-version" ]; then
                bun="$(tr -d '[:space:]' < "${scope}/.bun-version")"
              fi
            fi
            {
              printf 'scratchfile=%s\n' "${files}/Dockerfile"
              printf 'vercelscope=%s\n' "$scope"
              printf 'vercelframework=%s\n' "$VERCEL_FRAMEWORK"
              printf 'vercelbun=%s\n' "$bun"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ARTIFACT_TYPE" = "files" ]; then
            files="${RUNNER_TEMP}/files-artifact"
            mkdir -p "$files"
            printf 'FROM scratch\nCOPY . /\n' > "${files}/Dockerfile"
            printf 'scratchfile=%s\n' "${files}/Dockerfile" >> "$GITHUB_OUTPUT"
            if [ -z "${OUTPUT_DIRECTORY:-}" ]; then
              {
                printf 'context=%s\n' "$scope"
                printf 'file=%s\n' "${files}/Dockerfile"
                printf 'buildArgs=\n'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'lift=%s\n' "$OUTPUT_DIRECTORY" >> "$GITHUB_OUTPUT"
          fi

          # The scope names the Dockerfile; the Dockerfile names its context.
          # A monorepo App's Dockerfile is written against the root that
          # `docker build -f apps/x/Dockerfile .` gives it — `COPY . .` then a
          # path *into* the app — while a standalone repository's Dockerfile
          # is written against its own directory (`COPY go.mod ./` with go.mod
          # beside it), and keeps that shape when the repository is vendored
          # under a subpath. Handing either kind the other's context fails
          # deep inside the build with a missing path rather than here with a
          # reason, so the probe above reads the file's own COPY/ADD sources
          # and keeps the root unless one resolves only beside the Dockerfile.
          #
          # Only this arm. The zero-config arm below keeps the scope, because
          # railpack detects a single app and a plan built against the root
          # would describe the wrong one.
          if [ -f "${scope}/Dockerfile" ]; then
            {
              printf 'context=%s\n' "$(spindrift_dockerfile_context "${scope}/Dockerfile" "$ROOT" "$scope")"
              printf 'file=%s\n' "${scope}/Dockerfile"
              printf 'buildArgs=\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The generator is the frontend's own binary, run out of the frontend
          # image. The scope is mounted read-only because `prepare` reads the
          # tree and writes only where `--plan-out` points, and the plan lands
          # on its own mount so the build context stays the source.
          plan="${RUNNER_TEMP}/railpack-plan"
          mkdir -p "$plan"
          set -- prepare /scope --plan-out /out/railpack-plan.json

          # §5's authority reaches the builder here, and this is the whole of
          # what an operator has to know: they state the build command once, in
          # Spindrift's own file, and never learn the builder's name. Read out
          # of the tree rather than carried in the request because the plan has
          # always been derived here — the request pins the frontend *image*,
          # never the plan, exactly as the Dockerfile arm above reads the tree
          # for its own decision. What is read is what Spindrift adopted: the
          # bundle is staged at the App's authoritative commit, and
          # `reconciler/repo-loop.ts` refuses to advance that past a commit
          # whose `spindrift.yaml` will not parse, so the runner cannot honour
          # a declaration core rejected.
          #
          # `select` on the frontend rather than reading `.command` outright: a
          # scope declaring the dockerfile frontend has no railpack command to
          # state, and `// ""` folds the schema's `command: null` onto the same
          # "nothing declared" as an absent file. Both leave the invocation
          # byte-identical to what it was before this block existed.
          declaration="${scope}/spindrift.yaml"
          build_command=""
          if [ -f "$declaration" ]; then
            build_command="$(
              yq '.build | select(.frontend == "railpack") | .command // ""' \
                "$declaration"
            )"
          fi

          if [ -n "$build_command" ]; then
            # A generated config file rather than `--build-cmd`, for one
            # reason: railpack merges options *under* the config file
            # (`Merge(optionsConfig, envConfig, fileConfig)`), so a stray
            # `railpack.json` in the scope silently outranks the flag. That
            # inverts the ownership this file exists to state. Pointing
            # `--config-file` elsewhere is also what makes `railpack.json`
            # unnecessary: railpack reads exactly one config file, and this is
            # it. The flag hard-fails when the file is absent, which is why it
            # is only ever passed inside this branch — a scope that declares
            # nothing keeps its own `railpack.json` and builds as before.
            #
            # String form, never `{"cmd": …}`: a string becomes `sh -c '<cmd>'`
            # and an object is handed to BuildKit's `llb.Shlex` argv-split, so
            # an operator's `a && b` would pass `&&` as a literal argument.
            # `jq --arg` is what makes any byte in that string — quotes,
            # newlines, `$(…)` — a JSON value rather than syntax.
            case "$build_command" in
              *"'"*)
                # railpack's own wrapper is `"sh -c '" + cmd + "'"` with no
                # escaping, so a single quote silently re-splits the command
                # instead of failing. Refused loudly here rather than shipped
                # as a build that ran something else.
                # ponytail: rejects rather than escapes; emit `'\''` for the
                # quote if a real command ever needs one.
                #
                # On stdout, not stderr: Actions reads workflow commands from a
                # step's stdout, and an annotation is the only part of this a
                # reader sees without opening the log.
                printf '::error::spindrift.yaml: build.command cannot contain a single quote\n'
                exit 1
                ;;
            esac
            # Relative, and it has to be: railpack resolves the path under the
            # app source (`filepath.Join(app.Source, configFileName)`), so an
            # absolute `/out/...` becomes `/scope/out/...` and is not found.
            # `../out` reaches the plan mount, which is already writable, so
            # nothing is written into the source tree and the scope stays `:ro`.
            jq -n --arg cmd "$build_command" '{steps:{build:{commands:[$cmd]}}}' \
              > "${plan}/railpack-config.json"
            set -- "$@" --config-file ../out/railpack-config.json
          fi

          docker run --rm \
            -v "${scope}:/scope:ro" -v "${plan}:/out" \
            --entrypoint /railpack "$FRONTEND" "$@"

          # `plan` names the same file as `file`, and is the only arm that sets
          # it. The step below reads the plan as JSON, which is true of this
          # arm's `file` and of neither other arm's Dockerfile, so it asks for
          # the output that only exists when there is a plan rather than
          # inferring the arm from one that happens to be empty elsewhere.
          {
            printf 'context=%s\n' "$scope"
            printf 'file=%s\n' "${plan}/railpack-plan.json"
            printf 'plan=%s\n' "${plan}/railpack-plan.json"
            printf 'buildArgs=BUILDKIT_SYNTAX=%s\n' "$FRONTEND"
          } >> "$GITHUB_OUTPUT"

      # railpack builds a library-root Go module to a non-executable `out` and
      # exits 0, so `test -x` on a bare `./path` start command fails that build.
      - name: Make the plan check its own start command
        if: steps.frontend.outputs.plan != ''
        env:
          PLAN: ${{ steps.frontend.outputs.plan }}
        run: |
          set -euo pipefail
          # `customName` is what BuildKit prints for the layer, so the red build
          # names the defect rather than making the operator infer it from a
          # bare `test -x` and an exit code.
          jq '
            (.deploy.startCommand // "") as $start
            | if ($start | test("^\\./\\S+$"))
              then (.steps[] | select(.name == "build") | .commands)
                     += [{
                       cmd: "test -x \($start)",
                       customName: "check the build produced an executable \($start)"
                     }]
              else . end
          ' "$PLAN" > "${PLAN}.checked"
          mv "${PLAN}.checked" "$PLAN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Before the push: signing, an Artifact Registry push and the Secret
      # Manager read of the seal key all use this identity.
      - name: Authenticate to Google Cloud
        if: >-
          steps.request.outputs.signer != '' ||
          steps.request.outputs.googleHosts != '' ||
          steps.request.outputs.sealedRegistryAuth != '' ||
          steps.request.outputs.sealedBuildSecrets != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true

      # GHCR accepts the run's own token, so no registry credential is stored.
      - name: Log in to GitHub Container Registry
        if: steps.request.outputs.ghcrHosts != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Writes the same Docker config as the GHCR login, so one push reaches both
      # registries and cosign finds a credential for either.
      - name: Log in to Artifact Registry
        if: steps.request.outputs.googleHosts != ''
        env:
          HOSTS: ${{ steps.request.outputs.googleHosts }}
        run: gcloud auth configure-docker --quiet "$HOSTS"

      # This repository's secret, or else Secret Manager through the federated
      # identity. Only the key file's path reaches $GITHUB_OUTPUT, never its bytes.
      - name: Resolve the seal key
        id: sealkey
        if: >-
          steps.request.outputs.sealedRegistryAuth != '' ||
          steps.request.outputs.sealedBuildSecrets != ''
        env:
          SEAL_KEY: ${{ secrets.SPINDRIFT_BUILD_SEAL_KEY }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/spindrift-seal-key.pem"
          if [ -n "${SEAL_KEY:-}" ]; then
            printf '%s' "$SEAL_KEY" > "$file"
          elif ! gcloud secrets versions access latest \
              --secret=projects/trusted-builds/secrets/spindrift-build-seal-key \
              > "$file"; then
            echo "::error::this build carries a sealed value, and neither this repository's SPINDRIFT_BUILD_SEAL_KEY secret nor projects/trusted-builds/secrets/spindrift-build-seal-key answered — set the repository secret, or check that this run's identity is federated for the seal key's Secret Manager IAM binding." >&2
            exit 1
          fi
          chmod 600 "$file"
          printf 'file=%s\n' "$file" >> "$GITHUB_OUTPUT"

      # Sealed because workflow_dispatch shows every input in the run header. The
      # opened credential goes only to `docker login` on stdin.
      - name: Log in with sealed credentials
        if: steps.request.outputs.sealedRegistryAuth != ''
        env:
          SEALED: ${{ steps.request.outputs.sealedRegistryAuth }}
          SEAL_KEY_FILE: ${{ steps.sealkey.outputs.file }}
        run: |
          set -euo pipefail
          # "Resolve the seal key" already failed loudly if neither home
          # answered, so an empty path here means it never ran — the one way
          # that happens is a `spec` carrying a sealed value this step's own
          # `if` did not see, which would otherwise reach `docker login` with
          # nothing and fail several steps later, at the push, for a reason
          # this sentence already knows.
          if [ -z "${SEAL_KEY_FILE:-}" ]; then
            echo "::error::this build carries a sealed registry credential, but no seal key was resolved for it." >&2
            exit 1
          fi
          node <<'SPINDRIFT_SEAL_SCRIPT'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const envelope = JSON.parse(
            Buffer.from(process.env.SEALED, 'base64').toString('utf8'),
          );
          const wrappedKey = Buffer.from(envelope.k, 'base64');
          const iv = Buffer.from(envelope.iv, 'base64');
          const combined = Buffer.from(envelope.c, 'base64');
          // WebCrypto's AES-GCM appends its 16-byte tag to the ciphertext
          // rather than returning it separately — `sealForRun` never
          // split the two, so this is the split back apart.
          const tag = combined.subarray(combined.length - 16);
          const ciphertext = combined.subarray(0, combined.length - 16);

          const aesKey = crypto.privateDecrypt(
            {
              key: fs.readFileSync(process.env.SEAL_KEY_FILE, 'utf8'),
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: 'sha256',
            },
            wrappedKey,
          );

          const decipher = crypto.createDecipheriv('aes-256-gcm', aesKey, iv);
          decipher.setAuthTag(tag);
          const plaintext = Buffer.concat([
            decipher.update(ciphertext),
            decipher.final(),
          ]);
          const auth = JSON.parse(plaintext.toString('utf8'));

          // Masked before this step prints anything else, including the
          // logins below — whose own output could otherwise echo them back.
          // The secret only: the runner also masks the base64 form of a
          // masked value, and the username is inside every image reference —
          // masking it punched `***` through the base64 build report and the
          // route refused a green run it could no longer parse. A username is
          // the public half of the pair; it is in the refs by design.
          for (const entry of auth) {
            console.log(`::add-mask::${entry.secret}`);
          }
          for (const entry of auth) {
            execFileSync(
              'docker',
              ['login', entry.host, '-u', entry.username, '--password-stdin'],
              { input: entry.secret, stdio: ['pipe', 'inherit', 'inherit'] },
            );
          }
          SPINDRIFT_SEAL_SCRIPT

      # Each opened secret becomes a file under RUNNER_TEMP. Later steps see only
      # `name=path` lines for `RUN --mount=type=secret,id=<name>`.
      - name: Stage sealed build secrets
        id: buildsecrets
        if: steps.request.outputs.sealedBuildSecrets != ''
        env:
          SEALED: ${{ steps.request.outputs.sealedBuildSecrets }}
          SEAL_KEY_FILE: ${{ steps.sealkey.outputs.file }}
        run: |
          set -euo pipefail
          # See "Log in with sealed credentials" for why an empty path here
          # means "Resolve the seal key" never ran rather than that it failed
          # quietly — that step already errors loudly on its own.
          if [ -z "${SEAL_KEY_FILE:-}" ]; then
            echo "::error::this build carries sealed build secrets, but no seal key was resolved for them." >&2
            exit 1
          fi
          node <<'SPINDRIFT_SEAL_SCRIPT'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const envelope = JSON.parse(
            Buffer.from(process.env.SEALED, 'base64').toString('utf8'),
          );
          const wrappedKey = Buffer.from(envelope.k, 'base64');
          const iv = Buffer.from(envelope.iv, 'base64');
          const combined = Buffer.from(envelope.c, 'base64');
          // WebCrypto's AES-GCM appends its 16-byte tag to the ciphertext —
          // `sealForRun` never split the two, so this is the split back apart.
          const tag = combined.subarray(combined.length - 16);
          const ciphertext = combined.subarray(0, combined.length - 16);

          const aesKey = crypto.privateDecrypt(
            {
              key: fs.readFileSync(process.env.SEAL_KEY_FILE, 'utf8'),
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: 'sha256',
            },
            wrappedKey,
          );

          const decipher = crypto.createDecipheriv('aes-256-gcm', aesKey, iv);
          decipher.setAuthTag(tag);
          const plaintext = Buffer.concat([
            decipher.update(ciphertext),
            decipher.final(),
          ]);
          const secrets = JSON.parse(plaintext.toString('utf8'));

          const dir = path.join(process.env.RUNNER_TEMP, 'spindrift-build-secrets');
          fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
          const lines = [];
          for (const entry of secrets) {
            // Masked before anything else prints. The value only: the name is
            // the mount id a Dockerfile asks for, public by design.
            console.log(`::add-mask::${entry.value}`);
            const file = path.join(dir, entry.name);
            fs.writeFileSync(file, entry.value, { mode: 0o600 });
            lines.push(`${entry.name}=${file}`);
          }
          // The output is names and paths, never values — safe to render.
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `secretFiles<<SPINDRIFT_EOF\n${lines.join('\n')}\nSPINDRIFT_EOF\n`,
          );
          SPINDRIFT_SEAL_SCRIPT

      - name: Set up bun for the platform's builder
        if: steps.frontend.outputs.vercelbun != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.frontend.outputs.vercelbun }}

      # `vercel build` needs no token: it reads a written .vercel/project.json as
      # if `vercel pull` ran, and takes build args as environment variables.
      - name: Build with the platform's own builder
        id: vercel
        if: steps.frontend.outputs.vercelscope != ''
        env:
          SCOPE: ${{ steps.frontend.outputs.vercelscope }}
          FRAMEWORK: ${{ steps.frontend.outputs.vercelframework }}
          REQUEST_ARGS: ${{ steps.request.outputs.buildArgs }}
          SCRATCHFILE: ${{ steps.frontend.outputs.scratchfile }}
        run: |
          set -euo pipefail
          mkdir -p "${SCOPE}/.vercel"
          # Identifiers the offline build never resolves, named so as to be
          # obvious in a stack trace if one ever does.
          FRAMEWORK="$FRAMEWORK" node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              projectId: "prj_spindrift_offline_build",
              orgId: "team_spindrift_offline_build",
              settings: { framework: process.env.FRAMEWORK },
            }));
          ' "${SCOPE}/.vercel/project.json"

          # §4's build-time configuration, into the environment this build reads.
          while IFS= read -r arg; do
            [ -n "$arg" ] || continue
            export "${arg?}"
          done <<SPINDRIFT_ARGS_EOF
          ${REQUEST_ARGS}
          SPINDRIFT_ARGS_EOF

          # `--prod` so production environment variables and production
          # framework settings are what this tree was built against; a preview
          # build is a different artifact and would deploy as the wrong one.
          ( cd "$SCOPE" && npx --yes vercel@latest build --prod --yes )

          output="${SCOPE}/.vercel/output"
          # A framework that built nothing, or a CLI that changed where it
          # writes. Either way the push below would export an empty tree and
          # deploy a site that answers 404 on every path.
          if [ ! -f "${output}/config.json" ]; then
            echo "::error::the platform's builder left no ${output}/config.json — nothing was produced for this framework (${FRAMEWORK})." >&2
            exit 1
          fi

          # **Stage the tree `vercel deploy --prebuilt` needs to run against.**
          # The deploy adapter runs the platform's own CLI over this artifact
          # rather than reimplementing its upload, and the CLI reads two trees
          # from the directory it runs in. The Build Output API tree —
          # `config.json`, `functions/`, `static/` — stays under `.vercel/output/`
          # where the CLI's `--prebuilt` looks for it. But each function's
          # `.vc-config.json` also carries a `filePathMap` of
          # <path-in-function> -> <path-in-project>, naming its traced
          # `node_modules` and `.next` files, which live in the *project* and
          # outside `.vercel/output`; the CLI resolves each against the project
          # root, so they are staged at the root beside `.vercel/output`. (A
          # Next.js app with an OpenTelemetry dependency was the first to reach
          # here — its functions referenced 510 files none of which were in the
          # tree.)
          #
          # `bundle.ts` admits regular files only, and the Build Output tree is
          # full of symlinks: Next dedups its RSC and segment routes with
          # `.func` links — one app carried 117 of them at 4 real functions.
          # Dereferencing them would ship 117 function copies, which the
          # platform then counts as 117 functions (past the limit of its
          # smaller plans) and the artifact carries at 30× the size. So the
          # links are lifted out instead: each is recorded in a manifest the
          # deploy adapter's `extractTree` reads back and recreates before the
          # CLI runs, and the tree the platform sees is the one its builder
          # wrote. The manifest sits under `.vercel/output/__spindrift/` and
          # the adapter removes it before the deploy; the adapter is the only
          # reader, and paths are relative to the deployment root.
          #
          # A filePathMap dependency is copied the same way, and for the same
          # reason. Next aliases an external package by writing a *symlinked*
          # directory under `.next/node_modules` — `@prisma/client-<hash>`,
          # `pg-<hash>`, `require-in-the-middle-<hash>` — and names the link in
          # the map. Dereferencing one turns it into a real directory, and the
          # CLI adds a filePathMap entry to the upload verbatim without walking
          # into it (`buildFileTree`), while `--prebuilt` ignores everything
          # outside `.vercel/output` — so the directory contributes *nothing*
          # and the function dies at `Cannot find module`. Left as a link it is
          # uploaded as a link, exactly as a deploy from the project would, and
          # resolves against the real package the map names separately.
          staging="${RUNNER_TEMP}/vercel-deploy"
          rm -rf "$staging"
          mkdir -p "$staging/.vercel/output"
          cp -R "${output}/." "$staging/.vercel/output/"

          maps="${RUNNER_TEMP}/vercel-filepathmap.txt"
          : > "$maps"
          # `functions/` is absent for a build that renders no function at all —
          # a purely static site — where enumerating it is a `find` error under
          # `pipefail` rather than an empty list. The guard lets that build stage
          # with nothing extra to copy; the empty `$maps` is what the loop reads.
          if [ -d "${output}/functions" ]; then
            # `LC_ALL=C` so the sort is by byte and a directory the map names
            # sorts before the files beneath it: the skip below no-ops a path
            # already staged, which is only correct when the directory is copied
            # whole first — a localed collation could interleave the two and drop
            # a directory's contents with no error to show for it.
            find "${output}/functions" -name .vc-config.json -print0 |
              while IFS= read -r -d '' cfg; do
                node -e 'const fs=require("fs");const m=(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).filePathMap)||{};for(const v of Object.values(m))console.log(v)' "$cfg"
              done | LC_ALL=C sort -u > "$maps"
          fi
          while IFS= read -r dep; do
            # `-L` as well as `-e`, because a staged entry may now be a symlink
            # whose target the loop has not reached yet: `-e` alone reads that
            # as absent and copies a second time, on top of the link.
            if [ -z "$dep" ] || [ -e "$staging/${dep}" ] || [ -L "$staging/${dep}" ]; then
              continue
            fi
            if [ ! -e "${SCOPE}/${dep}" ] && [ ! -L "${SCOPE}/${dep}" ]; then
              echo "::error::a function's filePathMap names ${dep}, which vercel build did not leave in the tree — the prebuilt deployment cannot be assembled." >&2
              exit 1
            fi
            mkdir -p "$staging/$(dirname "$dep")"
            cp -R "${SCOPE}/${dep}" "$staging/${dep}"
          done < "$maps"

          # Every symlink in the staged tree, from both copies above, lifted
          # into the manifest the deploy adapter recreates them from. Run once
          # here rather than per-copy so there is one walker and one manifest;
          # `__spindrift/` is inside `.vercel/output` so `--prebuilt` carries
          # it, and the adapter deletes it before the CLI runs.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.argv[1];
            const links = [];
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const at = path.join(dir, entry.name);
                if (entry.isSymbolicLink()) {
                  links.push({ path: path.relative(root, at), target: fs.readlinkSync(at) });
                  fs.unlinkSync(at);
                } else if (entry.isDirectory()) {
                  walk(at);
                }
              }
            };
            walk(root);
            if (links.length === 0) process.exit(0);
            const output = path.join(root, ".vercel/output/__spindrift");
            fs.mkdirSync(output, { recursive: true });
            fs.writeFileSync(path.join(output, "func-links.json"), JSON.stringify(links));
            console.log(`lifted ${links.length} symlinks out of the deployment tree`);
          ' "$staging"

          {
            printf 'context=%s\n' "$staging"
            printf 'file=%s\n' "$SCRATCHFILE"
          } >> "$GITHUB_OUTPUT"

      # Builds the app as usual with --load, then copies out the declared
      # directory. A relative path resolves against the image's WorkingDir.
      - name: Lift the site out of the build
        id: lift
        if: steps.frontend.outputs.lift != ''
        env:
          CONTEXT: ${{ steps.frontend.outputs.context }}
          FILE: ${{ steps.frontend.outputs.file }}
          REQUEST_ARGS: ${{ steps.request.outputs.buildArgs }}
          LADDER_ARGS: ${{ steps.frontend.outputs.buildArgs }}
          SECRET_FILES: ${{ steps.buildsecrets.outputs.secretFiles }}
          SCRATCHFILE: ${{ steps.frontend.outputs.scratchfile }}
          LIFT: ${{ steps.frontend.outputs.lift }}
        run: |
          set -euo pipefail
          # The same two argument sets `Build and push` concatenates, in the
          # same order, because this is the build that would have been pushed.
          set --
          while IFS= read -r arg; do
            [ -n "$arg" ] || continue
            set -- "$@" --build-arg "$arg"
          done <<SPINDRIFT_ARGS_EOF
          ${REQUEST_ARGS}
          ${LADDER_ARGS}
          SPINDRIFT_ARGS_EOF
          # Story 112: this is the app's real build, so the mounts ride here
          # exactly as they would have on `Build and push` — `name=path` lines
          # from "Stage sealed build secrets", already on disk, never echoed.
          while IFS= read -r pair; do
            [ -n "$pair" ] || continue
            set -- "$@" --secret "id=${pair%%=*},src=${pair#*=}"
          done <<SPINDRIFT_SECRETS_EOF
          ${SECRET_FILES}
          SPINDRIFT_SECRETS_EOF

          docker buildx build --load --tag spindrift-lift:local \
            --file "$FILE" "$@" "$CONTEXT"

          workdir="$(docker image inspect --format '{{.Config.WorkingDir}}' spindrift-lift:local)"
          case "$LIFT" in
            # An absolute directory is already the answer; anything else is
            # relative to where the build left the app.
            /*) from="$LIFT" ;;
            *)  from="${workdir:-/}" ; from="${from%/}/$LIFT" ;;
          esac

          site="${RUNNER_TEMP}/site"
          mkdir -p "$site"
          cid="$(docker create spindrift-lift:local)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          # A build that ran and produced nothing at the declared directory is
          # the failure worth naming here rather than three steps later as an
          # empty site that deployed green.
          if ! docker cp "${cid}:${from}/." "$site" 2>/dev/null; then
            echo "::error::the build left nothing at ${from} — ${LIFT} is what this scope's spindrift.yaml names as its output directory, and the build did not create it. Correct outputDirectory, or remove it if this scope is already the site." >&2
            exit 1
          fi

          {
            printf 'context=%s\n' "$site"
            printf 'file=%s\n' "$SCRATCHFILE"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # At most one of lift and the platform builder runs, so this is a fallback.
          context: ${{ steps.lift.outputs.context || steps.vercel.outputs.context || steps.frontend.outputs.context }}
          file: ${{ steps.lift.outputs.file || steps.vercel.outputs.file || steps.frontend.outputs.file }}
          # Empty for a lifted or platform-built tree, which BUILDKIT_SYNTAX would
          # send to railpack. `a && b || c` yields c when b is empty, so c is ''.
          build-args: |
            ${{ steps.lift.outputs.context == '' && steps.vercel.outputs.context == '' && steps.request.outputs.buildArgs || '' }}
            ${{ steps.lift.outputs.context == '' && steps.vercel.outputs.context == '' && steps.frontend.outputs.buildArgs || '' }}
          # Empty for a lifted or platform-built tree, which mounts nothing.
          secret-files: |
            ${{ steps.lift.outputs.context == '' && steps.vercel.outputs.context == '' && steps.buildsecrets.outputs.secretFiles || '' }}
          push: true
          tags: ${{ steps.request.outputs.tags }}
          cache-from: |
            type=gha,scope=spindrift-build
            type=gha,scope=spindrift-push
          cache-to: type=gha,mode=max,scope=spindrift-build
          # BuildKit provenance with materials, which records the base image digest.
          provenance: mode=max
          sbom: true

      # cosign 3 refuses --tlog-upload=false, and this trust model has no
      # transparency log; the admission policy sets ignoreTlog to match.
      - name: Install cosign
        if: steps.request.outputs.signer != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.4

      # Signed here because the controller holds no registry write credential, and admission
      # reads each destination's own repository. A signing failure fails before the report.
      - name: Sign the artifact
        if: steps.request.outputs.signer != ''
        env:
          SIGNER: ${{ steps.request.outputs.signer }}
          DESTINATIONS: ${{ steps.request.outputs.destinations }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # The registry credentials are the ones the login steps already wrote
          # to the Docker config; cosign reads them from there, so nothing here
          # holds a credential of its own (§13).
          while IFS= read -r destination; do
            [ -n "$destination" ] || continue
            echo "signing ${destination}@${DIGEST}"
            cosign sign --yes --tlog-upload=false \
              --key "$SIGNER" "${destination}@${DIGEST}"
            # Verified here as well as at admission, because a signature that
            # cannot be checked by the key that made it is a build that should
            # fail now rather than a Deploy that is refused later by a webhook
            # whose message is about a policy rather than about this build.
            cosign verify --insecure-ignore-tlog \
              --key "$SIGNER" "${destination}@${DIGEST}" > /dev/null
          done <<< "$DESTINATIONS"

      # Binary Authorization reads an attestation, not the registry signature. The key
      # version comes from KMS, else `1`, the only version of the unrotated signer key.
      - name: Attest the artifact
        if: steps.request.outputs.attestor != '' && steps.request.outputs.signer != ''
        env:
          ATTESTOR: ${{ steps.request.outputs.attestor }}
          SIGNER: ${{ steps.request.outputs.signer }}
          DESTINATIONS: ${{ steps.request.outputs.destinations }}
          DIGEST: ${{ steps.push.outputs.digest }}
          # sign-and-create is a beta command; without this, gcloud prompts to install
          # the beta component and the run hangs.
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -euo pipefail
          attestor_project="${ATTESTOR%%/attestors/*}"
          attestor_project="${attestor_project#projects/}"
          attestor_name="${ATTESTOR##*/attestors/}"

          # gcpkms://projects/P/locations/L/keyRings/R/cryptoKeys/K
          key="${SIGNER#gcpkms://}"
          field() { printf '%s' "${key#*"/$1/"}" | cut -d/ -f1; }
          key_project="${key#projects/}"; key_project="${key_project%%/*}"

          version="$(gcloud kms keys versions list \
            --project="$key_project" \
            --location="$(field locations)" \
            --keyring="$(field keyRings)" \
            --key="$(field cryptoKeys)" \
            --filter='state=ENABLED' --sort-by=~name --limit=1 \
            --format='value(name)' 2>/dev/null | sed 's#.*/##')"
          version="${version:-1}"
          echo "attesting with key version ${version}"

          attest() {
            echo "attesting ${1}@${2}"
            # `sign-and-create` refuses a second occurrence for the same
            # artifact-url as a conflict — but an identical rebuild reusing
            # its digest is this pipeline's ordinary behaviour, and "already
            # attested" is the condition this step exists to bring about, not
            # a failure. Any other error still fails the build.
            output=$(gcloud beta container binauthz attestations sign-and-create \
              --project="$attestor_project" \
              --artifact-url="${1}@${2}" \
              --attestor="$attestor_name" \
              --attestor-project="$attestor_project" \
              --keyversion-project="$key_project" \
              --keyversion-location="$(field locations)" \
              --keyversion-keyring="$(field keyRings)" \
              --keyversion-key="$(field cryptoKeys)" \
              --keyversion="$version" 2>&1) && { printf '%s\n' "$output"; return 0; }
            case "$output" in
              *"is the subject of a conflict"*)
                echo "already attested: ${1}@${2}" ;;
              *)
                printf '%s\n' "$output" >&2; return 1 ;;
            esac
          }

          # Once per destination, and for a sharper reason than the signature:
          # an attestation is an occurrence bound to an **`--artifact-url`**, so
          # one made against `ghcr.io/…` says nothing about the same digest at
          # `…-docker.pkg.dev/…`. Binary Authorization would refuse the exact
          # image it had already attested, because the URL it was asked about is
          # not the URL it was told about.
          #
          # And once per manifest *under* each destination's index. `provenance`
          # and `sbom` above make this push an OCI **image index** even at one
          # platform, so `$DIGEST` names an index — and an index is not what a
          # runtime runs. Cloud Run resolves it to the child manifest for its own
          # platform *before* admission, and Binary Authorization is then asked
          # about a digest nothing attested: `denied by attestor` on an artifact
          # that was attested, one indirection up. Attesting the children too is
          # what makes the question the runtime asks one that has an answer.
          # `imagetools` reads the index with the credentials the login steps
          # already wrote, so this needs nothing of its own.
          #
          # **A child here means a manifest a runtime can run.** The same
          # `provenance` and `sbom` that make this an index also hang their own
          # manifests off it, and those are not images: `platform` is
          # `unknown/unknown` and the entry is annotated
          # `vnd.docker.reference.type: attestation-manifest`. Nothing ever
          # resolves to one and no admission decision is ever made about one, so
          # attesting them buys nothing and costs a KMS signing operation and an
          # occurrence per destination per build — and buries the occurrence
          # that matters in a list an operator has to read while diagnosing a
          # refusal.
          #
          # Selected by what the entry *is*, never by how many there are. "Drop
          # the last two" is correct today and wrong the first time a second
          # platform or a third attachment appears, with nothing to report it.
          while IFS= read -r destination; do
            [ -n "$destination" ] || continue
            attest "$destination" "$DIGEST"
            # Assigned before it is looped over, because a failing command
            # substitution in a `for` list is not what `-e` acts on and one in
            # an assignment is. A registry having a bad moment must not read as
            # an index with no children.
            manifests="$(docker buildx imagetools inspect --raw \
              "${destination}@${DIGEST}" | jq -r '
                .manifests[]?
                | select(.annotations["vnd.docker.reference.type"]
                         != "attestation-manifest")
                | select((.platform.os // "") != "unknown"
                         and (.platform.architecture // "") != "unknown")
                | .digest')"
            for child in $manifests; do
              attest "$destination" "$child"
            done
          done <<< "$DESTINATIONS"

      # The one line core reads, base64 so log processing cannot fold it. Core
      # verifies `statement`; build-report-statement.test.ts checks its builder id.
      - name: Report what was built
        env:
          BUNDLE_DIGEST: ${{ steps.request.outputs.bundleDigest }}
          DESTINATION: ${{ steps.request.outputs.destination }}
          DESTINATIONS: ${{ steps.request.outputs.destinations }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # One reference per destination, in the order core sent them — which
          # is the manifest's order, and is what makes `refs[0]` still the
          # registry a Target with no declared reachability gets.
          refs="$(printf '%s' "$DESTINATIONS" \
            | jq -R -s -c --arg digest "$DIGEST" \
                'split("\n") | map(select(length > 0) | . + "@" + $digest)')"
          # Best effort, and null when it is not there: a base is fresh only at
          # build time, so §16 surfaces a stale one and never corrects it — but
          # a builder that cannot report one says so rather than guessing.
          base="$(docker buildx imagetools inspect "${DESTINATION}@${DIGEST}" \
            --format '{{ json .Provenance }}' 2>/dev/null \
            | jq -r '[.. | .uri? // empty | select(startswith("pkg:docker"))][0] // empty' \
            | grep -oE 'sha256(:|%3A)[0-9a-f]{64}' \
            | sed 's/%3A/:/' || true)"
          report="$(jq -nc \
            --arg bundleDigest "$BUNDLE_DIGEST" \
            --arg digest "$DIGEST" \
            --arg destination "$DESTINATION" \
            --arg ref "${DESTINATION}@${DIGEST}" \
            --argjson refs "$refs" \
            --arg base "$base" \
            --arg run "${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            '{bundleDigest: $bundleDigest,
              digest: $digest,
              refs: $refs,
              baseDigest: (if $base == "" then null else $base end),
              buildkitProvenanceRef: $ref,
              sbomRef: $ref,
              statement: {
                _type: "https://in-toto.io/Statement/v1",
                subject: [{
                  name: $destination,
                  digest: {sha256: ($digest | ltrimstr("sha256:"))}
                }],
                predicateType: "https://slsa.dev/provenance/v1",
                predicate: {
                  buildDefinition: {
                    buildType: "https://spindrift.dev/buildtypes/github-actions/v1",
                    externalParameters: {
                      bundleDigest: $bundleDigest,
                      workflow: $workflow
                    }
                  },
                  runDetails: {
                    builder: {id: "https://github.com/actions/runner/github-hosted"},
                    metadata: {invocationId: $run}
                  }
                }
              }}')"
          echo "spindrift-result $(printf '%s' "$report" | base64 | tr -d '\n')"
