# The machinery behind Spindrift's hosted build route (spec §4, §15).
#
# §15 puts the run in the *connected* repository, on its own Actions minutes,
# and keeps everything it does here: what lands in somebody's repo is a thin
# caller pinned to a commit of this file. That is why this workflow reads one
# opaque `spec` input — a caller does not have to be regenerated when a build
# gains a parameter.
#
# It also answers `workflow_dispatch`, because an uploaded archive has no
# repository of its own and builds here instead.
#
# Two things it deliberately does not do:
#
#   * It never posts anything back. Logs are read, not pushed (§4), so the
#     result leaves on the one channel Spindrift already reads — the last line
#     this workflow prints.
#   * It never assesses what it built. The build adapter returns the artifact
#     and digest exactly as built and *core* decides whether that is admissible
#     (§16), so no backend is disqualifiable and the claim made is the honest
#     one. It does attach core's signature to the artifact in the registry —
#     see `Sign the artifact` for why that is a delivery step and not a
#     judgement, and why core cannot do it itself.
name: spindrift-build
run-name: spindrift ${{ inputs.correlation }}

on:
  workflow_call:
    inputs:
      spec:
        description: The build request, as JSON.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      spec:
        description: The build request, as JSON.
        required: true
        type: string
      correlation:
        description: How Spindrift finds this run again. Not a build input.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # The workflow-ref-scoped cloud identity §15 names: the job federates as
  # itself rather than holding a credential anything here has to carry.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Read the build request
        id: request
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          set -euo pipefail
          read_key() { printf '%s' "$SPEC" | jq -r "$1"; }
          {
            printf 'bundleDigest=%s\n' "$(read_key '.bundleDigest')"
            printf 'location=%s\n'     "$(read_key '.origin.location')"
            printf 'subpath=%s\n'      "$(read_key '.origin.subpath')"
            printf 'destination=%s\n'  "$(read_key '.destination')"
            printf 'frontend=%s\n'     "$(read_key '.zeroConfigFrontend')"
            # `// ""` for the same reason `tags` has a default: a spec composed
            # by a controller that predates this field must still build. Empty
            # means "this installation named no signing key", and the signing
            # steps below are skipped rather than failed — the artifact is then
            # exactly what it was before, and a Target whose admission wants a
            # signature is the thing that says so.
            printf 'signer=%s\n'       "$(read_key '.signer // ""')"
            printf 'attestor=%s\n'     "$(read_key '.attestor // ""')"
            printf 'registry=%s\n'     "$(read_key '.destination | split("/")[0]')"
            # §12 counts tags, so core sends every tag this push must carry and
            # the runner composes none of its own. Full references, because that
            # is what build-push-action's newline list takes.
            #
            # `// ["latest"]` because this file and the controller ship on
            # different clocks: the caller pins with `uses: ./…`, a local
            # reference resolving to the default branch's own commit, so a merge
            # here reaches the next dispatch immediately while the controller
            # image waits on a Flux rollout. A spec written before `tags`
            # existed must therefore still build — and `:latest` is exactly what
            # the bare destination meant to the reader of this file before it
            # did. Absent the default, every dispatch in that window dies here,
            # at the step before anything is recorded.
            printf 'tags<<SPINDRIFT_EOF\n'
            read_key '.destination + ":" + (.tags // ["latest"])[]'
            printf 'SPINDRIFT_EOF\n'
            printf 'buildArgs<<SPINDRIFT_EOF\n'
            read_key '.buildArgs | to_entries[] | "\(.key)=\(.value)"'
            printf 'SPINDRIFT_EOF\n'
          } >> "$GITHUB_OUTPUT"

      # The bundle, not the repository. §15 fetches the exact commit once and
      # stages one immutable bundle for either builder — cloning again here
      # would build a second tree the source receipt does not describe.
      - name: Fetch the staged bundle
        id: bundle
        env:
          LOCATION: ${{ steps.request.outputs.location }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundle"
          curl --fail --silent --show-error --location "$LOCATION" \
            | tar -xz -C "${RUNNER_TEMP}/bundle"
          # §5's unwrap, which is what makes the subpath below resolve. Core
          # records a scope relative to the source root, and a bundle's root is
          # not always that: a repository tarball wraps the whole tree in one
          # `{owner}-{repo}-{sha}` directory. The rule is the shape rather than
          # the source — exactly one entry and it a directory — because an
          # uploaded archive may arrive either way, and it is the same rule
          # `archiveScope` applies to the copy core detects against.
          root="${RUNNER_TEMP}/bundle"
          shopt -s dotglob nullglob
          entries=("$root"/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            root="${entries[0]}"
          fi
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"

      # §5's ladder, and the only decision made here: a Dockerfile settles how
      # to build and never what the thing is. Where there is none, the same
      # directory is handed to the pinned zero-config frontend — which is what
      # makes "one engine, two frontends" true rather than two build systems to
      # operate (§4).
      #
      # The zero-config arm does **not** write a `#syntax=` stub. The railpack
      # frontend reads the file it is given as its *build plan*, so a stub comes
      # back as `failed to parse railpack plan: invalid character '#' looking
      # for beginning of value` — at every version, which is why correcting the
      # pin alone never made this arm work. The documented invocation is a
      # generated plan as the file and the frontend named in `BUILDKIT_SYNTAX`.
      #
      # The plan is generated by `railpack prepare` at the **same release** as
      # the frontend that reads it, and the way that is guaranteed is to take
      # the generator out of the frontend image: `railpack-frontend` is the
      # whole railpack binary at `/railpack` with `ENTRYPOINT ["/railpack",
      # "frontend"]`, and `frontend` is one subcommand of the CLI that also
      # carries `prepare`. One artifact cannot disagree with itself. Deriving a
      # version from the image tag to download that binary a second time could,
      # and did — a tag that was not a version resolved to a release URL that
      # 404'd, in a step whose error named a download rather than the field.
      # The plan is written outside the scope, which the `-f` flag allows, so
      # the build context stays the source and nothing is left in the tree.
      - name: Choose the frontend
        id: frontend
        env:
          ROOT: ${{ steps.bundle.outputs.root }}
          SUBPATH: ${{ steps.request.outputs.subpath }}
          FRONTEND: ${{ steps.request.outputs.frontend }}
        run: |
          set -euo pipefail
          scope="${ROOT}/${SUBPATH}"

          if [ -f "${scope}/Dockerfile" ]; then
            {
              printf 'context=%s\n' "$scope"
              printf 'file=%s\n' "${scope}/Dockerfile"
              printf 'buildArgs=\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The generator is the frontend's own binary, run out of the frontend
          # image. The scope is mounted read-only because `prepare` reads the
          # tree and writes only where `--plan-out` points, and the plan lands
          # on its own mount so the build context stays the source.
          plan="${RUNNER_TEMP}/railpack-plan"
          mkdir -p "$plan"
          docker run --rm \
            -v "${scope}:/scope:ro" -v "${plan}:/out" \
            --entrypoint /railpack "$FRONTEND" \
            prepare /scope --plan-out /out/railpack-plan.json

          {
            printf 'context=%s\n' "$scope"
            printf 'file=%s\n' "${plan}/railpack-plan.json"
            printf 'buildArgs=BUILDKIT_SYNTAX=%s\n' "$FRONTEND"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # The run's own token, which is the only credential this job can hold
      # without one being stored somewhere (§13). An installation whose registry
      # does not accept it uses the cloud route, which federates instead.
      - name: Log in to the destination registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ steps.request.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ steps.frontend.outputs.context }}
          file: ${{ steps.frontend.outputs.file }}
          # The ladder's own argument rides with the request's. `BUILDKIT_SYNTAX`
          # is how the zero-config arm names its frontend, and it is empty on the
          # Dockerfile arm — the action drops the blank line.
          build-args: |
            ${{ steps.request.outputs.buildArgs }}
            ${{ steps.frontend.outputs.buildArgs }}
          push: true
          tags: ${{ steps.request.outputs.tags }}
          cache-from: |
            type=gha,scope=spindrift-build
            type=gha,scope=spindrift-push
          cache-to: type=gha,mode=max,scope=spindrift-build
          # BuildKit's own provenance, with materials. §16 calls this the second
          # document — unsigned, not the isolation claim, and where the base
          # digest comes from.
          provenance: mode=max
          sbom: true

      # §16's signature, put where a Target's own admission can read it.
      #
      # **This does not move signing off core.** Core still signs the digest and
      # still re-verifies its own bundle at admission; nothing about that
      # changes. What is added here is a *second* signature over the same digest
      # with the same key, attached to the artifact **in the registry** — which
      # is the only place a Target's native policy boundary can look. The
      # offsite cluster's `spindrift-verify-images` asks cosign for exactly
      # that, and core cannot put it there: a cosign signature is a
      # `sha256-<digest>.sig` object pushed to the repository, and the
      # controller holds no registry write credential. This job does, having
      # just pushed the artifact with it.
      #
      # Before the report deliberately. A signing failure has to fail the build
      # rather than report an artifact no Target will admit — a green Build
      # whose Deploy is refused at the admission webhook is the shape this whole
      # sequence exists to avoid.
      #
      # `--tlog-upload=false` matches how core already invokes its signer: there
      # is no public transparency log in this trust model, only a KMS key whose
      # public half the policy pins. The policy says the same thing from its own
      # side with `ctlog.ignoreTlog`.
      - name: Authenticate to Google Cloud
        if: steps.request.outputs.signer != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true

      - name: Install cosign
        if: steps.request.outputs.signer != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the artifact
        if: steps.request.outputs.signer != ''
        env:
          SIGNER: ${{ steps.request.outputs.signer }}
          DESTINATION: ${{ steps.request.outputs.destination }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # The registry credential is the one `Log in to the destination
          # registry` already wrote to the Docker config; cosign reads it from
          # there, so nothing here holds a credential of its own (§13).
          cosign sign --yes --tlog-upload=false \
            --key "$SIGNER" "${DESTINATION}@${DIGEST}"
          # Verified here as well as at admission, because a signature that
          # cannot be checked by the key that made it is a build that should
          # fail now rather than a Deploy that is refused later by a webhook
          # whose message is about a policy rather than about this build.
          cosign verify --insecure-ignore-tlog \
            --key "$SIGNER" "${DESTINATION}@${DIGEST}" > /dev/null

      # The other half of the same key, for the other kind of verifier.
      #
      # A cluster's policy engine reads a signature off the artifact in the
      # registry. A cloud runtime's Binary Authorization reads an
      # *attestation* — an occurrence on a note in the authority's own
      # project, which is not in the registry at all and cannot be derived
      # from a signature that is. One key, two verifiers, two artifacts, and
      # a Target that enforces the second refuses a perfectly signed image
      # that lacks it.
      #
      # The key version is read off the attestor rather than configured,
      # because the attestor is what decides which version it trusts: it
      # registered a specific `cryptoKeyVersions/N` as its public key, and an
      # attestation signed by any other version is one it will not accept.
      # Asking it is the only way to be right about that without a second
      # value to keep in step.
      - name: Attest the artifact
        if: steps.request.outputs.attestor != '' && steps.request.outputs.signer != ''
        env:
          ATTESTOR: ${{ steps.request.outputs.attestor }}
          DESTINATION: ${{ steps.request.outputs.destination }}
          DIGEST: ${{ steps.push.outputs.digest }}
          # `sign-and-create` lives on the beta surface. Without this, a runner
          # image that does not carry the component stops to ask whether to
          # install it, and a prompt on a runner is a hang followed by a
          # timeout. With it, gcloud installs the component and continues.
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -euo pipefail
          project="${ATTESTOR%%/attestors/*}"; project="${project#projects/}"
          name="${ATTESTOR##*/attestors/}"

          # //cloudkms.googleapis.com/v1/projects/P/locations/L/keyRings/R/cryptoKeys/K/cryptoKeyVersions/N
          key="$(gcloud container binauthz attestors describe "$name" \
            --project="$project" \
            --format='value(userOwnedGrafeasNote.publicKeys[0].id)')"
          strip() { printf '%s' "${key#*"/$1/"}" | cut -d/ -f1; }

          gcloud beta container binauthz attestations sign-and-create \
            --project="$project" \
            --artifact-url="${DESTINATION}@${DIGEST}" \
            --attestor="$name" \
            --attestor-project="$project" \
            --keyversion-project="$(strip projects)" \
            --keyversion-location="$(strip locations)" \
            --keyversion-keyring="$(strip keyRings)" \
            --keyversion-key="$(strip cryptoKeys)" \
            --keyversion="$(strip cryptoKeyVersions)"

      # The one line Spindrift reads. Base64 because this stdout goes through
      # the host's log processing on the way back, and a folded or decorated
      # payload is a payload core cannot decode.
      #
      # **`statement` is a SLSA v1 provenance document, not a note.** Core does
      # not treat it as opaque: `supply-chain/verify.ts` hands it to
      # `spindrift-verifier`, which reads `predicate.runDetails.builder.id`
      # against the route's `provenanceBuilderId` and `subject[0].digest.sha256`
      # against the admitted artifact — and core then reads
      # `predicate.buildDefinition.externalParameters.bundleDigest` back out of
      # the verified envelope for §16's join. A statement missing any of those
      # is refused *after* the image is pushed, which reads as a green run whose
      # Build failed with nothing to deploy.
      #
      # It is still the runner's own account of itself, exactly as `route.ts`
      # says — the builder id here is asserted, not attested. Shaping it
      # correctly does not make it evidence; it makes it checkable. The builder
      # id is spelled out because it must equal `GitHubActionsBuildRoute`'s
      # constant, and `test/adapters/build-report-statement.test.ts` runs this
      # jq to assert the two still agree.
      - name: Report what was built
        env:
          BUNDLE_DIGEST: ${{ steps.request.outputs.bundleDigest }}
          DESTINATION: ${{ steps.request.outputs.destination }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Best effort, and null when it is not there: a base is fresh only at
          # build time, so §16 surfaces a stale one and never corrects it — but
          # a builder that cannot report one says so rather than guessing.
          base="$(docker buildx imagetools inspect "${DESTINATION}@${DIGEST}" \
            --format '{{ json .Provenance }}' 2>/dev/null \
            | jq -r '[.. | .uri? // empty | select(startswith("pkg:docker"))][0] // empty' \
            | grep -oE 'sha256(:|%3A)[0-9a-f]{64}' \
            | sed 's/%3A/:/' || true)"
          report="$(jq -nc \
            --arg bundleDigest "$BUNDLE_DIGEST" \
            --arg digest "$DIGEST" \
            --arg destination "$DESTINATION" \
            --arg ref "${DESTINATION}@${DIGEST}" \
            --arg base "$base" \
            --arg run "${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            '{bundleDigest: $bundleDigest,
              digest: $digest,
              refs: [$ref],
              baseDigest: (if $base == "" then null else $base end),
              buildkitProvenanceRef: $ref,
              sbomRef: $ref,
              statement: {
                _type: "https://in-toto.io/Statement/v1",
                subject: [{
                  name: $destination,
                  digest: {sha256: ($digest | ltrimstr("sha256:"))}
                }],
                predicateType: "https://slsa.dev/provenance/v1",
                predicate: {
                  buildDefinition: {
                    buildType: "https://spindrift.dev/buildtypes/github-actions/v1",
                    externalParameters: {
                      bundleDigest: $bundleDigest,
                      workflow: $workflow
                    }
                  },
                  runDetails: {
                    builder: {id: "https://github.com/actions/runner/github-hosted"},
                    metadata: {invocationId: $run}
                  }
                }
              }}')"
          echo "spindrift-result $(printf '%s' "$report" | base64 | tr -d '\n')"
