name: ARC Smoke

# Proves on demand that a self-hosted scale set can run a job: the runner
# reaches its dind daemon, and a `services:` container answers on localhost.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: Which cluster's scale set to run on
        type: choice
        options:
          - folly
          - offsite
        default: folly

permissions:
  contents: read

jobs:
  dind:
    runs-on: ${{ inputs.cluster }}
    timeout-minutes: 10
    # A service that never turns healthy fails the job before any step runs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Runner reaches the dind daemon
        run: docker version

      - name: Service container answers on the job's localhost
        run: |
          timeout 30 bash -c \
            'until (echo > /dev/tcp/localhost/5432) 2>/dev/null; do sleep 1; done'
          echo "postgres reachable on localhost:5432"
