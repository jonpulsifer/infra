name: talos render parity

# Atlantis renders folly's machine configs with the talos provider, and the
# enrollment server renders them with talosctl gen config. This fails when the
# two disagree by a byte, such as after a provider or talosctl bump.

on:
  push:
    branches: [main]
    paths: &paths
      - 'terraform/modules/talos-cluster/**'
      - 'terraform/modules/cluster-topology/**'
      - 'terraform/network/tailscale/fleet.tf.json'
      - 'clusters/folly/talos/**'
      - 'clusters/folly/config/cluster-topology.json'
      - 'mise.toml'
      - '.github/scripts/talos-render-parity.sh'
      - '.github/workflows/talos-render-parity.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: talos-render-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: opentofu talosctl
      - name: Render folly with the provider and with talosctl
        run: bash .github/scripts/talos-render-parity.sh clusters/folly/talos
