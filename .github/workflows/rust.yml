name: rust

# apps/fml-derive-rs is a second implementation of the FML derivation. The
# filters include apps/fml-ceremony so the differential runs when either side
# changes; under go.yml it skips itself for want of a Rust binary.

on:
  push:
    branches: [main]
    paths:
      - 'apps/fml-ceremony/**'
      - 'apps/fml-derive-rs/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'apps/fml-ceremony/**'
      - 'apps/fml-derive-rs/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fml-derive-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The runner's rustup follows rust-toolchain.toml, so no toolchain action.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # --locked: a differential must not float its own dependencies.
      - run: cargo test --locked

  crosscheck:
    name: go/rust differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/fml-ceremony/go.mod
          cache: false
      - run: cargo build --release --locked --manifest-path apps/fml-derive-rs/Cargo.toml
      # `mise run pki:crosscheck` without its nix dev shell, which only supplies
      # a linker the runner already has.
      - name: derivation differential
        env:
          FML_DERIVE_RS: ${{ github.workspace }}/apps/fml-derive-rs/target/release/fml-derive
        run: go -C apps/fml-ceremony test ./derive/ -run TestDifferentialAgainstRust -v -count=1
