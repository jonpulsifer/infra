name: TypeScript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner target (infra-offsite, infra-folly, ubuntu-latest)'
        type: choice
        options:
          - infra-offsite
          - infra-folly
          - ubuntu-latest
        default: ubuntu-latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changed-paths.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changed-paths
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          # The `clusters/` paths are here because spindrift's conformance
          # tests read the DNS controller's declaration rather than a fixture:
          # the sources external-dns runs are something the suite asserts and
          # something that changes only there. `turbo.json`'s `spindrift#test`
          # inputs name the same files — a path missing from both lists is a
          # guard that cannot run in CI.
          files: |
            apps/hub/**
            apps/slingshot/**
            apps/spindrift/**
            packages/charts/**
            clusters/*/networking/external-dns/helm-release.yaml
            clusters/*/networking/external-dns/kustomization.yaml
            packages/k6/**
            packages/typescript-config/**
            package.json
            bun.lock
            turbo.json
            biome.json
            .github/workflows/typescript.yml

  validate:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      # spindrift's tests fake the far side of an adapter, never the database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spindrift
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A `services:` container blocks every step in the job — including
      # Checkout — behind its health check, even though nothing before `Test`
      # touches the database. Starting it here instead lets it boot in the
      # background across auth/setup/cache/install/lint/typecheck/build, so by
      # the time `Wait for Postgres` runs it is normally already healthy.
      - name: Start Postgres
        run: |
          docker rm -f spindrift-test-db >/dev/null 2>&1 || true
          # This database is destroyed when the job ends, so every guarantee it
          # makes about surviving a crash is paid for and never collected.
          # spindrift's harness builds and drops a schema per test — over 1600
          # of them — and with `fsync` on, each one waits on real disk flushes
          # for state nothing will ever read again. Measured on one machine,
          # everything else held constant: 199s → 96s → 31s across the harness
          # fix and this. It is the difference between a five-second hook having
          # margin and having none.
          #
          # `max_connections` is headroom rather than a requirement: the suite
          # peaks near 30, but a backend the server has not finished reaping
          # still counts against the limit, and on a contended runner that lag
          # is what becomes `sorry, too many clients already`.
          docker run -d --name spindrift-test-db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=spindrift \
            -e POSTGRES_INITDB_ARGS="-c max_connections=300 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \
            -p 5432:5432 \
            postgres:18-alpine
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-
      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
            apps/*/.turbo
            packages/*/.turbo
            apps/*/.next/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-
            turbo-${{ runner.os }}-
      # The App chart's goldens run `helm template` under `bun test`, where the
      # chart lives (packages/charts). spindrift's own suite templates the same
      # chart to assert what the record `reach` publishes ends up being, so the
      # binary is a requirement of both packages rather than one.
      - name: Set up Helm
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: helm
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            docker exec spindrift-test-db pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1
      - name: Test
        run: bun run test
      - name: Stop Postgres
        if: always()
        run: docker rm -f spindrift-test-db >/dev/null 2>&1 || true
