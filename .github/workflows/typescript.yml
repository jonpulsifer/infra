name: TypeScript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner target (skiff-offsite, infra-offsite, infra-folly, ubuntu-latest)'
        type: choice
        options:
          - skiff-offsite
          - infra-offsite
          - infra-folly
          - ubuntu-latest
        default: skiff-offsite

permissions:
  contents: read
  id-token: write

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.classify.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changed-paths
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          # The `clusters/` paths are here because spindrift's conformance
          # tests read those declarations rather than a fixture: `charts.app`,
          # a Target's delivery `sourceRef`, an `OCIRepository` tag, and the
          # sources the DNS controller runs are all things the suite asserts
          # and all things that change only there.
          # `turbo.json`'s `spindrift#test` and `spindrift#test:chart-pins`
          # inputs together name the same files — a path missing from all
          # three lists is a guard that cannot run in CI.
          files: |
            apps/hub/**
            apps/slingshot/**
            apps/spindrift/**
            packages/charts/**
            clusters/base/platform/spindrift-target/**
            clusters/offsite/apps/spindrift/**
            clusters/*/networking/external-dns/helm-release.yaml
            clusters/*/networking/external-dns/kustomization.yaml
            packages/k6/**
            packages/typescript-config/**
            package.json
            bun.lock
            turbo.json
            biome.json
            .github/workflows/typescript.yml
      - id: classify
        env:
          ANY_CHANGED: ${{ steps.changed-paths.outputs.any_changed }}
          ALL_CHANGED_FILES: ${{ steps.changed-paths.outputs.all_changed_files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          has_changes="$ANY_CHANGED"

          # Every release continuous delivery stamps this image's digest into,
          # from `.github/containers.json`.
          releases=(
            clusters/offsite/apps/spindrift/helm-release.yaml
          )

          # Continuous delivery only rewrites the image digest. The rest of each
          # release is a conformance-test input and remains significant, so this
          # skips only when every changed file is one of those releases and
          # every one of them differs at nothing but that line.
          only_digests=true
          for changed in $ALL_CHANGED_FILES; do
            known=false
            for release in "${releases[@]}"; do
              [[ "$changed" == "$release" ]] && known=true && break
            done
            if ! "$known" || ! git diff --quiet \
              --ignore-matching-lines='^[[:space:]]*image: ghcr\.io/jonpulsifer/spindrift:latest@sha256:[[:xdigit:]]{64}$' \
              "$BASE_SHA" "$HEAD_SHA" -- "$changed"; then
              only_digests=false
              break
            fi
          done
          if [[ -n "$ALL_CHANGED_FILES" ]] && "$only_digests"; then
            has_changes=false
          fi

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    # A hosted runner, because the suite no longer fits `skiff-offsite`'s
    # 3072M/2-vcpu class. Restoring the installation's conformance tests —
    # each one standing up an isolated database — takes the Test step past
    # what that slot can hold: it dies at ~229 s where a hosted runner
    # finishes in 255 s, twice, with the DB-timing signature the class's own
    # comment on `oldschool` predicts and a Bun segfault behind it.
    #
    # The warm pool is still the destination and the rest of its case stands
    # (~1 s acquisition, cache served locally rather than over the internet).
    # What it needs is a bigger class, and that is a memory bound guarding
    # kubelet on a shared box — an operator's arithmetic, not a workflow's.
    # The dispatch input reaches any label, which is how the A/B above ran.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      # spindrift's tests fake the far side of an adapter, never the database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spindrift
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A `services:` container blocks every step in the job — including
      # Checkout — behind its health check, even though nothing before `Test`
      # touches the database. Starting it here instead lets it boot in the
      # background across auth/setup/cache/install/lint/typecheck/build, so by
      # the time `Wait for Postgres` runs it is normally already healthy.
      - name: Start Postgres
        run: |
          docker rm -f spindrift-test-db >/dev/null 2>&1 || true
          # This database is destroyed when the job ends, so every guarantee it
          # makes about surviving a crash is paid for and never collected.
          # spindrift's harness builds and drops a schema per test — over 1600
          # of them — and with `fsync` on, each one waits on real disk flushes
          # for state nothing will ever read again. Measured on one machine,
          # everything else held constant: 199s → 96s → 31s across the harness
          # fix and this. It is the difference between a five-second hook having
          # margin and having none.
          #
          # `max_connections` is headroom rather than a requirement: the suite
          # peaks near 30, but a backend the server has not finished reaping
          # still counts against the limit, and on a contended runner that lag
          # is what becomes `sorry, too many clients already`.
          docker run -d --name spindrift-test-db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=spindrift \
            -e POSTGRES_INITDB_ARGS="-c max_connections=300 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \
            -p 5432:5432 \
            postgres:18-alpine
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # A skiff's hull points bun's store at the workspace disk; the
          # cache step must follow it or it caches an empty directory. On a
          # hosted runner the env is unset and this is the usual path.
          path: ${{ env.BUN_INSTALL_CACHE_DIR || '~/.bun/install/cache' }}
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-
      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
            apps/*/.turbo
            packages/*/.turbo
            apps/*/.next/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-
            turbo-${{ runner.os }}-
      # The App chart's goldens run `helm template` under `bun test`, where the
      # chart lives (packages/charts). spindrift's own suite templates the same
      # chart to assert what the record `reach` publishes ends up being, so the
      # binary is a requirement of both packages rather than one.
      # yq is named for the same reason: spindrift's declaration-arm suite
      # executes the shipped "Choose the frontend" script, which calls yq. A
      # hosted runner preinstalls one and passed by accident; every other label
      # this repo owns boots the slim actions-runner image, which does not, so
      # the tool has to be asked for rather than assumed.
      - name: Set up Helm and yq
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: helm yq
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            docker exec spindrift-test-db pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1
      - name: Test
        run: bun run test
      - name: Stop Postgres
        if: always()
        run: docker rm -f spindrift-test-db >/dev/null 2>&1 || true
