name: TypeScript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner target (ubuntu-latest, infra-offsite, infra-folly)'
        type: choice
        options:
          - ubuntu-latest
          - infra-offsite
          - infra-folly
        default: ubuntu-latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.classify.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: changed-paths
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          # The clusters/, mise.toml and dotfiles/skills/ paths are test inputs.
          # Keep them in step with the spindrift, mate and switchboard test
          # inputs in turbo.json.
          files: |
            apps/clankerbanker/**
            apps/hub/**
            apps/kthx/**
            apps/mate/**
            apps/slingshot/**
            apps/spindrift/**
            apps/switchboard/**
            clusters/folly/apps/pbx/config/**
            clusters/folly/apps/pbx/switchboard.yaml
            packages/charts/**
            clusters/base/platform/spindrift-target/**
            clusters/offsite/apps/spindrift/**
            clusters/*/networking/external-dns/helm-release.yaml
            clusters/*/networking/external-dns/kustomization.yaml
            packages/k6/**
            clusters/folly/apps/k6/**
            packages/archive/**
            packages/kthx/**
            packages/typescript-config/**
            dotfiles/skills/**
            images/mate-sandbox/mise.toml
            mise.toml
            package.json
            bun.lock
            turbo.json
            biome.json
            .github/workflows/typescript.yml
      - id: classify
        env:
          ANY_CHANGED: ${{ steps.changed-paths.outputs.any_changed }}
          ALL_CHANGED_FILES: ${{ steps.changed-paths.outputs.all_changed_files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          has_changes="$ANY_CHANGED"

          # Every release continuous delivery stamps this image's digest into,
          # from `.github/containers.json`.
          releases=(
            clusters/offsite/apps/spindrift/helm-release.yaml
          )

          # Continuous delivery only rewrites the image digest. The rest of each
          # release is a conformance-test input and remains significant, so this
          # skips only when every changed file is one of those releases and
          # every one of them differs at nothing but that line.
          only_digests=true
          for changed in $ALL_CHANGED_FILES; do
            known=false
            for release in "${releases[@]}"; do
              [[ "$changed" == "$release" ]] && known=true && break
            done
            if ! "$known" || ! git diff --quiet \
              --ignore-matching-lines='^[[:space:]]*image: ghcr\.io/jonpulsifer/spindrift:latest@sha256:[[:xdigit:]]{64}$' \
              "$BASE_SHA" "$HEAD_SHA" -- "$changed"; then
              only_digests=false
              break
            fi
          done
          if [[ -n "$ALL_CHANGED_FILES" ]] && "$only_digests"; then
            has_changes=false
          fi

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spindrift
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          provider: github
          # GitHub folds the archive path into the cache version, so a relative
          # path lets hosted and ARC runners share entries.
          use-relative-cache-path: true
      # A `services:` container holds every step behind its health check. Started
      # here, Postgres boots while the setup steps run.
      - name: Start Postgres
        run: |
          docker rm -f spindrift-test-db >/dev/null 2>&1 || true
          # This database is destroyed when the job ends, so every guarantee it
          # makes about surviving a crash is paid for and never collected.
          # spindrift's harness builds and drops a schema per test — over 1600
          # of them — and with `fsync` on, each one waits on real disk flushes
          # for state nothing will ever read again. Measured on one machine,
          # everything else held constant: 199s → 96s → 31s across the harness
          # fix and this. It is the difference between a five-second hook having
          # margin and having none.
          #
          # `max_connections` is headroom rather than a requirement: the suite
          # peaks near 30, but a backend the server has not finished reaping
          # still counts against the limit, and on a contended runner that lag
          # is what becomes `sorry, too many clients already`.
          docker run -d --name spindrift-test-db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=spindrift \
            -e POSTGRES_INITDB_ARGS="-c max_connections=300 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \
            -p 5432:5432 \
            postgres:18-alpine
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Follow a relocated bun store, or this caches an empty directory.
          path: ${{ env.BUN_INSTALL_CACHE_DIR || '~/.bun/install/cache' }}
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-
      # apps/spindrift and packages/charts tests run `helm template`, and apps/spindrift
      # runs the "Choose the frontend" step of spindrift-build.yml, which calls yq.
      - name: Set up Helm and yq
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: helm yq
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            docker exec spindrift-test-db pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "Postgres did not become ready in time" >&2
          exit 1
      - name: Test
        run: bun run test
      - name: Stop Postgres
        if: always()
        run: docker rm -f spindrift-test-db >/dev/null 2>&1 || true
