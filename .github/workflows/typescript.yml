name: TypeScript

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/hub/**"
      - "apps/slingshot/**"
      - "apps/spindrift/**"
      - "packages/charts/**"
      - "packages/k6/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"
  push:
    branches: [main]
    paths:
      - "apps/hub/**"
      - "apps/slingshot/**"
      - "apps/spindrift/**"
      - "packages/charts/**"
      - "packages/k6/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      # spindrift's tests fake the far side of an adapter, never the database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spindrift
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spindrift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # The App chart's goldens run `helm template` under `bun test`, where the
      # chart lives (packages/charts).
      - name: Set up Helm
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          install_args: helm
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
