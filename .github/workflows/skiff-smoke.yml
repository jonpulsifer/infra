name: Skiff Smoke

# Proves on demand that a skiff, a microVM that serves one job, can run a job.
# The runner deregisters and the skiff powers off afterwards, so nothing here
# cleans up.

on:
  workflow_dispatch:
    inputs:
      label:
        description: Which class to run on
        type: string
        default: skiff-nixos

permissions:
  contents: read

jobs:
  skiff:
    # Keyed on the skiff-nixos prefix, because every other class boots the
    # Ubuntu hull whatever its label.
    if: ${{ startsWith(inputs.label, 'skiff-nixos') }}
    runs-on: ${{ inputs.label }}
    timeout-minutes: 10
    steps:
      - name: The store came from the host, warm
        run: |
          # Not through a pipe: a pipeline reports the last command's status,
          # which would hide nix-store failing outright.
          registered=$(nix-store -q --requisites /run/current-system | wc -l)
          visible=$(ls /nix/store | wc -l)
          echo "registered: $registered   visible: $visible"
          test "$registered" -gt 100
          test "$visible" -gt 1000

      - name: The overlay takes writes
        run: nix-store --add /etc/hostname

      - name: nix-ld resolves the FHS interpreter
        run: test -e /lib64/ld-linux-x86-64.so.2

      - name: Docker starts on demand and runs a container
        run: |
          docker version --format '{{.Server.Version}}'
          docker run --rm alpine echo container-ok

      - name: This is a skiff, and it knows which one
        run: |
          tr ' ' '\n' < /proc/cmdline | grep '^bosun\.'
          test "$(systemd-detect-virt)" = kvm

  # The Ubuntu hull is an FHS guest with no Nix, flattened from the ARC runner
  # image. This job checks that fidelity and the docker and identity basics.
  skiff-ubuntu:
    if: ${{ !startsWith(inputs.label, 'skiff-nixos') }}
    runs-on: ${{ inputs.label }}
    timeout-minutes: 10
    steps:
      - name: This is Ubuntu, and apt works
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends sl
          test -x /usr/games/sl

      - name: The ARC image toolchain is present
        run: |
          git --version
          node --version
          jq --version

      - name: Docker runs a container
        run: |
          docker version --format '{{.Server.Version}}'
          docker run --rm alpine echo container-ok

      - name: This is a skiff, and it knows which one
        run: |
          tr ' ' '\n' < /proc/cmdline | grep '^bosun\.'
          grep -q 'Cloud Hypervisor' /sys/class/dmi/id/sys_vendor
