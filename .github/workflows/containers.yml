name: containers
on:
  # No image watches a path under clusters/, so a change there, such as a
  # digest pull request and its merge, has nothing to build.
  push:
    branches:
      - main
    paths-ignore:
      - "clusters/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "clusters/**"
  # A push builds only what it changed, so a build that never finishes is never
  # retried. The schedule rebuilds each image pinned behind main.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      images:
        description: >-
          Images to build, space separated. Empty means whatever is stale.
        required: false
        default: ""

# A cancelled run's images are never rebuilt by a later push. queue: max keeps
# pending runs, which cancel-in-progress does not, and the two cannot combine.
concurrency:
  group: containers-${{ github.ref }}
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      guard: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The stale-image pass needs full history. A push or pull request
          # needs its base joined to the head, because `turbo ls --affected`
          # diffs from their merge base: a push's base is the head's parent,
          # and a pull request's is the merge commit's first parent. Quoted,
          # because GitHub expressions treat 0 as false and `cond && 0 || 2`
          # is always 2.
          fetch-depth: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '0' || '2' }}

      # image-affected.sh runs turbo through bunx, at the version package.json
      # pins, when a root lockfile change reaches a workspace image.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # One of these two runs: a push or pull request builds what it changed,
      # and a schedule or dispatch builds what is stale or what the operator named.
      - id: changed
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          separator: "\n"

      - id: stale
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REQUESTED: ${{ github.event.inputs.images }}
        run: |
          set -euo pipefail

          # A digest that has been built and is waiting on its delivery pull
          # request is a build that already got here, so the staleness read has
          # to see it or the schedule would order a rebuild on top of it every
          # night until that pull request merged. Same refspec and same
          # namespace the delivery step uses, so both read the queue the same
          # way. A wildcard matching nothing is a success, so a repository with
          # no digest branch open stays quiet while a network failure is loud.
          git fetch --no-tags origin "+refs/heads/cd/*:refs/cd/queued/*"

          # An operator who named images gets those images. Naming them is the
          # override for the case this cannot detect — an image whose
          # provenance is unreadable, which `stale` deliberately refuses to
          # guess about.
          # `:-` because a `schedule` run declares this variable from an
          # expression with nothing behind it, and the step runs under `set
          # -u`. The same reason the delivery step below reads `${CD_ACTOR:-}`.
          requested="${REQUESTED:-}"
          if [ -n "${requested// /}" ]; then
            echo "Building images named by hand: $requested"
            echo "images=$requested" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          images=$(bash .github/scripts/cd-stale-images.sh stale | tr '\n' ' ')
          if [ -z "${images// /}" ]; then
            echo "Every deployed image is pinned at a build of the newest commit touching it."
          else
            echo "::notice::Rebuilding images whose pin is behind main: $images"
          fi
          echo "images=$images" >>"$GITHUB_OUTPUT"

      # detect-containers.sh compares this workflow's build job on a push to
      # main with yq.
      - if: github.event_name == 'push'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          install_args: yq

      - id: set-matrix
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          BUILD_IMAGES: ${{ steps.stale.outputs.images }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/detect-containers.sh

      # cd-guard's suites read only these files: this workflow, whose record and
      # delivery steps cd-digest-step_test.sh runs, the scripts under test and the
      # allowlist. A dispatch runs them on demand.
      - id: guard
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          inputs='^\.github/(workflows/containers\.yml|containers\.json|scripts/(cd-|detect-containers|image-affected))'
          run=false
          if [ "$EVENT_NAME" = workflow_dispatch ] || grep -Eq "$inputs" <<<"$CHANGED_FILES"; then
            run=true
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  cd-guard:
    needs: detect
    if: needs.detect.outputs.guard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          # cd-digest-step_test.sh reads this workflow with yq, so it is not
          # left to the runner image.
          install_args: yq
      - run: bash .github/scripts/cd-digest-update_test.sh
      - run: bash .github/scripts/cd-digest-step_test.sh
      - run: bash .github/scripts/cd-stale-images_test.sh
      - run: bash .github/scripts/detect-containers_test.sh
      - run: bash .github/scripts/image-affected_test.sh

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    # Hosted: an image build outgrows the lab runners' disk, and hosted runners
    # are free for a public repository.
    runs-on: ubuntu-latest
    # Delivery is the deliver job's, so a build writes nothing to the repository.
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Per-image needs come from each app's build.json through the matrix.
      - name: Authenticate build to Google Cloud
        if: matrix.gcp-credentials != ''
        id: gcp_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up QEMU
        if: contains(matrix.platforms, ',') || (matrix.platforms != '' && !contains(matrix.platforms, 'linux/amd64'))
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        # Pull requests build without pushing, and a fork has no registry creds.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        # The build is pushed under its name and each alias; the digest is the
        # same under every name. Delivery uses the first name.
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -euo pipefail
          {
            echo 'images<<EOF'
            for name in "$IMAGE" $ALIASES; do
              echo "ghcr.io/$OWNER/$name"
            done
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"
      - name: Generate Docker Meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          flavor: |
            latest=true
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long
      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # The publishing events are listed, so a new trigger cannot push by
          # default. Only main publishes.
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image and ref, so pull request caches never reach main's
          # builds and images never share a cache.
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ github.ref_name }}
            type=gha,scope=${{ matrix.image }}-${{ github.event_name }}
            type=gha,scope=${{ matrix.image }}-main
            type=gha,scope=${{ matrix.image }}-push
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ github.ref_name }}
          no-cache-filters: ${{ matrix.no-cache-filters }}
          secret-files: ${{ matrix.gcp-credentials != '' && format('gcp_credentials={0}', steps.gcp_auth.outputs.credentials_file_path) || '' }}
          sbom: true
          provenance: true
      # Delivery runs once per run, in the deliver job, so each leg hands it a
      # record of what it pushed instead of opening its own pull request.
      - name: Record the build for delivery
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          MANIFESTS: ${{ toJson(matrix.manifests) }}
          BUILT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "::error::The build of $IMAGE_NAME pushed no digest, so there is nothing to deliver."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cd"
          jq -n --arg image "$IMAGE_NAME" --arg digest "$DIGEST" \
            --arg built_commit "$BUILT_COMMIT" --argjson manifests "$MANIFESTS" \
            '{image: $image, digest: $digest, built_commit: $built_commit, manifests: $manifests}' \
            >"$RUNNER_TEMP/cd/$IMAGE_NAME.json"
      - name: Record the build as an artifact
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cd-${{ matrix.image }}
          path: ${{ runner.temp }}/cd/${{ matrix.image }}.json
          if-no-files-found: error
          # A rerun of this leg uploads the same name again.
          overwrite: true
          retention-days: 1

  deliver:
    needs: build
    # A leg that failed recorded nothing, so the legs that pushed still deliver.
    # A cancelled or skipped build has nothing to hand on.
    if: >-
      always() && (needs.build.result == 'success' || needs.build.result == 'failure')
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Git sends a persisted GITHUB_TOKEN header ahead of any credential in
          # the remote URL, so the delivery step would push as
          # github-actions[bot] however it sets the URL. That identity's push to
          # an open pull request holds every check at action_required, and
          # --auto never merges it.
          persist-credentials: false
      - name: Download the build records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cd-*
          merge-multiple: true
          path: ${{ runner.temp }}/cd
      # A pull request opened with GITHUB_TOKEN gets no checks, so --auto never
      # merges it. Gated on a variable because step conditions cannot read secrets.
      - name: Mint a continuous-delivery App token
        id: cd-app-token
        if: vars.CD_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
      - name: Update manifest digests for selective continuous delivery
        env:
          GH_TOKEN: ${{ steps.cd-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          CD_ACTOR: ${{ steps.cd-app-token.outputs.app-slug }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Copied out of the tree before the checkout below replaces the
          # working tree with main's content. A step that swaps the program it
          # is running halfway through is a step nobody can reason about.
          # Deliberately the built commit's copy and not main's: this step and
          # that script are one program split across two files, and their
          # argument contract moves together, so pairing an old step with a new
          # script is a broken call nobody would see until a rerun made it.
          cd_digest="$RUNNER_TEMP/cd-digest-update.sh"
          cp .github/scripts/cd-digest-update.sh "$cd_digest"

          # One record per image this run pushed, written by the build job's
          # "Record the build for delivery" step. A leg that failed left none.
          shopt -s nullglob
          records=("$RUNNER_TEMP"/cd/*.json)
          if [ "${#records[@]}" -eq 0 ]; then
            echo "No build in this run pushed an image, so there is nothing to deliver."
            exit 0
          fi

          # **Everything below happens on current main, not on the commit this
          # run built.** A branch cut from the build's own checkout is a diff
          # against a main that has since moved on: the moment anything else
          # touches the same manifest — and a deployment manifest is touched
          # for a dozen reasons that have nothing to do with its digest — the
          # digest commit conflicts. `--auto` never fires on a conflicting pull
          # request, so the digest sits there forever while every step of this
          # job reports green; four `cd/*` pull requests were stuck
          # CONFLICTING at once when this was written. Re-deriving the rewrite
          # from main's copy of each file makes the pull request a change of
          # digest lines against the branch it targets, which cannot conflict.
          #
          # The full history comes with it because the guard below has an
          # ancestry question to answer, and `actions/checkout` leaves a
          # depth-1 clone that can only answer it wrong.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin main
          else
            git fetch --no-tags origin main
          fi
          # Pinned now, because the second fetch below moves FETCH_HEAD.
          main_head=$(git rev-parse FETCH_HEAD)

          # One branch for every image, not one per image or per commit. The
          # branch is a queue with a single slot: each run cuts it fresh from
          # main, writes every digest it built, carries over the digests already
          # waiting there, and force-pushes, so there is never more than one
          # open pull request asking to roll anything. A branch per commit
          # would instead leave every superseded build open as its own
          # mergeable pull request, each one carrying an older digest — the
          # regression the guard below exists to prevent, reintroduced as a
          # matter of routine.
          BRANCH_NAME=cd/update-digests
          QUEUED_REF=refs/cd/queued/update-digests

          # What is already sitting in that slot is an input to the guard
          # below, so it has to be fetched, and a failure to fetch it has to be
          # loud. A wildcard refspec gives both: matching no branch at all is a
          # success, so "nothing queued" stays silent, while a network or auth
          # failure exits non-zero and stops the step instead of reading as an
          # empty queue. Naming the branch exactly would fail on the first push.
          git fetch --no-tags origin "+refs/heads/cd/*:refs/cd/queued/*"

          git checkout -B "$BRANCH_NAME" "$main_head"

          # An **open** one, not any one. `gh pr view <branch>` answers with the
          # most recent pull request for that head whatever its state, so once
          # the first digest bump merged it went on finding it, skipped the
          # create, and no-opped the auto-merge — leaving the branch force-pushed
          # with a correct digest and no pull request to carry it. Continuous
          # delivery stopped silently, with every step green.
          open_pr() {
            gh pr list --repo "$GITHUB_REPOSITORY" \
              --head "$1" --state open --json number --jq '.[0].number'
          }

          written=()
          written_images=()
          failed_images=()

          # Stages one image's digest on the branch, or says why not. Every way
          # out is a return, never an exit: one image with nothing to roll must
          # not stop the images after it.
          deliver() {
            local IMAGE_NAME="$1" DIGEST="$2" BUILT_COMMIT="$3" MANIFESTS="$4"
            local REGISTRY_REPOSITORY="$REGISTRY_OWNER/$1"
            local -a targets pinned_digests pinned_commits
            local main_pins queued_pins candidates pinned_digest pinned_commit
            local verdict new_fingerprint same target

            # Deploy targets come from main's map for the same reason the
            # manifests do. A target renamed or dropped on main since this
            # commit was built is not a broken deploy map; it is a deploy map
            # this run is behind, and reading the built commit's list here
            # names a file main no longer has and fails the job — permanently,
            # since every rerun reads the same stale list. `rewrite` keeps its
            # `::error::` for a target main's own map names and main's own tree
            # does not have, which really is broken.
            mapfile -t targets < <(jq -r --arg img "$IMAGE_NAME" '.deploy[$img][]? // empty' .github/containers.json)
            if [ "${#targets[@]}" -eq 0 ]; then
              if [ "$(jq 'length' <<<"$MANIFESTS")" -gt 0 ]; then
                echo "::notice::$IMAGE_NAME had deploy targets when $BUILT_COMMIT was built and main's .github/containers.json lists none, so this run has nothing to roll."
              else
                echo "$IMAGE_NAME has no deploy targets in .github/containers.json"
              fi
              return 0
            fi

            # Never roll backwards. Re-running an old workflow run is a real
            # recovery — a run cancelled before its jobs start builds nothing,
            # and because the matrix is per-commit changed-files no later
            # commit ever builds that image, so the only way to get it built is
            # to run that run again. But an old run checks out an old commit and
            # would happily stamp its older digest over a newer one.
            #
            # A newer build can already be recorded in two places, and both
            # count. What the manifests pin on main is the build that got there
            # and merged; what `cd/update-digests` changed is the build that got
            # there and is still waiting on its pull request. Reading only main
            # loses the second one outright, and that is the case this guard
            # exists for: a rerun is the thing an operator does once a digest
            # looks stale, which is to say after newer commits have landed, so
            # the newer digest it would overwrite is usually still open rather
            # than merged. Simulated against a local remote, reading only main
            # let a rerun of an older commit force-push its digest over an
            # unmerged newer one, and the open pull request then merged the
            # older digest.
            #
            # `org.opencontainers.image.revision` on each of those digests says
            # which commit its build came from. If this run's commit is an
            # ancestor of one of them, this run is the older and has nothing to
            # contribute for this image — which is not a failure, so say it
            # plainly and move on to the next one.
            #
            # Through a file rather than a process substitution: a substitution
            # hides the exit status of everything inside it, and a guard that
            # quietly reads fewer candidates than exist is a guard that fails
            # open.
            main_pins="$RUNNER_TEMP/$IMAGE_NAME-main-digests"
            queued_pins="$RUNNER_TEMP/$IMAGE_NAME-queued-digests"
            "$cd_digest" pins "$IMAGE_NAME" "${targets[@]}" >"$main_pins"
            "$cd_digest" queued "$QUEUED_REF" "$IMAGE_NAME" "${targets[@]}" >"$queued_pins"
            # The branch each image had before one branch carried them all.
            # Drop this read once no cd/update-<image>-digest branch exists.
            "$cd_digest" queued "refs/cd/queued/update-${IMAGE_NAME}-digest" "$IMAGE_NAME" "${targets[@]}" >>"$queued_pins"
            candidates="$RUNNER_TEMP/$IMAGE_NAME-candidate-digests"
            sort -u "$main_pins" "$queued_pins" >"$candidates"
            mapfile -t pinned_digests <"$candidates"

            pinned_commits=()
            for pinned_digest in "${pinned_digests[@]}"; do
              pinned_commit=$("$cd_digest" revision "$REGISTRY_REPOSITORY" "$pinned_digest")
              if [ -n "$pinned_commit" ]; then
                echo "$IMAGE_NAME is pinned or queued at $pinned_digest, built from $pinned_commit"
                pinned_commits+=("$pinned_commit")
              else
                echo "::warning::Cannot tell which commit $IMAGE_NAME@$pinned_digest was built from; this run cannot be checked against it."
              fi
            done
            # A carried-over digest whose own commit cannot be read has nothing
            # to compare, and anything unproven writes.
            verdict="write"
            if [ -n "$BUILT_COMMIT" ]; then
              verdict=$("$cd_digest" decide "$BUILT_COMMIT" "${pinned_commits[@]}")
            fi
            if [ "$verdict" = "skip" ]; then
              # Named loosely on purpose: the verdict covers every target at
              # once, and the reason lines `decide` printed just above name the
              # build and the commit that settled it.
              echo "::notice::$IMAGE_NAME is already pinned or queued at a build that contains $BUILT_COMMIT, so this run leaves every manifest alone."
              return 0
            fi

            # Every build has a new digest, because its labels and provenance
            # carry the commit and the time, so a build of unchanged inputs
            # would still roll every pod onto the files it already runs. The
            # fingerprint hashes the layers and the runtime config without the
            # labels. It skips only when every pin on main and on the delivery
            # branch matches: a revert built while a newer digest is queued has
            # to replace it even when it matches main, and a branch whose pull
            # request was closed unmerged outlives it, so matching that branch
            # alone says nothing about what runs. A fingerprint that cannot be
            # read leaves the verdict at write, so a registry failure delivers
            # as before.
            new_fingerprint=$("$cd_digest" fingerprint "$REGISTRY_REPOSITORY" "$DIGEST")
            same=false
            if [ -n "$new_fingerprint" ] && [ -s "$candidates" ]; then
              same=true
              while IFS= read -r pinned_digest; do
                [ "$("$cd_digest" fingerprint "$REGISTRY_REPOSITORY" "$pinned_digest")" = "$new_fingerprint" ] || same=false
              done <"$candidates"
            fi
            if [ "$same" = true ]; then
              echo "::notice::$IMAGE_NAME build $BUILT_COMMIT has the same filesystem and config as the pin; no pull request"
              return 0
            fi

            # A broken target fails this image and not the run: the others
            # still roll, and the step fails at the end. The checkout restores
            # from the index, so it keeps what an earlier image staged in a
            # manifest the two share. One file at a time, because a missing
            # target fails a checkout that names it beside the others.
            if ! "$cd_digest" rewrite "$IMAGE_NAME" "$DIGEST" "${targets[@]}"; then
              for target in "${targets[@]}"; do
                git checkout -q -- "$target" 2>/dev/null || true
              done
              failed_images+=("$IMAGE_NAME")
              return 0
            fi

            if git diff --quiet -- "${targets[@]}"; then
              echo "$IMAGE_NAME manifests already pin $DIGEST"
              return 0
            fi

            # Stage only the manifests this step edited. A blanket `git add .`
            # also sweeps up whatever earlier steps left behind, such as a
            # scanner's multi-gigabyte vulnerability DB under .cache/.
            git add -- "${targets[@]}"
            written+=("$IMAGE_NAME@$DIGEST")
            written_images+=("$IMAGE_NAME")
          }

          for record in "${records[@]}"; do
            deliver "$(jq -r .image "$record")" "$(jq -r .digest "$record")" \
              "$(jq -r .built_commit "$record")" "$(jq -c .manifests "$record")"
          done

          if [ "${#written[@]}" -eq 0 ]; then
            echo "No image built in this run has a digest to roll, so $BRANCH_NAME is left as it is."
            if [ "${#failed_images[@]}" -gt 0 ]; then
              echo "::error::Not delivered, because main's deploy map or manifests are broken for them: ${failed_images[*]}"
              exit 1
            fi
            exit 0
          fi

          # The branch was cut fresh from main, so a digest waiting on it for an
          # image this run did not write is lost to the force push unless it is
          # written again. `queued` reads only what the branch changed, since a
          # pin it left alone is main's from when it was cut, and each one goes
          # through the same guard as a build, so a pin main has since moved
          # past is left out. Only while the branch's pull request is open: one
          # closed unmerged was turned down, and carrying its digests into a
          # new one would undo that.
          waiting_pr=$(open_pr "$BRANCH_NAME")
          if [ -n "$waiting_pr" ]; then
            mapfile -t deployed < <(jq -r '.deploy | keys[]' .github/containers.json)
            handled=$(printf '%s\n' "${written_images[@]}" "${failed_images[@]}")
            for image in "${deployed[@]}"; do
              ! grep -qxF "$image" <<<"$handled" || continue
              mapfile -t targets < <(jq -r --arg img "$image" '.deploy[$img][]' .github/containers.json)
              queued=$("$cd_digest" queued "$QUEUED_REF" "$image" "${targets[@]}")
              [ -n "$queued" ] || continue
              if [ "$(grep -c . <<<"$queued")" -ne 1 ]; then
                echo "::warning::$BRANCH_NAME pins $image at more than one digest, so none is carried over: $(paste -sd' ' <<<"$queued")"
                continue
              fi
              echo "Carrying $image@$queued over from #$waiting_pr."
              deliver "$image" "$queued" "$("$cd_digest" revision "$REGISTRY_OWNER/$image" "$queued")" "[]"
            done
          fi

          # Commit as whoever is actually pushing, so the author matches the
          # token and the pull request is attributed to the App when there is
          # one.
          if [ -n "${CD_ACTOR:-}" ]; then
            git config user.name "${CD_ACTOR}[bot]"
            git config user.email "${CD_ACTOR}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          fi
          # The checkout above persists no credentials, so this URL's token is
          # the only one git sends. The branch is pushed by the identity that
          # opens the pull request, and a force push to an open one runs its
          # checks.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git commit -m "fix(cd): update image digests" -m "$(printf '%s\n' "${written[@]}")"

          if ! git push origin "$BRANCH_NAME" --force; then
            # The branch now always carries exactly one manifest-only commit on
            # top of current main, so a refused push means the ref itself is in
            # a state this token cannot overwrite. Recreating it is the only
            # recovery that does not need a human. Only on failure, so an open
            # pull request keeps its identity and its running checks in the
            # ordinary case.
            echo "Push refused; recreating $BRANCH_NAME so it carries only this commit."
            git push origin --delete "$BRANCH_NAME" || true
            git push origin "$BRANCH_NAME" || {
              echo "::error::Cannot push $BRANCH_NAME even as a fresh ref carrying one manifest-only commit. Delete the remote branch and any open pull request for it, then re-run this job."
              exit 1
            }
          fi

          # The title names every image, so the squash commit on main says
          # what rolled.
          names=$(printf '%s, ' "${written_images[@]}")
          title="fix(cd): update image digests (${names%, })"
          body=$(printf 'Automated image digest update for continuous delivery.\n\n' && printf -- '- %s\n' "${written[@]}")
          # Asked again, because the recovery above deletes the branch, and
          # GitHub closes its pull request with it.
          pr_number=$(open_pr "$BRANCH_NAME")
          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body" \
              --head "$BRANCH_NAME" \
              --base main
            pr_number=$(open_pr "$BRANCH_NAME")
          else
            # The single slot was already taken. The force push above replaced
            # what the branch carries, so retitle too, or the open pull request
            # goes on advertising digests it no longer holds.
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

          # `[skip ci]` goes on the merge commit only. The branch commit keeps
          # none, so the pull request's own checks still run and gate it, and
          # the merge, which differs only in digests they checked, runs none.
          gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --squash --body "[skip ci]" \
            || gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --merge --body "[skip ci]"

          # A pull request on an image's own branch, from before one branch
          # carried every image, rewrites the same line as this one, so
          # whichever merges second conflicts. The guard read that branch, so
          # an image written here is newer and its old pull request is closed.
          # Nothing here reaches a rerun of a run from before this job: a rerun
          # runs its own commit's workflow, whose guard never reads
          # cd/update-digests, so it can open a per-image pull request that
          # rolls main back past a digest waiting here and leaves this one
          # conflicting until the next force push. Republish with
          # workflow_dispatch and `images` instead of rerunning those runs.
          # Drop this with that read once no cd/update-<image>-digest branch
          # exists.
          for image in "${written_images[@]}"; do
            git rev-parse -q --verify "refs/cd/queued/update-${image}-digest" >/dev/null || continue
            superseded=$(open_pr "cd/update-${image}-digest")
            [ -n "$superseded" ] || continue
            gh pr close "$superseded" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Superseded by #${pr_number}, which carries every image digest." \
              || echo "::warning::Cannot close #$superseded, which $BRANCH_NAME supersedes for $image."
          done

          if [ "${#failed_images[@]}" -gt 0 ]; then
            echo "::error::Not delivered, because main's deploy map or manifests are broken for them: ${failed_images[*]}"
            exit 1
          fi
