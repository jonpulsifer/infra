name: containers
on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'images/**'
      - '.github/workflows/containers.yml'
      - '.github/scripts/detect-containers.sh'
      - '.github/containers.json'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'images/**'
      - '.github/workflows/containers.yml'
      - '.github/scripts/detect-containers.sh'
      - '.github/containers.json'

# Cancel superseded runs on the same ref instead of letting them pile up.
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          separator: "\n"
      - id: set-matrix
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: bash .github/scripts/detect-containers.sh

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate Slingshot build to Google Cloud
        if: matrix.image == 'slingshot'
        id: gcp_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GitHub Container Registry
        # Only needed for the push (on main); PRs build to validate without pushing,
        # so they don't require — or have access to, from forks — the registry creds.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker Meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: ${{ matrix.image == 'slingshot' && format('gcp_credentials={0}', steps.gcp_auth.outputs.credentials_file_path) || '' }}
          sbom: true
          provenance: true

  # Spindrift ships continuously. Its HelmRelease pins a digest, so an image
  # that nothing rewrites into git never reaches the cluster — Renovate does
  # rewrite it, but on its own cadence. This opens the same bump PR the moment
  # the image exists and leaves Renovate as the backstop.
  #
  # The PR is authored by GITHUB_TOKEN, so no workflow runs on it — GitHub does
  # not recurse. Nothing on `main` requires one for a clusters-only change, and
  # `kustomize.yml` renders `clusters/offsite/apps/**` on push, so the render is
  # still exercised, one commit later than a human PR would exercise it.
  deploy-spindrift:
    needs: [detect, build]
    if: >-
      github.event_name == 'push' &&
      contains(needs.detect.outputs.matrix, '"image":"spindrift"')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/spindrift
      RELEASE: clusters/offsite/apps/spindrift/helm-release.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Branch from the tip rather than this run's commit: `main` may have
          # moved while the image built, and the PR should carry the digest line
          # and nothing else.
          ref: main
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the digest this build pushed
        id: digest
        run: |
          set -euo pipefail
          # The build tagged the image with the full commit sha (metadata-action
          # format=long) and every tag on that push shares one manifest, so this
          # resolves to the same digest Renovate would pin for :latest.
          digest=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" --format '{{ .Manifest.Digest }}')
          case "$digest" in
            sha256:*) ;;
            *)
              echo "::error::unexpected digest for ${IMAGE}:${GITHUB_SHA}: ${digest}"
              exit 1
              ;;
          esac
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
      - name: Pin the digest in the HelmRelease
        id: bump
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          before=$(grep -E "^[[:space:]]*image: ${IMAGE}:" "$RELEASE") || {
            echo "::error::no image line for ${IMAGE} in ${RELEASE}"
            exit 1
          }
          sed -i -E "s|^([[:space:]]*image: )${IMAGE}:.*|\1${IMAGE}:latest@${DIGEST}|" "$RELEASE"
          if git diff --quiet -- "$RELEASE"; then
            echo "::notice::${RELEASE} already pins ${DIGEST}"
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          old=unpinned
          [[ "$before" =~ @sha256:([0-9a-f]{7}) ]] && old="${BASH_REMATCH[1]}"
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "old=${old}" >>"$GITHUB_OUTPUT"
      - name: Open the deploy PR and queue it for merge
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          OLD: ${{ steps.bump.outputs.old }}
        run: |
          set -euo pipefail
          new=${DIGEST#sha256:}
          new=${new:0:7}
          branch="deploy/spindrift-${new}"
          # Renovate's own subject line for this file, so the two paths read the
          # same in the log.
          title="chore(container): update image ${IMAGE} ( ${OLD} → ${new} )"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          gh pr view "$branch" --json number >/dev/null 2>&1 || gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "Built from ${GITHUB_SHA} by the \`containers\` workflow. Flux rolls this out once it merges and the \`infra\` GitRepository next syncs."
          # Atlantis posts the three required contexts on any PR, so auto-merge
          # normally waits a moment for them. If they already landed the PR is
          # mergeable and enabling auto-merge is rejected — merge it directly.
          gh pr merge --auto --squash --delete-branch "$branch" ||
            gh pr merge --squash --delete-branch "$branch"
