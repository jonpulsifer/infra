name: containers
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on a pull request instead of letting them pile up.
# **Never on `main`**: this workflow builds from a changed-files matrix, so a
# cancelled push run's images are never built by any later one — the next
# commit's matrix contains only what *it* changed. A push landing seconds after
# another would otherwise silently drop the earlier commit's images, and the
# only symptom is a stale digest nobody bumped. Queue them instead.
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          separator: "\n"
      - id: set-matrix
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: bash .github/scripts/detect-containers.sh

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    # The warm pool. dockerd runs inside every skiff, buildx brings its own
    # buildkitd container, and `type=gha` cache traffic lands on the bosun
    # host's local cache service via ACTIONS_RESULTS_URL — layer caches stop
    # crossing the internet.
    runs-on: skiff-ubuntu
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Which images need what is declared in each app's build.json, not here.
      # This job knows how to run a build; it does not know any app's name.
      - name: Authenticate build to Google Cloud
        if: matrix.gcp-credentials != ''
        id: gcp_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up QEMU
        if: contains(matrix.platforms, ',') || (matrix.platforms != '' && !contains(matrix.platforms, 'linux/amd64'))
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GitHub Container Registry
        # Only needed for the push (on main); PRs build to validate without pushing,
        # so they don't require — or have access to, from forks — the registry creds.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker Meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long
      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # PRs validate images but never publish them. Spell the publishing
          # authority positively so adding another event cannot make it push.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep PR cache records away from main publishing builds and keep
          # unrelated images out of each other's default `buildkit` scope.
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ github.ref_name }}
            type=gha,scope=${{ matrix.image }}-${{ github.event_name }}
            type=gha,scope=${{ matrix.image }}-main
            type=gha,scope=${{ matrix.image }}-push
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ github.ref_name }}
          no-cache-filters: ${{ matrix.no-cache-filters }}
          secret-files: ${{ matrix.gcp-credentials != '' && format('gcp_credentials={0}', steps.gcp_auth.outputs.credentials_file_path) || '' }}
          sbom: true
          provenance: true
      - name: Scan ${{ matrix.image }} image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          trivy-config: ${{ github.workspace }}/.github/trivy.yaml
          hide-progress: false
          ignore-unfixed: true
          exit-code: 0
          severity: CRITICAL,HIGH
      - name: Update manifest digest for selective continuous delivery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          MANIFESTS: ${{ toJson(matrix.manifests) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(jq -r '.[]' <<<"$MANIFESTS")
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "$IMAGE_NAME has no deploy targets in .github/containers.json"
            exit 0
          fi

          for manifest in "${targets[@]}"; do
            # A declared target that is missing, or that pins no digest, means
            # the deploy map is wrong. Fail loudly: a silent no-op here is
            # indistinguishable from a successful deploy.
            if [ ! -f "$manifest" ]; then
              echo "::error::$manifest is a deploy target for $IMAGE_NAME but does not exist"
              exit 1
            fi
            # Anchored on this image's own reference, so a manifest may pin
            # other images beside it. That is not hypothetical: the in-cluster
            # build route pins the BuildKit engine in the same document
            # Spindrift's own image is pinned in, and the blanket rewrite this
            # replaces refused the whole file rather than stamp Spindrift's
            # digest onto BuildKit — correctly, but the effect was that every
            # push stopped rolling out and said so only in a workflow log.
            #
            # The name must be followed by `:` or `@` so that a repository whose
            # path merely starts with this one — `spindrift` and
            # `spindrift-demo` are both published here — is not rewritten by it.
            #
            # The registry is anchored to ghcr.io because that is the only place
            # this job pushes (see the `images:` input above). A digest is
            # content-addressed per registry, so stamping this one onto a ref
            # that resolves anywhere else yields a pin that cannot be pulled —
            # and the failure lands on the cluster, long after CI goes green.
            ref="ghcr\.io/[^[:space:]\"']*/${IMAGE_NAME}(:[^@[:space:]]+)?"

            # Refuse rather than rewrite when the manifest pins this image from
            # somewhere other than ghcr.io, so the mismatch is a red build
            # instead of an ImagePullBackOff nobody is watching for.
            if grep -qE "[^[:space:]\"']*/${IMAGE_NAME}(:[^@[:space:]]+)?@sha256:[0-9a-f]{64}" "$manifest" \
              && ! grep -qE "${ref}@sha256:[0-9a-f]{64}" "$manifest"; then
              echo "::error::$manifest pins $IMAGE_NAME from a registry this job does not publish to; only ghcr.io digests are valid here"
              exit 1
            fi
            if grep -qE "${ref}@sha256:[0-9a-f]{64}" "$manifest"; then
              echo "Updating digest for $IMAGE_NAME in $manifest..."
              # DIGEST already carries the sha256: prefix, so the capture group
              # must not be replayed into the replacement.
              sed -i -E "s|(${ref})@sha256:[0-9a-f]{64}|\1@${DIGEST}|g" "$manifest"
              continue
            fi

            # A chart that splits `repository:` from `tag:` puts the digest on a
            # line that never names the image, so there is nothing to anchor on
            # and the blanket rewrite is the only thing that reaches it. It is
            # safe exactly while the file pins one digest, which is what the
            # count below is for — the same guard this step has always had,
            # now scoped to the manifests that still need it.
            pins=$(grep -cE '@sha256:[0-9a-f]{64}' "$manifest" || true)
            if [ "$pins" -eq 0 ]; then
              echo "::error::$manifest pins no image digest, so $IMAGE_NAME can never roll from it"
              exit 1
            fi
            if [ "$pins" -gt 1 ]; then
              echo "::error::$manifest pins $pins digests and names $IMAGE_NAME in none of them, so there is no way to tell which one to roll"
              exit 1
            fi
            echo "Updating digest for $IMAGE_NAME in $manifest (unanchored)..."
            sed -i -E "s|@sha256:[0-9a-f]{64}|@${DIGEST}|g" "$manifest"
          done

          if git diff --quiet -- "${targets[@]}"; then
            echo "$IMAGE_NAME manifests already pin $DIGEST"
            exit 0
          fi

          BRANCH_NAME="cd/update-${IMAGE_NAME}-digest"
          git checkout -b "$BRANCH_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the manifests this step edited. A blanket `git add .`
          # also sweeps up whatever the build and scan steps left behind — the
          # Trivy action's multi-gigabyte vulnerability DB under .cache/ is
          # what wedged this step shut.
          git add -- "${targets[@]}"
          git commit -m "fix(cd): update ${IMAGE_NAME} image digest to ${DIGEST}"

          if ! git push origin "$BRANCH_NAME" --force; then
            # A prior run that failed after pushing leaves this branch cut from
            # an older main, so the next push introduces every commit in
            # between — and GITHUB_TOKEN may never write one that touched
            # .github/workflows/, whatever this job's `permissions:` say.
            # Recreating the ref reduces the push to the single manifest-only
            # commit above. Only on failure, so an open PR keeps its identity
            # and its running checks in the ordinary case.
            echo "Push refused; recreating $BRANCH_NAME so it carries only this commit."
            git push origin --delete "$BRANCH_NAME" || true
            git push origin "$BRANCH_NAME" || {
              echo "::error::Cannot push $BRANCH_NAME even as a fresh ref carrying one manifest-only commit. Delete the remote branch and any open pull request for it, then re-run this job."
              exit 1
            }
          fi

          # An **open** one, not any one. `gh pr view <branch>` answers with the
          # most recent pull request for that head whatever its state, so once
          # the first digest bump merged this went on finding it, skipped the
          # create, and no-opped the auto-merge — leaving the branch force-pushed
          # with a correct digest and no pull request to carry it. Continuous
          # delivery stopped silently, with every step green.
          if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" \
                       --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "fix(cd): update ${IMAGE_NAME} image digest to ${DIGEST}" \
              --body "Automated image digest update for continuous delivery of ${IMAGE_NAME}." \
              --head "$BRANCH_NAME" \
              --base main
          fi

          gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --squash || gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --merge
