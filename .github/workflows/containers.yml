name: containers
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # A push builds only what it changed, so a build that never finishes is never
  # retried. The schedule rebuilds each image pinned behind main.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      images:
        description: >-
          Images to build, space separated. Empty means whatever is stale.
        required: false
        default: ""

# A cancelled run's images are never rebuilt by a later push. queue: max keeps
# pending runs, which cancel-in-progress does not, and the two cannot combine.
concurrency:
  group: containers-${{ github.ref }}
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The stale-image pass needs full history. Quoted, because GitHub
          # expressions treat 0 as false and `cond && 0 || 1` is always 1.
          fetch-depth: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '0' || '1' }}

      # One of these two runs: a push or pull request builds what it changed,
      # and a schedule or dispatch builds what is stale or what the operator named.
      - id: changed
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          separator: "\n"

      - id: stale
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REQUESTED: ${{ github.event.inputs.images }}
        run: |
          set -euo pipefail

          # A digest that has been built and is waiting on its delivery pull
          # request is a build that already got here, so the staleness read has
          # to see it or the schedule would order a rebuild on top of it every
          # night until that pull request merged. Same refspec and same
          # namespace the delivery step uses, so both read the queue the same
          # way. A wildcard matching nothing is a success, so a repository with
          # no digest branch open stays quiet while a network failure is loud.
          git fetch --no-tags origin "+refs/heads/cd/*:refs/cd/queued/*"

          # An operator who named images gets those images. Naming them is the
          # override for the case this cannot detect — an image whose
          # provenance is unreadable, which `stale` deliberately refuses to
          # guess about.
          # `:-` because a `schedule` run declares this variable from an
          # expression with nothing behind it, and the step runs under `set
          # -u`. The same reason the delivery step below reads `${CD_ACTOR:-}`.
          requested="${REQUESTED:-}"
          if [ -n "${requested// /}" ]; then
            echo "Building images named by hand: $requested"
            echo "images=$requested" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          images=$(bash .github/scripts/cd-stale-images.sh stale | tr '\n' ' ')
          if [ -z "${images// /}" ]; then
            echo "Every deployed image is pinned at a build of the newest commit touching it."
          else
            echo "::notice::Rebuilding images whose pin is behind main: $images"
          fi
          echo "images=$images" >>"$GITHUB_OUTPUT"

      - id: set-matrix
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          BUILD_IMAGES: ${{ steps.stale.outputs.images }}
        run: bash .github/scripts/detect-containers.sh

  # The workflow has no `paths:` filter, so these suites gate every pull request,
  # including one that only edits the delivery step they read from this file.
  cd-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # cd-digest-step_test.sh reads this workflow with yq, so it is not
          # left to the runner image.
          install_args: yq
      - run: bash .github/scripts/cd-digest-update_test.sh
      - run: bash .github/scripts/cd-digest-step_test.sh
      - run: bash .github/scripts/cd-stale-images_test.sh

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    # Hosted: an image build outgrows the lab runners' disk, and hosted runners
    # are free for a public repository.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Per-image needs come from each app's build.json through the matrix.
      - name: Authenticate build to Google Cloud
        if: matrix.gcp-credentials != ''
        id: gcp_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up QEMU
        if: contains(matrix.platforms, ',') || (matrix.platforms != '' && !contains(matrix.platforms, 'linux/amd64'))
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        # Pull requests build without pushing, and a fork has no registry creds.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker Meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long
      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # The publishing events are listed, so a new trigger cannot push by
          # default. Only main publishes.
          push: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image and ref, so pull request caches never reach main's
          # builds and images never share a cache.
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ github.ref_name }}
            type=gha,scope=${{ matrix.image }}-${{ github.event_name }}
            type=gha,scope=${{ matrix.image }}-main
            type=gha,scope=${{ matrix.image }}-push
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ github.ref_name }}
          no-cache-filters: ${{ matrix.no-cache-filters }}
          secret-files: ${{ matrix.gcp-credentials != '' && format('gcp_credentials={0}', steps.gcp_auth.outputs.credentials_file_path) || '' }}
          sbom: true
          provenance: true
      - name: Scan ${{ matrix.image }} image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          trivy-config: ${{ github.workspace }}/.github/trivy.yaml
          hide-progress: false
          ignore-unfixed: true
          exit-code: 0
          severity: CRITICAL,HIGH
      # A pull request opened with GITHUB_TOKEN gets no checks, so --auto never
      # merges it. Gated on a variable because step conditions cannot read secrets.
      - name: Mint a continuous-delivery App token
        id: cd-app-token
        if: >-
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
          && vars.CD_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
      - name: Update manifest digest for selective continuous delivery
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          MANIFESTS: ${{ toJson(matrix.manifests) }}
          GH_TOKEN: ${{ steps.cd-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          CD_ACTOR: ${{ steps.cd-app-token.outputs.app-slug }}
          BUILT_COMMIT: ${{ github.sha }}
          REGISTRY_REPOSITORY: ${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail

          # Copied out of the tree before the checkout below replaces the
          # working tree with main's content. A step that swaps the program it
          # is running halfway through is a step nobody can reason about.
          # Deliberately the built commit's copy and not main's: this step and
          # that script are one program split across two files, and their
          # argument contract moves together, so pairing an old step with a new
          # script is a broken call nobody would see until a rerun made it.
          cd_digest="$RUNNER_TEMP/cd-digest-update.sh"
          cp .github/scripts/cd-digest-update.sh "$cd_digest"

          # **Everything below happens on current main, not on the commit this
          # run built.** A branch cut from the build's own checkout is a diff
          # against a main that has since moved on: the moment anything else
          # touches the same manifest — and a deployment manifest is touched
          # for a dozen reasons that have nothing to do with its digest — the
          # digest commit conflicts. `--auto` never fires on a conflicting pull
          # request, so the digest sits there forever while every step of this
          # job reports green; four `cd/*` pull requests were stuck
          # CONFLICTING at once when this was written. Re-deriving the rewrite
          # from main's copy of the file makes the pull request a one-line
          # change against the branch it targets, which cannot conflict.
          #
          # The full history comes with it because the guard below has an
          # ancestry question to answer, and `actions/checkout` leaves a
          # depth-1 clone that can only answer it wrong.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin main
          else
            git fetch --no-tags origin main
          fi
          # Pinned now, because the second fetch below moves FETCH_HEAD.
          main_head=$(git rev-parse FETCH_HEAD)

          # One branch per image, not per commit. The branch is a queue with a
          # single slot: the newest build for an image force-pushes over the
          # one waiting, and there is never more than one open pull request
          # asking to roll it. A per-commit branch would instead leave every
          # superseded build open as its own mergeable pull request, each one
          # carrying an older digest — the regression the guard below exists to
          # prevent, reintroduced as a matter of routine.
          BRANCH_NAME="cd/update-${IMAGE_NAME}-digest"
          QUEUED_REF="refs/cd/queued/update-${IMAGE_NAME}-digest"

          # What is already sitting in that slot is an input to the guard
          # below, so it has to be fetched, and a failure to fetch it has to be
          # loud. A wildcard refspec gives both: matching no branch at all is a
          # success, so "nothing queued" stays silent, while a network or auth
          # failure exits non-zero and stops the step instead of reading as an
          # empty queue. Naming the branch exactly would fail on the first push
          # for every new image.
          git fetch --no-tags origin "+refs/heads/cd/*:refs/cd/queued/*"

          git checkout -B "$BRANCH_NAME" "$main_head"

          # Deploy targets come from main's map for the same reason the
          # manifests do. A target renamed or dropped on main since this commit
          # was built is not a broken deploy map; it is a deploy map this run
          # is behind, and reading the built commit's list here names a file
          # main no longer has and fails the job — permanently, since every
          # rerun reads the same stale list. `rewrite` keeps its `::error::`
          # for a target main's own map names and main's own tree does not
          # have, which really is broken.
          mapfile -t targets < <(jq -r --arg img "$IMAGE_NAME" '.deploy[$img][]? // empty' .github/containers.json)
          if [ "${#targets[@]}" -eq 0 ]; then
            if [ "$(jq 'length' <<<"$MANIFESTS")" -gt 0 ]; then
              echo "::notice::$IMAGE_NAME had deploy targets when $BUILT_COMMIT was built and main's .github/containers.json lists none, so this run has nothing to roll."
            else
              echo "$IMAGE_NAME has no deploy targets in .github/containers.json"
            fi
            exit 0
          fi

          # Never roll backwards. Re-running an old workflow run is a real
          # recovery — a run cancelled before its jobs start builds nothing,
          # and because the matrix is per-commit changed-files no later commit
          # ever builds that image, so the only way to get it built is to run
          # that run again. But an old run checks out an old commit and would
          # happily stamp its older digest over a newer one.
          #
          # A newer build can already be recorded in two places, and both
          # count. What the manifests pin on main is the build that got there
          # and merged; what `cd/update-<image>-digest` carries is the build
          # that got there and is still waiting on its pull request. Reading
          # only main loses the second one outright, and that is the case this
          # guard exists for: a rerun is the thing an operator does once a
          # digest looks stale, which is to say after newer commits have
          # landed, so the newer digest it would overwrite is usually still
          # open rather than merged. Simulated against a local remote, reading
          # only main let a rerun of an older commit force-push its digest over
          # an unmerged newer one, and the open pull request then merged the
          # older digest.
          #
          # `org.opencontainers.image.revision` on each of those digests says
          # which commit its build came from. If this run's commit is an
          # ancestor of one of them, this run is the older and has nothing to
          # contribute — which is not a failure, so say it plainly and leave.
          #
          # Through a file rather than a process substitution: a substitution
          # hides the exit status of everything inside it, and a guard that
          # quietly reads fewer candidates than exist is a guard that fails
          # open.
          candidates="$RUNNER_TEMP/$IMAGE_NAME-candidate-digests"
          {
            "$cd_digest" pins "$IMAGE_NAME" "${targets[@]}"
            "$cd_digest" pins-at "$QUEUED_REF" "$IMAGE_NAME" "${targets[@]}"
          } | sort -u >"$candidates"
          mapfile -t pinned_digests <"$candidates"

          pinned_commits=()
          for pinned_digest in "${pinned_digests[@]}"; do
            pinned_commit=$("$cd_digest" revision "$REGISTRY_REPOSITORY" "$pinned_digest")
            if [ -n "$pinned_commit" ]; then
              echo "$IMAGE_NAME is pinned or queued at $pinned_digest, built from $pinned_commit"
              pinned_commits+=("$pinned_commit")
            else
              echo "::warning::Cannot tell which commit $IMAGE_NAME@$pinned_digest was built from; this run cannot be checked against it."
            fi
          done
          if [ "$("$cd_digest" decide "$BUILT_COMMIT" "${pinned_commits[@]}")" = "skip" ]; then
            # Named loosely on purpose: the verdict covers every target at
            # once, and the reason lines `decide` printed just above name the
            # build and the commit that settled it.
            echo "::notice::$IMAGE_NAME is already pinned or queued at a build that contains $BUILT_COMMIT, so this run leaves every manifest alone."
            exit 0
          fi

          "$cd_digest" rewrite "$IMAGE_NAME" "$DIGEST" "${targets[@]}"

          if git diff --quiet -- "${targets[@]}"; then
            echo "$IMAGE_NAME manifests already pin $DIGEST"
            exit 0
          fi

          # Commit as whoever is actually pushing, so the author matches the
          # token and the pull request is attributed to the App when there is
          # one.
          if [ -n "${CD_ACTOR:-}" ]; then
            git config user.name "${CD_ACTOR}[bot]"
            git config user.email "${CD_ACTOR}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          fi
          # `actions/checkout` left GITHUB_TOKEN in the remote's auth header, so
          # a push would use it whatever GH_TOKEN says. Carry the token that
          # opens the pull request through to the push as well, or the branch is
          # pushed by one identity and the pull request opened by another.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Stage only the manifests this step edited. A blanket `git add .`
          # also sweeps up whatever the build and scan steps left behind — the
          # Trivy action's multi-gigabyte vulnerability DB under .cache/ is
          # what wedged this step shut.
          git add -- "${targets[@]}"
          git commit -m "fix(cd): update ${IMAGE_NAME} image digest to ${DIGEST}"

          if ! git push origin "$BRANCH_NAME" --force; then
            # The branch now always carries exactly one manifest-only commit on
            # top of current main, so a refused push means the ref itself is in
            # a state this token cannot overwrite. Recreating it is the only
            # recovery that does not need a human. Only on failure, so an open
            # pull request keeps its identity and its running checks in the
            # ordinary case.
            echo "Push refused; recreating $BRANCH_NAME so it carries only this commit."
            git push origin --delete "$BRANCH_NAME" || true
            git push origin "$BRANCH_NAME" || {
              echo "::error::Cannot push $BRANCH_NAME even as a fresh ref carrying one manifest-only commit. Delete the remote branch and any open pull request for it, then re-run this job."
              exit 1
            }
          fi

          # An **open** one, not any one. `gh pr view <branch>` answers with the
          # most recent pull request for that head whatever its state, so once
          # the first digest bump merged this went on finding it, skipped the
          # create, and no-opped the auto-merge — leaving the branch force-pushed
          # with a correct digest and no pull request to carry it. Continuous
          # delivery stopped silently, with every step green.
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" \
                        --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "fix(cd): update ${IMAGE_NAME} image digest to ${DIGEST}" \
              --body "Automated image digest update for continuous delivery of ${IMAGE_NAME}." \
              --head "$BRANCH_NAME" \
              --base main
          else
            # The single slot was already taken. The force push above replaced
            # what the branch carries, so retitle too, or the open pull request
            # goes on advertising a digest it no longer holds.
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "fix(cd): update ${IMAGE_NAME} image digest to ${DIGEST}"
          fi

          gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --squash || gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --merge
