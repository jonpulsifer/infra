name: containers
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref instead of letting them pile up.
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          separator: "\n"
      - id: set-matrix
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: bash .github/scripts/detect-containers.sh

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate Slingshot build to Google Cloud
        if: matrix.image == 'slingshot'
        id: gcp_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up QEMU
        if: contains(matrix.platforms, ',') || (matrix.platforms != '' && !contains(matrix.platforms, 'linux/amd64'))
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GitHub Container Registry
        # Only needed for the push (on main); PRs build to validate without pushing,
        # so they don't require — or have access to, from forks — the registry creds.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker Meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long
      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # PRs validate images but never publish them. Spell the publishing
          # authority positively so adding another event cannot make it push.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep PR cache records away from main publishing builds and keep
          # unrelated images out of each other's default `buildkit` scope.
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ github.ref_name }}
            type=gha,scope=${{ matrix.image }}-${{ github.event_name }}
            type=gha,scope=${{ matrix.image }}-main
            type=gha,scope=${{ matrix.image }}-push
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ github.ref_name }}
          # The Spindrift runner is cheap and is the layer that packages its
          # two entrypoints. Always rebuild it; dependency/build stages remain
          # cached.
          no-cache-filters: ${{ matrix.image == 'spindrift' && 'runner' || '' }}
          secret-files: ${{ matrix.image == 'slingshot' && format('gcp_credentials={0}', steps.gcp_auth.outputs.credentials_file_path) || '' }}
          sbom: true
          provenance: true
      - name: Scan ${{ matrix.image }} image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          trivy-config: ${{ github.workspace }}/.github/trivy.yaml
          hide-progress: false
          ignore-unfixed: true
          exit-code: 0
          severity: CRITICAL,HIGH
      - name: Update manifest digest for selective continuous delivery
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          MANIFESTS: ${{ toJson(matrix.manifests) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(jq -r '.[]' <<<"$MANIFESTS")
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "$IMAGE_NAME has no deploy targets in .github/containers.json"
            exit 0
          fi

          for manifest in "${targets[@]}"; do
            # A declared target that is missing, or that pins no digest, means
            # the deploy map is wrong. Fail loudly: a silent no-op here is
            # indistinguishable from a successful deploy.
            if [ ! -f "$manifest" ]; then
              echo "::error::$manifest is a deploy target for $IMAGE_NAME but does not exist"
              exit 1
            fi
            pins=$(grep -cE '@sha256:[0-9a-f]{64}' "$manifest" || true)
            if [ "$pins" -eq 0 ]; then
              echo "::error::$manifest pins no image digest, so $IMAGE_NAME can never roll from it"
              exit 1
            fi
            # The rewrite is a blanket one; more than one pin means it would
            # stamp this image's digest onto some other image.
            if [ "$pins" -gt 1 ]; then
              echo "::error::$manifest pins $pins digests; rewriting would clobber images other than $IMAGE_NAME"
              exit 1
            fi
            echo "Updating digest for $IMAGE_NAME in $manifest..."
            # DIGEST already carries the sha256: prefix, so the capture group
            # must not be replayed into the replacement.
            sed -i -E "s|@sha256:[0-9a-f]{64}|@${DIGEST}|g" "$manifest"
          done

          if git diff --quiet -- "${targets[@]}"; then
            echo "$IMAGE_NAME manifests already pin $DIGEST"
            exit 0
          fi

          BRANCH_NAME="cd/update-${IMAGE_NAME}-digest"
          git checkout -b "$BRANCH_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the manifests this step edited. A blanket `git add .`
          # also sweeps up whatever the build and scan steps left behind — the
          # Trivy action's multi-gigabyte vulnerability DB under .cache/ is
          # what wedged this step shut.
          git add -- "${targets[@]}"
          git commit -m "fix(cd): update ${IMAGE_NAME} image digest to ${DIGEST}"

          git push origin "$BRANCH_NAME" --force

          if ! gh pr view "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "fix(cd): update ${IMAGE_NAME} image digest to ${DIGEST}" \
              --body "Automated image digest update for continuous delivery of ${IMAGE_NAME}." \
              --head "$BRANCH_NAME" \
              --base main
          fi

          gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --squash || gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --merge
