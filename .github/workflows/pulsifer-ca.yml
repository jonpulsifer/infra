name: pulsifer.ca

on:
  push:
    branches:
      - main
    paths:
      - 'apps/pulsifer.ca/**'
      - '.github/workflows/pulsifer-ca.yml'
  pull_request:
    paths:
      - 'apps/pulsifer.ca/**'
      - '.github/workflows/pulsifer-ca.yml'

concurrency:
  group: pulsifer-ca-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      # hugo, tailwind, pandoc and typst are pinned in the app's mise.toml; the CV fonts come from the flake's nixpkgs.
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: apps/pulsifer.ca

      - name: Build
        working-directory: apps/pulsifer.ca
        run: mise run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/pulsifer.ca/public
