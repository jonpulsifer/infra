name: spindrift-charts

# Pushes packages/charts/spindrift and spindrift-app to GHCR at their Chart.yaml
# versions; apps/spindrift/test/conformance/ checks that each consumer's OCIRepository
# pins that tag. A new GHCR package starts private; make it public once, or pulls get a 401.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/charts/spindrift/**'
      - 'packages/charts/spindrift-app/**'
      - '.github/workflows/spindrift-charts.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/charts/spindrift/**'
      - 'packages/charts/spindrift-app/**'
      - '.github/workflows/spindrift-charts.yml'

# In-progress push runs are never cancelled: a cancelled push leaves its chart
# version unpublished, and the consumer that pins it fails to pull.
concurrency:
  group: spindrift-charts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install helm
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: helm
      - name: Lint charts
        run: |
          set -euo pipefail
          helm lint packages/charts/spindrift
          helm lint packages/charts/spindrift-app
      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package packages/charts/spindrift -d dist
          helm package packages/charts/spindrift-app -d dist
      - name: Login to GitHub Container Registry
        # Pull requests lint and package without pushing.
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push charts
        # Named one by one: a `dist/spindrift-*.tgz` glob also matches spindrift-app.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for chart in spindrift spindrift-app; do
            version="$(grep '^version:' "packages/charts/${chart}/Chart.yaml" | awk '{print $2}')"
            helm push "dist/${chart}-${version}.tgz" oci://ghcr.io/jonpulsifer/charts
          done
