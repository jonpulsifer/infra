name: spindrift-charts

# Publishes both Spindrift charts as independently pinned, extractable OCI
# artifacts instead of paths this repository's own GitRepository source has to
# be checked out to reach. Each is pushed under the version its own Chart.yaml
# carries, and an installation pins that version by tag through an
# OCIRepository consumer — the installer's beside its release, the App chart's
# on every Kubernetes Target, because each Target needs its own copy of that
# source object in its own delivery namespace.
#
# **Bumping a chart's version without bumping a consumer's tag ships
# nothing**, and bumping the consumer's tag before this workflow has pushed
# that version leaves the source object failing to pull.
#
# **A chart added here needs one manual step the first time.** GHCR creates the
# package private on its first push and neither consumer carries a secretRef,
# so the new package has to be flipped to public on its settings page once —
# GITHUB_TOKEN cannot do it. Until then the OCIRepository sits at
# OCIArtifactPullFailed with a 401.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/charts/spindrift/**'
      - 'packages/charts/spindrift-app/**'
      - '.github/workflows/spindrift-charts.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/charts/spindrift/**'
      - 'packages/charts/spindrift-app/**'
      - '.github/workflows/spindrift-charts.yml'

# Cancel superseded runs on a pull request instead of letting them pile up.
# **Never on `main`**: a cancelled push run leaves the chart version in its
# Chart.yaml unpublished, and the consumer that pins that version by tag then
# fails to pull with nothing here saying why. Queue them instead.
concurrency:
  group: spindrift-charts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install helm
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: helm
      - name: Lint charts
        run: |
          set -euo pipefail
          helm lint packages/charts/spindrift
          helm lint packages/charts/spindrift-app
      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package packages/charts/spindrift -d dist
          helm package packages/charts/spindrift-app -d dist
      - name: Login to GitHub Container Registry
        # Only needed for the push (on main); PRs lint and package to validate
        # without pushing, matching the pattern containers.yml uses for images —
        # a fork's PR has no access to this credential either way.
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push charts
        # Each named explicitly rather than through a `dist/spindrift-*.tgz`
        # glob, which `spindrift-app-*.tgz` also satisfies — a glob would push
        # the App chart under the installer's loop and get its version from the
        # wrong Chart.yaml.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for chart in spindrift spindrift-app; do
            version="$(grep '^version:' "packages/charts/${chart}/Chart.yaml" | awk '{print $2}')"
            helm push "dist/${chart}-${version}.tgz" oci://ghcr.io/jonpulsifer/charts
          done
