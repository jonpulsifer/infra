name: kthx-charts

# Pushes packages/charts/kthx-engine and kthx-app to GHCR at their Chart.yaml
# versions; apps/kthx-engine/test/conformance/ checks that each consumer's OCIRepository
# pins that tag. A new GHCR package starts private; make it public once, or pulls get a 401.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/charts/kthx-engine/**'
      - 'packages/charts/kthx-app/**'
      - '.github/workflows/spindrift-charts.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/charts/kthx-engine/**'
      - 'packages/charts/kthx-app/**'
      - '.github/workflows/spindrift-charts.yml'

# In-progress push runs are never cancelled: a cancelled push leaves its chart
# version unpublished, and the consumer that pins it fails to pull.
concurrency:
  group: spindrift-charts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install helm
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: helm
      - name: Lint charts
        run: |
          set -euo pipefail
          helm lint packages/charts/kthx-engine
          helm lint packages/charts/kthx-app
      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package packages/charts/kthx-engine -d dist
          helm package packages/charts/kthx-app -d dist
      - name: Login to GitHub Container Registry
        # Pull requests lint and package without pushing.
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push charts
        # Named one by one: a `dist/kthx-*.tgz` glob also matches both charts.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for chart in kthx-engine kthx-app; do
            version="$(grep '^version:' "packages/charts/${chart}/Chart.yaml" | awk '{print $2}')"
            helm push "dist/${chart}-${version}.tgz" oci://ghcr.io/jonpulsifer/charts
          done
