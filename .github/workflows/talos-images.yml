name: talos-images
# Builds folly's signed Talos boot assets with the siderolabs imager (the
# installer, the ISO and the metal disk image fleet-boot writes), and its
# signed netboot iPXE, HookOS and fleet-boot with Nix, using the Secure Boot
# keys in 1Password, then publishes them. A pull request only checks the inputs: the
# build needs the keys.
on:
  push:
    branches: [main]
    paths: &paths
      - clusters/folly/talos/**
      - clusters/folly/config/anchor-topology.json
      - nix/images/ipxe-folly.nix
      - nix/images/hookos-folly.nix
      - nix/images/fleet-boot.nix
      # The fleet-boot binary the fleet-boot UKI carries, and what it imports.
      - apps/fleetd/package.nix
      - apps/fleetd/go.mod
      - apps/fleetd/go.sum
      - apps/fleetd/cmd/fleet-boot/**
      - apps/fleetd/client/**
      - apps/fleetd/protocol/**
      - apps/fleetd/lldp/**
      - apps/fleetd/fleetboot/**
      - apps/fleetd/classes/**
      # HookOS's fleet_attest_url reads this.
      - terraform/network/tailscale/fleet.tf.json
      - .github/scripts/talos-image-inputs.sh
      - .github/scripts/talos-image-inputs_test.sh
      - .github/scripts/talos-images-build.sh
      - .github/scripts/talos-installer-verify.sh
      - .github/scripts/talos-installer-verify_test.sh
      - .github/scripts/talos-uki-config-verify.sh
      - .github/scripts/talos-metal-verify.sh
      - .github/scripts/talos-metal-verify_test.sh
      - .github/scripts/talos-netboot-build.sh
      - .github/scripts/talos-netboot-verify.sh
      - .github/scripts/talos-uki-verify.sh
      - .github/workflows/talos-images.yml
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

# An evicted pending run publishes nothing, so runs queue.
concurrency:
  group: talos-images-${{ github.ref }}
  queue: max

permissions:
  contents: read

env:
  SITE: folly
  ROOT: clusters/folly/talos
  # The installer's UKI fetches a new node's config from here on its first boot. Talos fills in
  # ${uuid} and ${code}, and Actions expands only ${{ }}.
  CONFIG_URL: 'https://enroll.lolwtf.ca/talos/config?uuid=${uuid}&code=${code}'
  INSTALLER_REPO: ghcr.io/jonpulsifer/talos-installer-folly
  OP_ITEM: op://homelab/talos-secureboot

jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Test the input parser
        run: bash .github/scripts/talos-image-inputs_test.sh
      - name: Read the inputs
        id: inputs
        run: |
          set -euo pipefail
          bash .github/scripts/talos-image-inputs.sh "$ROOT/talos.tf" | tee inputs.json
          echo "version=$(jq -r .talos_version inputs.json)" >>"$GITHUB_OUTPUT"
      - name: The committed certificate halves must agree
        run: |
          set -euo pipefail
          hex() { od -An -tx1 -v "$1" | tr -d ' \n'; }
          for f in PK.auth KEK.auth db.auth; do
            [[ -s "$ROOT/secureboot/$f" ]] || { echo "::error::missing $ROOT/secureboot/$f"; exit 1; }
          done
          for cert in uki-signing-cert hookos-signing-cert; do
            pem=$(openssl x509 -in "$ROOT/secureboot/$cert.pem" -noout -fingerprint -sha256)
            der=$(openssl x509 -inform der -in "$ROOT/secureboot/$cert.der" -noout -fingerprint -sha256)
            [[ "$pem" == "$der" ]] || { echo "::error::$cert.pem and .der differ"; exit 1; }
            # The firmware boots an image only when db holds its certificate.
            [[ "$(hex "$ROOT/secureboot/db.auth")" == *"$(hex "$ROOT/secureboot/$cert.der")"* ]] || {
              echo "::error::db.auth does not enroll $cert"
              exit 1
            }
          done
      # A push builds only when the version, the extensions, the baked kernel
      # arguments, the public keys, the netboot inputs or this pipeline changed.
      # HookOS pins the agent image by digest, so nothing builds until the
      # containers workflow's delivery has pinned one.
      - name: Decide whether to build
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HAS_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
        run: |
          set -euo pipefail
          fingerprint() {
            local rev=$1 tf
            tf=$(mktemp)
            git show "$rev:$ROOT/talos.tf" >"$tf" || return 1
            bash .github/scripts/talos-image-inputs.sh "$tf" || return 1
            git show "$rev:clusters/folly/config/anchor-topology.json" | jq -r '.data.SPORE_BOOTSTRAP_IP' || return 1
            git ls-tree -r "$rev" -- "$ROOT/secureboot" "$ROOT/netboot.json" \
              nix/images/ipxe-folly.nix nix/images/hookos-folly.nix nix/images/fleet-boot.nix \
              apps/fleetd/package.nix apps/fleetd/go.mod apps/fleetd/go.sum apps/fleetd/cmd/fleet-boot \
              apps/fleetd/client apps/fleetd/protocol apps/fleetd/lldp apps/fleetd/fleetboot apps/fleetd/classes \
              terraform/network/tailscale/fleet.tf.json \
              .github/scripts/talos-images-build.sh .github/scripts/talos-netboot-build.sh \
              .github/workflows/talos-images.yml
          }
          build=false
          case "$EVENT" in
            workflow_dispatch) build=true ;;
            push)
              if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                git fetch --quiet --depth=1 origin "$BEFORE" || true
              fi
              if ! before=$(fingerprint "$BEFORE" 2>/dev/null) || [[ "$before" != "$(fingerprint HEAD)" ]]; then
                build=true
              fi
              ;;
          esac
          if [[ "$build" == true ]] && jq -e '.tink_agent_image | test("@sha256:0{64}$")' "$ROOT/netboot.json" >/dev/null; then
            echo "::warning::$ROOT/netboot.json pins no agent image yet, so no image is built"
            build=false
          fi
          if [[ "$build" == true && "$HAS_TOKEN" != true ]]; then
            echo "::warning::OP_SERVICE_ACCOUNT_TOKEN is not set, so no image is built"
            build=false
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      installer_digest: ${{ steps.push.outputs.digest }}
      metal_digest: ${{ steps.metal.outputs.digest }}
    env:
      VERSION: ${{ needs.inputs.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.21.6
      - name: Install the signature tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbsigntool mtools zstd
      - name: Test the installer check
        run: bash .github/scripts/talos-installer-verify_test.sh
      - name: Test the metal image check
        run: bash .github/scripts/talos-metal-verify_test.sh
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Load the signing keys
        id: op
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          UKI_SIGNING_KEY: ${{ env.OP_ITEM }}/uki_signing_key
          UKI_SIGNING_CERT: ${{ env.OP_ITEM }}/uki_signing_cert
          PCR_SIGNING_KEY: ${{ env.OP_ITEM }}/pcr_signing_key
          HOOKOS_SIGNING_KEY: ${{ env.OP_ITEM }}/hookos_signing_key
          HOOKOS_SIGNING_CERT: ${{ env.OP_ITEM }}/hookos_signing_cert

      # The imager reads /secureboot. The .auth files are public and come from
      # git; the private keys live only in this runner's temp directory. The
      # HookOS key stays out of the imager's directory.
      - name: Stage the keys
        env:
          UKI_SIGNING_KEY: ${{ steps.op.outputs.UKI_SIGNING_KEY }}
          UKI_SIGNING_CERT: ${{ steps.op.outputs.UKI_SIGNING_CERT }}
          PCR_SIGNING_KEY: ${{ steps.op.outputs.PCR_SIGNING_KEY }}
          HOOKOS_SIGNING_KEY: ${{ steps.op.outputs.HOOKOS_SIGNING_KEY }}
          HOOKOS_SIGNING_CERT: ${{ steps.op.outputs.HOOKOS_SIGNING_CERT }}
        run: |
          set -euo pipefail
          umask 077
          keys="$RUNNER_TEMP/secureboot"
          hookos="$RUNNER_TEMP/hookos"
          mkdir -p "$keys" "$hookos"
          printf '%s\n' "$UKI_SIGNING_KEY" >"$keys/uki-signing-key.pem"
          printf '%s\n' "$UKI_SIGNING_CERT" >"$keys/uki-signing-cert.pem"
          printf '%s\n' "$PCR_SIGNING_KEY" >"$keys/pcr-signing-key.pem"
          printf '%s\n' "$HOOKOS_SIGNING_KEY" >"$hookos/hookos-signing-key.pem"
          printf '%s\n' "$HOOKOS_SIGNING_CERT" >"$hookos/hookos-signing-cert.pem"
          cp "$ROOT"/secureboot/{PK,KEK,db}.auth "$keys/"
          for pair in "uki-signing-cert $keys" "hookos-signing-cert $hookos"; do
            read -r cert dir <<<"$pair"
            committed=$(openssl x509 -in "$ROOT/secureboot/$cert.pem" -noout -fingerprint -sha256)
            loaded=$(openssl x509 -in "$dir/$cert.pem" -noout -fingerprint -sha256)
            [[ "$committed" == "$loaded" ]] || { echo "::error::the 1Password $cert is not the committed one"; exit 1; }
          done
          echo "KEYS=$keys" >>"$GITHUB_ENV"
          echo "HOOKOS_KEYS=$hookos" >>"$GITHUB_ENV"

      - name: Build the installer, ISO and metal image
        run: |
          set -euo pipefail
          bash .github/scripts/talos-image-inputs.sh "$ROOT/talos.tf" >"$RUNNER_TEMP/inputs.json"
          bash .github/scripts/talos-images-build.sh "$RUNNER_TEMP/inputs.json" "$KEYS" "$RUNNER_TEMP/out" "$CONFIG_URL"

      - name: Build and sign iPXE, HookOS and fleet-boot
        run: |
          set -euo pipefail
          bash .github/scripts/talos-netboot-build.sh \
            "$KEYS/uki-signing-key.pem" "$KEYS/uki-signing-cert.pem" \
            "$HOOKOS_KEYS/hookos-signing-key.pem" "$HOOKOS_KEYS/hookos-signing-cert.pem" \
            "$RUNNER_TEMP/out"

      - name: Remove the keys
        if: always()
        run: |
          for dir in "${KEYS:-}" "${HOOKOS_KEYS:-}"; do
            if [[ -n "$dir" ]]; then
              find "$dir" -type f -exec shred -u {} +
              rm -rf "$dir"
            fi
          done

      - name: The installer's UKI must verify and fetch its config by code
        run: |
          set -euo pipefail
          bash .github/scripts/talos-installer-verify.sh "$ROOT/secureboot/uki-signing-cert.pem" \
            "$RUNNER_TEMP/out/installer-amd64-secureboot.tar" "$CONFIG_URL" | tee "$RUNNER_TEMP/installer.txt"
          {
            echo "### Installer UKI command line"
            echo '```'
            sed -n 's/^.*: command line: //p' "$RUNNER_TEMP/installer.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: iPXE, HookOS and fleet-boot must verify against the committed certificates
        run: |
          set -euo pipefail
          bash .github/scripts/talos-netboot-verify.sh "$ROOT/secureboot" "$ROOT/netboot.json" "$RUNNER_TEMP/out" \
            | tee "$RUNNER_TEMP/netboot.txt"
          {
            echo "### HookOS and fleet-boot command lines"
            echo '```'
            sed -n 's/^.*\/\([^/]*\)\.efi: command line: /\1: /p' "$RUNNER_TEMP/netboot.txt"
            echo '```'
            sed -n 's/^.*\/\(fleet-boot[^/]*\.efi\): \([0-9]*\) bytes$/fleet-boot UKI: \2 bytes/p' "$RUNNER_TEMP/netboot.txt"
          } >>"$GITHUB_STEP_SUMMARY"

      # fleet-boot writes this image for a Talos class and puts the install
      # code in its META, so the image must carry none.
      - name: The metal image's UKI must verify and fetch its config by code
        id: metal
        run: |
          set -euo pipefail
          img="$RUNNER_TEMP/out/metal-amd64-secureboot.raw.zst"
          bash .github/scripts/talos-metal-verify.sh "$ROOT/secureboot/uki-signing-cert.pem" "$img" "$CONFIG_URL" \
            | tee "$RUNNER_TEMP/metal.txt"
          echo "digest=sha256:$(sha256sum "$img" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          {
            echo "### Metal image"
            sed -n 's/^.*: \([0-9]* bytes compressed.*\)$/\1/p' "$RUNNER_TEMP/metal.txt"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the installer for a look when a check fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-amd64-secureboot
          path: ${{ runner.temp }}/out/installer-amd64-secureboot.tar
          if-no-files-found: ignore
          retention-days: 3

      - name: Push the installer
        id: push
        run: |
          set -euo pipefail
          image="$INSTALLER_REPO:$VERSION"
          crane push "$RUNNER_TEMP/out/installer-amd64-secureboot.tar" "$image"
          digest=$(crane digest "$image")
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "Installer: \`$image@$digest\`" >>"$GITHUB_STEP_SUMMARY"

      # Releases in this repository are immutable, and a tag name that an
      # immutable release used is spent for good. Each build is its own release,
      # tagged with the run id; gh uploads the assets to a draft and publishes
      # once. The mirror on each anchor takes the newest release of the version.
      - name: Publish the ISO, metal image, iPXE, HookOS and fleet-boot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="talos-$SITE/$VERSION-$GITHUB_RUN_ID"
          notes="Signed Talos $VERSION boot assets for $SITE, built from $GITHUB_SHA."
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
            --title "Talos $VERSION for $SITE, build $GITHUB_RUN_ID" --notes "$notes" \
            "$RUNNER_TEMP/out/metal-amd64-secureboot.iso" \
            "$RUNNER_TEMP/out/metal-amd64-secureboot.raw.zst" \
            "$RUNNER_TEMP/out/ipxe-amd64-secureboot.efi" \
            "$RUNNER_TEMP/out/hookos-amd64-secureboot-uki.efi" \
            "$RUNNER_TEMP/out/fleet-boot-amd64-secureboot-uki.efi"
          echo "Release: \`$tag\`" >>"$GITHUB_STEP_SUMMARY"

  # fleetd installs only an image pinned by digest, so each build pins the
  # installer it pushed, and the metal image it published for fleet-boot, in
  # clusters/folly/fleet/classes.json, through a pull request the
  # continuous-delivery App opens and merges, as containers.yml does for the
  # other images. The tag in class-inputs.json is the Talos root's
  # own and stays; fleetd prefers the class table's pin.
  pin:
    needs: [inputs, build]
    if: >-
      needs.build.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # The pull request's checks run only when the identity that opens it
          # also pushes the branch, so git must not send GITHUB_TOKEN.
          persist-credentials: false
      - name: Mint a continuous-delivery App token
        id: cd-app-token
        if: vars.CD_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
      - name: Pin the installer digest and the metal image in the class table
        env:
          GH_TOKEN: ${{ steps.cd-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.build.outputs.installer_digest }}
          METAL_DIGEST: ${{ needs.build.outputs.metal_digest }}
          VERSION: ${{ needs.inputs.outputs.version }}
          CLASSES: clusters/folly/fleet/classes.json
          BRANCH_NAME: cd/talos-installer-digest
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build pushed no digest"; exit 1; }
          [[ "$METAL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build published no metal image digest"; exit 1; }
          image="$INSTALLER_REPO@$DIGEST"
          # The release the build job published, its tag's slash encoded.
          metal="https://github.com/$GITHUB_REPOSITORY/releases/download/talos-$SITE%2F$VERSION-$GITHUB_RUN_ID/metal-amd64-secureboot.raw.zst"
          jq --arg image "$image" --arg metal "$metal" --arg digest "$METAL_DIGEST" \
            'with_entries(if .value.os == "talos" then .value.installer_image = $image | .value.image = $metal | .value.image_digest = $digest | .value.image_format = "raw.zst" else . end)' \
            "$CLASSES" >"$RUNNER_TEMP/classes.json"
          if cmp -s "$CLASSES" "$RUNNER_TEMP/classes.json"; then
            echo "$CLASSES already pins $image"
            exit 0
          fi
          cp "$RUNNER_TEMP/classes.json" "$CLASSES"
          git config user.name "${{ steps.cd-app-token.outputs.app-slug || 'github-actions' }}[bot]"
          git config user.email "${{ steps.cd-app-token.outputs.app-slug || 'github-actions' }}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B "$BRANCH_NAME"
          git commit -am "fix(cd): pin the Talos $VERSION installer by digest" -m "$image"
          git push origin "$BRANCH_NAME" --force
          title="fix(cd): pin the Talos $VERSION installer by digest"
          body="Automated pin of the installer this build pushed, for fleetd's class table."
          if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --head "$BRANCH_NAME" --base main
          else
            gh pr edit "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          # On the merge commit only: the branch commit keeps its checks.
          gh pr merge "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --auto --squash --body "[skip ci]"
