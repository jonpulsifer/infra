# The build caller for this repository, where uploaded archives build. A direct
# dispatch of the reusable workflow would run the default branch; the local
# `uses:` runs it at this file's own commit.
name: spindrift
run-name: spindrift ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      spec:
        description: The build request, as JSON. Spindrift fills this in.
        required: true
        type: string
      correlation:
        description: How Spindrift finds this run again. Not a build input.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/spindrift-build.yml
    # workflow_call passes only the secrets it is given, including the optional
    # SPINDRIFT_BUILD_SEAL_KEY. `inherit` is safe: the callee is in this repo.
    secrets: inherit
    with:
      spec: ${{ inputs.spec }}
