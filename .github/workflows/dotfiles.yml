name: dotfiles
on:
  push:
    branches: [main]
    paths:
      - 'dotfiles/**'
      - '.github/workflows/dotfiles.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dotfiles/**'
      - '.github/workflows/dotfiles.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mise
        run: curl -fsSL https://mise.run | sh
      # Fails on a missing link source. `mise dotfiles apply` exits 0 here,
      # because dotfiles/mise.toml has no [dotfiles] section.
      - name: Dotfiles link check
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          cd dotfiles
          mise trust -y .
          mise run dotfiles:check
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          cd dotfiles
          grep -rl '^#!/usr/bin/env bash' .local/bin/* scripts/* | xargs shellcheck
      # mise's pwsh build wants libicu unless globalization is invariant.
      - name: PSScriptAnalyzer
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          mise exec powershell@latest -- pwsh -NoProfile -File dotfiles/windows/Invoke-Lint.ps1
