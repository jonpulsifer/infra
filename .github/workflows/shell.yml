name: shell

# The repo's own scripts/ was linted nowhere. dotfiles.yml runs the only
# shellcheck in CI, gated on 'dotfiles/**' and grepping 'dotfiles/.local/bin/*'
# by hand -- so scripts/alerts.sh and scripts/pki/* were never checked, and
# neither was dotfiles/scripts/. An empty match exits 0, which is why the gap
# never announced itself.
#
# So: one job that runs the mise tasks, on every path that feeds them. mise is
# the command source of truth, and a second hand-rolled glob in YAML is how the
# two drifted apart in the first place.

on:
  push:
    branches: [main]
    paths: &paths
      - 'scripts/**'
      - 'dotfiles/**'
      - 'mise.toml'
      - '.github/workflows/shell.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shell tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v3
        with:
          # Only shfmt is needed beyond the apt shellcheck above; installing the
          # whole [tools] table here would pull kubectl, tofu and gcloud for a
          # lint job.
          install_args: shfmt
      - name: Format and lint
        run: mise run check
