name: shell

# Runs the mise shell checks. CI routing is an allow-list, so a script path
# missing from the filter below is never checked in CI.

on:
  push:
    branches: [main]
    paths: &paths
      - 'scripts/**'
      - '.github/scripts/**'
      - 'dotfiles/**'
      - 'clusters/offsite/apps/elevenlabs/*.sh'
      - 'mise.toml'
      - '.github/workflows/shell.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shell tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # Only shfmt: all of [tools] would pull kubectl, tofu and gcloud into a
          # lint job.
          install_args: shfmt
      - name: Format and lint
        run: mise run check
      - name: Test the ElevenLabs reconciler
        run: bash .github/scripts/elevenlabs-reconcile_test.sh
