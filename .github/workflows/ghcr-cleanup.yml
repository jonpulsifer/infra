name: ghcr-cleanup

# GHCR never expires a version, and each build pushes several. CD pins each
# image's newest build, so the newest tagged versions hold every live pin.
on:
  schedule:
    # Sunday, away from weekday CD merges.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: packages
        run: |
          set -euo pipefail
          list=$(jq -r '.build | join(",")' .github/containers.json)
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "Cleaning: $list"
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: ${{ steps.packages.outputs.list }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ten builds of headroom over the one digest each manifest pins.
          keep-n-tagged: 10
          # `latest` always tags the newest build, which is never deleted.
          exclude-tags: latest
          # Platform children and attestations are untagged; the action keeps
          # those that a kept manifest list references.
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          dry-run: ${{ inputs.dry-run || false }}
