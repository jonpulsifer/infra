name: TypeScript Benchmark

# Compares runner labels on one identical real workload. `skiff-ubuntu` belongs
# here on the strongest possible footing: its rootfs is the very same pinned
# actions-runner image digest ARC boots (nix/images/hull-ubuntu.nix,
# clusters/base/apps/arc/infra.yaml), so a difference in these numbers is the
# runner and not the toolchain.
#
# `skiff-nixos` is deliberately absent. It shares the host's /nix/store and has
# no FHS, so setup-bun's dynamically-linked download cannot run there — the same
# wall the ARC runners hit. It is a hull for jobs that build with Nix, not for
# this suite.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Runner target to test (all runs every label below in a parallel matrix)'
        type: choice
        options:
          - all
          - infra-offsite
          - infra-folly
          - skiff-ubuntu
          - skiff-ubuntu-bench
          - skiff-offsite
          - skiff-folly
          - ubuntu-latest
        default: all
      waves:
        description: 'Identical jobs fired at the chosen label at once. 1 measures a runner; >1 measures the pool — a hosted label queues past its concurrency cap while the fleet answers from warm slots, which is the whole argument for keeping skiffs booted'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '8'
          - '12'
        default: '1'
      caches:
        description: 'best = each label uses the fastest cache it has; none = no dependency or build cache anywhere (isolates the runner from the network); gha = actions/cache on every label, exactly as a hosted runner uses it — on a skiff whose host runs the local cache service, this measures that service'
        type: choice
        options:
          - best
          - none
          - gha
        default: best

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.set-runners.outputs.runners }}
      waves: ${{ steps.set-runners.outputs.waves }}
    steps:
      - id: set-runners
        run: |
          if [ "${{ inputs.target }}" = "all" ]; then
            echo 'runners=["infra-offsite", "infra-folly", "skiff-ubuntu", "ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runners=["${{ inputs.target }}"]' >> "$GITHUB_OUTPUT"
          fi
          # A JSON array [1..waves]. The matrix multiplies it against the label
          # list, so `waves: 8` on `skiff-ubuntu` fires eight identical jobs at
          # the fleet's shared pool at once.
          seq 1 "${{ inputs.waves }}" | jq -cs '.' | sed 's/^/waves=/' >> "$GITHUB_OUTPUT"

  # The cheapest job that can exist, on every label, so the Actions timings
  # separate what a runner costs to acquire from what the workload costs to
  # run. That split is the whole argument for a warm microVM pool: a skiff is
  # already booted and JIT-registered when the job arrives, an ARC runner is a
  # pod that must be scheduled, and a GitHub-hosted runner is a queue.
  #
  # It also records what hardware each label actually lands on, which is the
  # context every number below is meaningless without.
  overhead:
    needs: configure
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.configure.outputs.runners) }}
    name: overhead (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: What am I
        run: |
          printf 'label      %s\n' '${{ matrix.runner }}'
          printf 'kernel     %s\n' "$(uname -r)"
          printf 'cores      %s\n' "$(nproc)"
          printf 'memory     %s\n' "$(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
          printf 'uptime     %ss (how long this machine existed before the job)\n' "$(cut -d' ' -f1 /proc/uptime)"
          printf 'warm disk  %s\n' "${SKIFF_CACHE:-none (this runner brings no cache of its own)}"
          if [ -n "${SKIFF_CACHE:-}" ]; then
            df -h "$SKIFF_CACHE" | tail -1
            du -sh "$SKIFF_CACHE"/* "$RUNNER_TOOL_CACHE" 2>/dev/null || true
          fi

  benchmark:
    needs: configure
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.configure.outputs.runners) }}
        wave: ${{ fromJson(needs.configure.outputs.waves) }}
    name: benchmark (${{ matrix.runner }}${{ inputs.waves != '1' && format(' wave {0}', matrix.wave) || '' }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spindrift
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spindrift
          # Matches typescript.yml, and has to: the benchmark runs the same
          # suite, so a database configured differently would be measuring a
          # different thing.
          POSTGRES_INITDB_ARGS: >-
            -c max_connections=300
            -c fsync=off
            -c synchronous_commit=off
            -c full_page_writes=off
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # Whether this runner brought a cache of its own, and where.
      #
      # A skiff whose class persists its workspace mounts the same disk the last
      # job on that slot left behind, and its hull announces the one directory a
      # job may keep things in as $SKIFF_CACHE. Nothing else sets it: a hosted
      # runner, an ARC pod, and a skiff of a class that does not persist all
      # arrive with nothing and fall through to the GitHub Actions cache below.
      #
      # This is what the bench compares under `caches: best`. The first clean run
      # put a skiff at hosted-runner speed on compute (build 22 s against 25 s)
      # and lost 70 s of a 99 s deficit inside one `actions/cache` step — the
      # dependency store, over the internet. Both runners still do the same work
      # here; each does it with the fastest cache it has, which is how either
      # would be configured for real.
      #
      # `caches: none` is the other honest question, and the one that says what a
      # runner *is*: no dependency cache and no build cache on any label, so what
      # remains is cores, memory and disk. One caveat to state rather than hide —
      # a skiff's git objects and runner tool cache live on the same disk and
      # this wipes them too, but `actions/checkout` still fetches into the repo
      # it finds, so a skiff's checkout is incremental where a hosted runner's is
      # a clone. That difference is the runner, not a cache we configured.
      - name: Where this runner's cache lives
        run: |
          if [ "${{ inputs.caches }}" = "gha" ]; then
            echo "caches: gha — actions/cache on every label, no warm-disk shortcuts."
            if [ -n "${SKIFF_CACHE:-}" ]; then
              # The warm-disk content is emptied so the cache step transfers
              # every byte, and bun's store is redirected onto the disk — a
              # second copy beside the old one overflows a 6G slot (measured:
              # ENOSPC), and landing it on the tmpfs root OOMs the class.
              # The tool cache survives: this input measures actions/cache,
              # not mise.
              rm -rf "$SKIFF_CACHE"/*
              mkdir -p "$SKIFF_CACHE/bun"
              echo "BUN_INSTALL_CACHE_DIR=$SKIFF_CACHE/bun" >> "$GITHUB_ENV"
              echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-unset (talking to GitHub)}"
            fi
            exit 0
          fi
          if [ "${{ inputs.caches }}" = "none" ]; then
            echo "caches: none — nothing is restored on any label."
            if [ -n "${SKIFF_CACHE:-}" ]; then
              rm -rf "$SKIFF_CACHE"/* "${RUNNER_TOOL_CACHE:-/nonexistent}"/* 2>/dev/null || true
              mkdir -p "$SKIFF_CACHE/bun"
              # Emptied, but still on the disk. Left to its default, bun's store
              # lands in $HOME on the guest's tmpfs root and a cold install of
              # this repo is ~1.5 GiB against a 2.9 GiB class — which is an
              # ENOSPC mid-install, measured. "No cache" has to mean an empty
              # cache, not a cache in RAM, or this input measures the wrong
              # machine.
              echo "BUN_INSTALL_CACHE_DIR=$SKIFF_CACHE/bun" >> "$GITHUB_ENV"
              echo "Warm disk emptied so this skiff measures cold too."
            fi
            exit 0
          fi
          if [ -z "${SKIFF_CACHE:-}" ]; then
            echo "No warm disk. Restoring the dependency store over the network."
            exit 0
          fi
          mkdir -p "$SKIFF_CACHE/bun" "$SKIFF_CACHE/turbo" "$SKIFF_CACHE/mise"
          # mise is the odd one out: setup-bun and the runner's own tool cache
          # land in _work/_tool, which is already on this disk, but mise keeps
          # its toolchains under its own data directory in $HOME and re-downloads
          # helm every job without this line.
          {
            echo "SKIFF_CACHE_ROOT=$SKIFF_CACHE"
            echo "BUN_INSTALL_CACHE_DIR=$SKIFF_CACHE/bun"
            echo "TURBO_CACHE_DIR=$SKIFF_CACHE/turbo"
            echo "MISE_DATA_DIR=$SKIFF_CACHE/mise"
          } >> "$GITHUB_ENV"
          echo "Warm disk at $SKIFF_CACHE:"
          du -sh "$SKIFF_CACHE"/* 2>/dev/null || echo "  (empty — this slot is cold)"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/629296473058/locations/global/workloadIdentityPools/homelab/providers/github
          project_id: homelab-ng
          create_credentials_file: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # Skipped on a runner that mounted a warm disk: BUN_INSTALL_CACHE_DIR and
      # TURBO_CACHE_DIR already point at one, and downloading a copy of what is
      # on the local filesystem is the 70 s this whole exercise is about.
      - name: Cache Bun store
        if: env.SKIFF_CACHE_ROOT == '' && inputs.caches != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Follows the gha-mode redirect on a skiff; the hosted default
          # otherwise.
          path: ${{ env.BUN_INSTALL_CACHE_DIR || '~/.bun/install/cache' }}
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-
      - name: Cache Turborepo
        if: env.SKIFF_CACHE_ROOT == '' && inputs.caches != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
            apps/*/.turbo
            packages/*/.turbo
            apps/*/.next/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-
            turbo-${{ runner.os }}-
      # Matches typescript.yml: the suite this benchmark runs is that one, so a
      # tool named there has to be named here or the two measure different work.
      - name: Set up Helm and yq
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: helm yq
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
