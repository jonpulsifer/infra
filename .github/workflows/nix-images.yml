name: nix-images
# Builds and pushes the container images that Nix builds, and checks that every
# manifest pins the built tag. Digest rewrites stay in containers.yml.
on:
  push:
    branches: [main]
    paths:
      - nix/images/asterisk.nix
      - nix/hosts/default.nix
      - flake.lock
      - clusters/base/apps/pbx/deployment.yaml
      - .github/workflows/nix-images.yml
  pull_request:
    branches: [main]
    paths:
      - nix/images/asterisk.nix
      - nix/hosts/default.nix
      - flake.lock
      - clusters/base/apps/pbx/deployment.yaml
      - .github/workflows/nix-images.yml
  workflow_dispatch:

# An evicted pending run builds nothing, so runs queue.
concurrency:
  group: nix-images-${{ github.ref }}
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  asterisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jonpulsifer
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: Build the image
        id: build
        run: |
          set -euo pipefail
          nix build .#asterisk-image
          # Both come from the derivation, so the tag cannot disagree with the
          # Asterisk that is actually inside the layers.
          echo "name=$(nix eval --raw .#asterisk-image.imageName)" >>"$GITHUB_OUTPUT"
          echo "tag=$(nix eval --raw .#asterisk-image.imageTag)" >>"$GITHUB_OUTPUT"

      # Manifests pin this image by tag. The tag hashes the image contents, so a
      # change fails this step until every manifest names the new tag.
      - name: Every manifest must pin the tag that was just built
        env:
          IMAGE: ${{ steps.build.outputs.name }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail

          # Every manifest that names this image, found rather than listed: the
          # sidecar lives in a cluster overlay, and the first version of this
          # guard checked only the base Deployment — so a stale pin in the
          # overlay would have passed.
          mapfile -t manifests < <(grep -rl "image: ${IMAGE}:" clusters/ || true)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error::built ${IMAGE}:${TAG} but no manifest references it" >&2
            exit 1
          fi

          status=0
          for manifest in "${manifests[@]}"; do
            if grep -q "image: ${IMAGE}:" "$manifest" \
               && ! grep -q "image: ${IMAGE}:${TAG}" "$manifest"; then
              echo "::error file=${manifest}::pins a different tag than the ${TAG} just built:" >&2
              grep -n "image: ${IMAGE}:" "$manifest" >&2
              status=1
            fi
          done
          [ "$status" -eq 0 ] || { echo "::error::update those pins to ${TAG}" >&2; exit 1; }
          printf 'pinned at %s in: %s\n' "${TAG}" "${manifests[*]}"

      - name: Login to GitHub Container Registry
        # Pull requests build without publishing.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.build.outputs.name }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          # `nix build` on a streamLayeredImage writes a script that streams the
          # archive, rather than a multi-hundred-megabyte tarball into the store
          # and then into the cache.
          ./result | docker load
          docker push "${IMAGE}:${TAG}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}" | cut -d@ -f2)
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "::notice::pushed ${IMAGE}:${TAG}@${digest}"

      - name: Scan the pushed image with Trivy
        if: steps.push.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.name }}@${{ steps.push.outputs.digest }}
          trivy-config: ${{ github.workspace }}/.github/trivy.yaml
          ignore-unfixed: true
          exit-code: 0
          severity: CRITICAL,HIGH
