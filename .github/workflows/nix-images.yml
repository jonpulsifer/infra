name: nix-images
# Container images built by Nix rather than by a Dockerfile.
#
# containers.yml cannot carry these: it is a `docker/build-push-action` matrix
# discovered by finding Dockerfiles, and its selective-delivery step is welded
# to that matrix. This builds the derivation, pushes it, and checks the pin —
# it does not reimplement the digest rewrite, because that step and
# .github/scripts/cd-digest-update.sh are one program split across two files
# and a second copy of it would drift from the original the first time either
# moved.
on:
  push:
    branches: [main]
    # Spelled out twice. GitHub Actions does not resolve YAML anchors in a
    # workflow file — an alias here is a parse error, not a shorthand.
    paths:
      - nix/images/asterisk.nix
      - nix/hosts/default.nix
      - flake.lock
      - clusters/base/apps/pbx/deployment.yaml
      - .github/workflows/nix-images.yml
  pull_request:
    branches: [main]
    paths:
      - nix/images/asterisk.nix
      - nix/hosts/default.nix
      - flake.lock
      - clusters/base/apps/pbx/deployment.yaml
      - .github/workflows/nix-images.yml
  workflow_dispatch:

# Same reasoning as containers.yml: a pending run that gets evicted builds
# nothing and says so only by leaving a pin stale forever.
concurrency:
  group: nix-images-${{ github.ref }}
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  asterisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jonpulsifer
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: Build the image
        id: build
        run: |
          set -euo pipefail
          nix build .#asterisk-image
          # Both come from the derivation, so the tag cannot disagree with the
          # Asterisk that is actually inside the layers.
          echo "name=$(nix eval --raw .#asterisk-image.imageName)" >>"$GITHUB_OUTPUT"
          echo "tag=$(nix eval --raw .#asterisk-image.imageTag)" >>"$GITHUB_OUTPUT"

      # This image is pinned by version tag rather than by digest, because the
      # selective-delivery machinery lives in the other workflow. A tag pin is
      # only honest while something checks it, and the way it goes wrong is
      # specific: bumping flake.lock moves Asterisk to a new version, this
      # workflow publishes that new tag, and the Deployment goes on pulling the
      # old one — no error anywhere, just a PBX that never upgrades. So fail
      # here instead, on the pull request that moved the lock.
      - name: Deployment must pin the version that was just built
        env:
          IMAGE: ${{ steps.build.outputs.name }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          manifest=clusters/base/apps/pbx/deployment.yaml
          if ! grep -qF "image: ${IMAGE}:${TAG}" "$manifest"; then
            echo "::error file=${manifest}::built ${IMAGE}:${TAG}, but this manifest pins:"
            grep -n 'image:' "$manifest" >&2
            echo "::error::update the pin in ${manifest} to ${TAG}" >&2
            exit 1
          fi
          echo "pin matches ${IMAGE}:${TAG}"

      - name: Login to GitHub Container Registry
        # Pull requests build to validate and never publish, exactly as
        # containers.yml treats them.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.build.outputs.name }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          # `nix build` on a streamLayeredImage writes a script that streams the
          # archive, rather than a multi-hundred-megabyte tarball into the store
          # and then into the cache.
          ./result | docker load
          docker push "${IMAGE}:${TAG}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}" | cut -d@ -f2)
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "::notice::pushed ${IMAGE}:${TAG}@${digest}"

      - name: Scan the pushed image with Trivy
        if: steps.push.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.name }}@${{ steps.push.outputs.digest }}
          trivy-config: ${{ github.workspace }}/.github/trivy.yaml
          ignore-unfixed: true
          exit-code: 0
          severity: CRITICAL,HIGH
