---
# Talos mints a six-hour talosconfig for this account into the Secret of the
# same name, key `config`, with the endpoint talos.default. The control
# plane's KubeTalosAPIAccessConfig in clusters/folly/talos/patches.tf allows
# this role in this namespace.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-snapshot-talos
  labels:
    app.kubernetes.io/name: etcd-snapshot
    app.kubernetes.io/part-of: backups
spec:
  roles:
    - os:etcd:backup
