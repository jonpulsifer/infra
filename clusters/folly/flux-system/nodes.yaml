---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nodes
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/folly/nodes
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  # The NodeFeatureRule CRD exists only after this HelmRelease is ready, and
  # node-features needs it.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: node-feature-discovery
      namespace: nodes
