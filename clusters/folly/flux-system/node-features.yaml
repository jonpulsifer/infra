---
# Its own Kustomization: a NodeFeatureRule cannot dry-run in the apply that
# installs its CRD.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-features
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/folly/node-features
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: nodes
