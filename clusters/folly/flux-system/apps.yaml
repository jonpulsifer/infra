---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/folly/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # The operator installs `postgresql.cnpg.io/v1` and this overlay declares
    # Cluster objects of that kind. While the operator lived inside `apps` the
    # ordering was Flux's problem to solve within one Kustomization; now that it
    # is its own, the CRD can be absent when `apps` first applies — and Flux
    # dry-runs every object in a Kustomization before applying any, so one
    # unknown kind refuses the whole overlay rather than just itself.
    - name: cloudnative-pg
    - name: monitoring
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
      - kind: Secret
        name: cluster-secrets
