---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/folly/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # Flux dry-runs every object before applying any, so one missing CRD, such
    # as the CNPG Cluster kind, refuses the whole overlay.
    - name: cloudnative-pg
    - name: monitoring
    # The CRDs only: the dry-run needs the Sandbox kinds, not their controller.
    - name: agent-sandbox-crds
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
      - kind: Secret
        name: cluster-secrets
