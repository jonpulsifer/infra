---
# Patched onto clusters/base/cluster-settings.yaml. Only what folly does not
# share with offsite belongs here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # 1Password item "oauth2-proxy: folly", the OAuth app for this cluster's
  # oauth2 host.
  OAUTH2_PROXY_ITEM: iy4vkwkvbfhvm4kd2g6slnxlca

  # The handset the PBX NetworkPolicy may ring. The apps Kustomization cannot read
  # lab-topology.json; voip.tf fails its plan if this and clients.yaml differ.
  CATHY_IP: 10.1.0.151

  # Pinned: the handset's SIP registration and provisioning URL hold this
  # address, set by hand on the phone.
  PBX_SIP_VIP: 10.3.0.100
