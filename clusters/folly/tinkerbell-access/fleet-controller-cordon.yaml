---
# fleetd on spore reaches folly's API as this account, whose name is the one its sealed token
# names: `fleetd/folly-cordon-token` in nix/secrets/spore.sops.yaml. It cordons a node it
# quarantined, creates the bootstrap token each worker's install config carries, approves the
# kubelet client certificate that token asks for, and takes a retired node out of the cluster:
# cordon, evict its pods, delete its Node, its CSRs and its token. The admission policies below
# narrow each write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-controller-cordon
  namespace: kube-system
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-controller-cordon
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch", "delete"]
  # The drain of a retired node finds its pods and evicts them, as kubectl drain does.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["list", "delete"]
  # A worker's first kubelet client certificate, which fleetd approves only for the node whose
  # bootstrap token asked for it (apps/fleetd/fleet/joincsr.go). fleet-controller-csr-approval
  # narrows the approval.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["update"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["kubernetes.io/kube-apiserver-client-kubelet"]
    verbs: ["approve"]
  # fleetd exports whether the controller manager's approval binding regained subjects.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["system-bootstrap-approve-node-client-csr"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-controller-cordon
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-controller-cordon
subjects:
  - kind: ServiceAccount
    name: fleet-controller-cordon
    namespace: kube-system
---
# A bootstrap token is a Secret in kube-system. RBAC cannot narrow a create by type or name, and a
# Secret of another type, such as a service-account token, would mint a credential for another
# account, so the policy fleet-controller-join-tokens admits only fleetd's bootstrap tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-controller-join-tokens
  namespace: kube-system
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-controller-join-tokens
  namespace: kube-system
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-controller-join-tokens
subjects:
  - kind: ServiceAccount
    name: fleet-controller-cordon
    namespace: kube-system
---
# The token controller fills this Secret with a token that does not expire.
# spore runs outside the cluster, so it cannot mount a bound token.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: fleet-controller-cordon-token
  namespace: kube-system
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
  annotations:
    kubernetes.io/service-account.name: fleet-controller-cordon
---
# The account's node updates leave the node unschedulable and change nothing else in its spec,
# and no label, annotation, owner reference or finalizer: a cordon, never an uncordon or a
# relabel. An owner reference to an object that does not exist would have the garbage collector
# delete the node past fleet-controller-node-delete, and a finalizer would hold a deletion.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleet-controller-cordon
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["nodes"]
  matchConditions:
    - name: fleet-controller-cordon
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:fleet-controller-cordon"
  validations:
    - expression: >-
        has(object.spec.unschedulable) && object.spec.unschedulable == true
      reason: Forbidden
      message: fleet-controller-cordon may only leave a node unschedulable.
    - expression: >-
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)
      reason: Forbidden
      message: fleet-controller-cordon may not change a node's labels.
    - expression: >-
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)
      reason: Forbidden
      message: fleet-controller-cordon may not change a node's annotations.
    - expression: >-
        object.spec.all(k, k == 'unschedulable' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k == 'unschedulable' || k in object.spec)
      reason: Forbidden
      message: fleet-controller-cordon may not change a node's spec beyond unschedulable, such as its taints.
    - expression: >-
        object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([])
      reason: Forbidden
      message: fleet-controller-cordon may not change a node's owner references.
    - expression: >-
        object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([])
      reason: Forbidden
      message: fleet-controller-cordon may not change a node's finalizers.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleet-controller-cordon
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  policyName: fleet-controller-cordon
  validationActions: [Deny]
  matchResources: {}
---
# The account deletes only a node it cordoned, and never a control plane.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleet-controller-node-delete
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["nodes"]
  matchConditions:
    - name: fleet-controller-cordon
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:fleet-controller-cordon"
  validations:
    - expression: >-
        has(oldObject.spec.unschedulable) && oldObject.spec.unschedulable == true
      reason: Forbidden
      message: fleet-controller-cordon may delete only a cordoned node.
    - expression: >-
        !has(oldObject.metadata.labels) ||
        !('node-role.kubernetes.io/control-plane' in oldObject.metadata.labels)
      reason: Forbidden
      message: fleet-controller-cordon may not delete a control plane.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleet-controller-node-delete
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  policyName: fleet-controller-node-delete
  validationActions: [Deny]
  matchResources: {}
---
# The account's Secrets are bootstrap tokens for one node each, made and labelled by fleetd:
# named bootstrap-token-<id>, for authentication only, in the one group Talos's bootstrap
# manifests bind for a kubelet's TLS bootstrap, system:bootstrappers:nodes, and expiring within
# 8 hours of their creation. fleetd's tokens live for its config TTL, 2 hours, plus 4, and fleetd
# refuses to start with a TTL past 4 hours, so 8 leaves room without leaving a token that lasts.
# The account deletes only such a token, and replaces one by deleting it and creating another,
# so the policy sees the creation time of every token it admits.
#
# CEL sees a Secret's data as base64 strings and has no decoder here, so the policy compares the
# encoded values: dHJ1ZQ== is "true", c3lzdGVtOmJvb3RzdHJhcHBlcnM6bm9kZXM= is
# "system:bootstrappers:nodes", and six bytes of token ID and sixteen of secret encode to 8 and 24
# characters. It decodes the expiration, the 20 bytes of an RFC 3339 UTC time in 28 characters:
# each group of four is a 24-bit word, and each byte from "-" to "Z" maps back to its character.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleet-controller-join-tokens
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: fleet-controller-cordon
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:fleet-controller-cordon"
  variables:
    - name: secret
      expression: >-
        request.operation == "DELETE" ? oldObject : object
    - name: expirationBase64
      expression: >-
        request.operation == "CREATE" && has(object.data) ? object.data[?'expiration'].orValue('') : ''
    - name: expirationWords
      expression: >-
        size(variables.expirationBase64) == 28 ? [0, 1, 2, 3, 4, 5, 6].map(g, [0, 1, 2, 3].map(i,
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='.indexOf(variables.expirationBase64.charAt(4 * g + i)) % 64
        )).map(c, c[0] * 262144 + c[1] * 4096 + c[2] * 64 + c[3]) : []
    - name: expiration
      expression: >-
        variables.expirationWords.map(w, [w / 65536, w / 256 % 256, w % 256].map(b,
        b >= 45 && b <= 90 ? '-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt(b - 45) : '?'
        ).join()).join()
    - name: node
      expression: >-
        has(variables.secret.metadata.labels) &&
        variables.secret.metadata.labels[?'lolwtf.ca/managed-by'].orValue('') == 'fleet-controller'
        ? variables.secret.metadata.labels[?'lolwtf.ca/node'].orValue('') : ''
  validations:
    - expression: >-
        variables.secret.type == 'bootstrap.kubernetes.io/token' && variables.node != ''
      reason: Forbidden
      message: fleet-controller-cordon may write only the bootstrap tokens fleetd labels with their node.
    - expression: >-
        request.operation != "UPDATE"
      reason: Forbidden
      message: fleet-controller-cordon replaces a bootstrap token by deleting it and creating another.
    - expression: >-
        request.operation == "DELETE" ||
        (has(object.data) &&
        object.metadata.name.matches('^bootstrap-token-[a-z0-9]{6}$') &&
        size(object.data[?'token-id'].orValue('')) == 8 &&
        size(object.data[?'token-secret'].orValue('')) == 24 &&
        object.data[?'usage-bootstrap-authentication'].orValue('') == 'dHJ1ZQ==' &&
        object.data[?'auth-extra-groups'].orValue('') == 'c3lzdGVtOmJvb3RzdHJhcHBlcnM6bm9kZXM=' &&
        !('usage-bootstrap-signing' in object.data) &&
        'expiration' in object.data)
      reason: Forbidden
      message: >-
        A fleetd bootstrap token is a bootstrap-token-<id> Secret that expires, authenticates only,
        and is in the group system:bootstrappers:nodes alone.
    - expression: >-
        request.operation != "CREATE" ||
        (size(variables.expiration) == 21 &&
        variables.expiration.substring(0, 20).matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$') &&
        timestamp(variables.expiration.substring(0, 20)) <= timestamp(object.metadata.creationTimestamp) + duration('8h'))
      reason: Forbidden
      message: A fleetd bootstrap token's expiration is an RFC 3339 UTC time within 8 hours of its creation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleet-controller-join-tokens
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  policyName: fleet-controller-join-tokens
  validationActions: [Deny]
  matchResources: {}
---
# The account approves only what a fleetd join needs: a pending kubelet client CSR that a
# bootstrap token in system:bootstrappers:nodes asked for, for client authentication, with the one
# Approved condition and no denial. CEL cannot read the request's subject, so the check that the
# CSR names the node the token was minted for, and no other, is fleetd's (apps/fleetd/fleet/
# joincsr.go). This policy keeps a stolen account token to bootstrap requests: no other requester,
# signer or usage, no denial, and no change but the approval.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleet-controller-csr-approval
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["certificates.k8s.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["certificatesigningrequests", "certificatesigningrequests/approval", "certificatesigningrequests/status"]
  matchConditions:
    - name: fleet-controller-cordon
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:fleet-controller-cordon"
  validations:
    - expression: >-
        request.subResource == "approval"
      reason: Forbidden
      message: fleet-controller-cordon changes a CSR only through its approval.
    - expression: >-
        object.spec.signerName == "kubernetes.io/kube-apiserver-client-kubelet"
      reason: Forbidden
      message: fleet-controller-cordon approves only a kubelet client certificate.
    - expression: >-
        object.spec.username.matches('^system:bootstrap:[a-z0-9]{6}$') &&
        'system:bootstrappers:nodes' in object.spec.?groups.orValue([])
      reason: Forbidden
      message: fleet-controller-cordon approves only a request a node bootstrap token made.
    - expression: >-
        'client auth' in object.spec.?usages.orValue([]) &&
        object.spec.usages.all(u, u in ['client auth', 'digital signature', 'key encipherment'])
      reason: Forbidden
      message: fleet-controller-cordon approves only a certificate for client authentication.
    - expression: >-
        size(oldObject.status.?conditions.orValue([])) == 0 &&
        size(object.status.?conditions.orValue([])) == 1 &&
        object.status.conditions[0].type == 'Approved' && object.status.conditions[0].status == 'True'
      reason: Forbidden
      message: fleet-controller-cordon only approves a pending request, and never denies one.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleet-controller-csr-approval
  labels:
    app.kubernetes.io/name: fleet-controller-cordon
    app.kubernetes.io/part-of: fleetd
spec:
  policyName: fleet-controller-csr-approval
  validationActions: [Deny]
  matchResources: {}
