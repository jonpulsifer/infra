---
# The kubeconfig that the tinkerbell Kustomization uses to reach spore's Tinkerbell API. The
# certificate's CN is folly-flux, which spore's tinkerbell-rbac unit binds to a Role in the
# tinkerbell namespace. `scripts/tinkerbell-certs.sh --client folly-flux` mints it into the
# 1Password item. The template holds no dollar-brace, so Flux substitution passes it through.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spore-tinkerbell-kubeconfig
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: spore-tinkerbell-kubeconfig
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        value: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: spore-tinkerbell
              cluster:
                server: https://spore.lolwtf.ca:6443
                certificate-authority-data: {{ .ca | b64enc }}
          users:
            - name: folly-flux
              user:
                client-certificate-data: {{ .crt | b64enc }}
                client-key-data: {{ .key | b64enc }}
          contexts:
            - name: spore-tinkerbell
              context:
                cluster: spore-tinkerbell
                user: folly-flux
          current-context: spore-tinkerbell
  data:
    - secretKey: ca
      remoteRef: {key: spore tinkerbell api, property: ca.crt}
    - secretKey: crt
      remoteRef: {key: spore tinkerbell api, property: folly-flux.crt}
    - secretKey: key
      remoteRef: {key: spore tinkerbell api, property: folly-flux.key}
