apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      bgp-enabled: "true"
  bgpInstances:
    - name: folly
      localASN: ${BGP_CILIUM_ASN}
      peers:
        - name: udm-pro
          peerASN: ${BGP_GATEWAY_ASN}
          peerAddress: ${ROUTER_IP}
          peerConfigRef:
            name: ipv4-peer-config
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: ipv4-peer-config
spec:
  timers:
    connectRetryTimeSeconds: 12
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: pod-ip-pools
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: CiliumPodIPPool
      selector:
        matchExpressions:
          # Selects every pool: nothing is labelled bgp=lol.
          - { key: bgp, operator: NotIn, values: [lol] }
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: service-addresses
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          # Selects every Service: nothing is labelled bgp=lol.
          - { key: bgp, operator: NotIn, values: [lol] }
