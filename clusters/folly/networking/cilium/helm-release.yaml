---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  labels:
    source.toolkit.fluxcd.io/kind: OCIRepository
spec:
  interval: 24h
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    timeout: 10m
    remediation:
      retries: 5
  values:
    upgradeCompatibility: "1.17"
    autoDirectNodeRoutes: true
    devices: eno+ enp+ tailscale0
    kubeProxyReplacement: true
    k8sServiceHost: ${API_SERVER_IP}
    k8sServicePort: ${API_SERVER_PORT}
    routingMode: native
    ipv4NativeRoutingCIDR: ${CILIUM_NATIVE_ROUTING_CIDR}
    enableIPv4Masquerade: true
    bpf:
      masquerade: true
    ipam:
      mode: multi-pool
    enableXTSocketFallback: false
    endpointRoutes:
      enabled: true
    bgpControlPlane:
      enabled: true
    gatewayAPI:
      enabled: true
    envoy:
      enabled: true
      prometheus:
        enabled: true
        # Deliberately unscraped: envoy exports ~9.5k series per node, which
        # on three nodes is a third again of everything folly stores. The L7
        # question it answers is already covered by hubble's httpV2 metrics
        # below, at a twentieth of the cost.
        serviceMonitor:
          enabled: false
          labels:
            release: prom-stack
    ingressController:
      enabled: true
      default: true
    l7Proxy: true
    loadBalancer:
      l7:
        backend: envoy
    nodePort:
      enabled: true
    k8sNetworkPolicy:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          labels:
            release: prom-stack
    dashboards:
      enabled: true
    prometheus:
      enabled: true
      # The metrics endpoint has always been on; nothing selected it, so the
      # cilium, BGP and endpoint dashboards this chart ships rendered empty.
      # The ServiceMonitor is what the chart keys the cilium-agent Service off
      # as well, so this creates the target too.
      serviceMonitor:
        enabled: true
        # The chart defaults every one of these ServiceMonitors to 10s.
        # Nothing else in either cluster is scraped faster than the 30s
        # Prometheus uses globally, and three times the samples for the same
        # series is the cheapest way to spend a retention ceiling on nothing.
        interval: 30s
        labels:
          release: prom-stack
        metricRelabelings:
          # The agent's series are dominated by its own internals: hive job
          # timers, workqueue and apiserver-client latency histograms. None of
          # them appear on a dashboard here and together they are ~45% of the
          # ~1.9k series each agent exports. folly's TSDB runs close to its
          # retention ceiling, so they are dropped at ingest.
          - action: drop
            sourceLabels: [__name__]
            regex: cilium_(hive_|k8s_client_|k8s_workqueue_|agent_api_process_time_).*
    hubble:
      enabled: true
      relay:
        enabled: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            labels:
              release: prom-stack
      metrics:
        # ~440 series per node for drops, DNS, TCP and L7 -- the cheapest
        # network visibility on offer here, and what the hubble dashboards
        # this chart already ships are drawn against.
        serviceMonitor:
          enabled: true
          interval: 30s
          labels:
            release: prom-stack
        dashboards:
          enabled: true
        enableOpenMetrics: true
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true
      ui:
        enabled: true
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
            hajimari.io/enable: "true"
            hajimari.io/icon: "network"
          hosts:
            - &host hubble.${SECRET_DOMAIN}
          tls:
            - hosts:
                - *host
              secretName: *host
