---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: nodes
spec:
  interval: 24h
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.18.3
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
  values:
    fullnameOverride: node-feature-discovery
    # Both settings let NFD survive a briefly unreachable API server, which
    # folly's control plane is whenever its disk saturates.
    master:
      # One replica needs no lease, and losing it hits an upstream nil deref in
      # NamespaceLister.stop. The chart hardcodes the flag; the last one wins.
      extraArgs:
        - "-enable-leader-election=false"
    worker:
      config:
        core:
          # Skips the startup GET of the worker's own Pod, which exits the worker
          # when the API is down. nfd-gc still collects NodeFeatures of gone nodes.
          noOwnerRefs: true
