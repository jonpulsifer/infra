apiVersion: apps/v1
kind: Deployment
metadata:
  name: kata-demo
  namespace: kata-demo
  labels:
    app.kubernetes.io/name: kata-demo
    app.kubernetes.io/part-of: kata-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kata-demo
      app.kubernetes.io/part-of: kata-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kata-demo
        app.kubernetes.io/part-of: kata-demo
    spec:
      # Every k8s node registers this handler (nix/services/k8s/kata.nix), so
      # the pod needs no scheduling constraint.
      runtimeClassName: kata-clh
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render
          image: busybox:1.38
          command: ["sh", "/etc/kata-demo/render.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /srv
            - name: config
              mountPath: /etc/kata-demo
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: html
              mountPath: /srv
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: html
          emptyDir: {}
        - name: config
          configMap:
            name: kata-demo
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
