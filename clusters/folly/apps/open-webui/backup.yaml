---
# The data volume, read-only, from the node its local-path volume lives on.
# Open WebUI writes it as root, so the job reads it as root. The SQLite
# database is copied live, so a snapshot is as consistent as the file is
# between writes. cache/ holds downloaded models and is skipped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: open-webui-backup
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui-backup
    app.kubernetes.io/part-of: open-webui
    lolwtf.ca/backup: "true"
spec:
  schedule: "20 3 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: open-webui-backup
            app.kubernetes.io/part-of: open-webui
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: open-webui
                      app.kubernetes.io/instance: open-webui
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              args:
                - backup
                - --host=folly/open-webui/open-webui
                - --tag=kind=pvc
                - --retry-lock=30m
                - --exclude=/data/cache
                - /data
              envFrom:
                - configMapRef:
                    name: restic
                - secretRef:
                    name: restic
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/cache
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: open-webui
                readOnly: true
            - name: tmp
              emptyDir: {}
