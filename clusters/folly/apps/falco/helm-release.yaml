---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  chart:
    spec:
      chart: falco
      version: 9.0.0
      sourceRef:
        kind: HelmRepository
        name: falco
  values:
    driver:
      kind: modern-bpf
    collectors:
      kubernetes:
        enabled: true
    customRules:
      rules-allow-runc-memfd.yaml: |-
        # https://github.com/falcosecurity/falco/issues/3444
        # Add runc to known binaries
        - list: known_memfd_execution_binaries
          items: [runc, .runc-wrapped]
          override:
            items: append

        # Add specific path conditions to existing macro
        - macro: known_memfd_execution_processes
          condition: or (proc.exepath = "memfd:runc_cloned:/proc/self/exe") or (proc.exe = "memfd:runc_cloned:/proc/self/exe")
          override:
            condition: append
        
        # k8s containers that talk to the apiserver
        - macro: k8s_containers
          condition: or (container.image.repository in (docker.io/kiwigrid/k8s-sidecar, quay.io/kiwigrid/k8s-sidecar))
          override:
            condition: append
      rules-quiet-k8s-api.yaml: |-
        # 416,970 of 417,006 falco events in 24h are this one rule. Every
        # in-cluster controller trips it, and thousands arrive with
        # container.image.repository unresolved, so the k8s_containers
        # allow-list above structurally cannot match them.
        - rule: Contact K8S API Server From Container
          enabled: false
          override:
            enabled: replace
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
    serviceMonitor:
      create: true
    tolerations:
      - effect: NoSchedule
        key: unschedulable
        operator: Equal
        value: "true"
    falcosidekick:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRules:
        enabled: true
      grafana:
        dashboards:
          enabled: true
          configMaps:
            falcosidekick:
              namespace: monitoring
      config:
        # falcosidekick's loki output speaks the Loki push protocol, which is
        # how VictoriaLogs ingests. Only the host and path move.
        loki:
          hostport: http://victoria-logs-server.monitoring.svc.cluster.local:9428
          endpoint: /insert/loki/api/v1/push
          tenant_id: "1"
          grafanaDashboard:
            enabled: true
            namespace: monitoring
      # The webui's bundled redis stores every event with no TTL, no
      # maxmemory and no memory limit. Events already land in VictoriaLogs
      # via the loki output above, at 30d retention with a Grafana dashboard.
      webui:
        enabled: false
