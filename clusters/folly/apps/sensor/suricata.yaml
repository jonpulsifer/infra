---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata
  labels:
    app.kubernetes.io/name: suricata
    app.kubernetes.io/part-of: sensor
  annotations:
    # The scripts and the disable list are read at start, so a change to
    # the ConfigMap rolls the pod.
    configmap.reloader.stakater.com/reload: sensor-scripts
spec:
  replicas: 1
  # One capture per interface: the old pod leaves before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: suricata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suricata
        app.kubernetes.io/part-of: sensor
    spec:
      # The sensor's USB NIC is on shale, cabled to the switch's mirror port
      # (terraform/network/unifi/folly/bootstrap.tf).
      nodeSelector:
        kubernetes.io/hostname: shale
      # The capture interface is the node's, so the pod shares its network
      # namespace. Nothing listens.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      tolerations:
        - effect: NoSchedule
          key: unschedulable
          operator: Equal
          value: "true"
      initContainers:
        # Waits for the USB NIC, then leaves it up, promiscuous and with no
        # address: privileged, to write the node's sysctls for the link.
        - name: quiet-nic
          image: docker.io/jasonish/suricata:8.0.8@sha256:d5a3a1785299ab40918d465e54fedf8e3afeeedba76bb64b0cc74dbc20bda2c3
          command: ["/bin/bash", "/scripts/quiet-nic.sh"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      containers:
        - name: suricata
          image: docker.io/jasonish/suricata:8.0.8@sha256:d5a3a1785299ab40918d465e54fedf8e3afeeedba76bb64b0cc74dbc20bda2c3
          # The image's entrypoint fills /etc/suricata, then runs these.
          args: ["/bin/bash", "/scripts/suricata-run.sh"]
          # The hosts that fetch tsidp's keys through Funnel, which
          # scripts/funnel-tripwires.rules leaves out.
          env:
            - name: FUNNEL_FETCHERS
              value: "${API_SERVER_IP},${SPORE_IP}"
          securityContext:
            capabilities:
              drop: [ALL]
              # NET_ADMIN brings the link up in promiscuous mode, NET_RAW
              # opens the AF_PACKET sockets, SYS_NICE sets thread priorities,
              # and DAC_OVERRIDE reads the image's 0600 config, which the
              # suricata user owns.
              add: [NET_ADMIN, NET_RAW, SYS_NICE, DAC_OVERRIDE]
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: rules
              mountPath: /var/lib/suricata
            - name: run
              mountPath: /var/run/suricata
            - name: logs
              mountPath: /var/log/suricata
        # Fetches the ET Open rules daily and reloads them over the socket.
        - name: rules-update
          image: docker.io/jasonish/suricata:8.0.8@sha256:d5a3a1785299ab40918d465e54fedf8e3afeeedba76bb64b0cc74dbc20bda2c3
          args: ["/bin/bash", "/scripts/suricata-update-loop.sh"]
          securityContext:
            capabilities:
              drop: [ALL]
              # suricata-update reads the same 0600 config.
              add: [DAC_OVERRIDE]
          # suricata-update holds the whole ET Open set in memory while it
          # merges; 512Mi got it killed.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: rules
              mountPath: /var/lib/suricata
            - name: run
              mountPath: /var/run/suricata
      volumes:
        - name: scripts
          configMap:
            name: sensor-scripts
            defaultMode: 0555
        - name: rules
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
