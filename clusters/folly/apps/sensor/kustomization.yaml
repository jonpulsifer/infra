---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - zeek.yaml
  - suricata.yaml
namespace: sensor
configMapGenerator:
  - name: sensor-scripts
    files:
      - scripts/sensor-interface.sh
      - scripts/quiet-nic.sh
      - scripts/zeek-run.sh
      - scripts/sensor.zeek
      - scripts/suricata-run.sh
      - scripts/suricata-update-loop.sh
      - scripts/suricata-disable.conf
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Shell and Zeek script: their $ syntax is not Flux's to fill.
    kustomize.toolkit.fluxcd.io/substitute: disabled
