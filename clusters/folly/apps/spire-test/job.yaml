# terraform/gcp/projects/homelab-ng/spire-test.tf grants
# spiffe://lolwtf.ca/ns/spire-test/sa/uploader object create on the bucket,
# so the name matters. The pod holds no Kubernetes token and no GCP key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uploader
  namespace: spire-test
  labels:
    app.kubernetes.io/name: uploader
    app.kubernetes.io/part-of: spire
automountServiceAccountToken: false
---
# Proves the SPIRE path to GCP as a workload would use it: gcloud reads the
# ADC document from the spiffe-adc component, runs spiffe-adc for a JWT-SVID
# through the csi.spiffe.io volume, trades it at STS, and the token uploads
# one object. No sidecar, no hostPath, no file to keep fresh. Nothing here
# names a cluster. Bump the suffix in the name to run it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-2
  namespace: spire-test
  labels:
    app.kubernetes.io/name: uploader
    app.kubernetes.io/part-of: spire
  annotations:
    # A Job's template is immutable, so Flux replaces the Job to change it.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # Set suspend: true while no node carries lolwtf.ca/tpm=true with an
  # attested agent; a Pending pod would raise KubeJobNotCompleted.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uploader
        app.kubernetes.io/part-of: spire
    spec:
      restartPolicy: Never
      serviceAccountName: uploader
      automountServiceAccountToken: false
      # Only these nodes run a SPIRE agent and its CSI driver.
      nodeSelector:
        lolwtf.ca/tpm: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upload
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:582.0.0-slim
          # objectCreator has no object read, and `gcloud storage cp` reads the
          # destination first. gcloud trades the SVID for a token, and the JSON
          # API upload needs only storage.objects.create.
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              umask 077
              mkdir -p /tmp/gcloud
              # The SPIFFE ID, from one reply of the executable the library runs.
              GOOGLE_EXTERNAL_ACCOUNT_AUDIENCE="$(python3 -c 'import json; print(json.load(open("/var/run/spiffe/adc/gcp-credentials.json"))["audience"])')" \
                /opt/spiffe-adc/spiffe-adc > /tmp/reply.json
              python3 - <<'PY'
              import base64, json, os

              reply = json.load(open("/tmp/reply.json"))
              if not reply.get("success"):
                  raise SystemExit(f"spiffe-adc: {reply.get('message')}")
              payload = reply["id_token"].split(".")[1]
              sub = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))["sub"]
              open("/tmp/object.txt", "w").write(
                  f"Uploaded by {sub} from {os.environ['NODE_NAME']} with no key file and no sidecar.\n"
              )
              print("SVID:", sub)
              PY
              gcloud --quiet auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS"
              printf 'Authorization: Bearer %s\n' "$(gcloud auth print-access-token)" > /tmp/auth-header
              object="uploads/$(date -u +%Y%m%dT%H%M%SZ)-$NODE_NAME.txt"
              curl --fail-with-body -sS -X POST -H @/tmp/auth-header \
                -H 'Content-Type: text/plain' --data-binary @/tmp/object.txt \
                "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$object" > /dev/null
              echo "Uploaded gs://$BUCKET/$object"
          env:
            # The ADC document from the spiffe-adc component, and the library's
            # consent to run the executable it names.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/spiffe/adc/gcp-credentials.json
            - name: GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES
              value: "1"
            # Where the csi.spiffe.io volume puts the agent's socket.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/agent.sock
            # Declared in terraform/gcp/projects/homelab-ng/spire-test.tf.
            - name: BUCKET
              value: homelab-ng-spire-test
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOME
              value: /tmp
            # gcloud's credential store and logs; the root filesystem is read-only.
            - name: CLOUDSDK_CONFIG
              value: /tmp/gcloud
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-adc
              mountPath: /var/run/spiffe/adc
              readOnly: true
            - name: spiffe-adc-bin
              mountPath: /opt/spiffe-adc
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # The agent's socket, from the driver in clusters/folly/apps/spire/csi-driver.yaml.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spiffe-adc
          configMap:
            name: spiffe-adc
        # The executable. CD rewrites this digest (`.github/containers.json`) by
        # matching the whole `ghcr.io/…/spiffe-adc…@sha256:` string, so keep it
        # one literal. The zero digest stands until main builds the first image.
        - name: spiffe-adc-bin
          image:
            reference: ghcr.io/jonpulsifer/spiffe-adc:latest@sha256:fda71c894170e5ab5e65757cd6a38c425df64170718e5a03deb5b964529529a9
            pullPolicy: IfNotPresent
