# Proves the SPIRE path to GCP through the Google client libraries, as an
# app would use them: Go, Python and JavaScript on Bun, each in its own
# container of one pod, each uploading one object through ADC. The pod
# carries the same env and volumes as upload-2 and no credential. Bump the
# suffix in the name to run it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: clients-1
  namespace: spire-test
  labels:
    app.kubernetes.io/name: clients
    app.kubernetes.io/part-of: spire
  annotations:
    # A Job's template is immutable, so Flux replaces the Job to change it.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # Set suspend: true while no node carries lolwtf.ca/tpm=true with an
  # attested agent; a Pending pod would raise KubeJobNotCompleted.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clients
        app.kubernetes.io/part-of: spire
    spec:
      restartPolicy: Never
      serviceAccountName: uploader
      automountServiceAccountToken: false
      # Only these nodes run a SPIRE agent and its CSI driver.
      nodeSelector:
        lolwtf.ca/tpm: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: go
          # CD rewrites this digest (`.github/containers.json`) by matching the
          # whole `ghcr.io/…/spiffe-adc-test…@sha256:` string, so keep it one
          # literal. The zero digest stands until main builds the first image.
          image: ghcr.io/jonpulsifer/spiffe-adc-test:latest@sha256:15c2c6b4c8ebd5ff07a09d4df5dcacc3f37e6d742e4aada5ee47c437cea9ffa4
          imagePullPolicy: IfNotPresent
          command: ["/test/go-upload"]
          env: &env
            # The ADC document from the spiffe-adc component, and the library's
            # consent to run the executable it names.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/spiffe/adc/gcp-credentials.json
            - name: GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES
              value: "1"
            # Where the csi.spiffe.io volume puts the agent's socket.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/agent.sock
            # Declared in terraform/gcp/projects/homelab-ng/spire-test.tf.
            - name: BUCKET
              value: homelab-ng-spire-test
            - name: GCP_PROJECT
              value: homelab-ng
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOME
              value: /tmp
            - name: BUN_INSTALL_CACHE_DIR
              value: /tmp/bun
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: &resources
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts: &volumeMounts
            - name: tmp
              mountPath: /tmp
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spiffe-adc
              mountPath: /var/run/spiffe/adc
              readOnly: true
            - name: spiffe-adc-bin
              mountPath: /opt/spiffe-adc
              readOnly: true
        - name: python
          image: ghcr.io/jonpulsifer/spiffe-adc-test:latest@sha256:15c2c6b4c8ebd5ff07a09d4df5dcacc3f37e6d742e4aada5ee47c437cea9ffa4
          imagePullPolicy: IfNotPresent
          command: ["/opt/venv/bin/python", "/test/python/upload.py"]
          env: *env
          securityContext: *securityContext
          resources: *resources
          volumeMounts: *volumeMounts
        - name: bun
          image: ghcr.io/jonpulsifer/spiffe-adc-test:latest@sha256:15c2c6b4c8ebd5ff07a09d4df5dcacc3f37e6d742e4aada5ee47c437cea9ffa4
          imagePullPolicy: IfNotPresent
          workingDir: /test/bun
          command: ["bun", "run", "upload.ts"]
          env: *env
          securityContext: *securityContext
          resources: *resources
          volumeMounts: *volumeMounts
      volumes:
        - name: tmp
          emptyDir: {}
        # The agent's socket, from the driver in clusters/folly/apps/spire/csi-driver.yaml.
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: spiffe-adc
          configMap:
            name: spiffe-adc
        # The executable; CD rewrites this digest as it does the image above.
        - name: spiffe-adc-bin
          image:
            reference: ghcr.io/jonpulsifer/spiffe-adc:latest@sha256:9721d5b58614dc8825c65989bbd902b766cdbaa06ef8c3f4626ce585d593ff14
            pullPolicy: IfNotPresent
