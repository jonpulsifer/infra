apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: smiirl
  namespace: smiirl
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
spec:
  gatewayClassName: cilium
  # Pinned, because the lab CoreDNS (nix/services/coredns-sinkhole.nix) hands
  # the counter this literal address for api.smiirl.com; an address the pool
  # reassigns on a rebuild would strand the device. Free in this cluster's
  # `LB_RANGE` (`cluster-topology.json`).
  addresses:
    - type: IPAddress
      value: 10.3.0.84
  listeners:
    # The counter's plain-HTTP poll. Its firmware only speaks http://api.smiirl.com.
    - name: api
      protocol: HTTP
      port: 80
      hostname: api.smiirl.com
    - name: http
      protocol: HTTP
      port: 80
      hostname: &hostname "smiirl.${SECRET_DOMAIN}"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: *hostname
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: http-counter
      protocol: HTTP
      port: 80
      hostname: &counter "counter.${SECRET_DOMAIN}"
    - name: https-counter
      protocol: HTTPS
      port: 443
      hostname: *counter
      tls:
        certificateRefs:
          - kind: Secret
            name: *counter
---
# The device hostname goes straight to the app, which answers it the way the
# cloud does (a boot-time GET /number and GET / included) and never offers the
# page or its writable /api on it, since every iot-VLAN client resolves this
# name.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: smiirl-api
  namespace: smiirl
spec:
  parentRefs:
    - name: smiirl
  hostnames:
    - api.smiirl.com
  rules:
    - # The number poll is held up to 12 s in the app; Envoy's default route
      # timeout is 15 s, too close for comfort on a slow round trip.
      timeouts:
        request: 30s
        backendRequest: 30s
      backendRefs:
        - name: smiirl
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: smiirl
  namespace: smiirl
spec:
  parentRefs:
    - name: smiirl
  hostnames:
    - "smiirl.${SECRET_DOMAIN}"
    - "counter.${SECRET_DOMAIN}"
  rules:
    - timeouts:
        request: 30s
        backendRequest: 30s
      backendRefs:
        - name: smiirl
          port: 8080
