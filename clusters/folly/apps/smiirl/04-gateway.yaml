apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: smiirl
  namespace: smiirl
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
spec:
  gatewayClassName: cilium
  # Pinned: the lab CoreDNS (nix/services/coredns-sinkhole.nix) answers
  # api.smiirl.com with this literal. It must stay free inside LB_RANGE.
  addresses:
    - type: IPAddress
      value: 10.3.0.84
  listeners:
    # The counter's plain-HTTP poll. Its firmware only speaks http://api.smiirl.com.
    - name: api
      protocol: HTTP
      port: 80
      hostname: api.smiirl.com
    - name: http
      protocol: HTTP
      port: 80
      hostname: &hostname "smiirl.${SECRET_DOMAIN}"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: *hostname
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: http-counter
      protocol: HTTP
      port: 80
      hostname: &counter "counter.${SECRET_DOMAIN}"
    - name: https-counter
      protocol: HTTPS
      port: 443
      hostname: *counter
      tls:
        certificateRefs:
          - kind: Secret
            name: *counter
---
# Every iot-VLAN client resolves this name, so the app serves only the firmware
# routes on it, never the page or the writable /api.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: smiirl-api
  namespace: smiirl
spec:
  parentRefs:
    - name: smiirl
  hostnames:
    - api.smiirl.com
  rules:
    - # The app holds a poll up to 12 s; Envoy's 15 s default is too tight.
      timeouts:
        request: 30s
        backendRequest: 30s
      backendRefs:
        - name: smiirl
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: smiirl
  namespace: smiirl
spec:
  parentRefs:
    - name: smiirl
  hostnames:
    - "smiirl.${SECRET_DOMAIN}"
    - "counter.${SECRET_DOMAIN}"
  rules:
    - timeouts:
        request: 30s
        backendRequest: 30s
      backendRefs:
        - name: smiirl
          port: 8080
