---
# The app's NFS volume, read-only, as the uid the app writes it with.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: smiirl-backup
  namespace: smiirl
  labels:
    app.kubernetes.io/name: smiirl-backup
    app.kubernetes.io/part-of: smiirl
    lolwtf.ca/backup: "true"
spec:
  schedule: "50 1 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: smiirl-backup
            app.kubernetes.io/part-of: smiirl
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              args:
                - backup
                - --host=folly/smiirl/smiirl-data
                - --tag=kind=pvc
                - --retry-lock=30m
                - /data
              envFrom:
                - configMapRef:
                    name: restic
                - secretRef:
                    name: restic
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/cache
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: smiirl-data
                readOnly: true
            - name: tmp
              emptyDir: {}
