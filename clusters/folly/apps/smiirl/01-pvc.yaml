---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smiirl-data
  namespace: smiirl
spec:
  accessModes:
    - ReadWriteMany
  # Backed by the dynamic `nfs` StorageClass (provisioned by
  # clusters/folly/storage/nfs-provisioner) on spore.
  storageClassName: nfs
  resources:
    requests:
      storage: 1Gi
