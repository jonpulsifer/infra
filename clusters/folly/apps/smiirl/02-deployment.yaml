apiVersion: apps/v1
kind: Deployment
metadata:
  name: smiirl
  namespace: smiirl
  labels:
    app.kubernetes.io/name: smiirl
    app.kubernetes.io/part-of: smiirl
spec:
  replicas: 1
  # Two pods would race the rename of number.json on the shared PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smiirl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smiirl
        app.kubernetes.io/part-of: smiirl
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smiirl
          image: ghcr.io/jonpulsifer/smiirl:latest@sha256:02595b4f1cf6a6e18d9f61aab03ed29fb102f8cedeebca49cbbf54dbfc9f4be3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SMIIRL_DATA_DIR
              value: /data
            # The daily step fires on this clock.
            - name: TZ
              value: Canada/Atlantic
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smiirl-data
