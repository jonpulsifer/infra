apiVersion: apps/v1
kind: Deployment
metadata:
  name: smiirl
  namespace: smiirl
  labels:
    app.kubernetes.io/name: smiirl
    app.kubernetes.io/part-of: smiirl
spec:
  replicas: 1
  # number.json on the PVC is the single source of truth; two pods would race
  # the rename.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smiirl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smiirl
        app.kubernetes.io/part-of: smiirl
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smiirl
          # No digest pin yet: the containers workflow refuses to add a deploy
          # target for a manifest that pins none, and there is no published
          # image to pin until this merges. The pin and the "deploy" entry in
          # .github/containers.json follow once the first image lands on main.
          image: ghcr.io/jonpulsifer/smiirl:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SMIIRL_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smiirl-data
