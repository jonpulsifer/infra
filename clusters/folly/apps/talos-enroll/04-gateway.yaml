# Talos trusts only its bundled roots before it has a config, so the name has a
# public certificate. HTTPS only: the config carries every cluster secret.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: talos-enroll
  namespace: talos-enroll
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
spec:
  gatewayClassName: cilium
  # Pinned, so the bootstrap VLAN's firewall can admit this one address.
  addresses:
    - type: IPAddress
      value: ${ENROLL_VIP}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: &hostname "enroll.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
---
# Only the three routes of the device flow; /metrics and /healthz stay inside
# the cluster.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: talos-enroll
  namespace: talos-enroll
spec:
  parentRefs:
    - name: talos-enroll
  hostnames:
    - "enroll.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path: {type: Exact, value: /device/code}
        - path: {type: Exact, value: /token}
        - path: {type: Exact, value: /config}
      backendRefs:
        - name: talos-enroll
          port: 8080
