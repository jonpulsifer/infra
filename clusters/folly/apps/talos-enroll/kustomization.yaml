---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-external-secrets.yaml
  - 02-deployment.yaml
  - 03-service.yaml
  - 04-gateway.yaml
  - 05-tailnet-ingress.yaml
  - 06-network-policy.yaml
  - 07-service-monitor.yaml
configMapGenerator:
  # `mise run render-machine-inputs` writes both files. The name's hash
  # changes with them, which rolls the Deployment.
  - name: talos-enroll-inputs
    namespace: talos-enroll
    files:
      - machine-inputs.json
      - node-macs.json
    # Talos patches may hold ${...}, which Flux substitution would rewrite.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
