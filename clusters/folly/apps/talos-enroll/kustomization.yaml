---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-external-secrets.yaml
  - 02-deployment.yaml
  - 03-service.yaml
  - 04-gateway.yaml
  - 05-tailnet-ingress.yaml
  - 06-network-policy.yaml
  - 07-service-monitor.yaml
configMapGenerator:
  # `mise run render-class-inputs` writes the file. The name's hash changes
  # with it, which rolls the Deployment. This copy has no directory: it can
  # reach neither NetBox nor the inventory export, so it renders nothing, and
  # the anchors' copies are the enrollment path.
  - name: talos-enroll-inputs
    namespace: talos-enroll
    files:
      - class-inputs.json
    # Talos patches may hold ${...}, which Flux substitution would rewrite.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
