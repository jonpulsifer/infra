# Two Services, so the Gateway can reach only the public port and the tailnet
# Ingress only the admin port.
apiVersion: v1
kind: Service
metadata:
  name: talos-enroll
  namespace: talos-enroll
  labels:
    app.kubernetes.io/name: talos-enroll
    app.kubernetes.io/part-of: talos-enroll
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: talos-enroll
---
apiVersion: v1
kind: Service
metadata:
  name: talos-enroll-admin
  namespace: talos-enroll
  labels:
    app.kubernetes.io/part-of: talos-enroll
spec:
  ports:
    - name: admin
      port: 8081
      targetPort: admin
  selector:
    app.kubernetes.io/name: talos-enroll
