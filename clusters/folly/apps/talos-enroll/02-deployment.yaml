apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-enroll
  namespace: talos-enroll
  labels:
    app.kubernetes.io/name: talos-enroll
    app.kubernetes.io/part-of: talos-enroll
spec:
  # Enrollments live in memory: one pod, and never two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-enroll
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-enroll
        app.kubernetes.io/part-of: talos-enroll
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: talos-enroll
          image: ghcr.io/jonpulsifer/talos-enroll:latest@sha256:e34f14af7014f4acbb526276ba389d3aa75967b891be75eb22564c68a3cdeb32
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP
          env:
            - name: ENROLL_MACHINE_INPUTS
              value: /etc/talos-enroll/machine-inputs.json
            - name: ENROLL_NODE_MACS
              value: /etc/talos-enroll/node-macs.json
            - name: ENROLL_SECRETS_BUNDLE
              value: /var/run/secrets/talos-enroll/bundle/secrets.yaml
            - name: ENROLL_DISCORD_WEBHOOK_FILE
              value: /var/run/secrets/talos-enroll/discord/webhook-url
            # Tailnet logins that may approve and deny.
            - name: ENROLL_APPROVERS
              value: jonathan@pulsifer.ca
            # The tailnet Ingress in 05-tailnet-ingress.yaml.
            - name: ENROLL_ADMIN_URL
              value: https://talos-enroll.pirate-musical.ts.net
            # talosctl writes its patch files and nothing else here.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: inputs
              mountPath: /etc/talos-enroll
              readOnly: true
            - name: bundle
              mountPath: /var/run/secrets/talos-enroll/bundle
              readOnly: true
            - name: discord
              mountPath: /var/run/secrets/talos-enroll/discord
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: inputs
          configMap:
            name: talos-enroll-inputs
        - name: bundle
          secret:
            secretName: talos-enroll-bundle
            defaultMode: 0440
        - name: discord
          secret:
            secretName: talos-enroll-discord
            defaultMode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
