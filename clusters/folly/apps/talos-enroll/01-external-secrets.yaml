# folly's Talos secrets bundle, the note the clusters/folly/talos root reads. It
# holds every cluster CA key, so only the talos-enroll pod mounts it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-enroll-bundle
  namespace: talos-enroll
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: talos-enroll-bundle
    creationPolicy: Owner
  data:
    - secretKey: secrets.yaml
      remoteRef:
        # talos-folly-secrets, by id, as secrets_item_uuid in clusters/folly/talos/talos.tf.
        key: a3jq5rtwm4b22eeht7jg6idtli
        property: notesPlain
---
# The webhook Alertmanager's Discord receiver posts to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-enroll-discord
  namespace: talos-enroll
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: talos-enroll-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        # The item clusters/base/monitoring/alertmanager-discord.yaml reads.
        key: aujvxijpz3oi25ccfdynev5sb4
        property: password
