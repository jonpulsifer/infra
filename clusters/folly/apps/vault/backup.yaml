---
# The OpenBao data volume, read-only, from the node its local-path volume
# lives on, as the uid OpenBao writes it with. This is a best-effort copy: the
# raft and bbolt files are read while the server writes them, so a snapshot
# can hold a torn page. A `bao operator raft snapshot` is the consistent form
# and needs a token this job does not have.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-backup
    app.kubernetes.io/part-of: openbao
    lolwtf.ca/backup: "true"
spec:
  schedule: "40 3 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-backup
            app.kubernetes.io/part-of: openbao
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: openbao
                      app.kubernetes.io/instance: vault
                      component: server
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              args:
                - backup
                - --host=folly/vault/data-vault-openbao-0
                - --tag=kind=pvc
                - --retry-lock=30m
                - /data
              envFrom:
                - configMapRef:
                    name: restic
                - secretRef:
                    name: restic
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/cache
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-vault-openbao-0
                readOnly: true
            - name: tmp
              emptyDir: {}
