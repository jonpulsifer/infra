---
# The SPIRE server's X.509 bundle, which an agent trusts for its first
# attestation. spore's `k8sbundle` notifier owns `data` and rewrites
# `bundle.crt` on every CA rotation, so Flux declares only the metadata: a
# `data` here would let Flux's server-side apply overwrite the notifier. An
# agent that has attested keeps the bundle in its data directory and follows
# the server's rotations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire
  labels:
    app.kubernetes.io/name: spire-agent
    app.kubernetes.io/part-of: spire
