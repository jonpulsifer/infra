---
# spire-devid-init renders agent.conf into the pod with one node attestor:
# tpm_devid.conf when the attest service serves the node an LDevID that checks
# out, else tpm.conf. It fills @DATA_DIR@ with /var/lib/spire-agent for the EK
# attestor and its tpm_devid subdirectory for the LDevID one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app.kubernetes.io/name: spire-agent
    app.kubernetes.io/part-of: spire
data:
  agent.conf: |
    agent {
      data_dir = "@DATA_DIR@"
      log_level = "INFO"
      server_address = "spore.lolwtf.ca"
      server_port = "8081"
      socket_path = "/run/spire/sockets/agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "lolwtf.ca"
    }

    plugins {
      @NODE_ATTESTOR@

      KeyManager "disk" {
        plugin_data {
          directory = "@DATA_DIR@"
        }
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          node_name_env = "MY_NODE_NAME"
          skip_kubelet_verification = true
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "9982"
      live_path = "/live"
      ready_path = "/ready"
    }
  # The boxboat plugin: the TPM's EK hash, on spore's allow list.
  tpm.conf: |
    NodeAttestor "tpm" {
      plugin_cmd = "/opt/spire/plugins/tpm_attestor_agent"
      plugin_data {}
    }
  # SPIRE's own plugin. It loads the LDevID key under a fresh SRK from the TCG
  # H-1 or H-2 template, so the blobs must be wrapped by that SRK.
  tpm_devid.conf: |
    NodeAttestor "tpm_devid" {
      plugin_data {
        tpm_device_path = "/dev/tpmrm0"
        devid_cert_path = "/run/spire/devid/devid.crt.pem"
        devid_pub_path = "/run/spire/devid/devid.pub.blob"
        devid_priv_path = "/run/spire/devid/devid.priv.blob"
      }
    }
---
# The attest service's base URL for GET /devid/<serial>. Empty keeps every
# agent on the EK attestor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-attest
  namespace: spire
  labels:
    app.kubernetes.io/name: spire-agent
    app.kubernetes.io/part-of: spire
data:
  ATTEST_URL: ""
