---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: default
      sectionName: https-wildcard
  hostnames:
    - "oauth2.${SECRET_DOMAIN}"
  rules:
    # Every path: a browser can land here on an App's path, which the proxy
    # answers and Envoy would 404. The proxy's only upstream is static://200.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy
          port: 80
