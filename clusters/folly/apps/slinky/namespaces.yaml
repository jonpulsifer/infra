---
# The operator and its webhook.
apiVersion: v1
kind: Namespace
metadata:
  name: slinky
  labels:
    kustomize.toolkit.fluxcd.io/prune: enabled
---
# The Slurm cluster: slurmctld, slurmrestd, the login pod and the slurmd
# workers. slurmd confines each job step in a cgroup of its own, which the
# baseline profile refuses.
apiVersion: v1
kind: Namespace
metadata:
  name: slurm
  labels:
    kustomize.toolkit.fluxcd.io/prune: enabled
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
