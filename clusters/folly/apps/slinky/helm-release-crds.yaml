---
# The slinky.slurm.net CRDs: Controller, NodeSet, LoginSet, RestApi,
# Accounting and Token. Their own release, so an operator upgrade cannot
# drop them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slurm-operator-crds
  namespace: slinky
  labels:
    source.toolkit.fluxcd.io/kind: OCIRepository
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: slurm-operator-crds
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
