---
# folly egress. Three destinations: the carrier, the troll agent at ElevenLabs,
# and the handset on the LAN.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pbx-egress
  namespace: pbx
  labels:
    app.kubernetes.io/name: pbx
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pbx
  egress:
    # toFQDNs below is enforced by Cilium's DNS proxy, which only sees lookups
    # this rule routes through it. Without the matchPattern the carrier's name
    # never resolves to an allowed identity and every REGISTER fails closed.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*.voip.ms"
              - matchPattern: voip.ms
              # `*` matches one DNS label and `**.` any number. The trunk's host
              # is sip.rtc.elevenlabs.io, and a follow-up request goes to a
              # Contact host under hosts.rtc.elevenlabs.io.
              - matchPattern: "**.rtc.elevenlabs.io"
    - toFQDNs:
        - matchPattern: "*.voip.ms"
        - matchName: voip.ms
      toPorts:
        - ports:
            # TLS signalling, which the trunk uses.
            - {port: "5061", protocol: TCP}
            # Plain SIP. Nothing on this site uses it now; it stays as the
            # fallback while TLS proves itself, and goes when it has.
            - {port: "5060", protocol: UDP}
            - {port: "5060", protocol: TCP}
    # The troll trunk, TLS only. rewrite_contact in pjsip.conf sends a call's
    # ACK and BYE back down the connection this pod opened. ElevenLabs
    # documents follow-up requests to a Contact host under
    # hosts.rtc.elevenlabs.io, so that is admitted too, with `**.` because how
    # many labels it has is theirs to choose.
    - toFQDNs:
        - matchName: sip.rtc.elevenlabs.io
        - matchPattern: "**.hosts.rtc.elevenlabs.io"
      toPorts:
        - ports:
            - {port: "5061", protocol: TCP}
    # RTP to the carrier cannot be an FQDN rule and this is the honest reason:
    # the media address arrives in an SDP body, from a host this pod never
    # looked up. A toFQDNs egress rule permits the signalling and then silently
    # drops every audio packet — a call that connects and carries silence.
    #
    # ElevenLabs sends media from ports anywhere in 10000-60000, wider than
    # voip.ms. rtp.conf still pins this pod's own sockets to 10000-20000, so
    # this widens only the far end's port.
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "10000", endPort: 60000, protocol: UDP}
    # The handset. She is a LAN host, not a cluster endpoint, so she is `world`
    # to Cilium even though the packets never leave the building.
    #
    # Lines 1-3 share SIP port 5060 on the handset and line 4 has its own,
    # 5063; the PBX rings all four.
    #
    # The range is the phone's own RTP window, read off its running config
    # (RTP_Port_Min/Max). Omit it and the call sets up and is silent in one
    # direction.
    - toCIDR: ["${CATHY_IP}/32"]
      toPorts:
        - ports:
            - {port: "5060", protocol: UDP}
            - {port: "5063", protocol: UDP}
            - {port: "16384", endPort: 16538, protocol: UDP}
  # The base policy names ingress rules, which makes ingress default-deny for
  # this endpoint — so without this the handset's REGISTER is dropped and the
  # only symptom is an endpoint that never comes online.
  ingress:
    - fromCIDR: ["${CATHY_IP}/32"]
      toPorts:
        - ports:
            # SIP signalling and the media Asterisk receives.
            - {port: "5060", protocol: UDP}
            - {port: "10000", endPort: 20000, protocol: UDP}
            # The provisioning profile the phone resyncs against.
            - {port: "8080", protocol: TCP}
