---
# folly egress. Two destinations: the carrier, and the handset on the LAN.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pbx-egress
  namespace: pbx
  labels:
    app.kubernetes.io/name: pbx
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pbx
  egress:
    # toFQDNs below is enforced by Cilium's DNS proxy, which only sees lookups
    # this rule routes through it. Without the matchPattern the carrier's name
    # never resolves to an allowed identity and every REGISTER fails closed.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*.voip.ms"
              - matchPattern: voip.ms
    - toFQDNs:
        - matchPattern: "*.voip.ms"
        - matchName: voip.ms
      toPorts:
        - ports:
            - {port: "5060", protocol: UDP}
            - {port: "5060", protocol: TCP}
    # RTP to the carrier cannot be an FQDN rule and this is the honest reason:
    # the media address arrives in an SDP body, from a host this pod never
    # looked up. A toFQDNs egress rule permits the signalling and then silently
    # drops every audio packet — a call that connects and carries silence.
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "10000", endPort: 20000, protocol: UDP}
    # The handset. She is a LAN host, not a cluster endpoint, so she is `world`
    # to Cilium even though the packets never leave the building.
    #
    # 5063 rather than 5060: lines 1-3 share 5060 and line 4 has always had its
    # own port. Sending to 5060 would reach the lines still registered straight
    # to voip.ms.
    #
    # The second range is the phone's own RTP window, read off its running
    # config (RTP_Port_Min/Max). Omit it and the call sets up and is silent in
    # one direction.
    - toCIDR: ["${CATHY_IP}/32"]
      toPorts:
        - ports:
            - {port: "5063", protocol: UDP}
            - {port: "16384", endPort: 16538, protocol: UDP}
  # The base policy names ingress rules, which makes ingress default-deny for
  # this endpoint — so without this the handset's REGISTER is dropped and the
  # only symptom is an endpoint that never comes online.
  ingress:
    - fromCIDR: ["${CATHY_IP}/32"]
      toPorts:
        - ports:
            # SIP signalling and the media Asterisk receives.
            - {port: "5060", protocol: UDP}
            - {port: "10000", endPort: 20000, protocol: UDP}
            # The provisioning profile the phone resyncs against.
            - {port: "8080", protocol: TCP}
