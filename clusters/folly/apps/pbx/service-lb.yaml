---
# The address cathy's second line registers to. Pinned rather than assigned,
# because the far end of this Service is a desk phone whose config is edited by
# hand — an address that moves on reschedule is a phone that silently stops
# registering.
#
# .100 is inside folly's LB pool (10.3.0.64/26) and well clear of the
# sequential allocations, which as of writing reach .84. The value itself lives
# in cluster-settings, because the provisioning profile has to name the same
# address and a phone that resyncs against the wrong one goes quiet.
apiVersion: v1
kind: Service
metadata:
  name: pbx-sip
  namespace: pbx
  labels:
    app.kubernetes.io/name: pbx
  annotations:
    io.cilium/lb-ipam-ips: ${PBX_SIP_VIP}
spec:
  type: LoadBalancer
  # Load-bearing, not a tuning knob. Cilium runs in SNAT mode here
  # (bpf-lb-mode unset, masquerade on), so under the default `Cluster` policy
  # the handset's source address is rewritten to the node's before the packet
  # reaches Asterisk.
  #
  # Two things key on that address and both would fail silently. The handset's
  # lines carry no password: pjsip.conf identifies each by its username and
  # admits it only from CATHY_IP, through the lines' permit ACL. The
  # CiliumNetworkPolicy admits SIP and the provisioning fetch `fromCIDR` the
  # same host. Seen as 10.3.0.x, the REGISTER is dropped by the policy, and
  # the ACL would refuse it if it were not.
  #
  # `Local` keeps the client address. The cost is that only a node running the
  # pod answers the VIP, which is what Cilium already announces over BGP, and
  # with one replica there is nothing to spread anyway.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: pbx
  ports:
    - {name: sip-udp, port: 5060, targetPort: sip-udp, protocol: UDP}
    - {name: sip-tcp, port: 5060, targetPort: sip-tcp, protocol: TCP}
    # The provisioning profile. Same address as the SIP service on purpose —
    # the phone has one address for the PBX, not two.
    - {name: provision, port: 80, targetPort: provision, protocol: TCP}
