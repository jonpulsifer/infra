; The toys the handset codes in handset-codes.conf reach. Only the handset
; reaches this context, which is why it may spy; nothing a caller reaches may.
[toybox]
exten => _[a-z].,1,Gosub(pbx-event,s,1(toy,toy=${EXTEN}))
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,Answer()
 same => n,Goto(${EXTEN},10)

exten => echo,10,Playback(demo-echotest)
 same => n,Echo()

; TIMEZONE in clusters/base/cluster-settings.yaml as a POSIX rule: the image has
; no zoneinfo, so a zone name reads as UTC, and a rule without its DST dates
; gets the US rule of 1987 to 2006. The escaped commas keep it one argument.
exten => clock,10,Playback(at-tone-time-exactly)
 same => n,SayUnixTime(,AST4ADT\,M3.2.0\,M11.1.0,IMp)
 same => n,Playback(beep)
 same => n,Hangup()

exten => morse,10,Morsecode(what hath god wrought)
 same => n,Hangup()

exten => milliwatt,10,Milliwatt()

exten => monkeys,10,Playback(tt-monkeys)
 same => n,Hangup()

; Listen only: q announces nothing, S stops when nobody is left, and no option
; lets the handset speak into the call.
exten => listen,10,GotoIf($[${GROUP_COUNT(spam)} + ${GROUP_COUNT(troll)} = 0]?nobody)
 same => n,ChanSpy(,qSg(spam:troll))
 same => n,Hangup()
 same => n(nobody),Playback(beeperr)
 same => n,Hangup()

exten => eaten,10,ExecIf($["${EATEN}" = ""]?Set(GLOBAL(EATEN)=0))
 same => n,Playback(beep)
 same => n,SayNumber(${EATEN})
 same => n,Hangup()

exten => lenny,10,Goto(spam,lenny,1)

exten => queue,10,Goto(spam,queue,1)

; Earl, the troll agent, told it is the owner showing him off. An error tone
; if the agent does not take the call.
exten => earl,10,Goto(agent,desk,1)
