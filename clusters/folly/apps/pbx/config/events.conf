; One NOTICE line per notable call event. Dashboards and the Smiirl count read
; these lines from VictoriaLogs, so their shape is a contract:
;
;   pbx-event kind=<kind> line=<lineN> caller=<digits> [key=value ...]
;
; Gosub(pbx-event,s,1(<kind>[,<key=value ...>])). kind comes first, and no
; value holds a space. caller is FILTERed to digits, so a caller ID can never
; add a key of its own. line is the handset line: HANDSET on an inbound call,
; the endpoint itself on a call from the handset.
[pbx-event]
exten => s,1,Set(LOCAL(line)=${HANDSET})
 same => n,GotoIf($["${line}" != ""]?log)
 same => n,Set(LOCAL(line)=${CHANNEL(endpoint)})
 same => n(log),Set(LOCAL(event)=pbx-event kind=${ARG1} line=${line} caller=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($["${ARG2}" != ""]?Set(LOCAL(event)=${event} ${ARG2}))
 same => n,Log(NOTICE,${event})
 same => n,Return()
