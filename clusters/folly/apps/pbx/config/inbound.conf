; Inbound from the carrier.
;
; `s` is the real handler, and it has to be. A DID routed to a voip.ms
; sub-account arrives addressed to `s`, not to the number dialled — the digits
; are simply not in the request URI. A dialplan with only a digit pattern
; rejects the call outright:
;
;   Call (UDP:...) to extension 's' rejected because extension not found
;
; The digit pattern stays for a DID pointed here by number rather than by
; sub-account, and sends it to the same place.

; CONTACT_<ten digits>=<name>, rendered from 1Password by the pbx-contacts
; ExternalSecret. Absent until that item exists.
[globals]
#tryinclude "/etc/pbx-contacts/contacts.conf"

[from-voipms]
exten => _X.,1,Goto(s,1)

; Contacts ring through. So does every call on a line without SCREEN=yes, and a
; call on a screened line within an hour of a 911 from the handset. Anyone else
; on a screened line is answered and asked to press 5; the rest go to [spam].
; voip.ms sends the caller as ten digits; CALLER folds a leading 1 to match.
exten => s,1,NoOp(inbound ${CALLERID(num)} on ${CHANNEL(endpoint)} -> ${HANDSET})
 same => n,Set(CALLER=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($[${LEN(${CALLER})} = 11 & "${CALLER:0:1}" = "1"]?Set(CALLER=${CALLER:1}))
 same => n,Gosub(pbx-event,s,1(inbound))
 same => n,Set(CONTACT=${CONTACT_${CALLER}})
 same => n,GotoIf($["${CONTACT}" != ""]?contact,1)
 same => n,GotoIf($["${SCREEN}" != "yes"]?ring,1)
 same => n,GotoIf($[${EPOCH} - ${IF($["${LAST911}" = ""]?0:${LAST911})} < 3600]?ring,1)
 ; Checked before Answer(): a caller over the cap is refused unanswered, so a
 ; flood bills nothing and leaves the uplink to the calls that matter.
 same => n,GotoIf($[${GROUP_COUNT(${HANDSET}@screen)} >= 2]?busy,1)
 same => n,Set(GROUP(screen)=${HANDSET})
 same => n,Answer(500)
 same => n,Read(DIGIT,/var/lib/pbx-sounds/captcha-greeting,1,,1,6)
 same => n,GotoIf($["${DIGIT}" = "5"]?human,1)
 same => n,Read(DIGIT,/var/lib/pbx-sounds/captcha-retry,1,,1,6)
 same => n,GotoIf($["${DIGIT}" = "5"]?human,1)
 same => n,Set(GROUP(screen)=)
 same => n,Gosub(pbx-event,s,1(screened))
 same => n,Goto(spam,s,1)

exten => contact,1,Gosub(pbx-event,s,1(contact))
 same => n,Goto(ring,1)

; Answered already, so the caller hears hold music while the handset rings.
exten => human,1,Set(GROUP(screen)=)
 same => n,Gosub(pbx-event,s,1(captcha-pass))
 same => n,Dial(PJSIP/${HANDSET},25,m)
 same => n,NoOp(unanswered: ${DIALSTATUS})
 same => n,Hangup()

exten => ring,1,Dial(PJSIP/${HANDSET},25)
 same => n,NoOp(unanswered: ${DIALSTATUS})
 same => n,Hangup()

exten => busy,1,NoOp(${HANDSET} is already screening its limit of callers)
 same => n,Hangup(17)
