; Inbound from the carrier.
;
; `s` is the real handler, and it has to be. A DID routed to a voip.ms
; sub-account arrives addressed to `s`, not to the number dialled — the digits
; are simply not in the request URI. A dialplan with only a digit pattern
; rejects the call outright:
;
;   Call (UDP:...) to extension 's' rejected because extension not found
;
; The digit pattern stays for a DID pointed here by number rather than by
; sub-account, and sends it to the same place.
[from-voipms]
exten => _X.,1,Goto(s,1)

exten => s,1,NoOp(inbound ${CALLERID(num)} on ${CHANNEL(endpoint)} -> ${HANDSET})
 same => n,Gosub(pbx-event,s,1(inbound))
 same => n,Dial(PJSIP/${HANDSET},25)
 same => n,NoOp(unanswered: ${DIALSTATUS})
 same => n,Hangup()
