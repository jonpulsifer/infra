; Where callers who fail the press-5 screen wait. `s` admits one into the spam
; group and picks a sink at random; each sink loops until the caller hangs up
; or TIMEOUT ends the call at ten minutes.
[spam]
exten => s,1,Set(TIMEOUT(absolute)=600)
 ; Each held call is an answered minute on the carrier's bill.
 same => n,GotoIf($[${GROUP_COUNT(spam)} >= 3]?full,1)
 same => n,Set(GROUP()=spam)
 ; Counted once admitted, so a caller the cap refuses is not an eaten one.
 same => n,ExecIf($["${EATEN}" = ""]?Set(GLOBAL(EATEN)=0))
 same => n,Set(GLOBAL(EATEN)=$[${EATEN} + 1])
 same => n,Set(SPYGROUP=spam)
 same => n,Set(SINK_START=${EPOCH})
 same => n,Set(SINK=${IF($[${RAND(0,1)}]?lenny:queue)})
 same => n,Set(CHANNEL(hangup_handler_push)=spam-held,s,1)
 same => n,GotoIf($["${SINK}" = "lenny"]?to-lenny)
 same => n,Gosub(pbx-event,s,1(queued))
 same => n,Goto(queue,1)
 same => n(to-lenny),Gosub(pbx-event,s,1(lenny))
 same => n,Goto(lenny,1)

exten => full,1,Playback(/var/lib/pbx-sounds/goodbye)
 same => n,Hangup()

; The Endless Queue: every line in turn, with hold music between.
exten => queue,1,Playback(/var/lib/pbx-sounds/queue-caller-eleven)
 same => n,MusicOnHold(default,20)
 same => n,Playback(/var/lib/pbx-sounds/queue-wait-time)
 same => n,MusicOnHold(default,25)
 same => n,Playback(/var/lib/pbx-sounds/queue-monitored)
 same => n,MusicOnHold(default,20)
 same => n,Playback(/var/lib/pbx-sounds/queue-moved-up)
 same => n,MusicOnHold(default,30)
 same => n,Playback(/var/lib/pbx-sounds/queue-agents-busy)
 same => n,MusicOnHold(default,20)
 same => n,Playback(/var/lib/pbx-sounds/queue-music)
 same => n,MusicOnHold(default,25)
 same => n,Playback(/var/lib/pbx-sounds/queue-thinking)
 same => n,MusicOnHold(default,20)
 same => n,Playback(/var/lib/pbx-sounds/queue-faster)
 same => n,MusicOnHold(default,30)
 same => n,Playback(/var/lib/pbx-sounds/queue-skip)
 same => n,MusicOnHold(default,20)
 same => n,Playback(/var/lib/pbx-sounds/queue-doing-great)
 same => n,MusicOnHold(default,25)
 same => n,Goto(queue,1)

; Robo-Lenny: a clip, then wait for the caller to stop talking, forever.
exten => lenny,1,Playback(/var/lib/pbx-sounds/lenny-hello)
 same => n,WaitForSilence(1500,1,10)
 same => n(loop),Playback(/var/lib/pbx-sounds/lenny-yes)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-who)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-interesting)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-daughter)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-ducks)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-again)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-how-much)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-pen)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-sounds-good)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-quiet)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-last-fellow)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-kettle)
 same => n,WaitForSilence(1500,1,10)
 same => n,Playback(/var/lib/pbx-sounds/lenny-still-here)
 same => n,WaitForSilence(1500,1,10)
 same => n,Goto(loop)

; A hangup handler: logs how long the sink held the caller.
[spam-held]
exten => s,1,Gosub(pbx-event,s,1(held,secs=$[${EPOCH} - ${SINK_START}],sink=${SINK}))
 same => n,Return()
