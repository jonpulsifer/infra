; folly: the handset site. Four trunks out to voip.ms, one per line of the office
; SPA504G, and the four lines in. The phone talks only to this PBX and holds no
; voip.ms credential at all.
;
; ${PBX_*} is rendered by render.sh before Asterisk ever reads this file.
; Everything else in ${...} here is Asterisk's own and is left alone — see the
; comment in render.sh for why that distinction is load-bearing.

[global]
type = global
; Log every SIP message, sent and received, to the console — which is the pod's
; stdout, which Vector ships to VictoriaLogs. Every failed call so far was
; diagnosed from the carrier's own SIP; having it only when someone remembers
; `pjsip set logger` means the call that mattered is the one not captured.
; The SRTP keys and digest responses in these lines are redacted by Vector
; before they are stored (clusters/base/monitoring/vector.yaml).
debug = yes
user_agent = folly-pbx

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; No external_signaling_address or external_media_address, and that is not an
; omission. folly is behind CGNAT: there is no address this process could
; advertise that anything on the internet could send to. The trunks work
; because they are outbound-initiated and the far end returns media to the
; source it actually observed — which is what rtp_symmetric below asks for.

[transport-tls]
type = transport
protocol = tls
; A listener PJSIP needs in order to originate TLS at all. Nothing dials in on
; it: no Service publishes 5061 and the ingress policy does not admit it.
bind = 0.0.0.0:5061
method = tlsv1_2
; The Mozilla bundle nixpkgs' cacert puts in the image. voip.ms presents a
; Let's Encrypt certificate whose SANs cover every numbered server, and
; verification against exactly this bundle was proven before it landed.
ca_list_file = /etc/ssl/certs/ca-bundle.crt
verify_server = yes

; ── voip.ms trunks ────────────────────────────────────────────────────────
; One per line, because each line is its own voip.ms sub-account: its own DID,
; its own caller ID, and on `recorded` its own call recording. A shared trunk
; would dial every line out as whichever account it held.
;
; The REGISTER is what makes inbound calls possible at all. It opens the NAT
; pinhole from the inside; voip.ms delivers calls back down it. Nothing about
; this needs a public address, which is the whole reason a PBX is viable here.
;
; A sub-account that starts dialling out from somewhere new can be held by
; voip.ms's fraud protection. It looks exactly like a config fault — a bare 503
; after 100 Trying — and is fixed on their side, not here. See the runbook.

[trunk-registration](!)
type = registration
; TLS, so the SDES keys in every SDP stop crossing the internet in the clear.
; The connection this opens is also the one voip.ms delivers inbound calls
; down; PJSIP's default keep_alive_interval (90s) holds the CGNAT mapping open.
transport = transport-tls
; The escaped semicolon is required: bare, it starts a comment and silently
; drops the transport parameter.
server_uri = sip:${PBX_VOIPMS_SERVER}:5061\;transport=tls
; Well inside any reasonable NAT timeout. A pinhole that closes between
; registrations is an inbound call that never arrives and no error anywhere.
expiration = 300
retry_interval = 60
; A wrong password retried every 60s is how an account gets blocked. Back off.
forbidden_retry_interval = 600
; Ties a call voip.ms sends to the registered contact back to this
; registration's endpoint: the contact carries a `line` parameter, and the call
; comes back with it. This is one of the two forms voip.ms delivers a call in;
; [trunk-identify] below catches the other.
line = yes

[trunk](!)
type = endpoint
transport = transport-tls
context = from-voipms
; PJSIP's default is `username,ip`. `header` names the X-Dest-User match in
; [trunk-identify], and `ip` goes because no identify matches by address: all
; four trunks share voip.ms's servers, so an address cannot tell them apart.
; Asterisk 22 reads this list only in its username and auth_username
; identifiers; the header identifier runs whatever it says. So `header` here
; records how a trunk is found and turns nothing on. The identifies do.
identify_by = username,header
; Every sub-account offers G.722 over SRTP (RTP/SAVP, SDES) and nothing else —
; captured from real INVITEs. g722 first so calls bridge to the handset without
; transcoding; ulaw as the fallback for a sub-account set differently.
disallow = all
allow = g722
allow = ulaw
; Strict SAVP, not optimistic: it is the one offer voip.ms is proven to accept.
media_encryption = sdes
media_encryption_optimistic = no
aors = voipms
from_domain = ${PBX_VOIPMS_SERVER}
; Media through Asterisk, not handset-to-carrier directly.
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[voipms]
type = aor
contact = sip:${PBX_VOIPMS_SERVER}:5061\;transport=tls
qualify_frequency = 60

; voip.ms delivers an inbound call in one of two forms, and which one arrives
; is set on voip.ms's side for each sub-account, not in this file:
;
;   - to the registered contact, addressed to `s`, with the registration's
;     `line` parameter. `line = yes` in [trunk-registration] matches it.
;   - to the DID's own digits at the public address the connection comes from,
;     with no `line` parameter and an `X-Dest-User` header that names the
;     sub-account. Only an identify on that header matches it.
;
; The form can change while every registration stays green. A form this file
; does not match fails as "No matching endpoint found", and the caller hears
; that the call cannot be completed. So every trunk matches both forms.
;
; The value is an exact match, not a regex. Anyone can write a header, and a
; trunk challenges nothing inbound, so what keeps a forged one out is who can
; reach this listener at all: voip.ms, down the connection a trunk opened, and
; the handset's address (network-policy.yaml). The handset's own lines match by
; username, which runs before the header identifier, so the handset's calls
; never land on a trunk.
[trunk-identify](!)
type = identify

; Each trunk names the line it rings (HANDSET); each line names the trunk it
; dials out on (TRUNK). The dialplan reads those, so it has no per-line branch.

[vms-cathy](trunk-registration)
client_uri = sip:168847_cathy@${PBX_VOIPMS_SERVER}
outbound_auth = vms-cathy
endpoint = vms-cathy
[vms-cathy](trunk)
outbound_auth = vms-cathy
from_user = 168847_cathy
set_var = HANDSET=line1
[vms-cathy](trunk-identify)
endpoint = vms-cathy
match_header = X-Dest-User: 168847_cathy
[vms-cathy]
type = auth
auth_type = userpass
username = 168847_cathy
password = ${PBX_VOIPMS_PASS_CATHY}

[vms-recorded](trunk-registration)
client_uri = sip:168847_recorded@${PBX_VOIPMS_SERVER}
outbound_auth = vms-recorded
endpoint = vms-recorded
[vms-recorded](trunk)
outbound_auth = vms-recorded
from_user = 168847_recorded
set_var = HANDSET=line2
[vms-recorded](trunk-identify)
endpoint = vms-recorded
match_header = X-Dest-User: 168847_recorded
[vms-recorded]
type = auth
auth_type = userpass
username = 168847_recorded
password = ${PBX_VOIPMS_PASS_RECORDED}

[vms-sandbox](trunk-registration)
client_uri = sip:168847_sandbox@${PBX_VOIPMS_SERVER}
outbound_auth = vms-sandbox
endpoint = vms-sandbox
[vms-sandbox](trunk)
outbound_auth = vms-sandbox
from_user = 168847_sandbox
set_var = HANDSET=line3
[vms-sandbox](trunk-identify)
endpoint = vms-sandbox
match_header = X-Dest-User: 168847_sandbox
[vms-sandbox]
type = auth
auth_type = userpass
username = 168847_sandbox
password = ${PBX_VOIPMS_PASS_SANDBOX}

[vms-1994](trunk-registration)
client_uri = sip:168847_1994@${PBX_VOIPMS_SERVER}
outbound_auth = vms-1994
endpoint = vms-1994
[vms-1994](trunk)
outbound_auth = vms-1994
from_user = 168847_1994
set_var = HANDSET=line4
; The one screened line: inbound.conf asks its unknown callers to press 5.
; Never line 1's trunk: the handset dials 911 on line 1, and 911 calls back there.
set_var = SCREEN=yes
[vms-1994](trunk-identify)
endpoint = vms-1994
match_header = X-Dest-User: 168847_1994
[vms-1994]
type = auth
auth_type = userpass
username = 168847_1994
password = ${PBX_VOIPMS_PASS_1994}

; ── the handset: lines 1-4 of the office SPA504G ─────────────────────────
; No auth sections, deliberately: a password would have to be provisioned to
; the phone over the LAN in cleartext. Two things stand in for it.
;
; Identity is the username. All four lines come from the same address, so an
; address match cannot tell them apart; each line registers as lineN and
; PJSIP's `username` identifier maps that to the endpoint of the same name.
;
; Authorization is the address. Each endpoint admits requests only from the
; handset's reserved IP — which Kubernetes preserves because the VIP's
; externalTrafficPolicy is Local — so anything else claiming to be line1 is
; refused, a carrier INVITE with a forged From user included. The NetworkPolicy
; and the UniFi Lab -> Internal policy both name that same single host.

[handset](!)
type = endpoint
context = from-handset
disallow = all
allow = g722
allow = ulaw
; The handset offers SRTP on every call it places (`Secure_Call_Setting` is
; phone-wide). Optimistic so inbound offers plain RTP with crypto attached
; rather than insisting on RTP/SAVP; the phone takes either.
media_encryption = sdes
media_encryption_optimistic = yes
deny = 0.0.0.0/0.0.0.0
permit = ${PBX_CATHY_IP}/255.255.255.255
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[handset-aor](!)
type = aor
; One line on one phone. A second contact means the phone re-registered without
; unregistering, and ringing the stale one delays the real one.
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

[line1](handset)
aors = line1
set_var = TRUNK=vms-cathy
[line1](handset-aor)

[line2](handset)
aors = line2
set_var = TRUNK=vms-recorded
[line2](handset-aor)

[line3](handset)
aors = line3
set_var = TRUNK=vms-sandbox
[line3](handset-aor)

[line4](handset)
aors = line4
set_var = TRUNK=vms-1994
[line4](handset-aor)
