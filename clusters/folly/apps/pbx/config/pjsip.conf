; folly: the handset site. One trunk out to voip.ms, one handset in.
;
; ${PBX_*} is rendered by render.sh before Asterisk ever reads this file.
; Everything else in ${...} here is Asterisk's own and is left alone — see the
; comment in render.sh for why that distinction is load-bearing.

[global]
type = global
user_agent = folly-pbx

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; No external_signaling_address or external_media_address, and that is not an
; omission. folly is behind CGNAT: there is no address this process could
; advertise that anything on the internet could send to. Both trunks work
; because they are outbound-initiated and the far end returns media to the
; source it actually observed — which is what rtp_symmetric below asks for.

[transport-tls]
type = transport
protocol = tls
; A listener PJSIP needs in order to originate TLS at all. Nothing dials in on
; it: no Service publishes 5061 and the ingress policy does not admit it.
bind = 0.0.0.0:5061
method = tlsv1_2
; The Mozilla bundle nixpkgs' cacert puts in the image. voip.ms presents a
; Let's Encrypt certificate whose SANs cover every numbered server, and
; verification against exactly this bundle was proven before this landed.
ca_list_file = /etc/ssl/certs/ca-bundle.crt
verify_server = yes

; ── voip.ms trunk ─────────────────────────────────────────────────────────
; The REGISTER is what makes inbound calls possible at all. It opens the NAT
; pinhole from the inside; voip.ms delivers calls back down it. Nothing about
; this needs a public address, which is the whole reason a PBX is viable here.

[voipms]
type = registration
; TLS, so the SDES keys in every SDP stop crossing the internet in the clear —
; SRTP keyed over plain UDP only protects media from someone who cannot read
; the signalling. The connection this opens is also the one voip.ms delivers
; inbound calls down, so CGNAT is no more a problem for TCP than it was for
; UDP. PJSIP's default keep_alive_interval (90s) holds the mapping open.
transport = transport-tls
outbound_auth = voipms-auth
; The escaped semicolon is required: bare, it starts a comment and silently
; drops the transport parameter.
server_uri = sip:${PBX_VOIPMS_SERVER}:5061\;transport=tls
client_uri = sip:${PBX_VOIPMS_USER}@${PBX_VOIPMS_SERVER}
; Well inside any reasonable NAT timeout. A pinhole that closes between
; registrations is an inbound call that never arrives and no error anywhere.
expiration = 300
retry_interval = 60
; A wrong password retried every 60s is how an account gets blocked. Back off.
forbidden_retry_interval = 600
; Ties calls arriving on this registration to the endpoint below, so inbound
; does not depend on matching the carrier's source IP.
line = yes
endpoint = voipms

[voipms-auth]
type = auth
auth_type = userpass
username = ${PBX_VOIPMS_USER}
password = ${PBX_VOIPMS_PASS}

[voipms-aor]
type = aor
contact = sip:${PBX_VOIPMS_SERVER}:5061\;transport=tls
qualify_frequency = 60

[voipms]
type = endpoint
transport = transport-tls
context = from-voipms
disallow = all
; What voip.ms actually offers is set per sub-account in their portal, not
; negotiated from anything here. Captured from a real inbound INVITE:
;
;   m=audio 17126 RTP/SAVP 9 101
;   a=rtpmap:9 G722/8000
;   a=crypto:1 AES_CM_128_HMAC_SHA1_80 ...
;
; G.722 and nothing else, so a trunk that allowed only ulaw had no overlap and
; every call died in SDP negotiation with "Couldn't negotiate stream ...
; (nothing)" — after signalling had already worked end to end. g722 first
; because the handset prefers it too, and the call then bridges without
; transcoding; ulaw stays as the fallback for a sub-account set differently.
allow = g722
allow = ulaw
; RTP/SAVP in that same offer: the sub-account also requires SRTP, keyed by
; SDES in the SDP. Without this, allowing g722 alone still fails — the
; transport profile does not match. Optimistic so an outbound call offers SRTP
; but still completes if a sub-account answers in the clear.
;
; Note what this does and does not protect. The keys ride in the SDP, and the
; SDP rides over plain UDP signalling, so SRTP here defeats someone who sees
; only the media, not someone who can read the SIP. TLS to 5061 closes that;
; it is a change to the sub-account as much as to this file.
media_encryption = sdes
; Strict, not optimistic. This sub-account is known to require SRTP, and the
; one offer voip.ms is proven to accept is plain RTP/SAVP: the handset makes
; exactly that on lines 1-3 every day. An optimistic offer is RTP/AVP with
; crypto attached, which it has never been seen to accept.
media_encryption_optimistic = no
outbound_auth = voipms-auth
aors = voipms-aor
from_user = ${PBX_VOIPMS_USER}
from_domain = ${PBX_VOIPMS_SERVER}
; Media through Asterisk, not handset-to-carrier directly. direct_media would
; hand the carrier a 10.x address it cannot reach.
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

; ── cathy: line 4 of the SPA504G ──────────────────────────────────────────
; Lines 1-3 stay registered straight to voip.ms, so the phone keeps dial tone
; when this cluster does not. Only line 4 — the one already on its own proxy
; and its own SIP port, 5063 — points here.
;
; No auth section, deliberately. The endpoint is identified by source address
; instead: the handset holds a DHCP reservation, and the only path from the Lab
; zone to it is a firewall policy naming that one host. A password would have
; to be provisioned to the phone over the LAN in cleartext, which buys nothing
; that the address match does not already give.

[cathy]
type = endpoint
context = from-cathy
disallow = all
; g722 first — it is what the phone already prefers on every other line.
allow = g722
allow = ulaw
; The handset offers SRTP on every call it places. `Secure_Call_Setting` is a
; phone-wide switch, not a per-line one, and lines 1-3 need it on for voip.ms —
; so it stays on, and this side accepts it. Without this, dialling out from
; line 4 fails in SDP with "Couldn't negotiate stream ... (nothing)" and the
; handset shows 488 Not Acceptable Here, while inbound works: on inbound it is
; Asterisk that makes the offer, and it makes it in the clear.
;
; Optimistic so that inbound still offers plain RTP with crypto attached rather
; than insisting on RTP/SAVP — the handset may take either, and inbound already
; works.
media_encryption = sdes
media_encryption_optimistic = yes
aors = cathy
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

; Without this the unauthenticated REGISTER matches no endpoint and Asterisk
; rejects it. This is what makes the no-password arrangement work at all.
[cathy]
type = identify
endpoint = cathy
match = ${PBX_CATHY_IP}

[cathy]
type = aor
; One line on one phone. A second contact here means the phone re-registered
; without unregistering, and ringing the stale one delays the real one.
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
