; ARI, Asterisk's REST interface, for the Switchboard board
; (apps/switchboard with SWITCHBOARD_ROLE=board), which polls ARI's channel,
; bridge and endpoint lists. It shares the base http.conf listener on 8088,
; which the CiliumNetworkPolicies admit from the cluster's nodes, the
; monitoring namespace and the board's pod.
;
; `read_only` is weaker than it reads. It refuses every verb but GET, yet a GET
; of a channel variable runs any dialplan function the name spells, and SET()
; is one: the password alone can reroute a live call through a trunk, rewrite
; its caller ID or end it. Three things keep that from the board:
;   - pbx-ari, in switchboard.yaml, admits the board to the three lists and
;     /metrics by exact path, as GET, and refuses the rest;
;   - modules.conf refuses res_ari_events, whose events socket runs REST
;     requests sent over it, where no policy can see them;
;   - modules.conf refuses res_ari_asterisk, func_sorcery and func_config,
;     each of which returns a PJSIP auth object's fields, the trunk password
;     among them, to anyone who can name them.
[general]
enabled = yes
; Each channel in the list then carries these as of its last dialplan step, so
; the board reads a call's line, trunk, screen, contact, sink and pbx-event
; trail from the list itself. EATEN is a global, which a channel without its
; own reads through to. CHANNEL_VARS in apps/switchboard/src/board/model.ts is
; the same list, and a test holds the two in step.
channelvars = HANDSET,TRUNK,SCREEN,CONTACT,SINK,TRAIL,EATEN
; Empty: no browser talks to ARI. The board's page talks to the board.
allowed_origins =

; GET only: pbx-check fails a site whose ARI users can use another verb.
[switchboard]
type = user
read_only = yes
password_format = plain
password = ${PBX_ARI_PASSWORD}
