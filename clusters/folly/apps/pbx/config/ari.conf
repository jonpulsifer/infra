; ARI, Asterisk's REST interface, for the Switchboard board
; (apps/switchboard with SWITCHBOARD_ROLE=board): a read-only view of every
; call, line and IVR stage. It shares the base http.conf listener on 8088,
; which the CiliumNetworkPolicies admit from the cluster's nodes, the
; monitoring namespace and the board's pod alone.
;
; modules.conf refuses res_ari_asterisk, whose /ari/asterisk/config/dynamic
; hands any ARI user, a read-only one included, the trunk passwords.
[general]
enabled = yes
; Every channel event then carries these, so the board reads a call's line,
; trunk, screen, contact and sink from the event itself. TRACKED_VARS in
; apps/switchboard/src/board/model.ts is the same list.
channelvars = HANDSET,TRUNK,SCREEN,CONTACT,SINK
; Empty: no browser talks to ARI. The board's page talks to the board.
allowed_origins =

; GET and the events socket only. Every write verb answers 403, so the
; password can read the calls and cannot place, move or end one.
[switchboard]
type = user
read_only = yes
password_format = plain
password = ${PBX_ARI_PASSWORD}
