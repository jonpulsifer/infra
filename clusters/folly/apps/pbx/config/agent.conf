; The troll line: a screened caller talks to Earl, the ElevenLabs agent
; pbx-troll. Offsite answers first: this PBX hands the caller to voip.ms's
; elevenlabs sub-account with a SIP REFER and drops out of the call, so the
; caller's audio stops crossing Starlink. Earl over this PBX's own trunk in
; pjsip.conf is the fallback, and the sinks in spam.conf are the fallback to
; that, so a caller nobody takes is still held, never dropped.
;
; PBX_TROLL_EXTENSION is the voip.ms internal extension of 168847_elevenlabs,
; from pbx-env. Empty, it skips the REFER and this PBX keeps every call.
;
; PBX_AGENT_DID is the number ElevenLabs picks the agent by. Without the
; pbx-elevenlabs Secret it renders pbx-env's `off`, which has no digits, and
; every screened caller this PBX keeps goes to the sinks.
;
; AGENT_MODE reaches the agent as {{sip_pbx_mode}}: `troll` for a screened
; stranger, `desk` for the handset's *29.
[agent]
exten => s,1,Set(AGENT_MODE=troll)
 same => n,Goto(dial,1)

; [toybox] sends the handset here. No caller's path names this extension.
exten => desk,1,Set(AGENT_MODE=desk)
 same => n,Goto(dial,1)

; The agent takes two calls at once and twenty a day, the limits pbx-troll.json
; sets at ElevenLabs. The day's count is this PBX's own backstop, in case
; ElevenLabs does not hold a trunk call to its daily limit. It counts each call
; the agent answered here and each call handed to offsite, so it is checked
; before either; a restart clears it.
exten => dial,1,Set(AGENT_MISS=daily)
 same => n,GotoIf($["${TROLL_DAY}" = "${STRFTIME(,,%Y%m%d)}" & 0${TROLL_N} >= 20]?miss,1)
 ; A screened stranger goes to offsite first; the handset's *29 never does.
 ; The caller is answered, so Transfer() sends a REFER, not a 302, and waits:
 ; SUCCESS when voip.ms's NOTIFY reports a 2xx for the call it placed, and
 ; FAILURE with the SIP code in TRANSFERSTATUSPROTOCOL when voip.ms refuses
 ; the REFER or reports that call failed: 500 when voip.ms never answers, 1
 ; when Asterisk could not send the REFER or the subscription ends without a
 ; final status, and no code when Asterisk could not queue the transfer at
 ; all. UNSUPPORTED is a channel that is not SIP. Only SUCCESS ends this call
 ; here; anything else leaves it up for this PBX's own dial below.
 same => n,GotoIf($["${AGENT_MODE}" != "troll"]?here)
 same => n,GotoIf($["${PBX_TROLL_EXTENSION}" = ""]?here)
 same => n,Gosub(pbx-event,s,1(troll,mode=troll,site=offsite))
 ; No GROUP() holds a place for the call: it leaves this PBX, and offsite and
 ; ElevenLabs keep their own two-call caps. It counts toward the day's twenty
 ; once it ends during or after Transfer(): voip.ms's BYE can end it before
 ; the next line runs, so a hangup handler does the counting, and logs no
 ; held line. TIMEOUT(absolute) bounds the silence while voip.ms places the
 ; call: Earl answers in seconds, and `T` below takes a caller still waiting.
 same => n,Set(CHANNEL(hangup_handler_push)=agent-held,count,1)
 same => n,Set(TIMEOUT(absolute)=45)
 same => n,Transfer(sip:${PBX_TROLL_EXTENSION}@${PBX_VOIPMS_SERVER})
 ; The transferor's half of a REFER is to hang up.
 same => n(moved),ExecIf($["${TRANSFERSTATUS}" = "SUCCESS"]?Hangup())
 same => n,Set(TIMEOUT(absolute)=0)
 same => n,Set(CHANNEL(hangup_handler_pop)=)
 same => n,Gosub(pbx-event,s,1(troll-miss,site=offsite,why=${TRANSFERSTATUS}${IF($[${TRANSFERSTATUSPROTOCOL} > 0]?-${TRANSFERSTATUSPROTOCOL})}))
 ; A REFER challenged for credentials is sent again with vms-1994's by
 ; res_pjsip_session, after Transfer() has already given up on it. voip.ms may
 ; still take that one, so the caller goes to a sink, not to a second Earl.
 same => n,GotoIf($[${TRANSFERSTATUSPROTOCOL} = 401 | ${TRANSFERSTATUSPROTOCOL} = 407 | ${TRANSFERSTATUSPROTOCOL} = 494]?spam,s,1)
 ; GROUP() is set on the agent's leg, so a Dial that fails frees its place the
 ; moment it fails. kind=troll logs each hand-off, answered or not.
 same => n(here),Set(AGENT_MISS=off)
 same => n,GotoIf($["${FILTER(0-9,${PBX_AGENT_DID})}" = ""]?miss,1)
 same => n,Set(AGENT_MISS=full)
 same => n,GotoIf($[${GROUP_COUNT(troll)} >= 2]?miss,1)
 same => n,Gosub(pbx-event,s,1(troll,mode=${AGENT_MODE}))
 same => n,Set(SPYGROUP=troll)
 same => n,Set(SINK=${AGENT_MODE})
 same => n,Set(SINK_START=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=agent-held,s,1)
 ; S(600) ends an answered call at ten minutes, the agent's own limit too.
 same => n,Dial(PJSIP/${PBX_AGENT_DID}@elevenlabs,60,b(agent-leg^s^1(${AGENT_MODE}^${UNIQUEID}^${CALLER}))S(600))
 ; Dial returns only when the agent did not answer: an answered call ends
 ; with a hangup, and agent-held logs how long it lasted. The sinks push
 ; their own handler.
 same => n,Set(AGENT_MISS=${DIALSTATUS})
 same => n,Set(CHANNEL(hangup_handler_pop)=)
 same => n,Set(SPYGROUP=)
 same => n,Goto(miss,1)

; ElevenLabs refused, failed or did not answer, or the agent is off or full.
exten => miss,1,Gosub(pbx-event,s,1(troll-miss,mode=${AGENT_MODE},why=${AGENT_MISS}))
 same => n,GotoIf($["${AGENT_MODE}" != "troll"]?desk)
 same => n,Goto(spam,s,1)
 same => n(desk),Playback(beeperr)
 same => n,Hangup()

; TIMEOUT(absolute) ran out in Transfer(): voip.ms took the REFER and never
; reported on the call it placed. It may still move the caller, so the caller
; waits in a sink rather than on a second Earl. The desk demo carries
; toybox's ten-minute TIMEOUT here too, and ends as it always has.
exten => T,1,ExecIf($["${AGENT_MODE}" != "troll"]?Hangup())
 same => n,Set(CHANNEL(hangup_handler_pop)=)
 same => n,Gosub(pbx-event,s,1(troll-miss,site=offsite,why=timeout))
 same => n,Goto(spam,s,1)

; A hangup handler. Dial empties ANSWEREDTIME when it starts and sets it only
; when a bridged call ends, so a caller who hangs up while the agent's leg is
; still ringing logs nothing and is not counted. secs counts from the Dial,
; so it includes the few seconds the agent took to answer.
[agent-held]
exten => s,1,GotoIf($["${ANSWEREDTIME}" = ""]?done)
 same => n,Gosub(count,1)
 same => n,Gosub(pbx-event,s,1(held,secs=$[${EPOCH} - ${SINK_START}],sink=${SINK}))
 same => n(done),Return()

; Adds one to the day's count, GLOBAL(TROLL_N). [agent] pushes this alone as
; the hangup handler of a call it hands to offsite.
exten => count,1,Set(TROLL_TODAY=${STRFTIME(,,%Y%m%d)})
 same => n,ExecIf($["${TROLL_DAY}" != "${TROLL_TODAY}"]?Set(GLOBAL(TROLL_N)=0))
 same => n,Set(GLOBAL(TROLL_DAY)=${TROLL_TODAY})
 same => n,Set(GLOBAL(TROLL_N)=$[0${TROLL_N} + 1])
 same => n,Return()

; Dial()'s b() runs this on the agent's leg before its INVITE; PJSIP_HEADER in
; [agent] would land on the caller's leg. ElevenLabs reads X-Pbx-Mode as
; {{sip_pbx_mode}}, and X-Call-ID and X-Caller-ID as its system call id and
; caller id.
[agent-leg]
exten => s,1,Set(GROUP()=troll)
 same => n,Set(PJSIP_HEADER(add,X-Pbx-Mode)=${ARG1})
 same => n,Set(PJSIP_HEADER(add,X-Call-ID)=${ARG2})
 same => n,ExecIf($["${ARG3}" != ""]?Set(PJSIP_HEADER(add,X-Caller-ID)=${ARG3}))
 same => n,Return()

; ElevenLabs never calls in: this PBX is behind CGNAT and dials out only.
[from-elevenlabs]
exten => _X.,1,Hangup(21)
