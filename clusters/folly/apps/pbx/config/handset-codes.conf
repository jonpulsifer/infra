; Exact handset codes, read inside [from-handset], where an exact extension
; outranks the _[*0-9]! pattern. Every line's dial plan on the phone passes *xx
; at once, the phone claims no *2x code of its own, and voip.ms has none.
exten => *20,1,Goto(toybox,echo,1)
exten => *21,1,Goto(toybox,clock,1)
exten => *22,1,Goto(toybox,morse,1)
exten => *23,1,Goto(toybox,milliwatt,1)
exten => *24,1,Goto(toybox,monkeys,1)
exten => *25,1,Goto(toybox,listen,1)
exten => *26,1,Goto(toybox,eaten,1)
exten => *27,1,Goto(toybox,lenny,1)
exten => *28,1,Goto(toybox,queue,1)
exten => *29,1,Goto(toybox,earl,1)
