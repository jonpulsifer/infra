; folly dialplan. Deliberately thin: this site's job is to prove a handset can
; live behind the PBX, not to grow features nobody asked for yet.

[general]
static = yes
writeprotect = yes

; Inbound from the carrier. One destination today; when the office grows a
; second handset this becomes the ring group, which is why the Dial target is
; already its own line.
;
; `s` is the real handler, and it has to be. A DID routed to a voip.ms
; sub-account arrives addressed to `s`, not to the number dialled — the digits
; are simply not in the request URI. A dialplan with only a digit pattern
; rejects the call outright:
;
;   Call (UDP:...) to extension 's' rejected because extension not found
;
; The digit pattern stays for the case where a DID is pointed here by number
; rather than by sub-account, and sends it to the same place.
[from-voipms]
exten => _X.,1,Goto(s,1)

exten => s,1,NoOp(inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/cathy,25)
 same => n,NoOp(unanswered: ${DIALSTATUS})
 same => n,Hangup()

; Outbound from the handset. No digit manipulation — voip.ms wants what the
; phone's own dial plan already produced, and a rewrite here would be a second
; place to be wrong about North American dialling.
[from-cathy]
exten => _X.,1,NoOp(cathy -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@voipms,60)
 same => n,NoOp(outbound ended: ${DIALSTATUS})
 same => n,Hangup()
