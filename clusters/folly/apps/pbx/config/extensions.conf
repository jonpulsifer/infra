; folly dialplan. It has no per-line branches: every trunk endpoint carries
; HANDSET (the line it rings) and every handset endpoint carries TRUNK (the
; sub-account it dials out on), both set in pjsip.conf. Adding a line is a
; pjsip.conf change, not a dialplan one.
;
; Each feature owns one file below. This file keeps [from-handset], so the
; route 911 takes is read here and nowhere else.

[general]
static = yes
writeprotect = yes

#include "inbound.conf"
#include "spam.conf"
#include "toybox.conf"
#include "agent.conf"
#include "events.conf"

; Outbound from the handset, on the line's own sub-account.
;
; No digit manipulation: voip.ms wants what the phone's own dial plan already
; produced, and a rewrite here would be a second place to be wrong about North
; American dialling. That includes 911 — which therefore depends on this PBX
; being up. The runbook says so.
;
; The pattern admits a leading `*` because the handset's dial plans send
; voip.ms feature codes (*97 and friends) as calls; `!` rather than `.` so a
; single digit, like 0 for the operator, matches too.
;
; LAST911 is read by inbound.conf: a callback within the hour skips screening.
[from-handset]
exten => _[*0-9]!,1,NoOp(${CHANNEL(endpoint)} -> ${EXTEN} via ${TRUNK})
 same => n,ExecIf($["${EXTEN}" = "911"]?Set(GLOBAL(LAST911)=${EPOCH}))
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},60)
 same => n,NoOp(outbound ended: ${DIALSTATUS})
 same => n,Hangup()

; Textual, so its exact codes share this context and outrank the pattern.
#include "handset-codes.conf"
