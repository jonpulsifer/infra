---
# Callers who skip the press-5 screen and ring with their name on the handset.
#
# 1Password item "pbx contacts" in the `homelab` vault: one text field per
# contact, the label the name and the value the number in any North American
# format. Any other field is skipped. The item is optional: until it exists
# this ExternalSecret fails to sync, the Secret is absent, the pod mounts it as
# optional, and nobody skips the screen.
#
# One item with that title, and no two fields with the same label: External
# Secrets fails the whole item on either, the Secret is never written, and
# nobody skips the screen. `kubectl -n pbx get externalsecret pbx-contacts`
# shows SecretSyncedError; no alert does.
#
# The template renders one Asterisk global per contact, CONTACT_<10 digits>,
# because voip.ms sends the caller as ten digits. It holds no dollar-brace, so
# Flux substitution passes it through. External Secrets has already turned
# every character of a label outside letters, digits, `-`, `.` and `_` into
# `_`, so the template reads a run of those as one space.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbx-contacts
  namespace: pbx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pbx-contacts
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        contacts.conf: |
          ; Rendered from the 1Password item "pbx contacts"; edit the item, not this.
          {{- range $label, $value := . }}
          {{- $digits := regexReplaceAll "[^0-9]" $value "" }}
          {{- if and (eq (len $digits) 11) (hasPrefix "1" $digits) }}{{ $digits = trimPrefix "1" $digits }}{{ end }}
          {{- if and (regexMatch "^[-+(). 0-9]+$" $value) (eq (len $digits) 10) }}
          CONTACT_{{ $digits }}={{ regexReplaceAll "[^A-Za-z0-9.-]+" $label " " | trunc 16 | trim | default "contact" }}
          {{- end }}
          {{- end }}
  dataFrom:
    - extract:
        key: pbx contacts
