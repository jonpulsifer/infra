---
# folly's additions to the base Deployment. JSON6902 ops that append, because
# envFrom has no merge key and a strategic merge would replace the whole list.
- op: test
  path: /spec/template/spec/containers/0/name
  value: asterisk
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value: {name: sounds, mountPath: /var/lib/pbx-sounds, readOnly: true}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: sounds
    configMap: {name: pbx-sounds, defaultMode: 0444}
# Optional: with no 1Password item there is no Secret, the directory is empty,
# and the dialplan's #tryinclude finds nothing.
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value: {name: contacts, mountPath: /etc/pbx-contacts, readOnly: true}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: contacts
    secret: {secretName: pbx-contacts, optional: true, defaultMode: 0444}
