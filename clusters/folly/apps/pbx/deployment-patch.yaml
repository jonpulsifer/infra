---
# folly's additions to the base Deployment, as JSON6902 ops on containers/0
# and initContainers/0. The test ops fail the build if those are not the
# asterisk and render-config containers: provision-sidecar.yaml adds a second
# container.
- op: test
  path: /spec/template/spec/containers/0/name
  value: asterisk
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value: {name: sounds, mountPath: /var/lib/pbx-sounds, readOnly: true}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: sounds
    configMap: {name: pbx-sounds, defaultMode: 0444}
# Optional: with no 1Password item there is no Secret, the directory is empty,
# and the dialplan's #tryinclude finds nothing.
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value: {name: contacts, mountPath: /etc/pbx-contacts, readOnly: true}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: contacts
    secret: {secretName: pbx-contacts, optional: true, defaultMode: 0444}
# The troll trunk's number and credentials. Last in envFrom, so the Secret's
# values replace pbx-env's `off` defaults; optional, so a missing 1Password
# item still boots the phone, with every screened caller sent to the sinks.
# Reloader does not watch it: stale credentials only send callers to the
# sinks, and a roll cuts every live call, 911 included. A change reaches the
# pod at the next restart, when no call is up.
- op: test
  path: /spec/template/spec/initContainers/0/name
  value: render-config
- op: add
  path: /spec/template/spec/initContainers/0/envFrom/-
  value:
    secretRef: {name: pbx-elevenlabs, optional: true}
