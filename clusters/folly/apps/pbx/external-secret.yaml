---
# 1Password item `pbx-folly` in the `homelab` vault.
#
# The voip.ms credentials belong to a sub-account of their own, not the main
# account: a sub-account is what can be revoked without taking every other
# registration down with it, and it is what scopes the blast radius of a
# container image this repo does not build from source.
#
# Every field must exist before this reconciles. An ExternalSecret fails as a
# whole when one property is missing, and a failed one leaves the pod in
# CreateContainerConfigError with the real reason two objects away.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbx-secrets
  namespace: pbx
spec:
  # Not 0. A refreshInterval of zero means "fetch once, never again", and a
  # credential rotated in the vault then never reaches the pod.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pbx-secrets
    creationPolicy: Owner
  data:
    - secretKey: PBX_VOIPMS_SERVER
      remoteRef: {key: pbx-folly, property: voipms-server}
    - secretKey: PBX_VOIPMS_USER
      remoteRef: {key: pbx-folly, property: voipms-user}
    - secretKey: PBX_VOIPMS_PASS
      remoteRef: {key: pbx-folly, property: voipms-password}
    - secretKey: PBX_VOIPMS_DID
      remoteRef: {key: pbx-folly, property: voipms-did}
    - secretKey: PBX_CATHY_PASS
      remoteRef: {key: pbx-folly, property: cathy-password}
