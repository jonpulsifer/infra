---
# The voip.ms password for this site's trunk, and nothing else.
#
# 1Password item "voip.ms sub accounts" in the `homelab` vault holds one
# concealed field per sub-account, and the field's *label is the username* —
# so `property` names the account and the value is its password. The canonical
# `username`/`password` fields on that item are empty and must not be used.
#
# The username and the server are not secrets and are not fetched here; they
# are literals in the pbx-env ConfigMap beside this. Pulling them from the
# vault would only mean two more fields that can be missing, and an
# ExternalSecret fails as a whole when one property is absent — leaving the pod
# in CreateContainerConfigError with the real reason two objects away.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbx-secrets
  namespace: pbx
spec:
  # Not 0. A refreshInterval of zero means "fetch once, never again", and a
  # credential rotated in the vault then never reaches the pod.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pbx-secrets
    creationPolicy: Owner
  data:
    - secretKey: PBX_VOIPMS_PASS
      remoteRef: {key: voip.ms sub accounts, property: 168847_1994}
