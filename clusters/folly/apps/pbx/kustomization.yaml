---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/apps/pbx
  - service-lb.yaml
  - external-secret.yaml
  - network-policy.yaml

patches:
  - path: provision-sidecar.yaml

namespace: pbx

configMapGenerator:
  # The handset's line-4 profile, served as a static file. Substitution stays
  # ON for this one — unlike the Asterisk config it holds no ${...} of its own,
  # and it has to learn the VIP from cluster-settings.
  - name: pbx-provision
    files:
      - provision/cathy.xml

  # The non-secret values render.sh substitutes. Separate from pbx-site because
  # this one must go *through* Flux substitution and that one must not: the
  # handset's address is owned by cluster-settings, and this is the only file
  # in the app where a `${...}` means what Flux thinks it means.
  - name: pbx-env
    literals:
      - PBX_CATHY_IP=${CATHY_IP}
      # A numbered server: voip.ms requires one for encrypted calls, and
      # ca.voip.ms is an alias. montreal10 is where lines 1-3 already
      # register. voip.ms delivers each DID from the POP set on that DID, so
      # the DID's POP has to name this server too.
      - PBX_VOIPMS_SERVER=montreal10.voip.ms

  # render.sh renders every *.conf here into /etc/asterisk, where
  # extensions.conf includes the rest by name.
  - name: pbx-site
    files:
      - config/pjsip.conf
      - config/extensions.conf
      - config/events.conf
      - config/inbound.conf
      - config/spam.conf
      - config/agent.conf
      - config/toybox.conf
      - config/handset-codes.conf
    # Asterisk's dialplan and this render script are written in ${...}, which
    # is also Flux's postBuild substitution syntax. Flux does not merely blank
    # what it cannot resolve here — `${PBX_*}` and `${$name}` are not valid
    # variable references, and envsubst fails the whole Kustomization with
    # "missing closing brace", taking every other app on the cluster with it.
    #
    # Escaping each one as `$${...}` would work and would be unreadable, and
    # every future dialplan line would have to remember. Opting the ConfigMap
    # out is the version that cannot be got wrong later.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
