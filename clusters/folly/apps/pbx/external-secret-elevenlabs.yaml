---
# The troll trunk: the number this PBX dials at ElevenLabs, which is how
# ElevenLabs picks the agent, and the digest credentials it answers the
# challenge with.
#
# 1Password item "elevenlabs troll trunk" in the `homelab` vault. The offsite
# reconciler sets the same username and password on the ElevenLabs number
# (clusters/offsite/apps/elevenlabs/), so a rotation is one edit to the item.
# agent-did is the number as it was imported there, leading + included: a
# number without it reaches no agent.
#
# Optional. render-config reads this Secret with optional: true, after the
# pbx-env defaults it replaces. Until the item exists this ExternalSecret shows
# SecretSyncedError, there is no Secret, and every screened caller goes to the
# sinks. No alert covers it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbx-elevenlabs
  namespace: pbx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pbx-elevenlabs
    creationPolicy: Owner
  data:
    - secretKey: PBX_AGENT_DID
      remoteRef: {key: elevenlabs troll trunk, property: agent-did}
    - secretKey: PBX_ELEVENLABS_USER
      remoteRef: {key: elevenlabs troll trunk, property: username}
    - secretKey: PBX_ELEVENLABS_PASS
      remoteRef: {key: elevenlabs troll trunk, property: password}
