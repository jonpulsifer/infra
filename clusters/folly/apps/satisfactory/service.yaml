apiVersion: v1
kind: Service
metadata:
  name: satisfactory
  namespace: satisfactory
  labels:
    app: satisfactory
  annotations:
    # Inert: external-dns does not watch Services. Both prefixes, because the
    # controller reads only the one its --annotation-prefix names.
    external-dns.alpha.kubernetes.io/hostname: satisfactory.lolwtf.ca
    external-dns.kubernetes.io/hostname: satisfactory.lolwtf.ca
spec:
  selector:
    app: satisfactory
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - protocol: UDP
      port: 7777
      targetPort: 7777
      name: game
    - protocol: TCP
      port: 7777
      targetPort: 7777
      name: gametcp
