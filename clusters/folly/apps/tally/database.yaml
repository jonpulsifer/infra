---
# The ledger. Rows arrive sealed by the app (AES-256-GCM under a per-ledger data
# key), so this database and its barman backups hold ciphertext, ids, batch ids
# and HMAC tokens. CNPG writes the `tally-db-app` Secret the api pod reads.
# No CiliumNetworkPolicy selects the instance: the operator, the scrape, the
# probes and the WAL archive to Garage all reach it, as with mate-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tally-db
  namespace: tally
  labels:
    app.kubernetes.io/name: tally-db
    app.kubernetes.io/part-of: tally
  annotations:
    # CNPG deletes the volume with the Cluster; Flux never prunes the ledger.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  enableSuperuserAccess: false
  # serverName is one prefix per generation of this Cluster. A re-created
  # Cluster recovers from this one and archives under the next.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        serverName: tally-db
  bootstrap:
    initdb:
      database: tally
      owner: tally
      encoding: UTF8
      localeCollate: C
      localeCType: C
      dataChecksums: true
  # Requests keep the instance out of BestEffort, which the kubelet evicts
  # first. No CPU limit, as with the app.
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi
  # local-path binds the claim, and so the instance, to the node it first lands on.
  storage:
    storageClass: local-path
    size: 5Gi
---
# CNPG's own PodMonitor carries no `release: prom-stack`, which folly's
# Prometheus selects on. CNPGBackupStale reads this scrape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tally-db
  namespace: tally
  labels:
    release: prom-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: tally-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage
  namespace: tally
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cnpg/tally/
    endpointURL: ${GARAGE_S3_ENDPOINT}
    s3Credentials:
      accessKeyId: {name: garage-cnpg, key: ACCESS_KEY_ID}
      secretAccessKey: {name: garage-cnpg, key: ACCESS_SECRET_KEY}
      region: {name: garage-cnpg, key: REGION}
    wal:
      compression: gzip
    data:
      compression: gzip
---
# CNPG schedules in UTC: this is 01:50-02:50 in America/Halifax all year, half
# an hour after tronbyt's.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: tally-db
  namespace: tally
spec:
  schedule: "0 50 5 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: tally-db
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
