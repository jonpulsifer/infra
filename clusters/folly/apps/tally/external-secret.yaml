---
# The owner creates the 1Password item `tally` in the vault `homelab`; nothing
# in git writes it. Until it exists this ExternalSecret fails to sync, the
# Secret is absent and the api pod does not start. Its fields:
#
#   keyring            the versioned master-key keyring JSON, base64, because a
#                      concealed field is one line. Rotation adds a version
#                      first and retires the old one in a second edit.
#   openai-api-key     optional; the classifier's key for TALLY_PROVIDER=openai_api.
#   codex-auth         optional; the Codex sign-in for the ChatGPT route.
#
# dataFrom reads every field, so a missing optional field renders empty rather
# than failing the whole item; the app treats an empty value as unset.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tally
  namespace: tally
  labels:
    app.kubernetes.io/name: tally
    app.kubernetes.io/part-of: tally
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tally
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        keyring.json: '{{ .keyring | b64dec }}'
        openai-api-key: '{{ index . "openai-api-key" | default "" | trim }}'
        codex-auth: '{{ index . "codex-auth" | default "" }}'
  dataFrom:
    - extract:
        key: tally
