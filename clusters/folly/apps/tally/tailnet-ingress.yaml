---
# tally's only way in, at https://tally.<tailnet>.ts.net. Ledger membership is
# by tailnet login, so the entry is a tailscale L7 Ingress, which sets
# Tailscale-User-Login on each request and overwrites a copy the client sends.
# A route on folly's cluster-gateway would let any LAN client forge that
# header. No Funnel: a funnelled request carries no login. The first label of
# tls.hosts[0] is the tailnet name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tally
  namespace: tally
  labels:
    app.kubernetes.io/name: tally
    app.kubernetes.io/part-of: tally
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: tally
      port:
        number: 8080
  tls:
    - hosts:
        - tally
