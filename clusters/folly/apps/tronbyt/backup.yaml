---
# Daily dump of the CNPG database into the site's restic staging repository.
# The Postgres image has no restic and the restic image has no Postgres
# client, so the two steps share an emptyDir.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tronbyt-db-backup
  namespace: tronbyt
  labels:
    app.kubernetes.io/name: tronbyt-db-backup
    app.kubernetes.io/part-of: tronbyt
    lolwtf.ca/backup: "true"
spec:
  schedule: "10 1 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tronbyt-db-backup
            app.kubernetes.io/part-of: tronbyt
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              # Keep this major equal to the server's, which the CNPG operator's
              # default image sets, or `pg_dump` refuses the server.
              image: ghcr.io/cloudnative-pg/postgresql:18
              # Uncompressed, so restic deduplicates one night against the next
              # and compresses the result itself.
              command:
                - pg_dump
                - --format=custom
                - --compress=0
                - --file=/dump/tronbyt.pgdump
              env:
                - name: PGHOST
                  value: tronbyt-rw
                - name: PGDATABASE
                  value: tronbyt
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: tronbyt-db
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tronbyt-db
                      key: password
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: dump
                  mountPath: /dump
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              args:
                - backup
                - --host=folly/tronbyt/tronbyt
                - --tag=kind=pg
                - --retry-lock=30m
                - /dump
              envFrom:
                - configMapRef:
                    name: restic
                - secretRef:
                    name: restic
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/cache
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: dump
                  mountPath: /dump
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: dump
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir: {}
---
# The app's NFS volume, read-only, as the uid the app writes it with.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tronbyt-data-backup
  namespace: tronbyt
  labels:
    app.kubernetes.io/name: tronbyt-data-backup
    app.kubernetes.io/part-of: tronbyt
    lolwtf.ca/backup: "true"
spec:
  schedule: "30 1 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tronbyt-data-backup
            app.kubernetes.io/part-of: tronbyt
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              args:
                - backup
                - --host=folly/tronbyt/tronbyt-data
                - --tag=kind=pvc
                - --retry-lock=30m
                - /data
              envFrom:
                - configMapRef:
                    name: restic
                - secretRef:
                    name: restic
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/cache
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tronbyt-data
                readOnly: true
            - name: tmp
              emptyDir: {}
