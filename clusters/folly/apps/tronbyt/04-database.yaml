---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tronbyt
  namespace: tronbyt
spec:
  instances: 1
  bootstrap:
    initdb:
      database: tronbyt
      owner: tronbyt
      secret:
        name: tronbyt-db
  # Declaring nothing here left the instance BestEffort, which is the first QoS
  # class the kubelet evicts under node memory pressure — an unhelpful property
  # for the thing holding the data. Sized off observed use: 11m CPU and a 91Mi
  # working set peak over 6h. No CPU limit, same reasoning as the app.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  storage:
    storageClass: local-path
    size: 256Mi
  monitoring:
    enablePodMonitor: true
