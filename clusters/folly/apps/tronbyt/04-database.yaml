---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tronbyt
  namespace: tronbyt
spec:
  instances: 1
  # serverName is one prefix per generation of this Cluster. Recovery reads
  # the previous one, tronbyt; recover-a-re-created-database removes it once
  # tronbyt-2 holds a base backup.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage
        serverName: tronbyt-2
  bootstrap:
    recovery:
      source: tronbyt
      database: tronbyt
      owner: tronbyt
      secret:
        name: tronbyt-db
  externalClusters:
    - name: tronbyt
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage
          serverName: tronbyt
  # Requests keep the database out of BestEffort, which the kubelet evicts
  # first. No CPU limit, as with the app.
  # Sized to observed peaks of 11m CPU and 91Mi.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  storage:
    storageClass: local-path
    size: 256Mi
---
# CNPG's own PodMonitor carries no `release: prom-stack`, which folly's
# Prometheus selects on. CNPGBackupStale reads this scrape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tronbyt
  namespace: tronbyt
  labels:
    release: prom-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: tronbyt
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage
  namespace: tronbyt
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cnpg/tronbyt/
    endpointURL: ${GARAGE_S3_ENDPOINT}
    s3Credentials:
      accessKeyId: {name: garage-cnpg, key: ACCESS_KEY_ID}
      secretAccessKey: {name: garage-cnpg, key: ACCESS_SECRET_KEY}
      region: {name: garage-cnpg, key: REGION}
    wal:
      compression: gzip
    data:
      compression: gzip
---
# CNPG schedules in UTC: this is 01:00-04:00 in America/Halifax all year.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: tronbyt
  namespace: tronbyt
spec:
  schedule: "0 20 5 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: tronbyt
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
