---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tronbyt
  namespace: tronbyt
spec:
  instances: 1
  bootstrap:
    initdb:
      database: tronbyt
      owner: tronbyt
      secret:
        name: tronbyt-db
  # Requests keep the database out of BestEffort, which the kubelet evicts
  # first. No CPU limit, as with the app.
  # Sized to observed peaks of 11m CPU and 91Mi.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  storage:
    storageClass: local-path
    size: 256Mi
  monitoring:
    enablePodMonitor: true
