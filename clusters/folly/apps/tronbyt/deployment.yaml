apiVersion: apps/v1
kind: Deployment
metadata:
  name: tronbyt
  namespace: tronbyt
  labels: &labels
    app.kubernetes.io/name: tronbyt
    app.kubernetes.io/part-of: tronbyt
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      # A service link sets TRONBYT_PORT to tcp://<ip>:8000, which overrides the
      # app's listen port and crashes it with "too many colons in address".
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tronbyt
          image: ghcr.io/tronbyt/server:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          env:
            - name: ENABLE_USER_REGISTRATION
              value: "false"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: tronbyt-db
                  key: DB_DSN
          volumeMounts:
            - name: tronbyt-data
              mountPath: /app/data
          # First boot checks out ~1000 system apps onto NFS, which can take
          # over a minute.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              # p99 use is 56m.
              cpu: 100m
            limits:
              memory: 256Mi
              # No CPU limit: bursts would exhaust a CFS period's quota and
              # throttle even at low average use.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tronbyt-data
          persistentVolumeClaim:
            claimName: tronbyt-data
