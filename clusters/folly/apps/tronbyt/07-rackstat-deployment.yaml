apiVersion: apps/v1
kind: Deployment
metadata:
  name: rackstat
  namespace: tronbyt
  labels: &labels
    app.kubernetes.io/name: rackstat
    app.kubernetes.io/part-of: tronbyt
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: rackstat
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rackstat
          image: ghcr.io/jonpulsifer/rackstat:latest@sha256:a67aa3a3f9f8e1a0fbf6f7c711f7341aa9f955f706b2316404bc6d508ef3e341
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: PROM_URL
              value: http://prom-stack-kube-prometheus-prometheus.monitoring.svc:9090
            - name: CLUSTER_NAME
              value: ${CLUSTER_NAME}
            # offsite is its API VIP, literal because Flux substitutes only this
            # cluster's topology. lb is Grafana's VIP, a route the UDM learns by BGP.
            - name: PROBES
              value: wan=1.1.1.1:443,offsite=10.89.0.10:6443,lb=10.3.0.66:443
            - name: ROOT_KUSTOMIZATION
              value: apps
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
