apiVersion: apps/v1
kind: Deployment
metadata:
  name: rackstat
  namespace: tronbyt
  labels: &labels
    app.kubernetes.io/name: rackstat
    app.kubernetes.io/part-of: tronbyt
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: rackstat
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rackstat
          image: ghcr.io/jonpulsifer/rackstat:latest@sha256:d2035674a1c42b0b8a733eb9aef84aca24febcfc151ed2dbf56ebfab201e221a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          env:
            - name: PROM_URL
              value: http://prom-stack-kube-prometheus-prometheus.monitoring.svc:9090
            - name: CLUSTER_NAME
              value: ${CLUSTER_NAME}
            # offsite is its API server by its API_SERVER_HOSTNAME, a Cloudflare
            # record from its topology: Flux substitutes only this cluster's.
            # lb is Grafana's VIP, a route the UDM learns by BGP.
            - name: PROBES
              value: wan=1.1.1.1:443,offsite=offsite.lolwtf.ca:6443,lb=10.3.0.66:443
            - name: ROOT_KUSTOMIZATION
              value: apps
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
