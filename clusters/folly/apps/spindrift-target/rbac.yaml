---
# Argo Applications live in the argo namespace, which offsite does not have.
# The adapter never lists or watches them; it polls with get.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spindrift-target-delivery-argo
  namespace: argo
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - create
      - delete
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spindrift-target-delivery-argo
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spindrift-target-delivery-argo
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: federated:system:serviceaccount:spindrift:spindrift
---
apiVersion: rbac.authorization.k8s.io/v1
