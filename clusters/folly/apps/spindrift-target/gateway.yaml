---
# The Apps' edge: its own listeners and address, apart from cluster-gateway.
# Flux owns it; the App chart renders only routes, so no release can remove it.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: spindrift-apps
  namespace: spindrift-apps
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
spec:
  gatewayClassName: cilium
  # Pinned: every reach: private App's A record points at this literal, the
  # Target's platform.dns.privateAddress. It must stay free inside LB_RANGE.
  addresses:
    - type: IPAddress
      value: 10.3.0.80
  # Admit by namespace label: each App's namespace carries it. A route a
  # listener does not admit is Accepted=False while the deploy reads LIVE.
  listeners:
    # Plain HTTP for the lab network; no tunnel points here.
    - name: http-gateway
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
    # One wildcard for every App: no release could own a per-App listener or
    # certificate. cert-manager issues it from the annotation above.
    - name: spindrift-apps-tls
      protocol: HTTPS
      port: 443
      hostname: "*.${SPINDRIFT_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-${SPINDRIFT_DOMAIN}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
    # cluster-gateway holds the same wildcard on its own address; each App's
    # DNSEndpoint decides which Gateway a name reaches.
    - name: spindrift-apps-tls-secret-domain
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-apps-${SECRET_DOMAIN}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
