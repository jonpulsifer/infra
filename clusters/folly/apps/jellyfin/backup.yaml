---
# The config volume, read-only, from riptide where its local-path volume
# lives. Jellyfin writes it as root, so the job reads it as root. The media
# library is a hostPath and is not backed up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-backup
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin-backup
    app.kubernetes.io/part-of: jellyfin
    lolwtf.ca/backup: "true"
spec:
  schedule: "0 3 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 259200
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin-backup
            app.kubernetes.io/part-of: jellyfin
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: jellyfin
                      app.kubernetes.io/part-of: jellyfin
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              args:
                - backup
                - --host=folly/jellyfin/jellyfin-config
                - --tag=kind=pvc
                - --retry-lock=30m
                - /data
              envFrom:
                - configMapRef:
                    name: restic
                - secretRef:
                    name: restic
              env:
                - name: RESTIC_CACHE_DIR
                  value: /tmp/cache
                - name: TMPDIR
                  value: /tmp
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jellyfin-config
                readOnly: true
            - name: tmp
              emptyDir: {}
