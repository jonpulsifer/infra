apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels: &labels
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: jellyfin
spec:
  replicas: 1
  # riptide advertises exactly one gpu.intel.com/i915, and the container below
  # claims it. A surging replacement is scheduled before the old pod releases
  # its claim, so the new one can never be placed and the rollout deadlocks —
  # the old pod keeps the device it is no longer able to use.
  #
  # `maxSurge: 0` rather than `type: Recreate`, which says the same thing about
  # one replica and cannot be applied here: the live object carries the
  # `rollingUpdate` block the API server defaulted, owned by a field manager
  # this apply is not, so a `Recreate` patch merges into an object holding both
  # and the API refuses it — `rollingUpdate: Forbidden ... when strategy type is
  # 'Recreate'`. That is a dry-run failure, so Flux stops applying the whole
  # Kustomization rather than only this file.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              protocol: TCP
              name: http
          resources:
            requests:
              cpu: 100m
            limits:
              gpu.intel.com/i915: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            privileged: false
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
              readOnly: false
            - name: media
              mountPath: /mnt/media
              readOnly: false
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          hostPath:
            path: /mnt/disks/media
            type: DirectoryOrCreate
      # No /dev/dri hostPath: the gpu.intel.com/i915 limit above already has the
      # device plugin inject the render node. Bind-mounting the whole directory
      # on top of that also drags in /dev/dri/by-path, where a dangling
      # simple-framebuffer symlink survives the handover to i915 at boot and
      # fails container creation outright.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
