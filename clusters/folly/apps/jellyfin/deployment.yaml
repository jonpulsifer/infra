apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels: &labels
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              protocol: TCP
              name: http
          resources:
            requests:
              cpu: 100m
            limits:
              gpu.intel.com/i915: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            privileged: false
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
              readOnly: false
            - name: media
              mountPath: /mnt/media
              readOnly: false
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          hostPath:
            path: /mnt/disks/media
            type: DirectoryOrCreate
      # No /dev/dri hostPath: the gpu.intel.com/i915 limit above already has the
      # device plugin inject the render node. Bind-mounting the whole directory
      # on top of that also drags in /dev/dri/by-path, where a dangling
      # simple-framebuffer symlink survives the handover to i915 at boot and
      # fails container creation outright.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
