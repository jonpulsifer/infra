---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dump
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/folly/apps/dump
  # Off while this moves into another Kustomization, so the hand-over deletes
  # nothing. The next change removes this file.
  prune: false
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: config
    - name: networking
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
      - kind: Secret
        name: cluster-secrets
