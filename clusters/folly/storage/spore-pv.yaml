---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: spore
  labels:
    type: nfs
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    # Use the topology IP directly so kubelet's NFS mounter does not depend on
    # DNS resolution while constructing the kernel mount options.
    server: ${SPORE_IP}
    path: /nfs/data/k8s/
