---
# The `nfs` StorageClass: one subdirectory per PVC under spore's
# /nfs/data/k8s-provisioned, apart from the static spore PV's /nfs/data/k8s.
# nix/services/nfs-server.nix owns the mount and export.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
  namespace: nfs-provisioner
spec:
  interval: 5m0s
  maxHistory: 2
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
      interval: 10m0s
  values:
    replicaCount: 1
    leaderElection:
      enabled: true
    # Use the topology IP directly so kubelet's NFS mounter does not depend on
    # DNS during kernel mount option construction.
    nfs:
      server: ${SPORE_IP}
      path: /nfs/data/k8s-provisioned
      mountOptions:
        - hard
        - nfsvers=3
        - timeo=600
        - retrans=2
        - noatime
    # local-path stays the cluster default.
    storageClass:
      create: true
      name: nfs
      defaultClass: false
      # Retain keeps a deleted PVC's subdirectory; archiveOnDelete applies only
      # under reclaimPolicy Delete.
      reclaimPolicy: Retain
      archiveOnDelete: true
      allowVolumeExpansion: true
    rbac:
      create: true
    serviceAccount:
      create: true
    podSecurityContext:
      fsGroup: 65534
      runAsUser: 65534
      runAsGroup: 65534
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
