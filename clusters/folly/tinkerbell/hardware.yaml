# One Hardware per folly node. Smee serves the script below only while allowPXE is true, which a
# reprovision Workflow sets for its run. allowPXE stays out of git: Flux would own it and set it back
# to false at its next apply, mid-run. Unset, Smee treats it as false. UniFi leases the address, and
# Smee refuses a dhcp.ip without a netmask, so there is none. The MAC, disk, HookOS UKI URL and its
# command line come from nodes.env through kustomization.yaml. The script frees every iPXE image
# before the chain: iPXE claims the Linux initrd device whenever another image is loaded, and
# systemd-stub then fails to register the UKI's initrd ("Already started").
---
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: optiplex
spec:
  disks:
    - device: from-nodes-env
  interfaces:
    - dhcp:
        mac: from-nodes-env
        hostname: optiplex
        arch: x86_64
        uefi: true
      netboot:
        allowWorkflow: false
        ipxe:
          contents: |
            #!ipxe
            imgfree
            chain --autofree from-nodes-env from-nodes-env
---
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: riptide
spec:
  disks:
    - device: from-nodes-env
  bmcRef:
    apiGroup: bmc.tinkerbell.org
    kind: Machine
    name: riptide
  interfaces:
    - dhcp:
        mac: from-nodes-env
        hostname: riptide
        arch: x86_64
        uefi: true
      netboot:
        allowWorkflow: false
        ipxe:
          contents: |
            #!ipxe
            imgfree
            chain --autofree from-nodes-env from-nodes-env
---
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: shale
spec:
  disks:
    - device: from-nodes-env
  bmcRef:
    apiGroup: bmc.tinkerbell.org
