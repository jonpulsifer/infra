# One attestation run: HookOS attests riptide's TPM to the anchors' attest service, then the node
# reboots to its disk. docs/runbooks/attest-a-node.md has the steps.
apiVersion: tinkerbell.org/v1alpha1
kind: Workflow
metadata:
  name: attest-riptide
  labels:
    tinkerbell.lolwtf.ca/template: attest
spec:
  hardwareRef: riptide
