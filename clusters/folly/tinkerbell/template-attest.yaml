# A Workflow labelled tinkerbell.lolwtf.ca/template=attest runs this in HookOS instead of the
# reprovision: attest the machine's TPM and boot chain against talos-attest on the anchors, store
# the issued LDevID and LAK certificates in TPM NV, then reboot to the installed disk. Nothing is
# wiped. HookOS's 6.6 kernel builds in the TPM drivers and securityfs (IMA selects them), and the
# action mounts securityfs itself, since a container gets none. attest_url is the Workflow's
# hardwareMap entry, which kustomization.yaml fills from nodes.env. The containers workflow's
# delivery pins tink-attest by digest; an all-zero digest means it is not delivered yet.
---
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: attest-to-disk
spec:
  data: |
    version: '0.1'
    name: attest-to-disk
    global_timeout: 1200
    tasks:
      - name: attest
        worker: '{{ (index .Hardware.Interfaces 0).DHCP.MAC }}'
        volumes:
          - /dev:/dev
        environment:
          ATTEST_URL: '{{ .attest_url }}'
          MAC: '{{ (index .Hardware.Interfaces 0).DHCP.MAC }}'
        actions:
          - name: attest
            image: ghcr.io/jonpulsifer/tink-attest@sha256:c595f4ffff44fc22838975491cda4a9bb7d6dcb5b2607b398e026acad4cd4699
            timeout: 600
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                mountpoint -q /sys/kernel/security || mount -t securityfs securityfs /sys/kernel/security
                exec /usr/local/bin/tink-attest
          - name: disk-next
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:2010360c0955dc6016dbe34b79e43f8ce981952c03dc0d0a445ba6a3cf109827
            timeout: 120
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "attest: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "attest: $*" >"$t" 2>/dev/null || true; done; }
                mountpoint -q /sys/firmware/efi/efivars || mount -t efivarfs efivarfs /sys/firmware/efi/efivars
                # The firmware boots the disk first anyway; BootNext makes it certain.
                n=$(efibootmgr -v | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*HD(.*/\1/p' | head -n 1)
                if [ -z "$n" ]; then
                  log "no disk boot entry; the firmware's boot order decides the next boot"
                  exit 0
                fi
                efibootmgr -q -n "$n"
                log "Boot$n (the installed disk) is the next boot"
          - name: reboot
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:2010360c0955dc6016dbe34b79e43f8ce981952c03dc0d0a445ba6a3cf109827
            timeout: 120
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                # A detached container reboots the node after this action reports success.
                docker run -d --privileged --name attest-reboot \
                  ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:2010360c0955dc6016dbe34b79e43f8ce981952c03dc0d0a445ba6a3cf109827 \
                  sh -c 'sleep 10; echo s >/proc/sysrq-trigger; sleep 2; echo b >/proc/sysrq-trigger'
                for t in /dev/tty0 /dev/ttyS0; do echo 'attest: rebooting to the installed disk in 10 seconds' >"$t" 2>/dev/null || true; done
