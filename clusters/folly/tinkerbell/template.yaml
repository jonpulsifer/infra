# Every reprovision Workflow runs this in HookOS: wipe the Hardware's disk, META included, make the
# network the next boot, and reboot. Netboot goes off when this succeeds, so Smee has no script for
# the MAC on that boot and the signed iPXE boots the signed Talos UKI (nix/images/ipxe-folly.nix).
# Its actions run images/tink-reprovision-tools, which the containers workflow's delivery pins by
# digest. An all-zero digest means the image has not been delivered yet and the run cannot pull it.
---
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: reprovision-talos
spec:
  data: |
    version: "0.1"
    name: reprovision-talos
    global_timeout: 1800
    tasks:
      - name: reprovision
        worker: "{{ (index .Hardware.Interfaces 0).DHCP.MAC }}"
        volumes:
          - /dev:/dev
        environment:
          DISK: "{{ index .Hardware.Disks 0 }}"
        actions:
          - name: wipe-disk
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:2010360c0955dc6016dbe34b79e43f8ce981952c03dc0d0a445ba6a3cf109827
            timeout: 600
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "reprovision: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "reprovision: $*" >"$t" 2>/dev/null || true; done; }
                [ -b "$DISK" ] || { log "$DISK is not a block device"; exit 1; }
                log "wiping every partition of $DISK"
                for p in $(lsblk -lnpo NAME,TYPE "$DISK" | awk '$2 == "part" { print $1 }'); do
                  wipefs --all --force "$p"
                  dd if=/dev/zero of="$p" bs=1M count=16 conv=fsync 2>/dev/null || true
                done
                wipefs --all --force "$DISK"
                sgdisk --zap-all "$DISK"
                dd if=/dev/zero of="$DISK" bs=1M count=1 conv=fsync
                dd if=/dev/zero of="$DISK" bs=512 count=2048 conv=fsync seek=$(( $(blockdev --getsz "$DISK") - 2048 ))
                blockdev --rereadpt "$DISK" || true
                if blkid -p "$DISK"; then log "$DISK still has a signature"; exit 1; fi
                log "wiped $DISK"
          - name: netboot-next
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:2010360c0955dc6016dbe34b79e43f8ce981952c03dc0d0a445ba6a3cf109827
            timeout: 300
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "reprovision: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "reprovision: $*" >"$t" 2>/dev/null || true; done; }
                mountpoint -q /sys/firmware/efi/efivars || mount -t efivarfs efivarfs /sys/firmware/efi/efivars
                # The wiped disk has nothing to boot, so the firmware would fall through its boot
                # order anyway; BootNext makes the network boot certain.
                n=$(efibootmgr | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*IPV4.*/\1/Ip' | head -n 1)
                if [ -z "$n" ]; then
                  log "no IPv4 network boot entry; the firmware's boot order decides the next boot"
                  exit 0
                fi
                efibootmgr -q -n "$n"
                log "Boot$n (IPv4 network) is the next boot"
          - name: reboot
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:2010360c0955dc6016dbe34b79e43f8ce981952c03dc0d0a445ba6a3cf109827
            timeout: 300
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                # A detached container reboots the node after this action reports success.
                docker run -d --privileged --name reprovision-reboot \
                  ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:2010360c0955dc6016dbe34b79e43f8ce981952c03dc0d0a445ba6a3cf109827 \
                  sh -c 'sleep 10; echo s >/proc/sysrq-trigger; sleep 2; echo b >/proc/sysrq-trigger'
                for t in /dev/tty0 /dev/ttyS0; do echo "reprovision: rebooting into the Talos UKI netboot in 10 seconds" >"$t" 2>/dev/null || true; done
