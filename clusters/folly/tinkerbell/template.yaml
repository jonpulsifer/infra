# The one Template every fleet-controller Workflow runs in HookOS. Its hardwareMap says what the
# run does: attest, wipe, retire and install (each true/false), installer_image, attest_url and
# ntp_server. With the controller's installs on, a provision of a worker class attests, wipes,
# installs Talos and boots the disk; a provision the controller does not install (installs off, a
# control plane, a TPM 1.2 node) attests and wipes, and the node boots the network into HookOS
# (the iPXE default item) until a Workflow runs; an attest leaves the disk alone; a wipe wipes and
# netboots into HookOS; a retirement wipes and powers the node off. Nothing in git starts a run: the controller on spore
# (apps/fleet-controller) creates a Workflow when a NetBox device's desired_action is set, and
# netboot goes off when the run succeeds, so Smee has no script for the MAC on the next boot.
#
# The actions run images/tink-reprovision-tools and images/tink-attest, which the containers
# workflow's delivery pins by digest. An all-zero digest means the image has not been delivered yet
# and the run cannot pull it. HookOS's 6.6 kernel builds in the TPM drivers and securityfs, and the
# attest action mounts securityfs itself, since a container gets none.
#
# tink-agent passes an action's command to Docker as the container's arguments and keeps the
# image's entrypoint, and it substitutes nothing at run time: the Template is rendered once, from
# the Hardware and the hardwareMap, when the Workflow starts. The install code exists only after the
# attest action, as /tmp/fleet/install_code on HookOS, so the install action is a shell in
# tink-reprovision-tools that reads it and runs the installer image through HookOS's Docker. Each
# action gets a fresh /sys, so an action that needs efivarfs mounts it for itself; the installer,
# which has no shell, gets it as a volume of the local driver.
---
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: provision
spec:
  data: |
    version: "0.1"
    name: provision
    global_timeout: 1800
    tasks:
      - name: provision
        worker: "{{ (index .Hardware.Interfaces 0).DHCP.MAC }}"
        volumes:
          - /dev:/dev
        environment:
          DISK: "{{ index .Hardware.Disks 0 }}"
          MAC: "{{ (index .Hardware.Interfaces 0).DHCP.MAC }}"
          ATTEST: "{{ .attest }}"
          WIPE: "{{ .wipe }}"
          RETIRE: "{{ .retire }}"
          # Tinkerbell renders with missingkey=error, so a Workflow from a controller that sets no
          # install keys reads them as no install.
          INSTALL: '{{ or (index . "install") "false" }}'
          INSTALLER_IMAGE: '{{ or (index . "installer_image") "" }}'
          ATTEST_URL: "{{ .attest_url }}"
          NTP_SERVER: "{{ .ntp_server }}"
          INSTALL_CODE_FILE: /tmp/fleet/install_code
        actions:
          # The attest service checks its certificate's dates against the machine's clock, and a
          # machine off the shelf has none worth trusting. The anchors' chrony answers at the boot
          # VIP; the RTC keeps the result for the Talos boot that follows.
          - name: set-clock
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 120
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "set-clock: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "set-clock: $*" >"$t" 2>/dev/null || true; done; }
                if ! command -v ntpd >/dev/null; then
                  log "no ntpd in the image; the clock stays $(date -u)"
                  exit 0
                fi
                if timeout 30 ntpd -q -n -p "$NTP_SERVER"; then
                  hwclock --systohc --utc || log "the RTC refused the write"
                  log "set from $NTP_SERVER: $(date -u)"
                else
                  log "$NTP_SERVER did not answer; the clock stays $(date -u)"
                fi
          # At the end of a full intake talos-attest answers the install code, which tink-attest
          # writes to /tmp/fleet/install_code for the install action.
          - name: attest
            image: ghcr.io/jonpulsifer/tink-attest@sha256:ba526e432e784df30f7f3347a64a34520341d0814af511c1708ebbf37610be65
            timeout: 600
            volumes:
              - /tmp/fleet:/tmp/fleet
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                if [ "$ATTEST" != true ]; then
                  for t in /dev/tty0 /dev/ttyS0; do echo "attest: skipped for this run" >"$t" 2>/dev/null || true; done
                  exit 0
                fi
                mountpoint -q /sys/kernel/security || mount -t securityfs securityfs /sys/kernel/security
                exec /usr/local/bin/tink-attest
          - name: wipe-disk
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 600
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "wipe: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "wipe: $*" >"$t" 2>/dev/null || true; done; }
                if [ "$WIPE" != true ]; then
                  log "nothing wiped this run"
                  exit 0
                fi
                [ -b "$DISK" ] || { log "$DISK is not a block device"; exit 1; }
                log "wiping every partition of $DISK"
                for p in $(lsblk -lnpo NAME,TYPE "$DISK" | awk '$2 == "part" { print $1 }'); do
                  wipefs --all --force "$p"
                  dd if=/dev/zero of="$p" bs=1M count=16 conv=fsync 2>/dev/null || true
                done
                wipefs --all --force "$DISK"
                sgdisk --zap-all "$DISK"
                dd if=/dev/zero of="$DISK" bs=1M count=1 conv=fsync
                dd if=/dev/zero of="$DISK" bs=512 count=2048 conv=fsync seek=$(( $(blockdev --getsz "$DISK") - 2048 ))
                blockdev --rereadpt "$DISK" || true
                if blkid -p "$DISK"; then log "$DISK still has a signature"; exit 1; fi
                log "wiped $DISK"
          # The installer writes the signed UKI, sd-boot and META to the disk, with the code in META
          # key 0x0b; the UKI's talos.config URL carries it, and the node's first boot fetches its
          # config from /talos/config by it and creates STATE itself. The installer reads stdin to
          # EOF, and a container docker runs without -i has none.
          - name: install
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 900
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - /tmp/fleet:/tmp/fleet
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "install: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "install: $*" >"$t" 2>/dev/null || true; done; }
                if [ "$INSTALL" != true ]; then
                  log "nothing installed this run"
                  exit 0
                fi
                if [ ! -s "$INSTALL_CODE_FILE" ]; then
                  log "no install code: the attest step wrote none (no full intake, or the controller refused the render)"
                  exit 1
                fi
                code=$(cat "$INSTALL_CODE_FILE")
                case "$code" in
                  *[!A-Za-z0-9_-]*) log "the install code is malformed"; exit 1 ;;
                esac
                if [ "${#code}" -ne 43 ]; then
                  log "the install code is malformed"
                  exit 1
                fi
                log "installing $INSTALLER_IMAGE to $DISK"
                # The installer's output goes to the console too: Tinkerbell keeps no action log,
                # and the console is the only record of why an install failed.
                if docker run --rm --privileged --network none \
                  --volume /dev:/dev \
                  --mount type=volume,dst=/sys/firmware/efi/efivars,volume-driver=local,volume-opt=type=efivarfs,volume-opt=device=efivarfs,volume-nocopy=true \
                  --entrypoint /bin/installer \
                  "$INSTALLER_IMAGE" \
                  install --platform metal --disk "$DISK" --meta "0x0b=$code" >/tmp/fleet/install.log 2>&1; then
                  tail -n 5 /tmp/fleet/install.log | while IFS= read -r line; do log "$line"; done
                  log "installed Talos to $DISK"
                else
                  tail -n 25 /tmp/fleet/install.log | while IFS= read -r line; do log "$line"; done
                  log "the installer failed; the lines above are its last output"
                  exit 1
                fi
          # After an install the disk boots, preferring the installer's Talos entry; after a wipe
          # with no install the network does, since a wiped disk has nothing to boot. BootNext makes
          # each certain. A run that only attests leaves the firmware's boot order alone.
          - name: next-boot
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 120
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "next-boot: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "next-boot: $*" >"$t" 2>/dev/null || true; done; }
                if [ "$RETIRE" = true ]; then
                  log "a retired node powers off; no next boot"
                  exit 0
                fi
                mountpoint -q /sys/firmware/efi/efivars || mount -t efivarfs efivarfs /sys/firmware/efi/efivars
                if [ "$INSTALL" = true ]; then
                  n=$(efibootmgr | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*Talos.*/\1/p' | head -n 1)
                  [ -n "$n" ] || n=$(efibootmgr -v | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*HD(.*/\1/p' | head -n 1)
                  what="the installed disk"
                elif [ "$WIPE" = true ]; then
                  n=$(efibootmgr | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*IPV4.*/\1/Ip' | head -n 1)
                  what="IPv4 network"
                else
                  log "nothing installed or wiped; the firmware's boot order decides the next boot"
                  exit 0
                fi
                if [ -z "$n" ]; then
                  log "no entry for $what; the firmware's boot order decides the next boot"
                  exit 0
                fi
                efibootmgr -q -n "$n"
                log "Boot$n ($what) is the next boot"
          # A retired node powers off instead, and stays off until somebody turns it on.
          - name: reboot
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 120
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                key=b; what="rebooting"
                if [ "$RETIRE" = true ]; then key=o; what="powering off"; fi
                # A detached container reboots or powers off the node after this action reports success.
                docker run -d --privileged --name provision-reboot \
                  ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f \
                  sh -c "sleep 10; echo s >/proc/sysrq-trigger; sleep 2; echo $key >/proc/sysrq-trigger"
                for t in /dev/tty0 /dev/ttyS0; do echo "provision: $what in 10 seconds" >"$t" 2>/dev/null || true; done
