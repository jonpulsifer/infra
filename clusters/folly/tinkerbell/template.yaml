# The one Template every fleetd Workflow runs in HookOS. Its hardwareMap says what the run does:
# attest, wipe, retire and install (each true/false) and installer_image. HookOS attests on every
# boot, before tink-agent waits for work (images/tink-agent-autoid), so no action attests: an
# intake pass's confirm is where fleetd starts the provision and answers the install code. A run
# with attest true fails unless this boot passed, which the entrypoint marks in
# /worker/fleet/attested, before it wipes anything; a Workflow without the key attests. A run that
# installs wipes nothing without the install code. With fleetd's
# installs on, a provision of a worker class wipes, installs Talos and boots the disk; a provision
# fleetd does not install (installs off, a control plane, a TPM 1.2 node) wipes, and the node boots
# the network into HookOS (the iPXE default item) until a Workflow runs; an attest only netboots
# HookOS, which attests; a wipe wipes and netboots into HookOS; a retirement wipes and powers the
# node off. Nothing in git starts a run: fleetd on spore (apps/fleetd) creates a Workflow when a
# NetBox device's desired_action is set or an intake pass admits it, and netboot goes off when the
# run succeeds, so Smee has no script for the MAC on the next boot.
#
# The Hardware's disk is a kernel name, which follows probe order: a swapped slot, a missing disk
# or a USB stick can take it. So wipe-disk and install first check that the disk at that name
# reports install_disk_serial, the serial the nodes file declares, that no other disk reports it,
# and that it is neither removable nor on USB, and refuse with nothing written otherwise. The
# serials come from sysfs, which needs no udev. The installer still gets the kernel name, since it
# appends partition numbers to its --disk.
#
# The actions run images/tink-reprovision-tools, which the containers workflow's delivery pins by
# digest. An all-zero digest means the image has not been delivered yet and the run cannot pull it.
#
# tink-agent passes an action's command to Docker as the container's arguments and keeps the
# image's entrypoint, and it substitutes nothing at run time: the Template is rendered once, from
# the Hardware and the hardwareMap, when the Workflow starts. The install code exists only after
# the boot's attestation, as /worker/fleet/install_code on HookOS, so the install action is a shell
# in tink-reprovision-tools that reads it and runs the installer image through HookOS's Docker.
# Each action gets a fresh /sys, so an action that needs efivarfs mounts it for itself; the
# installer, which has no shell, gets it as a volume of the local driver.
---
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: provision
spec:
  data: |
    version: "0.1"
    name: provision
    global_timeout: 1800
    tasks:
      - name: provision
        worker: "{{ (index .Hardware.Interfaces 0).DHCP.MAC }}"
        volumes:
          - /dev:/dev
        environment:
          DISK: "{{ index .Hardware.Disks 0 }}"
          MAC: "{{ (index .Hardware.Interfaces 0).DHCP.MAC }}"
          ATTEST: '{{ or (index . "attest") "true" }}'
          WIPE: "{{ .wipe }}"
          RETIRE: "{{ .retire }}"
          # Tinkerbell renders with missingkey=error, so a Workflow from a controller that sets no
          # install keys reads them as no install.
          INSTALL: '{{ or (index . "install") "false" }}'
          INSTALLER_IMAGE: '{{ or (index . "installer_image") "" }}'
          DISK_SERIAL: '{{ or (index . "install_disk_serial") "" }}'
          INSTALL_CODE_FILE: /tmp/fleet/install_code
          ATTESTED_FILE: /tmp/fleet/attested
        actions:
          - name: wipe-disk
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 600
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - /worker/fleet:/tmp/fleet
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "wipe: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "wipe: $*" >"$t" 2>/dev/null || true; done; }
                # The serial a whole disk reports: an NVMe or MMC controller's, a virtio disk's, or a
                # SCSI or SATA disk's unit serial number page past its 4-byte header.
                serial_of() {
                  if [ -r "$1/device/serial" ]; then cat "$1/device/serial"
                  elif [ -r "$1/serial" ]; then cat "$1/serial"
                  elif [ -r "$1/device/vpd_pg80" ]; then tail -c +5 "$1/device/vpd_pg80"
                  fi 2>/dev/null | tr -d ' \t\n\000'
                }
                check_disk() {
                  case "$DISK_SERIAL" in
                    "") log "no install disk serial is declared for $DISK; $1"; exit 1 ;;
                    *[!A-Za-z0-9._-]*) log "the install disk serial $DISK_SERIAL is malformed; $1"; exit 1 ;;
                  esac
                  [ -b "$DISK" ] || { log "$DISK is not a block device; $1"; exit 1; }
                  name=$(basename "$(readlink -f "$DISK")")
                  [ -d "/sys/block/$name" ] || { log "$DISK is not a whole disk; $1"; exit 1; }
                  found=""
                  for b in /sys/block/*; do
                    if [ "$(serial_of "$b")" = "$DISK_SERIAL" ]; then found="$found ${b##*/}"; fi
                  done
                  found=${found# }
                  case "$found" in
                    "") log "no disk reports the serial $DISK_SERIAL; $1"; exit 1 ;;
                    *" "*) log "more than one disk reports the serial $DISK_SERIAL ($found); $1"; exit 1 ;;
                    "$name") ;;
                    *) log "$DISK is $name, but the disk that reports $DISK_SERIAL is $found; $1"; exit 1 ;;
                  esac
                  if [ "$(cat "/sys/block/$name/removable" 2>/dev/null)" != 0 ]; then log "$DISK is removable; $1"; exit 1; fi
                  case "$(readlink -f "/sys/block/$name")" in
                    */usb[0-9]*) log "$DISK is on USB; $1"; exit 1 ;;
                  esac
                  log "$DISK reports the serial $DISK_SERIAL"
                }
                # A run that attests fails when this boot's attestation did, before it wipes
                # anything, and the install code gates the wipe of a run that installs, so a
                # refused machine keeps its disk.
                if [ "$ATTEST" = true ] && [ ! -e "$ATTESTED_FILE" ]; then
                  log "this boot did not pass attestation; nothing wiped"
                  exit 1
                fi
                if [ "$WIPE" != true ]; then
                  log "nothing wiped this run"
                  exit 0
                fi
                if [ "$INSTALL" = true ] && [ ! -s "$INSTALL_CODE_FILE" ]; then
                  log "no install code; nothing wiped"
                  exit 1
                fi
                # An installer that outlived its action, after a timeout the action could not clean up,
                # would keep writing the disk this action wipes. Remove it, and wipe nothing if it stays.
                docker rm -f provision-install >/dev/null 2>&1 || true
                if [ -n "$(docker ps -aq --filter name=^provision-install$ 2>/dev/null)" ]; then
                  log "an installer from an earlier run is still there; nothing wiped"
                  exit 1
                fi
                check_disk "nothing wiped"
                log "wiping every partition of $DISK"
                for p in $(lsblk -lnpo NAME,TYPE "$DISK" | awk '$2 == "part" { print $1 }'); do
                  wipefs --all --force "$p"
                  dd if=/dev/zero of="$p" bs=1M count=16 conv=fsync 2>/dev/null || true
                done
                wipefs --all --force "$DISK"
                sgdisk --zap-all "$DISK"
                dd if=/dev/zero of="$DISK" bs=1M count=1 conv=fsync
                dd if=/dev/zero of="$DISK" bs=512 count=2048 conv=fsync seek=$(( $(blockdev --getsz "$DISK") - 2048 ))
                blockdev --rereadpt "$DISK" || true
                if blkid -p "$DISK"; then log "$DISK still has a signature"; exit 1; fi
                log "wiped $DISK"
          # The installer writes the signed UKI, sd-boot and META to the disk, with the code in META
          # key 0x0b; the UKI's talos.config URL carries it, and the node's first boot fetches its
          # config from /talos/config by it and creates STATE itself. The installer reads stdin to
          # EOF, and a container docker runs without -i has none.
          - name: install
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 900
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
              - /worker/fleet:/tmp/fleet
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "install: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "install: $*" >"$t" 2>/dev/null || true; done; }
                # serial_of and check_disk are wipe-disk's, word for word.
                serial_of() {
                  if [ -r "$1/device/serial" ]; then cat "$1/device/serial"
                  elif [ -r "$1/serial" ]; then cat "$1/serial"
                  elif [ -r "$1/device/vpd_pg80" ]; then tail -c +5 "$1/device/vpd_pg80"
                  fi 2>/dev/null | tr -d ' \t\n\000'
                }
                check_disk() {
                  case "$DISK_SERIAL" in
                    "") log "no install disk serial is declared for $DISK; $1"; exit 1 ;;
                    *[!A-Za-z0-9._-]*) log "the install disk serial $DISK_SERIAL is malformed; $1"; exit 1 ;;
                  esac
                  [ -b "$DISK" ] || { log "$DISK is not a block device; $1"; exit 1; }
                  name=$(basename "$(readlink -f "$DISK")")
                  [ -d "/sys/block/$name" ] || { log "$DISK is not a whole disk; $1"; exit 1; }
                  found=""
                  for b in /sys/block/*; do
                    if [ "$(serial_of "$b")" = "$DISK_SERIAL" ]; then found="$found ${b##*/}"; fi
                  done
                  found=${found# }
                  case "$found" in
                    "") log "no disk reports the serial $DISK_SERIAL; $1"; exit 1 ;;
                    *" "*) log "more than one disk reports the serial $DISK_SERIAL ($found); $1"; exit 1 ;;
                    "$name") ;;
                    *) log "$DISK is $name, but the disk that reports $DISK_SERIAL is $found; $1"; exit 1 ;;
                  esac
                  if [ "$(cat "/sys/block/$name/removable" 2>/dev/null)" != 0 ]; then log "$DISK is removable; $1"; exit 1; fi
                  case "$(readlink -f "/sys/block/$name")" in
                    */usb[0-9]*) log "$DISK is on USB; $1"; exit 1 ;;
                  esac
                  log "$DISK reports the serial $DISK_SERIAL"
                }
                if [ "$INSTALL" != true ]; then
                  log "nothing installed this run"
                  exit 0
                fi
                if [ ! -s "$INSTALL_CODE_FILE" ]; then
                  log "no install code: the boot's attestation got none (no intake pass, or fleetd refused the render)"
                  exit 1
                fi
                code=$(cat "$INSTALL_CODE_FILE")
                case "$code" in
                  *[!A-Za-z0-9_-]*) log "the install code is malformed"; exit 1 ;;
                esac
                if [ "${#code}" -ne 43 ]; then
                  log "the install code is malformed"
                  exit 1
                fi
                check_disk "nothing installed"
                log "installing $INSTALLER_IMAGE to $DISK"
                # The installer's output goes to the console too: Tinkerbell keeps no action log,
                # and the console is the only record of why an install failed.
                # The installer is a sibling container on HookOS's Docker, so stopping this action
                # stops only the docker client. The shell waits in the background and removes the
                # installer when tink-agent's SIGTERM ends the action at its timeout.
                trap 'docker rm -f provision-install >/dev/null 2>&1; log "stopped; the installer is removed"; exit 143' TERM INT
                docker run --rm --name provision-install --privileged --network none \
                  --volume /dev:/dev \
                  --mount type=volume,dst=/sys/firmware/efi/efivars,volume-driver=local,volume-opt=type=efivarfs,volume-opt=device=efivarfs,volume-nocopy=true \
                  --entrypoint /bin/installer \
                  "$INSTALLER_IMAGE" \
                  install --platform metal --disk "$DISK" --meta "0x0b=$code" >/tmp/fleet/install.log 2>&1 &
                rc=0
                wait $! || rc=$?
                if [ "$rc" = 0 ]; then
                  tail -n 5 /tmp/fleet/install.log | while IFS= read -r line; do log "$line"; done
                  log "installed Talos to $DISK"
                else
                  tail -n 25 /tmp/fleet/install.log | while IFS= read -r line; do log "$line"; done
                  log "the installer failed; the lines above are its last output"
                  exit 1
                fi
          # After an install the disk boots, preferring the installer's Talos entry; after a wipe
          # with no install the network does, since a wiped disk has nothing to boot. BootNext makes
          # each certain. A run that only attests leaves the firmware's boot order alone.
          - name: next-boot
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 120
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                log() { echo "next-boot: $*"; for t in /dev/tty0 /dev/ttyS0; do echo "next-boot: $*" >"$t" 2>/dev/null || true; done; }
                if [ "$RETIRE" = true ]; then
                  log "a retired node powers off; no next boot"
                  exit 0
                fi
                # BootNext is a convenience: with netboot off for the node, a refused PXE falls
                # through to the installed disk anyway, so an EFI failure here is logged, not fatal.
                if ! mountpoint -q /sys/firmware/efi/efivars && ! err=$(mount -t efivarfs efivarfs /sys/firmware/efi/efivars 2>&1); then
                  log "efivarfs did not mount ($err); the firmware's boot order decides the next boot"
                  exit 0
                fi
                if ! entries=$(efibootmgr -v 2>&1); then
                  log "efibootmgr failed ($entries); the firmware's boot order decides the next boot"
                  exit 0
                fi
                if [ "$INSTALL" = true ]; then
                  n=$(printf '%s\n' "$entries" | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*Talos.*/\1/p' | head -n 1)
                  [ -n "$n" ] || n=$(printf '%s\n' "$entries" | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*HD(.*/\1/p' | head -n 1)
                  what="the installed disk"
                elif [ "$WIPE" = true ]; then
                  n=$(printf '%s\n' "$entries" | sed -n 's/^Boot\([0-9A-Fa-f]\{4\}\)\*\{0,1\} .*IPV4.*/\1/Ip' | head -n 1)
                  what="IPv4 network"
                else
                  log "nothing installed or wiped; the firmware's boot order decides the next boot"
                  exit 0
                fi
                if [ -z "$n" ]; then
                  log "no entry for $what; the firmware's boot order decides the next boot"
                  exit 0
                fi
                if err=$(efibootmgr -q -n "$n" 2>&1); then
                  log "Boot$n ($what) is the next boot"
                else
                  log "BootNext refused ($err); the firmware's boot order decides the next boot"
                fi
          # A retired node powers off instead, and stays off until somebody turns it on.
          - name: reboot
            image: ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f
            timeout: 120
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                key=b; what="rebooting"
                if [ "$RETIRE" = true ]; then key=o; what="powering off"; fi
                # A detached container reboots or powers off the node after this action reports success.
                # This action's success means the container started, not that the node rebooted: the
                # Workflow is SUCCESS before the node goes down. A node that stays in HookOS has a
                # Hardware state that never leaves its provision, and no attestation from the next boot.
                docker rm -f provision-reboot >/dev/null 2>&1 || true
                docker run -d --rm --privileged --name provision-reboot \
                  ghcr.io/jonpulsifer/tink-reprovision-tools@sha256:dd679b3712476b2ff86c3aec8edbc3b64f57e08c1d94472e2c0993a8a4d3007f \
                  sh -c "sleep 10; echo s >/proc/sysrq-trigger; sleep 2; echo $key >/proc/sysrq-trigger"
                for t in /dev/tty0 /dev/ttyS0; do echo "provision: $what in 10 seconds" >"$t" 2>/dev/null || true; done
