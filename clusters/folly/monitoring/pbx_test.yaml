---
# Unit test for pbx-rules.yaml, run by `mise run k8s:check-rules` against the
# rendered PrometheusRule. Not a manifest: kustomization.yaml does not list it.
#
# What these cases prove, beyond the expressions parsing:
#   - a PBX rollout, which drops the handset for up to a minute, pages nobody;
#   - a PBX that is simply gone — no series at all — still alerts, which is the
#     case every `!=` comparison in this file is blind to;
#   - the trunk alert tells a rejected registration from a lost one.
rule_files:
  - pbx.yaml

evaluation_interval: 1m

tests:
  # Healthy throughout, except a two-minute handset gap: a pod rollout.
  - interval: 1m
    input_series:
      - series: 'up{namespace="pbx", job="pbx-metrics", instance="10.100.2.210:8088"}'
        values: 1x30
      - series: 'asterisk_pjsip_outbound_registration_status{namespace="pbx", job="pbx-metrics", domain="sip:ca.voip.ms", username="sip:168847_1994@ca.voip.ms"}'
        values: 1x30
      - series: 'asterisk_endpoints_state{namespace="pbx", job="pbx-metrics", resource="line4", id="PJSIP/line4"}'
        values: 2x5 1x2 2x23
    alert_rule_test:
      - eval_time: 10m
        alertname: PBXHandsetOffline
        exp_alerts: []
      - eval_time: 10m
        alertname: PBXTrunkNotRegistered
        exp_alerts: []
      - eval_time: 10m
        alertname: PBXDown
        exp_alerts: []

  # The carrier rejects the credentials, and the handset drops off for good.
  - interval: 1m
    input_series:
      - series: 'up{namespace="pbx", job="pbx-metrics", instance="10.100.2.210:8088"}'
        values: 1x30
      - series: 'asterisk_pjsip_outbound_registration_status{namespace="pbx", job="pbx-metrics", domain="sip:ca.voip.ms", username="sip:168847_1994@ca.voip.ms"}'
        values: 1x5 2x25
      - series: 'asterisk_endpoints_state{namespace="pbx", job="pbx-metrics", resource="line4", id="PJSIP/line4"}'
        values: 2x5 1x25
    alert_rule_test:
      # Three minutes in to each fault: pending, not yet firing.
      - eval_time: 8m
        alertname: PBXTrunkNotRegistered
        exp_alerts: []
      - eval_time: 15m
        alertname: PBXTrunkNotRegistered
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: pbx
              job: pbx-metrics
              domain: "sip:ca.voip.ms"
              username: "sip:168847_1994@ca.voip.ms"
            exp_annotations:
              message: "Trunk sip:168847_1994@ca.voip.ms is not registered"
              description: "Registration status is 2 (0 unregistered, 2 rejected by the carrier) and has been for five minutes, so calls to this sub-account's DID reach nothing. 2 means the carrier refused the credentials — check the password in 1Password item \"voip.ms sub accounts\". 0 is usually the network. https://wiki.lolwtf.ca/runbooks/operate-the-office-phone/"
      - eval_time: 15m
        alertname: PBXHandsetOffline
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: pbx
              job: pbx-metrics
              resource: line4
              id: PJSIP/line4
            exp_annotations:
              message: "Office handset line4 is not registered to the PBX"
              description: "That line of the office SPA504G has not been registered for five minutes, so its DID rings nobody. Every line down at once is the phone itself — power, network, or its profile, which is what points it at the PBX. https://wiki.lolwtf.ca/runbooks/operate-the-office-phone/"

  # The PBX is gone entirely: not a single series. Every `!=` above is silent.
  - interval: 1m
    input_series:
      - series: 'up{namespace="monitoring", job="unrelated"}'
        values: 1x20
    alert_rule_test:
      - eval_time: 3m
        alertname: PBXDown
        exp_alerts: []
      - eval_time: 6m
        alertname: PBXDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: pbx
              job: pbx-metrics
            exp_annotations:
              message: The folly PBX is down — the office phone has no lines
              description: "Prometheus has had no metrics from the PBX for five minutes. The trunk and handset alerts cannot fire while this does — their series come from the PBX itself — so all four office lines, 911 included, should be assumed dead. Check the pbx Deployment in the pbx namespace; the asterisk container logs say why it stopped. https://wiki.lolwtf.ca/runbooks/operate-the-office-phone/"

  # Scraped, but failing: the same alert, the same labels.
  - interval: 1m
    input_series:
      - series: 'up{namespace="pbx", job="pbx-metrics", instance="10.100.2.210:8088"}'
        values: 0x20
    alert_rule_test:
      - eval_time: 10m
        alertname: PBXDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: pbx
              job: pbx-metrics
            exp_annotations:
              message: The folly PBX is down — the office phone has no lines
              description: "Prometheus has had no metrics from the PBX for five minutes. The trunk and handset alerts cannot fire while this does — their series come from the PBX itself — so all four office lines, 911 included, should be assumed dead. Check the pbx Deployment in the pbx namespace; the asterisk container logs say why it stopped. https://wiki.lolwtf.ca/runbooks/operate-the-office-phone/"
