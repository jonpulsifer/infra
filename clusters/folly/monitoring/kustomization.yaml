---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-prometheus.yaml
  - grafana-dashboards
  - local-node-exporters.yaml
  - windows-exporters.yaml
  - target-down.yaml
  - victoria-logs-route.yaml
  - capsule.yaml
  - spore.yaml
  - tempo.yaml
  - flameboss.yaml
  - flameboss-rules.yaml
  - pbx-rules.yaml
  - ../../base/monitoring
  - secret.sops.yaml
 # - unpoller
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
    patch: |-
      - op: replace
        path: /spec/interval
        value: 1m0s
      - op: replace
        path: /spec/chart/spec/interval
        value: 5m0s
      - op: replace
        path: /spec/maxHistory
        value: 2
