---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-prometheus.yaml
  - grafana-dashboards
  - local-node-exporters.yaml
  - windows-exporters.yaml
  - target-down.yaml
  - victoria-logs-route.yaml
  - capsule.yaml
  - spore.yaml
  - tempo.yaml
  - flameboss.yaml
  - flameboss-rules.yaml
  - mate-sandbox-reader.yaml
  - pbx-rules.yaml
  - etcd-snapshot-rules.yaml
  - node-storage-rules.yaml
  - ../../base/monitoring
  - secret.sops.yaml
 # - unpoller
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
    patch: |-
      - op: replace
        path: /spec/interval
        value: 1m0s
      - op: replace
        path: /spec/chart/spec/interval
        value: 5m0s
      - op: replace
        path: /spec/maxHistory
        value: 2
  # VictoriaLogs is shared with offsite, so folly adds its own affinity. No node
  # is tainted, so this term alone keeps log writes off the control-plane
  # node's disk, which etcd shares.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: victoria-logs
    patch: |-
      - op: add
        path: /spec/values/server/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
