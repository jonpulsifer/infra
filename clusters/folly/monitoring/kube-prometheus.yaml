---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
  namespace: monitoring
spec:
  interval: 24h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    # Nested: the chart ignores a dotted `kubelet.enabled` key. Kubelet carries
    # cAdvisor; the other three have no reachable endpoint here.
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    prometheus:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Prometheus"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: torch
        hosts:
          - &prom prom.${SECRET_DOMAIN}
        tls:
          - secretName: *prom
            hosts:
              - *prom
        pathType: Prefix
      prometheusSpec:
        serviceDiscoveryRole: EndpointSlice
        # k6 TestRuns push metrics by remote write, which is off by default.
        enableRemoteWriteReceiver: true
        retention: 30d
        # The TSDB's disk also holds jellyfin's media and every local-path PVC;
        # 16GB stops it filling that disk. 30d of this cluster is about 15GiB.
        retentionSize: 16GB
        # Both sites alert into one channel, and multi-cluster dashboards group
        # on `cluster`.
        externalLabels:
          cluster: ${CLUSTER_NAME}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  # The live PVC is larger; the template is immutable and
                  # local-path enforces neither size, so retentionSize bounds it.
                  storage: 50Gi
    grafana:
      admin:
        existingSecret: grafana-admin-user
        userKey: user
        passwordKey: password
      grafana.ini:
        feature_toggles:
          publicDashboards: true
      plugins:
        - victoriametrics-logs-datasource
      additionalDataSources:
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          isDefault: false
          access: proxy
          url: http://victoria-logs-server.monitoring.svc.cluster.local:9428
          orgId: 1
          version: 1
          jsonData:
            # Log shippers write as AccountID 1; a query with no header reads
            # the empty tenant 0. Strings: the plugin rejects integers here.
            multitenancyHeaders:
              AccountID: "1"
              ProjectID: "0"
        - name: Tempo
          type: tempo
          uid: tempo
          isDefault: false
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          orgId: 1
          version: 1
          jsonData:
            tracesToLogs:
              datasourceUid: victorialogs
              filterByTraceID: false
              tags:
                - key: pod
                  value: pod
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      downloadDashboardsImage:
        repository: jonpulsifer/bashcurljq
        tag: latest
      # Without DAC_READ_SEARCH, init-chown-data fails on restart: "chown: /var/lib/grafana/csv: Permission denied".
      initChownData:
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            add: ["CHOWN", "DAC_READ_SEARCH"]
      dashboards:
        default:
          client-dpi:
            gnetId: 11310
            revision: 5
            datasource: Prometheus
          network-sites:
            gnetId: 11311
            revision: 5
            datasource: Prometheus
          usw-insights:
            gnetId: 11312
            revision: 9
            datasource: Prometheus
          usg-insights:
            gnetId: 11313
            revision: 9
            datasource: Prometheus
          uap-insights:
            gnetId: 11314
            revision: 10
            datasource: Prometheus
          client-insights:
            gnetId: 11315
            revision: 9
            datasource: Prometheus
          k6-prometheus:
            gnetId: 19665
            revision: 3
            datasource: Prometheus
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Grafana"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: chart-line
        hosts:
          - &grafana grafana.${SECRET_DOMAIN}
        tls:
          - secretName: *grafana
            hosts:
              - *grafana
        pathType: Prefix
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
    alertmanager:
      config:
        route:
          group_by: [cluster, namespace, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          # Anything the AlertmanagerConfig sub-route does not take lands here.
          receiver: "null"
          routes:
            # Watchdog always fires, and Discord cannot show its absence.
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: "null"
        inhibit_rules:
          - source_matchers: [severity = "critical"]
            target_matchers: [severity =~ "warning|info"]
            equal: [namespace, alertname]
          - source_matchers: [severity = "warning"]
            target_matchers: [severity = "info"]
            equal: [namespace, alertname]
          - source_matchers: [alertname = "InfoInhibitor"]
            target_matchers: [severity = "info"]
            equal: [namespace]
          - target_matchers: [alertname = "InfoInhibitor"]
      alertmanagerSpec:
        # Selects the Discord AlertmanagerConfig in base/monitoring; the chart's
        # default empty selector selects nothing.
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: discord
        # Otherwise the operator limits that route to namespace=monitoring alerts.
        alertmanagerConfigMatcherStrategy:
          type: None
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Alert Manager"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: alert-circle
        hosts:
          - &am am.${SECRET_DOMAIN}
        tls:
          - secretName: *am
            hosts:
              - *am
        pathType: Prefix
    kube-state-metrics:
      # Gateway API generation series; the config and alerts are in
      # ../../base/monitoring/gateway-api-generation.yaml.
      customResourceState:
        enabled: true
        create: false
        name: kube-state-metrics-gateway-api
      rbac:
        # The chart grants RBAC only for built-in collectors; without these the
        # custom-resource config exports nothing.
        extraRules:
          - apiGroups: [gateway.networking.k8s.io]
            resources: [gateways, httproutes]
            verbs: [list, watch]
    prometheus-node-exporter:
      # Host services drop .prom files in /var/lib/prometheus-node-exporter-text-files.
      # extraArgs replaces the chart defaults, so keep its two filesystem excludes.
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
        - --collector.textfile.directory=/host/root/var/lib/prometheus-node-exporter-text-files
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              targetLabel: instance
