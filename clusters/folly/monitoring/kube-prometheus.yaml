---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
  namespace: monitoring
spec:
  interval: 24h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    # Nested, not `kubelet.enabled:` — a dotted key is one literal value the
    # chart never reads, so the toggle silently does nothing.
    #
    # Kubelet carries cAdvisor, so every container_* series and with it the
    # whole k8s-resources dashboard set depends on it. The other three expose
    # no reachable endpoint here, and defaultRules already drops their alerts.
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    prometheus:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Prometheus"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: torch
        hosts:
          - &prom prom.${SECRET_DOMAIN}
        tls:
          - secretName: *prom
            hosts:
              - *prom
        pathType: Prefix
      prometheusSpec:
        serviceDiscoveryRole: EndpointSlice
        retention: 30d
        # riptide's /mnt/disks carries jellyfin's media hostPath as well as
        # every local-path PVC on the node, and leaves ~18G free, so the TSDB
        # needs a bound the disk can honour: filling that partition takes the
        # other claims down with it. 30d of this cluster measures ~15GiB, so
        # the two arms land close together on purpose -- 30d is the intent and
        # 16GiB is the hard stop, whichever comes first.
        retentionSize: 16GB
        # `cluster` is what tells the two sites apart once alerts land in one
        # Discord channel, and it is the variable every multi-cluster dashboard
        # in the chart groups on.
        externalLabels:
          cluster: ${CLUSTER_NAME}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  # The bound PVC is 75Gi, expanded past this. local-path
                  # enforces neither number, and a volumeClaimTemplate is
                  # immutable without recreating the StatefulSet, so the two
                  # stay apart: retentionSize is the real bound.
                  storage: 50Gi
    grafana:
      admin:
        existingSecret: grafana-admin-user
        userKey: user
        passwordKey: password
      grafana.ini:
        feature_toggles:
          publicDashboards: true
      plugins:
        - grafana-mqtt-datasource
        - victoriametrics-logs-datasource
      additionalDataSources:
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          isDefault: false
          access: proxy
          url: http://victoria-logs-server.monitoring.svc.cluster.local:9428
          orgId: 1
          version: 1
        - name: Tempo
          type: tempo
          uid: tempo
          isDefault: false
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          orgId: 1
          version: 1
          jsonData:
            tracesToLogs:
              datasourceUid: victorialogs
              filterByTraceID: false
              tags:
                - key: pod
                  value: pod
        - name: FlameBoss
          type: grafana-mqtt-datasource
          orgId: 1
          version: 1
          jsonData:
            tlsSkipVerify: true
            uri: tls://s4.myflameboss.com:8883
            username: ${SECRET_FLAMEBOSS_USERNAME}
          secureJsonData:
            password: ${SECRET_FLAMEBOSS_PASSWORD}
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      downloadDashboardsImage:
        repository: jonpulsifer/bashcurljq
        tag: latest
      # https://github.com/grafana/helm-charts/pull/3698
      initChownData:
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            add: ["CHOWN", "DAC_READ_SEARCH"]
      dashboards:
        default:
          client-dpi:
            gnetId: 11310
            revision: 5
            datasource: Prometheus
          network-sites:
            gnetId: 11311
            revision: 5
            datasource: Prometheus
          usw-insights:
            gnetId: 11312
            revision: 9
            datasource: Prometheus
          usg-insights:
            gnetId: 11313
            revision: 9
            datasource: Prometheus
          uap-insights:
            gnetId: 11314
            revision: 10
            datasource: Prometheus
          client-insights:
            gnetId: 11315
            revision: 9
            datasource: Prometheus
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Grafana"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: chart-line
        hosts:
          - &grafana grafana.${SECRET_DOMAIN}
        tls:
          - secretName: *grafana
            hosts:
              - *grafana
        pathType: Prefix
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
    alertmanager:
      # The chart's stock route sends everything to a receiver named "null",
      # which accepts alerts and discards them. Without this block the whole
      # pipeline runs and notifies nobody.
      config:
        route:
          group_by: [cluster, namespace, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          # Anything the AlertmanagerConfig sub-route does not take lands here.
          receiver: "null"
          routes:
            # Watchdog fires forever by design — it means the pipeline is alive.
            # Delivering it twice a day trains the channel to ignore itself, and
            # its absence is the signal, which Discord cannot show anyway.
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: "null"
        inhibit_rules:
          - source_matchers: [severity = "critical"]
            target_matchers: [severity =~ "warning|info"]
            equal: [namespace, alertname]
          - source_matchers: [severity = "warning"]
            target_matchers: [severity = "info"]
            equal: [namespace, alertname]
          - source_matchers: [alertname = "InfoInhibitor"]
            target_matchers: [severity = "info"]
            equal: [namespace]
          - target_matchers: [alertname = "InfoInhibitor"]
      alertmanagerSpec:
        # The Discord receiver is an AlertmanagerConfig in base/monitoring. The
        # operator merges only the ones it can select, and the chart's default
        # selector is empty, which selects nothing.
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: discord
        # Otherwise the operator pins that config's route to alerts labelled
        # namespace=monitoring, and nothing else ever reaches Discord.
        alertmanagerConfigMatcherStrategy:
          type: None
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Alert Manager"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: alert-circle
        hosts:
          - &am am.${SECRET_DOMAIN}
        tls:
          - secretName: *am
            hosts:
              - *am
        pathType: Prefix
    prometheus-node-exporter:
      # A host service that wants metrics scraped drops a .prom file in
      # /var/lib/prometheus-node-exporter-text-files -- the same directory
      # nix/services/spore-native-boot.nix already uses, so the fleet has one
      # drop box and not one per exporter -- and this picks it up, labelled
      # with the node it came from. That is how bosun on riptide is scraped: its unit
      # carries an IPAddressDeny every skiff inherits, so a listener in-cluster
      # Prometheus could reach would open the pod CIDR to job code as well.
      #
      # Reached through the host-root mount the chart already makes, so this
      # needs no extra volume. extraArgs REPLACES the chart's defaults, so the
      # two filesystem excludes below are the chart's own and must stay.
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
        - --collector.textfile.directory=/host/root/var/lib/prometheus-node-exporter-text-files
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              targetLabel: instance
