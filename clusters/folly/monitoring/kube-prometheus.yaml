---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
  namespace: monitoring
spec:
  interval: 24h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.1.4
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    # Nested, not `kubelet.enabled:` — a dotted key is one literal value the
    # chart never reads, so the toggle silently does nothing.
    #
    # Kubelet carries cAdvisor, so every container_* series and with it the
    # whole k8s-resources dashboard set depends on it. The other three expose
    # no reachable endpoint here, and defaultRules already drops their alerts.
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    prometheus:
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Prometheus"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: torch
        hosts:
          - &prom prom.${SECRET_DOMAIN}
        tls:
          - secretName: *prom
            hosts:
              - *prom
        pathType: Prefix
      prometheusSpec:
        serviceDiscoveryRole: EndpointSlice
        retention: 30d
        retentionSize: 40GB
        # `cluster` is what tells the two sites apart once alerts land in one
        # Discord channel, and it is the variable every multi-cluster dashboard
        # in the chart groups on.
        externalLabels:
          cluster: ${CLUSTER_NAME}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
    grafana:
      admin:
        existingSecret: grafana-admin-user
        userKey: user
        passwordKey: password
      grafana.ini:
        feature_toggles:
          publicDashboards: true
      plugins:
        - grafana-mqtt-datasource
      deleteDatasources:
        - name: Loki
          orgId: 1
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          isDefault: false
          access: proxy
          url: https://loki.${SECRET_DOMAIN}
          orgId: 1
          version: 1
          jsonData:
            httpHeaderName1: "X-Scope-OrgID"
          secureJsonData:
            httpHeaderValue1: "1"
        - name: Tempo
          type: tempo
          uid: tempo
          isDefault: false
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          orgId: 1
          version: 1
          jsonData:
            tracesToLogs:
              datasourceUid: loki
              filterByTraceID: false
              tags:
                - key: pod
                  value: pod
        - name: FlameBoss
          type: grafana-mqtt-datasource
          orgId: 1
          version: 1
          jsonData:
            tlsSkipVerify: true
            uri: tls://s4.myflameboss.com:8883
            username: ${SECRET_FLAMEBOSS_USERNAME}
          secureJsonData:
            password: ${SECRET_FLAMEBOSS_PASSWORD}
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      downloadDashboardsImage:
        repository: jonpulsifer/bashcurljq
        tag: latest
      # https://github.com/grafana/helm-charts/pull/3698
      initChownData:
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            add: ["CHOWN", "DAC_READ_SEARCH"]
      dashboards:
        default:
          client-dpi:
            gnetId: 11310
            revision: 5
            datasource: Prometheus
          network-sites:
            gnetId: 11311
            revision: 5
            datasource: Prometheus
          usw-insights:
            gnetId: 11312
            revision: 9
            datasource: Prometheus
          usg-insights:
            gnetId: 11313
            revision: 9
            datasource: Prometheus
          uap-insights:
            gnetId: 11314
            revision: 10
            datasource: Prometheus
          client-insights:
            gnetId: 11315
            revision: 9
            datasource: Prometheus
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Grafana"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: chart-line
        hosts:
          - &grafana grafana.${SECRET_DOMAIN}
        tls:
          - secretName: *grafana
            hosts:
              - *grafana
        pathType: Prefix
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
    alertmanager:
      # The chart's stock route sends everything to a receiver named "null",
      # which accepts alerts and discards them. Without this block the whole
      # pipeline runs and notifies nobody.
      config:
        route:
          group_by: [cluster, namespace, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: discord
          routes:
            # Watchdog fires forever by design — it means the pipeline is alive.
            # Delivering it twice a day trains the channel to ignore itself, and
            # its absence is the signal, which Discord cannot show anyway.
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: "null"
          - name: discord
            discord_configs:
              # Read from the mounted file so the URL never lands in this
              # HelmRelease, the rendered manifest, or the wiki.
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                send_resolved: true
        inhibit_rules:
          - source_matchers: [severity = "critical"]
            target_matchers: [severity =~ "warning|info"]
            equal: [namespace, alertname]
          - source_matchers: [severity = "warning"]
            target_matchers: [severity = "info"]
            equal: [namespace, alertname]
          - source_matchers: [alertname = "InfoInhibitor"]
            target_matchers: [severity = "info"]
            equal: [namespace]
          - target_matchers: [alertname = "InfoInhibitor"]
      alertmanagerSpec:
        # Mounts at /etc/alertmanager/secrets/<name>/, which is what
        # webhook_url_file above reads.
        secrets:
          - alertmanager-discord
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
          hajimari.io/appName: "Alert Manager"
          hajimari.io/group: "Monitoring"
          hajimari.io/icon: alert-circle
        hosts:
          - &am am.${SECRET_DOMAIN}
        tls:
          - secretName: *am
            hosts:
              - *am
        pathType: Prefix
    prometheus-node-exporter:
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              targetLabel: instance
