---
# Tempo receives OTLP traces from the local OpenTelemetry Collector. Traces
# stay on folly; folly's Grafana reads them in-cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: tempo
      version: 1.24.4
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    tempo:
      multitenancyEnabled: false
      reportingEnabled: false
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      storage:
        type: filesystem
      traces_storage:
        path: /var/tempo/traces
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClassName: local-path
      accessModes: ["ReadWriteOnce"]
      size: 10Gi