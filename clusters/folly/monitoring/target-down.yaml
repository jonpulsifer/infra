---
# The chart's TargetDown without the Windows desktops, which are off by design.
# windows-exporters.yaml alerts on a desktop agent that is broken.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: target-down
  namespace: monitoring
  labels:
    release: prom-stack
spec:
  groups:
    - name: target-down
      rules:
        - alert: TargetDown
          expr: |
            100 * (
              count by (cluster, job, namespace, service) (up{job!="windows-exporter"} == 0)
                /
              count by (cluster, job, namespace, service) (up{job!="windows-exporter"})
            ) > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            description: '{{ printf "%.4g" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} namespace are down.'
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/targetdown
            summary: One or more targets are unreachable.
