---
# Office phone alerts: the PBX, its carrier trunks and the handset lines. Every
# alert waits five minutes, because a PBX rollout drops the handset for up to a minute.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pbx
  namespace: monitoring
  labels:
    release: prom-stack
spec:
  groups:
    - name: pbx
      rules:
        - alert: PBXDown
          # `sum by` gives both halves one label set. Asterisk exports the other
          # alerts' series, so only absent() sees a PBX that is gone.
          expr: sum by (namespace, job) (up{namespace="pbx", job="pbx-metrics"}) == 0 or absent(up{namespace="pbx", job="pbx-metrics"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: The folly PBX is down — the office phone has no lines
            description: "Prometheus has had no metrics from the PBX for five minutes. The trunk and handset alerts cannot fire while this does — their series come from the PBX itself — so all four office lines, 911 included, should be assumed dead. Check the pbx Deployment in the pbx namespace; the asterisk container logs say why it stopped. https://wiki.lolwtf.ca/runbooks/operate-the-office-phone/"
        - alert: PBXTrunkNotRegistered
          expr: asterisk_pjsip_outbound_registration_status{namespace="pbx"} != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            message: "Trunk {{ $labels.username }} is not registered"
            description: "Registration status is {{ $value }} (0 unregistered, 2 rejected by the carrier) and has been for five minutes, so calls to this sub-account's DID reach nothing. 2 means the carrier refused the credentials — check the password in 1Password item \"voip.ms sub accounts\". 0 is usually the network. https://wiki.lolwtf.ca/runbooks/operate-the-office-phone/"
        - alert: PBXHandsetOffline
          expr: asterisk_endpoints_state{namespace="pbx", resource=~"line[1-4]"} != 2
          for: 5m
          labels:
            severity: warning
          annotations:
            message: "Office handset {{ $labels.resource }} is not registered to the PBX"
            description: "That line of the office SPA504G has not been registered for five minutes, so its DID rings nobody. Every line down at once is the phone itself — power, network, or its profile, which is what points it at the PBX. https://wiki.lolwtf.ca/runbooks/operate-the-office-phone/"
