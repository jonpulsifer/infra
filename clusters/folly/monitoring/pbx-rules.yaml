---
# The office phone line runs through the folly PBX (clusters/folly/apps/pbx),
# and every way it breaks is silent from the desk: the handset shows nothing
# until someone calls and it does not ring. These three watch it from the
# outside in — the PBX itself, its trunk to the carrier, the handset on it.
#
# PBXDown is the one the other two lean on. Asterisk exports its own series,
# so when the pod is gone there is nothing left for a `!= 1` or `!= 2` to
# compare, and those alerts read a dead PBX exactly like a healthy one. The
# `absent()` half is what catches that.
#
# Five minutes on every alert. A PBX rollout drops the handset's registration
# until its next REGISTER, which is at most a minute now that line 4
# re-registers every 60s; the trunk re-registers within seconds of boot.
# Neither should page.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pbx
  namespace: monitoring
  labels:
    release: prom-stack
spec:
  groups:
    - name: pbx
      rules:
        - alert: PBXDown
          # `sum by` gives both halves the same label set, so one alert covers
          # "scraped and failing" and "not there at all".
          expr: sum by (namespace, job) (up{namespace="pbx", job="pbx-metrics"}) == 0 or absent(up{namespace="pbx", job="pbx-metrics"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: The folly PBX is down
            description: "Prometheus has had no metrics from the PBX for five minutes. The trunk and handset alerts cannot fire while this does — their series come from the PBX itself — so the office line should be assumed dead. Check the pbx Deployment in the pbx namespace; the asterisk container logs say why it stopped."
        - alert: PBXTrunkNotRegistered
          expr: asterisk_pjsip_outbound_registration_status{namespace="pbx"} != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            message: "The PBX is not registered to {{ $labels.domain }}"
            description: "Registration status is {{ $value }} (0 unregistered, 2 rejected by the carrier) and has been for five minutes, so calls to this trunk's DID reach nothing. 2 means the carrier refused the credentials — check the sub-account password in 1Password item \"voip.ms sub accounts\". 0 is usually the network. `asterisk -C /etc/asterisk/asterisk.conf -rx 'pjsip show registrations'` in the pod shows the live state."
        - alert: PBXHandsetOffline
          expr: asterisk_endpoints_state{namespace="pbx", resource="cathy"} != 2
          for: 5m
          labels:
            severity: warning
          annotations:
            message: The office handset is not registered to the PBX
            description: "Line 4 of the office SPA504G has not been registered for five minutes. Inbound calls reach the PBX and ring nobody. Lines 1-3 go straight to voip.ms and are unaffected. Check the phone has power and network, then whether it can still fetch http://10.3.0.100/cathy.xml — its profile is what points line 4 here."
