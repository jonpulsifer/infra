# promtool tests for fleet-controller-rules.yaml, run by `mise run k8s:check-rules`.
# rule_files names the rendered PrometheusRule; kustomization.yaml omits this file.
rule_files:
  - fleet-controller.yaml

evaluation_interval: 1m

tests:
  # The controller renders a config at minute 10, and the node fetches it at minute 51.
  - interval: 1m
    input_series:
      - series: 'fleet_install_files_oldest_age_seconds{job="node-exporter",instance="spore"}'
        values: 0x9 0+60x40 0x10
    alert_rule_test:
      - eval_time: 40m
        alertname: FleetInstallPending
        exp_alerts: []
      - eval_time: 42m
        alertname: FleetInstallPending
        exp_alerts: []
      - eval_time: 44m
        alertname: FleetInstallPending
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: spore
            exp_annotations:
              message: A rendered Talos config has waited 30 minutes for its node
              description: "fleet-controller rendered a node's first config 30 minutes ago and nginx has not served it. The install failed, or the node's GET of /talos/config fails before it reaches spore: read the provision Workflow and the machine's console for a TLS or clock error. The controller deletes the config unread two hours after the render. https://wiki.lolwtf.ca/runbooks/provision-a-node/"
      - eval_time: 55m
        alertname: FleetInstallPending
        exp_alerts: []
