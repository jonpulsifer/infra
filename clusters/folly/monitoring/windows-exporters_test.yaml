---
# promtool tests for windows-exporters.yaml, run by `mise run k8s:check-rules`.
# rule_files names the rendered PrometheusRule; kustomization.yaml omits this file.
rule_files:
  - windows-exporters.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # tallboy: C: at 5% free, low but not critical.
      - series: 'windows_logical_disk_free_bytes{instance="tallboy",volume="C:",job="windows-exporter"}'
        values: 5e9x40
      - series: 'windows_logical_disk_size_bytes{instance="tallboy",volume="C:",job="windows-exporter"}'
        values: 1e11x40
      # The EFI partition at 1% free, which the volume filter must keep out.
      - series: 'windows_logical_disk_free_bytes{instance="tallboy",volume="HarddiskVolume1",job="windows-exporter"}'
        values: 1e6x40
      - series: 'windows_logical_disk_size_bytes{instance="tallboy",volume="HarddiskVolume1",job="windows-exporter"}'
        values: 1e8x40
      # atomic: 1% free.
      - series: 'windows_logical_disk_free_bytes{instance="atomic",volume="C:",job="windows-exporter"}'
        values: 1e9x40
      - series: 'windows_logical_disk_size_bytes{instance="atomic",volume="C:",job="windows-exporter"}'
        values: 1e11x40
      # tallboy is out of RAM; atomic has plenty.
      - series: 'windows_memory_available_bytes{instance="tallboy",job="windows-exporter"}'
        values: 1e9x40
      - series: 'windows_memory_physical_total_bytes{instance="tallboy",job="windows-exporter"}'
        values: 1e11x40
      - series: 'windows_memory_available_bytes{instance="atomic",job="windows-exporter"}'
        values: 5e10x40
      - series: 'windows_memory_physical_total_bytes{instance="atomic",job="windows-exporter"}'
        values: 1e11x40
      # One collector failing while the rest of the scrape succeeds.
      - series: 'windows_exporter_collector_success{instance="tallboy",collector="gpu",job="windows-exporter"}'
        values: 0x40
      - series: 'windows_exporter_collector_success{instance="tallboy",collector="cpu",job="windows-exporter"}'
        values: 1x40
    alert_rule_test:
      - eval_time: 29m
        alertname: WindowsDiskFillingUp
        exp_alerts: []
      - eval_time: 31m
        alertname: WindowsDiskFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: atomic
              volume: "C:"
              job: windows-exporter
            exp_annotations:
              message: "atomic volume C: is 1% free"
              description: "Windows gets unpleasant below about 10% free on the system volume — search indexing, update staging and hibernation all need headroom."
          - exp_labels:
              severity: warning
              instance: tallboy
              volume: "C:"
              job: windows-exporter
            exp_annotations:
              message: "tallboy volume C: is 5% free"
              description: "Windows gets unpleasant below about 10% free on the system volume — search indexing, update staging and hibernation all need headroom."
      # Only atomic is below 3%; tallboy's EFI partition stays out.
      - eval_time: 16m
        alertname: WindowsDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: atomic
              volume: "C:"
              job: windows-exporter
            exp_annotations:
              message: "atomic volume C: is 1% free"
              description: "Below 3% free. Windows Update will fail and the pagefile cannot grow."
      - eval_time: 21m
        alertname: WindowsMemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: tallboy
              job: windows-exporter
            exp_annotations:
              message: tallboy has 1% of RAM available
              description: "Sustained low available memory. Check the process collector or Task Manager for a leak."
      - eval_time: 16m
        alertname: WindowsCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: tallboy
              collector: gpu
              job: windows-exporter
            exp_annotations:
              message: "tallboy: windows_exporter collector gpu is failing"
              description: "Usually a missing or corrupted performance counter. `lodctr /R` from an elevated prompt rebuilds the counter registry."

  # OhmGraphite sensors.
  - interval: 1m
    input_series:
      # tallboy is cooking, with a dead CPU fan.
      - series: 'ohm_cpu_celsius{instance="tallboy",hardware="AMD Ryzen 9",sensor="CPU Package",hw_instance="0",job="windows-exporter"}'
        values: 95x40
      - series: 'ohm_gpunvidia_celsius{instance="tallboy",hardware="NVIDIA RTX",sensor="GPU Hot Spot",hw_instance="0",job="windows-exporter"}'
        values: 92x40
      - series: 'ohm_superio_revolutions_per_minute{instance="tallboy",hardware="Nuvoton",sensor="Fan #1",hw_instance="0",job="windows-exporter"}'
        values: 0x40
      - series: 'ohm_hdd_celsius{instance="tallboy",hardware="Samsung 990 PRO",sensor="Temperature",hw_instance="0",job="windows-exporter"}'
        values: 75x40
      # Static SMART thresholds in the same family, above 70; the sensor filter
      # must keep them out.
      - series: 'ohm_hdd_celsius{instance="tallboy",hardware="Samsung 990 PRO",sensor="Critical Temperature",hw_instance="0",job="windows-exporter"}'
        values: 85x40
      - series: 'ohm_hdd_celsius{instance="tallboy",hardware="Samsung 990 PRO",sensor="Warning Temperature",hw_instance="0",job="windows-exporter"}'
        values: 82x40
      # atomic idles with a semi-passive curve, so its stopped fan is normal.
      - series: 'ohm_cpu_celsius{instance="atomic",hardware="Intel Core i7",sensor="CPU Package",hw_instance="0",job="windows-exporter"}'
        values: 40x40
      - series: 'ohm_superio_revolutions_per_minute{instance="atomic",hardware="ITE",sensor="Fan #1",hw_instance="0",job="windows-exporter"}'
        values: 0x40
      - series: 'ohm_hdd_celsius{instance="atomic",hardware="Crucial MX500",sensor="Temperature",hw_instance="0",job="windows-exporter"}'
        values: 35x40
    alert_rule_test:
      - eval_time: 11m
        alertname: WindowsCpuTempHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: tallboy
            exp_annotations:
              message: tallboy CPU is at 95C
              description: "Sustained above 90C. Expect thermal throttling; check the fan curve and the dust."
      # A __name__ regex finds ohm_gpunvidia_celsius; a wildcard metric name is
      # not valid PromQL.
      - eval_time: 11m
        alertname: WindowsGpuTempHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: tallboy
            exp_annotations:
              message: tallboy GPU is at 92C
              description: "Sustained above 88C. Hot Spot runs well above Core — a widening gap between them is degraded thermal paste."
      # Both hosts have a stopped fan; only the hot one is a fault.
      - eval_time: 11m
        alertname: WindowsFanStopped
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: tallboy
              hardware: Nuvoton
              sensor: "Fan #1"
              hw_instance: "0"
              job: windows-exporter
            exp_annotations:
              message: "tallboy fan Fan #1 reads 0 RPM while the CPU is above 70C"
              description: "Zero RPM is normal in a semi-passive curve, so this only fires once the CPU is already hot."
      - eval_time: 16m
        alertname: WindowsStorageTempHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: tallboy
              hardware: Samsung 990 PRO
            exp_annotations:
              message: tallboy drive Samsung 990 PRO is at 75C
              description: "NVMe drives throttle around 70C and shorten their life well before that."
