# Install alerts on the series apps/fleet-controller exports. spore's fleet-controller-metrics
# timer copies the controller's /metrics into its node exporter's textfile collector
# (nix/services/fleet-controller.nix), so the series carry job="node-exporter".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fleet-controller
  namespace: monitoring
  labels:
    lolwtf.ca/service: fleet-controller
    release: prom-stack
spec:
  groups:
    - name: fleet-controller
      rules:
        # An install reboots into the disk within minutes and fetches its config on first boot.
        # The controller deletes a config unread after its TTL, two hours, so the alert clears then.
        - alert: FleetInstallPending
          expr: max by (instance) (fleet_install_files_oldest_age_seconds{job="node-exporter"}) > 1800
          for: 2m
          labels:
            severity: warning
          annotations:
            message: A rendered Talos config has waited 30 minutes for its node
            description: "fleet-controller rendered a node's first config 30 minutes ago and nginx has not served it. The install failed, or the node's GET of /talos/config fails before it reaches spore: read the provision Workflow and the machine's console for a TLS or clock error. The controller deletes the config unread two hours after the render. https://wiki.lolwtf.ca/runbooks/provision-a-node/"
