apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: forge
  namespace: monitoring
  labels:
    kubernetes.io/service-name: forge
    lolwtf.ca/service: coredns
addressType: IPv4
ports:
  - name: dns-metrics
    port: 9253
    protocol: TCP
  - name: openbao
    port: 8200
    protocol: TCP
endpoints:
  - addresses: ["${FORGE_IP}"]
    nodeName: forge
--- # trivy:ignore:avd-ksv-0108
apiVersion: v1
kind: Service
metadata:
  name: forge
  namespace: monitoring
  labels:
    lolwtf.ca/service: coredns
    jobLabel: coredns
spec:
  ports:
    - name: dns-metrics
      port: 9253
      protocol: TCP
      targetPort: 9253
    - name: openbao
      port: 8200
      protocol: TCP
      targetPort: 8200
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forge
  namespace: monitoring
  labels:
    lolwtf.ca/service: coredns
    release: prom-stack
spec:
  jobLabel: jobLabel
  endpoints:
    - port: dns-metrics
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
          targetLabel: instance
    # OpenBao serves its metrics on the API port, with no token (nix/services/openbao.nix). The
    # certificate names forge.lolwtf.ca and the target is the address, so TLS checks the name.
    - port: openbao
      scheme: https
      path: /v1/sys/metrics
      params:
        format: [prometheus]
      interval: 30s
      tlsConfig:
        serverName: forge.lolwtf.ca
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
          targetLabel: instance
  selector:
    matchLabels:
      lolwtf.ca/service: coredns
  namespaceSelector:
    matchNames:
      - monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge
  namespace: monitoring
  labels:
    lolwtf.ca/service: coredns
    release: prom-stack
spec:
  groups:
    - name: forge
      rules:
        - alert: PrometheusTargetMissing
          expr: (up{endpoint="dns-metrics", namespace="monitoring", service="forge"} == 0) or absent(up{endpoint="dns-metrics", namespace="monitoring", service="forge"})
          for: 1m
          labels:
            severity: critical
          annotations:
            message: Prometheus target missing (instance {{ $labels.instance }})
            description: "A Prometheus target has disappeared. An exporter might be crashed.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: ForgeCoreDnsDown
          expr: (node_systemd_unit_state{instance="forge", name="coredns.service", state="active"} == 0) or absent(node_systemd_unit_state{instance="forge", name="coredns.service", state="active"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: CoreDNS sinkhole on forge is down
            description: "coredns.service is not active on forge. One of the three DNS anchors is unavailable."
        - alert: ForgeOpenBaoMetricsMissing
          expr: (up{endpoint="openbao", namespace="monitoring", service="forge"} == 0) or absent(up{endpoint="openbao", namespace="monitoring", service="forge"})
          for: 5m
          labels:
            severity: warning
          annotations:
            message: OpenBao metrics target missing (instance {{ $labels.instance }})
            description: "Prometheus cannot scrape OpenBao on forge. The server may be down, sealed before it listens, or its certificate may not name forge.lolwtf.ca."
        - alert: ForgeOpenBaoDown
          expr: (node_systemd_unit_state{instance="forge", name="openbao.service", state="active"} == 0) or absent(node_systemd_unit_state{instance="forge", name="openbao.service", state="active"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: OpenBao on forge is down
            description: "openbao.service is not active on forge. Nothing can be issued from the lab's CA until it is back."
        - alert: ForgeOpenBaoSealed
          expr: vault_core_unsealed{endpoint="openbao", service="forge"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            message: OpenBao on forge is sealed
            description: "The server runs but cannot read its storage. The pkcs11 seal could not use the YubiKey: check pcscd, the card in forge's USB port, and the PIN in forge's SOPS file (docs/runbooks/initialize-openbao.md)."
        - alert: ForgeChronyDown
          expr: (node_systemd_unit_state{instance="forge", name="chronyd.service", state="active"} == 0) or absent(node_systemd_unit_state{instance="forge", name="chronyd.service", state="active"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: NTP server on forge is down
            description: "chronyd.service is not active on forge. Clients configured to use time.lolwtf.ca have lost one of the three NTP anchors."
