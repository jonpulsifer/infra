# Scrapes CoreDNS's metrics through ns1 and ns2. A target that answers proves the VIP has a holder
# and its CoreDNS runs; AnchorVipDown fires when neither is true. The AnchorBoot and AnchorS3
# alerts read the boot and S3 VIPs' state from each anchor's node exporter
# (local-node-exporters.yaml).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: anchor-vips
  namespace: monitoring
  labels:
    kubernetes.io/service-name: anchor-vips
    lolwtf.ca/service: anchor-vips
addressType: IPv4
ports:
  - name: dns-metrics
    port: 9253
    protocol: TCP
endpoints:
  - addresses: ["${NS1_IP}"]
    nodeName: ns1
  - addresses: ["${NS2_IP}"]
    nodeName: ns2
--- # trivy:ignore:avd-ksv-0108
apiVersion: v1
kind: Service
metadata:
  name: anchor-vips
  namespace: monitoring
  labels:
    lolwtf.ca/service: anchor-vips
    jobLabel: anchor-vips
spec:
  ports:
    - name: dns-metrics
      port: 9253
      protocol: TCP
      targetPort: 9253
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: anchor-vips
  namespace: monitoring
  labels:
    lolwtf.ca/service: anchor-vips
    release: prom-stack
spec:
  jobLabel: jobLabel
  endpoints:
    - port: dns-metrics
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
          targetLabel: instance
  selector:
    matchLabels:
      lolwtf.ca/service: anchor-vips
  namespaceSelector:
    matchNames:
      - monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: anchor-vips
  namespace: monitoring
  labels:
    lolwtf.ca/service: anchor-vips
    release: prom-stack
spec:
  groups:
    - name: anchor-vips
      rules:
        - alert: AnchorVipDown
          expr: (up{namespace="monitoring", service="anchor-vips"} == 0) or absent(up{namespace="monitoring", service="anchor-vips", instance="ns1"}) or absent(up{namespace="monitoring", service="anchor-vips", instance="ns2"})
          for: 2m
          labels:
            severity: critical
          annotations:
            message: "Anchor VIP {{ $labels.instance }} does not answer"
            description: "No anchor holds the VIP, or the holder's CoreDNS is down. Check keepalived and coredns on capsule, forge and spore (nix/services/anchor-vips.nix)."
        # Garage's admin API listens on loopback, so each anchor's node exporter
        # reports whether it holds the S3 VIP and passes the check keepalived
        # tracks (nix/services/anchor-vips.nix).
        - alert: AnchorS3VipDown
          expr: (count((garage_s3_vip_held == 1) and on (instance) (garage_s3_serving == 1)) or vector(0)) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            message: No anchor serves Garage at the S3 VIP
            description: "No anchor holds the S3 VIP while Garage has a quorum and answers S3, so folly's backups cannot write. Check keepalived and garage on capsule, forge and spore (nix/services/anchor-vips.nix, nix/services/garage.nix)."
        # The cluster cannot reach the bootstrap VLAN, so each anchor's node
        # exporter reports whether it holds the boot VIP and passes the check
        # keepalived tracks (nix/services/talos-boot.nix).
        - alert: AnchorBootVipDown
          expr: (count((talos_boot_vip_held == 1) and on (instance) (talos_boot_serving == 1)) or vector(0)) < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            message: No anchor serves the Talos boot files at the boot VIP
            description: "No anchor holds the boot VIP while dnsmasq runs and nginx serves HookOS, so firmware on the bootstrap VLAN cannot load the signed iPXE. Check keepalived, dnsmasq and nginx on capsule, forge and spore (nix/services/anchor-vips.nix, nix/services/talos-boot.nix)."
        - alert: AnchorBootNotServing
          expr: (talos_boot_serving == 0) or absent(talos_boot_serving{instance="capsule"}) or absent(talos_boot_serving{instance="forge"}) or absent(talos_boot_serving{instance="spore"})
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "Anchor {{ $labels.instance }} does not serve the Talos boot files"
            description: "dnsmasq is down, nginx does not serve HookOS at the anchor's bootstrap address, or the anchor exports no talos-boot-check metrics. The boot VIP skips this anchor."
        # The boot VIP's second check: nginx serves the enrollment name with a
        # certificate Talos trusts (nix/services/talos-boot.nix).
        - alert: AnchorBootHttpsVipDown
          expr: (count((talos_boot_vip_held == 1) and on (instance) (talos_boot_https_serving == 1)) or vector(0)) < 1
          for: 5m
          labels:
            severity: warning
          annotations:
            message: No anchor serves the enrollment name at the boot VIP
            description: "No anchor holds the boot VIP while nginx serves the enrollment name with a trusted certificate, so HookOS cannot attest or post its intake and an installed node cannot fetch its config. Check keepalived, nginx and the ACME renewal on capsule, forge and spore (nix/services/anchor-vips.nix, nix/services/talos-boot.nix)."
        - alert: AnchorBootHttpsNotServing
          expr: (talos_boot_https_serving == 0) or absent(talos_boot_https_serving{instance="capsule"}) or absent(talos_boot_https_serving{instance="forge"}) or absent(talos_boot_https_serving{instance="spore"})
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "Anchor {{ $labels.instance }} does not serve the enrollment name"
            description: "nginx has no trusted certificate for the enrollment name, or the anchor exports no talos-boot-check metrics. The boot VIP skips this anchor."
        - alert: AnchorBootMirrorStale
          expr: time() - talos_boot_mirror_last_success_timestamp_seconds > 6 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "The Talos boot mirror on {{ $labels.instance }} has not verified a release for 6 hours"
            description: "talos-boot-mirror.service fails, or has never succeeded. The anchor serves its last verified release. A Talos version bump fails the mirror until that version's release exists."
        - alert: AnchorBootReleasesDiffer
          expr: count(count by (release) (talos_boot_uki_info{slot="current"})) > 1
          for: 3h
          labels:
            severity: warning
          annotations:
            message: The anchors serve different Talos boot releases
            description: "The anchors' current boot files differ, so a boot VIP failover changes the ISO, iPXE or HookOS a machine boots. Read talos_boot_uki_info and each anchor's talos-boot-mirror.service journal."
        # talos-attest on each anchor (nix/services/talos-attest.nix). A machine's current record is
        # the newest across the anchors, since each keeps the attestations it ran.
        - alert: TalosAttestNotServing
          expr: talos_attest_serving == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "talos-attest on {{ $labels.instance }} does not answer"
            description: "talos-attest.service is down or refuses to start, often for a missing or unreadable DevID CA key. A machine attested through this anchor's boot VIP fails. Read journalctl -u talos-attest on the anchor."
        - alert: TalosAttestQuarantined
          expr: (talos_attest_machine_status{status="quarantined"} == 1) and on (instance, machine) (talos_attest_record_updated_timestamp_seconds == on (machine) group_left max by (machine) (talos_attest_record_updated_timestamp_seconds))
          labels:
            severity: critical
          annotations:
            message: "{{ $labels.machine }} failed attestation and is quarantined"
            description: "talos-attest refused {{ $labels.machine }} on {{ $labels.instance }}, and its LDevID is withdrawn. Read the reason in GET /machines on the anchor's admin API or in /var/lib/talos-attest/verdicts.jsonl, as docs/runbooks/provision-a-node.md says."
        - alert: TalosAttestWaitingForApproval
          expr: (talos_attest_machine_status{status="pending-approval"} == 1) and on (instance, machine) (talos_attest_record_updated_timestamp_seconds == on (machine) group_left max by (machine) (talos_attest_record_updated_timestamp_seconds))
          labels:
            severity: warning
          annotations:
            message: "{{ $labels.machine }} waits for the owner to approve its EK on first intake"
            description: "Neither machines.yaml nor NetBox pins {{ $labels.machine }}'s EK hash. Approve it on {{ $labels.instance }}'s admin API, as docs/runbooks/provision-a-node.md says."
        # The intake window is the owner's statement that boxes are being racked; a batch takes an
        # hour or two, so a window open for six hours was forgotten.
        - alert: TalosAttestIntakeOpen
          expr: talos_attest_intake_open == 1
          for: 6h
          labels:
            severity: warning
          annotations:
            message: "The intake window on {{ $labels.instance }} has been open for 6 hours"
            description: "talos-attest on {{ $labels.instance }} admits boxes under the {{ $labels.policy }} intake policy. Close the window with mise run fleet:intake close when racking is done."
        # tpm-reattest renews an LDevID from 30 days before its expiry, once a day, so
        # this fires only after a week of failed renewals. One anchor serves a renewal
        # and the others keep the old record, so the newest expiry counts.
        - alert: TalosAttestLDevIDExpiring
          expr: max by (machine) (talos_attest_ldevid_expiry_timestamp_seconds) - time() < 23 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            message: "{{ $labels.machine }}'s LDevID expires within 23 days"
            description: "tpm-reattest has not renewed {{ $labels.machine }}'s LDevID. Read its log in the spire namespace, or attest the machine again, before the LDevID expires and its SPIRE agent falls back to the EK attestor."
        # tpm-reattest sends a LAK-signed quote every day, the daily check or a renewal, and the
        # newest pass across the anchors counts. A missing TPM, a transport error and a timeout never
        # quarantine; they land here. Only machines that are Kubernetes nodes count, so a retired
        # machine's record stays quiet.
        - alert: TalosAttestNotChecked
          expr: (time() - max by (machine) (talos_attest_last_checked_timestamp_seconds) > 26 * 3600) and on (machine) label_replace(kube_node_info, "machine", "$1", "node", "(.*)")
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "{{ $labels.machine }} has not passed a TPM quote check in 26 hours"
            description: "No anchor has recorded a passing daily check of {{ $labels.machine }}. Read tpm-reattest's log on the node in the spire namespace: NO TPM is a TPM that is off or gone, RENEWAL FAILED a transport error, a timeout or a refusal. The node is not quarantined for any of these."
        # A check the node failed after its TPM's proof quarantines it, and TalosAttestQuarantined fires
        # too; one refused before the proof (a forged, replayed or foreign quote) records nothing. Each
        # fires for an hour after the newest such check on any anchor.
        - alert: TalosAttestCheckFailed
          expr: time() - max by (machine, verdict) (talos_attest_check_last_timestamp_seconds{verdict!="pass"}) < 3600
          labels:
            severity: warning
          annotations:
            message: "{{ $labels.machine }}'s daily check ended in {{ $labels.verdict }}"
            description: "quarantine: the TPM quoted a boot that misses talos-attest's renewal policy, and NetBox has the device failed. refused: evidence for its serial did not carry the proof of the LAK and LDevID on file, and nothing was recorded. Read verdicts.jsonl and journalctl -u talos-attest on the anchors."
        # The newest passing quote, on whichever anchor took it, decides. A PCR 0 change the BIOS version
        # does not explain alerts and never quarantines; the owner explains it in NetBox.
        - alert: TalosAttestPCR0Changed
          expr: (talos_attest_pcr0_changed == 1) and on (instance, machine) (talos_attest_last_checked_timestamp_seconds == on (machine) group_left max by (machine) (talos_attest_last_checked_timestamp_seconds))
          labels:
            severity: warning
          annotations:
            message: "{{ $labels.machine }}'s PCR 0 changed at the same BIOS version"
            description: "{{ $labels.machine }}'s firmware measured itself differently while it reports the BIOS version it had when NetBox recorded its PCR 0. Read the device's NetBox journal for both values. Once a firmware setting or update explains it, set that version's entry in pcr0_by_bios to the new value, and the next daily check clears this."
