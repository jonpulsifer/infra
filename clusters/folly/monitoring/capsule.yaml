apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: capsule
  namespace: monitoring
  labels:
    kubernetes.io/service-name: capsule
    lolwtf.ca/service: pihole
addressType: IPv4
ports:
  - name: http-metrics
    port: 9617
    protocol: TCP
endpoints:
  - addresses: ["10.2.0.10"]
    nodeName: capsule
--- # trivy:ignore:avd-ksv-0108
apiVersion: v1
kind: Service
metadata:
  name: capsule
  namespace: monitoring
  labels:
    lolwtf.ca/service: pihole
    jobLabel: pihole
spec:
  ports:
    - name: http-metrics
      port: 9617
      protocol: TCP
      targetPort: 9617
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capsule
  namespace: monitoring
  labels:
    lolwtf.ca/service: pihole
    release: prom-stack
spec:
  jobLabel: jobLabel
  endpoints:
    - port: http-metrics
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_endpoint_node_name]
          targetLabel: instance
  selector:
    matchLabels:
      lolwtf.ca/service: pihole
  namespaceSelector:
    matchNames:
      - monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capsule
  namespace: monitoring
  labels:
    lolwtf.ca/service: pihole
    release: prom-stack
spec:
  groups:
    - name: capsule
      rules:
        - alert: PrometheusTargetMissing
          expr: up {endpoint="http-metrics", namespace="monitoring", service="capsule"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            message: Prometheus target missing (instance {{ $labels.instance }})
            description: "A Prometheus target has disappeared. An exporter might be crashed.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: CapsuleChronyDown
          expr: (node_systemd_unit_state{instance="capsule", name="chronyd.service", state="active"} == 0) or absent(node_systemd_unit_state{instance="capsule", name="chronyd.service", state="active"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: NTP server on capsule is down
            description: "chronyd.service is not active on capsule. Clients configured to use time.lolwtf.ca have lost one half of the redundant NTP pair."
