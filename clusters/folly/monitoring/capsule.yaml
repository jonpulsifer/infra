apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: capsule
  namespace: monitoring
  labels:
    kubernetes.io/service-name: capsule
    lolwtf.ca/service: coredns
addressType: IPv4
ports:
  - name: dns-metrics
    port: 9253
    protocol: TCP
endpoints:
  - addresses: ["${CAPSULE_IP}"]
    nodeName: capsule
--- # trivy:ignore:avd-ksv-0108
apiVersion: v1
kind: Service
metadata:
  name: capsule
  namespace: monitoring
  labels:
    lolwtf.ca/service: coredns
    jobLabel: coredns
spec:
  ports:
    - name: dns-metrics
      port: 9253
      protocol: TCP
      targetPort: 9253
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capsule
  namespace: monitoring
  labels:
    lolwtf.ca/service: coredns
    release: prom-stack
spec:
  jobLabel: jobLabel
  endpoints:
    - port: dns-metrics
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
          targetLabel: instance
  selector:
    matchLabels:
      lolwtf.ca/service: coredns
  namespaceSelector:
    matchNames:
      - monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capsule
  namespace: monitoring
  labels:
    lolwtf.ca/service: coredns
    release: prom-stack
spec:
  groups:
    - name: capsule
      rules:
        - alert: PrometheusTargetMissing
          expr: (up{endpoint="dns-metrics", namespace="monitoring", service="capsule"} == 0) or absent(up{endpoint="dns-metrics", namespace="monitoring", service="capsule"})
          for: 1m
          labels:
            severity: critical
          annotations:
            message: Prometheus target missing (instance {{ $labels.instance }})
            description: "A Prometheus target has disappeared. An exporter might be crashed.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        - alert: CapsuleCoreDnsDown
          expr: (node_systemd_unit_state{instance="capsule", name="coredns.service", state="active"} == 0) or absent(node_systemd_unit_state{instance="capsule", name="coredns.service", state="active"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: CoreDNS sinkhole on capsule is down
            description: "coredns.service is not active on capsule. One of the three DNS anchors is unavailable."
        - alert: CapsuleChronyDown
          expr: (node_systemd_unit_state{instance="capsule", name="chronyd.service", state="active"} == 0) or absent(node_systemd_unit_state{instance="capsule", name="chronyd.service", state="active"})
          for: 5m
          labels:
            severity: critical
          annotations:
            message: NTP server on capsule is down
            description: "chronyd.service is not active on capsule. Clients configured to use time.lolwtf.ca have lost one of the three NTP anchors."
        - alert: CapsuleNetboxDown
          expr: |
            max by (name) (node_systemd_unit_state{instance="capsule", name=~"(netbox|netbox-rq|netbox-serve|postgresql|redis-netbox)\\.service", state="active"}) == 0
            or
            absent(node_systemd_unit_state{instance="capsule", name="netbox.service", state="active"})
          for: 10m
          labels:
            severity: warning
          annotations:
            message: "{{ if $labels.name }}{{ $labels.name }}{{ else }}netbox.service{{ end }} on capsule is not active"
            description: "NetBox, its PostgreSQL, Redis or RQ worker, or the Tailscale serve that publishes it is down on capsule. The UI and API at https://capsule.<tailnet> fail, and intake that writes NetBox stops; the clusters keep running. `systemctl status` and `journalctl -u` on the unit show why."
        - alert: NetboxNodeDrift
          expr: max by (device) (netbox_drift{instance="capsule"}) == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            message: "{{ $labels.device }} differs from its NetBox device"
            description: "The hourly drift check on capsule found that {{ $labels.device }} reports a model, SKU, serial, BIOS, MAC, Secure Boot state or address that differs from NetBox, or has no NetBox device. The device's journal and `mise run inventory:check` list the differences. Fix NetBox or the node, then run `mise run netbox:export`. https://wiki.lolwtf.ca/reference/inventory/#drift"
        - alert: NetboxExportDiffers
          expr: max(netbox_export_drift{instance="capsule"}) == 1
          for: 2h
          labels:
            severity: warning
          annotations:
            message: NetBox differs from clusters/folly/inventory/machines.yaml on main
            description: "A device changed in NetBox and its export has not merged. Run `mise run netbox:export` and open a pull request with clusters/folly/inventory/machines.yaml. https://wiki.lolwtf.ca/reference/inventory/#export"
        - alert: NetboxDriftCheckStale
          expr: |
            (time() - max(netbox_drift_last_success_timestamp_seconds{instance="capsule"})) > 3 * 3600
            or
            absent(netbox_drift_last_success_timestamp_seconds{instance="capsule"})
          for: 10m
          labels:
            severity: warning
          annotations:
            message: The NetBox drift check on capsule has not finished for three hours
            description: "netbox-drift.service on capsule has not finished a run, so node drift goes unseen. `journalctl -u netbox-drift` on capsule shows why: NetBox, the Talos API or the minted os:reader certificate. https://wiki.lolwtf.ca/reference/inventory/#drift"
