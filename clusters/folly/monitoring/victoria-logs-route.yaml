---
# VictoriaLogs' write endpoint for log shippers outside the cluster. The name
# resolves to the gateway's private address, so it answers only on the LAN.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: victoria-logs-insert
  namespace: monitoring
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: default
  hostnames:
    - logs.${SECRET_DOMAIN}
  rules:
    # Only /insert: VictoriaLogs has no authentication, so /select would give
    # every LAN client read access to all logs.
    - matches:
        - path:
            type: PathPrefix
            value: /insert
      backendRefs:
        - name: victoria-logs-server
          port: 9428
