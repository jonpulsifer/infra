---
# VictoriaLogs' write endpoint, published for the log shippers that run
# outside the cluster — today the Windows desktops' Vector agents, which have
# no way to reach a ClusterIP.
#
# Only /insert is routed. VictoriaLogs single-node has no authentication of
# any kind, so routing the whole service would hand every client on every
# internal VLAN read access to all cluster logs at /select/logsql/query. The
# path match makes the exposed surface write-only; reads stay inside the
# cluster, where Grafana's datasource already reaches the Service directly.
#
# external-dns publishes this name at the gateway's RFC1918 address, the same
# as every other route here, so it resolves publicly and answers only on the
# LAN.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: victoria-logs-insert
  namespace: monitoring
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: default
  hostnames:
    - logs.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /insert
      backendRefs:
        - name: victoria-logs-server
          port: 9428
