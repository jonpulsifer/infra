# promtool tests for talos-enroll-rules.yaml, run by `mise run k8s:check-rules`.
# rule_files names the rendered PrometheusRule; kustomization.yaml omits this file.
rule_files:
  - talos-enroll.yaml

# folly's Prometheus scrapes and evaluates every 30 s.
evaluation_interval: 30s

tests:
  # A machine waits 40 minutes, through three device codes, before approval.
  # talos_enroll_pending reads 0 for one scrape at each code's expiry, as the
  # server reports it; the wait keeps growing through that gap.
  - interval: 30s
    input_series:
      - series: 'talos_enroll_pending{job="node-exporter",instance="forge"}'
        values: 1x29 0 1x29 0 1x19 0x40
      - series: 'talos_enroll_longest_wait_seconds{job="node-exporter",instance="forge"}'
        values: 0+30x80 0x40
      - series: 'talos_enroll_approved_unfetched{job="node-exporter",instance="forge"}'
        values: 0x81 1x40
    alert_rule_test:
      - eval_time: 29m
        alertname: TalosEnrollmentWaiting
        exp_alerts: []
      - eval_time: 31m
        alertname: TalosEnrollmentWaiting
        exp_alerts: []
      - eval_time: 33m
        alertname: TalosEnrollmentWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: forge
            exp_annotations:
              message: A Talos machine has waited 30 minutes for enrollment approval
              description: "A machine has asked talos-enroll for device codes for 30 minutes with no approval or denial, and it retries until one comes. Approve the code on its console with `mise run enroll:approve`, or find its uuid with `mise run enroll:pending` and deny it. https://wiki.lolwtf.ca/runbooks/provision-a-node/"
      - eval_time: 45m
        alertname: TalosEnrollmentWaiting
        exp_alerts: []
      - eval_time: 55m
        alertname: TalosEnrollmentConfigNotFetched
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: forge
            exp_annotations:
              message: An approved Talos machine has not fetched its config
              description: "talos-enroll approved a machine 10 minutes ago and has served it no config. Talos picks up the token within one poll, so the GET of /config fails before it reaches the server: check the machine's console for a TLS or clock error. https://wiki.lolwtf.ca/runbooks/provision-a-node/"

  # riptide fetched its config at 1m and never became Ready; optiplex did.
  - interval: 1m
    input_series:
      - series: 'talos_enroll_config_served_timestamp_seconds{job="node-exporter",instance="forge",node="riptide"}'
        values: 60x400
      - series: 'talos_enroll_config_served_timestamp_seconds{job="node-exporter",instance="forge",node="optiplex"}'
        values: 60x400
      - series: 'kube_node_status_condition{namespace="monitoring",job="kube-state-metrics",node="riptide",condition="Ready",status="true"}'
        values: 0x400
      - series: 'kube_node_status_condition{namespace="monitoring",job="kube-state-metrics",node="optiplex",condition="Ready",status="true"}'
        values: 0x10 1x390
    alert_rule_test:
      - eval_time: 30m
        alertname: TalosEnrolledNodeNotReady
        exp_alerts: []
      - eval_time: 40m
        alertname: TalosEnrolledNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: forge
              job: node-exporter
              node: riptide
            exp_annotations:
              message: "riptide fetched its Talos config 30 minutes ago and is not a Ready node"
              description: "The install and reboot take a few minutes. A node that is still not Ready did not install, or cannot reach the Kubernetes VLAN: check its RADIUS user and the machine's console. https://wiki.lolwtf.ca/runbooks/provision-a-node/"
      # Six hours after the fetch the alert ends, so it cannot fire forever.
      - eval_time: 370m
        alertname: TalosEnrolledNodeNotReady
        exp_alerts: []
