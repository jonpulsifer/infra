# promtool tests for talos-enroll-rules.yaml, run by `mise run k8s:check-rules`.
# rule_files names the rendered PrometheusRule; kustomization.yaml omits this file.
rule_files:
  - talos-enroll.yaml

evaluation_interval: 1m

tests:
  # A machine waits 40 minutes, through two device codes, before approval.
  - interval: 1m
    input_series:
      - series: 'talos_enroll_pending{namespace="talos-enroll",job="talos-enroll",instance="10.100.1.5:8080"}'
        values: 1x40 0x20
      - series: 'talos_enroll_approved_unfetched{namespace="talos-enroll",job="talos-enroll",instance="10.100.1.5:8080"}'
        values: 0x40 1x20
    alert_rule_test:
      - eval_time: 29m
        alertname: TalosEnrollmentWaiting
        exp_alerts: []
      - eval_time: 31m
        alertname: TalosEnrollmentWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: talos-enroll
              job: talos-enroll
            exp_annotations:
              message: A Talos machine has waited 30 minutes for enrollment approval
              description: "talos-enroll has held a device code for 30 minutes with no approval. The machine retries until someone approves or denies it. Run `mise run enroll:pending`, then approve or deny the code. https://wiki.lolwtf.ca/runbooks/enroll-a-talos-node/"
      - eval_time: 45m
        alertname: TalosEnrollmentWaiting
        exp_alerts: []
      - eval_time: 55m
        alertname: TalosEnrollmentConfigNotFetched
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: talos-enroll
              job: talos-enroll
            exp_annotations:
              message: An approved Talos machine has not fetched its config
              description: "talos-enroll approved a machine 10 minutes ago and has served it no config. Talos picks up the token within one poll, so the GET of /config fails before it reaches the server: check the machine's console for a TLS or clock error. https://wiki.lolwtf.ca/runbooks/enroll-a-talos-node/"

  # riptide fetched its config at 1m and never became Ready; optiplex did.
  - interval: 1m
    input_series:
      - series: 'talos_enroll_config_served_timestamp_seconds{namespace="talos-enroll",job="talos-enroll",node="riptide"}'
        values: 60x400
      - series: 'talos_enroll_config_served_timestamp_seconds{namespace="talos-enroll",job="talos-enroll",node="optiplex"}'
        values: 60x400
      - series: 'kube_node_status_condition{namespace="monitoring",job="kube-state-metrics",node="riptide",condition="Ready",status="true"}'
        values: 0x400
      - series: 'kube_node_status_condition{namespace="monitoring",job="kube-state-metrics",node="optiplex",condition="Ready",status="true"}'
        values: 0x10 1x390
    alert_rule_test:
      - eval_time: 30m
        alertname: TalosEnrolledNodeNotReady
        exp_alerts: []
      - eval_time: 40m
        alertname: TalosEnrolledNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: talos-enroll
              job: talos-enroll
              node: riptide
            exp_annotations:
              message: "riptide fetched its Talos config 30 minutes ago and is not a Ready node"
              description: "The install and reboot take a few minutes. A node that is still not Ready did not install, or cannot reach the Kubernetes VLAN: check its RADIUS user and the machine's console. https://wiki.lolwtf.ca/runbooks/enroll-a-talos-node/"
      # Six hours after the fetch the alert ends, so it cannot fire forever.
      - eval_time: 370m
        alertname: TalosEnrolledNodeNotReady
        exp_alerts: []
