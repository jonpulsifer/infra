# The Flame Boss exporter. The controller publishes only to Flame Boss's cloud
# MQTT, so apps/flameboss subscribes there and exports the readings.
apiVersion: v1
kind: Secret
metadata:
  name: flameboss-credentials
  namespace: monitoring
type: Opaque
stringData:
  # The T-<user_id> username from myflameboss.com/users/dev; the exporter reads
  # the account id out of it.
  username: ${SECRET_FLAMEBOSS_USERNAME}
  password: ${SECRET_FLAMEBOSS_PASSWORD}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flameboss
  namespace: monitoring
  labels:
    app.kubernetes.io/name: flameboss
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1
  # A second pod would export the same cook twice under two instance labels.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flameboss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flameboss
        app.kubernetes.io/part-of: monitoring
    spec:
      automountServiceAccountToken: false
      # A service link sets FLAMEBOSS_PORT to a tcp:// URL, which the exporter
      # reads as its MQTT port and exits on.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flameboss
          image: ghcr.io/jonpulsifer/flameboss:latest@sha256:9329858baf14f4c4e7bc65d545891dc4f21f6d736f2a2e62e8baf8802ebcbc16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: FLAMEBOSS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: flameboss-credentials
                  key: username
            - name: FLAMEBOSS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flameboss-credentials
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flameboss
  namespace: monitoring
  labels:
    lolwtf.ca/service: flameboss
    jobLabel: flameboss
spec:
  selector:
    app.kubernetes.io/name: flameboss
  ports:
    - name: http-metrics
      port: 8080
      protocol: TCP
      targetPort: http-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flameboss
  namespace: monitoring
  labels:
    lolwtf.ca/service: flameboss
    release: prom-stack
spec:
  jobLabel: jobLabel
  # At a steady pit the controller publishes about once a minute, so 30s samples
  # every reading.
  endpoints:
    - port: http-metrics
      interval: 30s
  selector:
    matchLabels:
      lolwtf.ca/service: flameboss
  namespaceSelector:
    matchNames:
      - monitoring
