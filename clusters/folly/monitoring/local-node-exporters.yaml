apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: local-node-exporters
  namespace: monitoring
  labels:
    kubernetes.io/service-name: local-node-exporters
    lolwtf.ca/service: node-exporter
addressType: IPv4
ports:
  - name: http-metrics
    port: 9100
    protocol: TCP
endpoints:
  - addresses: ["${CLOUDPI4_IP}"]
    nodeName: cloudpi4
  - addresses: ["${CAPSULE_IP}"]
    nodeName: capsule
  - addresses: ["${RADIOPI0_IP}"]
    nodeName: radiopi0
  - addresses: ["${SPORE_IP}"]
    nodeName: spore
  - addresses: ["${FORGE_IP}"]
    nodeName: forge
--- # trivy:ignore:avd-ksv-0108
apiVersion: v1
kind: Service
metadata:
  name: local-node-exporters
  namespace: monitoring
  labels:
    lolwtf.ca/service: node-exporter
    jobLabel: node-exporter
spec:
  ports:
    - name: http-metrics
      port: 9100
      protocol: TCP
      targetPort: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: local-node-exporters
  namespace: monitoring
  labels:
    lolwtf.ca/service: node-exporter
    release: prom-stack
spec:
  jobLabel: jobLabel
  endpoints:
    - port: http-metrics
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
          targetLabel: instance
  selector:
    matchLabels:
      lolwtf.ca/service: node-exporter
  namespaceSelector:
    matchNames:
      - monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: local-node-exporters
  namespace: monitoring
  labels:
    lolwtf.ca/service: node-exporter
    release: prom-stack
spec:
  groups:
    - name: local-node-exporters
      rules:
        - alert: PrometheusTargetMissing
          expr: up {endpoint="http-metrics",  namespace="monitoring", service="local-node-exporters"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            message: Prometheus target missing (instance {{ $labels.instance }})
            description: "A Prometheus target has disappeared. An exporter might be crashed.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
