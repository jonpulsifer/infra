---
# promtool tests for the S3 and boot VIP alerts in anchor-vips.yaml, run by `mise run k8s:check-rules`.
rule_files:
  - anchor-vips.yaml

evaluation_interval: 1m

tests:
  # capsule holds the S3 VIP until minute 5, when its Garage loses quorum. keepalived moves the VIP
  # to forge at minute 7. The alert stays quiet through the failover, then fires when forge's
  # Garage fails at minute 20 with no other anchor serving.
  - interval: 1m
    input_series:
      - series: 'garage_s3_vip_held{instance="capsule",site="folly"}'
        values: 1x7 0x33
      - series: 'garage_s3_serving{instance="capsule",site="folly"}'
        values: 1x5 0x35
      - series: 'garage_s3_vip_held{instance="forge",site="folly"}'
        values: 0x7 1x33
      - series: 'garage_s3_serving{instance="forge",site="folly"}'
        values: 1x20 0x20
    alert_rule_test:
      - eval_time: 15m
        alertname: AnchorS3VipDown
        exp_alerts: []
      - eval_time: 30m
        alertname: AnchorS3VipDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              message: No anchor serves Garage at the S3 VIP
              description: "No anchor holds the S3 VIP while Garage has a quorum and answers S3, so folly's backups cannot write. Check keepalived and garage on capsule, forge and spore (nix/services/anchor-vips.nix, nix/services/garage.nix)."

  # spore holds the VIP and serves until minute 10, when its nginx dies and keepalived moves the VIP
  # to capsule two minutes later. forge's check fails throughout.
  - interval: 1m
    input_series:
      - series: 'up{namespace="monitoring",service="anchor-vips",instance="ns1"}'
        values: 1x40
      - series: 'up{namespace="monitoring",service="anchor-vips",instance="ns2"}'
        values: 1x40
      - series: 'talos_boot_vip_held{instance="spore",site="folly"}'
        values: 1x11 0x29
      - series: 'talos_boot_serving{instance="spore",site="folly"}'
        values: 1x9 0x31
      - series: 'talos_boot_vip_held{instance="capsule",site="folly"}'
        values: 0x11 1x29
      - series: 'talos_boot_serving{instance="capsule",site="folly"}'
        values: 1x40
      - series: 'talos_boot_vip_held{instance="forge",site="folly"}'
        values: 0x40
      - series: 'talos_boot_serving{instance="forge",site="folly"}'
        values: 0x40
    alert_rule_test:
      - eval_time: 16m
        alertname: AnchorBootVipDown
        exp_alerts: []
      - eval_time: 30m
        alertname: AnchorBootNotServing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: forge
              site: folly
            exp_annotations:
              message: Anchor forge does not serve the Talos boot files
              description: "dnsmasq is down, nginx does not serve HookOS at the anchor's bootstrap address, or the anchor exports no talos-boot-check metrics. The boot VIP skips this anchor."
          - exp_labels:
              severity: warning
              instance: spore
              site: folly
            exp_annotations:
              message: Anchor spore does not serve the Talos boot files
              description: "dnsmasq is down, nginx does not serve HookOS at the anchor's bootstrap address, or the anchor exports no talos-boot-check metrics. The boot VIP skips this anchor."

  # The holder's check fails and no other anchor passes, so the VIP serves nothing.
  - interval: 1m
    input_series:
      - series: 'talos_boot_vip_held{instance="spore",site="folly"}'
        values: 1x20
      - series: 'talos_boot_serving{instance="spore",site="folly"}'
        values: 1x4 0x16
      - series: 'talos_boot_vip_held{instance="capsule",site="folly"}'
        values: 0x20
      - series: 'talos_boot_serving{instance="capsule",site="folly"}'
        values: 0x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AnchorBootVipDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: No anchor serves the Talos boot files at the boot VIP
              description: "No anchor holds the boot VIP while dnsmasq runs and nginx serves HookOS, so firmware on the bootstrap VLAN cannot load the signed iPXE. Check keepalived, dnsmasq and nginx on capsule, forge and spore (nix/services/anchor-vips.nix, nix/services/talos-boot.nix)."

  # forge has never mirrored a release and serves a different one from spore's.
  - interval: 1m
    input_series:
      - series: 'talos_boot_mirror_last_success_timestamp_seconds{instance="spore",site="folly"}'
        values: 0+60x400
      - series: 'talos_boot_mirror_last_success_timestamp_seconds{instance="forge",site="folly"}'
        values: 0x400
      - series: 'talos_boot_uki_info{instance="spore",site="folly",slot="current",version="v1.14.4",release="a"}'
        values: 1x400
      - series: 'talos_boot_uki_info{instance="forge",site="folly",slot="current",version="v1.14.4",release="b"}'
        values: 1x400
    alert_rule_test:
      - eval_time: 2h
        alertname: AnchorBootReleasesDiffer
        exp_alerts: []
      - eval_time: 380m
        alertname: AnchorBootMirrorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: forge
              site: folly
            exp_annotations:
              message: The Talos boot mirror on forge has not verified a release for 6 hours
              description: "talos-boot-mirror.service fails, or has never succeeded. The anchor serves its last verified release. A Talos version bump fails the mirror until that version's release exists."
      - eval_time: 380m
        alertname: AnchorBootReleasesDiffer
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: The anchors serve different Talos boot releases
              description: "The anchors' current boot files differ, so a boot VIP failover changes the ISO, iPXE or HookOS a machine boots. Read talos_boot_uki_info and each anchor's talos-boot-mirror.service journal."

  # spore holds the boot VIP and serves the enrollment name until minute 10, when its certificate
  # lapses and keepalived moves the VIP to capsule two minutes later. forge has no certificate
  # throughout.
  - interval: 1m
    input_series:
      - series: 'talos_boot_vip_held{instance="spore",site="folly"}'
        values: 1x11 0x29
      - series: 'talos_boot_https_serving{instance="spore",site="folly"}'
        values: 1x9 0x31
      - series: 'talos_boot_vip_held{instance="capsule",site="folly"}'
        values: 0x11 1x29
      - series: 'talos_boot_https_serving{instance="capsule",site="folly"}'
        values: 1x40
      - series: 'talos_boot_vip_held{instance="forge",site="folly"}'
        values: 0x40
      - series: 'talos_boot_https_serving{instance="forge",site="folly"}'
        values: 0x40
    alert_rule_test:
      - eval_time: 16m
        alertname: AnchorBootHttpsVipDown
        exp_alerts: []
      - eval_time: 30m
        alertname: AnchorBootHttpsNotServing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: forge
              site: folly
            exp_annotations:
              message: Anchor forge does not serve the enrollment name
              description: "nginx has no trusted certificate for the enrollment name, or the anchor exports no talos-boot-check metrics. The boot VIP skips this anchor."
          - exp_labels:
              severity: warning
              instance: spore
              site: folly
            exp_annotations:
              message: Anchor spore does not serve the enrollment name
              description: "nginx has no trusted certificate for the enrollment name, or the anchor exports no talos-boot-check metrics. The boot VIP skips this anchor."

  # The VIP's holder stops serving the enrollment name and no other anchor serves it.
  - interval: 1m
    input_series:
      - series: 'talos_boot_vip_held{instance="spore",site="folly"}'
        values: 1x20
      - series: 'talos_boot_https_serving{instance="spore",site="folly"}'
        values: 1x4 0x16
      - series: 'talos_boot_vip_held{instance="capsule",site="folly"}'
        values: 0x20
      - series: 'talos_boot_https_serving{instance="capsule",site="folly"}'
        values: 0x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AnchorBootHttpsVipDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: No anchor serves the enrollment name at the boot VIP
              description: "No anchor holds the boot VIP while nginx serves the enrollment name with a trusted certificate, so HookOS cannot attest or post its intake and an installed node cannot fetch its config. Check keepalived, nginx and the ACME renewal on capsule, forge and spore (nix/services/anchor-vips.nix, nix/services/talos-boot.nix)."

  # spore quarantined riptide, then capsule passed it later: the newer pass is current, so no alert.
  # optiplex's only record, on forge, is a quarantine, so it fires.
  - interval: 1m
    input_series:
      - series: 'talos_attest_machine_status{instance="spore",machine="riptide",status="quarantined"}'
        values: 1x10
      - series: 'talos_attest_record_updated_timestamp_seconds{instance="spore",machine="riptide"}'
        values: 1000x10
      - series: 'talos_attest_machine_status{instance="capsule",machine="riptide",status="quarantined"}'
        values: 0x10
      - series: 'talos_attest_record_updated_timestamp_seconds{instance="capsule",machine="riptide"}'
        values: 2000x10
      - series: 'talos_attest_machine_status{instance="forge",machine="optiplex",status="quarantined"}'
        values: 1x10
      - series: 'talos_attest_record_updated_timestamp_seconds{instance="forge",machine="optiplex"}'
        values: 1500x10
    alert_rule_test:
      - eval_time: 5m
        alertname: TalosAttestQuarantined
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: forge
              machine: optiplex
              status: quarantined
            exp_annotations:
              message: "optiplex failed attestation and is quarantined"
              description: "talos-attest refused optiplex on forge, and its LDevID is withdrawn. Read the reason in GET /machines on the anchor's admin API or in /var/lib/talos-attest/verdicts.jsonl, as docs/runbooks/provision-a-node.md says."

  # spore issued riptide's first LDevID, which nears its expiry, and capsule served the renewal: the
  # newest expiry counts, so no alert. optiplex's only LDevID, on forge, expires within 23 days.
  - interval: 1m
    input_series:
      - series: 'talos_attest_ldevid_expiry_timestamp_seconds{instance="spore",machine="riptide"}'
        values: 86400x80
      - series: 'talos_attest_ldevid_expiry_timestamp_seconds{instance="capsule",machine="riptide"}'
        values: 7776000x80
      - series: 'talos_attest_ldevid_expiry_timestamp_seconds{instance="forge",machine="optiplex"}'
        values: 86400x80
    alert_rule_test:
      - eval_time: 70m
        alertname: TalosAttestLDevIDExpiring
        exp_alerts:
          - exp_labels:
              severity: warning
              machine: optiplex
            exp_annotations:
              message: "optiplex's LDevID expires within 23 days"
              description: "tpm-reattest has not renewed optiplex's LDevID. Read its log in the spire namespace, or attest the machine again, before the LDevID expires and its SPIRE agent falls back to the EK attestor."

  # riptide's newest check, on capsule, is an hour old, so spore's 28-hour-old one does not count.
  # optiplex last passed 28 hours ago and is a node, so it fires. oldbox was retired: no node, no alert.
  - interval: 1m
    input_series:
      - series: 'talos_attest_last_checked_timestamp_seconds{instance="spore",machine="riptide"}'
        values: 0x1700
      - series: 'talos_attest_last_checked_timestamp_seconds{instance="capsule",machine="riptide"}'
        values: 97200x1700
      - series: 'talos_attest_last_checked_timestamp_seconds{instance="forge",machine="optiplex"}'
        values: 0x1700
      - series: 'talos_attest_last_checked_timestamp_seconds{instance="forge",machine="oldbox"}'
        values: 0x1700
      - series: 'kube_node_info{node="riptide"}'
        values: 1x1700
      - series: 'kube_node_info{node="optiplex"}'
        values: 1x1700
    alert_rule_test:
      - eval_time: 25h
        alertname: TalosAttestNotChecked
        exp_alerts: []
      - eval_time: 28h
        alertname: TalosAttestNotChecked
        exp_alerts:
          - exp_labels:
              severity: warning
              machine: optiplex
            exp_annotations:
              message: "optiplex has not passed a TPM quote check in 26 hours"
              description: "No anchor has recorded a passing daily check of optiplex. Read tpm-reattest's log on the node in the spire namespace: NO TPM is a TPM that is off or gone, RENEWAL FAILED a transport error, a timeout or a refusal. The node is not quarantined for any of these."

  # spore refused a check of riptide at minute 10: the alert fires for an hour, then clears. A pass
  # never fires.
  - interval: 1m
    input_series:
      - series: 'talos_attest_check_last_timestamp_seconds{instance="spore",machine="riptide",verdict="refused"}'
        values: 600x100
      - series: 'talos_attest_check_last_timestamp_seconds{instance="spore",machine="riptide",verdict="pass"}'
        values: 600x100
    alert_rule_test:
      - eval_time: 30m
        alertname: TalosAttestCheckFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              machine: riptide
              verdict: refused
            exp_annotations:
              message: "riptide's daily check ended in refused"
              description: "quarantine: the TPM quoted a boot that misses talos-attest's renewal policy, and NetBox has the device failed. refused: evidence for its serial did not carry the proof of the LAK and LDevID on file, and nothing was recorded. Read verdicts.jsonl and journalctl -u talos-attest on the anchors."
      - eval_time: 80m
        alertname: TalosAttestCheckFailed
        exp_alerts: []

  # spore saw riptide's PCR 0 change, then capsule's later check matched once the owner explained it:
  # the newer check is current, so no alert. optiplex's newest check, on forge, shows a change.
  - interval: 1m
    input_series:
      - series: 'talos_attest_pcr0_changed{instance="spore",machine="riptide"}'
        values: 1x10
      - series: 'talos_attest_last_checked_timestamp_seconds{instance="spore",machine="riptide"}'
        values: 1000x10
      - series: 'talos_attest_pcr0_changed{instance="capsule",machine="riptide"}'
        values: 0x10
      - series: 'talos_attest_last_checked_timestamp_seconds{instance="capsule",machine="riptide"}'
        values: 2000x10
      - series: 'talos_attest_pcr0_changed{instance="forge",machine="optiplex"}'
        values: 1x10
      - series: 'talos_attest_last_checked_timestamp_seconds{instance="forge",machine="optiplex"}'
        values: 1500x10
    alert_rule_test:
      - eval_time: 5m
        alertname: TalosAttestPCR0Changed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: forge
              machine: optiplex
            exp_annotations:
              message: "optiplex's PCR 0 changed at the same BIOS version"
              description: "optiplex's firmware measured itself differently while it reports the BIOS version it had when NetBox recorded its PCR 0. Read the device's NetBox journal for both values. Once a firmware setting or update explains it, set that version's entry in pcr0_by_bios to the new value, and the next daily check clears this."

  # optiplex, the control plane, failed in place on spore, and no anchor has a newer record: critical.
  # riptide failed in place on forge, then passed on capsule later: the newer record clears it. A
  # failed-no-quarantine check's own timestamp never raises the warning rule.
  - interval: 1m
    input_series:
      - series: 'talos_attest_failed_no_quarantine{instance="spore",machine="optiplex"}'
        values: 1x10
      - series: 'talos_attest_record_updated_timestamp_seconds{instance="spore",machine="optiplex"}'
        values: 3000x10
      - series: 'talos_attest_failed_no_quarantine{instance="capsule",machine="optiplex"}'
        values: 0x10
      - series: 'talos_attest_record_updated_timestamp_seconds{instance="capsule",machine="optiplex"}'
        values: 1000x10
      - series: 'talos_attest_failed_no_quarantine{instance="forge",machine="riptide"}'
        values: 1x10
      - series: 'talos_attest_record_updated_timestamp_seconds{instance="forge",machine="riptide"}'
        values: 1000x10
      - series: 'talos_attest_failed_no_quarantine{instance="capsule",machine="riptide"}'
        values: 0x10
      - series: 'talos_attest_record_updated_timestamp_seconds{instance="capsule",machine="riptide"}'
        values: 2000x10
      - series: 'talos_attest_check_last_timestamp_seconds{instance="spore",machine="optiplex",verdict="failed-no-quarantine"}'
        values: 120x10
    alert_rule_test:
      - eval_time: 5m
        alertname: TalosAttestCheckFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              verdict: failed-no-quarantine
              instance: spore
              machine: optiplex
            exp_annotations:
              message: "Control-plane node optiplex failed attestation and is not quarantined"
              description: "optiplex's TPM quoted a boot that misses talos-attest's renewal policy. It keeps its status and LDevID because it runs the control plane, and NetBox's attest_verdict reads failed-no-quarantine. Read the device's NetBox journal and journalctl -u talos-attest on spore, then reinstall or fix the node; the next passing check clears this."
