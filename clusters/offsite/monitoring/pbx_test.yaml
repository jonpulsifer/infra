---
# promtool tests for pbx-rules.yaml, run by `mise run k8s:check-rules`.
# rule_files names the rendered PrometheusRule; kustomization.yaml omits this file.
rule_files:
  - pbx.yaml

evaluation_interval: 1m

tests:
  # Healthy except a four-minute registration gap, as in a pod roll.
  - interval: 1m
    input_series:
      - series: 'up{namespace="pbx", job="pbx-metrics"}'
        values: 1x30
      - series: 'asterisk_pjsip_outbound_registration_status{namespace="pbx", job="pbx-metrics", domain="sip:montreal10.voip.ms:5061;transport=tls", username="sip:168847_elevenlabs@montreal10.voip.ms"}'
        values: 1x5 0x3 1x22
    alert_rule_test:
      - eval_time: 10m
        alertname: PBXTrunkNotRegistered
        exp_alerts: []
      - eval_time: 10m
        alertname: PBXDown
        exp_alerts: []

  # The carrier rejects the credentials.
  - interval: 1m
    input_series:
      - series: 'up{namespace="pbx", job="pbx-metrics"}'
        values: 1x30
      - series: 'asterisk_pjsip_outbound_registration_status{namespace="pbx", job="pbx-metrics", domain="sip:montreal10.voip.ms:5061;transport=tls", username="sip:168847_elevenlabs@montreal10.voip.ms"}'
        values: 1x5 2x25
    alert_rule_test:
      # Two minutes into the fault: pending, not yet firing.
      - eval_time: 8m
        alertname: PBXTrunkNotRegistered
        exp_alerts: []
      - eval_time: 15m
        alertname: PBXTrunkNotRegistered
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: pbx
              job: pbx-metrics
              domain: "sip:montreal10.voip.ms:5061;transport=tls"
              username: "sip:168847_elevenlabs@montreal10.voip.ms"
            exp_annotations:
              message: "Trunk sip:168847_elevenlabs@montreal10.voip.ms is not registered"
              description: "Registration status is 2 (0 unregistered, 2 rejected by the carrier) and has been for five minutes, so voip.ms has no contact to deliver the troll line's calls to. 2 means the carrier refused the credentials — check the 168847_elevenlabs field of 1Password item \"voip.ms sub accounts\". 0 is usually the network or the egress policy. https://wiki.lolwtf.ca/runbooks/operate-the-offsite-pbx/"

  # No PBX series at all: only the absent() arm fires.
  - interval: 1m
    input_series:
      - series: 'up{namespace="monitoring", job="unrelated"}'
        values: 1x20
    alert_rule_test:
      - eval_time: 3m
        alertname: PBXDown
        exp_alerts: []
      - eval_time: 6m
        alertname: PBXDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: pbx
              job: pbx-metrics
            exp_annotations:
              message: The offsite PBX is down — the troll line has no host
              description: "Prometheus has had no metrics from the offsite PBX for five minutes. PBXTrunkNotRegistered cannot fire while this does, because its series come from the PBX itself, and voip.ms has nowhere to deliver a call on 168847_elevenlabs. Check the pbx Deployment with kubectl --context offsite -n pbx; the render-config and asterisk logs say why it stopped. https://wiki.lolwtf.ca/runbooks/operate-the-offsite-pbx/"

  # Scraped, but failing: the same alert, the same labels.
  - interval: 1m
    input_series:
      - series: 'up{namespace="pbx", job="pbx-metrics"}'
        values: 0x20
    alert_rule_test:
      - eval_time: 10m
        alertname: PBXDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: pbx
              job: pbx-metrics
            exp_annotations:
              message: The offsite PBX is down — the troll line has no host
              description: "Prometheus has had no metrics from the offsite PBX for five minutes. PBXTrunkNotRegistered cannot fire while this does, because its series come from the PBX itself, and voip.ms has nowhere to deliver a call on 168847_elevenlabs. Check the pbx Deployment with kubectl --context offsite -n pbx; the render-config and asterisk logs say why it stopped. https://wiki.lolwtf.ca/runbooks/operate-the-offsite-pbx/"
