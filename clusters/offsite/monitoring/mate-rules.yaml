---
# mate_* series come through the OTel collector, whose pod and instance labels
# change on each roll, so every offset comparison ignores them. An `unless …
# offset` arm catches a counter's first point, which is born at 1.
# They carry namespace=monitoring and mate's name as exported_job, so match on the mate_ prefix alone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mate
  namespace: monitoring
  labels:
    lolwtf.ca/service: mate
    release: prom-stack
spec:
  groups:
    - name: mate
      rules:
        # Readiness is 503 whenever the gateway is down, the identify-budget
        # guard's sleep included. `absent` covers a deleted Deployment.
        - alert: MateDown
          expr: |
            kube_deployment_status_replicas_available{namespace="mate",deployment="mate"} == 0
            or absent(kube_deployment_status_replicas_available{namespace="mate",deployment="mate"})
          for: 10m
          labels:
            severity: critical
          annotations:
            message: "Rowbutt is not connected to Discord"
            description: "mate has had no ready pod for ten minutes, so a mention in the homelab guild gets no thread and a live thread gets no answer. A `Recreate` roll takes the only pod down first, so a couple of minutes of this is a normal deploy. Read the pod: `kubectl --context offsite logs -n mate deploy/mate`. If the last line is the budget guard sleeping to the reset, mate is protecting the IDENTIFY budget and will come back on its own; if it is a close code, MateGatewayFatalClose says which."

        # mate_sandboxes_live reports on every collection, so its absence is the
        # pipeline. Guarded on the Deployment so a dead mate pages only MateDown.
        - alert: MateNotReporting
          expr: |
            absent(mate_sandboxes_live)
            and on()
            kube_deployment_status_replicas_available{namespace="mate",deployment="mate"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "mate is up but its metrics have stopped arriving"
            description: "mate has a ready pod and no `mate_*` series for fifteen minutes, so every other alert in this group is blind. Check mate's own log line for the endpoint (`metrics exporting`), then the collector: `kubectl --context offsite logs -n monitoring deploy/opentelemetry-collector`. A silent drop with the process healthy is usually the CiliumNetworkPolicy — mate is allowed exactly one destination in the monitoring namespace."

        # Close codes no reconnect fixes, so mate exits. `fatal` follows
        # FATAL_CLOSE_CODES in apps/mate/src/gateway.ts.
        - alert: MateGatewayFatalClose
          expr: |
            increase(mate_gateway_closes_total{fatal="true"}[1h]) > 0
            or (
              mate_gateway_closes_total{fatal="true"}
              unless ignoring(pod, instance)
              mate_gateway_closes_total{fatal="true"} offset 1h
            )
          for: 0m
          labels:
            severity: critical
          annotations:
            message: "Discord closed mate's gateway with code {{ $labels.code }}"
            description: "A close code mate treats as a configuration error, so it exited instead of reconnecting and will crash-loop until the cause is fixed. 4004 is the token — check whether `rowbutt discord bot token` was rotated in 1Password and whether the mate-discord ExternalSecret carried it through. 4013/4014 are the intents, which live in apps/mate/src/gateway.ts and in the developer portal; Message Content is privileged and can be revoked there without anything in git changing."

        # A turn waits for a sandbox only while every slot's holder is mid-turn
        # or idle under five minutes. min_over_time survives a restart; the
        # offset arm demands a full window.
        - alert: MateSandboxWaitsLong
          expr: |
            mate_sandbox_waiters > 0
            and ignoring(pod, instance)
            mate_sandbox_waiters offset 15m > 0
            and min_over_time(mate_sandbox_waiters[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate turns have waited a quarter of an hour for a sandbox"
            description: "A turn has waited fifteen minutes for a sandbox slot, and its thread's sandbox card still says it is waiting. The waiting turn is one of the MATE_MAX_CONCURRENT running turns, and it takes the slot of any thread idle for five minutes. While MATE_MAX_CONCURRENT is at most MATE_MAX_SANDBOXES, as deployed, running turns cannot hold every slot, so this is mate's slot bookkeeping: a holder still busy after its turn ended, a missed wake-up, or a gauge that never came back down. Compare `mate_turns_running` with `mate_sandboxes_live`; `kubectl --context offsite get sandboxes -n mate` names the holders. Read mate's log (`kubectl --context offsite logs -n mate deploy/mate`), then restart mate, which rebuilds its slots from the Sandboxes that exist and resumes the running turns: `kubectl --context offsite -n mate rollout restart deploy/mate`. Only with MATE_MAX_CONCURRENT above MATE_MAX_SANDBOXES can running turns hold every slot; then raise MATE_MAX_SANDBOXES on the mate Deployment if oldschool's CPU requests allow it."

        # Turn slots free when a turn ends, so a 10m queue is stuck turns or a
        # cap too low. It stays under the 30-minute quiet timer, which ends a
        # wait. min_over_time and the offset arm as above.
        - alert: MateThreadsQueued
          expr: |
            mate_queue_depth > 0
            and ignoring(pod, instance)
            mate_queue_depth offset 10m > 0
            and min_over_time(mate_queue_depth[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate threads have waited ten minutes for a turn"
            description: "At least one thread has waited ten minutes for a free turn, and it gives up when it goes quiet at thirty. A slot frees as soon as a turn ends, so every one of the MATE_MAX_CONCURRENT turns has run for that long, or the traffic outgrew the cap. Compare `mate_turns_running` with `mate_queue_depth`, and read mate's log: `kubectl --context offsite logs -n mate deploy/mate`. Stop a runaway turn from its thread, or raise MATE_MAX_CONCURRENT on the mate Deployment."

        # `error` is pi or the provider, `brain-failed` the session store or the
        # harness. Three in 30m is the key, the model, mate-db or a mate bug.
        - alert: MateTurnsFailing
          expr: |
            sum(increase(mate_turns_ended_total{reason=~"error|brain-failed"}[30m])) > 2
            or sum(
              mate_turns_ended_total{reason=~"error|brain-failed"}
              unless ignoring(pod, instance)
              mate_turns_ended_total{reason=~"error|brain-failed"} offset 30m
            ) > 2
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate turns are failing"
            description: "More than two turns ended in an error in the last thirty minutes. `error` is a run pi gave up on, usually at the model provider, and `mate_provider_errors_total` says which kind: `auth` is the key in Secret mate-opencode, `limit` the usage cap of the `opencode-go` plan, `timeout` a provider that stopped answering, and `other` anything else, such as a MATE_MODEL the provider refuses. `brain-failed` is the session store or the harness itself failing: read `mate_store_failures_total` by `op`, which MateStoreFailing watches, alongside mate's log (`kubectl --context offsite logs -n mate deploy/mate`), because a `brain-failed` turn with no store failure is a fault in mate's own agent loop. A sandbox that dies mid-turn is a tool error the model sees, not a failed turn."

        # A failed mint is a tool error inside a turn, so only this sees it.
        # `connect-failed`: the Sandbox went Ready but mate-hands did not answer.
        - alert: MateSandboxMintFailing
          expr: |
            sum(increase(mate_mints_total{result=~"mint-failed|connect-failed"}[30m])) > 2
            or sum(
              mate_mints_total{result=~"mint-failed|connect-failed"}
              unless ignoring(pod, instance)
              mate_mints_total{result=~"mint-failed|connect-failed"} offset 30m
            ) > 2
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate cannot give a thread a sandbox"
            description: "More than two sandbox mints or connects failed in the last thirty minutes, so turns that need a command or a file get tool errors instead of results. A mint failure is the Sandbox never going Ready — the sandbox image digest, the kata-clh runtime class, or the namespace's restricted PSA. A connect is `pods/exec` into a Ready pod and then the mate-hands hello: a failure is the Role in ../../apps/mate/rbac.yaml, or a daemon that speaks another protocol, which mate condemns as too old so the next call mints a new sandbox. `mate_hands_connects_total` by `result` says which."

        # Every op counts: an open, a fault mid-turn, a row write, a migration,
        # a quarantine or a credential read or write.
        - alert: MateStoreFailing
          expr: |
            sum(increase(mate_store_failures_total[30m])) > 2
            or sum(
              mate_store_failures_total
              unless ignoring(pod, instance)
              mate_store_failures_total offset 30m
            ) > 2
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate is failing to reach its session store"
            description: "mate recorded more than two session-store failures in the last thirty minutes, so threads are told mate cannot reach its memory, or lose a turn mid-run. `op` says where: `open` and `rows` are mate-db unreachable or slow, `migrate` is mate retrying its schema at boot, `fault` a commit that failed mid-turn, `quarantine` a thread whose stored session mate set aside as corrupt and keeps for inspection, and `credentials` the ChatGPT sign-in, which mate keeps in memory and retries until it saves. Check MateDatabaseDown first, then `kubectl cnpg status mate-db -n mate --context offsite` and mate's log: `kubectl --context offsite logs -n mate deploy/mate`. The runbook at https://wiki.lolwtf.ca/runbooks/operate-postgres/ has the database checks."

        # mate test-mints at boot and on a timer; 0 means turns cannot push. No
        # App means no series. Guarded on the Deployment as MateNotReporting is.
        - alert: MateGitHubCredentialBroken
          expr: |
            mate_github_app_ready == 0
            and on()
            kube_deployment_status_replicas_available{namespace="mate",deployment="mate"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            message: "mate cannot mint a GitHub token"
            description: "mate has held an unusable GitHub App credential for ten minutes, so every sandbox it stamps gets a token that cannot push and every turn meant to end in a pull request ends one step short instead. mate says which half failed on the way up: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. A key that does not parse is the `mate-github-app` Secret and the ExternalSecret that fills it; a key that parses and is refused is the App — MATE_GITHUB_APP_ID on the Deployment, or the installation on `jonpulsifer/infra` having been removed. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ walks both."

        # Failures while the gauge above reads 1. `result!="ok"` is the metric's
        # contract. Two: at one mint per turn, three in 30m is out of reach.
        - alert: MateGitHubTokenMintFailing
          expr: |
            sum(increase(mate_github_token_mints_total{result!="ok"}[30m])) > 1
            or sum(
              mate_github_token_mints_total{result!="ok"}
              unless ignoring(pod, instance)
              mate_github_token_mints_total{result!="ok"} offset 30m
            ) > 1
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate is failing to mint GitHub tokens"
            description: "More than one installation token mint failed in the last thirty minutes against a credential that is otherwise working, so some threads got a sandbox that cannot push and others did not. Read the reason mate recorded: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. Compare `mate_github_token_stamps_total`, which counts the step after this one — a token minted and written into the sandbox pod — because a mint that works and a stamp that does not leaves the same thread unable to push. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ has the checks."

        # 0 while mate holds no working ChatGPT sign-in; absent without a store,
        # or before mate has read it. Guarded on the Deployment as above.
        - alert: MateChatGPTSignedOut
          expr: |
            mate_chatgpt_signed_in == 0
            and on()
            kube_deployment_status_replicas_available{namespace="mate",deployment="mate"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            message: "mate is not signed in to ChatGPT"
            description: "mate has held no working ChatGPT sign-in for thirty minutes: nobody has signed it in, someone said `chatgpt logout`, or OpenAI refused the token refresh. Until the owner signs it in again, mate cannot use ChatGPT. Mentioning mate with `chatgpt status` says which, and mate's log says why: `kubectl --context offsite logs -n mate deploy/mate | grep -i chatgpt`. To sign in, mention mate with `chatgpt login` and enter the code it sends privately, as the runbook at https://wiki.lolwtf.ca/runbooks/sign-rowbutt-in-to-chatgpt/ says."

        # The keeper rotates the token at two days left, so under one is a day
        # of failed refreshes. The gauge is absent while signed out.
        - alert: MateChatGPTTokenNotRefreshing
          expr: |
            mate_chatgpt_token_expiry_seconds < 86400
            and on()
            kube_deployment_status_replicas_available{namespace="mate",deployment="mate"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            message: "mate's ChatGPT token is not refreshing"
            description: "mate's ChatGPT access token has less than a day left. mate refreshes it once two days are left, so every refresh since then has failed without OpenAI refusing it: auth.openai.com out of reach, which is mate's CiliumNetworkPolicy or DNS, or mate-db failing the write. Read why: `kubectl --context offsite logs -n mate deploy/mate | grep -i chatgpt`. Past its expiry, mate's ChatGPT requests fail until a refresh gets through. The runbook at https://wiki.lolwtf.ca/runbooks/sign-rowbutt-in-to-chatgpt/ has the checks."

        # One failed fold is a bearer that may exist only in a sandbox the quiet
        # teardown deletes, so the first counts. `result!="ok"` is the contract.
        - alert: MateKthxSitesSyncFailing
          expr: |
            sum(increase(mate_kthx_sites_syncs_total{result!="ok"}[30m])) > 0
            or sum(
              mate_kthx_sites_syncs_total{result!="ok"}
              unless ignoring(pod, instance)
              mate_kthx_sites_syncs_total{result!="ok"} offset 30m
            ) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate could not keep a sandbox's kthx site tokens"
            description: "A fold of a sandbox's kthx site tokens into the mate-kthx-sites Secret failed, so a site claimed in that turn may have its only bearer in the sandbox, which the quiet teardown deletes. The next turn on that thread retries the save and a teardown makes one last attempt, so a single failure heals itself unless the thread is already quiet. `read-failed` is the file in the sandbox, `save-failed` the Secret. Read why: `kubectl --context offsite logs -n mate deploy/mate | grep -i kthx`. What the ledger holds, names only: `kubectl --context offsite -n mate get secret mate-kthx-sites -o jsonpath='{.data.sites\\.json}' | base64 -d | jq 'map_values(keys)'`."

        # A sweep runs every five minutes, so 20m is four that could not refill.
        # Both read 0 until the first sweep, so a mate with no pool cannot fire.
        - alert: MateWarmPoolShort
          expr: |
            max_over_time(mate_spares_ready[20m])
            < min_over_time(mate_spares_wanted[20m])
            and ignoring(pod, instance)
            mate_spares_ready offset 20m < mate_spares_wanted offset 20m
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate is not keeping a sandbox warm"
            description: "For twenty minutes mate has held fewer Ready spares than MATE_SPARES asks for, so a thread with no sandbox of its own pays the full cold mint at its turn's first tool call, which waits tens of seconds on the thread's sandbox card. A turn that only talks mints nothing and waits for nothing. `kubectl --context offsite get sandboxes -n mate -l lolwtf.ca/spare` is what is standing: a spare that stops being Ready is condemned and replaced on the next sweep, so one that is still there is a delete the apiserver refused. mate's log names which half failed — `could not condemn a spare that stopped being ready`, or `warming a spare failed` with the reason the node or the apiserver gave."

        # 96 is 80% of MATE_MAX_TURNS_PER_DAY. mate's own count resets on each
        # restart and this rolling 24h does not, so the two can disagree.
        - alert: MateTurnBudgetNearlySpent
          expr: increase(mate_turns_total[24h]) > 96
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate has spent most of its daily turn budget"
            description: "More than 96 of the 120 turns allowed in a rolling day have been taken. Past 120 every thread is told the day is spent until the window rolls off. If this is real use rather than a loop, MATE_MAX_TURNS_PER_DAY on the mate Deployment is the number to move — and the spend that goes with it is what MateSpendAboveBudget watches."

        # qwen3.8-max lists at $2 and $6 per million input and output tokens.
        # The turn cap bounds volume, so this trips when the cost per turn moves.
        - alert: MateSpendAboveBudget
          expr: sum(increase(mate_turn_cost_usd_sum[24h])) > 25
          for: 0m
          labels:
            severity: warning
          annotations:
            message: "mate's reported spend is above its daily budget"
            description: "The turns of the last rolling day report more than $25 of model spend. The number is qwen3.8-max's list price from pi's catalog, summed over each run: a shadow of the flat-rate `opencode-go` plan, not a bill. Volume is capped at 120 turns/day, so this is the tokens per turn moving: check MATE_MODEL and MATE_THINKING on the mate Deployment, then which threads run long turns. The threshold is a first estimate; move it once a week of turns shows a normal day."

        # mate sleeps to the reset below a 20% reserve; this fires at 40%. The
        # gauge goes absent once `reset_after` passes.
        - alert: MateIdentifyBudgetLow
          expr: |
            mate_discord_session_start_remaining
            < mate_discord_session_start_limit * 0.4
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "mate's Discord identify budget is approaching its reserve"
            description: "Fewer than 40% of the day's IDENTIFYs are left, against a reserve of 20% that mate will not spend into — below that it stops connecting until Discord's reset, and exhausting the budget outright makes Discord rotate the bot token. Something is reconnecting: read the pod for `gateway closed` lines and their codes, and check whether the Deployment is rolling (the digest-bump CD opens a PR per build)."

        # `absent` covers a gone instance, a broken scrape and an unselected
        # PodMonitor.
        - alert: MateDatabaseDown
          expr: |
            cnpg_collector_up{namespace="mate",cluster="mate-db"} == 0
            or absent(cnpg_collector_up{namespace="mate",cluster="mate-db"})
          for: 10m
          labels:
            severity: warning
          annotations:
            message: "mate's session database is not reporting"
            description: "`cnpg_collector_up` for the mate-db cluster is 0 or missing: the instance is down, or the PodMonitor it exports through is not being scraped, so nothing can read or write the session store. `kubectl cnpg status mate-db -n mate --context offsite` shows which. The runbook at https://wiki.lolwtf.ca/runbooks/operate-postgres/ has the checks."

        # local-path enforces no size and has no kubelet_volume_stats_*, so this
        # alert is the claim's only budget. WAL and the catalog sit on top.
        - alert: MateDatabaseVolumeFilling
          expr: |
            sum(cnpg_pg_database_size_bytes{namespace="mate"})
            /
            sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="mate",persistentvolumeclaim=~"mate-db-.*"})
            > 0.8
          for: 30m
          labels:
            severity: warning
          annotations:
            message: "mate's session database is past 80% of its volume"
            description: "The databases in mate-db sum to more than 80% of what its claim asks for. local-path does not enforce the size, so the node's disk is the real limit. Raise `storage.size` in clusters/offsite/apps/mate/database.yaml, which the storage class allows live, or prune the corpus."

        # Keyed on the last success: failed Jobs outlive a fix, and a CronJob that
        # stops firing leaves none. The middle arm waits out the first window.
        - alert: MateDatabaseBackupFailing
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="mate",cronjob="mate-db-backup"} > 36 * 3600
            or (
              time() - kube_cronjob_created{namespace="mate",cronjob="mate-db-backup"} > 36 * 3600
              unless on() kube_cronjob_status_last_successful_time{namespace="mate",cronjob="mate-db-backup"}
            )
            or absent(kube_cronjob_created{namespace="mate",cronjob="mate-db-backup"})
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "The nightly mate database dump has not succeeded"
            description: "mate-db-backup has not succeeded in 36 hours, one whole window missed with the schedule at 04:43 UTC, so the bucket has no current dump of the session store. Read both containers of the most recent Job within three days, after which the Job is collected: dump is pg_dump, upload is gcloud. A 403 from the upload is the federation or the bucket grant in terraform/gcp/projects/homelab-ng/mate.tf. If there is no Job at all, the CronJob stopped firing, is suspended or is gone."
