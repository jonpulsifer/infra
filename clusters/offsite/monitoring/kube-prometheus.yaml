---
# Offsite's own Prometheus + Grafana + Alertmanager. Only Grafana is exposed
# (ingress to grafana-offsite.lolwtf.ca); Prometheus and Alertmanager are
# ClusterIP-only. This keeps all metric, log, and trace traffic on the local
# network — nothing crosses the satellite link to folly except the Grafana UI.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # The CRDs come from the monitoring-crds Kustomization this one dependsOn,
    # so they already exist and belong to another release by the time this
    # installs. Leaving this true makes Helm refuse to adopt them.
    crds:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    # Kubelet carries cAdvisor, so every container_* series and with it the
    # whole k8s-resources dashboard set depends on this being scraped. It also
    # backs the KubeletDown rule, which defaultRules leaves on.
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        serviceDiscoveryRole: EndpointSlice
        # Same window as folly so a query spans both sites the same way.
        # 30d here measures ~10GiB against retrofit's 350G of free space; the
        # size arm matches folly's for one number to reason about, not because
        # this disk is tight.
        retention: 30d
        retentionSize: 16GB
        # `cluster` is what tells the two sites apart once alerts land in one
        # Discord channel, and it is the variable every multi-cluster dashboard
        # in the chart groups on.
        externalLabels:
          cluster: ${CLUSTER_NAME}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 25Gi
        # Pick up the opentelemetry-collector ServiceMonitor from base/monitoring
        # and any ServiceMonitors this chart ships, via the release label.
        serviceMonitorSelectorNilUsesShards: false
    alertmanager:
      # The chart's stock route sends everything to a receiver named "null",
      # which accepts alerts and discards them. Without this block the whole
      # pipeline runs and notifies nobody. Offsite has no Alertmanager ingress,
      # so Discord is the only way an alert from here reaches anyone.
      config:
        route:
          group_by: [cluster, namespace, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          # Anything the AlertmanagerConfig sub-route does not take lands here.
          receiver: "null"
          routes:
            # Watchdog fires forever by design — it means the pipeline is alive.
            # Delivering it twice a day trains the channel to ignore itself, and
            # its absence is the signal, which Discord cannot show anyway.
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: "null"
        inhibit_rules:
          - source_matchers: [severity = "critical"]
            target_matchers: [severity =~ "warning|info"]
            equal: [namespace, alertname]
          - source_matchers: [severity = "warning"]
            target_matchers: [severity = "info"]
            equal: [namespace, alertname]
          - source_matchers: [alertname = "InfoInhibitor"]
            target_matchers: [severity = "info"]
            equal: [namespace]
          - target_matchers: [alertname = "InfoInhibitor"]
      alertmanagerSpec:
        # The Discord receiver is an AlertmanagerConfig in base/monitoring. The
        # operator merges only the ones it can select, and the chart's default
        # selector is empty, which selects nothing.
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: discord
        # Otherwise the operator pins that config's route to alerts labelled
        # namespace=monitoring, and nothing else ever reaches Discord.
        alertmanagerConfigMatcherStrategy:
          type: None
      ingress:
        enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin-user
        userKey: user
        passwordKey: password
      plugins:
        - victoriametrics-logs-datasource
      additionalDataSources:
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          isDefault: false
          access: proxy
          url: http://victoria-logs-server.monitoring.svc.cluster.local:9428
          orgId: 1
          version: 1
        - name: Tempo
          type: tempo
          uid: tempo
          isDefault: false
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          orgId: 1
          version: 1
          jsonData:
            tracesToLogs:
              datasourceUid: victorialogs
              filterByTraceID: false
              tags:
                - key: pod
                  value: pod
      ingress:
        enabled: true
        ingressClassName: cilium
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - &grafana grafana-offsite.lolwtf.ca
        tls:
          - secretName: *grafana
            hosts:
              - *grafana
        pathType: Prefix
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
    prometheus-node-exporter:
      # A host service that wants metrics scraped drops a .prom file in
      # /var/lib/prometheus-node-exporter-text-files, and this picks it up
      # labelled with the node it came from -- the same drop box folly uses.
      # That is how bosun on oldschool is scraped: its unit carries an
      # IPAddressDeny every skiff inherits, so a listener in-cluster Prometheus
      # could reach would open the pod CIDR to job code as well.
      #
      # Reached through the host-root mount the chart already makes, so this
      # needs no extra volume. extraArgs REPLACES the chart's defaults, so the
      # two filesystem excludes below are the chart's own and must stay.
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
        - --collector.textfile.directory=/host/root/var/lib/prometheus-node-exporter-text-files
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              targetLabel: instance