---
# Offsite's own Prometheus + Grafana + Alertmanager. Only Grafana is exposed
# (ingress to grafana-offsite.lolwtf.ca); Prometheus and Alertmanager are
# ClusterIP-only. This keeps all metric, log, and trace traffic on the local
# network — nothing crosses the satellite link to folly except the Grafana UI.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.0.1
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    kubelet:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        serviceDiscoveryRole: EndpointSlice
        retention: 15d
        retentionSize: 20GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 25Gi
        # Pick up the opentelemetry-collector ServiceMonitor from base/monitoring
        # and any ServiceMonitors this chart ships, via the release label.
        serviceMonitorSelectorNilUsesShards: false
    alertmanager:
      ingress:
        enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin-user
        userKey: user
        passwordKey: password
      plugins: []
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          isDefault: false
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          orgId: 1
          version: 1
        - name: Tempo
          type: tempo
          uid: tempo
          isDefault: false
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          orgId: 1
          version: 1
          jsonData:
            tracesToLogs:
              datasourceUid: loki
              filterByTraceID: false
              tags:
                - key: pod
                  value: pod
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      ingress:
        enabled: true
        ingressClassName: cilium
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - &grafana grafana-offsite.lolwtf.ca
        tls:
          - secretName: *grafana
            hosts:
              - *grafana
        pathType: Prefix
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
    prometheus-node-exporter:
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              targetLabel: instance