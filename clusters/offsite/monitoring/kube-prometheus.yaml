---
# Offsite's own Prometheus, Grafana and Alertmanager. Only Grafana has an
# ingress, so metrics, logs and traces stay on this site.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # The monitoring-crds Kustomization owns the CRDs; Helm refuses to adopt them.
    crds:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
    # cAdvisor rides the kubelet scrape: every container_* series and the
    # KubeletDown rule need it.
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        serviceDiscoveryRole: EndpointSlice
        # Same retention as folly, so a query spans both sites alike.
        retention: 30d
        retentionSize: 16GB
        # Tells the sites apart in the shared Discord channel and in the
        # multi-cluster dashboards.
        externalLabels:
          cluster: ${CLUSTER_NAME}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 25Gi
        serviceMonitorSelectorNilUsesShards: false
        # Select every PodMonitor: CNPG renders its own with no way to add
        # `release: prom-stack`.
        podMonitorSelectorNilUsesHelmValues: false
    alertmanager:
      config:
        route:
          group_by: [cluster, namespace, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          # Anything the AlertmanagerConfig sub-route does not take lands here.
          receiver: "null"
          routes:
            # Watchdog always fires; its absence is the signal, which Discord
            # cannot show.
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: "null"
        inhibit_rules:
          - source_matchers: [severity = "critical"]
            target_matchers: [severity =~ "warning|info"]
            equal: [namespace, alertname]
          - source_matchers: [severity = "warning"]
            target_matchers: [severity = "info"]
            equal: [namespace, alertname]
          - source_matchers: [alertname = "InfoInhibitor"]
            target_matchers: [severity = "info"]
            equal: [namespace]
          - target_matchers: [alertname = "InfoInhibitor"]
      alertmanagerSpec:
        # The Discord receiver is an AlertmanagerConfig in base/monitoring and
        # the switchboard receiver is one here; the chart's default selector
        # selects none. Each selected config is a sub-route with continue, so
        # a critical alert goes to both. `switchboard` joins the values only
        # once both hold: the `switchboard` 1Password item exists, and
        # Deployment switchboard in elevenlabs has a Ready pod. Without the
        # item the operator rejects the config for its missing Secret and
        # PrometheusOperatorRejectedResources fires. Without the pod every
        # webhook fails; AlertmanagerClusterFailedToSendAlerts, critical on
        # this chart, then fires and is routed here too, so the owner is rung
        # about it once the pod comes up. Unpark switchboard in its own merge
        # first, then add the value; park in the reverse order.
        alertmanagerConfigSelector:
          matchExpressions:
            - key: alertmanagerConfig
              operator: In
              values: [discord]
        # Otherwise the operator pins that config's route to alerts labelled
        # namespace=monitoring, and nothing else ever reaches Discord.
        alertmanagerConfigMatcherStrategy:
          type: None
      ingress:
        enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin-user
        userKey: user
        passwordKey: password
      plugins:
        - victoriametrics-logs-datasource
      additionalDataSources:
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: victorialogs
          isDefault: false
          access: proxy
          url: http://victoria-logs-server.monitoring.svc.cluster.local:9428
          orgId: 1
          version: 1
          jsonData:
            # Vector writes tenant 1; without this header a query reads tenant 0
            # and every panel is empty. Strings: the plugin rejects integers.
            multitenancyHeaders:
              AccountID: "1"
              ProjectID: "0"
        - name: Tempo
          type: tempo
          uid: tempo
          isDefault: false
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          orgId: 1
          version: 1
          jsonData:
            tracesToLogs:
              datasourceUid: victorialogs
              filterByTraceID: false
              tags:
                - key: pod
                  value: pod
      ingress:
        enabled: true
        ingressClassName: cilium
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - &grafana grafana-offsite.lolwtf.ca
        tls:
          - secretName: *grafana
            hosts:
              - *grafana
        pathType: Prefix
      persistence:
        enabled: true
        storageClassName: local-path
        size: 1Gi
    kube-state-metrics:
      # Config and alerts: ../../base/monitoring/gateway-api-generation.yaml.
      customResourceState:
        enabled: true
        create: false
        name: kube-state-metrics-gateway-api
      rbac:
        # The chart grants only the built-in collectors' RBAC; without these
        # rules the custom config exports nothing.
        extraRules:
          - apiGroups: [gateway.networking.k8s.io]
            resources: [gateways, httproutes]
            verbs: [list, watch]
    prometheus-node-exporter:
      # Host services drop .prom files in the textfile directory. extraArgs
      # replaces the chart defaults, so keep its two filesystem excludes.
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
        - --collector.textfile.directory=/host/root/var/lib/prometheus-node-exporter-text-files
      prometheus:
        monitor:
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
              targetLabel: instance