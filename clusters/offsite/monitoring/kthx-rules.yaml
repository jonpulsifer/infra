---
# kthx sends no notification of its own, and every name it serves is public.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kthx
  namespace: monitoring
  labels:
    lolwtf.ca/service: kthx
    release: prom-stack
spec:
  groups:
    - name: kthx
      rules:
        # One replica, Recreate, RWO: no available replica is the whole zone
        # down. `absent` covers a deleted Deployment.
        - alert: KthxServerDown
          expr: |
            kube_deployment_status_replicas_available{namespace="kthx",deployment="kthx"} == 0
            or absent(kube_deployment_status_replicas_available{namespace="kthx",deployment="kthx"})
          for: 10m
          labels:
            severity: critical
          annotations:
            message: "kthx.dev has no serving pod"
            description: "The kthx Deployment has no available replica, so every kthx.dev name is answered by the gateway's 503. A `Recreate` rollout takes the old pod down first, so a few minutes of this is a normal deploy; ten is not."

        # `absent` covers a gone instance, a broken scrape and an unselected
        # PodMonitor.
        - alert: KthxDatabaseDown
          expr: |
            cnpg_collector_up{namespace="kthx"} == 0
            or absent(cnpg_collector_up{namespace="kthx"})
          for: 10m
          labels:
            severity: critical
          annotations:
            message: "The kthx Postgres instance is not reporting"
            description: "`cnpg_collector_up` for the kthx-db cluster is 0 or missing: the instance is down, or the PodMonitor it exports through is not being scraped. Site databases are unreachable while this holds; static bytes still serve."

        # local-path enforces no size and has no kubelet_volume_stats_*, so this
        # alert is the claim's only budget. WAL and the catalog sit on top.
        - alert: KthxDatabaseVolumeFilling
          expr: |
            sum(cnpg_pg_database_size_bytes{namespace="kthx"})
            /
            sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="kthx",persistentvolumeclaim=~"kthx-db-.*"})
            > 0.8
          for: 30m
          labels:
            severity: warning
          annotations:
            message: "kthx site databases are past 80% of the kthx-db volume"
            description: "Site databases sum to more than 80% of what the kthx-db claim asks for. Each site is capped at 256 MiB, so this is site count, not one runaway: expand the claim (allowed live) or delete dead sites."

        # The sites volume sees all of /mnt/disks, shared with other claims, and
        # the server evicts only past 80% used. hostPath has no volume stats.
        - alert: KthxSitesDiskFilling
          expr: |
            node_filesystem_avail_bytes{instance="oldschool",mountpoint="/mnt/disks"}
            /
            node_filesystem_size_bytes{instance="oldschool",mountpoint="/mnt/disks"}
            < 0.25
          for: 30m
          labels:
            severity: warning
          annotations:
            message: "oldschool /mnt/disks is under 25% free"
            description: "Every local-path volume on oldschool lives here, and the one that grows from anonymous public uploads is the kthx sites volume. Measure that directory first, then the other claims on this disk. At 20% free the server starts evicting release directories that are neither serving nor previous; at 5% NodeFilesystemAlmostOutOfSpace fires and every workload on the node is already in trouble."

        # Keyed on the last success: failed Jobs outlive a fix, and a CronJob that
        # stops firing leaves none. `absent` means it never succeeded or is gone.
        - alert: KthxBackupFailing
          expr: |
            (time() - kube_cronjob_status_last_successful_time{namespace="kthx",cronjob="kthx-db-backup"} > 36 * 3600)
            or
            absent(kube_cronjob_status_last_successful_time{namespace="kthx",cronjob="kthx-db-backup"})
          for: 15m
          labels:
            severity: warning
          annotations:
            message: "The nightly kthx database dump has not succeeded"
            description: "The last successful kthx-db-backup is over 36 hours old — one whole window missed with the schedule at 04:23 UTC — so the depot has no current dump under backups/pg and the only undo path for a site database is stale. Read both containers of the most recent Job — dump is pg_dumpall, upload is gcloud — within three days, after which the Job is collected. If there is no Job at all, the CronJob itself stopped firing or is suspended."
