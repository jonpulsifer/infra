---
# promtool tests for mate-rules.yaml, run by `mise run k8s:check-rules`; no
# kustomization lists this file. Series carry the collector's labels, as deployed.
rule_files:
  - mate.yaml

evaluation_interval: 1m

tests:
  # The pod goes: MateDown fires, MateNotReporting does not.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x10 0x30
      - series: 'mate_sandboxes_live{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x10
    alert_rule_test:
      - eval_time: 20m
        alertname: MateDown
        exp_alerts: []
      - eval_time: 22m
        alertname: MateDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: mate
              deployment: mate
              job: kube-state-metrics
              instance: 10.101.1.123:8080
            exp_annotations:
              message: "Rowbutt is not connected to Discord"
              description: "mate has had no ready pod for ten minutes, so a mention in the homelab guild gets no thread and a live thread gets no answer. A `Recreate` roll takes the only pod down first, so a couple of minutes of this is a normal deploy. Read the pod: `kubectl --context offsite logs -n mate deploy/mate`. If the last line is the budget guard sleeping to the reset, mate is protecting the IDENTIFY budget and will come back on its own; if it is a close code, MateGatewayFatalClose says which."
      - eval_time: 35m
        alertname: MateNotReporting
        exp_alerts: []

  # The Deployment is gone, so only the `absent` arm can fire.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 9m
        alertname: MateDown
        exp_alerts: []
      - eval_time: 12m
        alertname: MateDown
        exp_alerts:
          # `absent()` keeps its equality matchers as labels.
          - exp_labels:
              severity: critical
              namespace: mate
              deployment: mate
            exp_annotations:
              message: "Rowbutt is not connected to Discord"
              description: "mate has had no ready pod for ten minutes, so a mention in the homelab guild gets no thread and a live thread gets no answer. A `Recreate` roll takes the only pod down first, so a couple of minutes of this is a normal deploy. Read the pod: `kubectl --context offsite logs -n mate deploy/mate`. If the last line is the budget guard sleeping to the reset, mate is protecting the IDENTIFY budget and will come back on its own; if it is a close code, MateGatewayFatalClose says which."

  # mate is ready but no series arrive.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 14m
        alertname: MateNotReporting
        exp_alerts: []
      - eval_time: 17m
        alertname: MateNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is up but its metrics have stopped arriving"
              description: "mate has a ready pod and no `mate_*` series for fifteen minutes, so every other alert in this group is blind. Check mate's own log line for the endpoint (`metrics exporting`), then the collector: `kubectl --context offsite logs -n monitoring deploy/opentelemetry-collector`. A silent drop with the process healthy is usually the CiliumNetworkPolicy — mate is allowed exactly one destination in the monitoring namespace."

  # A fatal close on a fresh process: the counter is born at 1, so only the
  # second arm fires. A recoverable close never fires.
  - interval: 1m
    input_series:
      - series: 'mate_gateway_closes_total{code="4004",fatal="true",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x130
      - series: 'mate_gateway_closes_total{code="1006",fatal="false",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x130
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGatewayFatalClose
        exp_alerts:
          - exp_labels:
              severity: critical
              code: "4004"
              fatal: "true"
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "Discord closed mate's gateway with code 4004"
              description: "A close code mate treats as a configuration error, so it exited instead of reconnecting and will crash-loop until the cause is fixed. 4004 is the token — check whether `rowbutt discord bot token` was rotated in 1Password and whether the mate-discord ExternalSecret carried it through. 4013/4014 are the intents, which live in apps/mate/src/gateway.ts and in the developer portal; Message Content is privileged and can be revoked there without anything in git changing."
      # An hour on, the series is no longer new, so the alert clears.
      - eval_time: 125m
        alertname: MateGatewayFatalClose
        exp_alerts: []

  # A turn waits for a sandbox for a full 15m window, and threads wait for a
  # turn for a full 10m window.
  - interval: 1m
    input_series:
      - series: 'mate_sandbox_waiters{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x5 1x40
      - series: 'mate_queue_depth{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x5 2x40
    alert_rule_test:
      - eval_time: 19m
        alertname: MateSandboxWaitsLong
        exp_alerts: []
      - eval_time: 21m
        alertname: MateSandboxWaitsLong
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate turns have waited a quarter of an hour for a sandbox"
              description: "A turn has waited fifteen minutes for a sandbox slot, and its thread's sandbox card still says it is waiting. The waiting turn is one of the MATE_MAX_CONCURRENT running turns, and it takes the slot of any thread idle for five minutes. While MATE_MAX_CONCURRENT is at most MATE_MAX_SANDBOXES, as deployed, running turns cannot hold every slot, so this is mate's slot bookkeeping: a holder still busy after its turn ended, a missed wake-up, or a gauge that never came back down. Compare `mate_turns_running` with `mate_sandboxes_live`; `kubectl --context offsite get sandboxes -n mate` names the holders. Read mate's log (`kubectl --context offsite logs -n mate deploy/mate`), then restart mate, which rebuilds its slots from the Sandboxes that exist and resumes the running turns: `kubectl --context offsite -n mate rollout restart deploy/mate`. Only with MATE_MAX_CONCURRENT above MATE_MAX_SANDBOXES can running turns hold every slot; then raise MATE_MAX_SANDBOXES on the mate Deployment if oldschool's CPU requests allow it."
      - eval_time: 14m
        alertname: MateThreadsQueued
        exp_alerts: []
      - eval_time: 16m
        alertname: MateThreadsQueued
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate threads have waited ten minutes for a turn"
              description: "At least one thread has waited ten minutes for a free turn, and it gives up when it goes quiet at thirty. A slot frees as soon as a turn ends, so every one of the MATE_MAX_CONCURRENT turns has run for that long, or the traffic outgrew the cap. Compare `mate_turns_running` with `mate_queue_depth`, and read mate's log: `kubectl --context offsite logs -n mate deploy/mate`. Stop a runaway turn from its thread, or raise MATE_MAX_CONCURRENT on the mate Deployment."

  # Each wait drops to zero at t=20: a preempted slot, a turn that ended.
  - interval: 1m
    input_series:
      - series: 'mate_sandbox_waiters{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x19 0x1 1x14
      - series: 'mate_queue_depth{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x19 0x1 1x9
    alert_rule_test:
      - eval_time: 34m
        alertname: MateSandboxWaitsLong
        exp_alerts: []
      - eval_time: 29m
        alertname: MateThreadsQueued
        exp_alerts: []

  # A series that reads 1 from its first point, as a new wait does after a
  # roll: the offset arm holds each alert for a full window.
  - interval: 1m
    input_series:
      - series: 'mate_sandbox_waiters{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x40
      - series: 'mate_queue_depth{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x40
    alert_rule_test:
      - eval_time: 14m
        alertname: MateSandboxWaitsLong
        exp_alerts: []
      - eval_time: 16m
        alertname: MateSandboxWaitsLong
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate turns have waited a quarter of an hour for a sandbox"
              description: "A turn has waited fifteen minutes for a sandbox slot, and its thread's sandbox card still says it is waiting. The waiting turn is one of the MATE_MAX_CONCURRENT running turns, and it takes the slot of any thread idle for five minutes. While MATE_MAX_CONCURRENT is at most MATE_MAX_SANDBOXES, as deployed, running turns cannot hold every slot, so this is mate's slot bookkeeping: a holder still busy after its turn ended, a missed wake-up, or a gauge that never came back down. Compare `mate_turns_running` with `mate_sandboxes_live`; `kubectl --context offsite get sandboxes -n mate` names the holders. Read mate's log (`kubectl --context offsite logs -n mate deploy/mate`), then restart mate, which rebuilds its slots from the Sandboxes that exist and resumes the running turns: `kubectl --context offsite -n mate rollout restart deploy/mate`. Only with MATE_MAX_CONCURRENT above MATE_MAX_SANDBOXES can running turns hold every slot; then raise MATE_MAX_SANDBOXES on the mate Deployment if oldschool's CPU requests allow it."
      - eval_time: 9m
        alertname: MateThreadsQueued
        exp_alerts: []
      - eval_time: 11m
        alertname: MateThreadsQueued
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate threads have waited ten minutes for a turn"
              description: "At least one thread has waited ten minutes for a free turn, and it gives up when it goes quiet at thirty. A slot frees as soon as a turn ends, so every one of the MATE_MAX_CONCURRENT turns has run for that long, or the traffic outgrew the cap. Compare `mate_turns_running` with `mate_queue_depth`, and read mate's log: `kubectl --context offsite logs -n mate deploy/mate`. Stop a runaway turn from its thread, or raise MATE_MAX_CONCURRENT on the mate Deployment."

  # Turns and mints failing, then stopping; each is summed across its label.
  # No failing series crosses the threshold alone, so each matched value
  # counts, and the climbing `end_turn` and `ok` series must not.
  - interval: 1m
    input_series:
      - series: 'mate_turns_ended_total{reason="error",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x1 2x62
      - series: 'mate_turns_ended_total{reason="brain-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x64
      - series: 'mate_turns_ended_total{reason="end_turn",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+10x63
      - series: 'mate_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x1 2x62
      - series: 'mate_mints_total{result="connect-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x64
      - series: 'mate_mints_total{result="ok",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+10x63
    alert_rule_test:
      - eval_time: 10m
        alertname: MateTurnsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate turns are failing"
              description: "More than two turns ended in an error in the last thirty minutes. `error` is a run pi gave up on, usually at the model provider, and `mate_provider_errors_total` says which kind: `auth` is the key in Secret mate-opencode, `limit` the usage cap of the `opencode-go` plan, `timeout` a provider that stopped answering, and `other` anything else, such as a MATE_MODEL the provider refuses. `brain-failed` is the session store or the harness itself failing: read `mate_store_failures_total` by `op`, which MateStoreFailing watches, alongside mate's log (`kubectl --context offsite logs -n mate deploy/mate`), because a `brain-failed` turn with no store failure is a fault in mate's own agent loop. A sandbox that dies mid-turn is a tool error the model sees, not a failed turn."
      - eval_time: 10m
        alertname: MateSandboxMintFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate cannot give a thread a sandbox"
              description: "More than two sandbox mints or connects failed in the last thirty minutes, so turns that need a command or a file get tool errors instead of results. A mint failure is the Sandbox never going Ready — the sandbox image digest, the kata-clh runtime class, or the namespace's restricted PSA. A connect is `pods/exec` into a Ready pod and then the mate-hands hello: a failure is the Role in ../../apps/mate/rbac.yaml, or a daemon that speaks another protocol, which mate condemns as too old so the next call mints a new sandbox. `mate_hands_connects_total` by `result` says which."
      # Nothing failed in the last half hour.
      - eval_time: 60m
        alertname: MateTurnsFailing
        exp_alerts: []
      - eval_time: 60m
        alertname: MateSandboxMintFailing
        exp_alerts: []

  # Session-store failures in a burst across two ops, then none; summed
  # across `op`.
  - interval: 1m
    input_series:
      - series: 'mate_store_failures_total{op="open",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x2 3x62
      - series: 'mate_store_failures_total{op="fault",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x64
    alert_rule_test:
      - eval_time: 10m
        alertname: MateStoreFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is failing to reach its session store"
              description: "mate recorded more than two session-store failures in the last thirty minutes, so threads are told mate cannot reach its memory, or lose a turn mid-run. `op` says where: `open` and `rows` are mate-db unreachable or slow, `migrate` is mate retrying its schema at boot, `fault` a commit that failed mid-turn, `quarantine` a thread whose stored session mate set aside as corrupt and keeps for inspection, and `credentials` the ChatGPT sign-in, which mate keeps in memory and retries until it saves. Check MateDatabaseDown first, then `kubectl cnpg status mate-db -n mate --context offsite` and mate's log: `kubectl --context offsite logs -n mate deploy/mate`. The runbook at https://wiki.lolwtf.ca/runbooks/operate-postgres/ has the database checks."
      - eval_time: 60m
        alertname: MateStoreFailing
        exp_alerts: []

  # mate restarted into a mate-db that is down, and the migrate series is born
  # at 3, which `increase()` reads as none.
  - interval: 1m
    input_series:
      - series: 'mate_store_failures_total{op="migrate",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 3x70
    alert_rule_test:
      - eval_time: 10m
        alertname: MateStoreFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is failing to reach its session store"
              description: "mate recorded more than two session-store failures in the last thirty minutes, so threads are told mate cannot reach its memory, or lose a turn mid-run. `op` says where: `open` and `rows` are mate-db unreachable or slow, `migrate` is mate retrying its schema at boot, `fault` a commit that failed mid-turn, `quarantine` a thread whose stored session mate set aside as corrupt and keeps for inspection, and `credentials` the ChatGPT sign-in, which mate keeps in memory and retries until it saves. Check MateDatabaseDown first, then `kubectl cnpg status mate-db -n mate --context offsite` and mate's log: `kubectl --context offsite logs -n mate deploy/mate`. The runbook at https://wiki.lolwtf.ca/runbooks/operate-postgres/ has the database checks."
      # Half an hour on, the series is no longer new, so the alert clears.
      - eval_time: 60m
        alertname: MateStoreFailing
        exp_alerts: []

  # Two failures are not an alert.
  - interval: 1m
    input_series:
      - series: 'mate_store_failures_total{op="rows",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x1 2x68
    alert_rule_test:
      - eval_time: 10m
        alertname: MateStoreFailing
        exp_alerts: []

  # mate is ready and its key yields no installation token.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x30
      - series: 'mate_github_app_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x30
    alert_rule_test:
      - eval_time: 9m
        alertname: MateGitHubCredentialBroken
        exp_alerts: []
      - eval_time: 12m
        alertname: MateGitHubCredentialBroken
        exp_alerts:
          - exp_labels:
              severity: critical
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate cannot mint a GitHub token"
              description: "mate has held an unusable GitHub App credential for ten minutes, so every sandbox it stamps gets a token that cannot push and every turn meant to end in a pull request ends one step short instead. mate says which half failed on the way up: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. A key that does not parse is the `mate-github-app` Secret and the ExternalSecret that fills it; a key that parses and is refused is the App — MATE_GITHUB_APP_ID on the Deployment, or the installation on `jonpulsifer/infra` having been removed. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ walks both."

  # mate is gone and the collector still serves its last 0: only MateDown pages.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 0x30
      - series: 'mate_github_app_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: MateGitHubCredentialBroken
        exp_alerts: []

  # A working credential.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x30
      - series: 'mate_github_app_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 20m
        alertname: MateGitHubCredentialBroken
        exp_alerts: []

  # Mints failing in a burst, then stopping, while the gauge reads 1. The
  # climbing `ok` mints prove the `result!="ok"` matcher does the work.
  - interval: 1m
    input_series:
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x2 3x62
      - series: 'mate_github_token_mints_total{result="ok",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+10x63
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGitHubTokenMintFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is failing to mint GitHub tokens"
              description: "More than one installation token mint failed in the last thirty minutes against a credential that is otherwise working, so some threads got a sandbox that cannot push and others did not. Read the reason mate recorded: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. Compare `mate_github_token_stamps_total`, which counts the step after this one — a token minted and written into the sandbox pod — because a mint that works and a stamp that does not leaves the same thread unable to push. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ has the checks."
      - eval_time: 60m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []

  # mate restarted and the series returns already carrying its failures,
  # which `increase()` reads as none.
  - interval: 1m
    input_series:
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 2x70
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGitHubTokenMintFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is failing to mint GitHub tokens"
              description: "More than one installation token mint failed in the last thirty minutes against a credential that is otherwise working, so some threads got a sandbox that cannot push and others did not. Read the reason mate recorded: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. Compare `mate_github_token_stamps_total`, which counts the step after this one — a token minted and written into the sandbox pod — because a mint that works and a stamp that does not leaves the same thread unable to push. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ has the checks."
      # An hour on, the series is no longer new, so the alert clears.
      - eval_time: 60m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []

  # One failure is not an alert.
  - interval: 1m
    input_series:
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x70
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []

  # mate is up and holds no ChatGPT sign-in.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x60
      - series: 'mate_chatgpt_signed_in{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x60
    alert_rule_test:
      - eval_time: 29m
        alertname: MateChatGPTSignedOut
        exp_alerts: []
      - eval_time: 32m
        alertname: MateChatGPTSignedOut
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate is not signed in to ChatGPT"
              description: "mate has held no working ChatGPT sign-in for thirty minutes: nobody has signed it in, someone said `chatgpt logout`, or OpenAI refused the token refresh. Until the owner signs it in again, mate cannot use ChatGPT. Mentioning mate with `chatgpt status` says which, and mate's log says why: `kubectl --context offsite logs -n mate deploy/mate | grep -i chatgpt`. To sign in, mention mate with `chatgpt login` and enter the code it sends privately, as the runbook at https://wiki.lolwtf.ca/runbooks/sign-rowbutt-in-to-chatgpt/ says."

  # Signed in, then signed out and back within the half hour: no alert.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x60
      - series: 'mate_chatgpt_signed_in{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x10 0x20 1x30
    alert_rule_test:
      - eval_time: 45m
        alertname: MateChatGPTSignedOut
        exp_alerts: []

  # mate is gone and the collector still serves its last 0: only MateDown
  # pages.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 0x60
      - series: 'mate_chatgpt_signed_in{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x60
    alert_rule_test:
      - eval_time: 45m
        alertname: MateChatGPTSignedOut
        exp_alerts: []

  # With no store the gauge is absent, which never fires.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x60
    alert_rule_test:
      - eval_time: 45m
        alertname: MateChatGPTSignedOut
        exp_alerts: []

  # The token runs down a minute a minute with no refresh: under a day from
  # 61m, and an hour of that fires. A refresh at 151m clears it.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x180
      - series: 'mate_chatgpt_token_expiry_seconds{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 90000-60x150 864000-60x30
    alert_rule_test:
      - eval_time: 115m
        alertname: MateChatGPTTokenNotRefreshing
        exp_alerts: []
      - eval_time: 125m
        alertname: MateChatGPTTokenNotRefreshing
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate's ChatGPT token is not refreshing"
              description: "mate's ChatGPT access token has less than a day left. mate refreshes it once two days are left, so every refresh since then has failed without OpenAI refusing it: auth.openai.com out of reach, which is mate's CiliumNetworkPolicy or DNS, or mate-db failing the write. Read why: `kubectl --context offsite logs -n mate deploy/mate | grep -i chatgpt`. Past its expiry, mate's ChatGPT requests fail until a refresh gets through. The runbook at https://wiki.lolwtf.ca/runbooks/sign-rowbutt-in-to-chatgpt/ has the checks."
      - eval_time: 160m
        alertname: MateChatGPTTokenNotRefreshing
        exp_alerts: []

  # A token the keeper keeps fresh, then one on a mate that is gone.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x180 0x180
      - series: 'mate_chatgpt_token_expiry_seconds{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 200000-60x180 3600x180
    alert_rule_test:
      - eval_time: 170m
        alertname: MateChatGPTTokenNotRefreshing
        exp_alerts: []
      - eval_time: 350m
        alertname: MateChatGPTTokenNotRefreshing
        exp_alerts: []

  # One failed fold of a sandbox's kthx site tokens, then none for an hour. The
  # climbing `ok` folds prove the `result!="ok"` matcher does the work.
  - interval: 1m
    input_series:
      - series: 'mate_kthx_sites_syncs_total{result="save-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x70
      - series: 'mate_kthx_sites_syncs_total{result="ok",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+2x70
    alert_rule_test:
      - eval_time: 10m
        alertname: MateKthxSitesSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate could not keep a sandbox's kthx site tokens"
              description: "A fold of a sandbox's kthx site tokens into the mate-kthx-sites Secret failed, so a site claimed in that turn may have its only bearer in the sandbox, which the quiet teardown deletes. The next turn on that thread retries the save and a teardown makes one last attempt, so a single failure heals itself unless the thread is already quiet. `read-failed` is the file in the sandbox, `save-failed` the Secret. Read why: `kubectl --context offsite logs -n mate deploy/mate | grep -i kthx`. What the ledger holds, names only: `kubectl --context offsite -n mate get secret mate-kthx-sites -o jsonpath='{.data.sites\\.json}' | base64 -d | jq 'map_values(keys)'`."
      # Half an hour on, the series is no longer new, so the alert clears.
      - eval_time: 60m
        alertname: MateKthxSitesSyncFailing
        exp_alerts: []

  # A collector roll: every series restarts under a new pod and instance with
  # the same values. Each eval lands its offset in the old series.
  - interval: 1m
    input_series:
      - series: 'mate_turns_ended_total{reason="error",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 7x29 _x40
      - series: 'mate_turns_ended_total{reason="error",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 7x40
      - series: 'mate_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 5x29 _x40
      - series: 'mate_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 5x40
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 4x29 _x40
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 4x40
      - series: 'mate_store_failures_total{op="open",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 6x29 _x40
      - series: 'mate_store_failures_total{op="open",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 6x40
      - series: 'mate_sandbox_waiters{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 1x29 _x40
      - series: 'mate_sandbox_waiters{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 1x40
      - series: 'mate_queue_depth{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 1x29 _x40
      - series: 'mate_queue_depth{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 1x40
    alert_rule_test:
      - eval_time: 50m
        alertname: MateTurnsFailing
        exp_alerts: []
      - eval_time: 50m
        alertname: MateSandboxMintFailing
        exp_alerts: []
      - eval_time: 50m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []
      - eval_time: 50m
        alertname: MateStoreFailing
        exp_alerts: []
      # Both waits have held for their full windows across the roll.
      - eval_time: 45m
        alertname: MateSandboxWaitsLong
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              pod: opentelemetry-collector-6f8df4944d-jwcb7
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate turns have waited a quarter of an hour for a sandbox"
              description: "A turn has waited fifteen minutes for a sandbox slot, and its thread's sandbox card still says it is waiting. The waiting turn is one of the MATE_MAX_CONCURRENT running turns, and it takes the slot of any thread idle for five minutes. While MATE_MAX_CONCURRENT is at most MATE_MAX_SANDBOXES, as deployed, running turns cannot hold every slot, so this is mate's slot bookkeeping: a holder still busy after its turn ended, a missed wake-up, or a gauge that never came back down. Compare `mate_turns_running` with `mate_sandboxes_live`; `kubectl --context offsite get sandboxes -n mate` names the holders. Read mate's log (`kubectl --context offsite logs -n mate deploy/mate`), then restart mate, which rebuilds its slots from the Sandboxes that exist and resumes the running turns: `kubectl --context offsite -n mate rollout restart deploy/mate`. Only with MATE_MAX_CONCURRENT above MATE_MAX_SANDBOXES can running turns hold every slot; then raise MATE_MAX_SANDBOXES on the mate Deployment if oldschool's CPU requests allow it."
      - eval_time: 45m
        alertname: MateThreadsQueued
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              pod: opentelemetry-collector-6f8df4944d-jwcb7
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate threads have waited ten minutes for a turn"
              description: "At least one thread has waited ten minutes for a free turn, and it gives up when it goes quiet at thirty. A slot frees as soon as a turn ends, so every one of the MATE_MAX_CONCURRENT turns has run for that long, or the traffic outgrew the cap. Compare `mate_turns_running` with `mate_queue_depth`, and read mate's log: `kubectl --context offsite logs -n mate deploy/mate`. Stop a runaway turn from its thread, or raise MATE_MAX_CONCURRENT on the mate Deployment."

  - interval: 30m
    input_series:
      - series: 'mate_turns_total{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+5x30
      - series: 'mate_turn_cost_usd_sum{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0.01+1x30
    alert_rule_test:
      - eval_time: 150m
        alertname: MateTurnBudgetNearlySpent
        exp_alerts: []
      - eval_time: 150m
        alertname: MateSpendAboveBudget
        exp_alerts: []
      - eval_time: 900m
        alertname: MateTurnBudgetNearlySpent
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate has spent most of its daily turn budget"
              description: "More than 96 of the 120 turns allowed in a rolling day have been taken. Past 120 every thread is told the day is spent until the window rolls off. If this is real use rather than a loop, MATE_MAX_TURNS_PER_DAY on the mate Deployment is the number to move — and the spend that goes with it is what MateSpendAboveBudget watches."
      - eval_time: 900m
        alertname: MateSpendAboveBudget
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate's reported spend is above its daily budget"
              description: "The turns of the last rolling day report more than $25 of model spend. The number is qwen3.8-max's list price from pi's catalog, summed over each run: a shadow of the flat-rate `opencode-go` plan, not a bill. Volume is capped at 120 turns/day, so this is the tokens per turn moving: check MATE_MODEL and MATE_THINKING on the mate Deployment, then which threads run long turns. The threshold is a first estimate; move it once a week of turns shows a normal day."

  # A bot connected all day stops reporting the identify budget.
  - interval: 1m
    input_series:
      - series: 'mate_discord_session_start_limit{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1000x40
      - series: 'mate_discord_session_start_remaining{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 700x10 300x30
    alert_rule_test:
      - eval_time: 9m
        alertname: MateIdentifyBudgetLow
        exp_alerts: []
      - eval_time: 30m
        alertname: MateIdentifyBudgetLow
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate's Discord identify budget is approaching its reserve"
              description: "Fewer than 40% of the day's IDENTIFYs are left, against a reserve of 20% that mate will not spend into — below that it stops connecting until Discord's reset, and exhausting the budget outright makes Discord rotate the bot token. Something is reconnecting: read the pod for `gateway closed` lines and their codes, and check whether the Deployment is rolling (the digest-bump CD opens a PR per build)."

  # The warm pool stops refilling. It fires only on a full window, and one
  # full-pool sample clears it.
  - interval: 1m
    input_series:
      - series: 'mate_spares_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x10 0x50
      - series: 'mate_spares_wanted{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x60
    alert_rule_test:
      - eval_time: 25m
        alertname: MateWarmPoolShort
        exp_alerts: []
      - eval_time: 35m
        alertname: MateWarmPoolShort
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate is not keeping a sandbox warm"
              description: "For twenty minutes mate has held fewer Ready spares than MATE_SPARES asks for, so a thread with no sandbox of its own pays the full cold mint at its turn's first tool call, which waits tens of seconds on the thread's sandbox card. A turn that only talks mints nothing and waits for nothing. `kubectl --context offsite get sandboxes -n mate -l lolwtf.ca/spare` is what is standing: a spare that stops being Ready is condemned and replaced on the next sweep, so one that is still there is a delete the apiserver refused. mate's log names which half failed — `could not condemn a spare that stopped being ready`, or `warming a spare failed` with the reason the node or the apiserver gave."

  # MATE_SPARES unset: nothing wanted, nothing held, no alert.
  - interval: 1m
    input_series:
      - series: 'mate_spares_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x60
      - series: 'mate_spares_wanted{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x60
    alert_rule_test:
      - eval_time: 45m
        alertname: MateWarmPoolShort
        exp_alerts: []

  # The instance stops reporting 0 at minute 11.
  - interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="mate",cluster="mate-db",pod="mate-db-1",job="mate/mate-db"}'
        values: 1x10 0x20
    alert_rule_test:
      - eval_time: 20m
        alertname: MateDatabaseDown
        exp_alerts: []
      - eval_time: 22m
        alertname: MateDatabaseDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: mate
              cluster: mate-db
              pod: mate-db-1
              job: mate/mate-db
            exp_annotations:
              message: "mate's session database is not reporting"
              description: "`cnpg_collector_up` for the mate-db cluster is 0 or missing: the instance is down, or the PodMonitor it exports through is not being scraped, so nothing can read or write the session store. `kubectl cnpg status mate-db -n mate --context offsite` shows which. The runbook at https://wiki.lolwtf.ca/runbooks/operate-postgres/ has the checks."

  # No instance series at all, so only the `absent` arm can fire.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 9m
        alertname: MateDatabaseDown
        exp_alerts: []
      - eval_time: 12m
        alertname: MateDatabaseDown
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: mate
              cluster: mate-db
            exp_annotations:
              message: "mate's session database is not reporting"
              description: "`cnpg_collector_up` for the mate-db cluster is 0 or missing: the instance is down, or the PodMonitor it exports through is not being scraped, so nothing can read or write the session store. `kubectl cnpg status mate-db -n mate --context offsite` shows which. The runbook at https://wiki.lolwtf.ca/runbooks/operate-postgres/ has the checks."

  # The database grows from 1 GiB to 4.5 GiB of a 5 GiB claim at minute 31.
  - interval: 1m
    input_series:
      - series: 'cnpg_pg_database_size_bytes{namespace="mate",datname="mate",pod="mate-db-1",job="mate/mate-db"}'
        values: 1073741824x30 4831838208x60
      - series: 'kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace="mate",persistentvolumeclaim="mate-db-1",job="kube-state-metrics"}'
        values: 5368709120x90
    alert_rule_test:
      - eval_time: 50m
        alertname: MateDatabaseVolumeFilling
        exp_alerts: []
      - eval_time: 65m
        alertname: MateDatabaseVolumeFilling
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate's session database is past 80% of its volume"
              description: "The databases in mate-db sum to more than 80% of what its claim asks for. local-path does not enforce the size, so the node's disk is the real limit. Raise `storage.size` in clusters/offsite/apps/mate/database.yaml, which the storage class allows live, or prune the corpus."

  # A CronJob created at minute 0 that has never run is inside its first
  # window, not failing.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: 0x60
    alert_rule_test:
      - eval_time: 60m
        alertname: MateDatabaseBackupFailing
        exp_alerts: []

  # Created 35h50m before the test starts and never succeeded: the window
  # closes at minute 10, and the alert fires 15 minutes later.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -129000x60
    alert_rule_test:
      - eval_time: 20m
        alertname: MateDatabaseBackupFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: MateDatabaseBackupFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: mate
              cronjob: mate-db-backup
              job: kube-state-metrics
            exp_annotations:
              message: "The nightly mate database dump has not succeeded"
              description: "mate-db-backup has not succeeded in 36 hours, one whole window missed with the schedule at 04:43 UTC, so the bucket has no current dump of the session store. Read both containers of the most recent Job within three days, after which the Job is collected: dump is pg_dump, upload is gcloud. A 403 from the upload is the federation or the bucket grant in terraform/gcp/projects/homelab-ng/mate.tf. If there is no Job at all, the CronJob stopped firing, is suspended or is gone."

  # An old CronJob whose last success an hour ago holds the alert off; one
  # 35h50m ago goes stale at minute 10.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -1000000x60
      - series: 'kube_cronjob_status_last_successful_time{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -3600x60
    alert_rule_test:
      - eval_time: 60m
        alertname: MateDatabaseBackupFailing
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -1000000x60
      - series: 'kube_cronjob_status_last_successful_time{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -129000x60
    alert_rule_test:
      - eval_time: 20m
        alertname: MateDatabaseBackupFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: MateDatabaseBackupFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: mate
              cronjob: mate-db-backup
              job: kube-state-metrics
            exp_annotations:
              message: "The nightly mate database dump has not succeeded"
              description: "mate-db-backup has not succeeded in 36 hours, one whole window missed with the schedule at 04:43 UTC, so the bucket has no current dump of the session store. Read both containers of the most recent Job within three days, after which the Job is collected: dump is pg_dump, upload is gcloud. A 403 from the upload is the federation or the bucket grant in terraform/gcp/projects/homelab-ng/mate.tf. If there is no Job at all, the CronJob stopped firing, is suspended or is gone."

  # The CronJob is gone, so only the `absent` arm can fire.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 14m
        alertname: MateDatabaseBackupFailing
        exp_alerts: []
      - eval_time: 17m
        alertname: MateDatabaseBackupFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: mate
              cronjob: mate-db-backup
            exp_annotations:
              message: "The nightly mate database dump has not succeeded"
              description: "mate-db-backup has not succeeded in 36 hours, one whole window missed with the schedule at 04:43 UTC, so the bucket has no current dump of the session store. Read both containers of the most recent Job within three days, after which the Job is collected: dump is pg_dump, upload is gcloud. A 403 from the upload is the federation or the bucket grant in terraform/gcp/projects/homelab-ng/mate.tf. If there is no Job at all, the CronJob stopped firing, is suspended or is gone."
