---
# promtool tests for mate-rules.yaml, run by `mise run k8s:check-rules`; no
# kustomization lists this file. Series carry the collector's labels, as deployed.
rule_files:
  - mate.yaml

evaluation_interval: 1m

tests:
  # The pod goes: MateDown fires, MateNotReporting does not.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x10 0x30
      - series: 'mate_sandboxes_live{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x10
    alert_rule_test:
      - eval_time: 20m
        alertname: MateDown
        exp_alerts: []
      - eval_time: 22m
        alertname: MateDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: mate
              deployment: mate
              job: kube-state-metrics
              instance: 10.101.1.123:8080
            exp_annotations:
              message: "Rowbutt is not connected to Discord"
              description: "mate has had no ready pod for ten minutes, so a mention in the homelab guild gets no thread and a live thread gets no answer. A `Recreate` roll takes the only pod down first, so a couple of minutes of this is a normal deploy. Read the pod: `kubectl --context offsite logs -n mate deploy/mate`. If the last line is the budget guard sleeping to the reset, mate is protecting the IDENTIFY budget and will come back on its own; if it is a close code, MateGatewayFatalClose says which."
      - eval_time: 35m
        alertname: MateNotReporting
        exp_alerts: []

  # The Deployment is gone, so only the `absent` arm can fire.
  - interval: 1m
    input_series:
      - series: 'up{job="kube-state-metrics"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 9m
        alertname: MateDown
        exp_alerts: []
      - eval_time: 12m
        alertname: MateDown
        exp_alerts:
          # `absent()` keeps its equality matchers as labels.
          - exp_labels:
              severity: critical
              namespace: mate
              deployment: mate
            exp_annotations:
              message: "Rowbutt is not connected to Discord"
              description: "mate has had no ready pod for ten minutes, so a mention in the homelab guild gets no thread and a live thread gets no answer. A `Recreate` roll takes the only pod down first, so a couple of minutes of this is a normal deploy. Read the pod: `kubectl --context offsite logs -n mate deploy/mate`. If the last line is the budget guard sleeping to the reset, mate is protecting the IDENTIFY budget and will come back on its own; if it is a close code, MateGatewayFatalClose says which."

  # mate is ready but no series arrive.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 14m
        alertname: MateNotReporting
        exp_alerts: []
      - eval_time: 17m
        alertname: MateNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is up but its metrics have stopped arriving"
              description: "mate has a ready pod and no `mate_*` series for fifteen minutes, so every other alert in this group is blind. Check mate's own log line for the endpoint (`metrics exporting`), then the collector: `kubectl --context offsite logs -n monitoring deploy/opentelemetry-collector`. A silent drop with the process healthy is usually the CiliumNetworkPolicy — mate is allowed exactly one destination in the monitoring namespace."

  # A fatal close on a fresh process: the counter is born at 1, so only the
  # second arm fires. A recoverable close never fires.
  - interval: 1m
    input_series:
      - series: 'mate_gateway_closes_total{code="4004",fatal="true",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x130
      - series: 'mate_gateway_closes_total{code="1006",fatal="false",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x130
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGatewayFatalClose
        exp_alerts:
          - exp_labels:
              severity: critical
              code: "4004"
              fatal: "true"
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "Discord closed mate's gateway with code 4004"
              description: "A close code mate treats as a configuration error, so it exited instead of reconnecting and will crash-loop until the cause is fixed. 4004 is the token — check whether `rowbutt discord bot token` was rotated in 1Password and whether the mate-discord ExternalSecret carried it through. 4013/4014 are the intents, which live in apps/mate/src/gateway.ts and in the developer portal; Message Content is privileged and can be revoked there without anything in git changing."
      # An hour on, the series is no longer new, so the alert clears.
      - eval_time: 125m
        alertname: MateGatewayFatalClose
        exp_alerts: []

  # Both slots held for a full 45m window of data.
  - interval: 1m
    input_series:
      - series: 'mate_sandboxes_live{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 2x60
    alert_rule_test:
      - eval_time: 44m
        alertname: MateSandboxesAtCap
        exp_alerts: []
      - eval_time: 48m
        alertname: MateSandboxesAtCap
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate has been at its sandbox cap for three quarters of an hour"
              description: "Both sandbox slots have been held continuously for forty-five minutes, so any further thread is queued behind them. Compare `mate_queue_depth`: with nobody waiting this is two busy threads, and with a queue it is starvation. `kubectl --context offsite get sandboxes -n mate` names them — a Sandbox with no live thread behind it is a leak, and its `lolwtf.ca/thread` label says which thread it thinks it belongs to."

  # One slot frees for a minute at t=20.
  - interval: 1m
    input_series:
      - series: 'mate_sandboxes_live{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 2x19 1x1 2x60
    alert_rule_test:
      - eval_time: 60m
        alertname: MateSandboxesAtCap
        exp_alerts: []

  # Turns and mints failing, then stopping; each is summed across its label.
  - interval: 1m
    input_series:
      - series: 'mate_turns_ended_total{reason="error",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x3 4x60
      - series: 'mate_turns_ended_total{reason="sandbox-died",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x64
      - series: 'mate_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x1 2x62
      - series: 'mate_mints_total{result="attach-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x64
      - series: 'mate_mints_total{result="ok",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+10x63
    alert_rule_test:
      - eval_time: 10m
        alertname: MateTurnsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate turns are failing"
              description: "More than two turns ended in an error or a dead sandbox in the last thirty minutes. `error` is what the harness reported over ACP — the OpenCode Go key, the model id in MATE_SANDBOX_MODEL, or a region gate on the model. `sandbox-died` is the pod: read `kubectl --context offsite describe sandbox -n mate` and the node's pressure before blaming the harness."
      - eval_time: 10m
        alertname: MateSandboxMintFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate cannot give a thread a sandbox"
              description: "More than two mints or attaches failed in the last thirty minutes, so a human asking mate a question is getting a plain refusal instead of an answer. A mint failure is the Sandbox never going Ready — the harness image digest, the kata-clh runtime class, or the namespace's restricted PSA. An attach failure is `pods/exec` into a Ready pod, which is the Role in ../../apps/mate/rbac.yaml or the harness not starting inside the sandbox."
      # Nothing failed in the last half hour. The climbing `ok` mints prove the
      # result matcher does the work.
      - eval_time: 60m
        alertname: MateTurnsFailing
        exp_alerts: []
      - eval_time: 60m
        alertname: MateSandboxMintFailing
        exp_alerts: []

  # mate is ready and its key yields no installation token.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x30
      - series: 'mate_github_app_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x30
    alert_rule_test:
      - eval_time: 9m
        alertname: MateGitHubCredentialBroken
        exp_alerts: []
      - eval_time: 12m
        alertname: MateGitHubCredentialBroken
        exp_alerts:
          - exp_labels:
              severity: critical
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate cannot mint a GitHub token"
              description: "mate has held an unusable GitHub App credential for ten minutes, so every sandbox it stamps gets a token that cannot push and every turn meant to end in a pull request ends one step short instead. mate says which half failed on the way up: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. A key that does not parse is the `mate-github-app` Secret and the ExternalSecret that fills it; a key that parses and is refused is the App — MATE_GITHUB_APP_ID on the Deployment, or the installation on `jonpulsifer/infra` having been removed. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ walks both."

  # mate is gone and the collector still serves its last 0: only MateDown pages.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 0x30
      - series: 'mate_github_app_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: MateGitHubCredentialBroken
        exp_alerts: []

  # A working credential.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="mate",deployment="mate",job="kube-state-metrics",instance="10.101.1.123:8080"}'
        values: 1x30
      - series: 'mate_github_app_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x30
    alert_rule_test:
      - eval_time: 20m
        alertname: MateGitHubCredentialBroken
        exp_alerts: []

  # Mints failing in a burst, then stopping, while the gauge reads 1. The
  # climbing `ok` mints prove the `result!="ok"` matcher does the work.
  - interval: 1m
    input_series:
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+1x2 3x62
      - series: 'mate_github_token_mints_total{result="ok",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+10x63
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGitHubTokenMintFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is failing to mint GitHub tokens"
              description: "More than one installation token mint failed in the last thirty minutes against a credential that is otherwise working, so some threads got a sandbox that cannot push and others did not. Read the reason mate recorded: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. Compare `mate_github_token_stamps_total`, which counts the step after this one — a token minted and written into the sandbox pod — because a mint that works and a stamp that does not leaves the same thread unable to push. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ has the checks."
      - eval_time: 60m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []

  # mate restarted and the series returns already carrying its failures,
  # which `increase()` reads as none.
  - interval: 1m
    input_series:
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 2x70
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGitHubTokenMintFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate is failing to mint GitHub tokens"
              description: "More than one installation token mint failed in the last thirty minutes against a credential that is otherwise working, so some threads got a sandbox that cannot push and others did not. Read the reason mate recorded: `kubectl --context offsite logs -n mate deploy/mate | grep -i github`. Compare `mate_github_token_stamps_total`, which counts the step after this one — a token minted and written into the sandbox pod — because a mint that works and a stamp that does not leaves the same thread unable to push. The runbook at https://wiki.lolwtf.ca/runbooks/repair-the-rowbutt-github-credential/ has the checks."
      # An hour on, the series is no longer new, so the alert clears.
      - eval_time: 60m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []

  # One failure is not an alert.
  - interval: 1m
    input_series:
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x70
    alert_rule_test:
      - eval_time: 10m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []

  # One failed fold of a sandbox's kthx site tokens, then none for an hour. The
  # climbing `ok` folds prove the `result!="ok"` matcher does the work.
  - interval: 1m
    input_series:
      - series: 'mate_kthx_sites_syncs_total{result="save-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x70
      - series: 'mate_kthx_sites_syncs_total{result="ok",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+2x70
    alert_rule_test:
      - eval_time: 10m
        alertname: MateKthxSitesSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate could not keep a sandbox kthx site tokens"
              description: "A fold of a sandbox's kthx site tokens into the mate-kthx-sites Secret failed, so a site claimed in that turn may have its only bearer in the sandbox, which the quiet teardown deletes. The next turn on that thread retries the save and a teardown makes one last attempt, so a single failure heals itself unless the thread is already quiet. `read-failed` is the file in the sandbox, `save-failed` the Secret. Read why: `kubectl --context offsite logs -n mate deploy/mate | grep -i kthx`. What the ledger holds, names only: `kubectl --context offsite -n mate get secret mate-kthx-sites -o jsonpath='{.data.sites\\.json}' | base64 -d | jq 'map_values(keys)'`."
      # Half an hour on, the series is no longer new, so the alert clears.
      - eval_time: 60m
        alertname: MateKthxSitesSyncFailing
        exp_alerts: []

  # A collector roll: every series restarts under a new pod and instance with
  # the same values. Each eval lands its offset in the old series.
  - interval: 1m
    input_series:
      - series: 'mate_turns_ended_total{reason="error",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 7x29 _x40
      - series: 'mate_turns_ended_total{reason="error",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 7x40
      - series: 'mate_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 5x29 _x40
      - series: 'mate_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 5x40
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 4x29 _x40
      - series: 'mate_github_token_mints_total{result="mint-failed",exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 4x40
      - series: 'mate_sandboxes_live{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-68db544b7d-bwnt6",instance="10.101.0.154:8889"}'
        values: 2x29 _x40
      - series: 'mate_sandboxes_live{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",pod="opentelemetry-collector-6f8df4944d-jwcb7",instance="10.101.1.173:8889"}'
        values: _x29 2x40
    alert_rule_test:
      - eval_time: 50m
        alertname: MateTurnsFailing
        exp_alerts: []
      - eval_time: 50m
        alertname: MateSandboxMintFailing
        exp_alerts: []
      - eval_time: 50m
        alertname: MateGitHubTokenMintFailing
        exp_alerts: []
      # The cap has held for the full window across the roll.
      - eval_time: 65m
        alertname: MateSandboxesAtCap
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              pod: opentelemetry-collector-6f8df4944d-jwcb7
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate has been at its sandbox cap for three quarters of an hour"
              description: "Both sandbox slots have been held continuously for forty-five minutes, so any further thread is queued behind them. Compare `mate_queue_depth`: with nobody waiting this is two busy threads, and with a queue it is starvation. `kubectl --context offsite get sandboxes -n mate` names them — a Sandbox with no live thread behind it is a leak, and its `lolwtf.ca/thread` label says which thread it thinks it belongs to."

  - interval: 30m
    input_series:
      - series: 'mate_turns_total{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1+5x30
      - series: 'mate_turn_cost_usd_sum{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0.01+0.05x30
    alert_rule_test:
      - eval_time: 150m
        alertname: MateTurnBudgetNearlySpent
        exp_alerts: []
      - eval_time: 150m
        alertname: MateSpendAboveBudget
        exp_alerts: []
      - eval_time: 900m
        alertname: MateTurnBudgetNearlySpent
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate has spent most of its daily turn budget"
              description: "More than 96 of the 120 turns allowed in a rolling day have been taken. Past 120 every thread is told the day is spent until the window rolls off. If this is real use rather than a loop, MATE_MAX_TURNS_PER_DAY on the mate Deployment is the number to move — and the spend that goes with it is what MateSpendAboveBudget watches."
      - eval_time: 900m
        alertname: MateSpendAboveBudget
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              message: "mate's reported spend is above its daily budget"
              description: "The turns of the last rolling day report more than $0.50 of model spend, against a measured $0.002178 for a real turn. Volume is capped at 120 turns/day, so this is the price per turn moving: check MATE_SANDBOX_MODEL on the mate Deployment and what the harness is actually being handed. The number is OpenCode Go's list-price shadow on a flat-rate plan, not a bill."

  # A bot connected all day stops reporting the identify budget.
  - interval: 1m
    input_series:
      - series: 'mate_discord_session_start_limit{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1000x40
      - series: 'mate_discord_session_start_remaining{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 700x10 300x30
    alert_rule_test:
      - eval_time: 9m
        alertname: MateIdentifyBudgetLow
        exp_alerts: []
      - eval_time: 30m
        alertname: MateIdentifyBudgetLow
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate's Discord identify budget is approaching its reserve"
              description: "Fewer than 40% of the day's IDENTIFYs are left, against a reserve of 20% that mate will not spend into — below that it stops connecting until Discord's reset, and exhausting the budget outright makes Discord rotate the bot token. Something is reconnecting: read the pod for `gateway closed` lines and their codes, and check whether the Deployment is rolling (the digest-bump CD opens a PR per build)."

  # The warm pool stops refilling. It fires only on a full window, and one
  # full-pool sample clears it.
  - interval: 1m
    input_series:
      - series: 'mate_spares_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x10 0x50
      - series: 'mate_spares_wanted{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 1x60
    alert_rule_test:
      - eval_time: 25m
        alertname: MateWarmPoolShort
        exp_alerts: []
      - eval_time: 35m
        alertname: MateWarmPoolShort
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: mate
              otel_scope_name: mate
              job: opentelemetry-collector
              namespace: monitoring
              instance: 10.101.1.173:8889
            exp_annotations:
              message: "mate is not keeping a sandbox warm"
              description: "For twenty minutes mate has held fewer Ready spares than MATE_SPARES asks for, so every thread has been paying the full cold start again — tens of seconds of a line saying `booting the sandbox` before a word of the answer. `kubectl --context offsite get sandboxes -n mate -l lolwtf.ca/spare` is what is standing: a spare that stops being Ready is condemned and replaced on the next sweep, so one that is still there is a delete the apiserver refused. mate's log names which half failed — `could not condemn a spare that stopped being ready`, or `warming a spare failed` with the reason the node or the apiserver gave."

  # MATE_SPARES unset: nothing wanted, nothing held, no alert.
  - interval: 1m
    input_series:
      - series: 'mate_spares_ready{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x60
      - series: 'mate_spares_wanted{exported_job="mate",otel_scope_name="mate",job="opentelemetry-collector",namespace="monitoring",instance="10.101.1.173:8889"}'
        values: 0x60
    alert_rule_test:
      - eval_time: 45m
        alertname: MateWarmPoolShort
        exp_alerts: []
