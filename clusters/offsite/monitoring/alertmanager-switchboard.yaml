---
# Rings the owner's phone through switchboard (docs/apps/switchboard.md) for a
# critical alert. The Discord config in base/monitoring stays the record of
# every alert; this one carries only what is worth a call.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-switchboard
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-switchboard
    creationPolicy: Owner
  data:
    # The alert-token field of the `switchboard` item, which also holds the
    # ring token mate's sandboxes use. Until the item exists this Secret is
    # missing, so kube-prometheus.yaml leaves this config out of the selector:
    # a selected config with a missing Secret is rejected, receiver and route
    # together, and PrometheusOperatorRejectedResources fires.
    - secretKey: token
      remoteRef:
        key: switchboard
        property: alert-token
---
# The operator makes each selected AlertmanagerConfig a sub-route with
# `continue: true`, so a critical alert reaches Discord and this receiver.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: switchboard
  namespace: monitoring
  labels:
    alertmanagerConfig: switchboard
spec:
  route:
    # Matches every namespace only while alertmanagerConfigMatcherStrategy is None.
    receiver: switchboard
    matchers:
      - name: severity
        value: critical
        matchType: "="
      # Watchdog always fires, and InfoInhibitor is a synthetic inhibitor.
      - name: alertname
        value: Watchdog|InfoInhibitor
        matchType: "!~"
    groupBy: [cluster, namespace, alertname]
    groupWait: 30s
    groupInterval: 5m
    # A repeat retries a notification switchboard skipped (quiet hours, the
    # cap, the cooldown) or failed to place. After a placed call switchboard
    # dedupes the fingerprint until the alert resolves, so a still-firing
    # alert rings once and a repeat costs nothing. Short, so a page held over
    # quiet hours rings soon after they end. The seen set is in memory, so a
    # switchboard restart forgets it and the next repeat rings once more for
    # each still-firing critical group, within the cooldown and the cap.
    repeatInterval: 15m
  receivers:
    - name: switchboard
      webhookConfigs:
        - url: http://switchboard.elevenlabs.svc.cluster.local:8080/alertmanager
          # A resolved notification clears the fingerprint, so the next firing
          # of the same alert can ring again.
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alertmanager-switchboard
                key: token
