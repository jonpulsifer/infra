---
# Everything Garage and its bootstrap need, from the item `garage-offsite` in
# the 1Password vault `homelab`: the RPC secret, the admin token, and the four
# pre-generated keys that the bootstrap imports.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: garage
    creationPolicy: Owner
  data:
    - secretKey: GARAGE_RPC_SECRET
      remoteRef: {key: garage-offsite, property: rpc-secret}
    - secretKey: GARAGE_ADMIN_TOKEN
      remoteRef: {key: garage-offsite, property: admin-token}
    - secretKey: VELERO_ACCESS_KEY_ID
      remoteRef: {key: garage-offsite, property: velero-access-key-id}
    - secretKey: VELERO_SECRET_ACCESS_KEY
      remoteRef: {key: garage-offsite, property: velero-secret-access-key}
    - secretKey: CNPG_ACCESS_KEY_ID
      remoteRef: {key: garage-offsite, property: cnpg-access-key-id}
    - secretKey: CNPG_SECRET_ACCESS_KEY
      remoteRef: {key: garage-offsite, property: cnpg-secret-access-key}
    - secretKey: ETCD_ACCESS_KEY_ID
      remoteRef: {key: garage-offsite, property: etcd-access-key-id}
    - secretKey: ETCD_SECRET_ACCESS_KEY
      remoteRef: {key: garage-offsite, property: etcd-secret-access-key}
    - secretKey: PUSH_ACCESS_KEY_ID
      remoteRef: {key: garage-offsite, property: push-access-key-id}
    - secretKey: PUSH_SECRET_ACCESS_KEY
      remoteRef: {key: garage-offsite, property: push-secret-access-key}
