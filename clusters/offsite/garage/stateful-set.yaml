---
# Offsite's Garage. It runs on oldschool's host network so the S3 port answers
# at oldschool.lolwtf.ca, and keeps its metadata and data under that node's
# NODE_DATA_ROOT, the `data` volume. A rebuild of the node empties it; Restore
# from the GCS copy refills it.
# Updates stop the pod before they start its replacement, so the two never
# fight for the host's ports.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: oldschool
      automountServiceAccountToken: false
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage
                  key: GARAGE_ADMIN_TOKEN
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        - name: bootstrap
          image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
          command: ["sh", "/bootstrap/bootstrap.sh"]
          envFrom:
            - secretRef:
                name: garage
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: garage
        - name: bootstrap
          configMap:
            name: garage-bootstrap
        - name: tmp
          emptyDir: {}
        - name: data
          hostPath:
            path: ${NODE_DATA_ROOT}/garage
            type: DirectoryOrCreate
