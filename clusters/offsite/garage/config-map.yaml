---
# The RPC secret and admin token come from the environment. The admin API
# listens on loopback so only the bootstrap sidecar reaches it on the host's
# network.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "127.0.0.1:3903"
---
# Idempotent: it assigns the layout only while the cluster has no roles,
# imports each key that does not exist, creates each missing bucket and
# applies the grants again. The loop reruns it so a grant removed by hand
# comes back.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-bootstrap
  labels:
    app.kubernetes.io/name: garage
data:
  bootstrap.sh: |
    set -eu
    api=http://127.0.0.1:3903
    out=/tmp/response.json

    call() {
      if [ $# -ge 3 ]; then
        code=$(curl -sS -o "$out" -w '%{http_code}' -X "$1" \
          -H "Authorization: Bearer $GARAGE_ADMIN_TOKEN" \
          -H 'Content-Type: application/json' --data "$3" "$api$2")
      else
        code=$(curl -sS -o "$out" -w '%{http_code}' -X "$1" \
          -H "Authorization: Bearer $GARAGE_ADMIN_TOKEN" "$api$2")
      fi
    }

    expect() {
      if [ "$code" != "$1" ]; then
        echo "unexpected $code from $2: $(cat "$out")" >&2
        exit 1
      fi
    }

    ensure_layout() {
      call GET /v2/GetClusterLayout
      expect 200 GetClusterLayout
      [ "$(jq '.roles | length' "$out")" = 0 ] || return 0
      version=$(jq .version "$out")
      call GET /v2/GetClusterStatus
      expect 200 GetClusterStatus
      node=$(jq -r '.nodes[0].id' "$out")
      call POST /v2/UpdateClusterLayout "$(jq -n --arg id "$node" \
        '{roles: [{id: $id, zone: "offsite", capacity: 100000000000, tags: []}]}')"
      expect 200 UpdateClusterLayout
      call POST /v2/ApplyClusterLayout "{\"version\": $((version + 1))}"
      expect 200 ApplyClusterLayout
    }

    import_key() {
      call POST /v2/ImportKey "$(jq -n --arg n "$1" --arg i "$2" --arg s "$3" \
        '{name: $n, accessKeyId: $i, secretAccessKey: $s}')"
      [ "$code" = 409 ] || expect 200 "ImportKey $1"
    }

    ensure_bucket() {
      call GET "/v2/GetBucketInfo?globalAlias=$1"
      if [ "$code" != 200 ]; then
        call POST /v2/CreateBucket "$(jq -n --arg a "$1" '{globalAlias: $a}')"
        expect 200 "CreateBucket $1"
      fi
      jq -r .id "$out"
    }

    grant() {
      call POST "/v2/$1BucketKey" "$(jq -n --arg b "$2" --arg k "$3" --argjson p "$4" \
        '{bucketId: $b, accessKeyId: $k, permissions: $p}')"
      expect 200 "$1BucketKey"
    }

    reconcile() {
      until call GET /v2/GetClusterStatus 2>/dev/null && [ "$code" = 200 ]; do
        sleep 2
      done
      ensure_layout

      import_key velero "$VELERO_ACCESS_KEY_ID" "$VELERO_SECRET_ACCESS_KEY"
      import_key cnpg "$CNPG_ACCESS_KEY_ID" "$CNPG_SECRET_ACCESS_KEY"
      import_key etcd "$ETCD_ACCESS_KEY_ID" "$ETCD_SECRET_ACCESS_KEY"
      import_key push "$PUSH_ACCESS_KEY_ID" "$PUSH_SECRET_ACCESS_KEY"

      velero=$(ensure_bucket velero)
      cnpg=$(ensure_bucket cnpg)
      etcd=$(ensure_bucket etcd)

      owner='{"read": true, "write": true, "owner": true}'
      grant Allow "$velero" "$VELERO_ACCESS_KEY_ID" "$owner"
      grant Allow "$cnpg" "$CNPG_ACCESS_KEY_ID" "$owner"
      grant Allow "$etcd" "$ETCD_ACCESS_KEY_ID" "$owner"

      for bucket in "$velero" "$cnpg" "$etcd"; do
        grant Allow "$bucket" "$PUSH_ACCESS_KEY_ID" '{"read": true}'
        grant Deny "$bucket" "$PUSH_ACCESS_KEY_ID" '{"write": true, "owner": true}'
      done
      echo "garage bootstrap complete"
    }

    while :; do
      reconcile
      sleep 3600
    done
