---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dave
  namespace: agents-sandbox
spec:
  interval: 1h
  chart:
    spec:
      chart: packages/charts/ai-agent
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  values:
    image: ghcr.io/jonpulsifer/ai-agents:latest@sha256:8a472e9cc73dd2ef45825a7f9f6f5413f5bdf210b7608b6cb823e23b4e230f30
    port: 18789
    hostname: dave.lolwtf.ca
    storageSize: 2Gi
    # The MoonPay CLI keeps its vault at ~/.config/moonpay, on the ephemeral
    # rootfs; only /home/agent/config survives a restart, so the vault is
    # symlinked onto it before anything runs. The rest is idempotent per boot:
    # dave's own wallet exists once, the moonpay skills land where the gateway
    # reads them, and the x402 spend cap is 10000 atomic ($0.01 USDC) per
    # payment — a clanker on an allowance.
    command: |
      set -e
      mkdir -p /home/agent/config/.config/moonpay /home/agent/.config
      ln -sfn /home/agent/config/.config/moonpay /home/agent/.config/moonpay
      mp wallet list --json | grep -q '"dave"' || mp wallet create --name dave >/dev/null
      mp x402 limit set --amount 10000 >/dev/null
      mp skill install --dir openclaw --force >/dev/null 2>&1 || true
      exec openclaw gateway --bind=lan --port 18789 --allow-unconfigured --verbose
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 8Gi
        cpu: 4000m
    npmTools:
      - "@moonpay/cli"
    ingress:
      enabled: true
      mode: shared
      forwardedUser: jonathan
    workspaceDir: /home/agent/config/workspace
    configFiles:
      - name: config
        mountPath: /home/agent/config/openclaw-config.json5
        mountKey: config.json5
        envVar: OPENCLAW_CONFIG_PATH
        content: |
          {
            gateway: {
              trustedProxies: ["${K8S_NODE_CIDR}", "${CILIUM_POD_CIDR}"],
              auth: {
                mode: "trusted-proxy",
                trustedProxy: {
                  userHeader: "x-forwarded-user",
                  allowUsers: ["jonathan"]
                }
              },
              controlUi: {
                allowedOrigins: ["https://dave.lolwtf.ca"],
                dangerouslyDisableDeviceAuth: true
              }
            }
          }
