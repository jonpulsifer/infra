      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spindrift-build
  namespace: spindrift-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spindrift-build
subjects:
  - kind: ServiceAccount
    name: kthx-engine
    namespace: kthx-engine

