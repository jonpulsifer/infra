---
# The first label of tls.hosts[0] is the tailnet hostname. No Funnel: a
# funnelled request carries no identity headers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-spike
  namespace: identity-spike
  labels:
    app.kubernetes.io/name: identity-spike
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: echo
      port:
        number: 80
  tls:
    - hosts:
        - identity-spike
