# Rebuilds the mirror from a fresh import of production on Neon each night.
# Writes made to the mirror do not survive it. A failed import leaves no
# database until the next good run; KubeJobFailed alerts on it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wishlist-refresh
  namespace: wishlist-mirror
  labels:
    app.kubernetes.io/name: wishlist-mirror
    app.kubernetes.io/part-of: wishlist
spec:
  schedule: "0 4 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wishlist-mirror
            app.kubernetes.io/part-of: wishlist
        spec:
          restartPolicy: Never
          serviceAccountName: wishlist-refresh
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  kubectl delete cluster.postgresql.cnpg.io/wishlist --ignore-not-found --wait=true --timeout=10m
                  sed -e "s|__NEON_HOST__|$NEON_HOST|" -e "s|__NEON_USER__|$NEON_USER|" /template/cluster.yaml \
                    | kubectl create -f -
                  kubectl wait --for=condition=Ready cluster.postgresql.cnpg.io/wishlist --timeout=20m
              env:
                - name: HOME
                  value: /tmp
                - name: NEON_HOST
                  valueFrom:
                    secretKeyRef:
                      name: neon-endpoint
                      key: host
                - name: NEON_USER
                  valueFrom:
                    secretKeyRef:
                      name: neon-source
                      key: username
              volumeMounts:
                - name: template
                  mountPath: /template
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: template
              configMap:
                name: wishlist-cluster
            - name: tmp
              emptyDir: {}
