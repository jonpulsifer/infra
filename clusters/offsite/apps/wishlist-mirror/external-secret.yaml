---
# The read-only Neon role the nightly import connects as, from the 1Password
# item `wishin neon db user: offsite` in `homelab`. It holds SELECT on the
# `wishlist` database and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neon-source
  namespace: wishlist-mirror
  labels:
    app.kubernetes.io/name: wishlist-mirror
    app.kubernetes.io/part-of: wishlist
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: neon-source
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "wishin neon db user: offsite"
        property: username
    - secretKey: password
      remoteRef:
        key: "wishin neon db user: offsite"
        property: password
