# The template the refresh job creates. __NEON_HOST__ and __NEON_USER__ are
# filled from the Secrets `neon-endpoint` and `neon-source`, which keeps the
# endpoint out of a public repository; CloudNativePG reads only a password
# from a Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wishlist
  labels:
    app.kubernetes.io/name: wishlist-mirror
    app.kubernetes.io/part-of: wishlist
spec:
  instances: 1
  storage:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: wishlist
      owner: wishlist
      # Fixed, so the app's DATABASE_URL survives every refresh.
      secret:
        name: wishlist-app
      import:
        type: microservice
        databases:
          - wishlist
        source:
          externalCluster: neon
        # The mirror holds no live credentials: production's sessions and the
        # Google tokens stored at link time stay in production.
        postImportApplicationSQL:
          - DELETE FROM "Session"
          - UPDATE "Account" SET access_token = NULL, refresh_token = NULL, id_token = NULL
  externalClusters:
    - name: neon
      connectionParameters:
        host: __NEON_HOST__
        user: __NEON_USER__
        dbname: wishlist
        sslmode: require
      password:
        name: neon-source
        key: password
