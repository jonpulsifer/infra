# The template the refresh job creates, empty. The job then restores
# production into it, because CloudNativePG's own import replays Neon's
# `pg_attver` column options, which stock Postgres rejects.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wishlist
  labels:
    app.kubernetes.io/name: wishlist-mirror
    app.kubernetes.io/part-of: wishlist
spec:
  instances: 1
  storage:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: wishlist
      owner: wishlist
      # Fixed, so the app's DATABASE_URL survives every refresh.
      secret:
        name: wishlist-app
