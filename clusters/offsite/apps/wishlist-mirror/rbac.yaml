---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wishlist-refresh
  namespace: wishlist-mirror
  labels:
    app.kubernetes.io/name: wishlist-mirror
    app.kubernetes.io/part-of: wishlist
---
# The refresh deletes the one CNPG Cluster in this namespace and creates it
# again, and waits for it to be ready.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wishlist-refresh
  namespace: wishlist-mirror
  labels:
    app.kubernetes.io/name: wishlist-mirror
    app.kubernetes.io/part-of: wishlist
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wishlist-refresh
  namespace: wishlist-mirror
  labels:
    app.kubernetes.io/name: wishlist-mirror
    app.kubernetes.io/part-of: wishlist
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wishlist-refresh
subjects:
  - kind: ServiceAccount
    name: wishlist-refresh
    namespace: wishlist-mirror
