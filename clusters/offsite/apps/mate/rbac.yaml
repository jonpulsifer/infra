---
# Scoped to the calls `apps/mate/src/sandboxes.ts` makes. Of the namespace's
# Secrets it can read and patch one, the kthx site-token ledger.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
rules:
  # `patch` slides `spec.shutdownTime` forward after each turn; without it a
  # sandbox expires under a live thread.
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - delete
  # mate finds pods by the Sandbox's `status.selector`, never by name.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - watch
  # A WebSocket exec client sends a GET, which a `create`-only Role answers 403.
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
      - create
  # The kthx CLI's token file, kept across sandboxes (kthx-sites-secret.yaml).
  # By name: the App key and the provider key are Secrets here too.
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - mate-kthx-sites
    verbs:
      - get
      - patch
  # Only for the sandbox debug account; without resourceNames mate could mint
  # a token for any ServiceAccount here, its own included.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - mate-sandbox-debug
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mate
subjects:
  - kind: ServiceAccount
    name: mate
    namespace: mate
