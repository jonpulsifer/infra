---
# mate: Rowbutt's Discord and Slack gateway and its agent loop (`apps/mate`).
# It holds the model key, keeps each thread's session in mate-db, and runs the
# agent's tools in a Sandbox of its own per thread.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
spec:
  replicas: 1
  # No rollout overlap: Discord sends every event to each session on a token,
  # and Slack splits events across an app's connections.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mate
        app.kubernetes.io/part-of: mate
      annotations:
        # The tokens and the database URI are env vars, mate reads the SSH key,
        # the talosconfig and the database CA once at boot, and the App key
        # file refreshes on the kubelet's schedule, so Reloader rolls the pod
        # when one of these Secrets rotates. mate reads the model key on every
        # request, so mate-opencode needs no restart.
        secret.reloader.stakater.com/reload: mate-discord,mate-slack,mate-github-app,mate-sandbox-ssh,mate-sandbox-talos,mate-kthx-agent,mate-db-app,mate-db-ca
    spec:
      # On SIGTERM mate lets running turns finish for a while, then closes the
      # rest for the next pod to resume. 45 seconds covers both steps.
      terminationGracePeriodSeconds: 45
      # This token mints Sandboxes and execs into them. rbac.yaml scopes it and
      # network-policy.yaml limits its egress.
      serviceAccountName: mate
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mate
          # CD rewrites this digest (`.github/containers.json`) by matching the
          # whole `ghcr.io/…/mate…@sha256:` string, so keep it one literal.
          image: ghcr.io/jonpulsifer/mate:latest@sha256:b6a7f4b41704cc8075fe108564215cb83dd215d1da7093cb39020ec83a792a5c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-discord
                  key: DISCORD_TOKEN
            # The homelab guild, the one allowed user, and the channels a mention
            # may open a thread in (#general and the General voice channel).
            - name: MATE_GUILD_ID
              value: "1509024936717455381"
            - name: MATE_ALLOWED_USER_IDS
              value: "308072071949320204"
            - name: MATE_ALLOWED_CHANNEL_IDS
              value: "1509024937422356532,1509024937422356533"
            # Slack needs both tokens; one alone stops mate from booting. `optional`
            # keeps a missing Secret from holding the pod in CreateContainerConfigError.
            - name: MATE_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-slack
                  key: MATE_SLACK_BOT_TOKEN
                  optional: true
            - name: MATE_SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-slack
                  key: MATE_SLACK_APP_TOKEN
                  optional: true
            # The workspace, the one allowed user, and #general and #chatops.
            - name: MATE_SLACK_TEAM_ID
              value: TAR78LS82
            - name: MATE_SLACK_ALLOWED_USER_IDS
              value: UAR78LSKC
            - name: MATE_SLACK_ALLOWED_CHANNEL_IDS
              value: CARBAMA05,C062BS4GADR
            # 18:00 America/Halifax; uses the existing mate-db and Slack identity.
            - name: MATE_CUSTODIAN_CHANNEL
              value: C062BS4GADR
            # shutdownTime is never more than two hours out, so mate refuses a turn cap
            # of 120 minutes or more, and 55 or more while the GitHub App is set.
            - name: MATE_TURN_MINUTES
              value: "45"
            # Quiet deletes the thread's sandbox with its uncommitted work and
            # closes the thread. The session stays, so a reply picks it back up.
            - name: MATE_QUIET_MINUTES
              value: "30"
            - name: MATE_MAX_TURNS_PER_THREAD
              value: "30"
            - name: MATE_MAX_TURNS_PER_DAY
              value: "120"
            # Turns running at once; the rest wait in a queue. A turn holds no
            # sandbox until its first tool call.
            - name: MATE_MAX_CONCURRENT
              value: "2"
            # Sandboxes leased at once. Sandboxes do not schedule on the control
            # plane, and offsite has one other node. A turn that finds them all
            # held takes one idle for five minutes, or waits.
            - name: MATE_MAX_SANDBOXES
              value: "2"
            # A warm spare skips the cold mint. Sandboxes are the largest driver
            # of oldschool's CPU requests, so check KubeCPUOvercommit headroom
            # before raising MATE_MAX_SANDBOXES or spares.
            - name: MATE_SPARES
              value: "1"
            - name: MATE_PORT
              value: "8080"
            # Unset, mate registers no OTel SDK.
            - name: MATE_OTEL_ENDPOINT
              value: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
            # mate ignores this. An older image reads it, and without it replies
            # from an in-process stub instead of running the agent, so keep it
            # while a rollback can reach such an image.
            - name: MATE_SANDBOXES
              value: kube
            # The model, on the owner's ChatGPT subscription through pi-ai's
            # `openai-codex` provider, and its reasoning level. mate refuses a
            # level the model does not support.
            - name: MATE_MODEL
              value: openai-codex/gpt-6-sol
            - name: MATE_THINKING
              value: medium
            # Answers a request ChatGPT cannot, through pi-ai's `opencode-go`
            # provider. `none` routes nothing: with MATE_MODEL on
            # opencode-go/qwen3.8-max, that is the rollback.
            - name: MATE_FALLBACK_MODEL
              value: opencode-go/qwen3.8-max
            - name: MATE_FALLBACK_THINKING
              value: medium
            # The fallback's key, read on every request, so a rotated key needs
            # no restart.
            - name: MATE_MODEL_KEY_FILE
              value: /var/run/mate/opencode/api-key
            # The session store (database.yaml). CloudNativePG writes the owner
            # role's URI, and mate adds sslmode=verify-full against the CA below.
            # `optional`: with no Secret the store is down, each thread says so,
            # and the gateway stays up.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mate-db-app
                  key: uri
                  optional: true
            - name: MATE_DB_CA_FILE
              value: /var/run/mate/db-ca/ca.crt
            # Digest-pinned: the agent's tool calls run in this image with no
            # approval step. CD anchors on the image name beside the digest.
            - name: MATE_SANDBOX_IMAGE
              value: ghcr.io/jonpulsifer/mate-sandbox:latest@sha256:f5b76243a8cffb00b34f4121ef11b69b41f00740e869532bb48df17f81888fcc
            # The numeric App id, not the client id. mate mints a 1-hour token per
            # turn from the key; a sandbox never holds the key.
            - name: MATE_GITHUB_APP_ID
              value: "5027196"
            - name: MATE_GITHUB_APP_KEY_FILE
              value: /var/run/mate/github-app/private-key
            # cluster-admin on offsite and folly. mate mints a bound token per
            # turn (sandbox-rbac.yaml).
            - name: MATE_SANDBOX_KUBE_SA
              value: mate-sandbox-admin
            # get/list/watch on offsite and folly, never Secrets or exec, for
            # read-only profiles (sandbox-rbac.yaml). mate mints a bound token per turn.
            - name: MATE_SANDBOX_KUBE_READER_SA
              value: mate-sandbox-reader
            # The context the token reaches this cluster by, and the clusters
            # that admit it too; the sandbox's checkout says where each is.
            - name: MATE_SANDBOX_KUBE_CONTEXT
              value: offsite
            - name: MATE_SANDBOX_KUBE_PEERS
              value: folly
            # rowbutt's key, which is root on every host through passwordless
            # sudo. mate stamps it into the sandbox per turn and clears it after.
            - name: MATE_SSH_KEY_FILE
              value: /var/run/mate/ssh/private-key
            # An os:reader talosconfig with a context per cluster, stamped into
            # the sandbox per turn and cleared after. mate refuses a file with
            # any other role, and reads a missing one as none.
            - name: MATE_TALOSCONFIG_FILE
              value: /var/run/mate/talos/config
            # The private claiming host, which a sandbox reaches; its site tokens
            # are kept in the mate-kthx-sites Secret between sandboxes.
            - name: MATE_KTHX_ORIGIN
              value: https://kthx.${SECRET_DOMAIN}
            # mate bridges the engine's MCP tools into the agent as `kthx_*`
            # tools. The engine's Service, because mate's egress reaches its web
            # pods and not the public hostname.
            - name: MATE_KTHX_MCP_URL
              value: http://spindrift.spindrift.svc.cluster.local:3000/mcp
            # The bearer for the URL above. `optional`: until the owner mints it
            # (docs/runbooks/connect-an-agent-to-kthx.md) the agent has no kthx
            # tools.
            - name: KTHX_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-kthx-agent
                  key: KTHX_AGENT_TOKEN
                  optional: true
            # mate bridges the weather service's MCP tools as `weather_*`. It
            # takes no token.
            - name: MATE_WEATHER_MCP_URL
              value: http://weather.weather.svc.cluster.local:8080/mcp
            # Each sandbox gets this address and a ring token from Secret
            # mate-switchboard, so the agent can ring the owner's phone. The
            # number and the caps are switchboard's; the sandbox holds neither.
            - name: MATE_SWITCHBOARD_URL
              value: http://switchboard.elevenlabs.svc.cluster.local:8080
            # On the emptyDir, so a container restart resumes the gateway session
            # instead of spending an identify from the daily budget.
            - name: MATE_SESSION_FILE
              value: /tmp/session.json
            # readOnlyRootFilesystem: /tmp (below) is the only writable path.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: github-app
              mountPath: /var/run/mate/github-app
              readOnly: true
            - name: sandbox-ssh
              mountPath: /var/run/mate/ssh
              readOnly: true
            - name: sandbox-talos
              mountPath: /var/run/mate/talos
              readOnly: true
            - name: opencode
              mountPath: /var/run/mate/opencode
              readOnly: true
            - name: db-ca
              mountPath: /var/run/mate/db-ca
              readOnly: true
          # No liveness probe: /healthz is 503 while the identify-budget guard
          # sleeps, and a restart would burn the budget it protects.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # The agent loop and a hands message of up to 64 MiB share this
          # process, and an OOM drops the gateway with every running turn.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        # `optional`: with no Secret the mount is empty and mate mints nothing.
        # No defaultMode: the key is root-owned and 0400 hides it from uid 65532.
        - name: github-app
          secret:
            secretName: mate-github-app
            optional: true
        # `optional`, as above: with no Secret a sandbox gets no SSH key.
        - name: sandbox-ssh
          secret:
            secretName: mate-sandbox-ssh
            optional: true
        # `optional`, as above: until the 1Password item exists a sandbox gets
        # no talosconfig.
        - name: sandbox-talos
          secret:
            secretName: mate-sandbox-talos
            items:
              - key: talosconfig
                path: config
            optional: true
        # `optional`, as above: with no Secret every turn fails with the
        # provider's authentication error.
        - name: opencode
          secret:
            secretName: mate-opencode
            items:
              - key: OPENCODE_API_KEY
                path: api-key
            optional: true
        # CloudNativePG's CA certificate alone: the Secret also holds the CA's
        # key. `optional`, as above: with no CA the session store is down.
        - name: db-ca
          secret:
            secretName: mate-db-ca
            items:
              - key: ca.crt
                path: ca.crt
            optional: true
