---
# mate: the Discord gateway Rowbutt connects through, one Bun process from
# `apps/mate`. It carries the ServiceAccount that mints Sandboxes and the
# egress policy that goes with holding a token, and answers each thread from a
# Sandbox of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
spec:
  replicas: 1
  # Recreate is load-bearing, not tidy, and both surfaces need it for opposite
  # reasons. Discord delivers every event to every gateway session on a token,
  # so a RollingUpdate's overlap would have two mate pods replying to the same
  # message. Slack does the inverse: it splits payloads across an app's
  # connections, so an overlap would have each pod receive a random half and
  # mate would look like it was ignoring people. The `hello` frame's
  # connection count is what says so in the log if it ever happens.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mate
        app.kubernetes.io/part-of: mate
      annotations:
        # Every token here is an env var, which a running container never
        # re-reads. Reloader rolls the pod when either ExternalSecret writes a
        # rotated token, so rotation is one Recreate roll instead of waiting
        # for Discord to close the stale session with 4004.
        secret.reloader.stakater.com/reload: mate-discord,mate-slack
    spec:
      # The token is what mints Sandboxes and opens `pods/exec`; `rbac.yaml`
      # scopes it to this namespace, and `network-policy.yaml` is what makes
      # holding it safe.
      serviceAccountName: mate
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mate
          # The containers workflow rewrites this digest on every mate build
          # that lands on main (`.github/containers.json`, `deploy.mate`). The
          # rewrite anchors on the full `ghcr.io/…/mate…@sha256:` string, so
          # this stays one literal and never a split repository/tag pair.
          image: ghcr.io/jonpulsifer/mate:latest@sha256:129f6dba79bad2a03a843a92a62f89b67b9934ba72a7a08d217c2f78ff3551b3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-discord
                  key: DISCORD_TOKEN
            # The homelab guild, the one allowlisted user, and the channels a
            # mention may start a thread in (#general and the General voice
            # channel — harmless in the allowlist).
            - name: MATE_GUILD_ID
              value: "1509024936717455381"
            - name: MATE_ALLOWED_USER_IDS
              value: "308072071949320204"
            - name: MATE_ALLOWED_CHANNEL_IDS
              value: "1509024937422356532,1509024937422356533"
            # The Slack half. It is opt-in: with neither token set mate
            # answers on Discord alone, and with only one of them set it
            # refuses to start rather than run half a surface. The thread
            # contract is the same one — a mention opens a thread, the thread
            # is the session, one allowlisted human — and the caps above are
            # shared across both, because this is one process.
            #
            # `optional: true` is what keeps that promise on a cluster: a
            # required secretKeyRef holds the pod in CreateContainerConfigError
            # until the Secret exists, and with `strategy: Recreate` the pod
            # answering on Discord is already gone by then. Unset instead of
            # missing is what mate reads as "Slack is off"; reloader rolls the
            # pod once the ExternalSecret writes the Secret.
            - name: MATE_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-slack
                  key: MATE_SLACK_BOT_TOKEN
                  optional: true
            - name: MATE_SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-slack
                  key: MATE_SLACK_APP_TOKEN
                  optional: true
            # The workspace, the one allowlisted human, and the channels a
            # mention may start a thread in (#general and #chatops).
            - name: MATE_SLACK_TEAM_ID
              value: TAR78LS82
            - name: MATE_SLACK_ALLOWED_USER_IDS
              value: UAR78LSKC
            - name: MATE_SLACK_ALLOWED_CHANNEL_IDS
              value: CARBAMA05,C062BS4GADR
            # The thread contract's numbers: one turn capped at 45 minutes,
            # quiet 30 minutes after it, 30 turns per thread, 120 per day, 2
            # threads at once, and one sandbox kept warm for the next one.
            #
            # Both clocks answer to a ceiling that is not a knob: a sandbox
            # carries `spec.shutdownTime` two hours out and the controller
            # deletes it at that moment whatever is streaming. A turn is
            # capped at 45 of those 120 minutes and quiet at 30, so neither
            # clock comes within an hour of the ceiling. mate refuses to boot
            # on a MATE_TURN_MINUTES that does reach it.
            #
            # Quiet is what generosity costs. Teardown is total — the Sandbox
            # goes, and with it the /workspace clone, every uncommitted edit
            # and the harness's own state — so this is how long work survives
            # someone stepping away, and equally how long that thread holds
            # one of the two slots below. Archiving the Discord thread hands
            # the slot back early; a Slack thread cannot be archived, so there
            # these 30 minutes are the only release.
            #
            # That 2 is capacity and not policy: a sandbox will not schedule
            # on a control-plane node, and offsite has exactly one other node
            # for them to land on. It is a cap on threads rather than on
            # sandboxes — the warm spare below is a third one — and what the
            # node can carry is measured against it there.
            - name: MATE_TURN_MINUTES
              value: "45"
            - name: MATE_QUIET_MINUTES
              value: "30"
            - name: MATE_MAX_TURNS_PER_THREAD
              value: "30"
            - name: MATE_MAX_TURNS_PER_DAY
              value: "120"
            - name: MATE_MAX_CONCURRENT
              value: "2"
            # One sandbox is kept warm for whoever asks next, because the
            # wait it removes is the whole of the cold start. A fresh mint on
            # oldschool measures 46.8 s; a thread handed a warm one pays a
            # relabel and a shallow fetch instead. What survives either way
            # is the ACP attach, measured at 4.9 s, and the harness's own
            # time to first token, 4.4 s over nine turns — so this shortens
            # the wait rather than removing it.
            #
            # What it costs is a whole sandbox's room on the node for as long
            # as mate is up: one live sandbox measures about 1 GiB of
            # oldschool's memory. With the cap above that is three sandboxes
            # at peak rather than two, because the replacement is minted the
            # moment a thread takes the one that was warm. Memory is the
            # comfortable half of that — 6626Mi of oldschool's 15772Mi
            # allocatable at the peak — and CPU is what binds first: a sandbox
            # requests 500m, so three of them commit 3157m of its 4000m and
            # leave 843m for anything else that has to land there.
            #
            # A spare carries a half-hour `shutdownTime` that only mate's
            # own sweep renews, so a mate that stops hands it back, and a
            # roll discards the spare it inherits rather than serving a
            # thread from an image, model or checkout that has moved on. One
            # that stops being Ready is condemned on the next sweep and
            # replaced, because no thread can be handed it.
            - name: MATE_SPARES
              value: "1"
            - name: MATE_PORT
              value: "8080"
            # The cluster's OTLP collector, whose prometheus exporter this
            # cluster's Prometheus scrapes. Unset — a workstation run, or
            # `bun test` — registers no SDK at all and every instrument stays
            # the no-op it is born as. `network-policy.yaml` is what lets this
            # one destination be reached.
            - name: MATE_OTEL_ENDPOINT
              value: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
            # `kube` puts a real Sandbox behind every thread: mate mints one
            # per thread, execs `opencode acp` in its pod and streams the turn
            # back. The other value is `stub`, an in-process reply with no
            # cluster behind it, and reverting this one word is the rollback —
            # the bot keeps answering and sandboxes stop being minted.
            # `sandbox-network-policy.yaml` is what makes the flip safe: a
            # sandbox runs agent-authored commands with every permission
            # auto-allowed, and that policy is its only network boundary.
            - name: MATE_SANDBOXES
              value: kube
            # The harness image every sandbox runs, built by CD from
            # `images/mate-sandbox/`. It carries a digest for the same reason
            # the image above does, and more urgently: this is the image that
            # runs agent code with every permission auto-allowed, so a mutable
            # tag is not good enough. The digest is also what makes the
            # `deploy.mate-sandbox` entry safe — the rewrite anchors on
            # `ghcr.io/…/mate-sandbox…@sha256:` and falls back to an
            # unanchored sed when the image is named without a digest beside
            # it, which would stamp this digest over mate's own.
            - name: MATE_SANDBOX_IMAGE
              value: ghcr.io/jonpulsifer/mate-sandbox:latest@sha256:cafba5ced9cdef3ddfb60db0fdc7cda704bf55441c7bac58ffaf06277c8b5cfd
            # Where the sandbox's git credential helper reads a GitHub token
            # from — vault, item and field in the one string `op read` takes.
            # It is configuration rather than a constant in mate because it
            # names a 1Password item: an item re-created changes this line and
            # nothing else. Unsetting it is the rollback.
            #
            # The field is a custom one named `pat` rather than the item's own
            # `password`, and that is not a preference. 1Password Connect
            # serves the canonical password field of a Password item with no
            # `value` at all — only a `passwordDetails` block — however
            # populated the item looks in the apps, and `op read` reports a
            # field carrying no value as one that does not exist. The error
            # therefore reads `could not find field`, which points at the
            # field's name, which is the one thing not wrong with it. A custom
            # concealed field comes back whole: it is the shape the Slack
            # tokens beside this one are read in, through this same Connect
            # server.
            #
            # The token is a fine-grained PAT on `jonpulsifer`, scoped to this
            # repository with contents and pull requests writable. What reads
            # it is the Connect token in the `mate-onepassword` Secret, which
            # `external-secret.yaml` declares and where the vault boundary its
            # claims draw is written down. The sharp edge is the account rather
            # than the scope, and the account is the repository owner's own:
            # `jonpulsifer` is both an Atlantis allowed user and an Atlantis
            # policy-set owner, so a pull-request comment made with this token
            # can clear the policy gate and start a Terraform apply, and a
            # successful apply merges the pull request to `main`. Nothing
            # distinguishes such a comment from one a human wrote, because
            # nothing about it is a bot.
            - name: MATE_GITHUB_TOKEN_REF
              value: op://xf7fcsxke5yz32xqou4rsnrlqy/s7rxwheygnwhoh6esaqllism4i/pat
            # Gateway session info (session id, resume URL, sequence) lands
            # here so a container restart inside the same pod resumes instead
            # of spending an identify from the daily budget. An emptyDir is
            # exactly that scope: it outlives the container, not the pod.
            - name: MATE_SESSION_FILE
              value: /tmp/session.json
            # readOnlyRootFilesystem: /tmp (below) is the only writable path.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Readiness only. /healthz is 503 whenever the gateway is not
          # connected, and that is deliberate during the identify-budget
          # guard's sleeps — a liveness probe on it would kill the process for
          # doing exactly what it should and burn the budget it is protecting.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
