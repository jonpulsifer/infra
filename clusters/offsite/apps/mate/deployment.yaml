---
# mate: the Discord gateway Rowbutt connects through, one Bun process from
# `apps/mate`. It carries the ServiceAccount that mints Sandboxes and the
# egress policy that goes with holding a token, and answers threads with the
# in-process stub until `MATE_SANDBOXES` says otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
spec:
  replicas: 1
  # Recreate is load-bearing, not tidy: Discord delivers every event to every
  # gateway session on a token, so a RollingUpdate's overlap would have two
  # mate pods receiving and replying to the same message.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mate
        app.kubernetes.io/part-of: mate
      annotations:
        # The token is an env var, which a running container never re-reads.
        # Reloader rolls the pod when the ExternalSecret writes a rotated
        # token, so rotation is one Recreate roll instead of waiting for
        # Discord to close the stale session with 4004.
        secret.reloader.stakater.com/reload: mate-discord
    spec:
      # The token is what mints Sandboxes and opens `pods/exec`; `rbac.yaml`
      # scopes it to this namespace, and `network-policy.yaml` is what makes
      # holding it safe.
      serviceAccountName: mate
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mate
          # The containers workflow rewrites this digest on every mate build
          # that lands on main (`.github/containers.json`, `deploy.mate`). The
          # rewrite anchors on the full `ghcr.io/…/mate…@sha256:` string, so
          # this stays one literal and never a split repository/tag pair.
          image: ghcr.io/jonpulsifer/mate:latest@sha256:1656163e5b6c07fcd2717ef4af91f35b9fe5755f52ccfc59ba5fcbfc7aaec3a9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mate-discord
                  key: DISCORD_TOKEN
            # The homelab guild, the one allowlisted user, and the channels a
            # mention may start a thread in (#general and the General voice
            # channel — harmless in the allowlist).
            - name: MATE_GUILD_ID
              value: "1509024936717455381"
            - name: MATE_ALLOWED_USER_IDS
              value: "308072071949320204"
            - name: MATE_ALLOWED_CHANNEL_IDS
              value: "1509024937422356532,1509024937422356533"
            # The thread contract's numbers: quiet after 15 minutes, 30 turns
            # per thread, 120 per day, 3 sandboxes at once.
            - name: MATE_QUIET_MINUTES
              value: "15"
            - name: MATE_MAX_TURNS_PER_THREAD
              value: "30"
            - name: MATE_MAX_TURNS_PER_DAY
              value: "120"
            - name: MATE_MAX_CONCURRENT
              value: "3"
            - name: MATE_PORT
              value: "8080"
            # stub keeps the reply path exactly as it is on merge. Flipping
            # this to `kube` is what puts a real Sandbox behind a thread, and
            # it is a one-word change once the harness image is published.
            - name: MATE_SANDBOXES
              value: stub
            # The harness image every sandbox runs, built by CD from
            # `images/mate-sandbox/`. It carries a digest for the same reason
            # the image above does, and more urgently: this is the image that
            # runs agent code with every permission auto-allowed, so a mutable
            # tag is not good enough. The digest is also what makes the
            # `deploy.mate-sandbox` entry safe — the rewrite anchors on
            # `ghcr.io/…/mate-sandbox…@sha256:` and falls back to an
            # unanchored sed when the image is named without a digest beside
            # it, which would stamp this digest over mate's own.
            - name: MATE_SANDBOX_IMAGE
              value: ghcr.io/jonpulsifer/mate-sandbox:latest@sha256:6f135be2df9ddf2cca529e845b3325cba5c6e72c8587c1ce48ec30bd5b10cbac
            # Gateway session info (session id, resume URL, sequence) lands
            # here so a container restart inside the same pod resumes instead
            # of spending an identify from the daily budget. An emptyDir is
            # exactly that scope: it outlives the container, not the pod.
            - name: MATE_SESSION_FILE
              value: /tmp/session.json
            # readOnlyRootFilesystem: /tmp (below) is the only writable path.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Readiness only. /healthz is 503 whenever the gateway is not
          # connected, and that is deliberate during the identify-budget
          # guard's sleeps — a liveness probe on it would kill the process for
          # doing exactly what it should and burn the budget it is protecting.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
