---
# Mate's one port answers readiness and the inactive alert responder.
# network-policy.yaml admits the node and Alertmanager pods.
apiVersion: v1
kind: Service
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
spec:
  selector:
    app.kubernetes.io/name: mate
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
