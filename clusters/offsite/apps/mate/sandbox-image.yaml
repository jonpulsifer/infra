---
# The harness image every new sandbox runs. CD rewrites this digest; mate reads
# the mounted file at each mint, so a new sandbox image restarts nothing.
# Digest-pinned: the agent's tool calls run in this image with no approval
# step. CD anchors on the image name beside the digest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mate-sandbox-image
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
data:
  image: ghcr.io/jonpulsifer/mate-sandbox:latest@sha256:8cf7c2fb9e6456cff997f9a66c4333a3eecab93e64cc6dfb3a2cf7ef32cbd37c
