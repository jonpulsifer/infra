---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-discord
  namespace: mate
spec:
  # 0 writes the Secret once, and a rotated token would never reach the pod.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef: {key: rowbutt discord bot token, property: password}
---
# Every sandbox pod reads the OpenCode key from this Secret. mate only names it
# in the pod spec, so its Role grants nothing on `secrets`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-opencode
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-opencode
    creationPolicy: Owner
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef: {key: opencode api key, property: password}
---
# Keyed by item id: the title contains a colon.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-slack
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-slack
    creationPolicy: Owner
  data:
    - secretKey: MATE_SLACK_BOT_TOKEN
      remoteRef:
        key: b2mwpnj65nhi6oreyofkutsqxq
        property: Bot User OAuth Token
    - secretKey: MATE_SLACK_APP_TOKEN
      remoteRef:
        key: b2mwpnj65nhi6oreyofkutsqxq
        property: App-Level Token
---
# The `clanky-bot[bot]` App key. The bot may run `atlantis plan` but not apply
# (../atlantis/policies/appliers.rego).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-github-app
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-github-app
    creationPolicy: Owner
  data:
    # A custom field, because Connect returns a Password item's `password` with
    # no value. A concealed field is one line, so store the PEM as `base64 -w0`.
    - secretKey: private-key
      remoteRef:
        key: c6cjx25kepz7yojdt3h7mcp6ka
        property: pem (base64)
        decodingStrategy: Base64
---
# The engine's agent token, which every sandbox pod reads as KTHX_AGENT_TOKEN
# for the kthx MCP server. The owner mints it in the kthx console
# (docs/runbooks/connect-an-agent-to-kthx.md); until the item exists the Secret
# is absent and a sandbox gets no kthx tools. Not on the reloader annotation:
# sandboxes read it, mate does not.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-kthx-agent
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-kthx-agent
    creationPolicy: Owner
  data:
    - secretKey: KTHX_AGENT_TOKEN
      remoteRef: {key: mate kthx agent token, property: credential}
---
# Unused while deployment.yaml leaves MATE_CONNECT_SECRET unset. The token reads
# only the sandbox's own vault, and an agent can read anything put there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-onepassword
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-onepassword
    creationPolicy: Owner
  data:
    - secretKey: OP_CONNECT_TOKEN
      remoteRef: {key: rfbqenkzbnots2vgbb7sctxxwq, property: credential}
