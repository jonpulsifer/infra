---
# The credential the bot holds: Rowbutt's Discord token, from the
# `rowbutt discord bot token` item in the `homelab` vault. The item is a
# Password item, so the field is `password`. The interval is non-zero on
# purpose — an ExternalSecret rendered with `refreshInterval: 0` is written
# once and never again, so a rotated token would never reach the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-discord
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef: {key: rowbutt discord bot token, property: password}
---
# The only credential a sandbox holds: the OpenCode Go key, read from this
# Secret by every sandbox pod mate stamps. The bot itself never reads it — it
# names the Secret in the pod spec and the kubelet does the rest, which is why
# mate's Role grants nothing on `secrets`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-opencode
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-opencode
    creationPolicy: Owner
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef: {key: opencode api key, property: password}
