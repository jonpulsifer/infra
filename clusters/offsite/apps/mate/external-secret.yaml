---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-discord
  namespace: mate
spec:
  # 0 writes the Secret once, and a rotated token would never reach the pod.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef: {key: rowbutt discord bot token, property: password}
---
# The model key. Only mate's pod mounts it, as a file it reads on every
# request; the kubelet reads the Secret, so mate's Role grants nothing on
# this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-opencode
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-opencode
    creationPolicy: Owner
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef: {key: opencode api key, property: password}
---
# Keyed by item id: the title contains a colon.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-slack
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-slack
    creationPolicy: Owner
  data:
    - secretKey: MATE_SLACK_BOT_TOKEN
      remoteRef:
        key: b2mwpnj65nhi6oreyofkutsqxq
        property: Bot User OAuth Token
    - secretKey: MATE_SLACK_APP_TOKEN
      remoteRef:
        key: b2mwpnj65nhi6oreyofkutsqxq
        property: App-Level Token
---
# rowbutt's SSH key, which github.com/rowbutt.keys authorizes on every host.
# Keyed by item id: the title contains a colon. 1Password returns the key as
# PKCS#8; mate rewrites it in OpenSSH format when it reads the file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-sandbox-ssh
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-sandbox-ssh
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: ihcfraufllxtgc63vusbwu6zwe
        property: private key
---
# An os:reader talosconfig with a context per cluster, which the owner mints
# from each cluster's secrets bundle (docs/runbooks/get-cluster-admin-access.md).
# A Document item, which the Connect provider reads by file name. Until the
# item exists the Secret is absent and a sandbox gets no talosconfig. Reloader
# restarts mate when the file changes but not when the Secret first appears.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-sandbox-talos
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-sandbox-talos
    creationPolicy: Owner
  data:
    - secretKey: talosconfig
      remoteRef: {key: talos-rowbutt-reader, property: talosconfig}
---
# The `clanky-bot[bot]` App key. The bot may run `atlantis plan` and
# `atlantis apply` (../atlantis/policies/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-github-app
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-github-app
    creationPolicy: Owner
  data:
    # A custom field, because Connect returns a Password item's `password` with
    # no value. A concealed field is one line, so store the PEM as `base64 -w0`.
    - secretKey: private-key
      remoteRef:
        key: c6cjx25kepz7yojdt3h7mcp6ka
        property: pem (base64)
        decodingStrategy: Base64
---
# The engine's agent token, which mate reads as KTHX_AGENT_TOKEN to bridge the
# kthx MCP tools. The owner mints it in the kthx console
# (docs/runbooks/connect-an-agent-to-kthx.md); until the item exists the Secret
# is absent and the agent has no kthx tools. mate reads it at start. Reloader
# restarts mate when the token changes but not when the Secret first appears,
# so the runbook restarts mate after the first sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-kthx-agent
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-kthx-agent
    creationPolicy: Owner
    # mate sends the value as an Authorization header, where a pasted newline
    # breaks every request. A token is base64url.
    template:
      engineVersion: v2
      data:
        KTHX_AGENT_TOKEN: '{{ regexReplaceAll "[^A-Za-z0-9_-]" .token "" }}'
  data:
    - secretKey: token
      remoteRef: {key: mate kthx agent token, property: credential}
---
# Every sandbox reads the ring token from this Secret. The pod spec marks it
# optional: until the `switchboard` item exists the Secret is missing and a
# sandbox still starts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-switchboard
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-switchboard
    creationPolicy: Owner
  data:
    - secretKey: SWITCHBOARD_RING_TOKEN
      remoteRef: {key: switchboard, property: ring-token}
---
# Unused while deployment.yaml leaves MATE_CONNECT_SECRET unset. The token reads
# only the sandbox's own vault, and an agent can read anything put there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-onepassword
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-onepassword
    creationPolicy: Owner
  data:
    - secretKey: OP_CONNECT_TOKEN
      remoteRef: {key: rfbqenkzbnots2vgbb7sctxxwq, property: credential}
