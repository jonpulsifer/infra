---
# The credential the bot holds: Rowbutt's Discord token, from the
# `rowbutt discord bot token` item in the `homelab` vault. The item is a
# Password item, so the field is `password`. The interval is non-zero on
# purpose — an ExternalSecret rendered with `refreshInterval: 0` is written
# once and never again, so a rotated token would never reach the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-discord
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef: {key: rowbutt discord bot token, property: password}
---
# The OpenCode Go key, read from this Secret by every sandbox pod mate stamps.
# It is not the only credential a sandbox carries: the harness also gets a
# 1Password Connect token, which its git credential helper reads a GitHub PAT
# with. The bot itself reads none of them — it names the Secrets in the pod
# spec and the kubelet does the rest, which is why mate's Role grants nothing
# on `secrets`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-opencode
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-opencode
    creationPolicy: Owner
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef: {key: opencode api key, property: password}
---
# The second surface's two credentials, from the `slack: rowbutt` item in the
# `homelab` vault. They are separate credentials with separate powers — the
# bot token makes every Web API call, the app-level token opens the Socket
# Mode connection and can do nothing else — which is why both are here and
# neither stands in for the other. The key is the item's id rather than its
# title because the title carries a colon, which is the one shape of title
# this provider's lookup has never been exercised against; an id is what the
# hub ExternalSecret beside this one uses against the same store, and it
# resolves whatever the title holds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-slack
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-slack
    creationPolicy: Owner
  data:
    - secretKey: MATE_SLACK_BOT_TOKEN
      remoteRef:
        key: b2mwpnj65nhi6oreyofkutsqxq
        property: Bot User OAuth Token
    - secretKey: MATE_SLACK_APP_TOKEN
      remoteRef:
        key: b2mwpnj65nhi6oreyofkutsqxq
        property: App-Level Token
---
# mate's own GitHub identity: the private key of the `mate-sandbox[bot]` App,
# installed on `jonpulsifer/infra` alone with contents and pull requests
# writable. mate signs a JWT with it and mints a 60-minute installation access
# token once per turn, then stamps that token into the sandbox pod as a file —
# so the key stays in mate's pod and a sandbox never holds it. `deployment.yaml`
# mounts this Secret read-only and names it in the reloader annotation.
#
# The App is what takes the repository owner off the credential. `jonpulsifer`
# is both an Atlantis allowed user and an Atlantis policy-set owner, so a
# pull-request comment made as that account clears the policy gate and starts a
# Terraform apply that merges itself. The App's slug is in neither
# `atlantis_users` (../atlantis/policies/only-me.rego) nor `policies.owners`
# (../atlantis/helm-release.yaml), so the same comment made by the bot does
# nothing.
#
# The remoteRef reads a custom concealed field labelled `private-key` rather
# than the item's canonical `password`, and that is forced rather than chosen:
# 1Password Connect serves a Password item's `password` field with no `value`
# at all — only a `passwordDetails` block — however populated the item looks in
# the apps, so the field reads as absent and `op read` calls it one that does
# not exist. A custom concealed field comes back whole, which is the shape the
# Slack tokens above are read in through this same Connect server.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-github-app
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-github-app
    creationPolicy: Owner
  data:
    # REPLACE_ME_ITEM_ID is a placeholder: the `homelab` vault item holding the
    # App's PEM does not exist yet, and this key takes that item's 1Password id
    # — the shape the Slack and Connect entries use — once the App is created.
    # Until then this ExternalSecret stays NotReady and writes no Secret, and
    # `optional: true` on the deployment's volume is what keeps the bot
    # answering anyway.
    - secretKey: private-key
      remoteRef: {key: REPLACE_ME_ITEM_ID, property: private-key}
---
# The sandbox's 1Password Connect token. Nothing consumes it: the GitHub
# credential it used to serve is minted by mate now, and `deployment.yaml`
# leaves `MATE_CONNECT_SECRET` unset, so no sandbox is handed this. It stays
# declared because setting that one variable is how a sandbox gets its vault
# back, and the Secret has to exist for that to be one line.
#
# What it is for when it is on: a command the agent writes can read a
# credential out of 1Password instead of one being baked into the image or
# handed to mate. The item lives in the `homelab` vault like every entry above
# — that is the vault this store reads — but what the token itself unlocks is
# not homelab. The key is the item's id rather than its title for the same
# reason the Slack item's is: the title carries a colon.
#
# Its own claims are what make handing an agent a 1Password credential
# acceptable. They name exactly one vault, `xf7fcsxke5yz32xqou4rsnrlqy`, the
# vault stocked for the sandbox, so the `homelab` vault every other credential
# in this namespace comes out of cannot be read with it at all. The vault is
# therefore the security boundary and the only one there is: a
# sandbox runs agent-authored commands with every permission auto-allowed, so
# anything put in that vault is readable by whatever the agent decides to run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mate-onepassword
  namespace: mate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mate-onepassword
    creationPolicy: Owner
  data:
    - secretKey: OP_CONNECT_TOKEN
      remoteRef: {key: rfbqenkzbnots2vgbb7sctxxwq, property: credential}
