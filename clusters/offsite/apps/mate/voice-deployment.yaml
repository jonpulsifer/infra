---
# mate-voice: the bridge that holds Rowbutt's Discord voice connection
# (`apps/mate-voice`). mate stays the only gateway session; the bridge dials
# mate's /voice WebSocket (service.yaml) and asks mate to send each voice state
# update. It needs no token, no database and no ServiceAccount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate-voice
  namespace: mate
  labels:
    app.kubernetes.io/name: mate-voice
    app.kubernetes.io/part-of: mate
spec:
  replicas: 1
  # Two bridges would both dial mate, and mate keeps only the last.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mate-voice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mate-voice
        app.kubernetes.io/part-of: mate
    spec:
      # The bridge leaves the call on SIGTERM; a few seconds covers it.
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mate-voice
          # CD rewrites this digest (`.github/containers.json`) by matching the
          # whole `ghcr.io/…/mate-voice…@sha256:` string, so keep it one literal.
          image: ghcr.io/jonpulsifer/mate-voice:latest@sha256:371bc4e0f3f7967fbb62150c727238f4f744a5fd8f9066ca381f742ff536063e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # mate's Service, whose /voice path upgrades to the bridge link.
            - name: MATE_VOICE_MATE_URL
              value: ws://mate.mate.svc.cluster.local:8080/voice
            - name: MATE_VOICE_PORT
              value: "8080"
            # How long the bridge stays in a call with mate unreachable before
            # it leaves on its own.
            - name: MATE_VOICE_ORPHAN_MS
              value: "30000"
            # The bridge hears and speaks itself: Scribe for the owner's words
            # and text-to-speech in this voice, the owner's clone that the
            # mission caller uses, with the key mounted below. The other mode,
            # MATE_VOICE_ELEVENLABS_ENGINE_ID with the engine the reconciler
            # created from desired/speech-engines/ in
            # clusters/offsite/apps/elevenlabs, hands both to ElevenLabs Speech
            # Engine, which refuses a cloned voice. Neither set leaves a call
            # silent.
            - name: MATE_VOICE_ELEVENLABS_VOICE_ID
              value: B3MaEpg3jVTwjxbDmLJE
            - name: MATE_VOICE_ELEVENLABS_KEY_FILE
              value: /var/run/mate-voice/elevenlabs/key
            # readOnlyRootFilesystem: /tmp (below) is the only writable path.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: elevenlabs
              mountPath: /var/run/mate-voice/elevenlabs
              readOnly: true
          # 503 until the link to mate is up, so a bridge that cannot reach
          # mate is never Ready.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Opus decoding in WASM and DAVE's native crypto, for one call.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        # Until the 1Password item is readable the Secret is missing, and the
        # pod still starts; the key file is then absent and the engine off.
        - name: elevenlabs
          secret:
            secretName: mate-voice-elevenlabs
            optional: true
