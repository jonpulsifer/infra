---
# mate-voice: the bridge that holds Rowbutt's Discord voice connection
# (`apps/mate-voice`). mate stays the only gateway session; the bridge dials
# mate's /voice WebSocket (service.yaml) and asks mate to send each voice state
# update. It needs no token, no database and no ServiceAccount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mate-voice
  namespace: mate
  labels:
    app.kubernetes.io/name: mate-voice
    app.kubernetes.io/part-of: mate
spec:
  replicas: 1
  # Two bridges would both dial mate, and mate keeps only the last.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mate-voice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mate-voice
        app.kubernetes.io/part-of: mate
    spec:
      # The bridge leaves the call on SIGTERM; a few seconds covers it.
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mate-voice
          # CD rewrites this digest (`.github/containers.json`) by matching the
          # whole `ghcr.io/…/mate-voice…@sha256:` string, so keep it one literal.
          image: ghcr.io/jonpulsifer/mate-voice:latest@sha256:e3f24229625d02abc004aa772c031bf62a89a15702e023f3490b85dee15d7116
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # mate's Service, whose /voice path upgrades to the bridge link.
            - name: MATE_VOICE_MATE_URL
              value: ws://mate.mate.svc.cluster.local:8080/voice
            - name: MATE_VOICE_PORT
              value: "8080"
            # How long the bridge stays in a call with mate unreachable before
            # it leaves on its own.
            - name: MATE_VOICE_ORPHAN_MS
              value: "30000"
            # ElevenLabs Speech Engine hears and speaks for mate: the engine
            # id is the one the reconciler created from desired/speech-engines/
            # in clusters/offsite/apps/elevenlabs, whose file names the voice;
            # the key file, mounted below, holds the write key the signed URL
            # needs. The other mode, MATE_VOICE_ELEVENLABS_VOICE_ID with the
            # read key, has the bridge run Scribe and text-to-speech itself and
            # can speak the owner's clone, which an engine refuses; its
            # playback is choppy today, so it is the fallback. Neither set
            # leaves a call silent.
            - name: MATE_VOICE_ELEVENLABS_ENGINE_ID
              value: seng_4601m50hqphcemyas1y5kpqwjv7j
            - name: MATE_VOICE_ELEVENLABS_KEY_FILE
              value: /var/run/mate-voice/elevenlabs/key
            # readOnlyRootFilesystem: /tmp (below) is the only writable path.
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: elevenlabs
              mountPath: /var/run/mate-voice/elevenlabs
              readOnly: true
          # 503 until the link to mate is up, so a bridge that cannot reach
          # mate is never Ready.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Opus decoding in WASM and DAVE's native crypto, for one call.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        # Until the 1Password item is readable the Secret is missing, and the
        # pod still starts; the key file is then absent and the engine off.
        - name: elevenlabs
          secret:
            secretName: mate-voice-elevenlabs
            optional: true
