---
# mate's own namespace, apart from the platform's `agents-sandbox`: that one is
# `privileged` for the sandbox controller, and nothing mate runs needs it. The
# bot is one non-root Bun process, so `restricted` is what it needs today. The
# sandboxes that will share this namespace may force the level down once the
# harness is known; until then this is the provisional ruling.
apiVersion: v1
kind: Namespace
metadata:
  name: mate
  labels:
    kustomize.toolkit.fluxcd.io/prune: enabled
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
