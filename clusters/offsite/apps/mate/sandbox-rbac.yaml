---
# The identity a sandbox debugs the cluster with. It is deliberately not the
# identity mate mints sandboxes with: `rbac.yaml` beside this is scoped to the
# handful of calls `apps/mate/src/sandboxes.ts` makes and is bound to a
# namespace, while this one is estate-wide and read-mostly. Keeping them apart
# means widening what an agent can see never widens what mate itself can do.
#
# No token is written for this ServiceAccount and none should be. mate asks
# the apiserver for a bound one per turn through TokenRequest, hands it to the
# sandbox as a kubeconfig, and the apiserver stops honouring it when it
# expires — so there is no long-lived credential to leak, and nothing to
# rotate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mate-sandbox-debug
  namespace: mate
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
automountServiceAccountToken: false
---
# Read everything but Secrets, exec into anything, change nothing. RBAC has
# no deny, so the core group is listed without `secrets` and every other
# group this cluster serves is named; a group missing here is unreadable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mate-sandbox-debug
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - acme.cert-manager.io
      - actions.github.com
      - admissionregistration.k8s.io
      - agents.x-k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - cert-manager.io
      - cilium.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - extensions.agents.x-k8s.io
      - externaldns.k8s.io
      - external-secrets.io
      - flowcontrol.apiserver.k8s.io
      - fluxcd.controlplane.io
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
      - generators.external-secrets.io
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - kyverno.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - networking.k8s.io
      - node.k8s.io
      - onepassword.com
      - policies.kyverno.io
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - reports.kyverno.io
      - resource.k8s.io
      - scheduling.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - tailscale.com
      - valkey.io
      - wgpolicyk8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Reading a crashlooping container's last words is most of diagnosis.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Both verbs for the reason `rbac.yaml` gives about mate's own exec: a
  # WebSocket exec client sends a GET, and a `create`-only rule answers 403.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Non-mutating and genuinely useful: "may this identity do X" is how an
  # agent checks itself before reporting a permission problem as an outage.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mate-sandbox-debug
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mate-sandbox-debug
subjects:
  - kind: ServiceAccount
    name: mate-sandbox-debug
    namespace: mate
