---
# The identity a sandbox debugs the cluster with. It is deliberately not the
# identity mate mints sandboxes with: `rbac.yaml` beside this is scoped to the
# handful of calls `apps/mate/src/sandboxes.ts` makes and is bound to a
# namespace, while this one is estate-wide and read-mostly. Keeping them apart
# means widening what an agent can see never widens what mate itself can do.
#
# No token is written for this ServiceAccount and none should be. mate asks
# the apiserver for a bound one per turn through TokenRequest, hands it to the
# sandbox as a kubeconfig, and the apiserver stops honouring it when it
# expires — so there is no long-lived credential to leak, and nothing to
# rotate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mate-sandbox-debug
  namespace: mate
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
automountServiceAccountToken: false
---
# What the agent can do to this cluster. Read everything, exec into anything,
# change nothing.
#
# `secrets` are in that "read everything" and that is a decision rather than
# an oversight. `pods/exec` below is read access to every Secret mounted into
# every pod — a shell in a pod can cat its own service-account token and its
# own mounted files — so a rule excluding Secrets from the read grant would
# describe a boundary that the next rule already walks through. This says what
# is true instead: an agent turn can see any credential this cluster holds.
# The boundary that remains is time. The token behind this lasts one turn.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mate-sandbox-debug
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
rules:
  # Every group, every resource, read-only — including the custom resources
  # that carry the interesting answers on this estate: Flux Kustomizations and
  # HelmReleases, Cilium policies and endpoints, ExternalSecrets, Sandboxes,
  # PrometheusRules. An allow-list of API groups would be a list that rots one
  # operator at a time, and each rot is an agent answering "I cannot see that"
  # about something it is meant to diagnose.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Reading a crashlooping container's last words is most of diagnosis.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Both verbs for the reason `rbac.yaml` gives about mate's own exec: a
  # WebSocket exec client sends a GET, and a `create`-only rule answers 403.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Non-mutating and genuinely useful: "may this identity do X" is how an
  # agent checks itself before reporting a permission problem as an outage.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mate-sandbox-debug
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mate-sandbox-debug
subjects:
  - kind: ServiceAccount
    name: mate-sandbox-debug
    namespace: mate
