---
# Egress for the bot pod; sandbox-network-policy.yaml covers sandboxes. Cilium
# admits the node, where the readiness probe comes from; nothing else reaches mate.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mate
  ingress:
    # deployment.yaml's readinessProbe.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # toFQDNs only matches names Cilium's DNS proxy saw resolved through this
    # rule; without it every connection below fails closed.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The wildcard covers the regional `resume_gateway_url`; a failed resume
    # spends an identify from the daily budget.
    - toFQDNs:
        - matchName: discord.com
        - matchName: gateway.discord.gg
        - matchPattern: "*.discord.gg"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Socket Mode hands out a `wss-*` host at connect time, primary or backup.
    - toFQDNs:
        - matchName: slack.com
        - matchPattern: "wss-*.slack.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Token mints only; mate never clones or pushes. Without it a mint hangs
    # instead of failing.
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The model provider: pi-ai's `opencode-go` endpoints are under
    # https://opencode.ai/zen/go.
    - toFQDNs:
        - matchName: opencode.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The ChatGPT sign-in: the device code, the token exchange and each
    # refresh go to auth.openai.com; the model answers from chatgpt.com.
    # apps/mate/test/chatgpt.test.ts checks every host the sign-in reaches.
    - toFQDNs:
        - matchName: auth.openai.com
        - matchName: chatgpt.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # mate reaches the API server by the IP in KUBERNETES_SERVICE_HOST, so no
    # FQDN rule can.
    - toEntities:
        - kube-apiserver
    # The session store's instance (database.yaml), by the label CNPG stamps on
    # it. The `mate-db-rw` Service resolves to it before the verdict.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: mate-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The kthx MCP server, on the engine's web pods, by the labels its
    # Service selects. Cilium resolves the ClusterIP to a backend before the
    # verdict.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: spindrift
            app.kubernetes.io/name: spindrift
            app.kubernetes.io/component: web
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # The weather MCP server, by the labels its Service selects. Cilium
    # resolves the ClusterIP to a backend before the verdict.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: weather
            app.kubernetes.io/name: weather
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The OTLP collector alone, by pod labels: the rest of `monitoring` is
    # closed. Cilium resolves the ClusterIP to a backend before the verdict.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: opentelemetry-collector
            app.kubernetes.io/instance: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
