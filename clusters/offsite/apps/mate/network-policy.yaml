---
# The bot pod's egress allow-list. It selects mate itself by its app label, so
# it says nothing about the sandboxes that share this namespace: those carry
# `app.kubernetes.io/name: mate-sandbox` and are selected by
# `sandbox-network-policy.yaml`. The two selectors never overlap, so neither
# policy widens the other — and mate's own pod is reachable from a sandbox
# exactly like any other pod in the cluster, which costs nothing: it listens
# only for the readiness probe.
#
# Cilium enforces policy per direction, so a rule set with no `ingress:`
# leaves ingress unenforced: the kubelet's readiness probe on /healthz keeps
# working, and nothing else reaches a pod that listens only for that probe.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mate
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mate
  egress:
    # `toFQDNs` is enforced by Cilium's DNS proxy, which only sees a lookup
    # that this rule's `rules.dns` sends through it. Without the matchPattern
    # the names below never resolve to an allowed identity and every Discord
    # connection fails closed.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # discord.com carries the REST API and the gateway lookup;
    # gateway.discord.gg is what that lookup returns. The wildcard is for
    # resuming: Discord hands back a region-specific `resume_gateway_url`
    # (gateway-us-east1-b.discord.gg and friends), and a resume that cannot
    # connect spends an identify from the daily budget instead.
    - toFQDNs:
        - matchName: discord.com
        - matchName: gateway.discord.gg
        - matchPattern: "*.discord.gg"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # slack.com carries the whole Web API, including the call that opens a
    # Socket Mode connection. That call answers with a `wss://` url on a host
    # mate is told at connect time rather than one it can name ahead: the
    # answer observed is wss-primary.slack.com, Slack documents a backup
    # beside it, and a wildcard inside the leftmost label is the narrowest
    # rule that reaches both — it matches one subdomain level whose name
    # starts with `wss-` and nothing else under slack.com, which is why the
    # API host is still named exactly. A connection that cannot be opened is
    # a surface that never delivers a message, silently.
    - toFQDNs:
        - matchName: slack.com
        - matchPattern: "wss-*.slack.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Sandboxes are minted, watched and exec'd into through the API server,
    # which mate reaches by the address in KUBERNETES_SERVICE_HOST — an IP,
    # never a name, so this cannot be an FQDN rule.
    - toEntities:
        - kube-apiserver
    # The OTLP collector, and nothing else in `monitoring`. mate's metrics —
    # the identify budget, sandboxes live, turns, teardowns, spend — are the
    # only way to answer "is mate alive and what is it doing" without opening
    # Discord, and this one destination is what carries them out of the pod;
    # the alerts in ../../monitoring/mate-rules.yaml read what arrives. It is
    # named by the collector's own pod labels rather than by its namespace,
    # because the namespace also holds Prometheus, Alertmanager, VictoriaLogs
    # and Grafana, and mate has no business reaching any of them. Cilium
    # translates the ClusterIP to its backend before the egress verdict, so
    # the pod selector is what matches and no address appears here.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: opentelemetry-collector
            app.kubernetes.io/instance: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
