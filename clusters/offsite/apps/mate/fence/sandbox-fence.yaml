---
# The sandbox identity is cluster-admin, so this is a guard against accidents,
# not a boundary: it keeps a turn's exec out of mate's own pod and the other
# threads' sandboxes, and cluster-admin can still read their Secrets or delete
# this policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mate-sandbox-fence
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # CONNECT covers both the SPDY POST and the WebSocket GET.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
  # Only the sandbox identity is evaluated, so mate's own exec into its
  # sandboxes is never a match.
  matchConditions:
    - name: sandbox-admin
      expression: >-
        request.userInfo.username == "system:serviceaccount:mate:mate-sandbox-admin"
  validations:
    - expression: request.namespace != "mate"
      reason: Forbidden
      message: mate-sandbox-admin cannot exec, attach or port-forward into mate.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mate-sandbox-fence
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
spec:
  policyName: mate-sandbox-fence
  validationActions: [Deny]
  matchResources: {}
