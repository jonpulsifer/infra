---
# RBAC has no deny, so this keeps sandbox-rbac.yaml's cluster-wide pods/exec
# out of `mate` and every namespace labelled `lolwtf.ca/sandbox-exec: deny`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mate-sandbox-fence
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # CONNECT covers both the SPDY POST and the WebSocket GET.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
  # Only the sandbox identity is evaluated, so mate's own exec into its
  # sandboxes is never a match, in any namespace.
  matchConditions:
    - name: sandbox-debug
      expression: >-
        request.userInfo.username == "system:serviceaccount:mate:mate-sandbox-debug"
  validations:
    # kube-system, flux-system and agent-sandbox-system carry no Namespace
    # manifest in this repo, so the CEL names them instead of the label.
    - expression: >-
        request.namespace != "mate" &&
        !(request.namespace in ["agent-sandbox-system", "flux-system", "kube-system"]) &&
        !(has(namespaceObject.metadata.labels) &&
        "lolwtf.ca/sandbox-exec" in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels["lolwtf.ca/sandbox-exec"] == "deny")
      reason: Forbidden
      message: >-
        mate-sandbox-debug cannot exec, attach or port-forward into mate,
        kube-system, flux-system, agent-sandbox-system or a namespace labelled
        lolwtf.ca/sandbox-exec: deny.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mate-sandbox-fence
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
spec:
  policyName: mate-sandbox-fence
  validationActions: [Deny]
  matchResources: {}
