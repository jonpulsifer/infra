---
# The kthx CLI's site tokens, kept across sandboxes (apps/mate/src/kthx-sites.ts).
# Git declares the object so Flux creates it; mate owns data.sites.json under
# the field manager `mate`, and declaring data here would hand the field to
# Flux and wipe every bearer on the next reconcile.
apiVersion: v1
kind: Secret
metadata:
  name: mate-kthx-sites
  namespace: mate
  labels:
    app.kubernetes.io/name: mate
    app.kubernetes.io/part-of: mate
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
