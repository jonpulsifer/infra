---
# The network boundary for agent commands, which run auto-allowed; kata-clh
# isolates the kernel, not the network. The sandbox is cluster-admin and root
# on every host it can reach, so this keeps it out of mate and Alertmanager by
# accident, not against intent. No ingress rules, so Cilium leaves ingress
# unenforced; mate reaches the mate-hands daemon through pods/exec.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mate-sandbox
  namespace: mate
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
spec:
  # Only the label sandboxes.ts stamps on this network: other labels vary.
  # mate-sandbox-baseline, below, holds a sandbox no policy of its own selects
  # to DNS.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mate-sandbox
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The internet on the web ports: GitHub, package registries and
    # documentation.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Every pod outside `mate`, on every port, Prometheus included, but not
    # Alertmanager: its API takes an alert from anyone, and a critical one rings
    # the owner through switchboard without the ring token. Exists keeps NotIn
    # from also matching identities with no namespace label.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
            - key: k8s:io.kubernetes.pod.namespace
              operator: NotIn
              values:
                - mate
            - key: k8s:app.kubernetes.io/name
              operator: NotIn
              values:
                - alertmanager
    # Not a pod or ClusterIP backend, so only the entity reaches it. What the
    # agent may do there is sandbox-rbac.yaml's.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # SSH as `rowbutt`, which has passwordless sudo on every NixOS host, and
    # the Talos API (apid) as os:reader on a Talos node. A CIDR rule never
    # matches this cluster's own nodes while policy-cidr-match-mode is unset,
    # so they are the host and remote-node entities.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "50000"
              protocol: TCP
    # folly's hosts, its Lab Net jump host (MATE_SANDBOX_LAB_JUMP), its Talos
    # API and its apiserver, across the site-to-site tunnel.
    - toCIDRSet:
        - cidr: ${CILIUM_NATIVE_ROUTING_CIDR}
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
---
# Every sandbox mate mints, whatever its network: one whose own policy is
# missing gets this DNS-only egress, not open egress. Allow rules add up, so
# this narrows nothing the others allow. It lives here, apart from
# sandbox-reader-network-policy.yaml, so losing that file does not lose it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mate-sandbox-baseline
  namespace: mate
  labels:
    app.kubernetes.io/part-of: mate
spec:
  endpointSelector:
    matchExpressions:
      - key: lolwtf.ca/hands
        operator: Exists
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "**.cluster.local"
