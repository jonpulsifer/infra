---
# The only network boundary for agent commands, which run auto-allowed; kata-clh
# isolates the kernel, not the network. No ingress rules, so Cilium leaves
# ingress unenforced; mate reaches the harness through pods/exec.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mate-sandbox
  namespace: mate
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
spec:
  # Only the label sandboxes.ts stamps: other labels vary, and a selector that
  # matches nothing fails open.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mate-sandbox
  egress:
    # toFQDNs only matches names Cilium's DNS proxy saw resolved through this
    # rule. The open pattern leaves DNS itself as a way out.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # models.opencode.ai serves the catalogue `session/new` waits on. No
    # tarball, release-asset or npm hosts: a push and a pull request need none.
    - toFQDNs:
        - matchName: opencode.ai
        - matchName: models.opencode.ai
        - matchName: github.com
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Every pod outside `mate`, on every port, Prometheus included. Exists keeps
    # NotIn from also matching identities with no namespace label.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
            - key: k8s:io.kubernetes.pod.namespace
              operator: NotIn
              values:
                - mate
    # Not a pod or ClusterIP backend, so only the entity reaches it. What the
    # agent may do there is sandbox-rbac.yaml's.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Both sites' hosts: SSH as `rowbutt`, which has passwordless sudo on each,
    # and the apiservers. Login stays off while MATE_SSH_KEY_FILE is unset.
    - toCIDRSet:
        - cidr: ${CILIUM_NATIVE_ROUTING_CIDR}
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "6443"
              protocol: TCP
