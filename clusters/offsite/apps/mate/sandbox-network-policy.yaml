---
# The network boundary for agent commands, which run auto-allowed; kata-clh
# isolates the kernel, not the network. The sandbox is cluster-admin and root
# on every host it can reach, so this keeps it out of mate and Alertmanager by
# accident, not against intent. No ingress rules, so Cilium leaves ingress
# unenforced; mate reaches the harness through pods/exec.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mate-sandbox
  namespace: mate
  labels:
    app.kubernetes.io/name: mate-sandbox
    app.kubernetes.io/part-of: mate
spec:
  # Only the label sandboxes.ts stamps: other labels vary, and a selector that
  # matches nothing fails open.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mate-sandbox
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The internet on the web ports: the provider, GitHub, package registries
    # and documentation.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Every pod outside `mate`, on every port, Prometheus included, but not
    # Alertmanager: its API takes an alert from anyone, and a critical one rings
    # the owner through switchboard without the ring token. Exists keeps NotIn
    # from also matching identities with no namespace label.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
            - key: k8s:io.kubernetes.pod.namespace
              operator: NotIn
              values:
                - mate
            - key: k8s:app.kubernetes.io/name
              operator: NotIn
              values:
                - alertmanager
    # Not a pod or ClusterIP backend, so only the entity reaches it. What the
    # agent may do there is sandbox-rbac.yaml's.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # SSH as `rowbutt`, which has passwordless sudo on every host. A CIDR rule
    # never matches this cluster's own nodes while policy-cidr-match-mode is
    # unset, so they are the host and remote-node entities.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    # folly's hosts and apiserver, across the site-to-site tunnel.
    - toCIDRSet:
        - cidr: ${CILIUM_NATIVE_ROUTING_CIDR}
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "6443"
              protocol: TCP
