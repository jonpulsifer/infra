---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/apps/arc
  - secret.sops.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/values/maxRunners
        value: 20
      # Jobs run on hotrod, the sandbox node (clusters/offsite/talos/talos.tf).
      - op: add
        path: /spec/values/template/spec/nodeSelector
        value:
          lolwtf.ca/sandbox: "true"
      - op: add
        path: /spec/values/template/spec/tolerations
        value:
          - key: lolwtf.ca/sandbox
            operator: Equal
            value: "true"
            effect: NoSchedule
