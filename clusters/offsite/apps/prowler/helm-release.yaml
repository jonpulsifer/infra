---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowler
  namespace: prowler
spec:
  interval: 1h
  chart:
    spec:
      chart: packages/charts/prowler
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  values:
    fullnameOverride: prowler
    hostname: prowler.${SECRET_DOMAIN}
    envFromSecret: prowler-env
    backup:
      endpointURL: ${GARAGE_S3_ENDPOINT}
      item: garage-${CLUSTER_NAME}
      # One prefix per generation of the Cluster. Recovery reads the previous
      # one; recover-a-re-created-database removes recoverFrom once
      # prowler-db-2 holds a base backup.
      serverName: prowler-db-2
      recoverFrom: prowler-db
    gcp:
      # The pool trusts this cluster's SA-token issuer, so the projected token
      # needs no credential. Roles: terraform/gcp/projects/homelab-ng/prowler.tf.
      audience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/${CLUSTER_NAME}
      impersonationUrl: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/prowler-scanner@homelab-ng.iam.gserviceaccount.com:generateAccessToken
