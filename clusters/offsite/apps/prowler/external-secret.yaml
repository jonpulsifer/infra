---
# One 1Password item, eight fields, because losing any of them is a different
# kind of bad: DJANGO_SECRETS_ENCRYPTION_KEY is the only key for every stored
# cloud credential, and the RS256 pair has to be identical across API replicas
# or tokens issued by one are rejected by the next.
#
# NEO4J_PASSWORD and NEO4J_AUTH carry the same password twice — the server reads
# `neo4j/<password>` and the client reads the bare value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowler-env
  namespace: prowler
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prowler-env
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef: {key: prowler, property: django-secret-key}
    - secretKey: DJANGO_SECRETS_ENCRYPTION_KEY
      remoteRef: {key: prowler, property: secrets-encryption-key}
    - secretKey: DJANGO_TOKEN_SIGNING_KEY
      remoteRef: {key: prowler, property: token-signing-key}
    - secretKey: DJANGO_TOKEN_VERIFYING_KEY
      remoteRef: {key: prowler, property: token-verifying-key}
    - secretKey: AUTH_SECRET
      remoteRef: {key: prowler, property: auth-secret}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: prowler, property: postgres-password}
    - secretKey: NEO4J_PASSWORD
      remoteRef: {key: prowler, property: neo4j-password}
    - secretKey: NEO4J_AUTH
      remoteRef: {key: prowler, property: neo4j-auth}
