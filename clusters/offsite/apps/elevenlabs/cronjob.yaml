---
# Makes the ElevenLabs agents and phone number match desired/. The script is
# reconcile.sh, in a ConfigMap that Flux does not substitute. A failed run
# fires KubeJobFailed, and the TTL clears the failed Job an hour later.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: elevenlabs-reconcile
  labels:
    app.kubernetes.io/name: elevenlabs-reconcile
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: elevenlabs-reconcile
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          dnsConfig:
            options:
              - {name: ndots, value: "1"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: jonpulsifer/bashcurljq:latest
              command: [/bin/bash, /scripts/reconcile.sh]
              # A ConfigMap key holds no slash, so the agents mount beside
              # desired/ instead of under it, and AGENTS_DIR names that path.
              env:
                - {name: AGENTS_DIR, value: /desired-agents}
              envFrom:
                - secretRef: {name: elevenlabs-read-key, optional: true}
                - secretRef: {name: elevenlabs-write-key, optional: true}
                - secretRef: {name: elevenlabs-troll-trunk, optional: true}
                - secretRef: {name: elevenlabs-outbound-trunk, optional: true}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: desired, mountPath: /desired, readOnly: true}
                - {name: agents, mountPath: /desired-agents, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap:
                name: elevenlabs-reconcile
            - name: desired
              configMap:
                name: elevenlabs-desired
            - name: agents
              configMap:
                name: elevenlabs-desired-agents
            # bash writes a large here-string to a temporary file.
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
