---
# One ExternalSecret per 1Password item. A missing item fails only its own
# ExternalSecret, and the CronJob reads each Secret as optional.
#
# The read key can read agents, voices and phone numbers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-read-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: elevenlabs-read-key
    creationPolicy: Owner
  data:
    - secretKey: ELEVENLABS_READ_KEY
      remoteRef: {key: rowbutt elevenlabs api key, property: password}
---
# Until this item exists, the reconciler only reports drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-write-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: elevenlabs-write-key
    creationPolicy: Owner
  data:
    - secretKey: ELEVENLABS_WRITE_KEY
      remoteRef: {key: elevenlabs pbx api key, property: password}
---
# The digest credentials the folly PBX authenticates to the troll trunk with.
# The item's agent-did field stays out of this Secret: the reconciler needs
# only the credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-troll-trunk
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: elevenlabs-troll-trunk
    creationPolicy: Owner
  data:
    - secretKey: TRUNK_USERNAME
      remoteRef: {key: elevenlabs troll trunk, property: username}
    - secretKey: TRUNK_PASSWORD
      remoteRef: {key: elevenlabs troll trunk, property: password}
---
# The voip.ms sub-account ElevenLabs dials out on: 168847_elevenlabs. voip.ms
# authenticates each INVITE by digest, so the trunk needs no registration of
# its own. The offsite PBX (clusters/offsite/apps/pbx) treats this sub-account
# as the one DID #2 rings, so whoever holds this password, ElevenLabs included,
# can register it and take that DID's calls as well as dial out. The password
# is the field of that name in the item "voip.ms sub accounts", whose field
# labels are the usernames; that item's canonical username and password fields
# are empty. The username is no secret, so the template writes it as a literal
# beside the fetched password. Account names stay quoted, as in the PBX's
# ExternalSecrets: YAML reads 168847_1994 as the number 1688471994.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-outbound-trunk
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: elevenlabs-outbound-trunk
    creationPolicy: Owner
    # mergePolicy stays Replace, so the Secret holds these two keys and not
    # the fetched `password`.
    template:
      engineVersion: v2
      data:
        OUTBOUND_TRUNK_USERNAME: "168847_elevenlabs"
        OUTBOUND_TRUNK_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: voip.ms sub accounts, property: "168847_elevenlabs"}
