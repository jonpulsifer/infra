---
# One ExternalSecret per 1Password item. A missing item fails only its own
# ExternalSecret, and the CronJob reads each Secret as optional.
#
# The read key can read agents, voices and phone numbers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-read-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: elevenlabs-read-key
    creationPolicy: Owner
  data:
    - secretKey: ELEVENLABS_READ_KEY
      remoteRef: {key: rowbutt elevenlabs api key, property: password}
---
# Until this item exists, the reconciler only reports drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-write-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: elevenlabs-write-key
    creationPolicy: Owner
  data:
    - secretKey: ELEVENLABS_WRITE_KEY
      remoteRef: {key: elevenlabs pbx api key, property: password}
---
# The digest credentials the folly PBX authenticates to the troll trunk with.
# The item's agent-did field stays out of this Secret: the reconciler needs
# only the credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elevenlabs-troll-trunk
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: elevenlabs-troll-trunk
    creationPolicy: Owner
  data:
    - secretKey: TRUNK_USERNAME
      remoteRef: {key: elevenlabs troll trunk, property: username}
    - secretKey: TRUNK_PASSWORD
      remoteRef: {key: elevenlabs troll trunk, property: password}
