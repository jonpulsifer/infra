---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: elevenlabs
resources:
  - namespace.yaml
  - external-secret.yaml
  - network-policy.yaml
  - cronjob.yaml
  - switchboard.yaml
configMapGenerator:
  - name: elevenlabs-reconcile
    files:
      - reconcile.sh
  - name: elevenlabs-desired
    files:
      - desired/phone-number.json
  # Each file, by name: the reconciler owns every agent this ConfigMap holds.
  - name: elevenlabs-desired-agents
    files:
      - desired/agents/pbx-troll.json
      - desired/agents/pbx-switchboard.json
generatorOptions:
  annotations:
    # The script is bash and the prompt is free text: their ${...} is not
    # Flux's to fill.
    kustomize.toolkit.fluxcd.io/substitute: disabled
