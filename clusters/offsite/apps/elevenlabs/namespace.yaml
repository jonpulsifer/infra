---
# Only the reconciler and switchboard run here. The write key they share can
# re-point the phone number and place outbound calls, so it reaches nothing
# else.
apiVersion: v1
kind: Namespace
metadata:
  name: elevenlabs
  labels:
    lolwtf.ca/sandbox-exec: deny
    kustomize.toolkit.fluxcd.io/prune: enabled
    app.kubernetes.io/name: elevenlabs
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
