apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kthx-drill
  labels:
    app.kubernetes.io/name: restore-drill
    app.kubernetes.io/part-of: backups
spec:
  instances: 1
  storage:
    storageClass: local-path
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  bootstrap:
    recovery:
      source: kthx
      database: kthx
      owner: kthx
  externalClusters:
    - name: kthx
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: kthx
          serverName: kthx-db
