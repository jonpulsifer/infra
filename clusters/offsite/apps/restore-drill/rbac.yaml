---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-drill
  namespace: restore-drill
  labels:
    app.kubernetes.io/name: restore-drill
    app.kubernetes.io/part-of: backups
---
# The drill creates, watches and deletes one CNPG Cluster in this namespace and
# runs psql in its instance pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restore-drill
  namespace: restore-drill
  labels:
    app.kubernetes.io/name: restore-drill
    app.kubernetes.io/part-of: backups
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-drill
  namespace: restore-drill
  labels:
    app.kubernetes.io/name: restore-drill
    app.kubernetes.io/part-of: backups
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restore-drill
subjects:
  - kind: ServiceAccount
    name: restore-drill
    namespace: restore-drill
