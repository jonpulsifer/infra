---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
spec:
  values:
    # A map: an omitted key keeps the base's value, the other cluster's domain.
    extraArgs:
      redirect-url: https://oauth2.${SPINDRIFT_DOMAIN}/oauth2/callback
      # Zone-wide: sign-in sets the CSRF cookie at the App's host and reads it at
      # the callback host. The cost: `auth: none` Apps here receive the session.
      cookie-domain: .${SPINDRIFT_DOMAIN}
      whitelist-domain: .${SPINDRIFT_DOMAIN}
