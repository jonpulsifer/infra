---
# On the gateway's `oauth2-tls` listener, which admits only this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: default
      sectionName: oauth2-tls
  hostnames:
    - "oauth2.${SPINDRIFT_DOMAIN}"
  rules:
    # The whole host: a sign-in's return target can resolve to an App path here,
    # and `/oauth2` alone would 404 it. The only upstream is `static://200`.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy
          port: 80
