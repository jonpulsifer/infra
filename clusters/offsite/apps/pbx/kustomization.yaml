---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/apps/pbx
  - external-secret.yaml
  - network-policy.yaml

namespace: pbx

patches:
  # Parked. The trunk still needs TLS to voip.ms proven live, and the owner
  # has not asked for DID #2 to ring anyone yet. Everything else here keeps
  # reconciling — the ExternalSecret still syncs and a config change still
  # validates — so removing this patch is the whole way to bring it back.
  - target:
      kind: Deployment
      name: pbx
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0

configMapGenerator:
  # The non-secret half of the trunk. No ${...} of its own, so unlike pbx-site
  # this one is left in Flux's substitution path.
  - name: pbx-env
    literals:
      # The sub-account whose DID the agent answers.
      - PBX_VOIPMS_USER=168847_elevenlabs
      - PBX_VOIPMS_SERVER=ca.voip.ms

  - name: pbx-site
    files:
      - config/pjsip.conf
      - config/extensions.conf
    # Asterisk's dialplan and this render script are written in ${...}, which
    # is also Flux's postBuild substitution syntax. Flux does not merely blank
    # what it cannot resolve here — `${PBX_*}` and `${$name}` are not valid
    # variable references, and envsubst fails the whole Kustomization with
    # "missing closing brace", taking every other app on the cluster with it.
    #
    # Escaping each one as `$${...}` would work and would be unreadable, and
    # every future dialplan line would have to remember. Opting the ConfigMap
    # out is the version that cannot be got wrong later.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
