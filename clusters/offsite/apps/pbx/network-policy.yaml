---
# offsite egress. Carrier and agent, nothing else. No LAN destination: no
# handset registers to this site.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pbx-egress
  namespace: pbx
  labels:
    app.kubernetes.io/name: pbx
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pbx
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*.voip.ms"
              - matchPattern: voip.ms
              # A bare `*` matches one DNS label. Their SIP host has two
              # (sip.rtc.elevenlabs.io), so `**` — matching any number of
              # labels — is what actually lets the lookup through.
              - matchPattern: "**.elevenlabs.io"
    - toFQDNs:
        - matchPattern: "*.voip.ms"
        - matchName: voip.ms
      toPorts:
        - ports:
            - {port: "5060", protocol: UDP}
            - {port: "5060", protocol: TCP}
    # 5061 for TLS, which is the transport the endpoint pins. 5060/TCP is
    # allowed alongside it so a fallback to their TCP port does not need a
    # policy change at the moment someone is debugging a handshake.
    #
    # A follow-up request such as their BYE goes to the Contact host from
    # their response, one label under a different domain
    # (<id>.hosts.rtc.elevenlabs.io) — the DNS rule above resolves it, but
    # toFQDNs enforces destinations independently and needs its own entry.
    - toFQDNs:
        - matchName: sip.rtc.elevenlabs.io
        - matchPattern: "*.hosts.rtc.elevenlabs.io"
      toPorts:
        - ports:
            - {port: "5061", protocol: TCP}
            - {port: "5060", protocol: TCP}
    # Media, from both far ends. See the same rule in folly's policy: an SDP
    # body names a host nothing here ever resolved, so no FQDN rule can cover
    # it, and without this the call connects and carries silence.
    #
    # ElevenLabs' media servers pick from a wider range than our own; rtp.conf
    # still pins this pod's own RTP sockets to 10000-20000, so this widens
    # only the destination port the far end may answer from.
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "10000", endPort: 60000, protocol: UDP}
