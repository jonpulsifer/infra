; Gosub(pbx-event,s,1(<kind>[,<key=value>...])) logs one NOTICE line,
;   pbx-event kind=<kind> line=<line> caller=<digits> [key=value...]
; the contract folly's events.conf logs too, so one VictoriaLogs query reads
; either site. <line> is folly's expression, HANDSET or else the endpoint the
; call came in on. No endpoint here sets HANDSET, so a call logs
; vms-elevenlabs. Values carry no spaces.
[pbx-event]
exten => s,1,Set(LOCAL(line)=${IF($["${HANDSET}" = ""]?${CHANNEL(endpoint)}:${HANDSET})})
 same => n,Set(LOCAL(msg)=pbx-event kind=${ARG1} line=${line} caller=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($["${ARG2}" != ""]?Set(LOCAL(msg)=${msg} ${ARG2}))
 same => n,ExecIf($["${ARG3}" != ""]?Set(LOCAL(msg)=${msg} ${ARG3}))
 same => n,Log(NOTICE,${msg})
 same => n,Return()
