; offsite dialplan. Every call voip.ms delivers to the sub-account
; 168847_elevenlabs goes to Earl, the ElevenLabs agent pbx-troll, over the
; elevenlabs trunk in pjsip.conf: a stranger folly's line 4 screened and
; transferred, or a caller on a DID the voip.ms portal routes here. This site
; mounts no prompts and answers nothing itself: the agent does the talking.
;
; The caller ID voip.ms presents after a transfer is unproven. It is logged and
; passed to the agent, and nothing here routes on it.

[general]
static = yes
writeprotect = yes

#include "events.conf"

; `s` is the real handler. voip.ms addresses a call to the registered contact
; as `s`; in its other form the call carries digits, and the pattern sends it
; to the same place. `!` rather than `.` so a one-digit internal extension
; matches too.
[from-voipms]
exten => _X!,1,Goto(s,1)

; The agent takes two calls at once and twenty a day, the limits pbx-troll.json
; sets at ElevenLabs. These caps count this PBX's calls alone. folly dials the
; same agent with caps of its own, so the two sites together let through four
; at once and forty answered a day; ElevenLabs' own limits are the shared
; ceiling. GROUP() is set on the agent's leg, so a Dial that fails frees its
; place at once. [agent-held] counts each call the agent answered, and a
; restart clears the count. voip.ms sends the caller as ten digits; CALLER
; folds a leading 1 to match.
exten => s,1,NoOp(inbound ${CALLERID(all)} on ${CHANNEL(endpoint)})
 same => n,Set(CALLER=${FILTER(0-9,${CALLERID(num)})})
 same => n,ExecIf($[${LEN(${CALLER})} = 11 & "${CALLER:0:1}" = "1"]?Set(CALLER=${CALLER:1}))
 same => n,Gosub(pbx-event,s,1(inbound))
 ; render.sh renders a PBX_AGENT_DID that is present but empty, and a Dial to
 ; no number fails at ElevenLabs.
 same => n,Set(AGENT_MISS=off)
 same => n,GotoIf($["${FILTER(0-9,${PBX_AGENT_DID})}" = ""]?refuse,1)
 same => n,Set(AGENT_MISS=full)
 same => n,GotoIf($[${GROUP_COUNT(troll)} >= 2]?refuse,1)
 same => n,Set(AGENT_MISS=daily)
 same => n,GotoIf($["${TROLL_DAY}" = "${STRFTIME(,,%Y%m%d)}" & 0${TROLL_N} >= 20]?refuse,1)
 same => n,Gosub(pbx-event,s,1(troll,mode=troll))
 same => n,Set(SINK_START=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=agent-held,s,1)
 ; S(600) ends an answered call at ten minutes, the agent's own limit too.
 same => n,Dial(PJSIP/${PBX_AGENT_DID}@elevenlabs,60,b(agent-leg^s^1(troll^${UNIQUEID}^${CALLER}))S(600))
 ; Dial returns only when the agent did not answer: an answered call ends
 ; with a hangup, and agent-held logs how long it lasted.
 same => n,Set(AGENT_MISS=${DIALSTATUS})
 same => n,Set(CHANNEL(hangup_handler_pop)=)
 same => n,Goto(refuse,1)

; Every miss is refused before anything answers. A caller folly transferred
; here then fails the transfer: voip.ms reports an answered call to folly as a
; success, and folly keeps a refused caller for its own fallback. Busy (486)
; at a cap or when the agent is busy, 503 for anything else.
exten => refuse,1,Gosub(pbx-event,s,1(troll-miss,mode=troll,why=${AGENT_MISS}))
 same => n,Hangup(${IF($["${AGENT_MISS}" = "full" | "${AGENT_MISS}" = "daily" | "${AGENT_MISS}" = "BUSY"]?17:34)})

; A hangup handler. Dial empties ANSWEREDTIME when it starts and sets it only
; when a bridged call ends, so a caller who hangs up while the agent's leg is
; still ringing logs nothing and is not counted. secs counts from the Dial,
; so it includes the few seconds the agent took to answer.
[agent-held]
exten => s,1,GotoIf($["${ANSWEREDTIME}" = ""]?done)
 same => n,Set(TROLL_TODAY=${STRFTIME(,,%Y%m%d)})
 same => n,ExecIf($["${TROLL_DAY}" != "${TROLL_TODAY}"]?Set(GLOBAL(TROLL_N)=0))
 same => n,Set(GLOBAL(TROLL_DAY)=${TROLL_TODAY})
 same => n,Set(GLOBAL(TROLL_N)=$[0${TROLL_N} + 1])
 same => n,Gosub(pbx-event,s,1(held,secs=$[${EPOCH} - ${SINK_START}],sink=troll))
 same => n(done),Return()

; Dial()'s b() runs this on the agent's leg before its INVITE; PJSIP_HEADER in
; [from-voipms] would set the header on the caller's leg. ElevenLabs reads
; X-Pbx-Mode as {{sip_pbx_mode}}, and X-Call-ID and X-Caller-ID as its system
; call id and caller id.
[agent-leg]
exten => s,1,Set(GROUP()=troll)
 same => n,Set(PJSIP_HEADER(add,X-Pbx-Mode)=${ARG1})
 same => n,Set(PJSIP_HEADER(add,X-Call-ID)=${ARG2})
 same => n,ExecIf($["${ARG3}" != ""]?Set(PJSIP_HEADER(add,X-Caller-ID)=${ARG3}))
 same => n,Return()

; ElevenLabs never calls in: nothing admits SIP into this pod.
[from-elevenlabs]
exten => _X.,1,Hangup(21)
