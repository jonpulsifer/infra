; offsite dialplan. One path: carrier in, agent out.

[general]
static = yes
writeprotect = yes

; `s` is the real handler: a DID routed to a voip.ms sub-account arrives
; addressed to `s` rather than to the number dialled, and a dialplan with only
; a digit pattern rejects the call. The digit pattern stays for a DID pointed
; here by number instead, and lands in the same place.
[from-voipms]
exten => _X.,1,Goto(s,1)

exten => s,1,NoOp(DID2 inbound ${CALLERID(num)} -> ${EXTEN})
 ; GROUP_COUNT() tallies every channel a prior call already marked into the
 ; elevenlabs group. Checked before Dial() answers anything, so a caller over
 ; the cap never rings the agent or bills a minute.
 same => n,GotoIf($[${GROUP_COUNT(elevenlabs)} >= 2]?capped,1)
 same => n,Dial(PJSIP/${PBX_AGENT_DID}@elevenlabs,60,b(agent-leg^s^1(${UNIQUEID}^${CALLERID(num)})))
 same => n,NoOp(agent leg ended: ${DIALSTATUS})
 same => n,Hangup()

exten => capped,1,NoOp(elevenlabs at cap, rejecting ${CALLERID(num)})
 same => n,Hangup(17)

; Dial()'s b() option runs this on the elevenlabs channel itself, before
; Asterisk sends its INVITE. PJSIP_HEADER(add) and TIMEOUT() in plain
; dialplan act on the channel evaluating them; on Asterisk 22.8.2
; (PJSIP_INHERITABLE_HEADER is 22.9.0+) that is never the leg being dialled,
; so setting either of these from [from-voipms] would be a no-op.
[agent-leg]
exten => s,1,Set(PJSIP_HEADER(add,X-CALL-ID)=${ARG1})
 same => n,Set(PJSIP_HEADER(add,X-CALLER-ID)=${ARG2})
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,Set(GROUP()=elevenlabs)
 same => n,Return()

; ElevenLabs is not expected to originate toward us — that direction needs a
; publicly reachable address this site does not have, and agent-placed calls
; are configured against voip.ms directly instead. The context exists so that
; if one ever arrives it lands somewhere legible rather than in `default`.
[from-elevenlabs]
exten => _X.,1,NoOp(unexpected inbound from elevenlabs -> ${EXTEN})
 same => n,Hangup(21)
