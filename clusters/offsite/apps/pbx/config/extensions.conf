; offsite dialplan. One path: carrier in, agent out.

[general]
static = yes
writeprotect = yes

[from-voipms]
exten => _X.,1,NoOp(DID2 inbound ${CALLERID(num)} -> ${EXTEN})
 ; Their docs name these as the call-metadata headers, falling back to a
 ; Twilio-shaped one when absent. We are not Twilio, so send them explicitly —
 ; without a caller id the agent has no idea who it is talking to.
 same => n,Set(PJSIP_HEADER(add,X-CALL-ID)=${UNIQUEID})
 same => n,Set(PJSIP_HEADER(add,X-CALLER-ID)=${CALLERID(num)})
 same => n,Dial(PJSIP/${PBX_AGENT_DID}@elevenlabs,60)
 same => n,NoOp(agent leg ended: ${DIALSTATUS})
 same => n,Hangup()

; ElevenLabs is not expected to originate toward us — that direction needs a
; publicly reachable address this site does not have, and agent-placed calls
; are configured against voip.ms directly instead. The context exists so that
; if one ever arrives it lands somewhere legible rather than in `default`.
[from-elevenlabs]
exten => _X.,1,NoOp(unexpected inbound from elevenlabs -> ${EXTEN})
 same => n,Hangup(21)
