; offsite: the agent site. A call arrives on DID #2 and is handed straight to
; the ElevenLabs agent. No handset registers here and nothing dials in from the
; LAN — both legs are outbound, which is what keeps this working without a
; publicly reachable address.
;
; This site exists rather than folly's because the agent's audio never touches
; a phone in the house: putting it at folly would push the caller's speech out
; over Starlink's uplink, the weak half of that link, on its way to ASR.

[global]
type = global
; Log every SIP message, sent and received, to the console — which is the pod's
; stdout, which Vector ships to VictoriaLogs. Every failed call so far was
; diagnosed from the carrier's own SIP; having it only when someone remembers
; `pjsip set logger` means the call that mattered is the one not captured.
; The SRTP keys and digest responses in these lines are redacted by Vector
; before they are stored (clusters/base/monitoring/vector.yaml).
debug = yes
user_agent = offsite-pbx

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
; The image carries the Mozilla bundle at this path via nixpkgs' cacert.
ca_list_file = /etc/ssl/certs/ca-bundle.crt
; This binds a listener because PJSIP has no outbound-only transport, but
; nothing dials in: the NetworkPolicy beside this declares no ingress on 5061
; and there is no Service in front of it.

; ── voip.ms trunk (DID #2) ────────────────────────────────────────────────

[voipms]
type = registration
transport = transport-udp
outbound_auth = voipms-auth
server_uri = sip:${PBX_VOIPMS_SERVER}
client_uri = sip:${PBX_VOIPMS_USER}@${PBX_VOIPMS_SERVER}
expiration = 300
retry_interval = 60
forbidden_retry_interval = 600
line = yes
endpoint = voipms

[voipms-auth]
type = auth
auth_type = userpass
username = ${PBX_VOIPMS_USER}
password = ${PBX_VOIPMS_PASS}

[voipms-aor]
type = aor
contact = sip:${PBX_VOIPMS_SERVER}
qualify_frequency = 60

[voipms]
type = endpoint
context = from-voipms
disallow = all
; What voip.ms actually offers is set per sub-account in their portal, not
; negotiated from anything here. Captured from a real inbound INVITE:
;
;   m=audio 17126 RTP/SAVP 9 101
;   a=rtpmap:9 G722/8000
;   a=crypto:1 AES_CM_128_HMAC_SHA1_80 ...
;
; G.722 and nothing else, so a trunk that allowed only ulaw had no overlap and
; every call died in SDP negotiation with "Couldn't negotiate stream ...
; (nothing)" — after signalling had already worked end to end. g722 first
; because the handset prefers it too, and the call then bridges without
; transcoding; ulaw stays as the fallback for a sub-account set differently.
allow = g722
allow = ulaw
; RTP/SAVP in that same offer: the sub-account also requires SRTP, keyed by
; SDES in the SDP. Without this, allowing g722 alone still fails — the
; transport profile does not match. Optimistic so an outbound call offers SRTP
; but still completes if a sub-account answers in the clear.
;
; Note what this does and does not protect. The keys ride in the SDP, and the
; SDP rides over plain UDP signalling, so SRTP here defeats someone who sees
; only the media, not someone who can read the SIP. TLS to 5061 closes that;
; it is a change to the sub-account as much as to this file.
media_encryption = sdes
media_encryption_optimistic = yes
outbound_auth = voipms-auth
aors = voipms-aor
from_user = ${PBX_VOIPMS_USER}
from_domain = ${PBX_VOIPMS_SERVER}
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

; ── ElevenLabs agent trunk ────────────────────────────────────────────────
; No registration and no inbound leg. ElevenLabs serves SIP from several hosts
; behind one name and authenticates our INVITE with digest, so this side needs
; no address of its own — which is exactly why it survives CGNAT.
;
; The agent is selected by the number in the request URI, matched against the
; phone number imported in the ElevenLabs dashboard. The dialplan puts
; ${PBX_AGENT_DID} there; an agent assigned to a different number will not
; answer this.

[elevenlabs]
type = endpoint
transport = transport-tls
context = from-elevenlabs
disallow = all
; The two codecs they accept. ulaw first: it is what voip.ms delivers, so the
; call bridges without transcoding in the common case.
allow = ulaw
allow = g722
outbound_auth = elevenlabs-auth
aors = elevenlabs
from_domain = sip.rtc.elevenlabs.io
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; SDES over the TLS transport. `sdes` rather than `dtls` because their trunk
; negotiates SRTP keys in the SDP, which TLS signalling already protects.
media_encryption = sdes
; This endpoint only ever originates toward ElevenLabs; a REFER out of it
; would move a live call to whatever transfer target the agent names next.
allow_transfer = no
; If their BYE never reaches us across CGNAT, the call would otherwise hold
; open with no traffic on either leg. 30 s of dead RTP ends it instead.
rtp_timeout = 30

[elevenlabs-auth]
type = auth
auth_type = userpass
username = ${PBX_ELEVENLABS_USER}
password = ${PBX_ELEVENLABS_PASS}

[elevenlabs]
type = aor
; 5061 is the TLS port; 5060 is theirs for TCP. The escaped semicolon is not a
; typo — an unescaped one starts a comment and the transport parameter would
; vanish, silently downgrading this to whatever transport PJSIP picked.
contact = sip:sip.rtc.elevenlabs.io:5061\;transport=tls
qualify_frequency = 120
