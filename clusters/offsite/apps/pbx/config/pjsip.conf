; offsite: the troll site. voip.ms delivers every call on the sub-account
; 168847_elevenlabs here (a stranger folly's line 4 screened and transferred,
; or a caller on a DID the portal routes to it), and extensions.conf hands each
; one to the troll agent at ElevenLabs. No handset registers here.
;
; Both trunks only originate: this pod opens the TLS registration voip.ms
; delivers calls down, and each call to ElevenLabs. Nothing dials in, so no
; Service publishes SIP and the ingress policy admits none.
;
; The agent's calls run here because offsite's uplink is steady and folly's is
; Starlink: at folly the caller's speech would climb Starlink's uplink on its
; way to the agent.
;
; ${PBX_*} is rendered by render.sh before Asterisk ever reads this file.
; Everything else in ${...} here is Asterisk's own and is left alone.

[global]
type = global
; Log every SIP message, sent and received, to the console — which is the pod's
; stdout, which Vector ships to VictoriaLogs. Every failed call so far was
; diagnosed from the carrier's own SIP; having it only when someone remembers
; `pjsip set logger` means the call that mattered is the one not captured.
; The SRTP keys and digest responses in these lines are redacted by Vector
; before they are stored (clusters/base/monitoring/vector.yaml).
debug = yes
user_agent = offsite-pbx

; The only transport. Both trunks pin it, so a UDP transport would carry
; nothing, and network-policy.yaml admits no plain SIP.
[transport-tls]
type = transport
protocol = tls
; A listener PJSIP needs in order to originate TLS at all. Nothing dials in on
; it: no Service publishes 5061 and the ingress policy does not admit it.
bind = 0.0.0.0:5061
method = tlsv1_2
; The Mozilla bundle nixpkgs' cacert puts in the image. voip.ms's and
; ElevenLabs' certificates verify against it on folly, from the same image.
ca_list_file = /etc/ssl/certs/ca-bundle.crt
verify_server = yes

; ── voip.ms trunk: 168847_elevenlabs ─────────────────────────────────────
; voip.ms encrypts only against a numbered server, which PBX_VOIPMS_SERVER
; names (pbx-env in kustomization.yaml). TLS keeps the SDES keys in every SDP
; off the wire.
;
; A sub-account that starts taking calls somewhere new can be held by voip.ms's
; fraud protection. Here that looks like a green registration and no INVITE,
; and voip.ms support releases it. See the runbook.

[vms-elevenlabs]
type = registration
transport = transport-tls
; The escaped semicolon is required: bare, it starts a comment and silently
; drops the transport parameter.
server_uri = sip:${PBX_VOIPMS_SERVER}:5061\;transport=tls
client_uri = sip:${PBX_VOIPMS_USER}@${PBX_VOIPMS_SERVER}
outbound_auth = vms-elevenlabs
; Well inside any NAT timeout. A mapping that closes between registrations is
; an inbound call that never arrives and no error anywhere.
expiration = 300
retry_interval = 60
; A wrong password retried every 60s is how an account gets blocked. Back off.
forbidden_retry_interval = 600
; Ties a call voip.ms sends to the registered contact back to this endpoint:
; the contact carries a `line` parameter, and the call comes back with it.
; The identify below catches voip.ms's other form.
line = yes
endpoint = vms-elevenlabs

[vms-elevenlabs]
type = endpoint
transport = transport-tls
context = from-voipms
; Replaces PJSIP's default `username,ip`. Asterisk 22 reads this list only in
; its username and auth_username identifiers, so the registration's `line`
; and the identify below still find this endpoint. voip.ms sends the caller's
; number as the From user, so `username` could only ever match a forged From.
identify_by = header
; voip.ms offers G.722 over SRTP (RTP/SAVP, SDES) on folly's sub-accounts.
; g722 first so the call bridges to the agent without transcoding; ulaw for a
; sub-account set differently.
disallow = all
allow = g722
allow = ulaw
; Strict SAVP, as on folly: the sub-account allows encrypted SIP, and over TLS
; signalling voip.ms offers SAVP.
media_encryption = sdes
media_encryption_optimistic = no
outbound_auth = vms-elevenlabs
aors = vms-elevenlabs
from_user = ${PBX_VOIPMS_USER}
from_domain = ${PBX_VOIPMS_SERVER}
; No set_var HANDSET: no handset registers here, and pbx-event names this
; endpoint as the line.
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[vms-elevenlabs]
type = aor
contact = sip:${PBX_VOIPMS_SERVER}:5061\;transport=tls
qualify_frequency = 60

[vms-elevenlabs]
type = auth
auth_type = userpass
username = ${PBX_VOIPMS_USER}
password = ${PBX_VOIPMS_PASS}

; voip.ms delivers an inbound call in one of two forms, set on its side for
; each sub-account: to the registered contact, addressed to `s`, with the
; registration's `line` parameter; or to digits at the public address the
; connection comes from, with no `line` and an X-Dest-User header naming the
; sub-account. A form this file does not match fails as "No matching endpoint
; found", and which form a transfer from folly arrives in is voip.ms's choice,
; so this trunk matches both.
;
; The value is an exact match. Anyone can write a header, and what keeps a
; forged one out is who can reach a SIP listener at all: voip.ms, down the
; connection the registration opened; ElevenLabs, down the connection a call
; to the agent opens; and the node the pod runs on. modules.conf refuses SIP
; over WebSocket, which would make the metrics port a SIP listener too. No
; identify matches by address: the ip identifier runs before the header one,
; and would take every request from that address.
[vms-elevenlabs]
type = identify
endpoint = vms-elevenlabs
match_header = X-Dest-User: ${PBX_VOIPMS_USER}

; ── the troll trunk: ElevenLabs ───────────────────────────────────────────
; extensions.conf hands every caller to Earl, the ElevenLabs agent pbx-troll,
; down this trunk. It only originates: this PBX opens the TLS connection and
; ElevenLabs answers down it.
;
; No registration. ElevenLabs picks the agent by the number in the request URI
; (PBX_AGENT_DID, as it was imported there, leading + included) and challenges
; the INVITE for the digest credentials below. The offsite reconciler sets the
; same credentials on that number from the same 1Password item, and folly's
; PBX dials the same number with them. ElevenLabs never calls in here. A
; request that reaches this endpoint anyway, which PJSIP's default identify_by
; does for a From user of `elevenlabs`, goes to [from-elevenlabs], and that
; hangs up.
[elevenlabs]
type = endpoint
transport = transport-tls
context = from-elevenlabs
; g722 first: voip.ms delivers G.722, so the caller's leg and the agent's
; bridge without transcoding. ulaw is ElevenLabs' other codec.
disallow = all
allow = g722
allow = ulaw
outbound_auth = elevenlabs
aors = elevenlabs
from_domain = sip.rtc.elevenlabs.io
; The number requires encrypted media. SDES keys ride in the SDP, which the
; TLS signalling protects.
media_encryption = sdes
media_encryption_optimistic = no
direct_media = no
rtp_symmetric = yes
force_rport = yes
; The answer's Contact names the ElevenLabs server that took the call, a host
; under hosts.rtc.elevenlabs.io, and the ACK and BYE go there, as ElevenLabs
; asks: sent to sip.rtc.elevenlabs.io they can reach another server, which
; answers 481. rewrite_contact would swap that name for the bare address the
; answer came from, and a connection reopened to a bare address fails
; verify_server. network-policy.yaml admits the Contact hosts.
rewrite_contact = no
; A REFER from the agent would move a live caller to whatever it named.
allow_transfer = no
; A BYE ElevenLabs sends on a new connection cannot reach this pod: nothing
; admits SIP in. Their audio stopping for 30 s ends the leg instead.
rtp_timeout = 30

[elevenlabs]
type = auth
auth_type = userpass
username = ${PBX_ELEVENLABS_USER}
password = ${PBX_ELEVENLABS_PASS}

[elevenlabs]
type = aor
; The escaped semicolon keeps transport=tls a URI parameter.
contact = sip:sip.rtc.elevenlabs.io:5061\;transport=tls
; No qualify. A ping that went unanswered would mark the contact unreachable
; and send every caller to goodbye, and it would hold a connection to
; ElevenLabs open between calls for nothing.
