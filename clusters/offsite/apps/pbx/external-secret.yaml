---
# One Secret, because this site has no reason to boot without either half: a
# PBX that cannot register takes no calls, and one without the agent's number
# has nowhere to send them. An ExternalSecret fails as a whole on a missing
# property, so a missing field leaves the pod in CreateContainerConfigError
# with the reason on this object.
#
# The voip.ms password comes from "voip.ms sub accounts" in the `homelab`
# vault, whose concealed fields are labelled with the username they belong to:
# `property` names the account and the value is its password. That item's
# canonical `username`/`password` fields are empty and must not be used.
#
# The ElevenLabs half is "elevenlabs troll trunk", the item folly's
# pbx-elevenlabs reads too: the number ElevenLabs picks the agent by, leading +
# included, and the digest credentials the INVITE answers the challenge with.
# The offsite reconciler sets the same credentials on that number
# (clusters/offsite/apps/elevenlabs/), so a rotation is one edit to the item.
# Reloader rolls this pod when the Secret changes (the base Deployment's
# annotation), which cuts a troll call in progress.
#
# The username and server are not secrets; they are literals in pbx-env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbx-secrets
  namespace: pbx
spec:
  # Not 0. A refreshInterval of zero means "fetch once, never again", and a
  # credential rotated in the vault then never reaches the pod.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pbx-secrets
    creationPolicy: Owner
  data:
    - secretKey: PBX_VOIPMS_PASS
      remoteRef: {key: voip.ms sub accounts, property: "168847_elevenlabs"}
    - secretKey: PBX_AGENT_DID
      remoteRef: {key: elevenlabs troll trunk, property: agent-did}
    - secretKey: PBX_ELEVENLABS_USER
      remoteRef: {key: elevenlabs troll trunk, property: username}
    - secretKey: PBX_ELEVENLABS_PASS
      remoteRef: {key: elevenlabs troll trunk, property: password}
