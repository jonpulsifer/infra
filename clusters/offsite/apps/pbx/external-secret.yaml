---
# 1Password item `pbx-offsite` in the `homelab` vault.
#
# A voip.ms sub-account of its own, separate from folly's: the two sites
# register independently, and one revoked credential must not silence the
# other. `agent-did` is the number imported into ElevenLabs — it selects which
# agent answers, so it is config, not a secret, but it lives here so the whole
# trunk is described in one place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbx-secrets
  namespace: pbx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pbx-secrets
    creationPolicy: Owner
  data:
    - secretKey: PBX_VOIPMS_SERVER
      remoteRef: {key: pbx-offsite, property: voipms-server}
    - secretKey: PBX_VOIPMS_USER
      remoteRef: {key: pbx-offsite, property: voipms-user}
    - secretKey: PBX_VOIPMS_PASS
      remoteRef: {key: pbx-offsite, property: voipms-password}
    - secretKey: PBX_AGENT_DID
      remoteRef: {key: pbx-offsite, property: agent-did}
    - secretKey: PBX_ELEVENLABS_USER
      remoteRef: {key: pbx-offsite, property: elevenlabs-sip-user}
    - secretKey: PBX_ELEVENLABS_PASS
      remoteRef: {key: pbx-offsite, property: elevenlabs-sip-password}
