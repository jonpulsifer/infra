---
# Two items, because they rotate for different reasons and one of them does not
# exist yet.
#
# The voip.ms password comes from "voip.ms sub accounts" in the `homelab`
# vault, whose concealed fields are labelled with the username they belong to —
# `property` names the account, the value is its password. `168847_elevenlabs`
# is the sub-account whose DID the agent answers. That item's canonical
# `username`/`password` fields are empty and must not be used.
#
# The ElevenLabs half is a separate item that has to be created from their
# dashboard when the SIP trunk is set up: the digest credentials our INVITE
# authenticates with, plus the phone number imported there, which is what
# selects the agent. The number is not a secret, but it lives with the trunk it
# belongs to rather than as a literal two files away.
#
# Until that item exists this ExternalSecret fails as a whole — an
# ExternalSecret is all-or-nothing on a missing property — and offsite's pod
# stays in CreateContainerConfigError. That is the intended state, not a fault.
#
# The username and server are not secrets; they are literals in pbx-env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pbx-secrets
  namespace: pbx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pbx-secrets
    creationPolicy: Owner
  data:
    - secretKey: PBX_VOIPMS_PASS
      remoteRef: {key: voip.ms sub accounts, property: "168847_elevenlabs"}
    - secretKey: PBX_AGENT_DID
      remoteRef: {key: elevenlabs sip trunk, property: agent-did}
    - secretKey: PBX_ELEVENLABS_USER
      remoteRef: {key: elevenlabs sip trunk, property: sip-user}
    - secretKey: PBX_ELEVENLABS_PASS
      remoteRef: {key: elevenlabs sip trunk, property: sip-password}
