---
# The WeatherFlow tokens the hub polls with, from the same 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-env
  namespace: weather
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: weather-env
    creationPolicy: Owner
  data:
    - secretKey: TEMPESTWX_TOKENS
      remoteRef:
        key: qytxxks3t6ttmhkbfl43ginglu
        property: password
