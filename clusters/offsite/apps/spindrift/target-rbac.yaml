---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spindrift-target-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spindrift-target-discovery
subjects:
  - kind: ServiceAccount
    name: spindrift
    namespace: spindrift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spindrift-target-delivery
  namespace: spindrift-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spindrift-target-delivery
subjects:
  - kind: ServiceAccount
    name: spindrift
    namespace: spindrift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spindrift-target-chart-source
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spindrift-target-chart-source
subjects:
  - kind: ServiceAccount
    name: spindrift
    namespace: spindrift
