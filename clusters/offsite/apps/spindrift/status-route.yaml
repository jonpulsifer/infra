---
# Catch-all for App names with nothing deployed; the control plane answers with
# a status page. Any Component's exact hostname outranks this wildcard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spindrift-status
  namespace: spindrift-apps
  annotations:
    # Holds external-dns off these wildcards, which Terraform owns. Both
    # spellings: external-dns v0.22.0 changed the prefix with no fallback.
    external-dns.alpha.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
    external-dns.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
spec:
  # No sectionName: names arrive over TLS from the lab and over HTTP from the tunnel.
  parentRefs:
    - name: spindrift-apps
  # The dedicated App zone only. Elsewhere this wildcard would answer for names
  # Terraform or kthx owns, and Cilium splits two routes on one wildcard 50/50.
  hostnames:
    - "*.${SPINDRIFT_DOMAIN}"
  rules:
    - backendRefs:
        - name: spindrift
          namespace: spindrift
          port: 3000
---
# Scoped to one Service: a namespace-wide grant would let any App route in
# `spindrift-apps` reach anything the control plane runs.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: spindrift-apps-status-page
  namespace: spindrift
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: spindrift-apps
  to:
    - group: ""
      kind: Service
      name: spindrift
