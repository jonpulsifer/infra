---
# The route an App name takes before anything is deployed to it.
#
# §9 wants an App's address to resolve from the moment the App exists. Every
# other route on this gateway is rendered by the App chart and carries one
# Component's exact hostnames; this one carries the whole zone and backs onto
# the control plane, which answers with a page saying where that App is up to
# (`apps/spindrift/src/web/status-route.ts`).
#
# **It is lowest precedence by construction, not by configuration.** Gateway API
# orders matching routes by hostname specificity — an exact hostname wins over a
# wildcard — so the moment a Component's own route exists this one stops seeing
# its name, and it starts seeing it again if that route is removed. Nothing here
# has to be told, and no ordering annotation exists to get wrong.
#
# **One zone, and it is a dedicated one.** `${SPINDRIFT_DOMAIN}` is disjoint
# from any hand-managed flat space, so a catch-all over it can only ever answer
# for a name the control plane itself minted. The other zones the installation
# mints in are deliberately absent: `${SECRET_DOMAIN}` is hand-managed and a
# wildcard there would answer for names Terraform owns, and `embarrassing.ca`
# and `wishin.app` reach this gateway for Components that are not cluster
# workloads at all.
#
# `kthx.dev` is served by its own workload on this same gateway
# (`clusters/offsite/apps/kthx`), which owns both `kthx.dev` and `*.kthx.dev`.
# The wildcard cannot be carried in both places: Cilium 1.20.1 merges two routes
# matching one wildcard into a 50/50 `weighted_clusters` split rather than
# tie-breaking, so half of every site's traffic would land here.
#
# It is a vessel resource for the same reason the Gateway beside it is: no
# release owns it, and a `destroy()` cannot take it with the App it removes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spindrift-status
  namespace: spindrift-apps
  annotations:
    # The same hold-out the App chart's routes carry, and load-bearing for the
    # same reason: external-dns's `gateway-httproute` source would otherwise
    # publish every hostname below at the parent Gateway's status address —
    # RFC1918 A records over whole zones, claimed by a second source. The
    # wildcard records this route needs are the ones Terraform owns
    # (`terraform/network/cloudflare/spindrift.tf`, one per zone), pointed at
    # the tunnel.
    #
    # Both spellings: external-dns v0.22.0 moved the default annotation prefix
    # with no fallback, and a controller reads exactly one of them. Carrying the
    # pair means the pin in
    # `clusters/base/networking/external-dns/helm-release.yaml` can move without
    # this route losing its hold-out and claiming the wildcard.
    external-dns.alpha.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
    external-dns.kubernetes.io/controller: lolwtf.ca/spindrift-dnsendpoint
spec:
  parentRefs:
    - name: spindrift-apps
  # No `sectionName`: a `${SPINDRIFT_DOMAIN}` name arrives on the TLS listener
  # from the lab and on the plain HTTP one from the tunnel, and the page is the
  # same answer either way.
  hostnames:
    - "*.${SPINDRIFT_DOMAIN}"
  rules:
    - backendRefs:
        # The control plane, across the namespace boundary — granted below. It
        # tells a request for one of its Apps from a request for its own UI by
        # the `Host` header, which is why `controlPlane.hostname` is authored
        # rather than derived.
        - name: spindrift
          namespace: spindrift
          port: 3000
---
# What lets the route above cross into the control plane's namespace.
#
# Scoped to the one Service: a grant naming the namespace would let any future
# route in `spindrift-apps` — which is where developer-controlled App routes
# live — reach anything the control plane runs.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: spindrift-apps-status-page
  namespace: spindrift
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: spindrift-apps
  to:
    - group: ""
      kind: Service
      name: spindrift
