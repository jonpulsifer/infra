---
# The App edge: its own Gateway and LB address, so App traffic cannot crowd
# `cluster-gateway` or the control plane's `spindrift-gateway`.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: spindrift-apps
  namespace: spindrift-apps
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
spec:
  gatewayClassName: cilium
  # Pinned: every `reach: private` App's A record names this address
  # (`platform.dns.privateAddress`).
  addresses:
    - type: IPAddress
      value: 10.89.0.69
  # Listeners admit routes by namespace label; a route none admits is
  # `Accepted=False` while the deploy reads LIVE.
  listeners:
    # The tunnel's origin; Cloudflare terminates TLS at the edge.
    - name: http-gateway
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
    # A wildcard binds one label, so App names are flat: `plainboi-web`, not
    # `web.plainboi`. cert-manager issues it from the annotation above.
    - name: spindrift-apps-tls
      protocol: HTTPS
      port: 443
      hostname: "*.${SPINDRIFT_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-${SPINDRIFT_DOMAIN}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
    # The App chart's DNSEndpoint decides per record whether a name reaches this
    # listener or `cluster-gateway`'s own wildcard.
    - name: spindrift-apps-tls-secret-domain
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-apps-${SECRET_DOMAIN}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
    # Public-only: names arrive through the tunnel, never as RFC1918 records.
    - name: spindrift-apps-tls-wishin
      protocol: HTTPS
      port: 443
      hostname: "*.wishin.app"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-wishin-app
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
    # Public-only. The apex App rides `http-gateway`: a wildcard never matches
    # the apex, and the edge terminates its TLS.
    - name: spindrift-apps-tls-clankerbanker
      protocol: HTTPS
      port: 443
      hostname: "*.clankerbanker.ca"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-clankerbanker-ca
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: spindrift
        kinds:
          - kind: HTTPRoute
