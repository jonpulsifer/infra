---
# Spindrift is a **platform workload, never one of its own Apps**: Flux owns
# this namespace exactly as it owns Atlantis's and hub's, which is what resolves
# a deploy layer that would otherwise have to deploy itself.
#
# The installer chart is an independently pinned, extractable OCI artifact, not
# this installation's repository-local chart path. `oci-repository.yaml` names
# the artifact; `.github/workflows/spindrift-charts.yml` is what puts it there,
# packaging and pushing `packages/charts/spindrift` on every merge that touches
# it. That closes the installer half of the per-Target chart pinning the
# extraction path wants.
#
# The App chart (`manifest.charts.app` below) is not the same yet, and cannot
# be flipped the same way. Every per-Component `HelmRelease` the kubernetes
# adapter renders for a deployed App still sources it from `GitRepository/infra`
# by path: the adapter hardcodes `sourceRef.kind: GitRepository`
# (apps/spindrift/src/adapters/deploy/kubernetes/flux-helmrelease.ts) and the
# manifest's delivery `sourceRef` schema carries no `kind` to say otherwise
# (apps/spindrift/src/config/manifest.schema.ts, `kubernetesDeliverySchema`).
# Reversing that is a second Flux source per Kubernetes Target, a schema and
# adapter change, and — because the stored manifest always wins over this
# declaration — a live `configureInstallation` on top, not a file edit here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spindrift
  namespace: spindrift
  labels:
    # clusters/offsite/apps/kustomization.yaml patches `chart.spec.interval`
    # onto every HelmRelease that is *not* labeled this way — that field only
    # exists on a GitRepository/HelmRepository-sourced chart, and a chartRef
    # release like this one has no `chart.spec` for the patch to land on.
    source.toolkit.fluxcd.io/kind: OCIRepository
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: spindrift
  values:
    # Renovate pins the digest on this line and Flux rolls it out. The image's
    # manifest schema and the chart must agree on which keys a declaration may
    # carry — the manifest below has to satisfy both.
    image: ghcr.io/jonpulsifer/spindrift:latest@sha256:f0aa32ee99ee480fdc607e81ba0f5708ba41e304c88d0babce9ae1d007091e63
    # Substituted by the apps Kustomization from the cluster-secrets Secret, so
    # the zone is read rather than restated. external-dns publishes the record
    # from the HTTPRoute and cert-manager issues the certificate, so this line
    # is the whole of what makes the UI reachable with TLS.
    hostname: spindrift.${SECRET_DOMAIN}
    # The Secret carries only the one-time enrolment token and optional
    # integration credentials.
    envFromSecret: spindrift-env
    # The whole of the federation. These two values render the pod's
    # `external_account` credential and the process reads its federation out of
    # that file, so this is the only place the facts are stated.
    #
    # The pool principal holds `roles/iam.workloadIdentityUser` and
    # `roles/iam.serviceAccountTokenCreator` on this one service account and
    # nothing else; every project role, the source bucket, and the signer hang
    # off the account. Impersonating it is the only thing the federated identity
    # can do, so the url is not optional here.
    # Declared in terraform/gcp/projects/bluenose/iam.tf.
    serviceAccount:
      token:
        gcpAudience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/offsite
        gcpImpersonationUrl: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/spindrift-controller@bluenose.iam.gserviceaccount.com:generateAccessToken
        # The trust store the runtime reads, carried by this release rather than
        # named: the chart renders the ConfigMap from this text and digests the
        # same text onto both pod templates, so correcting the bundle rolls the
        # processes that read it. `NODE_EXTRA_CA_CERTS` is read once, at process
        # start, and a bundle that changes only on disk is a correction the
        # running process never sees.
        #
        # **This cluster's own anchor, first**, copied from
        # `terraform/pki/certs/offsite-ca.pem`. offsite runs the repo-managed
        # cluster CA and every leaf it serves is issued from it, so one anchor is
        # enough and every certificate here is read from git.
        #
        # **folly's chain, all three of it.** `folly.lolwtf.ca:6443` serves a
        # leaf issued by the FML K8s folly CA and sends no intermediates, and the
        # runtime does not do partial-chain verification — an issuing CA in the
        # store is not a trust anchor unless the path terminates at a self-signed
        # root. Measured, not assumed: the issuing CA alone answers `unable to
        # get issuer certificate`, and so does the intermediate beside it; only
        # all three reach HTTP 200.
        #
        # Spindrift reaches every Target over plain `fetch` with no
        # per-connection trust material, so a Target's API server is verified
        # against the process trust store and nothing else. The runtime reads
        # exactly one extra-CA file and a projected volume cannot merge two
        # ConfigMaps onto one path, so every CA this installation reaches is in
        # this single value.
        caBundle: |
