---
# Spindrift is a **platform workload, never one of its own Apps** (§19). The
# bootstrap circularity — a deploy layer that would otherwise have to deploy
# itself — resolves by classification, not machinery: Flux owns this namespace
# exactly as it owns Atlantis's and hub's.
#
# The chart is sourced from GitRepository/infra rather than OCI, which is the
# plan's stated deferral. It costs the per-Target chart pinning §7 wants and
# leaves the extraction path unexercised; reversing it is one workflow plus a
# source swap, and it must happen before extraction is claimed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spindrift
  namespace: spindrift
spec:
  interval: 1h
  chart:
    spec:
      chart: packages/charts/spindrift
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  values:
    # Renovate pins the digest on this line. Flux picks up the change
    # and rolls out the new image automatically.
    image: ghcr.io/jonpulsifer/spindrift:latest@sha256:dbfef6172404d4a3b54415f032451c7a5e43be952f43f17a526142db5940e156
    # Substituted by the apps Kustomization from the cluster-secrets Secret, so
    # the zone is read rather than restated. external-dns publishes the record
    # from the HTTPRoute and cert-manager issues the certificate, so this line
    # is the whole of what makes the UI reachable with TLS.
    hostname: spindrift.${SECRET_DOMAIN}
    # Non-secret first-boot configuration. Core stores the validated document
    # in Postgres; the database row is authoritative after bootstrap.
    installationManifest:
      installation: offsite
      dns:
        apexZone: lolwtf.dev
        vanityZone: lolwtf.dev
      cloud:
        artifactsProject: trusted-builds
        homeVesselProject: homelab-ng
        federation: null
      charts:
        app: packages/charts/spindrift-app
        installer: packages/charts/spindrift
      supplyChain:
        registry: ghcr.io/jonpulsifer
        verifier: ghcr.io/jonpulsifer/spindrift-verifier
        signer: gcpkms://projects/trusted-builds/locations/us-central1/keyRings/keys/cryptoKeys/signer
      github:
        appId: "334190"
        apiBaseUrl: https://api.github.com
        buildWorkflow: null
      build:
        routes: []
        zeroConfigFrontend: ghcr.io/railwayapp/railpack:railpack-frontend
      secretStore:
        adapter: onepassword
        endpoint: http://onepassword-connect.external-secrets.svc.cluster.local:8080
        container: homelab
      targets:
        - name: offsite
          adapter: kubernetes
      controlPlane:
        hostname: spindrift.lolwtf.ca
      auth:
        gateway: null
    # The Secret carries only the one-time enrolment token and optional
    # integration credentials.
    envFromSecret: spindrift-env
    serviceAccount:
      token:
        gcpAudience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/offsite
    ingress:
      enabled: true
    # §19's own database, including the installation manifest singleton.
    database:
      enabled: true
      size: 2Gi
      # No runner exists: src/db/migrate.ts is a library by design, because
      # "migrations are applied as an out-of-band operator act". The schema
      # arrives that way, not from a Job that would exit 0 having done nothing.
      migration:
        enabled: false
    # The second process stays disabled while this installation has no migration
    # runner to order schema readiness before the web and reconciler Deployments.
    reconciler:
      enabled: true
    web:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 768Mi
          cpu: 1000m
