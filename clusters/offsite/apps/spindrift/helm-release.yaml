---
# Spindrift is a **platform workload, never one of its own Apps** (§19). The
# bootstrap circularity — a deploy layer that would otherwise have to deploy
# itself — resolves by classification, not machinery: Flux owns this namespace
# exactly as it owns Atlantis's and hub's.
#
# The chart is sourced from GitRepository/infra rather than OCI, which is the
# plan's stated deferral. It costs the per-Target chart pinning §7 wants and
# leaves the extraction path unexercised; reversing it is one workflow plus a
# source swap, and it must happen before extraction is claimed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spindrift
  namespace: spindrift
spec:
  interval: 1h
  chart:
    spec:
      chart: packages/charts/spindrift
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  values:
    # Renovate pins the digest on this line. Flux picks up the change
    # and rolls out the new image automatically.
    image: ghcr.io/jonpulsifer/spindrift:latest@sha256:4c3c7c31a96e8c18d446e49674c7a7e68f49a9216e00807a825801418dbc2e04
    # Substituted by the apps Kustomization from the cluster-secrets Secret, so
    # the zone is read rather than restated. external-dns publishes the record
    # from the HTTPRoute and cert-manager issues the certificate, so this line
    # is the whole of what makes the UI reachable with TLS.
    hostname: spindrift.${SECRET_DOMAIN}
    # Non-secret declared configuration. Core validates and reconciles it into
    # durable Postgres state whenever a process starts.
    installationManifest:
      installation: offsite
      dns:
        apexZone: lolwtf.dev
        vanityZone: lolwtf.dev
      cloud:
        artifactsProject: trusted-builds
        homeVesselProject: bluenose
        federation:
          audience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/offsite
          tokenUrl: https://sts.googleapis.com/v1/token
          tokenPath: /var/run/secrets/spindrift/gcp-token
          impersonationUrl: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/spindrift-controller@bluenose.iam.gserviceaccount.com:generateAccessToken
      charts:
        app: packages/charts/spindrift-app
        installer: packages/charts/spindrift
      supplyChain:
        registry: ghcr.io/jonpulsifer
        verifier: ghcr.io/jonpulsifer/spindrift-verifier
        signer: gcpkms://projects/trusted-builds/locations/us-central1/keyRings/keys/cryptoKeys/signer
      github:
        appId: "334190"
        apiBaseUrl: https://api.github.com
        buildWorkflow: jonpulsifer/infra/.github/workflows/spindrift-build.yml@0a7d0ea0ca5c9963eea1104c5802a8af2901d4b6
      build:
        routes:
          - name: hosted
            adapter: github-actions
        zeroConfigFrontend: ghcr.io/railwayapp/railpack:railpack-frontend
      secretStore:
        adapter: onepassword
        endpoint: http://onepassword-connect.external-secrets.svc.cluster.local:8080
        container: homelab
      targets:
        - name: offsite
          adapter: kubernetes
          connection:
            apiServer: https://kubernetes.default.svc
            namespace: spindrift-apps
            delivery:
              flavour: flux-helmrelease
              namespace: spindrift-apps
              sourceRef:
                name: infra
                namespace: flux-system
            chartContract: "2"
        - name: bluenose-cloudrun
          adapter: cloudrun
          connection:
            project: bluenose
            region: northamerica-northeast1
            endpoint: https://run.googleapis.com
        - name: bluenose-static
          adapter: static
          connection:
            project: bluenose
            endpoint: https://firebasehosting.googleapis.com
      controlPlane:
        hostname: spindrift.lolwtf.ca
      auth:
        gateway: null
    # The Secret carries only the one-time enrolment token and optional
    # integration credentials.
    envFromSecret: spindrift-env
    serviceAccount:
      token:
        gcpAudience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/offsite
    ingress:
      enabled: true
    # §19's own database, including the installation manifest singleton.
    database:
      enabled: true
      size: 2Gi
      migration:
        enabled: true
        # Run the committed Drizzle migrations as a separate, run-once Job.
        # The image contains the migration library and Bun's native SQL client;
        # keeping this out of the web/reconciler entrypoints preserves the
        # GitOps ownership boundary while allowing Flux to apply schema drift.
        command: >-
          bun -e 'import { createClient } from "./src/db/client.ts";
          import { applyMigrations } from "./src/db/migrate.ts";
          const client = createClient();
          await applyMigrations(client);
          await client.close();'
    # The reconciler runs alongside the web process; the migration Job is
    # independent and retries until the schema is current.
    reconciler:
      enabled: true
    web:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 768Mi
          cpu: 1000m
