---
# Spindrift is a **platform workload, never one of its own Apps**: Flux owns
# this namespace exactly as it owns Atlantis's and hub's, which is what resolves
# a deploy layer that would otherwise have to deploy itself.
#
# Both charts are independently pinned, extractable OCI artifacts rather than
# repository-local paths. `.github/workflows/spindrift-charts.yml` packages and
# pushes each on every merge that touches it; `oci-repository.yaml` beside this
# file is the installer's consumer, and
# `clusters/base/platform/spindrift-target/oci-repository.yaml` is the App
# chart's, one per Target cluster. The deploy adapter renders each Component's
# `HelmRelease` with a `chartRef` at the Target's own copy.
#
# **This document seeds; the stored row governs.** Editing `manifest:` below
# does nothing to an installation that already has a row — `charts.app` and the
# Targets' `sourceRef` move together through `configureInstallation` with the
# whole document, and `manifestDivergence` on `getInstallationManifest` is what
# says whether they landed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spindrift
  namespace: spindrift
  labels:
    # clusters/offsite/apps/kustomization.yaml patches `chart.spec.interval`
    # onto every HelmRelease that is *not* labeled this way — that field only
    # exists on a GitRepository/HelmRepository-sourced chart, and a chartRef
    # release like this one has no `chart.spec` for the patch to land on.
    source.toolkit.fluxcd.io/kind: OCIRepository
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: spindrift
  values:
    # Renovate pins the digest on this line and Flux rolls it out. The image's
    # manifest schema and the chart must agree on which keys a declaration may
    # carry — the manifest below has to satisfy both.
    image: ghcr.io/jonpulsifer/spindrift:latest@sha256:707fa4f6b99ab1725b9637eaac8db06c223d263b8edba8ed2c8424bf0491f153
    # Substituted by the apps Kustomization from the cluster-secrets Secret, so
    # the zone is read rather than restated. external-dns publishes the record
    # from the HTTPRoute and cert-manager issues the certificate, so this line
    # is the whole of what makes the UI reachable with TLS.
    hostname: spindrift.${SECRET_DOMAIN}
    # The Secret carries only the one-time enrolment token and optional
    # integration credentials.
    envFromSecret: spindrift-env
    # The whole of the federation. These two values render the pod's
    # `external_account` credential and the process reads its federation out of
    # that file, so this is the only place the facts are stated.
    #
    # The pool principal holds `roles/iam.workloadIdentityUser` and
    # `roles/iam.serviceAccountTokenCreator` on this one service account and
    # nothing else; every project role, the source bucket, and the signer hang
    # off the account. Impersonating it is the only thing the federated identity
    # can do, so the url is not optional here.
    # Declared in terraform/gcp/projects/bluenose/iam.tf.
    serviceAccount:
      token:
        gcpAudience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/offsite
        gcpImpersonationUrl: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/spindrift-controller@bluenose.iam.gserviceaccount.com:generateAccessToken
        # This installation holds a Target on folly, which is reached across the
        # network rather than in-cluster, so the trust store needs folly's chain
        # as well as this cluster's own root. `kube-root-ca.crt` carries only the
        # latter. See ca-bundle.yaml.
        caConfigMap: spindrift-ca-bundle
    ingress:
      enabled: true
    # The control plane's own database, including the installation manifest
    # singleton. Both processes wait for the image's committed migration journal
    # before becoming Ready.
    database:
      enabled: true
      size: 2Gi
      migration:
        enabled: true
    reconciler:
      enabled: true
    web:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 768Mi
          cpu: 1000m
    # The installation manifest. **A declaration seeds; it does not govern.**
    # The durable row wins whenever one exists, so editing this document does
    # nothing to an installation that already has one — the process says so at
    # startup rather than skipping it quietly. Configuration is driven through
    # the UI; re-seeding from here means discarding the row first.
    #
    # What this document is for is bringing a torn-down installation back
    # configured without anyone opening a browser.
    #
    # The two zones this repository already names are substituted by the apps
    # Kustomization — `SPINDRIFT_DOMAIN` from cluster-settings, `SECRET_DOMAIN`
    # from cluster-secrets — so each is read rather than restated, the same way
    # `hostname` above reads it. The other two are spelled out because no
    # cluster variable names them.
    manifest:
      # What this installation is, and the two vessels it is built on. Both
      # pointers name a vessel declared below: `offsite` is where this control
      # plane runs — and an ordinary deploy Target besides — and `bluenose`
      # holds the shared services every Target reads through.
      installation:
        name: offsite
        controlPlaneVessel: offsite
        homeVessel: bluenose
      controlPlane:
        hostname: spindrift.${SECRET_DOMAIN}
      dns:
        # The zones this installation mints App names in. Order is the default:
        # an App that pins none takes the first entry that serves its reach.
        #
        # The two that serve both reaches are the two an App can flip between
        # private and public without being renamed — a record re-point, which is
        # what §9 asks for. The other two answer only on the internet, so an App
        # pinned to one is a public App by construction and the manifest is
        # where that is said rather than in a policy somewhere else.
        #
        # A zone here is a promise the edge has to keep. Each of the first three
        # is a listener with a wildcard certificate on the Apps gateway
        # (`gateway.yaml`, and folly's own in
        # `clusters/folly/apps/spindrift-target/`), a `domainFilters` entry on
        # external-dns, and — for a `reach: public` name — an ingress rule on
        # the tunnel in `terraform/network/cloudflare/spindrift.tf`. Adding a
        # fifth zone is those three edits plus this list.
        zones:
          # The zone dedicated to generated names, disjoint from the
          # hand-managed flat space below it. First, so it is what an App gets
          # by not choosing.
          - name: ${SPINDRIFT_DOMAIN}
            reaches: [private, public]
          # The hand-managed zone, minted into on purpose. A canonical name is
          # hyphen-joined (`<app>-<component>`) and so does not collide with the
          # flat names declared in `terraform/network/cloudflare/lolwtf.ca.tf`,
          # but a **vanity label** is a bare label in this zone and can: one
          # named `wiki` or `tf` would publish a record against a name Terraform
          # owns. Nothing here checks that — the zones are the installation's to
          # choose and Spindrift cannot read the hand-managed half — so an App
          # pinned here takes its vanity label from the same namespace the wiki
          # and Atlantis take theirs from.
          - name: ${SECRET_DOMAIN}
            reaches: [private, public]
          # Public only, and served off this cluster's edge by nothing: an App
          # pinned here goes on the `vercel` Target or a Cloudflare Pages one,
          # both of which name their own workload and take the vanity label as a
          # domain on the project. That is why neither has a listener on the
          # Apps gateway — there is no in-cluster origin for the name to reach.
          - name: embarrassing.ca
            reaches: [public]
          # Public only, and reachable both ways: the Apps gateway carries a
          # listener for it and the tunnel forwards it, so an App here can be a
          # cluster workload, and the `vercel` Target serves it as readily. The
          # apex is Vercel's already (`terraform/network/cloudflare/wishin.app.tf`)
          # and stays hand-managed — every name minted here is a label under it.
          - name: wishin.app
            reaches: [public]
      auth:
        gateway: null
      build:
        # Rank order. `hosted` stays first, so an App that states no preference
        # builds where every App already built; `managed` is what an App asks
        # for by name (`setAppBuildRoute`) and what a Target requiring L3 gets
        # on rank alone.
        routes:
          - name: hosted
            adapter: github-actions
            # The public half of the sealing keypair. A stored registry
            # credential travels to this route only inside an envelope sealed
            # to this key; the private half lives in one place, the
            # SPINDRIFT_BUILD_SEAL_KEY repository Actions secret, and rotating
            # the pair is exactly those two edits.
            sealPublicKey: |
              -----BEGIN PUBLIC KEY-----
              MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAqJhA+am3NJ4pDPNi/EDi
              TD3UjZoP736+Nn3/RluZhdazx+UoUftS0FCXDBBI9WIG0ZzSGPYwpYXgoiZ45x+T
              IwOrqvl+MXpU436eLPZH8vGuC9I1lRhLpepkoDkXaXixf5+CBAGHKTe/7WjlcMuS
              +5Wkqhr20qYm8Xt2Znq9hNZHV+3x32rZGG4SEG9QdRJXt39+SI2gARpTwSdRdcpd
              H7ScPha8cmxUiEM4S2GtVByIrwGXfxWHxb80OZrU4Kvea/GFSlWk9nKQUrmFqnj0
              Lx4nh617h7SClmYeagkGyiQ8SL6C3hM3sGpnkaXXA4DQ/+W6QADLSAuLJKaI0xv9
              tsDFqkNz60VQf9+SNkF446ekKqFztdsOM879nyAOIv4SfpQI3ZdvK3daFep/z4K9
              2BUBzdb5F/f9TgTpW+PSQA2fX4vzt73WeeikVRxKx6zpnZKgFzjVMIhmu3Y47btD
              xrPbOokNfv3N7OIhNuC7oz0tX1Lq0andlplZlcTm8pv/3bkT2QmmxtEPDRJ+Xn8h
              fi04rbJRFt4x8GqPwCJSswH+eKOLw7c5Jtjl1vRoIKsxs5hICcFTZEIXnyycHxtA
              Ve9Xp3LMmVgqq70mHzGCVMfJXfZgm8HBqJ5U9K5Xzjp0EHNdsE/tFjlBA/x+4KSh
              ey2JEg4EriDjMik2MaTQqHcCAwEAAQ==
              -----END PUBLIC KEY-----
          # The cloud builder, in the shared artifacts project beside the
          # registry. Spindrift is the proxy on the way in: it stages the git
          # revision (or the uploaded archive) into the source bucket and hands
          # the build a signed URL for that one object, so nothing here is
          # connected to a repository and the bundle every route builds is the
          # same bundle the source receipt describes.
          #
          # Every grant this needs is already declared in
          # terraform/gcp/projects/trusted-builds — `cloudbuild.builds.editor`
          # and `logging.viewer` for the controller, `artifactregistry.writer`
          # and the two attestation permissions for the build worker.
          - name: managed
            adapter: cloud-build
            endpoint: https://cloudbuild.googleapis.com
            logsEndpoint: https://logging.googleapis.com
            project: trusted-builds
            # Where the signer is, so the attestation step is not a
            # cross-region call: terraform/gcp/projects/trusted-builds sets
            # `local.region` to this and the KMS key takes it.
            region: northamerica-northeast1
            # The stock BuildKit image, which is what `buildkit.ts` declares its
            # program needs — a POSIX sh, wget, tar, sed, base64, chmod, mktemp
            # and `buildctl-daemonless.sh`. Pinned by digest: the image is the
            # engine every build on this route runs, and a moving tag is an
            # engine that changes underneath a reproducible build.
            image: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          # The outage fallback: a bosun host long-polls the outbox over a
          # path-scoped tunnel hostname that exposes /internal/bosun/ and
          # nothing else (terraform/network/cloudflare/spindrift.tf),
          # claims the request, and builds it on a microVM skiff. Ranked
          # last — hosted and managed win whenever they are reachable; this
          # is the route that still works when the Actions plane is down.
          # The builder id must match the constant the build-hull stamps
          # into its provenance statement (nix/images/hull-ubuntu.nix,
          # buildRun) — a mismatch fails closed at verification. No host
          # declares this class: it wants a 20 G workspace and the two the
          # fleet serves carry 6 G and 4 G. The route stays declared because
          # it is ranked last and costs nothing until something reaches it —
          # a build that falls through times out at the build budget rather
          # than hanging forever — and a host that declares the class serves
          # it with no change here.
          - name: pool
            adapter: bosun
            class: skiff-build-xl
            provenanceBuilderId: https://bosun.lolwtf.ca/skiff
        # Railpack publishes the frontend as its own repository. Pinned to a
        # version rather than a moving tag: it is the only input to a
        # zero-config build that no digest covers.
        zeroConfigFrontend: ghcr.io/railwayapp/railpack-frontend:v0.35.0
      # No `cloud` block. Federation is not a manifest key: it is read from the
      # `external_account` credential the chart renders from the two
      # serviceAccount.token values above. The two keys that used to sit beside
      # it — the artifacts project and the home vessel's own project — are
      # properties of `bluenose` below, where nothing can disagree with them.
      charts:
        # The App chart as an artifact, which is what makes every Target's
        # release independent of a checkout of this repository. The reference
        # is also the discriminant: an `oci://` value is what makes the deploy
        # adapter render `chartRef` at each Target's own `OCIRepository`
        # (`clusters/base/platform/spindrift-target/oci-repository.yaml`)
        # instead of a `GitRepository` path, so the two Targets' `sourceRef`
        # below name that object. Flipping this back to a path flips both.
        app: oci://ghcr.io/jonpulsifer/charts/spindrift-app
      github:
        # The web origin the manifest-flow form POSTs to, the
        # `…/installations/new` links target, and clone URLs are composed
        # from. The App's identity itself — id, slug, client id, signing key —
        # is not declared anywhere: it lives sealed in the `github_app` row,
        # written once by the manifest-flow conversion on the Repositories
        # screen.
        webBaseUrl: https://github.com
        apiBaseUrl: https://api.github.com
        # The adopted App's public slug (App ID 4576122), composing the
        # install link. The identity's private half arrives through the
        # installation Secret — SPINDRIFT_GITHUB_APP_ID and
        # SPINDRIFT_GITHUB_APP_PRIVATE_KEY — never this document.
        appSlug: spindrift-bot
        # The App is public so it also installs on `homelab-ng`, which means
        # strangers can install it too. These are the installation accounts
        # the Repositories screen renders as connectable and
        # `installationFor` will operate for; every other installation is
        # filtered, not merely left unclicked.
        accounts:
          - jonpulsifer
          - homelab-ng
        # Where GitHub delivers the App-level webhook: the path-scoped tunnel
        # hostname (terraform/network/cloudflare/spindrift.tf exposes exactly
        # `^/internal/github/webhook$` on it), never this installation's own
        # `spindrift.${SECRET_DOMAIN}` — that is a LAN record GitHub's
        # delivery servers cannot reach.
        webhookUrl: https://spindrift-control.lolwtf.dev/internal/github/webhook
        # The two Device Flow keys. The image that reads them is the one this
        # release's pinned digest still names; the App-auth image accepts and
        # drops them, so they hold no behaviour there and leave with the next
        # edit after that digest lands.
        clientId: Iv1.918d699f36ee7afc
        oauthBaseUrl: https://github.com
        # `@main` on purpose: every caller written into a configuration PR
        # copies this ref, and a branch keeps them all current — this
        # repository's merge gate is the version gate. Pinning a sha here
        # freezes every repo's builds at that commit with no re-pin path.
        buildWorkflow: jonpulsifer/infra/.github/workflows/spindrift-build.yml@main
        # Where every boundary below is declared. An unmet prerequisite
        # renders the Terraform that clears it, and this is the repository the
        # pull request adding that stanza is opened against.
        #
        # Governed rather than seeded, which is the exception in this block:
        # everywhere else the stored row wins over a declaration, and this
        # installation has had one since long before this key existed. It
        # travels with the vessel entries because `terraformRoot` below is a
        # path *inside* this repository — governing the path and not the
        # repository would be two halves of one address that can disagree.
        infrastructureRepository: jonpulsifer/infra
      sources:
        # Which of these staging picks is `shared.sourceBucket` on the home
        # vessel: the bucket lives in that project, so stating it anywhere else
        # is a default that can name a bucket in a project this document does
        # not otherwise mention.
        buckets:
          - bluenose-spindrift-source
      # The tenancy boundaries this installation deploys into. Where a boundary
      # is, and what it can reach, are facts about the boundary and are stated
      # here once — a Target below states only what is true of its own runtime
      # surface and names the vessel it sits on.
      vessels:
        - name: offsite
          kind: cluster
          location:
            apiServer: https://kubernetes.default.svc
          # GHCR and not the artifact registry: these packages are public, so
          # the kubelet pulls them with no credential at all. Reaching the
          # artifact registry would mean an imagePullSecret in every App
          # namespace, which is a stored credential §13 does not have.
          #
          # The host rather than the `ghcr.io/jonpulsifer` namespace, because
          # the kubelet's anonymous pull is a property of the registry and not
          # of one owner's packages. `artifactAddress` accepts either.
          reachableRegistries:
            - ghcr.io
        # The on-site cluster, reached across the peer OIDC trust rather than
        # in-cluster: `nix/services/k8s` admits this installation's service
        # account as `federated:system:serviceaccount:spindrift:spindrift`, and
        # `clusters/folly/apps/spindrift-target` binds it the discovery,
        # delivery, and chart-source roles. Nothing here is a credential — the
        # projected token is minted per request for the `api` audience.
        - name: folly
          kind: cluster
          location:
            apiServer: https://folly.lolwtf.ca:6443
          # Public packages, so the kubelet pulls them with no credential — the
          # same reason offsite names GHCR rather than the artifact registry.
          reachableRegistries:
            - ghcr.io/jonpulsifer
        # One project, two runtime surfaces. That it is one boundary is what
        # this entry says; before it existed the two Targets said it by sharing
        # a name prefix and restating the project id.
        - name: bluenose
          kind: gcp-project
          location:
            project: bluenose
            # The consumer side of a cloud Datastore's reachability: the
            # vessel network the PSC service connection policies draw
            # endpoints from, and the region they are in. Hand-carried from
            # `tofu output vessel_network_block` in the root below, the same
            # route supplyChain travels from trusted-builds. Absent would
            # also be valid — it would say this vessel cannot host a
            # Datastore.
            network:
              name: spindrift-vessel
              region: northamerica-northeast1
          # The root that declares this project. It is what gives a generated
          # remediation somewhere to land: the stanza names
          # `<root>/services.tf` or `<root>/iam.tf` rather than a directory
          # nothing here has agreed to.
          terraformRoot: terraform/gcp/projects/bluenose
          # The shared services, on the boundary that holds them.
          # `installation.homeVessel` names this vessel, so this block is
          # required here and refused on every other.
          #
          # `secretStoreContainer` is this project: `bluenose` holds the secrets
          # for every Target, including the two clusters — the store of record
          # is one place, and where it lives is a property of the store, not of
          # who reads it. `artifactsProject` is deliberately *not* this project:
          # artifacts and signing material live in `trusted-builds` beside the
          # registry, and collapsing the two would be the one place this vessel
          # is asked to be somewhere it is not.
          shared:
            sourceBucket: bluenose-spindrift-source
            artifactsProject: trusted-builds
            secretStoreContainer: bluenose
          # The artifact registry and nothing else. Cloud Run pulls through a
          # cache mirror that cannot parse the OCI index pushed to GHCR, so
          # naming the registry it *can* read is what keeps a Deploy here from
          # pinning a reference it will fail on. `serverless-robot-prod` holds
          # `artifactregistry.reader` on it — see
          # terraform/gcp/projects/trusted-builds/artifact-registry.tf.
          #
          # The host, which names this installation's one artifact registry
          # namespace unambiguously. `artifactAddress` takes the fuller
          # `…/trusted-builds/i` spelling too, and would need it if a second
          # namespace on this host were ever added to `supplyChain.registry`.
          reachableRegistries:
            - northamerica-northeast1-docker.pkg.dev
        # The edge platform's team, and the one boundary here reached with a
        # stored bearer rather than with federation: Vercel federates outward
        # only, so there is nothing to exchange the projected token for. The
        # bearer is `SPINDRIFT_VERCEL_TOKEN` in `secret.sops.yaml` — one
        # installation-wide value, not a per-Target credential.
        #
        # No `terraformRoot`: no root here declares this boundary, and naming
        # one would offer a remediation Atlantis has nowhere to apply.
        #
        # No `reachableRegistries` either, and that is the surface's shape
        # rather than an omission: nothing on the far side pulls an image. The
        # adapter reads the `files` artifact itself, with the same federated
        # token every cloud Target uses, and uploads the bytes.
        - name: jonpulsifer
          kind: vercel-team
          location:
            team: jonpulsifer
        # The other edge platform, and the same bearer posture one vendor over:
        # Cloudflare has no inbound OIDC either, so this boundary is reached
        # with `SPINDRIFT_CLOUDFLARE_TOKEN` from `secret.sops.yaml`.
        #
        # **That token is scoped to Pages and nothing else.** It is not the
        # `cloudflare-api-token` the network root drives DNS with: core reaches
        # no zone with a Target credential, and
        # `apps/spindrift/test/extraction/no-dns-credential.test.ts` is what
        # keeps that true of the code. Handing this the DNS-capable one would
        # leave that test passing and the posture gone.
        #
        # The account is the one every zone in `terraform/network/cloudflare/`
        # already sits under (`account.tf`'s `fml_account_id`) — an id rather
        # than a name because the API path is `/accounts/<id>/pages/projects`.
        #
        # No `terraformRoot`, no `reachableRegistries`: the same two absences
        # the Vercel boundary above documents, for the same two reasons.
        - name: fml
          kind: cloudflare-account
          location:
            account: d7f641bb9f4b9de593f721ad06989dbe
      targets:
        - vessel: offsite
          # Every reach: this cluster has a load-balancer address on the lab net
          # and a Cloudflare tunnel in front of it.
          reaches: [none, private, public]
          # Its authenticated edge answers for `private` and not for `public`.
          # oauth2-proxy here admits one GitHub user (`github-user: jonpulsifer`),
          # which is honest in front of an address only this network reaches and
          # a lie in front of one anybody can. Widening it is a `github-org`
          # swap plus this list — no Spindrift change.
          authReaches: [private]
          adapter: kubernetes
          connection:
            delivery:
              flavour: flux-helmrelease
              namespace: spindrift-apps
              # The App chart's `OCIRepository`, in this Target's own delivery
              # namespace — `clusters/base/platform/spindrift-target` puts one
              # in every Target cluster. Which kind this names follows from
              # `charts.app` above and is never restated here.
              sourceRef:
                name: spindrift-app
                namespace: spindrift-apps
            # Where releases placed before per-App namespaces still live, and
            # the namespace whose Pod Security labels every App namespace is
            # stamped from. No new release lands here.
            namespace: spindrift-apps
            # One namespace per App, created with its first release carrying
            # the labels above. §20's pattern, so a second operator can name
            # them their own way.
            appNamespace: app-{app}
            # Datastores outlive the Apps attached to them, so they are not in
            # any App's namespace. Declared in
            # `clusters/base/platform/spindrift-target/namespace.yaml`.
            datastoreNamespace: spindrift-datastores
            # §7's operator class: what the App chart needs about *this*
            # cluster. Spindrift never renders into it.
            chartValues:
              platform:
                # The Apps' own gateway (`gateway.yaml`), not the cluster's
                # shared one: the tunnel forwards this zone to it and it carries
                # the wildcard listener every minted name is served on.
                gateway:
                  name: spindrift-apps
                  namespace: spindrift-apps
                # The shim beside oauth2-proxy, not oauth2-proxy's own port 80.
                # It composes the absolute origin the browser is returned to
                # after sign-in, which nothing on the check path otherwise
                # carries; `clusters/base/apps/oauth2-proxy/helm-release.yaml`
                # holds the mechanism.
                externalAuth:
                  name: oauth2-proxy-authz
                  namespace: oauth2-proxy
                  port: 4181
                # The chart requires this whenever a Component has config: the
                # ExternalSecret names the store, and an unset name renders an
                # object that never syncs behind a workload that waits forever.
                #
                # This cluster's access path to the store of record
                # `secretStore` below names, declared in
                # `clusters/base/platform/gcp-secret-manager`. It has to be the
                # same store: core writes the item, this object fetches it, and
                # a name pointing at a different vault renders an ExternalSecret
                # that syncs nothing.
                secretStore:
                  kind: ClusterSecretStore
                  name: gcp-secret-manager
                # How an attached Datastore's credential crosses out of
                # `spindrift-datastores` into the App's own namespace, which a
                # `secretKeyRef` cannot do. A different store from the one
                # above and scoped to that one namespace; declared in
                # `clusters/base/platform/spindrift-datastore-store`.
                datastoreSecretStore:
                  kind: ClusterSecretStore
                  name: spindrift-datastores
                dns:
                  # That gateway's pinned LoadBalancer address. RFC1918, so
                  # publishing it is the private boundary rather than a hole in
                  # one.
                  privateAddress: 10.89.0.69
                  tunnelHostname: 9d53c07a-8bde-4466-9f99-3a69d06a6325.cfargotunnel.com
                networkPolicy:
                  # The chart's ingress is default-deny for every Component, so
                  # a correctly attached route still reaches nothing until the
                  # caller's namespace is named here. The gateway's own
                  # namespace is not in the list because it is `spindrift-apps`
                  # itself, which the chart always admits as a sibling.
                  allowedNamespaces:
                    - oauth2-proxy
        - vessel: folly
          # No tunnel of its own is named to Spindrift, so this Target serves
          # what its gateway's RFC1918 address reaches and nothing beyond it.
          # Adding one is this list plus `dns.tunnelHostname`, either here or on
          # the connect screen, which reads the same fields.
          reaches: [none, private]
          authReaches: [private]
          adapter: kubernetes
          connection:
            delivery:
              flavour: flux-helmrelease
              namespace: spindrift-apps
              # The App chart's `OCIRepository`, in this Target's own delivery
              # namespace — `clusters/base/platform/spindrift-target` puts one
              # in every Target cluster. Which kind this names follows from
              # `charts.app` above and is never restated here.
              sourceRef:
                name: spindrift-app
                namespace: spindrift-apps
            # Where releases placed before per-App namespaces still live, and
            # the namespace whose Pod Security labels every App namespace is
            # stamped from. No new release lands here.
            namespace: spindrift-apps
            # One namespace per App, created with its first release carrying
            # the labels above. §20's pattern, so a second operator can name
            # them their own way.
            appNamespace: app-{app}
            # Datastores outlive the Apps attached to them, so they are not in
            # any App's namespace. Declared in
            # `clusters/base/platform/spindrift-target/namespace.yaml`.
            datastoreNamespace: spindrift-datastores
            chartValues:
              platform:
                # This cluster's own Apps gateway
                # (`clusters/folly/apps/spindrift-target/gateway.yaml`), not
                # `cluster-gateway`: App traffic gets its own listener set here
                # for the same reason it does offsite.
                gateway:
                  name: spindrift-apps
                  namespace: spindrift-apps
                # Answers on `oauth2.${SECRET_DOMAIN}` here rather than in the
                # App zone, so the sign-in redirect leaves this gateway for
                # `cluster-gateway`. That much is one hop rather than a 404: the
                # ExternalAuth filter is a backend reference, granted by the
                # ReferenceGrant in `clusters/base/apps/oauth2-proxy`, and is
                # not affected by which gateway serves the sign-in name.
                #
                # The sign-in itself does not complete on this Target. This
                # cluster's proxy scopes its cookies to `.${SECRET_DOMAIN}`,
                # which is where its callback is, and an App here is minted
                # under `dns.zones` — `.${SPINDRIFT_DOMAIN}`. A browser at the
                # App drops a cookie for a domain that does not cover the host
                # it was served from, and `whitelist-domain` refuses the return
                # trip for the same reason. Closing it needs one host to serve
                # both halves: a second GitHub OAuth App with a callback in the
                # App zone, or the App zone and the callback zone made one.
                externalAuth:
                  name: oauth2-proxy-authz
                  namespace: oauth2-proxy
                  port: 4181
                # This cluster's own access path to the same store of record —
                # `clusters/base/platform/gcp-secret-manager` puts one in every
                # Target cluster, which is what makes a re-placement between the
                # two free: the reference moves and no value has to.
                secretStore:
                  kind: ClusterSecretStore
                  name: gcp-secret-manager
                # How an attached Datastore's credential crosses out of
                # `spindrift-datastores` into the App's own namespace, which a
                # `secretKeyRef` cannot do. A different store from the one
                # above and scoped to that one namespace; declared in
                # `clusters/base/platform/spindrift-datastore-store`.
                datastoreSecretStore:
                  kind: ClusterSecretStore
                  name: spindrift-datastores
                dns:
                  # That gateway's pinned address, free in this cluster's
                  # `LB_RANGE`. The connect screen reads it off the Gateway's
                  # status rather than asking; this line is the same fact for a
                  # torn-down installation that has no screen open.
                  privateAddress: 10.3.0.80
                  tunnelHostname: ""
                networkPolicy:
                  # The gateway's own namespace is absent for the reason it is
                  # absent above: it is `spindrift-apps` itself, which the chart
                  # always admits as a sibling.
                  allowedNamespaces:
                    - oauth2-proxy
        - vessel: bluenose
          adapter: cloudrun
          connection:
            region: northamerica-northeast1
            # Where this project's admission policy is read from. Naming it is
            # also what makes the Service declare `binaryAuthorization.
            # useDefault` — Cloud Run treats admission as a property of the
            # Service, and `run.allowedBinaryAuthorizationPolicies` refuses one
            # that names no policy.
            policyEndpoint: https://binaryauthorization.googleapis.com
            # The identity a revision runs as. Named because omitting it is not
            # a default: Cloud Run substitutes the project's default compute
            # account, which the controller has no `actAs` on, and the apply is
            # refused naming an account nobody chose. `spindrift-runtime` and
            # the controller's `actAs` on it are declared in
            # terraform/gcp/projects/bluenose/iam.tf for exactly this.
            serviceAccount: spindrift-runtime@bluenose.iam.gserviceaccount.com
        - vessel: bluenose
          adapter: static
          # Empty rather than absent: this surface is connected, and the only
          # fact it used to carry was Firebase Hosting's API root, which
          # `static/index.ts` now defaults on its own (`DEFAULT_ENDPOINT`) —
          # one hostname for every project, not an installation fact.
          connection: {}
        # A website placed here is served from the platform's own edge, so this
        # Target serves `public` and no other reach by construction — there is
        # nothing to assert. The build stays where it already runs: what crosses
        # the seam is a finished `files` tree, and the deployment names no
        # framework and no build command, so a rollback re-deploys the digest
        # rather than building it a second time.
        - vessel: jonpulsifer
          adapter: vercel
          # Empty rather than absent, for the same reason the `static` surface
          # above is: `api.vercel.com` is one hostname for every team, and
          # `vercel/index.ts` now applies it without being told.
          connection: {}
        # The second static edge, last on the list and so last in §16's admin
        # rank: a website that names no Target still lands on Vercel, exactly
        # where it landed before this Target existed.
        #
        # `embarrassing.ca` is already declared above as the zone an App pinned
        # to one of these two takes a name in, so this adds a Target and no
        # zone. Empty for the third time here, and the account is the reason it
        # is not empty of everything: `api.cloudflare.com/client/v4` is one
        # hostname for every account and `pages/index.ts` supplies it, while the
        # account itself is a property of the boundary and sits on the vessel.
        #
        # No production branch here, deliberately: a Pages project has one and
        # the adapter reads it back off the project it ensures, so an operator
        # who stated it here could only state it wrong.
        - vessel: fml
          adapter: cloudflare-pages
          connection: {}
      # §10's one store of record, and the only one every Target here reaches.
      #
      # A Cloud Run revision resolves a pinned secret reference out of its own
      # project and cannot be told to resolve it anywhere else, so a fleet with
      # a cloud vessel in it has exactly one candidate for a store every Target
      # shares. The clusters are the side that can hold several access paths, so
      # the clusters are the side that moved: each carries a `gcpsm`
      # ClusterSecretStore in front of this same project
      # (`clusters/base/platform/gcp-secret-manager`), which is what the two
      # Targets above name.
      #
      # Which container holds the items is `shared.secretStoreContainer` on the
      # home vessel, because it is a property of that boundary.
      #
      # No credential here. Core writes over the same federation every cloud
      # Target already goes through (`storeTokenFor` in
      # `apps/spindrift/src/adapters/registry.ts`), so this installation stores
      # no secret-store bearer at all.
      # No endpoint: Secret Manager's API root is one hostname for every
      # project, not an installation fact, so `createSecretStore` in
      # `apps/spindrift/src/adapters/registry.ts` applies its own default.
      secretStore:
        adapter: gcp-secret-manager
      supplyChain:
        # northamerica-northeast1, which is where the key is:
        # `google_kms_crypto_key.signer` takes `local.region`, and
        # terraform/gcp/projects/trusted-builds/versions.tf sets that to
        # northamerica-northeast1. There has never been a key in us-central1.
        signer: gcpkms://projects/trusted-builds/locations/northamerica-northeast1/keyRings/keys/cryptoKeys/signer
        # Both, because two Targets here cannot share one. Every artifact is
        # pushed to each and every Target pins the one it can reach: the cluster
        # pulls GHCR anonymously, and Cloud Run cannot pull GHCR at all — it
        # goes through a cache mirror that could not parse an OCI index carrying
        # provenance, an SBOM and a signature, so the revision failed at the
        # pull with a digest that was not the one deployed. Order is the
        # tie-break: the first is what a Target that declares no
        # `reachableRegistries` gets.
        #
        # `terraform/gcp/projects/trusted-builds` declares every grant on the
        # second one, and its `registry_namespace` output is this exact value.
        registry:
          - ghcr.io/jonpulsifer
          # Docker Hub, added live in Settings with its stored credential; the
          # declaration follows so the two documents agree. Only routes that
          # can carry the credential publish here (§16).
          - docker.io/jonpulsifer
          - northamerica-northeast1-docker.pkg.dev/trusted-builds/i
        verifier: ghcr.io/jonpulsifer/spindrift-verifier
        # The authority bluenose's Binary Authorization policy requires an
        # attestation from — `google_binary_authorization_policy.spindrift`
        # is REQUIRE_ATTESTATION / ENFORCED_BLOCK_AND_AUDIT_LOG, so a Cloud
        # Run deploy of an artifact with no attestation is refused however
        # well the image is signed.
        attestor: projects/trusted-builds/attestors/provenance
