---
# The one file `NODE_EXTRA_CA_CERTS` names.
#
# Spindrift reaches every Target over plain `fetch`, with no per-connection
# trust material, so a Target's API server is verified against the process trust
# store and nothing else. The runtime reads exactly one extra-CA file and a
# projected volume cannot merge two ConfigMaps onto one path, so every CA this
# installation reaches is in this single key.
#
# **This cluster's own anchors, first**, copied from
# `terraform/pki/certs/offsite-ca-bundle.pem`. offsite runs the repo-managed
# cluster CA, and the bundle is the overlap pair the migration stages: the FML
# K8s offsite CA its leaves are reissued from, and the NixOS `easyCerts` CA the
# ones issued before it still chain to. Both are needed until certmgr has
# reissued every leaf; when `offsite-ca-prev.pem` is retired this becomes the
# single `offsite-ca.pem` block.
#
# **folly's chain, all three of it.** `folly.lolwtf.ca:6443` serves a leaf
# issued by the FML K8s folly CA and sends no intermediates, and the runtime
# does not do partial-chain verification — an issuing CA in the store is not a
# trust anchor unless the path terminates at a self-signed root. Measured, not
# assumed: the issuing CA alone answers `unable to get issuer certificate`, and
# so does the intermediate beside it; only all three reach HTTP 200.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spindrift-ca-bundle
  namespace: spindrift
