---
# The one file `NODE_EXTRA_CA_CERTS` names.
#
# Spindrift reaches every Target over plain `fetch`, with no per-connection
# trust material, so a Target's API server is verified against the process trust
# store and nothing else. The runtime reads exactly one extra-CA file and a
# projected volume cannot merge two ConfigMaps onto one path, so every CA this
# installation reaches is in this single key.
#
# Generated by `scripts/pki/post-rotate.sh` from `terraform/pki/certs/` — do not
# hand-edit. A hand-copied certificate follows nothing: it survives every
# rotation unchanged and expires on a date nobody is watching.
#
# **This cluster's own anchor, first**, from `terraform/pki/certs/offsite-ca.pem`.
# offsite runs the repo-managed cluster CA and every leaf it serves is issued
# from it, so one anchor is enough.
#
# **folly's chain, all three of it**, from `terraform/pki/certs/folly-ca-chain.pem`.
# `folly.lolwtf.ca:6443` serves a leaf issued by the FML K8s folly CA and sends
# no intermediates, and the runtime does not do partial-chain verification — an
# issuing CA in the store is not a trust anchor unless the path terminates at a
# self-signed root. Measured, not assumed: the issuing CA alone answers
# `unable to get issuer certificate`, and so does the intermediate beside it;
# only all three reach HTTP 200.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spindrift-ca-bundle
  namespace: spindrift
