---
# Lets kthx's `kthx-control` route send its host's console paths to this
# Service. It admits every HTTPRoute in `kthx`; the kthx chart's render tests
# keep the console off the public route.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kthx-control-console
  namespace: spindrift
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kthx
  to:
    - group: ""
      kind: Service
      name: spindrift
