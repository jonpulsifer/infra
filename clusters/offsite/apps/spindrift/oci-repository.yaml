---
# .github/workflows/spindrift-charts.yml pushes packages/charts/spindrift here
# on each merge that touches it, tagged with its Chart.yaml version.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: spindrift
  namespace: spindrift
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.3.0
  url: oci://ghcr.io/jonpulsifer/charts/spindrift
