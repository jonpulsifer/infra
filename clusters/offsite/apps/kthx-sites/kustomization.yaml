---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kthx-sites
resources:
  - namespace.yaml
  - gcp-credentials.yaml
  - service.yaml
  - deployment.yaml
  - httproute.yaml
  - networkpolicy.yaml
# The generated name carries a hash, so a config change rolls the pod.
configMapGenerator:
  - name: kthx-sites-nginx
    files:
      - nginx.conf
      - proxy.conf
