# The kthx Service in the kthx namespace; its port is `port` in packages/charts/kthx/values.yaml.
proxy_pass http://kthx.kthx.svc:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# The server believes `cf-connecting-ip` from a trusted peer, so both
# headers go through exactly as the visitor's edge set them.
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_request_buffering off;
