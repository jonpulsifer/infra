---
apiVersion: v1
kind: Namespace
metadata:
  name: kthx-sites
  labels:
    kustomize.toolkit.fluxcd.io/prune: enabled
    # Lets this namespace's HTTPRoute attach to the `kthx-apps` Gateway,
    # whose listeners admit routes by this namespace label.
    app.kubernetes.io/part-of: kthx
    # The gcsfuse sidecar needs /dev/fuse, so it runs privileged and shares its
    # mount with nginx through Bidirectional propagation. Only that sidecar needs
    # it; nginx runs as `restricted` would require.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
