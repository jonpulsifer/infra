worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/xml text/plain text/css text/javascript application/javascript application/json image/svg+xml;
  server_tokens off;
  access_log off;

  # A site is the first label of `<name>.kthx.dev`. Anything else, such as a
  # nested name, maps to a directory the bucket never holds, so it answers 404.
  map $host $site {
    default _invalid;
    "~^(?<name>[a-z0-9-]+)\.kthx\.dev$" $name;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Every distinct miss costs a bucket round trip. The key is the visitor the
  # tunnel names, or the peer when the header is absent.
  map $http_cf_connecting_ip $miss_key {
    "" $binary_remote_addr;
    default $http_cf_connecting_ip;
  }
  limit_req_zone $miss_key zone=misses:10m rate=5r/s;
  limit_req_status 429;

  recursive_error_pages on;

  server {
    listen 8080;
    root /sites/bucket/$site;

    # `.kthx` is the ownership marker, never content.
    location ~ /\. {
      error_page 404 /404.html;
      return 404;
    }

    location ^~ /api/ {
      include /etc/nginx/proxy.conf;
    }

    location ^~ /files/ {
      client_max_body_size 100m;
      include /etc/nginx/proxy.conf;
    }

    location = /favicon.ico {
      try_files $uri @kthx;
      add_header cache-control "no-cache" always;
      add_header x-content-type-options nosniff always;
    }

    location @kthx {
      include /etc/nginx/proxy.conf;
    }

    location / {
      try_files $uri $uri/index.html =404;
      error_page 404 /404.html;
      add_header cache-control "no-cache" always;
      add_header x-content-type-options nosniff always;
    }

    # The site's own page, else the built-in one. Only misses reach it, so the
    # limit slows a scanner that walks distinct paths.
    location = /404.html {
      internal;
      log_not_found off;
      limit_req zone=misses burst=10;
      error_page 404 = @builtin404;
      add_header cache-control "no-cache" always;
      add_header x-content-type-options nosniff always;
    }

    location @builtin404 {
      internal;
      default_type text/html;
      add_header cache-control "no-cache" always;
      add_header x-content-type-options nosniff always;
      return 404 "<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>404 | kthx</title><body style='font:16px/1.5 system-ui,sans-serif;max-width:32rem;margin:20vh auto;padding:0 1rem'><h1>404</h1><p>Nothing is published at this address.</p><p><a href='https://kthx.dev'>kthx.dev</a></p>";
    }

    # Ready only while the mount answers. The directory has no index file, so a
    # live mount is 403 and a dead one is 500, which the Service drops.
    location = /healthz {
      root /;
      rewrite ^ /sites/bucket/ break;
      index .none;
      error_page 403 = @healthy;
    }

    location @healthy {
      internal;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
