---
# kthx: one Bun process for `kthx.dev` and every `<name>.kthx.dev`, its release
# volume, and one Postgres with a database per site. Flux owns this namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kthx
  namespace: kthx
spec:
  interval: 1h
  chart:
    spec:
      chart: packages/charts/kthx
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
  values:
    # CD rewrites this digest on each kthx build on main (`.github/containers.json`).
    image: ghcr.io/jonpulsifer/kthx:latest@sha256:3f556d9be9da9f2d78d10d6d68aab7ed80aa334e0bda5483d413f8a6cc90b29e
    zone: kthx.dev
    # Claiming and site control answer on this host only. The tunnel does not
    # serve it: it is reachable from the lab, the offsite LAN and the tailnet.
    control:
      host: kthx.${SECRET_DOMAIN}
      listener: spindrift-apps-tls-secret-domain
    # Output `kthx_bucket` of terraform/gcp/projects/bluenose. kthx has only
    # objectAdmin on it, without `storage.buckets.get`, so nothing may preflight it.
    bucket: bluenose-kthx
    envFromSecret: kthx-env
    # The gateway hop is a host-networked Envoy on a node address. Its LB address
    # is LAN-reachable, so a LAN or tailnet caller can forge `CF-Connecting-IP`.
    trustedProxies: ${K8S_NODE_CIDR},${CILIUM_POD_CIDR}
    # `proxies` is the pod CIDR because the operator's proxy has a pod address;
    # the chart's NetworkPolicy admits only that proxy and this namespace's pods.
    # This host is not on the gateway, so no Cloudflare or LAN request can reach it.
    identity:
      host: kthx.pirate-musical.ts.net
      tag: tag:kthx-ingress
      proxies: ${CILIUM_POD_CIDR}
      # Only these logins, on the tailnet host, may call `DELETE /api/sites`.
      admins: jonathan@pulsifer.ca
    # Both volumes are `local-path` on this node. retrofit already holds the
    # control plane and every other CNPG volume.
    node: oldschool
    # The pool principal holds only workloadIdentityUser on this account, so
    # signed URLs are refused. Declared in terraform/gcp/projects/bluenose/iam.tf.
    gcp:
      audience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/offsite
      impersonationUrl: https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/kthx-server@bluenose.iam.gserviceaccount.com:generateAccessToken
