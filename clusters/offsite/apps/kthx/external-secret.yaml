---
# Each HMAC key is at least 32 bytes. `me-key` signs the visitor cookie and
# `pg-key` derives every site's Postgres password, so they rotate separately.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kthx-env
  namespace: kthx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kthx-env
    creationPolicy: Owner
  data:
    - secretKey: KTHX_ME_KEY
      remoteRef: {key: kthx, property: me-key}
    - secretKey: KTHX_PG_KEY
      remoteRef: {key: kthx, property: pg-key}
    - secretKey: KTHX_AI_KEY
      remoteRef: {key: opencode api key, property: password}
