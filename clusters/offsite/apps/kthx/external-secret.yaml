---
# The two HMAC keys the process refuses to boot without, the upstream key
# `/api/ai` spends, and the operator key that opens the nuke.
#
# Two HMAC keys rather than one because they rotate for different reasons:
# `me-key` signs the visitor cookie, `pg-key` derives every site's Postgres
# password, and turning over cookie signatures must not lock the server out of
# every site database. Nothing generates them here — a chart that minted them
# would rotate both on each upgrade.
#
# `admin-key` is the third field on the same item and it is the whole of the
# nuke's authentication: `DELETE /api/sites` deletes every site on the zone and
# frees every name. Unset, the route answers 404 and the landing page's control
# stays hidden — so removing this mapping is how the nuke is turned off.
#
# 1Password item `kthx` in the `homelab` vault; each field is ≥ 32 bytes. The
# AI key is the item hermes already uses, referenced rather than copied: one
# account, one place to rotate it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kthx-env
  namespace: kthx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kthx-env
    creationPolicy: Owner
  data:
    - secretKey: KTHX_ME_KEY
      remoteRef: {key: kthx, property: me-key}
    - secretKey: KTHX_PG_KEY
      remoteRef: {key: kthx, property: pg-key}
    - secretKey: KTHX_ADMIN_KEY
      remoteRef: {key: kthx, property: admin-key}
    - secretKey: KTHX_AI_KEY
      remoteRef: {key: opencode api key, property: password}
