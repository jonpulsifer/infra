---
# The two HMAC keys the process refuses to boot without.
#
# Two rather than one because they rotate for different reasons: `me-key` signs
# the visitor cookie, `pg-key` derives every site's Postgres password, and
# turning over cookie signatures must not lock the server out of every site
# database. Nothing generates them here — a chart that minted them would rotate
# both on each upgrade.
#
# 1Password item `kthx` in the `homelab` vault; each field is ≥ 32 bytes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kthx-env
  namespace: kthx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kthx-env
    creationPolicy: Owner
  data:
    - secretKey: KTHX_ME_KEY
      remoteRef: {key: kthx, property: me-key}
    - secretKey: KTHX_PG_KEY
      remoteRef: {key: kthx, property: pg-key}
