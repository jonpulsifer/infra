---
# The operator key that opens the nuke, alone in its own Secret.
#
# `DELETE /api/sites` deletes every site on the zone and frees every name, and
# this key is the whole of its authentication. Unset — no Secret, no field, a
# value under 32 bytes — the route answers 404, the landing page's control
# stays hidden, and nothing else in the process changes. Deleting this file is
# how the nuke is turned off.
#
# Separate from `kthx-env` on purpose: an ExternalSecret is all-or-nothing, so
# a missing `admin-key` field would put the *whole* sync in SecretSyncError,
# and `creationPolicy: Owner` would then keep serving the last good data while
# `me-key` and `pg-key` silently stopped refreshing. Here the blast radius of a
# field that is not there yet is an optional Secret that is not there yet.
#
# Field `admin-key` on the 1Password item `kthx` in the `homelab` vault, ≥ 32
# random bytes, created by hand — nothing in git mints it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kthx-admin
  namespace: kthx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kthx-admin
    creationPolicy: Owner
  data:
    - secretKey: KTHX_ADMIN_KEY
      remoteRef: {key: kthx, property: admin-key}
