---
apiVersion: v1
kind: Namespace
metadata:
  name: kthx
  labels:
    kustomize.toolkit.fluxcd.io/prune: enabled
    # Lets this namespace's HTTPRoute attach to the `spindrift-apps` Gateway,
    # whose listeners admit routes by this namespace label.
    app.kubernetes.io/part-of: spindrift
    # A public anonymous-write process that needs no capability, host mount or root.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
