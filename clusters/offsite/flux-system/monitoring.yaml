---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/offsite/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: storage
    # Raw monitoring.coreos.com objects need their CRDs first, or the dry-run
    # refuses the whole Kustomization, the HelmRelease that installs them too.
    - name: monitoring-crds
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
      - kind: Secret
        name: cluster-secrets
