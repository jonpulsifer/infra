---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/offsite/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: storage
    # base/monitoring holds a raw ServiceMonitor. Flux dry-runs every object
    # in a Kustomization before applying any, so without the CRD already on
    # the cluster this one is refused whole — including the
    # kube-prometheus-stack HelmRelease that would supply the CRD.
    - name: monitoring-crds
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
      - kind: Secret
        name: cluster-secrets
