---
# A daily etcd snapshot through the Talos API into offsite's Garage. The
# talos.dev ServiceAccount kind exists only on a Talos control plane, and the
# CronJob names its site's Talos root, so each site has its own directory.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-snapshot
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/offsite/etcd-snapshot
  # Off while this moves into another Kustomization, so the hand-over deletes
  # nothing. The next change removes this file.
  prune: false
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # Creates the backups namespace.
    - name: backups
    # Serves the ClusterSecretStore the ExternalSecret reads.
    - name: onepassword-connect
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
