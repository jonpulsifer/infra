---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./clusters/offsite/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # packages/charts/spindrift renders a CNPG Cluster. helm-controller, not the
    # dry-run, meets a missing CRD, and the install fails past its retries.
    - name: cloudnative-pg
    # The CRDs only: the dry-run needs them, and a down controller refuses no apply.
    - name: agent-sandbox-crds
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
      - kind: Secret
        name: cluster-secrets
