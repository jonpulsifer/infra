---
# The monthly restore drill. It runs in the `backups` namespace as the
# `restic-push` ServiceAccount, which the `backups` Kustomization declares.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restore-drill
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/offsite/apps/restore-drill
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: backups
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
