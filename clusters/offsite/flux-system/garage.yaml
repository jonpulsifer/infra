---
# Offsite's Garage, the primary store of its backups. folly's Garage runs on
# spore under NixOS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/offsite/garage
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # Serves the ClusterSecretStore the ExternalSecret reads.
    - name: onepassword-connect
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: garage
      namespace: garage
