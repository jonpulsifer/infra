---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # 1Password item "oauth2-proxy: offsite".
  OAUTH2_PROXY_ITEM: 46xuydwpk5vbw2gld2pzn5o4pq

  # Garage in this cluster, on oldschool's host network, is the S3 endpoint for
  # backups. Its push to GCS runs nightly.
  GARAGE_S3_ENDPOINT: http://oldschool.lolwtf.ca:3900
  BACKUP_PUSH_SCHEDULE: "0 5 * * *"

  # offsite's nodes run Talos: the kubelet's own root, and the `data` user
  # volume that clusters/offsite/talos/patches.tf mounts on every node.
  KUBELET_ROOT: /var/lib/kubelet
  NODE_DATA_ROOT: /var/mnt/data
