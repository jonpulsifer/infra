---
# The `etcd` key of the 1Password item `garage-<cluster>`, which owns the
# `etcd` bucket and nothing else. Restoring etcd on Talos reads the same key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-snapshot-garage
  labels:
    app.kubernetes.io/name: etcd-snapshot
    app.kubernetes.io/part-of: backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: etcd-snapshot-garage
    creationPolicy: Owner
  data:
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: etcd-access-key-id}
    - secretKey: GARAGE_SECRET_ACCESS_KEY
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: etcd-secret-access-key}
