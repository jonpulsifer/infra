apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
spec:
  gatewayClassName: cilium
  listeners:
    - name: http-gateway
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - agents-sandbox
        kinds:
          - kind: HTTPRoute
    # oauth2-proxy's host is in the App zone (SPINDRIFT_DOMAIN), and its route
    # lives in its own namespace, so this listener names both.
    - name: oauth2-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "oauth2.${SPINDRIFT_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: oauth2-proxy
        kinds:
          - kind: HTTPRoute
    # Prowler authenticates its own users. A listener with no `allowedRoutes`
    # admits only `default`, so this one names prowler's namespace.
    - name: prowler-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "prowler.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: prowler
        kinds:
          - kind: HTTPRoute
    - name: bittorrent-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "bittorrent.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: sonarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "sonarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: radarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "radarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: prowlarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "prowlarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: bazarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "bazarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
