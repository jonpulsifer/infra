apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
spec:
  gatewayClassName: cilium
  listeners:
    - name: http-gateway
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - agents-sandbox
                  - oauth2-proxy
                  - spindrift-apps
        kinds:
          - kind: HTTPRoute
    - name: dave-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "dave.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: agents-sandbox
        kinds:
          - kind: HTTPRoute
    - name: bittorrent-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "bittorrent.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: sonarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "sonarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: radarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "radarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: prowlarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "prowlarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    - name: bazarr-tls
      protocol: HTTPS
      port: 443
      hostname: &hostname "bazarr.${SECRET_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: *hostname
    # One wildcard for every App name Spindrift mints, rather than a listener
    # per App: the App chart renders a route and nothing else, so there is no
    # release that could own a listener or a certificate. cert-manager's
    # gateway-shim issues it by DNS-01 from the annotation at the top of this
    # Gateway. A wildcard binds exactly one label, which is why App names are
    # flat — `plainboi-web` is covered, `web.plainboi` is not.
    - name: spindrift-apps-tls
      protocol: HTTPS
      port: 443
      hostname: "*.${SPINDRIFT_DOMAIN}"
      tls:
        certificateRefs:
          - kind: Secret
            name: wildcard-${SPINDRIFT_DOMAIN}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: spindrift-apps
        kinds:
          - kind: HTTPRoute
