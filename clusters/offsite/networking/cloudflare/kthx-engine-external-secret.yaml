---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kthx-engine-cloudflared
  namespace: cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kthx-engine-cloudflared
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kthx engine cloudflared
        property: password
