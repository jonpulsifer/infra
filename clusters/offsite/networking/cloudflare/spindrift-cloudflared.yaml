---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spindrift-cloudflared
  namespace: cloudflare
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spindrift-cloudflared
      app.kubernetes.io/part-of: spindrift
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spindrift-cloudflared
        app.kubernetes.io/part-of: spindrift
      annotations:
        secret.reloader.stakater.com/reload: spindrift-cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token
          env:
            - name: TUNNEL_TRANSPORT_PROTOCOL
              value: http2
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              subPath: token
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tunnel-token
          secret:
            secretName: spindrift-cloudflared
        - name: tmp
          emptyDir: {}
