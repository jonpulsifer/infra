---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  labels:
    source.toolkit.fluxcd.io/kind: OCIRepository
spec:
  interval: 24h
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    timeout: 10m
    remediation:
      retries: 5
  values:
    upgradeCompatibility: "1.17"
    autoDirectNodeRoutes: true
    devices: eno+ enp+ tailscale0
    kubeProxyReplacement: true
    k8sServiceHost: ${API_SERVER_IP}
    k8sServicePort: ${API_SERVER_PORT}
    routingMode: native
    ipv4NativeRoutingCIDR: ${CILIUM_NATIVE_ROUTING_CIDR}
    enableIPv4Masquerade: true
    bpf:
      masquerade: true
    ipam:
      mode: multi-pool
    enableXTSocketFallback: false
    endpointRoutes:
      enabled: false
    bgpControlPlane:
      enabled: true
    gatewayAPI:
      enabled: true
    envoy:
      enabled: true
      useOriginalSourceAddress: false
    ingressController:
      enabled: true
      default: true
    l7Proxy: true
    loadBalancer:
      l7:
        backend: envoy
    nodePort:
      enabled: true
    k8sNetworkPolicy:
      enabled: true
    # Nested: a dotted key is one literal the chart never reads.
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          labels:
            release: prom-stack
    dashboards:
      enabled: true
    prometheus:
      enabled: true
      # The chart also keys the cilium-agent metrics Service off this.
      serviceMonitor:
        enabled: true
        # The chart defaults to 10s; nothing else is scraped faster than 30s.
        interval: 30s
        labels:
          release: prom-stack
        metricRelabelings:
          # Same trim as folly: these families are ~45% of each agent's series
          # and appear on no dashboard.
          - action: drop
            sourceLabels: [__name__]
            regex: cilium_(hive_|k8s_client_|k8s_workqueue_|agent_api_process_time_).*
      dashboards:
        enabled: true
    hubble:
      enabled: true
      tls:
        auto:
          method: cronJob
      relay:
        enabled: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            labels:
              release: prom-stack
      metrics:
        # Drops, DNS, TCP and L7 per node, which the shipped hubble dashboards read.
        serviceMonitor:
          enabled: true
          interval: 30s
          labels:
            release: prom-stack
        dashboards:
          enabled: true
        enableOpenMetrics: true
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true
      ui:
        enabled: false
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: ${CERT_CLUSTER_ISSUER}
            hajimari.io/enable: "true"
            hajimari.io/icon: "network"
          hosts:
            - &host hubble.${SECRET_DOMAIN}
          tls:
            - hosts:
                - *host
              secretName: *host
