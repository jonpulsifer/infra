apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: default
spec:
  ipv4:
    cidrs:
      - ${CILIUM_POD_CIDR}
    maskSize: 24
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: nest
spec:
  blocks:
    - cidr: ${LB_RANGE}
  serviceSelector:
    # Matches every Service and Gateway: none carries debug=lol.
    matchExpressions:
      - { key: debug, operator: NotIn, values: [lol] }
