---
# One repository key opens every restic repository, staging and GCS alike.
# The rest-server login reaches this site's staging repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: restic
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef: {key: restic-repository, property: password}
    - secretKey: RESTIC_REST_USERNAME
      remoteRef: {key: restic-rest-server, property: username}
    - secretKey: RESTIC_REST_PASSWORD
      remoteRef: {key: restic-rest-server, property: password}
