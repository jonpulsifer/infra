---
# The restic repository key, the same for every repository, and the staging
# rest-server's login. Both items live in the 1Password vault `homelab`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic
  labels:
    app.kubernetes.io/name: restic
    app.kubernetes.io/part-of: backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: restic
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef: {key: restic-repository, property: password}
    - secretKey: RESTIC_REST_USERNAME
      remoteRef: {key: restic-rest-server, property: username}
    - secretKey: RESTIC_REST_PASSWORD
      remoteRef: {key: restic-rest-server, property: password}
