---
# The `cnpg` key of this site's Garage, in the shape the barman-cloud
# ObjectStore reads. The item lives in the 1Password vault `homelab`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-cnpg
  labels:
    app.kubernetes.io/name: garage-cnpg
    app.kubernetes.io/part-of: backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: garage-cnpg
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY_ID: "{{ .id }}"
        ACCESS_SECRET_KEY: "{{ .secret }}"
        REGION: garage
  data:
    - secretKey: id
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: cnpg-access-key-id}
    - secretKey: secret
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: cnpg-secret-access-key}
