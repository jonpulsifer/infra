---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kthx-apps-external-auth
  namespace: oauth2-proxy
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kthx-apps
    # A built App's routes live in its own `app-<app>` namespace, and a grant
    # names each one: `from` takes no wildcard or selector. One entry per App
    # whose Components use `auth: proxy`.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: app-wishlist
  to:
    # The ExternalAuth filter targets `-authz`. `oauth2-proxy` stays for stored
    # Targets whose `platform.externalAuth` still names the port-80 Service.
    - group: ""
      kind: Service
      name: oauth2-proxy
    - group: ""
      kind: Service
      name: oauth2-proxy-authz
