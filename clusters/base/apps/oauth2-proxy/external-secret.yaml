---
# A GitHub OAuth App has one callback host and each cluster its own apex, so
# each cluster names its own item in `cluster-settings`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: oauth2-proxy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: ${OAUTH2_PROXY_ITEM}
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: ${OAUTH2_PROXY_ITEM}
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: ${OAUTH2_PROXY_ITEM}
        property: cookie-secret
