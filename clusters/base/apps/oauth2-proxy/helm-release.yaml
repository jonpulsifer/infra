---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
spec:
  interval: 1h
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    config:
      existingSecret: oauth2-proxy
      cookieName: __Secure-oauth2_proxy
      emailDomains:
        - "*"
      upstreams:
        - static://200

    extraArgs:
      provider: github
      github-user: jonpulsifer
      # `read:org` is not optional beside `github-user`. Restricting to a user
      # makes the provider enumerate the caller's organizations before it
      # decides, and GitHub refuses that read under `user:email` alone:
      #
      #   403 You need at least read:org scope or user scope to list your
      #   organizations.
      #
      # The proxy turns that refusal into a 500 on `/oauth2/callback`, so the
      # sign-in fails *after* the operator has already approved on github.com —
      # far enough from the cause that the log line is the only thing naming it.
      scope: user:email read:org
      # `reverse-proxy` and `trusted-proxy-ip` are both deliberately absent.
      #
      # No CIDR names the gateway, because the gateway does not have one
      # address. What oauth2-proxy sees is whatever Cilium's datapath left on
      # the connection, and that varies with where the answering replica sits:
      # one host, probing both replicas in the same breath, is seen as its node
      # address by the replica on the other node and as that node's
      # `cilium_host` router address by the replica beside it. Through the
      # gateway the hop is seen as an address in the pod CIDR belonging to no
      # pod at all. Only the first of those is inside `${K8S_NODE_CIDR}`, so
      # naming it made two byte-identical replicas answer one request two ways
      # — one composed an origin out of a client-supplied `X-Forwarded-Host`
      # and logged it as the request's host, the other ignored it.
      #
      # Widening to the pod CIDR would make them agree by putting every pod in
      # the cluster inside the trust boundary: any pod can reach this Service
      # directly, so `X-Forwarded-Host` would become a header anything in the
      # cluster can set. Consistency is not worth that.
      #
      # Trusting nothing loses no behaviour, because nothing on the way in
      # composes `X-Forwarded-Host` or `X-Forwarded-Uri`. Envoy's ext_authz
      # client carries no header a route's `allowedHeaders` has not named,
      # beyond the `Host`, method and path it includes on its own, and
      # `packages/charts/spindrift-app/templates/httproute.yaml` names neither
      # of those two — on the check's way to port 80 and on its way through the
      # shim below alike. `redirect-url` further down is absolute, so
      # `getOAuthRedirectURI` returns it without consulting either.
      #
      # It does change one thing, and the change is in the log rather than the
      # decision. `pkg/validation` installs
      # `logger.SetGetClientFunc(ip.GetClientString(…))` only under
      # `reverse-proxy`, so with the flag gone the client column falls back to
      # the logger's own default of `r.RemoteAddr`: `10.101.1.197:41234` with
      # the ephemeral port on it rather than `10.101.1.197`, and `X-Real-IP` no
      # longer consulted there. It names the same hop either way, and that hop
      # was never the browser.
      #
      # They have to go together. `reverse-proxy: "true"` left on its own is not
      # the cautious half of this: `oauthproxy.go`'s `buildTrustedProxyNetSet`
      # substitutes `0.0.0.0/0, ::/0` when `--trusted-proxy-ip` is empty, so the
      # flag alone trusts every caller rather than none.
      redirect-url: https://oauth2.${SECRET_DOMAIN}/oauth2/callback
      whitelist-domain: .${SECRET_DOMAIN}
      cookie-domain: .${SECRET_DOMAIN}
      cookie-httponly: "true"
      cookie-secure: "true"
      cookie-samesite: lax
      set-xauthrequest: "true"
      skip-provider-button: "true"
      ping-path: ""
      ready-path: ""

    # The ext_authz shim, and the whole reason it exists.
    #
    # oauth2-proxy needs an absolute origin to send the browser back to after
    # sign-in. Behind the ExternalAuth filter it is shown the App's `Host` but
    # no origin it will use: `pkg/app/redirect/getters.go` reaches
    # `getXForwardedHeadersRedirect` only when `req.Host != GetRequestHost(req)`,
    # and with nothing setting `X-Forwarded-Host` those are the same string by
    # construction. It falls through to `getURIRedirect` and answers with a bare
    # path, which the callback host then resolves against *itself*.
    #
    # Gateway API's ExternalAuth filter has no field that injects a header into
    # its check request — `allowedHeaders` permits, it does not create — so the
    # origin is composed one hop later instead. nginx listens on 4181, builds
    # `X-Auth-Request-Redirect` out of the `Host` Envoy's ext_authz client
    # already forwards, and proxies to oauth2-proxy on 4180.
    # `getXAuthRequestRedirect` is consulted ahead of the `X-Forwarded-*` pair
    # and carries no trusted-proxy gate, so it answers on every request rather
    # than on the subset that arrives from a trusted address.
    #
    # `proxy_set_header` replaces, so a browser cannot smuggle its own
    # `X-Auth-Request-Redirect` through this hop. The filter not listing that
    # header in `allowedHeaders` is the other half of the same guard;
    # `packages/charts/spindrift-app/tests/render.test.ts` pins both.
    #
    # `?rd=` is covered by neither. `getRdQuerystringRedirect` runs first, reads
    # the query string of the request as it arrives, and is gated only by
    # `whitelist-domain` — so a caller can still pick any host in this zone as
    # its own post-sign-in destination.
    #
    # Only the check path goes through the shim. oauth2-proxy's own endpoints
    # stay on port 80: `getXAuthRequestRedirect` does not strip the proxy
    # prefix, so an origin injected in front of `/oauth2/start` points the proxy
    # at itself.
    extraContainers:
      - name: authz-shim
        image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:d9083fe47768377ef55dedafd67d4da7c2f2bc2bece7554954f29359deb0dce9
        command: [nginx, -c, /etc/nginx/shim/nginx.conf, -g, "daemon off;"]
        ports:
          - name: authz
            containerPort: 4181
            protocol: TCP
        volumeMounts:
          - name: authz-shim
            mountPath: /etc/nginx/shim
            readOnly: true
          - name: authz-tmp
            mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi

    extraVolumes:
      - name: authz-shim
        configMap:
          name: oauth2-proxy-authz
      # nginx writes a pid file and creates its temp paths at startup, and the
      # root filesystem is read-only, so both are pointed here.
      - name: authz-tmp
        emptyDir: {}

    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: oauth2-proxy-authz
        data:
          # nginx's `$var` passes through Flux's postBuild substitution
          # untouched — only `${var}` is a substitution token. The nginx config
          # in `clusters/folly/apps/dump` renders `$uri` through the same
          # mechanism and arrives intact.
          nginx.conf: |
            worker_processes 1;
            pid /tmp/nginx.pid;
            error_log stderr warn;
            events {}
            http {
              # oauth2-proxy logs every check with the App's host on it; a
              # second copy of the same line here says nothing new.
              access_log off;
              client_body_temp_path /tmp/client_body;
              proxy_temp_path /tmp/proxy;
              fastcgi_temp_path /tmp/fastcgi;
              uwsgi_temp_path /tmp/uwsgi;
              scgi_temp_path /tmp/scgi;
              server {
                listen 4181;
                location / {
                  proxy_pass http://127.0.0.1:4180;
                  # Preserved so the proxy's own log still names the App the
                  # check was for; the default sends 127.0.0.1:4180 instead.
                  proxy_set_header Host $http_host;
                  # The scheme is literal rather than $http_x_forwarded_proto.
                  # Envoy sets that from the listener that accepted the request
                  # and the tunnel reaches this gateway over plain HTTP, so a
                  # browser on https would be handed back an http origin — one
                  # the Secure session cookie is never sent to.
                  proxy_set_header X-Auth-Request-Redirect https://$http_host$request_uri;
                }
              }
            }
      # The filter's backendRef. `service.portNumber` is a single port, so the
      # shim's is its own Service over the same pods.
      - apiVersion: v1
        kind: Service
        metadata:
          name: oauth2-proxy-authz
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/name: oauth2-proxy
            app.kubernetes.io/instance: oauth2-proxy
          ports:
            - name: authz
              port: 4181
              targetPort: authz
              protocol: TCP
              appProtocol: http

    replicaCount: 2
    enableServiceLinks: false

    podAnnotations:
      secret.reloader.stakater.com/reload: oauth2-proxy
      configmap.reloader.stakater.com/reload: oauth2-proxy-authz

    serviceAccount:
      enabled: true
      automountServiceAccountToken: false

    livenessProbe:
      enabled: false

    readinessProbe:
      enabled: false

    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      maxUnavailable: null

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: oauth2-proxy
                  app.kubernetes.io/name: oauth2-proxy

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: oauth2-proxy
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 5
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe
                value:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
