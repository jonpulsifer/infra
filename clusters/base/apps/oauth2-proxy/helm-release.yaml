---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
spec:
  interval: 1h
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    config:
      existingSecret: oauth2-proxy
      cookieName: __Secure-oauth2_proxy
      emailDomains:
        - "*"
      upstreams:
        - static://200

    extraArgs:
      provider: github
      github-user: jonpulsifer
      # `github-user` makes the provider list the caller's orgs, which GitHub
      # refuses without `read:org`; the callback then answers 500.
      scope: user:email read:org
      # No `reverse-proxy`: alone it trusts X-Forwarded-* from every caller, and
      # the gateway hop has no stable source IP, and the pod CIDR would trust every pod.
      redirect-url: https://oauth2.${SECRET_DOMAIN}/oauth2/callback
      # Also the only gate on `?rd=`, so a caller may return to any host in the zone.
      whitelist-domain: .${SECRET_DOMAIN}
      cookie-domain: .${SECRET_DOMAIN}
      cookie-httponly: "true"
      cookie-secure: "true"
      cookie-samesite: lax
      set-xauthrequest: "true"
      skip-provider-button: "true"
      ping-path: ""
      ready-path: ""

    # ExternalAuth cannot add a header to its check, so this nginx sets
    # X-Auth-Request-Redirect from Host; without it sign-in returns to oauth2.*.
    extraContainers:
      - name: authz-shim
        image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:6a23acdfca2b9cfbcec61419e3f1426bcbedb91362f2f19306a8567423bb4612
        command: [nginx, -c, /etc/nginx/shim/nginx.conf, -g, "daemon off;"]
        ports:
          - name: authz
            containerPort: 4181
            protocol: TCP
        volumeMounts:
          - name: authz-shim
            mountPath: /etc/nginx/shim
            readOnly: true
          - name: authz-tmp
            mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi

    extraVolumes:
      - name: authz-shim
        configMap:
          name: oauth2-proxy-authz
      # nginx's pid file and temp paths; the root filesystem is read-only.
      - name: authz-tmp
        emptyDir: {}

    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: oauth2-proxy-authz
        data:
          # Flux substitutes only the braced form, so nginx's `$var` arrives intact.
          # proxy_set_header replaces, so a browser cannot supply its own redirect.
          nginx.conf: |
            worker_processes 1;
            pid /tmp/nginx.pid;
            error_log stderr warn;
            events {}
            http {
              # oauth2-proxy logs every check with the App's host on it; a
              # second copy of the same line here says nothing new.
              access_log off;
              client_body_temp_path /tmp/client_body;
              proxy_temp_path /tmp/proxy;
              fastcgi_temp_path /tmp/fastcgi;
              uwsgi_temp_path /tmp/uwsgi;
              scgi_temp_path /tmp/scgi;
              server {
                listen 4181;
                location / {
                  proxy_pass http://127.0.0.1:4180;
                  # Preserved so the proxy's own log still names the App the
                  # check was for; the default sends 127.0.0.1:4180 instead.
                  proxy_set_header Host $http_host;
                  # The scheme is literal rather than $http_x_forwarded_proto.
                  # Envoy sets that from the listener that accepted the request
                  # and the tunnel reaches this gateway over plain HTTP, so a
                  # browser on https would be handed back an http origin — one
                  # the Secure session cookie is never sent to.
                  proxy_set_header X-Auth-Request-Redirect https://$http_host$request_uri;
                }
              }
            }
      # The filter's backendRef; `service.portNumber` is one port. Only checks
      # come here: the injected origin on /oauth2/start would point at the proxy.
      - apiVersion: v1
        kind: Service
        metadata:
          name: oauth2-proxy-authz
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/name: oauth2-proxy
            app.kubernetes.io/instance: oauth2-proxy
          ports:
            - name: authz
              port: 4181
              targetPort: authz
              protocol: TCP
              appProtocol: http

    replicaCount: 2
    enableServiceLinks: false

    podAnnotations:
      secret.reloader.stakater.com/reload: oauth2-proxy
      configmap.reloader.stakater.com/reload: oauth2-proxy-authz

    serviceAccount:
      enabled: true
      automountServiceAccountToken: false

    livenessProbe:
      enabled: false

    readinessProbe:
      enabled: false

    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      maxUnavailable: null

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: oauth2-proxy
                  app.kubernetes.io/name: oauth2-proxy

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: oauth2-proxy
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 5
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe
                value:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
