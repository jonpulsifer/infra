---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infra
  namespace: arc
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    force: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    runnerScaleSetName: infra-${CLUSTER_NAME}
    scaleSetLabels:
      - "${CLUSTER_NAME}"
      - "self-hosted"
    githubConfigUrl: https://github.com/jonpulsifer/infra
    githubConfigSecret: arc
    minRunners: 1
    # A workflow's `services:` and `container:` need a Docker daemon the runner
    # can reach. dind puts one in the runner's own pod, so a published port
    # lands on the pod's network namespace and the job's localhost:PORT
    # resolves to it — the reason a node-level socket cannot serve this.
    # The chart injects the sidecar, wires DOCKER_HOST, and adds the work and
    # dind-sock volumes; the runner container below is merged into that.
    containerMode:
      type: dind
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/jonpulsifer/actions-runner:latest@sha256:0cb04ee25d02e9d58f93f18581dabf18eb38d10cd70c8f6d6e72611baa10a1a3
            command: ["/home/runner/run.sh"]

