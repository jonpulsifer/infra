---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infra
  namespace: arc
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    force: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    runnerScaleSetName: infra-${CLUSTER_NAME}
    scaleSetLabels:
      - "${CLUSTER_NAME}"
      - "self-hosted"
    githubConfigUrl: https://github.com/jonpulsifer/infra
    githubConfigSecret: arc
    minRunners: 1
    # dind runs dockerd in the runner's pod, so a job's `services:` ports answer
    # on localhost. The chart adds the sidecar and merges the `runner` container
    # below into its own.
    containerMode:
      type: dind
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/jonpulsifer/actions-runner:latest@sha256:b3cc1a00c825698e60d9bc2abc2443ea3f2c2c7354271c6ff7228b50d442c815
            command: ["/home/runner/run.sh"]

