apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iperf3
  namespace: iperf3
  labels:
    app.kubernetes.io/name: iperf3
    app.kubernetes.io/part-of: netbench
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iperf3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iperf3
        app.kubernetes.io/part-of: netbench
    spec:
      # Each node serves at <node-ip>:5201, so tests cross the real wire, the
      # VLAN router and the site tunnel, not the Cilium overlay.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iperf3
          image: ghcr.io/jonpulsifer/netbench:latest@sha256:79d4836e58d2effa8e0fc173a4ba9abffae5eae0427873212232efdca093ebf7
          imagePullPolicy: IfNotPresent
          command: ["iperf3", "--server", "--port", "5201"]
          env:
            # iperf3 creates a short-lived stream buffer with mkstemp(3).
            - name: TMPDIR
              value: /tmp
          ports:
            - name: iperf3-tcp
              containerPort: 5201
              protocol: TCP
            - name: iperf3-udp
              containerPort: 5201
              protocol: UDP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
