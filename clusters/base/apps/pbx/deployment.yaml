---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbx
  namespace: pbx
  annotations:
    # The trunk passwords are read once, when render-config builds pjsip.conf
    # at pod start, so a password changed in 1Password reaches the Secret
    # within the ExternalSecret's refresh and then sits unused until something
    # restarts the pod. This rolls it when the Secret changes, whether or not
    # a call is up. The ConfigMaps
    # need no entry: their generated names carry a content hash, so a config
    # change is already a new Deployment spec. The key names the kind:
    # Reloader has no untyped `reloader.stakater.com/reload` and ignores it.
    secret.reloader.stakater.com/reload: pbx-secrets
spec:
  # One. Two Asterisks would both register the same voip.ms sub-account and the
  # carrier would deliver each inbound call to whichever registered last.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pbx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pbx
    spec:
      hostUsers: false
      # The Services here are named pbx-sip and pbx-metrics, so Kubernetes'
      # legacy service links inject PBX_SIP_* and PBX_METRICS_* into every
      # container — the same prefix render.sh collects to build its envsubst
      # list. Nothing reads them, and no config names one today, but a variable
      # this deployment does not control landing in that list is one rename
      # away from substituting something unexpected.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Renders the templates into the config directory the main container
        # reads. Same image, because the tool doing the rendering ships in it.
        - name: render-config
          image: ghcr.io/jonpulsifer/asterisk:22.8.2-6866cdd5
          command: ["/bin/bash", "/templates/base/render.sh"]
          envFrom:
            - secretRef:
                name: pbx-secrets
            # Optional because only folly generates it — offsite has no handset
            # and so no non-secret site values to inject.
            - configMapRef:
                name: pbx-env
                optional: true
          volumeMounts:
            - name: base-templates
              mountPath: /templates/base
              readOnly: true
            - name: site-templates
              mountPath: /templates/site
              readOnly: true
            - name: config
              mountPath: /etc/asterisk
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      containers:
        - name: asterisk
          image: ghcr.io/jonpulsifer/asterisk:22.8.2-6866cdd5
          ports:
            - {name: sip-udp, containerPort: 5060, protocol: UDP}
            - {name: sip-tcp, containerPort: 5060, protocol: TCP}
            - {name: http-metrics, containerPort: 8088, protocol: TCP}
          volumeMounts:
            - name: config
              mountPath: /etc/asterisk
              readOnly: true
            - {name: run, mountPath: /var/run/asterisk}
            - {name: log, mountPath: /var/log/asterisk}
            - {name: spool, mountPath: /var/spool/asterisk}
            - {name: cache, mountPath: /var/cache/asterisk}
            - {name: db, mountPath: /var/lib/asterisk-db}
          # /metrics answering is a weaker claim than "calls work", but it is
          # the only one a probe can make without placing one. Registration
          # state is an alert on the scraped metrics, not a probe.
          startupProbe:
            httpGet: {path: /metrics, port: http-metrics}
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /metrics, port: http-metrics}
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      # Asterisk hangs up every call on SIGTERM and exits within 15 s, so a roll
      # cuts a call in progress; the runbook says to merge only when no call is
      # up. The grace period is headroom for a shutdown that hangs, not a drain.
      terminationGracePeriodSeconds: 300
      volumes:
        - name: base-templates
          configMap: {name: pbx-config, defaultMode: 0444}
        - name: site-templates
          configMap: {name: pbx-site, defaultMode: 0444}
        - {name: config, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: log, emptyDir: {}}
        - {name: spool, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: db, emptyDir: {}}
