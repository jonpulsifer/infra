---
# Ingress only. Egress is declared in each site's own network-policy.yaml,
# because what a PBX is allowed to talk to is the one thing genuinely different
# between them: each site's carriers, agents and handsets are its own.
#
# Naming any ingress rule makes ingress default-deny for this endpoint, which
# is why the probe path is spelled out: `host` is the kubelet on this node
# making the liveness request, and without it the container is killed every
# thirty seconds by a probe the policy just dropped.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pbx-ingress
  namespace: pbx
  labels:
    app.kubernetes.io/name: pbx
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pbx
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - {port: "8088", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - {port: "8088", protocol: TCP}
    # Media from the carriers, on the range rtp.conf pins Asterisk to.
    #
    # Without this, return audio is admitted only as the reply half of a flow
    # the pod opened first — so a leg where the far end speaks first gets
    # nothing until Asterisk happens to send. A carrier that latches its media
    # to our first packet then waits forever, and an agent that greets the
    # caller before they speak is silent. `world` is every address outside the
    # cluster, private ones included. A site's gateway NAT keeps the internet
    # out, but each site routes its pod addresses over BGP, so a host on the
    # LAN or across the site-to-site link can reach these ports too. SRTP on
    # the trunks drops what such a host sends, and offsite denies the private
    # ranges on top.
    - fromEntities: [world]
      toPorts:
        - ports:
            - {port: "10000", endPort: 20000, protocol: UDP}
