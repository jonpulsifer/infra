; Asterisk's HTTP server exists in this deployment for exactly one reason:
; res_prometheus mounts /metrics on it. It binds every interface because the
; scrape arrives from a Prometheus pod on another node; the NetworkPolicy
; beside this config is what keeps everything else out.
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
; No TLS. The listener never leaves the cluster network, and a cert here would
; be one more thing to rotate for a scrape that already crosses only Cilium.
tlsenable = no
