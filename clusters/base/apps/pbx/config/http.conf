; Asterisk's HTTP server carries res_prometheus's /metrics on both sites and,
; on folly, ARI for the Switchboard board (clusters/folly/apps/pbx/config/
; ari.conf). It binds every interface because the scrape arrives from a
; Prometheus pod on another node; the NetworkPolicies name who else may
; connect.
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
; No TLS. The listener never leaves the cluster network, and a cert here would
; be one more thing to rotate for a scrape that already crosses only Cilium.
tlsenable = no
