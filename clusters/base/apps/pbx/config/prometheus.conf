; Channel, endpoint and bridge gauges on /metrics, which is the whole reason a
; PBX beats a handset registered straight to the carrier: registration state
; and call counts become numbers something can alert on.
[general]
enabled = yes
uri = metrics
; No auth. The scrape is in-cluster and the NetworkPolicy already names who may
; make it; basic-auth credentials would have to live somewhere to be checked.
auth_username =
core_metrics_enabled = yes
