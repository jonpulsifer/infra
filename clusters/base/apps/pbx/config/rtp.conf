; The media port range, pinned to the one the NetworkPolicies admit.
;
; Without this file Asterisk uses its compiled-in default of 5000-31000 and
; picks each call's port at random from it, while the policies open
; 10000-20000. Every call is then a lottery: a port outside the window drops
; the handset's audio at the pod, Asterisk has nothing to forward to the
; carrier, the carrier never sees a packet to latch onto, and the call connects
; and is silent in both directions. `rtp show settings` in the running pod is
; how that was found.
;
; If this range changes, the RTP rules in both clusters' network-policy.yaml
; and the base ingress policy have to move with it.
[general]
rtpstart = 10000
rtpend = 20000
