; Autoload, then refuse the subsystems this PBX has no use for. The explicit
; alternative is a preload list forty lines long for res_pjsip alone, and a
; missing line there is a module that silently is not there.
[modules]
autoload = yes

; Call detail records go to Prometheus and the pod log, not to a file, a
; database, or a RADIUS server nobody runs.
noload = cdr_csv.so
noload = cdr_custom.so
noload = cdr_manager.so
noload = cdr_syslog.so
noload = cel_custom.so
noload = cel_manager.so

; No SIP capture agent to ship to. res_hep is worth turning on the day a call
; needs packet-level forensics; until then it is an open socket.
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so

; Nothing dials into a conference, a queue, or voicemail here.
noload = app_meetme.so
noload = app_voicemail.so

; A shell and a second dial tone. Nothing here needs either, and each is a way
; for a mistake in the dialplan to hand a caller the host or a trunk.
noload = app_disa.so
noload = app_system.so
noload = func_shell.so
