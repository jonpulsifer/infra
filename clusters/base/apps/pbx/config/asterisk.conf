; Both sites run the same binary from the same image, so only the writable
; directories are redirected. The read-only ones — modules, sounds, and the XML
; documentation Asterisk refuses to boot without — are compiled in at their FHS
; paths and satisfied by the image, so naming them here would only be a second
; place to be wrong.
[directories]
astetcdir => /etc/asterisk
; astdbdir is the one that bites: it defaults to astvarlibdir, which is left at
; its read-only store path so the sound files stay shared. Asterisk opens
; astdb.sqlite3 read-write before it loads a single module, so without this it
; exits with "ASTdb initialization failed" and never reaches the dialplan.
astdbdir => /var/lib/asterisk-db
astlogdir => /var/log/asterisk
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astcachedir => /var/cache/asterisk

[options]
; The pod's securityContext decides who this runs as. Asterisk dropping
; privileges itself would need a passwd entry the image does not carry.
verbose = 3
debug = 0
; stdout is the log transport — Vector reads pod logs, so a file here would be
; a log nobody ever sees.
nofork = yes
dumpcore = no
; A handset that reboots mid-call leaves a channel with nobody on it.
hangup_extra_channels = yes
; Plain text on stdout. With colour on, every level is wrapped in ANSI escapes
; — ERROR arrives as \x1b[1;31mERROR\x1b[0m — and VictoriaLogs indexes the
; escape sequence as part of the word, so a query for ERROR matches nothing
; while the log is full of them. A dashboard panel reading "no errors" over a
; failing PBX is worse than no panel.
nocolor = yes
