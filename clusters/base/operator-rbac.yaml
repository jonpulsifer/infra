# The operator's own identity on every cluster. No token Secret:
# dotfiles/.local/bin/kube-jit-token mints a short-lived one over ssh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: cluster-access
---
# The ClusterRole, not `system:masters`: deleting this revokes access without a
# CA rotation, and the audit log names a distinct subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator
  labels:
    app.kubernetes.io/part-of: cluster-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: operator
    namespace: kube-system
