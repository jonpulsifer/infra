---
# local-path volumes on each node's data volume, for both clusters.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/base/platform/local-path-provisioner
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # Holds NODE_DATA_ROOT, the hostPath of the data volume.
    - name: config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
