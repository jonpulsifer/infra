---
# The encrypted push of Garage's buckets to GCS and the `backup-push` Secret it
# reads. The schedule and Garage endpoint come from cluster-settings, the
# bucket, audience and 1Password item from the topology.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/base/platform/backups
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # Serves the ClusterSecretStore the ExternalSecret reads.
    - name: onepassword-connect
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
