---
# Its own Kustomization: a ClusterSecretStore cannot dry-run in the apply that
# installs its CRD. The store's audience names the cluster, from the topology.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gcp-secret-manager
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/base/platform/gcp-secret-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: external-secrets-operator
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-topology
