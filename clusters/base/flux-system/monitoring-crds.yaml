---
# The Prometheus Operator CRDs, ahead of every Kustomization that carries a
# monitoring.coreos.com object.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-crds
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/base/monitoring-crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
