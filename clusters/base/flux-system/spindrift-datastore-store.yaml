---
# Its own Kustomization: a ClusterSecretStore cannot dry-run in the apply that
# installs its CRD.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spindrift-datastore-store
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/base/platform/spindrift-datastore-store
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: external-secrets-operator
