---
# Both clusters install Velero against their own Garage. The endpoint and
# timezone come from cluster-settings, the 1Password item from the topology.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/base/platform/velero
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    # Serves the ClusterSecretStore the ExternalSecrets read.
    - name: onepassword-connect
    # Holds KUBELET_ROOT, so the node agent never renders an old path.
    - name: config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: ConfigMap
        name: cluster-topology
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: velero
      namespace: velero
