---
# The barman-cloud plugin, which CloudNativePG databases use to back up to
# Garage. The Certificates it carries need cert-manager's CRDs, and the
# operator discovers the plugin's Service in its own namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/base/platform/barman-cloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: cloudnative-pg
    # cert-manager and its CRDs.
    - name: cert-manager
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: barman-cloud
      namespace: cloudnative-pg
