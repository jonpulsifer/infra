---
# The push's GCP identity. terraform/gcp/projects/homelab-ng federates
# `<cluster>:system:serviceaccount:backups:restic-push` to the cluster's
# `backups-<cluster>` account, so the name matters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restic-push
  labels:
    app.kubernetes.io/name: restic-push
    app.kubernetes.io/part-of: backups
automountServiceAccountToken: false
