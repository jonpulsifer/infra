---
# Copies this site's Garage buckets to its GCS bucket, encrypted. Garage holds
# the backups and this is the off-site copy: rclone's crypt remote encrypts
# names and contents on the way out, and cryptcheck compares the result with
# the source. BACKUP_PUSH_SCHEDULE in each cluster's cluster-settings sets the
# day: folly's Starlink uplink pushes once a week.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-push
  labels:
    app.kubernetes.io/name: backup-push
    app.kubernetes.io/part-of: backups
    lolwtf.ca/backup: "true"
spec:
  schedule: "${BACKUP_PUSH_SCHEDULE}"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # A missed run is skipped; the next one copies everything it missed.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # A week to read a failed run, the gap between folly's pushes.
      ttlSecondsAfterFinished: 604800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-push
            app.kubernetes.io/part-of: backups
        spec:
          # OnFailure deletes the retried pod when `backoffLimit` is spent, so no
          # log survives. Never keeps each failed attempt.
          restartPolicy: Never
          serviceAccountName: backup-push
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: push
              image: docker.io/rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              # sync mirrors each bucket, so a deletion at the source reaches
              # GCS and the bucket's object versioning keeps the old copy.
              command:
                - sh
                - -c
                - |
                  set -eu
                  RCLONE_CONFIG_CRYPT_PASSWORD=$(printf %s "$CRYPT_PASSWORD" | rclone obscure -)
                  RCLONE_CONFIG_CRYPT_PASSWORD2=$(printf %s "$CRYPT_SALT" | rclone obscure -)
                  export RCLONE_CONFIG_CRYPT_PASSWORD RCLONE_CONFIG_CRYPT_PASSWORD2
                  for bucket in velero cnpg etcd; do
                    # A wiped or rebuilt Garage holds empty buckets; mirroring
                    # one would delete the off-site copy.
                    if [ -z "$(rclone lsf --max-depth 1 "garage:$bucket" | head -n 1)" ] &&
                      [ -n "$(rclone lsf --max-depth 1 "crypt:$bucket" | head -n 1)" ]; then
                      echo "garage:$bucket is empty and its GCS copy is not; refusing to sync" >&2
                      exit 1
                    fi
                    rclone sync "garage:$bucket" "crypt:$bucket" --stats 1m --stats-one-line --stats-log-level NOTICE
                    rclone cryptcheck "garage:$bucket" "crypt:$bucket"
                  done
              env:
                # Bucket and account: terraform/gcp/projects/homelab-ng.
                - name: GOOGLE_PROJECT_ID
                  value: homelab-ng
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/run/secrets/gcp/gcp-credentials.json
                - name: RCLONE_CONFIG_GARAGE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_GARAGE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_GARAGE_ENDPOINT
                  value: ${GARAGE_S3_ENDPOINT}
                - name: RCLONE_CONFIG_GARAGE_REGION
                  value: garage
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-push
                      key: GARAGE_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-push
                      key: GARAGE_SECRET_ACCESS_KEY
                - name: RCLONE_CONFIG_GCS_TYPE
                  value: google cloud storage
                - name: RCLONE_CONFIG_GCS_ENV_AUTH
                  value: "true"
                - name: RCLONE_CONFIG_GCS_BUCKET_POLICY_ONLY
                  value: "true"
                - name: RCLONE_CONFIG_CRYPT_TYPE
                  value: crypt
                - name: RCLONE_CONFIG_CRYPT_REMOTE
                  value: gcs:homelab-ng-backups-${CLUSTER_NAME}/garage
                - name: CRYPT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-push
                      key: CRYPT_PASSWORD
                - name: CRYPT_SALT
                  valueFrom:
                    secretKeyRef:
                      name: backup-push
                      key: CRYPT_SALT
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: gcp-federation
                  mountPath: /var/run/secrets/gcp
                  readOnly: true
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}
            - name: gcp-federation
              projected:
                sources:
                  - serviceAccountToken:
                      audience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/${CLUSTER_NAME}
                      expirationSeconds: 3600
                      path: gcp-token
                  - configMap:
                      name: backup-push-gcp
