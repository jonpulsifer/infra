---
# The push's read-only Garage key and the crypt remote's password and salt,
# from the 1Password vault `homelab`. The Garage key is the `push` key of the
# item `garage-<cluster>`, which can read every bucket and write none.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-push
  labels:
    app.kubernetes.io/name: backup-push
    app.kubernetes.io/part-of: backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: backup-push
    creationPolicy: Owner
  data:
    - secretKey: GARAGE_ACCESS_KEY_ID
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: push-access-key-id}
    - secretKey: GARAGE_SECRET_ACCESS_KEY
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: push-secret-access-key}
    - secretKey: CRYPT_PASSWORD
      remoteRef: {key: backup-crypt, property: rclone-password}
    - secretKey: CRYPT_SALT
      remoteRef: {key: backup-crypt, property: rclone-salt}
