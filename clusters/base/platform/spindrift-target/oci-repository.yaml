---
# The App chart every Target's HelmReleases reference; spindrift-charts.yml pushes it.
# No `secretRef`: GHCR makes a new package private, and until it is made public
# by hand this reports OCIArtifactPullFailed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: spindrift-app
  # Beside the HelmReleases that reference it.
  namespace: spindrift-apps
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.5.0
  url: oci://ghcr.io/jonpulsifer/charts/spindrift-app
