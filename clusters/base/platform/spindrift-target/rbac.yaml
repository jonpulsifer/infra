---
# Two reads, not one. The standing checklist asks about the namespace, the
# store, and this identity's own permissions on a Target that is already
# configured; connecting a *new* cluster asks the same API what there is to
# choose from before any of those facts exist. Both are this role, because both
# are the same federated identity reading the same cluster — and neither writes.
#
# Everything below is list-only and names no Secret. A cluster whose operator
# does not want to be enumerated simply does not bind this role: the probe
# degrades to empty lists, and every field it would have filled is one an
# operator types instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spindrift-target-discovery
rules:
  # `list` for the connect screen's namespace pickers; the checklist's `get` on
  # spindrift-apps is subsumed by it. Naming only that one namespace would make
  # the screen unable to offer any other, which is the whole of what an operator
  # connecting a second cluster is choosing.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
  - apiGroups:
      - external-secrets.io
    resources:
      - clustersecretstores
    verbs:
      - get
      - list
  # Which sources the App chart could be fetched from. Both kinds, because the
  # connect screen offers the kind this installation's `charts.app` reference
  # names and an installation can be reconfigured between them without anyone
  # revisiting a Role. The checklist's `get` on one named object stays a Role
  # below: reading the object it actually needs is the narrower grant.
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
      - ocirepositories
    verbs:
      - list
  # Which Gateways exist and what address each answers on — the input to
  # `platform.gateway` and to `platform.dns.privateAddress`, which is why an
  # operator is not asked to type an address the cluster already knows.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - list
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
    verbs:
      - create
---
# A ClusterRole, because an App's workloads are in a namespace named for the
# App and there is no longer one namespace to bind in.
#
# **This is a real widening and it is stated rather than left to be noticed.**
# Every rule below now applies in every namespace of the cluster, not in
# `spindrift-apps` alone. Two things make it tolerable, and both are load-
# bearing rather than reassurance:
#
#   - **There is still no `secrets` rule**, and that matters more here, not
#     less. The whole credential design has the kubelet resolve a `secretKeyRef`
#     on the App's behalf and ESO mirror what crosses a namespace; Spindrift
#     never reads a Secret, which is what makes a cluster-wide binding something
#     other than "read every credential in the cluster".
#   - **The datastore rules did not come with it.** They stay a namespaced Role
#     in `spindrift-datastores` below, because Datastores no longer land in App
#     namespaces. Splitting the two is a smaller total grant than moving all of
#     it up would have been.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spindrift-target-delivery
rules:
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # An App's namespace, created with its first release and carrying the
  # admission labels copied off `spindrift-apps`.
  #
  # `create` cannot be scoped by name — RBAC matches `resourceNames` literally
  # and an App's name is typed at runtime — so this is the one grant here that
  # could not have been narrower whatever shape was chosen. `patch` beside it
  # because the write is a server-side apply, which converges an existing
  # namespace rather than failing on it. No `delete`: nothing removes an App
  # namespace, deliberately, since deleting one would take every workload in it
  # including whatever an operator put there by hand.
  #
  # `get` is what the admission labels are read through, on the Target's
  # declared namespace.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - events
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  # A job's runs. The App chart renders every job as a CronJob, so the CronJob
  # is what a run is created from — its own `jobTemplate`, read here — and the
  # Jobs are the runs themselves, listed to answer "did last night's run work".
  #
  # `create` on jobs and nothing more: Spindrift starts a run and never edits or
  # deletes one. The CronJob owns what this creates and prunes it under its own
  # history limits, which is why no `delete` is needed for the history to stay
  # bounded.
  #
  # `list` without `get`, because both reads are by label selector — the adapter
  # never knows an object's name in advance, since the chart names the workload
  # and Spindrift names the release.
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
---
# `CHART_SOURCE`, for the artifact form. The App chart's `OCIRepository` is
# `spindrift-apps`'s own object (`oci-repository.yaml`), so reading it stays a
# namespaced grant naming that one object rather than riding up into the
# cluster-wide Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spindrift-target-chart-artifact
  namespace: spindrift-apps
rules:
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - ocirepositories
    resourceNames:
      - spindrift-app
    verbs:
      - get
---
# Datastores, in the namespace they are provisioned into and nowhere else.
#
# Kept a `Role` while delivery became a `ClusterRole`, because a Datastore no
# longer lands in an App's namespace: there is exactly one namespace these
# verbs are needed in, so granting them cluster-wide would buy nothing and cost
# `create` and `delete` on every database object in the cluster.
#
# Both operators are reached the way the delivery path reaches Flux: a
# server-side apply and a poll. `create` beside `patch` for the same reason the
# HelmRelease rule pairs them — an apply is a PATCH, and an apply that has to
# create the object is authorized as a create too. `get` is the observe poll;
# `delete` is destroy. No `list`, no `watch`: every read here is by the name
# core already stored on the row.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spindrift-target-datastores
  namespace: spindrift-datastores
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - create
      - delete
      - get
      - patch
  - apiGroups:
      - valkey.io
    resources:
      - valkeyclusters
    verbs:
      - create
      - delete
      - get
      - patch
  # The Valkey operator fronts a cluster with a Service named `valkey-<name>` —
  # its `resourcePrefix`, a convention rather than an API field — so the address
  # is confirmed against the cluster before a Datastore is reported LIVE rather
  # than asserted.
  #
  # No `secrets` rule, deliberately, and this Role still names no Secret:
  # CloudNativePG's `<cluster>-app` is read by ESO on the App's behalf, or by
  # the kubelet through a `secretKeyRef` where the two namespaces coincide —
  # never by Spindrift. RBAC matches resourceNames literally, so a Secret grant
  # here could not have been narrower than "every Secret in this namespace",
  # which is exactly what that design exists to avoid needing.
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
  # A stuck Datastore's diagnosis: the admission refusal underneath an operator
  # that reports it is still working. Read-only, and no wider than the namespace
  # the datastores are in.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
---
# `CHART_SOURCE`, for the repository form — a Target whose installation names
# `charts.app` as a path rather than as an artifact reads the source object here
# instead. Kept beside the artifact grant above because either kind can be the
# one an installation is configured with, and a Target that has been read under
# both is a Target that can be reconfigured back without an RBAC change.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spindrift-target-chart-source
  namespace: flux-system
rules:
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    resourceNames:
      - infra
    verbs:
      - get
