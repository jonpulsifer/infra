---
# Reads the `bluenose` project's Secret Manager, one store per cluster. No
# credential: the service account beside this federates through `fml-pool`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: bluenose
      auth:
        workloadIdentityFederation:
          audience: //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/${CLUSTER_NAME}
          serviceAccountRef:
            name: gcp-secret-manager
            namespace: external-secrets
            # The token's own `aud`, which Google checks against the provider; the
            # API server's default audience is refused.
            audiences:
              - //iam.googleapis.com/projects/629296473058/locations/global/workloadIdentityPools/fml-pool/providers/${CLUSTER_NAME}
