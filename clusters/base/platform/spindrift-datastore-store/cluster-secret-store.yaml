---
# Mirrors a Datastore Secret from `spindrift-datastores` into an App's namespace,
# which `secretKeyRef` cannot cross. Rotations follow without a Deploy.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: spindrift-datastores
spec:
  provider:
    kubernetes:
      remoteNamespace: spindrift-datastores
      server:
        # The default, bare `kubernetes.default`, is not a SAN on these API servers.
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: spindrift-datastore-store
          namespace: external-secrets
