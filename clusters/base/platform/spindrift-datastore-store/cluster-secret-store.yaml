---
# The read path from `spindrift-datastores` into an App's own namespace.
#
# A Datastore lives in a namespace of its own, because it outlives every App
# attached to it — and a `secretKeyRef` cannot cross a namespace. This store is
# what closes that gap: the App chart renders an `ExternalSecret` naming the
# operator-generated Secret, and external-secrets mirrors it into the App's
# namespace and keeps it mirrored.
#
# **This does not make Spindrift hold a copy.** §11's "never a copy — the
# operator owns that secret's rotation" is about who owns the value, and the
# owner is still CloudNativePG. external-secrets reconciles the mirror
# continuously, so a rotation reaches the next pod without a Deploy, which is
# the property the same-namespace `secretKeyRef` had and this had to preserve.
#
# **Same cluster, so no `server.url`.** The provider defaults to the in-cluster
# API server, which is the right one: this store crosses a namespace boundary,
# never a cluster one. A Datastore on another cluster is another Target and is
# reached through that Target's own federation.
#
# CloudNativePG is the only engine that reaches this path. The Valkey operator
# as this platform runs it authenticates nobody, so a cache Datastore hands out
# an address and has no credential to mirror at all.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: spindrift-datastores
spec:
  provider:
    kubernetes:
      remoteNamespace: spindrift-datastores
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: spindrift-datastore-store
          namespace: external-secrets
