---
# The identity the store beside this file reads datastore credentials as.
#
# Its own, rather than the external-secrets operator's, for the reason
# `gcp-secret-manager` gives: this name is half of a RoleBinding, and the
# operator's service account is named by the upstream chart, which is free to
# rename it in a version bump and would silently take the binding's subject
# with it.
#
# It mounts nowhere and no pod runs as it. external-secrets mints a token for it
# through the TokenRequest API when the store needs one, which is why it needs
# no secret of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spindrift-datastore-store
  namespace: external-secrets
