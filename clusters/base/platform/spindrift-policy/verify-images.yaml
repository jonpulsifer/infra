---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: spindrift-verify-images
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/description: >-
      Admit Spindrift workloads only when every digest-pinned image has a
      signature from the trusted-builds signer.
spec:
  background: true
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-trusted-build-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - spindrift-apps
              selector:
                matchExpressions:
                  - key: spindrift.dev/deploy
                    operator: Exists
      verifyImages:
        - imageReferences:
            - "*"
          failureAction: Enforce
          mutateDigest: false
          required: true
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA73ui5ytn67hfYn4/Rizf
