---
# The AWS-format credentials file for this site's Garage, built from the
# `velero` key in the item `garage-<cluster>` of the 1Password vault `homelab`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3
  labels:
    app.kubernetes.io/name: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: velero-s3
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .id }}
          aws_secret_access_key={{ .secret }}
  data:
    - secretKey: id
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: velero-access-key-id}
    - secretKey: secret
      remoteRef: {key: "garage-${CLUSTER_NAME}", property: velero-secret-access-key}
---
# The kopia repository password. Velero reads this Secret by its fixed name
# and key, and a lost password makes every file-system backup unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  labels:
    app.kubernetes.io/name: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
  data:
    - secretKey: repository-password
      remoteRef: {key: backup-crypt, property: velero-repository-password}
