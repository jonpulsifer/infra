---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox-crds
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./k8s/crds
  prune: false
  sourceRef:
    kind: GitRepository
    name: agent-sandbox
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox-controller
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: agent-sandbox
  dependsOn:
    - name: agent-sandbox-crds
  patches:
    - target:
        kind: Namespace
        name: agent-sandbox-system
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: agent-sandbox-system
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/enforce-version: latest
    - target:
        kind: Deployment
        name: agent-sandbox-controller
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/image
          # renovate: datasource=docker
          value: registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.3
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: "--extensions"
