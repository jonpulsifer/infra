---
# The intervals, history and upgrade policy are set here because the apps
# overlays' HelmRelease patches do not reach clusters/base/platform.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cloudnative-pg
spec:
  interval: 5m0s
  maxHistory: 2
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.28.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      interval: 10m0s
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
