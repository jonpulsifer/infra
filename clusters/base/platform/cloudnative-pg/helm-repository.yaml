---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  # The kustomization sets the same namespace. Renovate ignores the
  # kustomization and pairs this source with the HelmRelease by the namespace
  # written here, so without it Renovate never bumps the chart.
  namespace: cloudnative-pg
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
