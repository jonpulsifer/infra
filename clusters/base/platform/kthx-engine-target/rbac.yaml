---
# Read-only discovery for the readiness checklist and for connecting a cluster.
# Left unbound, the probe returns empty lists and the operator types each field.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kthx-engine-target-discovery
rules:
  # `list` lets the connect screen offer any namespace, not only kthx-apps.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
  - apiGroups:
      - external-secrets.io
    resources:
      - clustersecretstores
    verbs:
      - get
      - list
  # Both kinds, since an installation's `charts.app` may name either.
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
      - ocirepositories
    verbs:
      - list
  # Feeds `platform.gateway` and `platform.dns.privateAddress`.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - list
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
    verbs:
      - create
---
# Cluster-wide because each App has its own namespace. It grants no `secrets`,
# and the datastore rules stay a namespaced Role below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kthx-engine-target-delivery
rules:
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # RBAC cannot scope these verbs to runtime App names, so `sweepApp` deletes
  # only namespaces whose `app.kubernetes.io/managed-by` label is `kthx-engine` or `spindrift`.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - delete
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - events
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  # Runs start from a CronJob's `jobTemplate`, and the CronJob prunes its Jobs.
  # Reads go by label selector, so `list` without `get`.
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
---
# `CHART_SOURCE` for the OCI form, scoped to its one object.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kthx-engine-target-chart-artifact
  namespace: kthx-apps
rules:
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - ocirepositories
    resourceNames:
      - kthx-app
    verbs:
      - get
---
# DNSEndpoints for vanity names of Targets with no cluster, such as Vercel.
# Bound only where an installation runs, so other Targets carry no binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kthx-engine-target-dns
  namespace: kthx-apps
rules:
  - apiGroups:
      - externaldns.k8s.io
    resources:
      - dnsendpoints
    verbs:
      - create
      - delete
      - get
      - patch
---
# Datastores live only in `spindrift-datastores`. An apply that creates needs
# `create` beside `patch`; reads use stored names, so no `list` or `watch`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kthx-engine-target-datastores
  namespace: spindrift-datastores
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
      - scheduledbackups
    verbs:
      - create
      - delete
      - get
      - patch
  # Finds the one store in backup/ that a Postgres Datastore archives to. The
  # engine never writes it.
  - apiGroups:
      - barmancloud.cnpg.io
    resources:
      - objectstores
    verbs:
      - list
  - apiGroups:
      - valkey.io
    resources:
      - valkeyclusters
    verbs:
      - create
      - delete
      - get
      - patch
  # Confirms the Valkey operator's `valkey-<name>` Service before reporting LIVE.
  # No `secrets`: ESO or the kubelet reads `<cluster>-app` for the App.
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
  # Shows the admission refusal under an operator that still reports progress.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
  # Per-Datastore allow rules. This can also touch the Flux-owned floor in
  # networkpolicy.yaml, which Flux restores on its next reconcile.
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - patch
---
# `CHART_SOURCE` for the repository form, when `charts.app` names a path.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kthx-engine-target-chart-source
  namespace: flux-system
rules:
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    resourceNames:
      - infra
    verbs:
      - get
