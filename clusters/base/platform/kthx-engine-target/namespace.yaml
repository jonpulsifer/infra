# Each per-App namespace copies its `pod-security.kubernetes.io/*` labels from
# `kthx-apps`, so an edit here reaches every App.
---
apiVersion: v1
kind: Namespace
metadata:
  name: spindrift-datastores
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: kthx
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kthx-apps
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: kthx
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
