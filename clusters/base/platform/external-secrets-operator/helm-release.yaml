---
# ESO CRDs and controller. Each ClusterSecretStore has its own Kustomization so
# its dry-run runs after these CRDs exist.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: external-secrets
      version: 2.11.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 5m0s
  values:
    installCRDs: true
