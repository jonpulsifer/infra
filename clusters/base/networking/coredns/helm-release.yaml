---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: kube-system
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: coredns
      version: 1.46.2
      sourceRef:
        kind: HelmRepository
        name: coredns
        namespace: flux-system
      interval: 5m0s
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    replicaCount: 1
    k8sAppLabelOverride: kube-dns
    service:
      clusterIP: "${CLUSTER_DNS}"
    servers:
      - zones:
          - zone: .
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
              ttl 30
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . ${ROUTER_IP}
          - name: cache
            parameters: "30"
          - name: loop
          - name: reload
          - name: loadbalance
    prometheus:
      service:
        enabled: true
