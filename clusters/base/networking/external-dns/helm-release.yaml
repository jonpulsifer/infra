---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: cilium
      namespace: kube-system
  values:
    interval: 5m
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloud-credentials
            key: api-token
    extraArgs:
      # App v0.22.0 moved the default prefix with no fallback. Switch it only once
      # every live object carries `external-dns.kubernetes.io/` keys.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
    policy: sync
    sources:
      - crd
      - ingress
      - gateway-httproute
    txtPrefix: "k8s."
    txtOwnerId: "${CLUSTER_NAME}"
    # An App zone in `dns.zones` that is missing here deploys green and
    # resolves nowhere.
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${GATEWAY_ZONE}"
      - "${SPINDRIFT_DOMAIN}"
      - embarrassing.ca
      - wishin.app
      - clankerbanker.ca
    resources:
      requests:
        memory: 100Mi
        cpu: 25m
      limits:
        memory: 250Mi
