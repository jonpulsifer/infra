---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: cilium
      namespace: kube-system
  values:
    interval: 5m
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloud-credentials
            key: api-token
    extraArgs:
      # Pinned, not defaulted. The prefix every proxied record's
      # `cloudflare-proxied` key is written under is `DefaultAnnotationPrefix`,
      # and external-dns v0.22.0 changed that default from
      # `external-dns.alpha.kubernetes.io/` to `external-dns.kubernetes.io/`
      # with no fallback for the old spelling. Spindrift writes the alpha form
      # in `apps/spindrift/src/adapters/dns/cluster.ts` and
      # `packages/charts/spindrift-app/templates/dnsendpoint.yaml`, so a chart
      # bump past app v0.21.0 would stop the flag being read at all and fall
      # back to `proxiedByDefault` — every record silently unproxied, which for
      # an apex CNAME in front of Cloudflare Pages means no zone cache, no WAF,
      # and the origin exposed. Stating it here makes the bump a no-op instead.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
      # - --cloudflare-proxied
      # - --annotation-filter=external-dns/is-public in (true)
    policy: sync
    sources:
      - crd
      - ingress
      - gateway-httproute
      # - gateway-tcproute
      # - gateway-udproute
    txtPrefix: "k8s."
    txtOwnerId: "${CLUSTER_NAME}"
    # Every zone this cluster may publish into. The trailing entries are also the
    # zones Spindrift mints App names in, so a zone added to `dns.zones` in the
    # installation manifest that is missing here is an App that deploys green
    # and resolves nowhere.
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${GATEWAY_ZONE}"
      - "${SPINDRIFT_DOMAIN}"
      - embarrassing.ca
      - wishin.app
      - clankerbanker.ca
    resources:
      requests:
        memory: 100Mi
        cpu: 25m
      limits:
        memory: 250Mi
