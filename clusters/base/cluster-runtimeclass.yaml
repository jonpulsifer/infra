---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# Each kata pod is a QEMU microVM, so the node pays for a guest kernel and a
# qemu process on top of the containers themselves. podFixed keeps the
# scheduler honest about that; without it a node packs kata pods as if they
# were free and goes to memory pressure. The numbers are a starting estimate
# for an idle sandbox — tune them against what the nodes actually report.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    cpu: 250m
    memory: 192Mi
