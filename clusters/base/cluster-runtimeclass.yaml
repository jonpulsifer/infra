---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# Each kata pod is a microVM, so the node pays for a guest kernel and a VMM
# process on top of the containers themselves. podFixed keeps the scheduler
# honest about that; without it a node packs kata pods as if they were free and
# goes to memory pressure. Both numbers are starting estimates for an idle
# sandbox — tune them against what the nodes actually report.
#
# kata runs QEMU; kata-clh runs Cloud Hypervisor. Same kata stack, same KVM,
# same guest image — a different VMM process around it. Both handlers are
# registered on every node by nix/services/k8s/kata.nix.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    cpu: 250m
    memory: 192Mi
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh
handler: kata-clh
overhead:
  podFixed:
    cpu: 250m
    memory: 128Mi
