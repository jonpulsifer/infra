---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# podFixed charges each microVM's guest kernel and VMM, which run outside the
# pod cgroup. nix/services/k8s/kata.nix registers both handlers on every node.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    cpu: 250m
    # An estimate: no workload runs under the QEMU handler.
    memory: 192Mi
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh
handler: kata-clh
overhead:
  podFixed:
    cpu: 250m
    # A sandbox takes about 1 GiB of node memory against 600-720 MiB in its cgroup.
    memory: 384Mi
