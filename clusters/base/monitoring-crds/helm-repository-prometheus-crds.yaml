---
# A second repository for the same URL: `monitoring` owns `prometheus` and
# depends on this Kustomization, so sharing it deadlocks a fresh cluster.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-crds
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
