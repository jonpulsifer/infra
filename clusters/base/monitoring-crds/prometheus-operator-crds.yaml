---
# Outside `monitoring`, whose dry-run fails on its own ServiceMonitor until
# these CRDs exist.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  # The CRDs are cluster-scoped, and `monitoring` creates its namespace later.
  namespace: flux-system
spec:
  interval: 1h0m0s
  maxHistory: 2
  chart:
    spec:
      chart: prometheus-operator-crds
      # Same operator (v0.94.0) as kube-prometheus-stack 91.x, whose operator on
      # offsite reads these CRDs; bump the two together.
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-crds
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 5
  upgrade:
    # Replaces CRDs in place, so a new field lands without deleting live resources.
    crds: CreateReplace
    remediation:
      retries: 5
