---
# Dashboards for both clusters' Grafana. The name differs from folly's
# `dashboards` so the two generators cannot collide in the monitoring namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: dashboards-base
    files:
      - bosun.json
      - flux.json
      - mate.json
      - spindrift.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
  - path: dashboards.yaml
    target:
      kind: ConfigMap
      name: dashboards-base
      version: v1
