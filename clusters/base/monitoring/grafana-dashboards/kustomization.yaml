---
# Shared dashboards shipped to every cluster's Grafana via the
# kube-prometheus-stack dashboard sidecar, which discovers ConfigMaps labeled
# grafana_dashboard: "1". Add dashboards here rather than per-site so both
# clusters present the same panel set without external fetches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: spindrift-dashboard
    files:
      - spindrift.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled