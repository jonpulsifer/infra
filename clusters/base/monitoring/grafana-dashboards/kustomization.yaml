---
# Dashboards both clusters' Grafana carries. Each cluster's sidecar picks up
# any ConfigMap labelled grafana_dashboard, so this ships to folly and offsite
# alike; folly's own dashboards ConfigMap keeps its folly-only ones. The name
# differs from folly's "dashboards" so the two generators cannot collide in
# the monitoring namespace. A dashboard here reads whatever its cluster's
# Prometheus holds, so one for a service that only runs on one of them is
# empty on the other rather than wrong.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: dashboards-base
    files:
      - bosun.json
      - flux.json
      - mate.json
      - spindrift.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
  - path: dashboards.yaml
    target:
      kind: ConfigMap
      name: dashboards-base
      version: v1
