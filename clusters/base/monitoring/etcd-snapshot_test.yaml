---
# promtool tests for etcd-snapshot-rules.yaml, run by `mise run k8s:check-rules`.
# rule_files names the rendered PrometheusRule; kustomization.yaml omits this file.
rule_files:
  - etcd-snapshot.yaml

evaluation_interval: 1m

tests:
  # The labelled CronJob reports: quiet.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="backups",cronjob="etcd-snapshot",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x90
    alert_rule_test:
      - eval_time: 61m
        alertname: EtcdSnapshotMissing
        exp_alerts: []

  # No CronJob at all: pending for the hour, then firing.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 59m
        alertname: EtcdSnapshotMissing
        exp_alerts: []
      - eval_time: 61m
        alertname: EtcdSnapshotMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: backups
              cronjob: etcd-snapshot
              label_lolwtf_ca_backup: "true"
            exp_annotations:
              message: "No etcd snapshot CronJob is reporting on this cluster"
              description: "kube-state-metrics exports no labelled backups/etcd-snapshot, so nothing snapshots etcd and BackupJobStale sees no CronJob. The CronJob is gone or has lost the lolwtf.ca/backup label, the etcd-snapshot Kustomization is failing, or kube-state-metrics runs without the metricLabelsAllowlist. `kubectl -n backups get cronjob etcd-snapshot --show-labels` and `flux get kustomization etcd-snapshot` tell them apart."
