---
# `monitoring` (8888) is the collector's own telemetry; `prom-metrics` (8889)
# is the OTLP metrics workloads send it. Both name ports in opentelemetry-collector.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opentelemetry-collector
  namespace: monitoring
  labels:
    release: prom-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  endpoints:
    - port: monitoring
      path: /metrics
      interval: 30s
    - port: prom-metrics
      path: /metrics
      interval: 30s