---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
  namespace: monitoring
spec:
  values:
    grafana:
      grafana.ini:
        auth.proxy:
          enabled: true
          header_name: X-WEBAUTH-USER
          header_property: username
          auto_sign_up: true
          whitelist: 127.0.0.1
          headers: Role:X-WEBAUTH-ROLE
          sync_ttl: 0
          enable_login_token: false
      extraContainers:
        - name: mate-query
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          command: [nginx, -c, /etc/nginx/mate/nginx.conf, -g, "daemon off;"]
          ports:
            - name: mate-query
              containerPort: 8081
          volumeMounts:
            - name: mate-query-config
              mountPath: /etc/nginx/mate
              readOnly: true
            - name: mate-query-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      extraContainerVolumes:
        - name: mate-query-config
          configMap:
            name: grafana-mate
        - name: mate-query-tmp
          emptyDir: {}
