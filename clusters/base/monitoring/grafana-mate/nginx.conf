worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Match the original URI so encoded paths, traversal and query arguments
  # cannot turn an allowed query into another Grafana API operation.
  map "$request_method:$request_uri" $mate_query {
    default 0;
    ~^GET:/api/user$ 1;
    ~^GET:/api/datasources$ 1;
    ~^POST:/api/ds/query$ 1;
  }
  server {
    listen 8081;
    client_max_body_size 1m;
    location / {
      if ($mate_query = 0) { return 403; }
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host localhost;
      # Pass no caller identity, cookie, organization or alternate auth header.
      proxy_pass_request_headers off;
      proxy_set_header Content-Type application/json;
      proxy_set_header X-WEBAUTH-USER mate-investigator;
      proxy_set_header X-WEBAUTH-ROLE Viewer;
      proxy_hide_header Set-Cookie;
      proxy_read_timeout 60s;
    }
  }
}
