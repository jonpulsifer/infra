---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: vector
      version: 0.58.0
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    role: Agent
    tolerations:
      - key: unschedulable
        operator: Equal
        effect: NoSchedule
        value: "true"
    podMonitor:
      enabled: true
      additionalLabels:
        release: prom-stack
    image:
      repository: docker.io/timberio/vector
      tag: 0.58.0-debian
    # Talos sends its service and kernel logs to loopback, and a host process
    # cannot reach a pod address, so the agent shares the host network and
    # binds 127.0.0.1 only.
    podHostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    extraVolumes:
      - name: journal
        hostPath:
          path: /var/log/journal
      - name: machine-id
        hostPath:
          path: /etc/machine-id
    extraVolumeMounts:
      - name: journal
        mountPath: /var/log/journal
        readOnly: true
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        # On the host network: never on the LAN.
        address: 127.0.0.1:8686
      sources:
        kubernetes_logs:
          type: kubernetes_logs
        journald:
          type: journald
          journal_directory: /var/log/journal
        # The Talos machine config's machine.logging.destinations and
        # KmsgLogConfig name these two ports. NixOS nodes send nothing here.
        talos_service:
          type: socket
          mode: tcp
          address: 127.0.0.1:6050
          decoding:
            codec: json
        talos_kernel:
          type: socket
          mode: tcp
          address: 127.0.0.1:6051
          decoding:
            codec: json
        internal_metrics:
          type: internal_metrics
      transforms:
        # VictoriaLogs reads the line from `_msg`; both sources write `message`.
        # One transform per source, so each sink labels only its own stream.
        kubernetes_message:
          type: remap
          inputs:
            - kubernetes_logs
          # Redacts secrets the pbx and elevenlabs namespaces log in clear: SRTP
          # keys, SIP digest responses, bearer tokens, the ElevenLabs API key
          # header, JSON password fields and Discord webhook URLs.
          # Keep `$` out of the program: Flux substitution runs over this file.
          source: |
            ._msg = del(.message)
            if (.kubernetes.pod_namespace == "pbx" || .kubernetes.pod_namespace == "elevenlabs") && is_string(._msg) {
              msg = string!(._msg)
              msg = replace(msg, r'inline:\S+', "inline:<redacted>")
              msg = replace(msg, r'(Proxy-)?Authorization:.*', "Authorization: <redacted>")
              msg = replace(msg, r'(?i)Bearer\s+\S+', "Bearer <redacted>")
              msg = replace(msg, r'(?i)xi-api-key:\s*\S+', "xi-api-key: <redacted>")
              msg = replace(msg, r'"password"\s*:\s*"[^"]*"', "\"password\":\"<redacted>\"")
              msg = replace(msg, r'https://discord\.com/api/webhooks/\S+', "https://discord.com/api/webhooks/<redacted>")
              ._msg = msg
            }
        journald_message:
          type: remap
          inputs:
            - journald
          source: |
            ._msg = del(.message)
        # Talos lines carry msg, talos-level, talos-service and talos-time. The
        # node name comes from the DaemonSet, not the line or the peer address.
        talos_service_message:
          type: remap
          inputs:
            - talos_service
          source: |
            ._msg = strip_whitespace(string(del(.msg)) ?? "")
            .host = get_env_var!("VECTOR_SELF_NODE_NAME")
            .service = del(."talos-service")
            .level = del(."talos-level")
            ts, err = parse_timestamp(string(."talos-time") ?? "", "%+")
            if err == null { .timestamp = ts }
            del(."talos-time")
            del(.port)
        talos_kernel_message:
          type: remap
          inputs:
            - talos_kernel
          source: |
            ._msg = strip_whitespace(string(del(.msg)) ?? "")
            .host = get_env_var!("VECTOR_SELF_NODE_NAME")
            .level = del(."talos-level")
            ts, err = parse_timestamp(string(."talos-time") ?? "", "%+")
            if err == null { .timestamp = ts }
            del(."talos-time")
            del(.port)
      sinks:
        # The chart names a container port after the sink, kebab-cased and cut to
        # 15 characters, and the PodMonitor scrapes `prom-exporter`. On the host
        # network it listens on the node's address, as node-exporter does.
        prom_exporter:
          type: prometheus_exporter
          inputs:
            - internal_metrics
          address: 0.0.0.0:9598
        # The loki sink appends /loki/api/v1/push itself; a full path gets a 400.
        victoria_logs_kubernetes:
          type: loki
          inputs:
            - kubernetes_message
          endpoint: http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert
          tenant_id: "1"
          encoding:
            codec: json
          dangerously_allow_unconfined_template_resolution: true
          labels:
            job: "kubernetes"
            cluster: "${CLUSTER_NAME}"
            namespace: "{{`{{ kubernetes.pod_namespace }}`}}"
            pod: "{{`{{ kubernetes.pod_name }}`}}"
            container: "{{`{{ kubernetes.container_name }}`}}"
            node: "{{`{{ kubernetes.pod_node_name }}`}}"
        victoria_logs_journald:
          type: loki
          inputs:
            - journald_message
          endpoint: http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert
          tenant_id: "1"
          encoding:
            codec: json
          dangerously_allow_unconfined_template_resolution: true
          labels:
            job: "systemd-journal"
            cluster: "${CLUSTER_NAME}"
            host: "{{`{{ host }}`}}"
        victoria_logs_talos:
          type: loki
          inputs:
            - talos_service_message
          endpoint: http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert
          tenant_id: "1"
          encoding:
            codec: json
          dangerously_allow_unconfined_template_resolution: true
          labels:
            job: "talos"
            cluster: "${CLUSTER_NAME}"
            host: "{{`{{ host }}`}}"
            service: "{{`{{ service }}`}}"
        victoria_logs_talos_kernel:
          type: loki
          inputs:
            - talos_kernel_message
          endpoint: http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert
          tenant_id: "1"
          encoding:
            codec: json
          dangerously_allow_unconfined_template_resolution: true
          labels:
            job: "talos-kernel"
            cluster: "${CLUSTER_NAME}"
            host: "{{`{{ host }}`}}"
      # Vector's own unit tests for the transforms above. Render the chart's
      # config, then run them:
      # `helm template vector vector --repo https://helm.vector.dev --version 0.58.0 -f <(yq '.spec.values' clusters/base/monitoring/vector.yaml) | yq 'select(.kind == "ConfigMap") | .data["vector.yaml"]' > vector.yaml`
      # `CLUSTER_NAME=test VECTOR_SELF_NODE_NAME=node vector test vector.yaml`
      tests:
        - name: redacts an SRTP inline key in pbx SDP
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: "a=crypto:1 AES_CM_128_HMAC_SHA1_80 inline:AbCdEf0123456789ABCDEFabcdef01234567890123456789ABCD"
              kubernetes.pod_namespace: pbx
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    msg = string!(._msg)
                    assert!(contains(msg, "inline:<redacted>"))
                    assert!(!contains(msg, "AbCdEf0123456789"))

        - name: redacts a SIP digest Authorization header at line start
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: 'Authorization: Digest username="168847",response="deadbeef"'
              kubernetes.pod_namespace: pbx
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(._msg, "Authorization: <redacted>")

        - name: redacts a Proxy-Authorization header
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: 'Proxy-Authorization: Digest response="deadbeef"'
              kubernetes.pod_namespace: pbx
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(._msg, "Authorization: <redacted>")

        - name: redacts a bearer token in an Authorization header, elevenlabs namespace
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: "tronbyt push failed: POST /v0/devices/abc/push_app 401 Authorization: Bearer sk_live_abcdef0123456789"
              kubernetes.pod_namespace: elevenlabs
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    msg = string!(._msg)
                    assert!(!contains(msg, "sk_live_abcdef0123456789"))
                    assert!(contains(msg, "Authorization: <redacted>"))

        - name: redacts a bare, lowercase bearer token with no Authorization prefix
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: 'tronbyt client sent header set: {"authorization": "bearer sk_live_abcdef0123456789"}'
              kubernetes.pod_namespace: elevenlabs
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    msg = string!(._msg)
                    assert!(!contains(msg, "sk_live_abcdef0123456789"))
                    assert!(contains(msg, "Bearer <redacted>"))

        - name: redacts an xi-api-key header regardless of case
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: "curl -H 'Xi-Api-Key: sk_abcdef0123456789' https://api.elevenlabs.io/v1/convai/phone-numbers/xyz"
              kubernetes.pod_namespace: elevenlabs
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    msg = string!(._msg)
                    assert!(!contains(msg, "sk_abcdef0123456789"))
                    assert!(contains(msg, "xi-api-key: <redacted>"))

        - name: redacts a JSON password field in a trunk PATCH body
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: 'PATCH body: {"inbound_trunk_config":{"credentials":{"username":"pbx-folly","password":"hunter2hunter2"}}}'
              kubernetes.pod_namespace: elevenlabs
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    msg = string!(._msg)
                    assert!(!contains(msg, "hunter2hunter2"))
                    assert!(contains(msg, "\"password\":\"<redacted>\""))
                    assert!(contains(msg, "\"username\":\"pbx-folly\""))

        - name: redacts a Discord webhook URL
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: "posting recap to https://discord.com/api/webhooks/123456789012345678/AbCdEf-ghIJKL_mnopqrstuvwxyz0123456789"
              kubernetes.pod_namespace: elevenlabs
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    msg = string!(._msg)
                    assert!(!contains(msg, "AbCdEf-ghIJKL_mnopqrstuvwxyz0123456789"))
                    assert!(contains(msg, "https://discord.com/api/webhooks/<redacted>"))

        - name: leaves other namespaces unredacted
          input:
            insert_at: kubernetes_message
            type: log
            log_fields:
              message: 'Authorization: Bearer sk_live_abcdef0123456789'
              kubernetes.pod_namespace: default
          outputs:
            - extract_from: kubernetes_message
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(._msg, "Authorization: Bearer sk_live_abcdef0123456789")

        - name: journald messages are copied to _msg unchanged
          input:
            insert_at: journald_message
            type: log
            log_fields:
              message: "a plain systemd line"
          outputs:
            - extract_from: journald_message
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(._msg, "a plain systemd line")

        - name: a talos service line gets _msg, host, service, level and its own time
          input:
            insert_at: talos_service_message
            type: log
            log_fields:
              msg: "[talos] apply config request: immediate true, on reboot false"
              talos-level: info
              talos-service: machined
              talos-time: "2021-11-10T10:48:49.294858021Z"
              host: 127.0.0.1
              port: 41234
          outputs:
            - extract_from: talos_service_message
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(._msg, "[talos] apply config request: immediate true, on reboot false")
                    assert_eq!(.host, get_env_var!("VECTOR_SELF_NODE_NAME"))
                    assert_eq!(.service, "machined")
                    assert_eq!(.level, "info")
                    assert_eq!(.timestamp, t'2021-11-10T10:48:49.294858021Z')
                    assert!(!exists(."talos-time"))
                    assert!(!exists(.port))

        - name: a talos kernel line loses its trailing newline
          input:
            insert_at: talos_kernel_message
            type: log
            log_fields:
              msg: "eth0: link up\n"
              talos-level: notice
              talos-time: "2021-11-10T10:48:49.294858021Z"
              facility: kern
              host: 127.0.0.1
          outputs:
            - extract_from: talos_kernel_message
              conditions:
                - type: vrl
                  source: |
                    assert_eq!(._msg, "eth0: link up")
                    assert_eq!(.host, get_env_var!("VECTOR_SELF_NODE_NAME"))
                    assert_eq!(.level, "notice")
                    assert_eq!(.facility, "kern")
