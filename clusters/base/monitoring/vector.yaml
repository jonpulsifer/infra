---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: vector
      version: 0.58.0
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    role: Agent
    tolerations:
      - key: unschedulable
        operator: Equal
        effect: NoSchedule
        value: "true"
    podMonitor:
      enabled: true
    image:
      repository: docker.io/timberio/vector
      tag: 0.58.0-debian
    extraVolumes:
      - name: journal
        hostPath:
          path: /var/log/journal
      - name: machine-id
        hostPath:
          path: /etc/machine-id
    extraVolumeMounts:
      - name: journal
        mountPath: /var/log/journal
        readOnly: true
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686
      sources:
        kubernetes_logs:
          type: kubernetes_logs
        journald:
          type: journald
          journal_directory: /var/log/journal
      transforms:
        # VictoriaLogs reads the log line from `_msg`. Both sources put it in
        # `message`, so without this every entry it stores carries the literal
        # "missing _msg field; see ..." placeholder as its line and the real
        # text is only reachable by naming the `message` field in the query.
        #
        # One per source rather than one shared transform: each sink below
        # labels its own stream, and a single transform feeding both would
        # hand every journald line to the sink that stamps job=kubernetes.
        kubernetes_message:
          type: remap
          inputs:
            - kubernetes_logs
          # The PBX logs every SIP message it sends and receives, decrypted —
          # which is the point, and also means the two secrets SIP carries
          # would be stored here verbatim: the SRTP master key in every SDP's
          # `a=crypto ... inline:` attribute, and the digest response in every
          # `Authorization` header. Storing the keys would undo the media
          # encryption for anyone who can read this store. Both are cut here,
          # before the sink, and the rest of the message — SDP, headers, the
          # nonce a challenge carries — is kept for debugging.
          #
          # Scoped to the pbx namespace, so a regex never touches any other
          # workload's lines. No `$` anywhere in the program: this file is
          # substituted by Flux, and a `$` in a VRL replacement is exactly what
          # its envsubst would eat.
          source: |
            ._msg = del(.message)
            if .kubernetes.pod_namespace == "pbx" && is_string(._msg) {
              ._msg = replace(string!(._msg), r'inline:\S+', "inline:<redacted>")
              ._msg = replace(string!(._msg), r'^(Proxy-)?Authorization:.*', "Authorization: <redacted>")
            }
        journald_message:
          type: remap
          inputs:
            - journald
          source: |
            ._msg = del(.message)
      sinks:
        # The loki sink appends /loki/api/v1/push to endpoint itself, so this
        # stops at /insert. Spelling the full path here posts it twice and
        # VictoriaLogs answers 400 unsupported path.
        victoria_logs_kubernetes:
          type: loki
          inputs:
            - kubernetes_message
          endpoint: http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert
          tenant_id: "1"
          encoding:
            codec: json
          dangerously_allow_unconfined_template_resolution: true
          labels:
            job: "kubernetes"
            cluster: "${CLUSTER_NAME}"
            namespace: "{{`{{ kubernetes.pod_namespace }}`}}"
            pod: "{{`{{ kubernetes.pod_name }}`}}"
            container: "{{`{{ kubernetes.container_name }}`}}"
            node: "{{`{{ kubernetes.pod_node_name }}`}}"
        victoria_logs_journald:
          type: loki
          inputs:
            - journald_message
          endpoint: http://victoria-logs-server.monitoring.svc.cluster.local:9428/insert
          tenant_id: "1"
          encoding:
            codec: json
          dangerously_allow_unconfined_template_resolution: true
          labels:
            job: "systemd-journal"
            cluster: "${CLUSTER_NAME}"
            host: "{{`{{ host }}`}}"
