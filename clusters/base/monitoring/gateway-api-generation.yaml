---
# A wedged Gateway controller leaves every condition True; only generation
# against observedGeneration shows it. Each cluster's kube-prometheus.yaml loads this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-state-metrics-gateway-api
  namespace: monitoring
data:
  # The chart passes this key by name. kube-state-metrics reads it only at
  # startup, so an edit needs a pod restart.
  config.yaml: |
    spec:
      resources:
        - groupVersionKind:
            group: gateway.networking.k8s.io
            version: v1
            kind: Gateway
          labelsFromPath:
            namespace: [metadata, namespace]
            name: [metadata, name]
          metrics:
            - name: gateway_generation
              help: metadata.generation of a Gateway
              each:
                type: Gauge
                gauge:
                  path: [metadata, generation]
            - name: gateway_observed_generation
              help: The Gateway generation its controller last programmed
              each:
                type: Gauge
                gauge:
                  path: [status, conditions, "[type=Programmed]"]
                  valueFrom: [observedGeneration]
        - groupVersionKind:
            group: gateway.networking.k8s.io
            version: v1
            kind: HTTPRoute
          labelsFromPath:
            namespace: [metadata, namespace]
            name: [metadata, name]
          metrics:
            - name: httproute_generation
              help: metadata.generation of an HTTPRoute
              each:
                type: Gauge
                gauge:
                  path: [metadata, generation]
            - name: httproute_observed_generation
              help: The HTTPRoute generation its controller last accepted
              each:
                type: Gauge
                gauge:
                  # One series per parent that has written status. The
                  # `min by` in the rule below collapses them to the
                  # most-behind parent that reported; a parent that never
                  # wrote status at all has no series and is invisible to
                  # both arms. Every route on both clusters is single-parent,
                  # so that gap is latent.
                  path: [status, parents]
                  labelsFromPath:
                    controller: [controllerName]
                  valueFrom: [conditions, "[type=Accepted]", observedGeneration]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gateway-api
  namespace: monitoring
  labels:
    lolwtf.ca/service: gateway-api
    release: prom-stack
spec:
  groups:
    - name: gateway-api
      rules:
        # `unless` catches a route never given status, the subtraction a lagging
        # one. `>` binds tighter than `unless` and `or`. The arms return different
        # values, so annotations must not template `$value`.
        - alert: HTTPRouteNotReconciled
          expr: |
            kube_customresource_httproute_generation
              unless on (namespace, name)
            kube_customresource_httproute_observed_generation
            or
            kube_customresource_httproute_generation
              - on (namespace, name) group_left ()
            min by (namespace, name) (kube_customresource_httproute_observed_generation)
              > 0
          # Cilium programs a healthy route in seconds.
          for: 10m
          labels:
            severity: warning
          annotations:
            message: "HTTPRoute {{ $labels.namespace }}/{{ $labels.name }} has not been reconciled by its controller"
            description: "The route's spec has moved past what any controller wrote back into its status, so Envoy still serves the previous hostnames and backends while the object reports Accepted. Compare `kubectl get httproute -n {{ $labels.namespace }} {{ $labels.name }} -o jsonpath='{.metadata.generation} {.status.parents[*].conditions[*].observedGeneration}'`, then check whether the leader cilium-operator (lease kube-system/cilium-operator-resource-lock) logged `initGatewayAPIController` without an error."

        - alert: GatewayNotReconciled
          expr: |
            kube_customresource_gateway_generation
              unless on (namespace, name)
            kube_customresource_gateway_observed_generation
            or
            kube_customresource_gateway_generation
              - on (namespace, name) group_left ()
            min by (namespace, name) (kube_customresource_gateway_observed_generation)
              > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            message: "Gateway {{ $labels.namespace }}/{{ $labels.name }} has not been reconciled by its controller"
            description: "The Gateway's listeners, addresses or TLS config have moved past what the controller last programmed, while its Programmed condition still reports the older generation as True. Same first check as HTTPRouteNotReconciled: the leader cilium-operator."

        # The deadman for both families, which can vanish separately. `absent()`
        # carries no labels, so the alert cannot name the missing family.
        - alert: GatewayAPIMetricsMissing
          expr: absent(kube_customresource_httproute_generation) or absent(kube_customresource_gateway_generation)
          for: 15m
          labels:
            severity: critical
          annotations:
            message: kube-state-metrics has stopped exporting Gateway API generations
            description: "kube_customresource_httproute_generation or kube_customresource_gateway_generation has had no series for 15 minutes. The reconciliation alert reading whichever is gone is blind until it returns — check the kube-state-metrics pod's logs in monitoring for a custom-resource-state config or RBAC error, then that it still mounts the kube-state-metrics-gateway-api ConfigMap."
