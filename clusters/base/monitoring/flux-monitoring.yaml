---
# `flux_resource_info` is the only per-object reconcile state Prometheus sees.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flux-operator
  namespace: flux-system
  labels:
    release: prom-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  endpoints:
    - port: http
      interval: 60s
      metricRelabelings:
        # Unqueried label bytes on every series.
        - action: labeldrop
          regex: uid|url
---
# Reconcile latency, queue depth and errors, which the operator's snapshot lacks.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  namespace: flux-system
  labels:
    release: prom-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  podMetricsEndpoints:
    - port: http-prom
      interval: 60s
      metricRelabelings:
        # folly's TSDB runs near its retention ceiling, and these answer nothing.
        - action: drop
          sourceLabels: [__name__]
          regex: go_.*|promhttp_.*|process_.*
