---
# The log store both clusters write to. Vector pushes here over the Loki
# protocol, which VictoriaLogs accepts under /insert.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.13.9
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # Without this the chart names everything victoria-logs-victoria-logs-single-*.
    fullnameOverride: victoria-logs
    server:
      # A bare number is months.
      retentionPeriod: 1
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClassName: local-path
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      serviceMonitor:
        enabled: true
