---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: monitoring
spec:
  interval: 1m0s
  maxHistory: 2
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.171.1
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    mode: deployment
    image:
      repository: otel/opentelemetry-collector-contrib
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch:
          send_batch_size: 8192
          timeout: 5s
        resourcedetection:
          detectors: [env, system]
          timeout: 2s
      exporters:
        debug:
          verbosity: basic
        # Traces ship to the local Tempo single-binary. Both clusters run
        # their own Tempo, so the collector never crosses the WAN for traces.
        otlp/tempo:
          endpoint: tempo.monitoring.svc.cluster.local:4317
          tls:
            insecure: true
        # Metrics are exposed for Prometheus to scrape via the
        # opentelemetry-collector ServiceMonitor.
        prometheus:
          endpoint: 0.0.0.0:8889
      service:
        telemetry:
          metrics:
            # Collector 0.156.0 (chart 0.165.0) dropped the flat `address`
            # form in favour of the OpenTelemetry `readers` shape. This is
            # self-telemetry only — the data-pipeline prometheus exporter
            # below (port 8889) is untouched.
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [debug, otlp/tempo]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [debug, prometheus]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [debug]
    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      # Named "monitoring" (not "metrics") to match the port name the
      # opentelemetry-collector-servicemonitor.yaml endpoint selects.
      monitoring:
        enabled: true
        containerPort: 8888
        servicePort: 8888
        protocol: TCP
      prom-metrics:
        enabled: true
        containerPort: 8889
        servicePort: 8889
        protocol: TCP