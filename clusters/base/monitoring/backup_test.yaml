---
# promtool tests for backup-rules.yaml, run by `mise run k8s:check-rules`.
# Timestamps are seconds from the start of each test, so a negative value is in
# the past. A daily schedule is 86400 seconds apart and a weekly one 604800.
rule_files:
  - backup.yaml

evaluation_interval: 1m

tests:
  # Healthy: a daily job that succeeded an hour ago, a weekly push three days
  # old with this week's run in flight, and an unlabelled CronJob far past
  # every window. The push is present, so the deadman is quiet.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="paperless",cronjob="paperless-db-backup",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x90
      - series: 'kube_cronjob_status_last_schedule_time{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: -3900x90
      - series: 'kube_cronjob_status_last_successful_time{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: -3600x90
      - series: 'kube_cronjob_next_schedule_time{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: 82500x90
      - series: 'kube_cronjob_status_active{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: 0x90
      - series: 'kube_cronjob_labels{namespace="backups",cronjob="backup-push",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x90
      - series: 'kube_cronjob_status_last_schedule_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: -3600x90
      - series: 'kube_cronjob_status_last_successful_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: -259200x90
      - series: 'kube_cronjob_next_schedule_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: 601200x90
      - series: 'kube_cronjob_status_active{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: 1x90
      - series: 'kube_cronjob_labels{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: 1x90
      - series: 'kube_cronjob_status_last_schedule_time{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -3600x90
      - series: 'kube_cronjob_status_last_successful_time{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -1000000x90
      - series: 'kube_cronjob_next_schedule_time{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: -10000x90
      - series: 'kube_cronjob_status_active{namespace="mate",cronjob="mate-db-backup",job="kube-state-metrics"}'
        values: 0x90
    promql_expr_test:
      - expr: cronjob:backup_max_age_seconds
        eval_time: 5m
        exp_samples:
          - labels: 'cronjob:backup_max_age_seconds{namespace="paperless",cronjob="paperless-db-backup"}'
            value: 93600
          - labels: 'cronjob:backup_max_age_seconds{namespace="backups",cronjob="backup-push"}'
            value: 691200
    alert_rule_test:
      - eval_time: 90m
        alertname: BackupJobStale
        exp_alerts: []
      - eval_time: 90m
        alertname: BackupJobFailed
        exp_alerts: []
      - eval_time: 90m
        alertname: BackupPushMissing
        exp_alerts: []

  # A daily job whose run an hour ago failed, with its last success 25h50m
  # old: the failure fires after 10 minutes, and the success goes stale at
  # minute 10 and fires 15 minutes later.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="paperless",cronjob="paperless-db-backup",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x40
      - series: 'kube_cronjob_status_last_schedule_time{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: -3600x40
      - series: 'kube_cronjob_status_last_successful_time{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: -93000x40
      - series: 'kube_cronjob_next_schedule_time{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: 82800x40
      - series: 'kube_cronjob_status_active{namespace="paperless",cronjob="paperless-db-backup",job="kube-state-metrics"}'
        values: 0x40
    alert_rule_test:
      - eval_time: 9m
        alertname: BackupJobFailed
        exp_alerts: []
      - eval_time: 11m
        alertname: BackupJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: paperless
              cronjob: paperless-db-backup
            exp_annotations:
              message: "The last run of backup CronJob paperless/paperless-db-backup failed"
              description: "The most recent run ended without succeeding, and no run is active. `kubectl -n paperless get jobs` names the failed Job; its pods' logs carry the error. An unreachable Garage or GCS, a wrong crypt password in the backup-push Secret, or a cryptcheck that found the copy differs from Garage are the usual causes. The alert clears on the next successful run."
      - eval_time: 20m
        alertname: BackupJobStale
        exp_alerts: []
      - eval_time: 30m
        alertname: BackupJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: paperless
              cronjob: paperless-db-backup
            exp_annotations:
              message: "Backup CronJob paperless/paperless-db-backup has no recent success"
              description: "The CronJob's last success is older than its window allows, a day and two hours for a daily job and eight days for folly's weekly push, or it is an hour past a run it never started. The encrypted copy in GCS holds nothing newer than that success. `kubectl -n paperless get cronjob paperless-db-backup` shows whether it is suspended and when it last ran; `kubectl -n paperless get jobs` names a run still active or one that failed, whose pod logs carry rclone's error."

  # The weekly push may be eight days old: a success 7d23h50m ago goes stale
  # at minute 10 while this week's run is still active, so only staleness
  # fires.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="backups",cronjob="backup-push",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x40
      - series: 'kube_cronjob_status_last_schedule_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: -86400x40
      - series: 'kube_cronjob_status_last_successful_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: -690600x40
      - series: 'kube_cronjob_next_schedule_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: 518400x40
      - series: 'kube_cronjob_status_active{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: 1x40
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupJobStale
        exp_alerts: []
      - eval_time: 30m
        alertname: BackupJobFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: BackupJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: backups
              cronjob: backup-push
            exp_annotations:
              message: "Backup CronJob backups/backup-push has no recent success"
              description: "The CronJob's last success is older than its window allows, a day and two hours for a daily job and eight days for folly's weekly push, or it is an hour past a run it never started. The encrypted copy in GCS holds nothing newer than that success. `kubectl -n backups get cronjob backup-push` shows whether it is suspended and when it last ran; `kubectl -n backups get jobs` names a run still active or one that failed, whose pod logs carry rclone's error."

  # A new CronJob that has never succeeded. Its first run failed, so only the
  # failure fires; a second has never fired at all and is two hours past its
  # first schedule, so only staleness fires.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="hass",cronjob="hass-config-backup",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x30
      - series: 'kube_cronjob_status_last_schedule_time{namespace="hass",cronjob="hass-config-backup",job="kube-state-metrics"}'
        values: -600x30
      - series: 'kube_cronjob_next_schedule_time{namespace="hass",cronjob="hass-config-backup",job="kube-state-metrics"}'
        values: 85800x30
      - series: 'kube_cronjob_status_active{namespace="hass",cronjob="hass-config-backup",job="kube-state-metrics"}'
        values: 0x30
      - series: 'kube_cronjob_labels{namespace="hass",cronjob="hass-db-backup",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x30
      - series: 'kube_cronjob_next_schedule_time{namespace="hass",cronjob="hass-db-backup",job="kube-state-metrics"}'
        values: -7200x30
      - series: 'kube_cronjob_status_active{namespace="hass",cronjob="hass-db-backup",job="kube-state-metrics"}'
        values: 0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: hass
              cronjob: hass-config-backup
            exp_annotations:
              message: "The last run of backup CronJob hass/hass-config-backup failed"
              description: "The most recent run ended without succeeding, and no run is active. `kubectl -n hass get jobs` names the failed Job; its pods' logs carry the error. An unreachable Garage or GCS, a wrong crypt password in the backup-push Secret, or a cryptcheck that found the copy differs from Garage are the usual causes. The alert clears on the next successful run."
      - eval_time: 20m
        alertname: BackupJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: hass
              cronjob: hass-db-backup
            exp_annotations:
              message: "Backup CronJob hass/hass-db-backup has no recent success"
              description: "The CronJob's last success is older than its window allows, a day and two hours for a daily job and eight days for folly's weekly push, or it is an hour past a run it never started. The encrypted copy in GCS holds nothing newer than that success. `kubectl -n hass get cronjob hass-db-backup` shows whether it is suspended and when it last ran; `kubectl -n hass get jobs` names a run still active or one that failed, whose pod logs carry rclone's error."

  # A suspended CronJob exports no next schedule, so even a weekly one is held
  # to a day: a success two days old fires.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="backups",cronjob="backup-push",label_lolwtf_ca_backup="true",job="kube-state-metrics"}'
        values: 1x30
      - series: 'kube_cronjob_status_last_schedule_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: -172800x30
      - series: 'kube_cronjob_status_last_successful_time{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: -172000x30
      - series: 'kube_cronjob_status_active{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: 0x30
    promql_expr_test:
      - expr: cronjob:backup_max_age_seconds
        eval_time: 5m
        exp_samples:
          - labels: 'cronjob:backup_max_age_seconds{namespace="backups",cronjob="backup-push"}'
            value: 93600
    alert_rule_test:
      - eval_time: 16m
        alertname: BackupJobFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: BackupJobStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: backups
              cronjob: backup-push
            exp_annotations:
              message: "Backup CronJob backups/backup-push has no recent success"
              description: "The CronJob's last success is older than its window allows, a day and two hours for a daily job and eight days for folly's weekly push, or it is an hour past a run it never started. The encrypted copy in GCS holds nothing newer than that success. `kubectl -n backups get cronjob backup-push` shows whether it is suspended and when it last ran; `kubectl -n backups get jobs` names a run still active or one that failed, whose pod logs carry rclone's error."

  # Host jobs: a daily one 27 hours old fires, and a fresh one is quiet.
  - interval: 1m
    input_series:
      - series: 'lab_backup_last_success_timestamp_seconds{instance="optiplex",source="etcd-backup",job="node-exporter"}'
        values: -97200x30
      - series: 'lab_backup_last_success_timestamp_seconds{instance="retrofit",source="etcd-backup",job="node-exporter"}'
        values: -3600x30
    alert_rule_test:
      - eval_time: 14m
        alertname: HostBackupStale
        exp_alerts: []
      - eval_time: 20m
        alertname: HostBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: optiplex
              source: etcd-backup
            exp_annotations:
              message: "etcd-backup on optiplex last succeeded 1d 3h 20m 0s ago"
              description: "The host job's last success is older than a day and two hours. `systemctl list-timers` on optiplex shows when its timer last fired, and `journalctl -u` on the unit shows why the run failed. An etcd snapshot that keeps failing leaves the control plane's only restore point ageing."

  # Velero: a completed backup 20 hours ago is healthy. A partial failure and
  # a warning at 20m fire after 5 minutes, and the success 40 hours old goes
  # stale at 1h.
  - interval: 1m
    input_series:
      - series: 'velero_backup_failure_total{schedule="daily",job="velero"}'
        values: 0x100
      - series: 'velero_backup_partial_failure_total{schedule="daily",job="velero"}'
        values: 0x20 1x80
      - series: 'velero_backup_warning_total{schedule="daily",job="velero"}'
        values: 0x20 1x80
      - series: 'velero_backup_last_successful_timestamp{schedule="daily",job="velero"}'
        values: -72000x20 -144000x80
    alert_rule_test:
      - eval_time: 15m
        alertname: VeleroBackupFailed
        exp_alerts: []
      - eval_time: 31m
        alertname: VeleroBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              schedule: daily
            exp_annotations:
              message: "A Velero backup of schedule daily failed in the last day"
              description: "A backup of the schedule ended Failed or PartiallyFailed within 26 hours. `kubectl -n velero get backups` names it, and `velero backup logs <name>` or `kubectl -n velero describe backup <name>` carries the errors. An unreachable Garage, a full bucket or a node agent that cannot read a pod volume are the usual causes. The alert clears 26 hours after the last failure."
      - eval_time: 15m
        alertname: VeleroBackupWarnings
        exp_alerts: []
      - eval_time: 31m
        alertname: VeleroBackupWarnings
        exp_alerts:
          - exp_labels:
              severity: warning
              schedule: daily
            exp_annotations:
              message: "A Velero backup of schedule daily completed with warnings in the last day"
              description: "A backup of the schedule completed with warnings within 26 hours. `velero backup describe <name> --details` lists them. A pod volume on a hostPath PV is skipped with a warning and has no copy until it moves to a `local` PV through the Migrate a local-path volume runbook. The alert clears 26 hours after the last warning."
      - eval_time: 15m
        alertname: VeleroBackupStale
        exp_alerts: []
      - eval_time: 90m
        alertname: VeleroBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              schedule: daily
            exp_annotations:
              message: "No Velero backup of schedule daily has completed in a day and a half"
              description: "The `daily` Schedule's last completed backup is older than 36 hours, or Velero exports no such time at all: the Schedule is paused or gone, the controller is down or is not being scraped, or every run since has failed. `kubectl -n velero get schedule,backups` shows which, and `kubectl -n velero get pods` shows whether the server and node agents run."

  # No Velero series at all: the staleness alert fires after its hour.
  - interval: 1m
    input_series:
      - series: 'up{job="somewhere-else"}'
        values: 1x100
    alert_rule_test:
      - eval_time: 59m
        alertname: VeleroBackupStale
        exp_alerts: []
      - eval_time: 61m
        alertname: VeleroBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              schedule: daily
            exp_annotations:
              message: "No Velero backup of schedule daily has completed in a day and a half"
              description: "The `daily` Schedule's last completed backup is older than 36 hours, or Velero exports no such time at all: the Schedule is paused or gone, the controller is down or is not being scraped, or every run since has failed. `kubectl -n velero get schedule,backups` shows which, and `kubectl -n velero get pods` shows whether the server and node agents run."

  # Databases: kthx backed up 20 hours ago and is quiet, tronbyt's newest
  # backup is 40 hours old, and the restore drill's throwaway Cluster reads an
  # empty window (0, which promtool's clock cannot age) and is ignored.
  - interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="kthx",cluster="kthx-db",pod="kthx-db-1"}'
        values: -72000x60
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="tronbyt",cluster="tronbyt-db",pod="tronbyt-db-1"}'
        values: -144000x60
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="restore-drill",cluster="kthx-drill",pod="kthx-drill-1"}'
        values: 0x60
    alert_rule_test:
      - eval_time: 20m
        alertname: CNPGBackupStale
        exp_alerts: []
      - eval_time: 40m
        alertname: CNPGBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: tronbyt
              cluster: tronbyt-db
            exp_annotations:
              message: "Database tronbyt/tronbyt-db has no backup newer than a day and a half"
              description: "The barman-cloud plugin's newest completed backup of the database is older than 36 hours, or the catalog holds none. `kubectl cnpg status tronbyt-db -n tronbyt` lists the backups and the WAL archive, `kubectl get scheduledbackup,backup -n tronbyt` shows the runs that failed, and the ObjectStore's status says whether the plugin can reach Garage."

  # No labelled push CronJob: the deadman fires after an hour.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_labels{namespace="backups",cronjob="backup-push",job="kube-state-metrics"}'
        values: 1x70
    alert_rule_test:
      - eval_time: 59m
        alertname: BackupPushMissing
        exp_alerts: []
      - eval_time: 61m
        alertname: BackupPushMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: backups
              cronjob: backup-push
              label_lolwtf_ca_backup: "true"
            exp_annotations:
              message: "No backup push CronJob is reporting on this cluster"
              description: "kube-state-metrics exports no labelled backups/backup-push, so nothing copies Garage's buckets to GCS and the backup alerts above see no CronJob. The CronJob is gone or has lost the lolwtf.ca/backup label, or kube-state-metrics runs without the metricLabelsAllowlist in this cluster's kube-prometheus.yaml. `kubectl -n backups get cronjob backup-push --show-labels` tells them apart."
