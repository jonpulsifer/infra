---
# An AlertmanagerConfig, not inline `alertmanager.config`: the operator rejects
# discord `webhook_url_file` there and silently keeps its last accepted config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        # An item id, so renaming the 1Password item cannot stop delivery.
        key: aujvxijpz3oi25ccfdynev5sb4
        property: password
---
# The operator makes this the first sub-route with `continue: true`, so the
# always-firing Watchdog and InfoInhibitor must be excluded here.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
  labels:
    alertmanagerConfig: discord
spec:
  route:
    # Matches every namespace only while alertmanagerConfigMatcherStrategy is None.
    receiver: discord
    matchers:
      - name: alertname
        value: Watchdog|InfoInhibitor
        matchType: "!~"
    groupBy: [cluster, namespace, alertname]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord
            key: webhook-url
          sendResolved: true
